<style>
/* Layout: one working screen — header + toolbar on top, canvas map left, detail panel right (stacks below on phones). */
:root {

  --t0: #855900; --t1: #7fa150; --t2: #e359a8; --t3: #a473f7; --t4: #c72b3f; --t5: #058057; --t6: #2566b8; --t7: #9d309d; --t8: #209dc3; --t9: #e56c03; --t10: #7b808a; --seq0: #1c5cab; --seq1: #cde2fb; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --ink: #eef0f4; --ink-2: #b6bcc8; --muted: #858c99;
  --line: #2a303b; --edge: rgba(238,240,244,0.12); --edge-hi: #eef0f4; --accent: #3987e5; --wash: rgba(57,135,229,0.14);
  --t0: #855900; --t1: #7fa150; --t2: #e359a8; --t3: #a473f7; --t4: #c72b3f; --t5: #058057; --t6: #2566b8; --t7: #9d309d; --t8: #209dc3; --t9: #e56c03; --t10: #7b808a; --seq0: #1c5cab; --seq1: #cde2fb; color-scheme: dark; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

.toolbar select { max-width: 175px; }
#fbtn { white-space: nowrap; }

  box-shadow: 0 8px 24px rgba(0,0,0,.08); }
.frow { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.frow select { max-width: 220px; }
.ftitle { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.ftitle span { text-transform: none; letter-spacing: 0; font-weight: 400; }
#dlwrap { position: relative; flex: none; }
#reset { margin-left: auto; }
body.nofilter #reset { display: none; }   /* "Clear filters" only when a filter or search is active */
.dlmenu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; display: flex; flex-direction: column; min-width: 170px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; }
.dlmenu button { all: unset; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); cursor: pointer; }
.dlmenu button:hover, .dlmenu button:focus-visible { background: var(--wash); }
.mapopts { position: absolute; left: 10px; bottom: 32px; z-index: 2; display: flex; flex-direction: column; gap: 4px; }   /* above the note */
@media (max-width: 600px) { .mapopts { bottom: 46px; } }   /* the note wraps to two lines */
.playbtn { padding: 5px 0; width: 32px; text-align: center; font-size: 12px; }
.playbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.playyear { position: absolute; right: 64px; bottom: 26px; font-family: var(--f-display); font-size: 48px; font-weight: 700; text-align: right;
  color: var(--ink); opacity: .22; pointer-events: none; font-variant-numeric: tabular-nums; line-height: 1; }
.playyear small { display: block; font-family: var(--f-body); font-size: 13px; font-weight: 600; margin-top: 6px; }
.mapopts select { font-size: 12px; padding: 1px 4px; margin-left: 4px; border-radius: 6px; }
.cbkey { background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  font-size: 11.5px; color: var(--ink-2); display: grid; gap: 3px; max-width: 230px; }
.cbkey .row { display: flex; align-items: center; gap: 6px; }
.cbkey i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.cbkey .ramp { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--seq0), var(--seq1)); }

.cbkey .keytoggle { border: 0; background: none; color: var(--muted); font: inherit; padding: 0 2px; cursor: pointer; line-height: 1; }
.cbkey .keytoggle:hover, .cbkey .keytoggle:focus-visible { color: var(--ink); }
.cbkey.closed { padding: 3px 9px; }
.mapopts .chk { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12.5px; }
.tablewrap { position: absolute; inset: 44px 0 0 0; overflow: auto; }
.tablebar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 12px; border-bottom: 1px solid var(--line); z-index: 2; background: var(--surface); }
.tcap { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.trendswrap { position: absolute; inset: 0; overflow: auto; padding: 16px 20px; }
.trhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.trhead .dimtoggle { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
.trhead .dimtoggle button { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; }
.trhead .dimtoggle button:not([aria-pressed="true"]):hover { background: var(--wash); color: var(--ink); }
.trhead h3 { margin: 0; font-family: var(--f-display); font-size: 16px; }
.trendswrap .tgrid { stroke: var(--line); stroke-width: 1; }
.trendswrap .tax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.trendswrap .ttot { fill: var(--ink-2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.trendswrap .tseg { cursor: pointer; stroke: var(--surface); stroke-width: 1; }
.trendswrap .tseg:hover { opacity: .8; }
.trendswrap .tseg.partial { opacity: .55; }   /* the current year, not over yet */
.trendswrap .tseg.partial:hover { opacity: .45; }
.trbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.tlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.tleg { display: inline-flex; align-items: center; gap: 6px; }
.tleg i { width: 10px; height: 10px; border-radius: 3px; }
.tleg .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.tnote { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ptable th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; font-size: 12px;
  color: var(--ink-2); border-bottom: 1px solid var(--line); padding: 0; z-index: 1; white-space: nowrap; }
.ptable th button { all: unset; display: block; padding: 9px 10px; cursor: pointer; }
.ptable th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ptable th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 9px; }
.ptable th[aria-sort="descending"] button::after { content: " ▼"; font-size: 9px; }
.ptable td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ptable td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ptable td.tt { min-width: 280px; color: var(--ink); line-height: 1.35; }
.ptable td.sm { color: var(--ink-2); font-size: 12px; }
.ptable td.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 145px; }
@media (max-width: 1360px) { .ptable td.tt { min-width: 200px; } .ptable td.one { max-width: 120px; } .ptable td.tp { min-width: 125px; } .ptable td.mt { min-width: 182px; max-width: 190px; } .ptable td.tt { min-width: 180px; } }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:nth-child(even) { background: color-mix(in srgb, var(--ink) 4%, transparent); }   /* zebra; hover/selection below win */
.ptable td.tp { min-width: 150px; max-width: 170px; line-height: 1.3; }
.ptable td.mt { min-width: 190px; max-width: 215px; line-height: 1.2; }
.mtag { display: inline-block; margin: 1px 4px 2px 0; padding: 0 6px; border: 1px solid var(--line); border-radius: 9px;
  font-size: 11px; line-height: 15px; padding-top: 1px; padding-bottom: 1px; color: var(--ink-2); background: var(--surface); }   /* long names wrap inside the tag */
.ptable tbody tr:hover { background: var(--wash); }
.ptable tbody tr[aria-selected="true"] { background: var(--wash); box-shadow: inset 3px 0 0 var(--accent); }
.ptable tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ptable i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.tagrow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; align-items: baseline; margin-bottom: 4px; }
.tagax { font-size: 12px; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: 12px; color: var(--ink); background: var(--wash); }
.tag.unsure { background: transparent; border-style: dashed; color: var(--ink-2); }
.tagnote { font-size: 12px; margin-top: 4px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.ghost { border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 12px; color: var(--ink); }
.chip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip[aria-pressed="false"] { color: var(--muted); }
.chip[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; position: relative; }
/* the side panel can be collapsed on wide screens: a small tab on the edge between map and panel */
.paneltab { position: absolute; top: 50%; right: 366px; transform: translate(50%, -50%); z-index: 3; width: 20px; height: 46px; padding: 0;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); font-size: 15px; line-height: 1; cursor: pointer; }
.paneltab:hover, .paneltab:focus-visible { color: var(--ink); border-color: var(--ink-2); }
body.nopanel main { grid-template-columns: minmax(0, 1fr) 0; gap: 0; }
body.nopanel aside { display: none; }
body.nopanel .paneltab { right: 0; transform: translate(0, -50%); border-radius: 8px 0 0 8px; border-right: 0; }
.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 420px; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
canvas.hovering { cursor: pointer; }
.stage-note { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none;
  background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 2px 6px; border-radius: 6px; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 2; }
.zoom button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); }
.zoom button svg { width: 16px; height: 16px; }
.zoom button:hover { color: var(--ink); background: var(--wash); }
.dispwrap { position: relative; }
.dispbtn { display: inline-flex !important; align-items: center; gap: 4px; width: auto !important; height: 30px !important; padding: 0 10px !important; font-size: 12.5px; font-weight: 500; color: var(--ink) !important;
  background: var(--surface) !important; border: 1px solid var(--line) !important; border-radius: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.05); white-space: nowrap; }
.dispbtn span { color: var(--muted); font-weight: 400; }
.dispmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; min-width: 230px; display: grid; gap: 10px; padding: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.drow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--ink-2); }
.drow select { font-size: 12.5px; padding: 3px 6px; border-radius: 6px; }
.chkrow { justify-content: flex-start; gap: 7px; cursor: pointer; }
.drow .ghost { width: auto; height: auto; padding: 3px 10px; font-size: 12px; }
.zgroup, .dimtoggle, #zspin { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.05); overflow: hidden; }
.zgroup { display: flex; flex-direction: column; }
.zgroup button + button { border-top: 1px solid var(--line); }
.dimtoggle { display: flex; padding: 2px; gap: 2px; }
.dimtoggle button { width: auto; height: 26px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 600; }
.dimtoggle button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tip { position: absolute; pointer-events: none; max-width: 300px; background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 8px;
  font-size: 12.5px; line-height: 1.35; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.tip small { display: block; opacity: .75; margin-top: 3px; font-variant-numeric: tabular-nums; }

aside { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; min-width: 0; padding: 18px 18px 22px;
  display: flex; flex-direction: column; gap: 14px; }
aside h2 { font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.3; margin: 0; text-wrap: balance; }
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
aside p { margin: 0; color: var(--ink-2); }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.eyebrow i { width: 10px; height: 10px; border-radius: 50%; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meta a, .mono { font-family: var(--f-mono); font-size: 12.5px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
.abstract { font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.names { display: flex; flex-wrap: wrap; gap: 4px; }
.names button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 7px; font-size: 12.5px; cursor: pointer; color: var(--ink); }
.names button:hover { background: var(--wash); border-color: var(--accent); }
.names button.more { border-style: dashed; color: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list button { width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 6px; border-radius: 6px; cursor: pointer;
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 9px; align-items: baseline; }
.list button:hover { background: var(--wash); }
.list i { width: 8px; height: 8px; border-radius: 50%; transform: translateY(-1px); }
.list .tt { font-size: 13px; color: var(--ink); line-height: 1.35; }
.list .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.back { align-self: flex-start; }
.howto summary { list-style: none; cursor: pointer; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.howto summary::-webkit-details-marker { display: none; }
.howto summary .more { color: var(--accent); font-size: 12px; white-space: nowrap; }
.howto summary:hover .more { text-decoration: underline; }
.howto[open] summary .more { color: var(--muted); }
.howto > p { margin: 10px 0 8px; font-size: 13px; }
.how { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.how div { display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
.how b { color: var(--ink); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.bars { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
footer { font-size: 12px; color: var(--muted); }

@media (max-width: 880px) {
  .paneltab { display: none; }   /* the panel is below the map here */
  body.nopanel main { grid-template-columns: minmax(0, 1fr); gap: 12px; } body.nopanel aside { display: block; }
  body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 380px; }
  aside { overflow: visible; }
  .modes button span { display: none; }
  .modes button { padding: 8px 12px; }
  .legend { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chip { flex: none; }
  .tapcard:not([hidden]) { display: flex; }
}
@media (max-width: 600px) {
  /* phones: compact header, a tall map, and the table as cards */
  .tagline { display: none; }
  .stage { height: 78vh; height: 78svh; min-height: 420px; }
  .ptable, .ptable tbody { display: block; }
  .ptable thead tr { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .ptable th { position: static; border: 0; padding: 0; background: none; }
  .ptable th button { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; }
  .ptable th:nth-child(5), .ptable th:nth-child(7), .ptable td:nth-child(5), .ptable td:nth-child(7) { display: none; }
  .ptable tbody tr { display: flex; flex-wrap: wrap; align-items: baseline; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .ptable td { border: 0; padding: 0; min-width: 0; max-width: none; text-align: left; }
  .ptable td.tt { flex: 0 0 100%; min-width: 0; margin-bottom: 3px; }
  .ptable td:nth-child(n+2) { font-size: 12px; color: var(--ink-2); }
  .ptable td:nth-child(2) { order: 1; max-width: 48%; }        /* first author · year · citations · topic */
  .ptable td:nth-child(3) { order: 2; } .ptable td:nth-child(6) { order: 3; }
  .ptable td:nth-child(4) { order: 4; flex: 0 0 100%; margin-top: 2px; }   /* the topic on its own line */
  .ptable td:nth-child(3)::before, .ptable td:nth-child(6)::before { content: "·"; margin: 0 6px; color: var(--muted); }
  .ptable td:nth-child(6)::after { content: " citations"; }
  .field label[for^="f-"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .frow .field { flex: 1 1 100%; } .frow select { width: 100%; max-width: none; }
  .search { flex-basis: 100%; max-width: none; }
}
@media (pointer: coarse) {
  .zoom button { width: 40px; height: 40px; }
  .chip, .ghost, .names button { min-height: 34px; }
}
.tapcard { display: none; position: absolute; left: 10px; right: 10px; bottom: 10px; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.tapcard .tt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; color: var(--ink); overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tapcard button { flex: none; }
@media (min-width: 881px) { .modes button span.short { display: none; } }

,"The LSST Dark Energy Science Collaboration","Thomas J. Elliott","Thomas Meier","Tiago Castro","Tianyi Li","Tilman Tröster","Tiziana Di Matteo","Tiziana Trombetti","Tjitske K. Starkenburg","Tobias Grubenmann","Tracy R. Slatyer","Ujjwal Tiwari","Ulrich P. Steinwandel","Urbano L. França","Uros Seljak","V. Hervier","V. Reveret","V. Sauvage","Valentina La Torre","Valerio Busillo","Veronica Biffi","Vicent Quilis","Victoria Ono","Vid Iršič","Vikram Ravi","Vincenzo Cardone","Vincenzo Testa","Vinicius Mikuni","Violeta Gonzalez-Perez","Vivian Poulin","Volker Springel","W. J. Percival","Waleed Mouhali","Wen-Han Zhou","Wentao Luo","Wenzer Qin","William J. Roper","William Laplante","William R. Coulton","William R. Forman","Xavier Corap","Xavier Coulon","Xavier Sims","Xiaohu Yang","Xiaowen Zhang","Xingye Zhu","Yan-Fei Jiang","Yang Wang","Yash Gondhalekar","Yashar Hezaveh","Yin Li","Yingjie Peng","Yongseok Jo","Yossi Yovel","Yu-Chen Wang","Yuanyuan Su","Yueying Ni","Yuga Hikida","Yukun Liu","Yuri Oku","Yurii Kvasiuk","Zarin Tasnim","Zeyu Gao","Zoltan Haiman","Ákos Bogdán","Ángel Chandro-Gómez","Íñigo Zubeldia","Óscar Monllor-Berbegal"],"papers":[{"id":"2611.17299","t":"Simulation-Based Priors and BAO Shifts from the Lyman-$α$ Forest at the Field Level","ab":"We present an analytic forward model for the Lyman-$α$ (Ly-$α$) forest flux field based on cubic-order large-scale structure perturbation theory (effective field theory) calculations. We validate our cubic model on two sets of hydrodynamic simulations spanning $2 \\leq z \\leq 4$: the small-volume CAMELS suite, which spans a wide range of cosmological and astrophysical parameters, and the large-volume, high-resolution Sherwood simulations. We find qualitatively similar results for both at the power-spectrum level. The perturbative model reproduces the three-dimensional flux power spectrum of the simulations to $\\sim 5\\%$ down to $k \\simeq 1$-$1.5\\,h\\,{\\rm Mpc}^{-1}$, depending on the redshift. This improves compared to previous quadratic perturbative forward models by up to 40%. Exploiting cosmic-variance cancellation in the field-level approach, we carry out precision measurements of the Lyman-alpha forest bias parameters from the CAMELS simulation suite. We use these measurements to analytically predict the shifts in the Baryon Acoustic Oscillations (BAO) scaling parameters induced by nonlinearities in the three-dimensional Lyman-alpha forest clustering as a function of cosmological parameters. We find sub-percent shifts in both the radial and transverse directions with a noticeable dependence on cosmology and redshift. Finally, from the field-level fits we construct simulation-based priors that can be used for cosmological analyses of the Lyman-alpha forest with the currently observing Dark Energy Spectroscopic Instrument (DESI). In addition, our cubic model captures the connected four-point function (trispectrum) of the forest, which opens up novel opportunities for accurate covariance matrix estimation for DESI and its successor, DESI-II.","abx":0,"nw":1,"d":"2026-11-12","dq":0,"y":2026,"au":[153,477,393],"c":0,"cs":0,"bib":"2026arXiv261117299S","v":"","lk":"arXiv:2611.17299","url":"https://arxiv.org/abs/2611.17299","doi":"","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["3D fields","Power spectra & summary statistics"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":0.1179,"yy":-0.17,"p3":[-0.0864,-0.2358,-0.0775],"sim":{"k":"e","l":[[31,0.947],[160,0.94],[171,0.934],[122,0.933],[103,0.932]]},"c3":[62.01,70.66,1.63],"c2":[26.83,28.05],"k":1,"r":[25,130,158,171],"rm":0},{"id":"2611.06333","t":"Understanding galaxies and the origin of the golden mass through the study of scaling relations across cosmic history","ab":"The total mass distribution in galaxies strongly influences star formation (SF), both directly via gas availability and feedback, and indirectly via the dark matter (DM) potential well. Star formation efficiency peaks at a characteristic stellar mass of $5 \\times 10^{10} M_{\\odot}$, often termed the \"golden mass\", where feedback mechanisms minimally affect SF. This scale also appears in other scaling relations: correlations between stellar population gradients, DM fraction, and total mass density slope versus stellar mass all show pronounced minima at the golden mass. How, why, and when does this golden mass emerge during galaxy evolution? Early cosmic epochs ($z > 1.5$) remain largely unexplored, yet they probe the formative stages of galaxy mass assembly. They provide the full redshift baseline needed to constrain the buildup of stellar mass and the efficiency of gas-to-star conversion. By combining high resolution, multiplexing, and a wide field of view, SHARP on the ELT will address these questions, delivering sharper and deeper data than JWST. In this SHARP White Paper contribution, we present a scientific case exploiting these unique characteristics. SHARP will enable precise measurements of stellar population gradients, DM fractions, and total mass density slopes. Using the mIFU mode, SHARP will obtain spatially-resolved stellar population and dynamical maps for galaxies at $z > 1.5$. Reconstructing these observables for early- and late-type systems will allow us to trace the emergence of the golden mass across cosmic time, and to decode the impact of galaxy processes (mergers, SN, and AGN feedback) by comparing observations with cosmological simulations. (abridged)","abx":0,"nw":1,"d":"2026-11-04","dq":0,"y":2026,"au":[92,4,5,186,404,462,495],"c":0,"cs":0,"bib":"2026arXiv261106333T","v":"New Astronomy","lk":"arXiv:2611.06333","url":"https://arxiv.org/abs/2611.06333","doi":"10.1016/j.newast.2026.102686","tg":{"s":["IllustrisTNG","CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":["IllustrisTNG"]},"x":0.3881,"yy":-0.6107,"p3":[0.2523,-0.2572,0.3061],"sim":{"k":"e","l":[[75,0.96],[54,0.943],[21,0.942],[36,0.94],[30,0.939]]},"c3":[40.08,-114.7,28.54],"c2":[61.51,-77.36],"k":6,"r":[75,82,119,130,158,171],"rm":0},{"id":"2610.40218","t":"Celia: Catalog Embeddings Learned from cosmologIcal simulAtions","ab":"Cosmological hydrodynamical simulations connect observed galaxies to cosmology and the physics of galaxy formation. Each simulation is expensive, and different codes model galaxy formation in different ways. We present Celia (Catalog Embeddings Learned from cosmologIcal simulAtions), a self-supervised foundation model that maps catalogs of subhalos and their galaxy properties to an embedding vector for the purposes of compression and organization of astrophysical and large-scale structure information. Celia is pretrained without parameter labels on the IllustrisTNG, SIMBA and Astrid suites of CAMELS and their N-body counterparts, by reconstructing masked subhalo properties and predicting the representations of a teacher network. Simple linear models fitted to the embeddings recover $Ω_{\\mathrm m}$ with $R^2=0.999$, and $σ_8$ and both supernova-feedback amplitudes with $R^2\\geq0.97$, in all three suites. The embeddings translate well to out-of-distribution simulations such as Swift-EAGLE, a code that Celia never saw. A linear model fitted on the three training codes predicts its $Ω_{\\mathrm m}$ with a correlation coefficient $r=0.985$, and linear models fitted on 20 labeled simulations reach $r\\geq0.94$ for $Ω_{\\mathrm m}$, $σ_8$ and a supernova-feedback amplitude. We decompose the variation among the simulations of each suite into principal components of the embedding, and simple power laws of the simulation parameters describe the leading components. Celia gives simulated galaxy catalogs a shared coordinate system for simulation-based inference, emulation, the comparison of galaxy-formation models, the detection of physical degeneracies and the discovery of new astrophysical probes.","abx":0,"nw":0,"d":"2026-10-29","dq":0,"y":2026,"au":[585,372,51,547,483,68],"c":0,"cs":0,"bib":"2026arXiv261040218Z","v":"","lk":"arXiv:2610.40218","url":"https://arxiv.org/abs/2610.40218","doi":"","tg":{"s":["IllustrisTNG","SIMBA","Astrid","N-body (dark matter only)","Swift-EAGLE"],"d":["Halo & galaxy catalogs"],"m":["Other ML"],"u":[]},"x":-0.1208,"yy":0.3077,"p3":[0.1008,0.3478,-0.0991],"sim":{"k":"e","l":[[153,0.955],[74,0.953],[12,0.95],[4,0.95],[133,0.949]]},"c3":[94.16,-23.7,-85.0],"c2":[98.72,23.06],"k":8,"r":[16,32,39,46,53,66,74,76,84,111,117,120,122,129,130,133,137,146,153,157,158,165,171],"rm":0},{"id":"2610.37825","t":"Probing Cosmology with Diffusion Models: Memorization, Generalization, and Parameter Estimation","ab":"Diffusion models are increasingly used as surrogates for expensive cosmological simulations, but simple metrics like reconstruction fidelity do not guarantee a surrogate can be trusted for scientific inference. To explore this, we train diffusion models on HI fields from the CAMELS IllustrisTNG simulations and test how three properties change with training-set size: memorization of individual training examples, agreement with one- and two-point statistics (the pixel-value distribution and the power spectrum), and estimation of cosmological parameters from the generated fields. At fixed model size, generative models trained with smaller, less diverse training data produced memorized samples. While this is a well known phenomenon, we show that this leads to miscalibrated parameter densities for cosmological inference tasks. At fixed size, there is a training set size with enough information content to enable a model to generalize, at which point posterior density estimation with neural surrogates can be well-calibrated. We demonstrate that a neural surrogate can therefore pass visual, one-point and power-spectrum convergence tests while still resulting in overconfident parameter estimation in a cosmological inference pipeline. Thus, tests of model generalization should be an additional check for inference pipelines adopting neural surrogates.","abx":0,"nw":0,"d":"2026-10-27","dq":0,"y":2026,"au":[269,418],"c":0,"cs":0,"bib":"2026arXiv261037825P","v":"","lk":"arXiv:2610.37825","url":"https://arxiv.org/abs/2610.37825","doi":"","tg":{"s":["IllustrisTNG"],"d":["2D maps","Power spectra & summary statistics"],"m":["Generative models","Simulation-based inference"],"u":[]},"x":-0.1627,"yy":0.9276,"p3":[-0.6254,-0.083,0.0511],"sim":{"k":"e","l":[[95,0.95],[37,0.943],[98,0.943],[143,0.942],[25,0.942]]},"c3":[-160.94,-26.48,-110.81],"c2":[-195.12,1.46],"k":5,"r":[95,105,143,165],"rm":0},{"id":"2610.33955","t":"FastPM: Fast Pretrained Model for Cosmological Simulation-Based Inference","ab":"Modern cosmology increasingly relies on large ensembles of expensive simulations to model the non-linear Universe and extract information from upcoming surveys. However, generating high-fidelity simulations---whether gravity-only N-body or full hydrodynamical---requires substantial computational resources. In this work, we demonstrate that transfer learning from fast low-fidelity simulations can dramatically reduce the cost of training machine learning models, in particular for simulation-based inference (SBI). We train a Fast Pretrained Model (FastPM) on a set of Fast Particle-Mesh (FastPM) simulations to infer $Ω_m$ and $σ_8$ from the power spectrum, and finetune on a smaller set of high-fidelity CAMELS N-body and hydrodynamical simulations. To reach a fixed posterior accuracy, the pretrained model requires only 5--15\\% of the high-fidelity simulations compared to the number of simulations needed when training on CAMELS alone, reducing the total training simulation compute cost, including that of the pretraining simulations, by up to an order of magnitude in CPU hours. Remarkably, the gains persist for the total matter power spectrum of full hydrodynamical simulations: although FastPM contains no baryonic physics, pretraining on FastPM runs that together cost less than a single hydrodynamical simulation still reduces the total training simulation compute by a factor of $\\sim$5. Moreover, pretraining on more accurate FastPM runs yields more accurate posteriors than training on CAMELS alone achieves with any number of simulations we consider. These results demonstrate that transfer learning from fast simulations is a simple and powerful route to high-fidelity SBI, and highlight the promise of simulation-based foundation models in cosmology.","abx":0,"nw":0,"d":"2026-10-24","dq":0,"y":2026,"au":[366,18],"c":0,"cs":0,"bib":"2026arXiv261033955Y","v":"","lk":"arXiv:2610.33955","url":"https://arxiv.org/abs/2610.33955","doi":"","tg":{"s":["N-body (dark matter only)","CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Power spectra & summary statistics"],"m":["Simulation-based inference"],"u":[]},"x":-0.4966,"yy":0.2662,"p3":[-0.2573,0.3083,0.0127],"sim":{"k":"e","l":[[66,0.963],[107,0.962],[12,0.955],[171,0.953],[2,0.95]]},"c3":[-39.47,78.29,-90.19],"c2":[-80.93,86.61],"k":4,"r":[59,66,67,71,103,158,171],"rm":0},{"id":"2610.10741","t":"Feedback-Conditional 3D Reconstruction of Cosmic Baryons with Flow Matching","ab":"The complex relationship between galaxies and diffuse gas at large scales depends strongly on astrophysical feedback and cosmology. The dispersion measure (DM) of Fast Radio Bursts (FRBs) is a column of cosmic baryon density and is dominated by the intergalactic medium, which is not necessarily captured by traditional halo model prescriptions. We introduce a generative model to reconstruct 3D gas density fields from galaxy surveys, including redshift space distortions. The probabilistic model is trained on the CAMELS50 simulation suite (IllustrisTNG) and learns to predict the posterior distribution of gas fields conditioned on stellar mass-weighted galaxy density, cosmological parameters, the minimum stellar mass threshold for the galaxy sample, and the baryon suppression power spectrum as a measure of baryonic feedback. Our method uses the 3D gas reconstruction to estimate per-sightline FRB DMs and their posteriors. We validate the model on test boxes by showing agreement between predicted and true DM across individual lines of sight and the overall DM distribution. The model generalizes to a box size $\\sim$\\,4$^3$ times larger in volume than the training boxes and can cover the volumes spanned by cosmological FRB sightlines. The model's 3D gas density predictions vary with input power spectrum and feedback scenarios, offering an inference path to constrain feedback models from FRBs and other probes such as X-rays, the SZ effect, and weak lensing.","abx":0,"nw":0,"d":"2026-10-07","dq":0,"y":2026,"au":[365,20,101,334],"c":0,"cs":0,"bib":"2026arXiv261010741H","v":"","lk":"arXiv:2610.10741","url":"https://arxiv.org/abs/2610.10741","doi":"","tg":{"s":["IllustrisTNG"],"d":["3D fields","Halo & galaxy catalogs","Synthetic observables"],"m":["Generative models"],"u":[]},"x":-0.3636,"yy":-0.4304,"p3":[-0.3413,-0.1186,0.3434],"sim":{"k":"e","l":[[14,0.95],[15,0.95],[98,0.949],[46,0.948],[160,0.945]]},"c3":[-93.67,-55.86,8.49],"c2":[-115.87,-59.07],"k":1,"r":[25,50,58,69,70,87,98,103,109,143,171],"rm":0},{"id":"2610.03946","t":"Baryonic Imprints on DM Halos: characterizing the full concentration-mass probability distribution with CAMELS","ab":"The halo concentration, which represents the distribution of matter within a halo, is a vital tool for modeling the matter distribution on scales ranging from megaparsecs to sub-kiloparsecs. While significant progress has been made on connecting the impact of astrophysics on the mean concentration as a function of halo mass, the same connection to higher moments of the concentration distribution remains far less explored. We employ the IllustrisTNG runs in the CAMELS simulation suite to simultaneously quantify the astrophysics and cosmology dependence of the first four moments of the concentration-mass relation; the mean, the scatter, the skewness, and the kurtosis. We use normalizing flows to model the concentration distribution as a function of halo mass, redshift, and six cosmological/astrophysical parameters. We focus on the mass range $M_{\\rm vir} \\in [10^{11}, 10^{14.5}] M_{\\odot}/h$, and the redshift range $z \\in [0, 1]$. All higher-order moments exhibit a mass-dependent sensitivity to both astrophysics and cosmology. The behavior in dark matter-only simulations follows the known effects of active mergers and of tidal stripping in smaller halos. Once galaxy formation is included, the scatter shows non-monotonic behavior at the Milky Way (MW) mass-scale, and the amplitude of this behavior is strongly influenced by the baryon fraction and supernovae (SNe) feedback parameters. The skewness has a large sensitivity to the baryon fraction as well and is mostly insensitive to the other parameters, while the kurtosis follows the behavior set by the skewness. Results for the ASTRID simulation suite show similar behavior as that of IllustrisTNG. The cosmology and astrophysics dependence of these higher-order moments impact analyses that are sensitive to the full distribution of the concentration-mass relation, particularly for halos at/below the MW mass scale.","abx":0,"nw":0,"d":"2026-10-02","dq":0,"y":2026,"au":[174,149],"c":0,"cs":0,"bib":"2026arXiv261003946G","v":"","lk":"arXiv:2610.03946","url":"https://arxiv.org/abs/2610.03946","doi":"","tg":{"s":["IllustrisTNG"],"d":["Halo & galaxy catalogs"],"m":["Normalizing flows"],"u":[]},"x":0.208,"yy":-0.4918,"p3":[0.3458,-0.0881,0.4333],"sim":{"k":"e","l":[[7,0.965],[110,0.963],[139,0.962],[99,0.948],[104,0.941]]},"c3":[121.2,-71.44,-14.02],"c2":[108.35,-74.33],"k":9,"r":[122,130,139,171],"rm":0},{"id":"2610.03544","t":"Baryonic Imprints on DM Halos: the concentration-mass relation and its dependence on 28 model parameters in the CAMELS suite","ab":"The evolution of baryons in halos, as well as their gravitational impact on the total-matter phase space, has a rich phenomenology and is vital in answering many questions in both cosmology and astrophysics. We use the CAMELS simulation suite to quantify the impact of twenty-three different galaxy formation parameters/processes (as well as five cosmological parameters) on the concentration--mass relation, $c_{\\rm vir}$ - $M_{\\rm vir}$, which characterizes the radial density distribution in halos. We construct a simulation-informed nonlinear model for concentration as a function of halo mass, redshift, and twenty-eight cosmological/astrophysical parameters. This is done using 2048 simulations of the IllustrisTNG galaxy formation model from the CAMELS suite. We extract the imprints of galaxy formation across a wide range in mass $M_{\\rm vir} \\in [10^{11}, 10^{14.5}]$ $M_{\\odot}/h$ and in redshift $z \\in [0, 3]$, finding clear mass- and redshift-dependent features in each of the different feedback mechanisms. From our measurements, we construct a three-component phenomenological model that can include astrophysical imprints in the concentration--mass relation in a fast and simple manner.","abx":0,"nw":0,"d":"2026-10-02","dq":0,"y":2026,"au":[95,149],"c":0,"cs":0,"bib":"2026arXiv261003544D","v":"","lk":"arXiv:2610.03544","url":"https://arxiv.org/abs/2610.03544","doi":"","tg":{"s":["IllustrisTNG"],"d":["Halo & galaxy catalogs"],"m":["Emulators & regression ML"],"u":["Emulators & regression ML"]},"x":0.1269,"yy":-0.5177,"p3":[0.3459,-0.059,0.5405],"sim":{"k":"e","l":[[139,0.985],[110,0.976],[6,0.965],[17,0.95],[99,0.949]]},"c3":[143.6,-66.51,36.77],"c2":[157.28,-83.32],"k":9,"r":[110,122,130,138,139,171],"rm":0},{"id":"2027NewA..13002638B","t":"Gas reservoirs predict future galaxy growth beyond halo assembly history in CAMELS","ab":"Does a galaxy's gas content tell us anything about its future growth once its dark-matter halo history is already known?","abx":1,"nw":0,"d":"2026-11-15","dq":0,"y":2026,"au":[311],"c":0,"cs":0,"bib":"2027NewA..13002638B","v":"New Astronomy","lk":"New Astronomy","url":"https://ui.adsabs.harvard.edu/abs/2027NewA..13002638B/abstract","doi":"10.1016/j.newast.2026.102638","tg":{"s":["IllustrisTNG","SIMBA"],"d":["Halo & galaxy catalogs","Merger trees"],"m":["Emulators & regression ML"],"u":["Emulators & regression ML"]},"x":0.4056,"yy":-0.2215,"p3":[0.3898,-0.405,0.1714],"sim":{"k":"w","l":[[9,0.465],[54,0.122],[41,0.113],[136,0.113],[1,0.1]]},"c3":[-68.57,60.05,67.68],"c2":[-47.92,-114.98],"k":7,"r":[171],"rm":0},{"id":"2026PRXI....121001V","t":"DENARIO Project: Deep Knowledge Artificial Intelligence Agents for Scientific Discovery","ab":"We present Denario, an Artificial Intelligence (AI) multiagent system designed to serve as a scientific research assistant.","abx":1,"nw":1,"d":"2026-10","dq":0,"y":2026,"au":[207,81,442,18,19,108,34,439,97,440,395,554,105,587,468,290,53,435,543,54,446,509,140,448,552,369,150,109,79,336,594,514,574,458,268,607],"c":0,"cs":0,"bib":"2026PRXI....121001V","v":"PRX Intelligence","lk":"PRX Intelligence","url":"https://ui.adsabs.harvard.edu/abs/2026PRXI....121001V/abstract","doi":"10.1103/kk55-gc95","tg":{"s":["CAMELS (suite not stated)"],"d":["Power spectra & summary statistics"],"m":["Other ML"],"u":["CAMELS (suite not stated)","Power spectra & summary statistics"]},"x":-0.2183,"yy":0.1688,"p3":[0.098,0.0737,-0.1657],"sim":{"k":"e","l":[[35,0.9],[165,0.899],[162,0.898],[42,0.893],[31,0.889]]},"c3":[-20.36,-43.39,-90.18],"c2":[-41.09,-21.96],"k":10,"r":[59,154,158,171],"rm":0},{"id":"2026ApJ..1008..242M","t":"Multiscale Rotational-Compressive Organization in Cosmological Baryonic Flows","ab":"Recent cosmological simulations show that baryonic matter in the cosmic web develops shocks, filamentary accretion flows, shear layers, and rotational structures.","abx":1,"nw":0,"d":"2026-09","dq":0,"y":2026,"au":[573],"c":0,"cs":0,"bib":"2026ApJ..1008..242M","v":"Astrophysical Journal","lk":"The Astrophysical Journal","url":"https://ui.adsabs.harvard.edu/abs/2026ApJ..1008..242M/abstract","doi":"10.3847/1538-4357/ae9bba","tg":{"s":["IllustrisTNG","SIMBA"],"d":["3D fields"],"m":["No ML"],"u":[]},"x":0.1967,"yy":-0.849,"p3":[-0.0338,-0.2956,0.2451],"sim":{"k":"e","l":[[78,0.923],[43,0.921],[104,0.92],[122,0.92],[160,0.917]]},"c3":[-59.21,-24.32,98.3],"c2":[-24.87,-127.7],"k":1,"r":[171],"rm":0},{"id":"2610.00725","t":"Emulation of the Halo Mass Function with Neural Networks","ab":"The abundance of galaxy clusters as a function of mass --- the halo mass function (HMF) --- depends strongly on cosmological parameters. Large-scale simulations are computationally expensive, motivating emulators that interpolate simulation outputs. We present a neural network emulator that maps cosmological and astrophysical parameters, halo mass, and redshift directly to a cumulative count of halos above the input mass, avoiding the information loss inherent to binning and to the functional or PCA-based data reduction used in prior emulators. Each emulator prediction is accompanied by a self-estimated error, expressed in units of Poisson shot noise, that the network learns to predict alongside the halo count itself --- giving every output a built-in confidence metric. We validate the emulator with leave-one-out tests on three simulation suites --- the N-body MassiveNus suite and the hydrodynamical CAMELS IllustrisTNG and SIMBA suites --- spanning a range of box sizes, redshifts, sub-grid physics, and softwares. Of all the held-out predictions ($1.2\\times 10^6$ in total), 88\\% have model bias at or below shot noise and 99.9\\% are within $3\\times$ shot noise. The only significant high-error tail is in MassiveNus, where the predicted model bias flags 76\\% of predictions exceeding $3\\times$ shot noise; the remaining number of high error predictions is comparable to the number expected from shot noise alone. This emulator is publicly available and can be trained on other simulation suites making it a flexible HMF tool that can be used for cosmological and astrophysical inference.","abx":0,"nw":0,"d":"2026-09-30","dq":0,"y":2026,"au":[430,417],"c":0,"cs":0,"bib":"2026arXiv261000725R","v":"","lk":"arXiv:2610.00725","url":"https://arxiv.org/abs/2610.00725","doi":"","tg":{"s":["IllustrisTNG","SIMBA","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["Emulators & regression ML"],"u":[]},"x":0.1944,"yy":0.1324,"p3":[0.3765,0.0125,0.0468],"sim":{"k":"e","l":[[132,0.957],[99,0.955],[163,0.953],[154,0.952],[153,0.949]]},"c3":[52.88,148.81,-3.54],"c2":[18.86,210.59],"k":8,"r":[158],"rm":0},{"id":"2609.23982","t":"The CAMELS-CROCODILE Simulation Suite: A New Cosmology--Astrophysics Playground for Machine Learning","ab":"We present CAMELS-CROCODILE, a suite of cosmological hydrodynamic simulations that extends the CAMELS framework with the \\gadget{} smoothed particle hydrodynamics code and the Osaka feedback model. As a companion to the IllustrisTNG-based second-generation CAMELS suite, it provides an independent implementation of the baryonic physics that shapes galaxies, the intergalactic medium, and large-scale structure, broadening the range of subgrid models over which machine-learning (ML) inference can be marginalized and tested. The suite comprises $25$ and $50Mpc/h$ boxes organized into one-parameter, cosmic-variance, and Sobol-sequence sets that vary $26$ cosmological and astrophysical parameters around a fiducial Osaka model. We describe the simulation design and validate the suite against benchmarks and other CAMELS suites. Compared with IllustrisTNG, the fiducial model suppresses the matter power spectrum by only a few per cent, against up to ${\\sim}27\\%$ at $z=0$, and forms stars with similar efficiency below $10^{12.2} M_\\odot/h$ but up to $2.5$ times more efficiently in group-scale halos, both consistent with weaker AGN feedback. We also present the stellar and black hole bias and the Ly$α$ absorption around galaxies. As a first ML application, we apply a graph neural network trained on IllustrisTNG galaxy catalogs, with frozen weights, to CAMELS-CROCODILE. It fails to recover $Ω_{\\rm m}$ and $σ_8$ and returns overconfident posteriors, mainly for simulations containing more galaxies than any in its training set; within that range $Ω_{\\rm m}$ is recovered with an error only $1.5$ times the in-distribution value. These results underline the need to train and test ML inference across physically distinct galaxy formation models.","abx":0,"nw":0,"d":"2026-09-21","dq":0,"y":2026,"au":[303,600,59,290,207,515,134],"c":0,"cs":0,"bib":"2026arXiv260923982N","v":"","lk":"arXiv:2609.23982","url":"https://arxiv.org/abs/2609.23982","doi":"","tg":{"s":["CROCODILE"],"d":["Particle snapshots","Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":-0.0557,"yy":0.0243,"p3":[0.0298,0.1068,-0.0052],"sim":{"k":"e","l":[[171,0.969],[130,0.963],[153,0.96],[158,0.96],[99,0.959]]},"c3":[-107.01,109.08,194.76],"c2":[-258.83,80.32],"k":7,"r":[],"rm":1},{"id":"2609.19295","t":"Reconstructing the Projected Dark Matter Field across 0.1-100 Mpc Scales from the SDSS Survey","ab":"Dark matter sets the gravitational environment in which galaxies form and evolve, but cannot be observed directly. We present a conditional diffusion model that reconstructs the projected dark matter density field from the galaxy stellar-mass density field for direct application to galaxy surveys. The model is trained on CAMELS and validated on the independent IllustrisTNG300-1 simulation. Halo masses inferred from the reconstructed projected-aperture measurements agree well with the corresponding true values, with a scatter below 0.2 dex. On 100 kpc scales, reconstructed surface densities show a typical scatter of ~0.3 dex in the regime most relevant for observations. We apply the model to SDSS galaxies with $M_\\star\\ge10^9\\,M_\\odot$ in a contiguous low-redshift region. Averaging over 100 stochastic realizations, we reconstruct and publicly release a projected dark matter field covering $90\\times90\\,(h^{-1}\\mathrm{Mpc})^2$ with a pixel size of $0.097\\,h^{-1}\\mathrm{Mpc}$. This pixel area corresponds to the characteristic projected area of halos with masses of ~$10^{10.6}\\,h^{-1}\\,M_\\odot$. The map reveals the multiscale projected cosmic web, including cluster-scale overdensities, filaments and voids. Projected-aperture masses are statistically consistent with SDSS group-catalog masses, while the derived halo mass function broadly matches mock-catalog expectations. The reconstructed projected potential places Coma in one of the deepest wells and near a convergence region of the inferred projected acceleration field, suggesting that the reconstruction retains both local overdensities and coherent large-scale projected gravitational structure. This work shows that diffusion-based dark matter reconstruction can be applied to real galaxy surveys, enabling halo-mass- and spatially resolved dark-matter-environment-based studies of galaxy evolution in SDSS and future wide-area surveys.","abx":0,"nw":0,"d":"2026-09-16","dq":0,"y":2026,"au":[312,592,151,584,341,296,270,603,457,599,474,242,35,98,76,595,75,201,586],"c":0,"cs":0,"bib":"2026ApJ..1010L..17Z","v":"Astrophysical Journal Letters","lk":"arXiv:2609.19295","url":"https://arxiv.org/abs/2609.19295","doi":"10.3847/2041-8213/aea8fe","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":0.049,"yy":0.8401,"p3":[-0.4149,-0.1175,0.087],"sim":{"k":"e","l":[[98,0.948],[109,0.936],[80,0.934],[58,0.929],[46,0.926]]},"c3":[-57.63,-27.35,-75.28],"c2":[-64.7,52.6],"k":5,"r":[58,98,130,158,165,167],"rm":0},{"id":"2609.10710","t":"BINDing the lightcone: A suite of astrophysical ray-traced weak lensing and SZ maps","ab":"Recent multiwavelength observations of galaxy group and cluster gas suggest stronger baryonic feedback than our best-calibrated hydrodynamical simulations produce, while modeling this feedback remains a primary source of uncertainty in Stage-IV weak-lensing (WL) analyses. We present a suite of ray-traced maps generated with BIND (Baryonic INpainting with Deep learning), a conditional flow-matching model that paints baryonic mass and gas thermodynamics onto the halos of dark-matter-only simulations, and which was developed in a companion paper. Applied to IllustrisTNG300-Dark and ray-traced, we generate convergence, optical depth, and Compton-$y$ maps at five source redshifts, each with $1000$ pseudo-independent realizations. We build lightcones across a 256-node Sobol sequence spanning the thirty-dimensional IllustrisTNG galaxy formation prior, with individual parameter variations and at the fiducial model. In validation, the maps match those built from the IllustrisTNG300 halos to within LSST-Y10-like precision for a range of WL statistics. Across the prior, the response to feedback exceeds Stage-IV statistical precision by more than an order of magnitude on small scales, and different statistics respond to different model sectors: galactic winds control the WL power spectrum and gas auto- and cross-spectra, while the stellar initial mass function slope and AGN parameters shape the morphological statistics (PDF, peaks, minima, and Minkowski functionals). Finally, we find that the response of statistics can be compressed into seven halo properties which linearly predict a range of WL and SZ statistics. We publicly release the maps, statistics, and model tables.","abx":0,"nw":0,"d":"2026-09-09","dq":0,"y":2026,"au":[379,515,604,228,82],"c":0,"cs":0,"bib":"2026arXiv260910710L","v":"","lk":"arXiv:2609.10710","url":"https://arxiv.org/abs/2609.10710","doi":"","tg":{"s":["IllustrisTNG","Non-CAMELS simulations"],"d":["2D maps","Synthetic observables"],"m":["Generative models"],"u":[]},"x":-0.3941,"yy":-0.3483,"p3":[-0.162,-0.0448,0.2616],"sim":{"k":"e","l":[[15,0.972],[5,0.95],[12,0.946],[160,0.946],[92,0.944]]},"c3":[72.72,40.02,62.29],"c2":[63.14,-11.6],"k":1,"r":[25,39,70,99,103,137,138,171],"rm":0},{"id":"2609.10709","t":"BIND (Baryonic INpainting with Deep learning): A Field-level Emulator for Galaxy Groups and Clusters","ab":"Baryonic feedback is a dominant source of systematic uncertainty for upcoming weak-lensing surveys, but current tools for modeling its effect rely on spherical approximations and density profiles calibrated almost entirely on two-point statistics. We introduce BIND (Baryonic INpainting with Deep learning), a conditional flow-matching model that learns a field-level mapping from dark-matter-only halos to their hydrodynamical counterparts. BIND is trained on halos from the 1024 paired hydrodynamical and dark-matter-only simulations of the CAMELS $50\\,h^{-1}\\,\\mathrm{Mpc}$ SB35 suite and samples dark matter, gas, and stellar mass fields over redshift across the full 35-dimensional $Λ$CDM and IllustrisTNG galaxy formation parameter space. BIND recovers dark matter, gas, and stellar masses at the percent level, reproduces azimuthally averaged profiles to $\\lesssim10\\%$ at all radii, and matches halo shape distributions with high fidelity. The learned parameter dependence captures the rank correlations between the generated fields and the subgrid parameters, and the field-level response to individual parameter variations is recovered in both sign and morphology. Halo mass is never supplied as conditioning, yet the baryon fraction, stellar-to-halo mass relation, inter-component scaling relations, and the joint covariance of their residuals are all reproduced. We finally show that, applied halo-by-halo to a $(50\\,h^{-1}\\,\\mathrm{Mpc})^3$ $N$-body volume with $512^3$ particles, BIND reproduces the projected matter power spectrum suppression to the accuracy ceiling set by pasting in the hydrodynamical halos themselves, in minutes on one GPU. We release the trained BIND models and all generated halos as open-source tools. A companion paper extends BIND to thermodynamic fields and non-Gaussian weak-lensing statistics.","abx":0,"nw":0,"d":"2026-09-09","dq":0,"y":2026,"au":[379,515,604,228,118,82],"c":0,"cs":0,"bib":"2026arXiv260910709L","v":"","lk":"arXiv:2609.10709","url":"https://arxiv.org/abs/2609.10709","doi":"","tg":{"s":["IllustrisTNG","N-body (dark matter only)"],"d":["3D fields","Halo & galaxy catalogs","Profiles"],"m":["Generative models"],"u":[]},"x":-0.3715,"yy":-0.3643,"p3":[-0.208,0.0358,0.2577],"sim":{"k":"e","l":[[14,0.972],[5,0.95],[12,0.945],[92,0.943],[46,0.939]]},"c3":[17.69,31.24,75.44],"c2":[0.65,10.04],"k":8,"r":[25,37,39,46,78,81,89,95,98,99,101,103,130,158,171],"rm":0},{"id":"2609.09504","t":"Inductive Biases in Field-Level Cosmological Inference from Galaxy Catalogs","ab":"We perform field-level likelihood-free inference of the matter density parameter $Ω_m$ from simulated galaxy catalogs using machine learning models with differing inductive biases. Using hydrodynamic simulations from CAMELS, we examine how observable choice and architecture govern cosmological information extraction. We consider galaxy positions and line-of-sight peculiar velocities, separately and jointly, and compare permutation-invariant Deep Sets, implemented with either multilayer perceptrons (MLPs) or Kolmogorov-Arnold Networks (KANs), to graph neural networks (GNNs), which explicitly encode spatial relations. We test in-distribution and out-of-distribution (OOD) performance across simulations with different subgrid galaxy-formation prescriptions. Deep Sets infer $Ω_m$ from velocities alone with mean relative errors of approximately $18\\%$ in-distribution and $\\sim25\\%$ OOD, with KANs and MLPs achieving comparable performance. In contrast, the same set-based approach does not yield useful $σ_8$ predictions in either in-distribution or cross-suite tests. Adding positions does not improve Deep Sets, while GNNs infer $Ω_m$ with mean relative errors of about $10\\%$ in-distribution and $10$--$17\\%$ OOD. These results indicate that peculiar velocities provide the dominant source of $Ω_m$ information for set-based models in this setting, while spatial information is most effectively used by architectures that explicitly encode galaxy-galaxy relations. Because the velocity inputs are exact simulated peculiar velocities, applications to survey data will require validation under realistic velocity-measurement noise, selection effects, and survey geometry.","abx":0,"nw":0,"d":"2026-09-08","dq":0,"y":2026,"au":[263,515,207],"c":1,"cs":0,"bib":"2026ApJ..1010..203B","v":"Astrophysical Journal","lk":"arXiv:2609.09504","url":"https://arxiv.org/abs/2609.09504","doi":"10.3847/1538-4357/aea400","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks","Simulation-based inference","Other ML"],"u":[]},"x":0.0696,"yy":0.4457,"p3":[0.2062,0.3787,-0.1881],"sim":{"k":"e","l":[[114,0.962],[133,0.96],[153,0.96],[12,0.954],[44,0.951]]},"c3":[19.42,-16.19,-107.52],"c2":[-15.65,90.07],"k":8,"r":[23,130,133,153,158,165,171],"rm":0},{"id":"2609.00807","t":"Baryonic feedback suppression of the matter power spectrum: a three-parameter fitting formula and its single-parameter reduction","ab":"Baryonic feedback can suppress matter clustering by $\\sim 10\\%$ at $k\\sim 1h$/Mpc and $z\\sim 1$, and is therefore a major source of systematic errors in weak lensing cosmology. We investigate this effect through the ratio $S(k,z)\\equiv P_{\\rm hydro}(k,z)/P_{\\rm DMO}(k,z)$ measured in the FLAMINGO, IllustrisTNG, and Illustris hydrodynamical simulation suites, together with the one-parameter-at-a-time (1P) variation runs of CAMELS-TNG and CAMELS-SIMBA. We present a three-parameter fitting formula that reproduces all but one of these runs with maximum error less than $0.03$ (and typical error less than $0.01$) at $k\\leq 3h/$Mpc and $z\\leq 2$; the only exception is a run with unrealistically low $Ω_m=0.1$. Each of the three parameters ($B_0$, $n$, and $a$) has a clear physical interpretation: $B_0$ sets the characteristic scale of the suppression at $z=0$, corresponding to a gas particle displacement scale of $B_0^{1/2}$; $n$ sets the suppression floor $(1-Ω_b/Ω_m)^n$; and $a$ sets the redshift $z_B$ at which the suppression peaks. Furthermore, we find that $B_0$ and $z_B$ are significantly correlated for most runs. Also, $n\\simeq 1$ for FLAMINGO, TNG and CAMELS-TNG. For these simulations, the description reduces to a single parameter formula with maximum error less than $0.03$. The formulas remain accurate at max$(|ΔS|)<0.03$ (and typical error less than $0.01$) for cosmologies well away from the calibration cosmology, spanning the range $Ω_m\\in [0.2,0.5]$, $Ω_b\\in [0.029,0.069]$ and $σ_8\\in [0.6,1.0]$. These results imply that, despite the diversity of baryonic physics implementations, an accurate description of $S(k,z)$ requires at most three effective degrees of freedom. Therefore the impact of feedback on weak lensing cosmology can in principle be mitigated internally without significant loss of cosmological constraining power.","abx":0,"nw":0,"d":"2026-09-01","dq":0,"y":2026,"au":[449],"c":0,"cs":0,"bib":"2026arXiv260900807Z","v":"","lk":"arXiv:2609.00807","url":"https://arxiv.org/abs/2609.00807","doi":"","tg":{"s":["IllustrisTNG","SIMBA","Non-CAMELS simulations"],"d":["Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":0.0557,"yy":-0.5118,"p3":[0.2415,0.0197,0.4136],"sim":{"k":"e","l":[[7,0.95],[139,0.946],[103,0.946],[62,0.941],[110,0.941]]},"c3":[18.77,60.93,39.04],"c2":[-16.39,-47.75],"k":9,"r":[25,53,103,130,158,171],"rm":0},{"id":"2609.40239","t":"Two bits about lossy compression: On the limits of compression in cosmology","ab":"Astronomy is in an era of enormous sky surveys and of the large simulation suites needed to interpret them, both costly to store and slow to share. Simulation outputs are stored as 32-bit floats, yet numerical noise and astrophysical uncertainties make better than percent-level pixel accuracy unnecessary. Because cosmological fields are statistically homogeneous with nearly Gaussian mode amplitudes, classic rate-distortion results apply directly, and non-Gaussian structure permits further compression. We use the scientific compression package SZ3, and a neural compressor that fixes the quantization and learns the probability of each quantization bin with an autoregressive transformer. SZ3 beats the Gaussian approach only where the field is smooth on the pixel scale or its values pile up at a single point, while the neural approach matches or beats SZ3 on every field we consider and is 9 to 27\\% below the Gaussian-optimal coder at fixed distortion, with the largest margin where the field is most non-Gaussian. Because the quantizer, not the network, sets the error, a poorly trained model can waste bits but never cost accuracy. A model trained only on weak lensing convergence maps transfers to $N$-body density fields without retraining, suggesting it has learned generic properties of cosmological structure rather than features of one dataset. Eulerian grids need only 1-4 bits per pixel (bpp) at percent-level accuracy, and particle displacements and velocities 5-6 at the precisions they require. The approach carries over to observational data: on Rubin Observatory Data Preview 1 coadds, with the quantization step set to a quarter of the background noise, the fine-tuned transformer needs 4.0 bpp, 27\\% fewer than the Gaussian coder.","abx":0,"nw":1,"d":"2026-09-30","dq":0,"y":2026,"au":[243,373],"c":0,"cs":0,"bib":"2026arXiv260940239T","v":"","lk":"arXiv:2609.40239","url":"https://arxiv.org/abs/2609.40239","doi":"","tg":{"s":["N-body (dark matter only)","Non-CAMELS simulations"],"d":["Particle snapshots","2D maps"],"m":["Other ML"],"u":[]},"x":-0.0755,"yy":0.4089,"p3":[0.0193,0.3126,0.0004],"sim":{"k":"e","l":[[11,0.928],[120,0.924],[71,0.923],[132,0.922],[66,0.921]]},"c3":[-17.16,87.6,12.25],"c2":[-17.83,66.75],"k":4,"r":[158,171],"rm":0},{"id":"2609.16194","t":"Peering Beyond the Veil of Last Scattering: A View of the Universe with CMB Spectral Distortions","ab":"The frequency spectrum of the cosmic microwave background is the most precise blackbody ever measured in nature, with deviations constrained at the level of almost one part per million from the COBE satellite. Nevertheless, departures away from a perfect blackbody are present in standard $Λ$CDM cosmology, lurking just beneath the surface of our current observational bounds. These spectral distortions provide invaluable information on our thermal history in both the post- and pre-recombination epochs, allowing us to peer beyond last scattering and into the primordial Universe. Here, we present an overview of the underlying physics responsible for generating CMB spectral distortions at all epochs. As an illustration of this rich physics, we review a comprehensive set of mechanisms capable of generating distortions both within and beyond the standard $Λ$CDM paradigm. We also discuss the information that can be gleaned by going beyond the monopole (sky-averaged) spectrum and exploiting the spatial information present in anisotropic spectral distortions. To supplement our discussion of the diverse science of spectral distortions, we provide an overview of the upcoming and proposed experimental landscape. We highlight that the combination of the TMS, COSMO, and BISOU experiments will provide the first discovery of a monopole $y$-type distortion within the coming decade. From space, the proposed FOSSIL experiment is forecasted to improve upon the original COBE/FIRAS measurement by roughly three orders of magnitude in sensitivity, bringing with it the detection of the $Λ$CDM $μ$-type distortion sourced by the dissipation of small scale acoustic modes in the pre-recombination plasma. With transformational measurements on the horizon, CMB spectral distortions offer a uniquely sensitive probe of the thermal history of the Universe at redshifts $z \\lesssim 2 \\times 10^6$.","abx":0,"nw":1,"d":"2026-09-14","dq":0,"y":2026,"au":[86,407,183,173,469,287,266,582,579,443,171,231,502,224,193,255,471,22,230,241,85,202,16,88,517,265,138,570,576,368,286,33,381,100,260,551,176,330,345,156],"c":4,"cs":0,"bib":"2026arXiv260916194C","v":"","lk":"arXiv:2609.16194","url":"https://arxiv.org/abs/2609.16194","doi":"","tg":{"s":["SIMBA"],"d":["Synthetic observables"],"m":["No ML"],"u":["SIMBA"]},"x":0.3947,"yy":-0.7576,"p3":[-0.1068,-0.3584,0.2226],"sim":{"k":"e","l":[[20,0.945],[45,0.937],[0,0.922],[147,0.919],[78,0.918]]},"c3":[45.76,-25.07,87.84],"c2":[75.74,-120.97],"k":1,"r":[45,77,160,171],"rm":0},{"id":"2609.17618","t":"FOSSIL: A future mission for CMB spectral distortion measurements","ab":"We present FOSSIL, a proposed space mission which is designed to deliver unprecedented absolute spectroscopic measurements of the sky intensity over a broad frequency range (50GHz to 2THz) to accurately measure chemical-potential mu-type, Compton y-type, and Compton relativistic y-type CMB spectral distortions. FOSSIL will reach monopole sensitivities representing a gain of roughly three orders of magnitude over COBE/FIRAS. These capabilities will allow us to constrain primordial density fluctuations on scales k~(10 to 10^4)Mpc^-1, test inflationary models, probe dark matter annihilation/decay/interactions, constrain primordial black hole seed scenarios, and pin down feedback models in galaxy evolution and structure formation by measuring the cosmic thermal energy content. Furthermore, its 130 spectral channels will enable legacy astrophysics, including precise characterisation of the Cosmic Infrared Background, line intensity mapping during cosmic noon, and detailed Galactic dust mapping.","abx":0,"nw":1,"d":"2026-09-14","dq":0,"y":2026,"au":[407,85,253,0,65,159,266,582,488,185,86,443,87,250,128,224,313,193,537,257,22,230,352,492,6,10,90,317,138,213,368,557,286,558,215,321,11,322,406,156,67,183,173,469,287,1,191,346,99,347,487,348,127,579,162,211,171,232,231,502,489,349,292,556,164,241,538,187,16,88,517,315,188,316,491,46,189,403,570,165,405,576,319,131,192,260,551,176,330,355,548,345,494,12,158,293,258,429,91],"c":2,"cs":0,"bib":"2026arXiv260917618A","v":"","lk":"arXiv:2609.17618","url":"https://arxiv.org/abs/2609.17618","doi":"","tg":{"s":["SIMBA"],"d":["Synthetic observables"],"m":["No ML"],"u":[]},"x":0.3684,"yy":-0.4916,"p3":[0.1086,-0.3302,0.0737],"sim":{"k":"e","l":[[19,0.945],[160,0.927],[97,0.919],[1,0.916],[45,0.915]]},"c3":[46.76,-55.23,81.24],"c2":[98.45,-120.84],"k":1,"r":[45,77,160,171],"rm":0},{"id":"2607.18229","t":"Breaking the $f_{\\text{NL}}$--$b_φ$ degeneracy with the time evolution of tracer number counts","ab":"Constraining local primordial non-Gaussianity through scale-dependent bias requires an accurate determination of the PNG bias parameter $b_φ$, which is completely degenerate with $f_\\mathrm{NL}$ in the galaxy power spectrum. The standard universality relation predicts $b_φ$ from the linear bias, but breaks down for realistic galaxy populations due to PNG assembly bias. The time evolution estimator offers a promising alternative, inferring $b_φ$ from the redshift evolution of tracer number counts. We test it against the separate universe estimator using the IllustrisTNG and SIMBA suites of CAMELS. Our main contribution is to demonstrate that the estimator can be extended to realistic observer-frame photometric selections, provided correction factors derivable from the galaxy SEDs are applied to account for luminosity-distance dimming and $K$-corrections. We further show that physical evolution not directly tracing the growth of matter fluctuations can also be corrected under assumptions about the star formation history: magnitude cuts require correcting for passive stellar fading, after which agreement with the separate universe estimator is restored. This establishes the robustness of the time evolution estimator of PNG bias with realistic survey selections, paving the way to future applications with real data.","abx":0,"nw":0,"d":"2026-07-20","dq":0,"y":2026,"au":[93,412],"c":2,"cs":0,"bib":"2026arXiv260718229N","v":"","lk":"arXiv:2607.18229","url":"https://arxiv.org/abs/2607.18229","doi":"","tg":{"s":["IllustrisTNG","SIMBA"],"d":["Halo & galaxy catalogs","Synthetic observables"],"m":["No ML"],"u":[]},"x":-0.2414,"yy":-0.7666,"p3":[0.1455,0.2949,0.2889],"sim":{"k":"e","l":[[30,0.945],[1,0.942],[73,0.938],[12,0.933],[24,0.933]]},"c3":[-15.83,-87.59,46.01],"c2":[-2.54,-105.55],"k":3,"r":[25,30,33,36,73,108,171],"rm":0},{"id":"2607.10983","t":"Fast(er)PM and Moving Mesh: JAX-native Geometric Multigrid Methods","ab":"Efficient, differentiable Poisson solvers are a key component of modern particle--mesh simulations and field-level inference pipelines. FFT-based solvers are extremely effective on fixed Cartesian meshes, but they impose global all-to-all communication and rely on symmetries that are lost in adaptive or non-Cartesian coordinates. In this work, we present a JAX-native geometric multigrid framework for particle--mesh gravity and argue that multigrid plays two complementary roles: on fixed meshes it can be a competitive, communication-avoiding alternative to FFTs, while on moving meshes it becomes the enabling solver. For static FastPM evolution, warm-started Chebyshev multigrid acts as a defect-correction method, exploiting temporal coherence between time steps to reduce the number of V-cycles required for field-level accuracy. At large mesh sizes this reduces memory pressure and yields comparable or faster wall-clock performance than distributed FFTs, with up to a factor of two reduction in total GPU time at fixed final mesh size. We then embed the same solver in a differentiable moving-mesh particle--mesh method, where adaptive coordinate deformation produces a variable-coefficient curvilinear Poisson equation that cannot be solved by ordinary FFT diagonalization. The resulting method concentrates force resolution in nonlinear structures while retaining a regular, JAX-compilable, automatically differentiable array workflow. These results suggest geometric multigrid can be a practical bridge between fast fixed-grid PM methods and differentiable adaptive-force cosmological simulations.","abx":0,"nw":1,"d":"2026-07-13","dq":0,"y":2026,"au":[70],"c":2,"cs":0,"bib":"2026arXiv260710983H","v":"","lk":"arXiv:2607.10983","url":"https://arxiv.org/abs/2607.10983","doi":"","tg":{"s":["N-body (dark matter only)"],"d":["Particle snapshots","3D fields"],"m":["No ML"],"u":[]},"x":-0.5625,"yy":0.1586,"p3":[-0.2225,0.337,0.166],"sim":{"k":"e","l":[[150,0.917],[48,0.917],[107,0.916],[49,0.911],[4,0.91]]},"c3":[-190.16,98.35,153.45],"c2":[-287.59,37.22],"k":4,"r":[],"rm":1},{"id":"2026A&C....5601095F","t":"Exploring the potential of Quantum Graph Neural Networks in analyzing Large-Scale Structure of Universe","ab":"The large-scale structure (LSS) of the Universe, characterized by the distribution of clusters, filaments, walls, and voids, encodes fundamental information about cosmology and structure formation.","abx":1,"nw":1,"d":"2026-06-28","dq":0,"y":2026,"au":[197,204,42,99,566,339,247,367,226,424,25,227,475,567,548],"c":5,"cs":0,"bib":"2026A&C....5601095F","v":"Astronomy and Computing","lk":"Astronomy and Computing","url":"https://ui.adsabs.harvard.edu/abs/2026A%26C....5601095F/abstract","doi":"10.1016/j.ascom.2026.101095","tg":{"s":["CAMELS-SAM"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks"],"u":["Halo & galaxy catalogs"]},"x":0.2003,"yy":0.3431,"p3":[0.4735,0.301,-0.1275],"sim":{"k":"w","l":[[65,0.264],[163,0.155],[111,0.146],[153,0.137],[16,0.128]]},"c3":[35.51,-19.62,-167.69],"c2":[-43.56,54.43],"k":8,"r":[132,163,171],"rm":0},{"id":"2606.10024","t":"Learning the Universe with cosmological rescaling of merger trees and semi-analytic galaxy formation models","ab":"Learning cosmology from galaxy surveys requires large suites of simulations spanning the cosmological and astrophysical parameter space, yet hydrodynamical simulations of galaxy formation remain prohibitively expensive. Semi-analytic models offer an inexpensive, physically grounded alternative, but still require halo merger trees from $N$-body simulations, and densely sampling cosmological parameters in sufficient volume remains expensive. We address this by extending cosmological rescaling to operate directly on merger trees and applying it in the $Ω_{\\rm m}$-$σ_8$ plane, running the Santa Cruz semi-analytic model for galaxy formation on the rescaled trees to produce galaxy populations across new cosmological and astrophysical parameters at negligible additional cost. A novel halo-profile-based correction, controlled by a single free parameter, suppresses systematic bias in rescaled halo masses to below the per cent level. We apply the method to parameter estimation of $Ω_{\\rm m}$ and $σ_8$ given either the stellar mass function or the two-point correlation function, finding that as few as 64, and potentially fewer, base $N$-body simulations, rescaled to $\\sim1000$ training samples, match the accuracy of 750 dedicated $N$-body simulations; rescaling to 3200 realisations improves the prediction of $Ω_{\\rm m}$ by $\\sim25\\%$. Rescaling all merger trees from a single CAMELS-SAM $N$-body simulation costs $\\sim0.1$ CPUh, compared to several thousand CPUh to run the simulation itself. We demonstrate a practical route to obtaining predictions of galaxy summary statistics across cosmological and astrophysical parameters, even with a relatively small number of base $N$-body simulations.","abx":0,"nw":0,"d":"2026-06-08","dq":0,"y":2026,"au":[470,340,515,464,467,505],"c":1,"cs":0,"bib":"2026ApJ..1007..112S","v":"Astrophysical Journal","lk":"arXiv:2606.10024","url":"https://arxiv.org/abs/2606.10024","doi":"10.3847/1538-4357/ae878b","tg":{"s":["CAMELS-SAM","N-body (dark matter only)"],"d":["Merger trees","Halo & galaxy catalogs"],"m":["Simulation-based inference"],"u":["Simulation-based inference"]},"x":0.0369,"yy":-0.2495,"p3":[0.1697,0.2088,0.3439],"sim":{"k":"e","l":[[99,0.959],[32,0.958],[154,0.952],[44,0.951],[4,0.95]]},"c3":[37.68,-21.63,-72.07],"c2":[21.94,-38.48],"k":3,"r":[66,84,130,154,171],"rm":0},{"id":"2606.10038","t":"Learning the Universe with the 2nd Generation of CAMELS: Varying 35 parameters of the IllustrisTNG model in (50Mpc/h)^3 boxes","ab":"We present a new set of 1,192 cosmological simulations as part of the CAMELS project, in which a space of 35 cosmological, astrophysical, and numerical parameters is explored around the fiducial IllustrisTNG model. The volume of each of these simulations is (50Mpc/h)^3, eight times larger than that of previous CAMELS simulations. This provides lower sample variance as well as access to more massive halos and more diverse environments. We focus this work on exploring the advantages these differences provide for parameter inference powered by neural networks. We generate training sets based on the matter power spectra, projected maps of the volumes, graphs representing galaxy spatial distributions, and thermodynamical properties of massive halos. We employ multilayer perceptrons, convolutional neural networks, graph neural networks, and Gaussian processes, respectively, to extract information on the simulation parameters from these inputs while comparing systematically to analogous results from our previous generation of (25Mpc/h)^3 simulations. We generally find that the new, larger volumes produce tighter marginal constraints on the parameters, to degrees that vary between the different inputs. The improvements, however, scale more weakly than with the square root of the increase in the amount of data (i.e., physical volume). We interpret this as originating either from information loss due to mode coupling or from complex degeneracies in parameter space. We also discuss the effects on statistics of the intergalactic medium temperature from four new parameters that are varied in these simulations, which control the amplitude and timing of the ionizing background radiation. We publicly release the simulation outputs and ancillary data at https://camels.readthedocs.io.","abx":0,"nw":0,"d":"2026-06-08","dq":0,"y":2026,"au":[515,593,80,383,379,290,168,118,583,78,303,134,207],"c":7,"cs":0,"bib":"2026arXiv260610038G","v":"","lk":"arXiv:2606.10038","url":"https://arxiv.org/abs/2606.10038","doi":"","tg":{"s":["IllustrisTNG"],"d":["Particle snapshots","Power spectra & summary statistics","2D maps","Halo & galaxy catalogs","Profiles"],"m":["CNN","Graph neural networks","Emulators & regression ML"],"u":[]},"x":-0.1567,"yy":-0.0767,"p3":[0.1452,0.0162,-0.1831],"sim":{"k":"e","l":[[171,0.961],[12,0.959],[99,0.949],[130,0.949],[166,0.949]]},"c3":[77.47,43.58,-27.59],"c2":[-8.56,-13.32],"k":7,"r":[38,39,53,59,65,76,81,90,99,122,130,133,137,146,153,154,155,159,165,166,171],"rm":0},{"id":"2605.28516","t":"Conservative neural posterior estimation via distributionally robust training","ab":"Simulation-based inference with neural posterior estimation (NPE) often yields overconfident and unreliable posteriors under limited simulation budgets. To address this, we propose DRO-NPE, a distributionally robust approach that replaces the standard NPE objective with a worst-case loss over a Wasserstein ambiguity set. We introduce KL-based metrics for miscoverage and miscalibration, and use these to show that the DRO-NPE objective controls overfitting and reduces posterior overconfidence. Our method is tractable, parallelisable, and readily integrates with standard normalising flows. Across benchmark SBI tasks, DRO-NPE consistently improves coverage and calibration, while narrowing the gap between empirical and population NPE loss, leading to more reliable inference in low-simulation regimes.","abx":0,"nw":0,"d":"2026-05-27","dq":0,"y":2026,"au":[578,598,106,210,63],"c":0,"cs":0,"bib":"2026arXiv260528516L","v":"arXiv.org","lk":"arXiv:2605.28516","url":"https://arxiv.org/abs/2605.28516","doi":"10.48550/arXiv.2605.28516","tg":{"s":["CAMELS (suite not stated)"],"d":[],"m":["Simulation-based inference","Normalizing flows"],"u":["CAMELS (suite not stated)"]},"x":-0.5614,"yy":0.4726,"p3":[-0.3321,0.5322,-0.2444],"sim":{"k":"e","l":[[63,0.925],[47,0.919],[66,0.916],[125,0.906],[85,0.905]]},"c3":[-0.14,108.36,-19.93],"c2":[18.65,167.66],"k":2,"r":[63,66,158,171],"rm":0},{"id":"2605.26210","t":"Field-level multi-tracers simulation-based inference of cosmological parameters from 3D maps","ab":"Extracting maximum cosmological information from current and upcoming large-scale structure data requires going beyond summary statistics as currently used in likelihood-based inference. Simulation-Based Inference (SBI) promises to enable the exploitation of field-level information and the rich physics of modern hydrodynamical simulations. We develop a proof-of-concept SBI pipeline to explore its potential to constrain the cosmological parameters $\\{Ω_{\\rm m}, σ_8\\}$ from galaxy number counts, neutral hydrogen (HI) intensity mapping and their combination. We use neural emulators trained on full hydrodynamical simulations to generate galaxy and HI maps from fast, approximate dark matter simulations. Combined with neural posterior estimation, this enables the estimation of cosmological parameters while marginalizing over astrophysical effects. We perform inference both on the power spectrum and on representations derived from field-level 2D or 3D maps, comparing results from each probe and the combination of both tracers, and assessing the impact of data compression and multi-tracers information on cosmological constraints. Combining galaxy and HI fields improves constraints with respect to single-tracer cases by a factor 2 to 7 in terms of a Figure of Merit describing the joint precision on cosmological parameters, depending on the tracer/configuration. Moving from summary statistics to field-level inference leads to a consistent gain in constraining power of about a factor 3, with 3D maps providing the most precise and well-calibrated posteriors. This gain in precision is robust even when astrophysical parameters are marginalized over. Further developments (inclu
