ding realistic survey effects and improvements in emulators' faithfulness) will enable the application of this analysis pipeline to upcoming surveys.","abx":0,"nw":0,"d":"2026-05-25","dq":0,"y":2026,"au":[225,503,377,476,369],"c":2,"cs":0,"bib":"2026arXiv260526210S","v":"","lk":"arXiv:2605.26210","url":"https://arxiv.org/abs/2605.26210","doi":"","tg":{"s":["CAMELS (suite not stated)","N-body (dark matter only)"],"d":["3D fields","2D maps","Power spectra & summary statistics"],"m":["Simulation-based inference","Generative models"],"u":[]},"x":0.1762,"yy":0.5512,"p3":[-0.1834,0.4851,-0.0686],"sim":{"k":"e","l":[[86,0.954],[16,0.947],[4,0.946],[71,0.946],[166,0.945]]},"c3":[-133.0,50.45,-68.9],"c2":[-162.22,80.28],"k":8,"r":[31,37,50,64,67,102,103,105,144,164,165,167,171],"rm":0},{"id":"title:physicsinformedvariationalautoencodersforcosmologicalfieldreconstructionandparam","t":"Physics-Informed Variational Autoencoders for Cosmological Field Reconstruction and Parameter Inference","ab":"","abx":0,"nw":0,"d":"2026","dq":1,"y":2026,"au":[324,602,540,384,497],"c":0,"cs":2,"bib":"","v":"","lk":"BS thesis","url":"https://dspace.bracu.ac.bd/items/5c545635-ac27-4307-8f29-825f61ca067c","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Generative models"],"u":["CAMELS (suite not stated)","2D maps","Generative models"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.1887,"yy":0.8934,"p3":[-0.5685,0.2034,0.0033],"sim":{"k":"w","l":[[105,0.189],[95,0.144],[142,0.108],[48,0.101],[90,0.088]]},"c3":[-130.92,7.71,210.63],"c2":[-204.33,-159.99],"k":5,"r":[],"rm":1},{"id":"2026MLS&T...7c5014G","t":"BOA constrictor: a Mamba-based lossless compressor for scientific data","ab":"The petabyte-scale data generated by high energy physics (HEP) experiments presents a significant storage challenge.","abx":1,"nw":0,"d":"2026-05-20","dq":0,"y":2026,"au":[21,103,542],"c":2,"cs":0,"bib":"2026MLS&T...7c5014G","v":"Machine Learning: Science and Technology","lk":"Machine Learning: Science and Technology","url":"https://ui.adsabs.harvard.edu/abs/2026MLS%26T...7c5014G/abstract","doi":"10.1088/2632-2153/ae64a9","tg":{"s":["CAMELS (suite not stated)"],"d":["Particle snapshots"],"m":["Other ML"],"u":["CAMELS (suite not stated)","Particle snapshots"]},"x":-0.7718,"yy":0.4574,"p3":[-0.3354,0.2308,-0.0631],"sim":{"k":"e","l":[[18,0.919],[120,0.903],[50,0.897],[37,0.896],[66,0.893]]},"c3":[20.37,6.08,27.67],"c2":[31.84,33.51],"k":4,"r":[130,158,171],"rm":0},{"id":"2604.21790","t":"Informative Priors on Primordial Non-Gaussianity Bias $b_φ$ From Galaxy Formation","ab":"Constraining primordial non-Gaussianity via its scale-dependent imprint on galaxy clustering requires knowledge of the bias parameter $b_φ$, which is exactly degenerate with $f^{\\rm{loc}}_{\\rm{NL}}$ at leading order. To break this degeneracy, current analyses adopt the relation $\\left(b_φ = 2δ_c\\left(b_1 - 1\\right)\\right)$ based on the assumption of a universal mass function. This relation is known to break down for physically motivated galaxy selections, introducing systematic errors in the inferred $f^{\\rm{loc}}_{\\rm{NL}}$ that scale directly with the assumed $b_φ$ prior. We present a framework to construct physically motivated, observation-conditioned priors on $b_φ$ by marginalizing over galaxy formation uncertainties. We use the CAMELS-SAM simulation suite, augmented by separate Universe simulations, to measure galaxy formation observables, like the stellar mass function (SMF) and the stellar-to-halo mass relationship (SHMR), and $b_φ$ across a range of galaxy formation parameters. From these measurements, we construct a distribution of $b_φ$ conditioned on observations, and we select our galaxy sample to resemble the DESI Emission Line Galaxy (ELG) sample. Conditioning on the SMF or SHMR decreases $σ_{b_φ}$ from $0.69$ to $0.08$ and $0.02$ respectively -- reductions of $88\\%$ and $97\\%$ -- with consistent results when conditioning on the observed data directly. Despite substantial shifts in the galaxy formation posteriors driven by known SC-SAM discrepancies at high halo masses, the resulting $b_φ$ distributions remain mutually consistent across all observables. The SMF and SHMR are found to carry sufficient constraining power to reduce the galaxy formation uncertainty in $b_φ$ relevant for $f^{\\rm{loc}}_{\\rm{NL}}$ inference with next-generation spectroscopic surveys","abx":0,"nw":0,"d":"2026-04-23","dq":0,"y":2026,"au":[50,340,175],"c":3,"cs":0,"bib":"2026arXiv260421790M","v":"","lk":"arXiv:2604.21790","url":"https://arxiv.org/abs/2604.21790","doi":"","tg":{"s":["CAMELS-SAM"],"d":["Halo & galaxy catalogs","Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":-0.2643,"yy":-0.7204,"p3":[0.287,0.2805,0.3809],"sim":{"k":"e","l":[[36,0.964],[154,0.945],[21,0.945],[33,0.942],[110,0.941]]},"c3":[20.15,-66.71,-73.67],"c2":[17.2,27.82],"k":3,"r":[36,146,154,158,171],"rm":0},{"id":"2603.13011","t":"Simulation-based inference from the Lyman-alpha forest 1D power spectrum with CAMELS","ab":"We perform for the first time full simulation-based inference on the Lyman-$α$ forest 1D power spectrum. In particular, we consider the prediction of the Lyman-$α$ forest $P_{\\rm 1D}(k)$ at $2.0<z<3.5$ from the CAMELS cosmological hydrodynamic simulations run with the IllustrisTNG and SIMBA galaxy formation models. We train a normalizing flow to perform neural posterior estimation of two cosmological parameters ($Ω_m$ and $σ_8$) and four astrophysical parameters parametrizing supernova and AGN feedback. When training and testing the neural network on the same baryon physics model, the posterior distributions of the cosmological parameters are found to be in excellent agreement with the true parameters values (within $10\\%$ deviations in $\\gtrsim 75\\%$ and $\\gtrsim 90\\%$ of the cases for $Ω_m$ and $σ_8$, and a precision better than $10\\%$ in both), while the astrophysical parameters converge to the prior mean due to the limited probed volume. When training on one model and testing on the other (e.g., training on IllustrisTNG and testing on SIMBA, or viceversa), the performance is significantly worse, both in accuracy and in precision, resulting in a $\\sim 10\\%$ positive bias on the predicted values for $σ_8$. We show that a multi-domain training based on the combination of simulations from both models recovers unbiased constraints, offering an effective solution to cope with the complex problem of the lack of convergence in the predictions from different galaxy formation models. This study represents a promising way forward to constrain cosmology and fundamental physics with the Lyman-$α$ forest with artificial intelligence.","abx":0,"nw":0,"d":"2026-03-13","dq":0,"y":2026,"au":[206,444,369],"c":3,"cs":0,"bib":"2026arXiv260313011S","v":"Physical Review D","lk":"arXiv:2603.13011","url":"https://arxiv.org/abs/2603.13011","doi":"10.1103/3d41-hq97","tg":{"s":["IllustrisTNG","SIMBA"],"d":["Power spectra & summary statistics","Synthetic observables"],"m":["Simulation-based inference","Normalizing flows"],"u":[]},"x":-0.0619,"yy":0.1089,"p3":[0.0788,0.0865,-0.306],"sim":{"k":"e","l":[[12,0.959],[130,0.954],[166,0.954],[171,0.953],[140,0.951]]},"c3":[-9.67,-11.0,-123.93],"c2":[-3.78,45.93],"k":7,"r":[84,111,118,120,157,158,171],"rm":0},{"id":"2602.07651","t":"Cosmology with one galaxy: An analytic formula relating $Ω_{\\rm m}$ with galaxy properties","ab":"Standard cosmological analyses typically treat galaxy formation and cosmological parameter inference as decoupled problems, relying on population-level statistics such as clustering, lensing, or halo abundances. However, classical studies of baryon fractions in massive galaxy clusters have long suggested that gravitationally bound systems may retain cosmological information through their baryonic content. Building on this insight, we present the first analytic and physically interpretable cosmological tracer that links the matter density parameter, $Ω_m$, directly to intrinsic galaxy-scale observables, demonstrating that cosmological information can be extracted from individual galaxies. Using symbolic regression applied to state-of-the-art hydrodynamical simulations from the CAMELS project, we identify a compact functional form that robustly recovers $Ω_m$ across multiple simulation suites (IllustrisTNG, ASTRID, SIMBA, and Swift-EAGLE), requiring only modest recalibration of a small number of coefficients. The resulting expression admits a transparent physical interpretation in terms of baryonic retention and enrichment efficiency regulated by gravitational potential depth, providing a clear explanation for why $Ω_m$ is locally encoded in galaxy properties. Our work establishes a direct, interpretable bridge between small-scale galaxy physics and large-scale cosmology, opening a complementary pathway to cosmological inference that bypasses traditional clustering-based statistics and enables new synergies between galaxy formation theory and precision cosmology.","abx":0,"nw":0,"d":"2026-02-07","dq":0,"y":2026,"au":[307,207,478,410],"c":2,"cs":0,"bib":"2026ApJ..1003..192L","v":"Astrophysical Journal","lk":"arXiv:2602.07651","url":"https://arxiv.org/abs/2602.07651","doi":"10.3847/1538-4357/ae64e3","tg":{"s":["IllustrisTNG","Astrid","SIMBA","Swift-EAGLE"],"d":["Halo & galaxy catalogs"],"m":["Symbolic regression"],"u":[]},"x":-0.0053,"yy":-0.2889,"p3":[0.0066,0.1576,0.3355],"sim":{"k":"e","l":[[24,0.958],[44,0.953],[132,0.952],[99,0.949],[62,0.948]]},"c3":[100.93,-96.85,-53.29],"c2":[124.45,-69.17],"k":3,"r":[74,84,130,157,171],"rm":0},{"id":"2602.12357","t":"Assembly bias and local Primordial non-Gaussianity from DESI DR1 Quasars","ab":"The analysis of the large-scale clustering of quasars (QSO) observed by the Dark Energy Spectroscopic Instrument (DESI) represents a promising avenue for constraining local Primordial non-Gaussianity (PNG), parameterized by $f_{\\rm NL}$. The signal to be constrained is the scale-dependent bias induced in the 2-point clustering of the considered tracer sample. The resulting constraints on $f_{\\rm NL}$, however, are fully degenerate with the local PNG bias parameter $b_φ$, dependent on the assembly bias parameter $p$. Using IllustrisTNG hydrodynamical simulations, we select a QSO sample reflecting the selection criteria and properties of DESI QSOs, and provide a robust prior for $p$, and thus for $b_φ$, building on the findings of Fondi et al. 2024. We find a distribution with mean $\\bar{p}\\simeq1.4$ with weak redshift dependence, stable to selection noise and consistent with the expected recent merger history typical of quasar-hosting halos. By comparing with the CAMELS simulations we demonstrate that this prior is robust to astrophysical assumptions and cosmic variance. Finally, applying this prior to the DESI DR1 dataset, we derive updated constraints on local PNG, obtaining $f_{\\rm NL}=-3.3\\pm9.2$.","abx":0,"nw":0,"d":"2026-02-12","dq":0,"y":2026,"au":[178,335,161,251,485,486,125,126,536,2,13,436,520,256,163,490,212,233,129,350,460,7,429,89,351,314,353,437,9,461,493,402,572,190,244,214,320,166,130,132,216,64,234],"c":2,"cs":0,"bib":"2026JCAP...06..062F","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2602.12357","url":"https://arxiv.org/abs/2602.12357","doi":"10.1088/1475-7516/2026/06/062","tg":{"s":["IllustrisTNG","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":-0.3109,"yy":-0.6974,"p3":[0.3004,0.3002,0.2846],"sim":{"k":"e","l":[[30,0.942],[108,0.926],[24,0.924],[154,0.924],[21,0.924]]},"c3":[4.25,-38.17,77.54],"c2":[-28.7,-97.03],"k":3,"r":[25,36,108,171],"rm":0},{"id":"2602.15938","t":"Implications of the nanoHertz Gravitational-Wave Background for Galactic Feedback and Massive Black Hole Growth","ab":"We investigate how pulsar timing array (PTA) measurements of the nanoHertz gravitational-wave background (GWB) can constrain models for the growth history of supermassive black holes (SMBHs) and how active galactic nucleus (AGN) and stellar feedback models can affect GWB predictions. Feedback regulates supermassive black hole (SMBH) growth, altering the black hole mass function (BHMF). Using BHMFs drawn from multiple cosmological simulation suites including IllustrisTNG, MillenniumTNG, Simba, and CAMELS, and combining these with a quasar-based SMBH binary population framework, we predict the resulting GWB amplitude under a range of different stellar and AGN feedback prescriptions. We find that the choice of both stellar and AGN feedback models alters the high-mass end of the BHMF and changes the predicted GWB amplitude by up to a factor of 2 for the fiducial simulations and a factor 10 for extreme feedback variations in CAMELS. Models with inefficient or absent AGN feedback produce abundant SMBHs and yield GWB amplitudes consistent with PTA data, yet fail in producing realistic galaxies. Fiducial models of AGN and stellar feedback suppress SMBH growth too much and under-predict the expected signal, an effect which could possibly be mitigated by more realistic black hole seeding and growth prescriptions. The mismatch between the GWB amplitudes predicted by cosmological simulations and that inferred by PTA measurements suggests that SMBH growth is more efficient or occurs earlier than captured by current models. This demonstrates that PTA measurements provide a powerful new probe of not only the SMBH population but also feedback physics.","abx":0,"nw":0,"d":"2026-02-17","dq":0,"y":2026,"au":[383,78,110,252,325,523,180,124],"c":5,"cs":0,"bib":"2026ApJ..1003L..50T","v":"Astrophysical Journal Letters","lk":"arXiv:2602.15938","url":"https://arxiv.org/abs/2602.15938","doi":"10.3847/2041-8213/ae6fbc","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.3412,"yy":-0.6302,"p3":[0.1415,-0.471,0.2295],"sim":{"k":"e","l":[[101,0.934],[75,0.932],[1,0.931],[122,0.929],[147,0.928]]},"c3":[30.1,-32.69,53.66],"c2":[49.45,21.37],"k":1,"r":[130,145,158,171],"rm":0},{"id":"2602.15951","t":"MadEvolve: Evolutionary Optimization of Cosmological Algorithms with Large Language Models","ab":"We develop a general framework to discover scientific algorithms and apply it to three problems in computational cosmology. Our code, MadEvolve, is similar to Google's AlphaEvolve, but places a stronger emphasis on free parameters and their optimization. Our code starts with a baseline human algorithm implementation, and then optimizes its performance metrics by making iterative changes to its code. As a further convenient feature, MadEvolve automatically generates a report that compares the input algorithm with the evolved algorithm, describes the algorithmic innovations and lists the free parameters and their function. Our code supports both auto-differentiable, gradient-based parameter optimization and gradient-free optimization methods. We apply MadEvolve to the reconstruction of cosmological initial conditions, 21cm foreground contamination reconstruction and effective baryonic physics in N-body simulations. In all cases, we find substantial improvements over the base algorithm. We make MadEvolve and our three tasks publicly available at madevolve.org.","abx":0,"nw":0,"d":"2026-02-17","dq":0,"y":2026,"au":[545,508,399],"c":5,"cs":0,"bib":"2026MLS&T...7d5026L","v":"Machine Learning: Science and Technology","lk":"arXiv:2602.15951","url":"https://arxiv.org/abs/2602.15951","doi":"10.1088/2632-2153/ae7e3b","tg":{"s":["CAMELS (suite not stated)"],"d":["3D fields"],"m":["Other ML"],"u":["CAMELS (suite not stated)","3D fields"]},"x":-0.3281,"yy":-0.1139,"p3":[-0.1846,0.1642,-0.0794],"sim":{"k":"e","l":[[158,0.944],[171,0.943],[107,0.94],[4,0.939],[11,0.939]]},"c3":[-109.7,-15.37,45.7],"c2":[-98.81,-86.23],"k":4,"r":[9,48,50,171],"rm":0},{"id":"2602.04987","t":"The Impact of Galaxy Formation on Galaxy Biasing, and Implications for Primordial non-Gaussianity Constraints","ab":"The parameter $f_{\\textrm{NL}}$ measures the local non-Gaussianity in the primordial energy fluctuations of the Universe, with any deviation from $f_{\\textrm{NL}}=0$ providing key constraints on inflationary models. Galaxy clustering is sensitive to $f_{\\textrm{NL}}$ at large scale modes and the next generation of galaxy surveys will approach a statistical error of $σ_{f_{\\textrm{NL}}}\\sim1$. However, the systematic errors on these constraints are dominated by the degeneracy of $f_{\\textrm{NL}}$ with the galaxy bias parameters $b_1$ (galaxy overdensities caused by mass perturbations) and $b_φ$ (galaxy overdensities caused by primordial potential perturbations). It has been shown that the assumed scaling of $b_φ(z)=2δ_c (b_1(z)-1)$ is not accurate for realistically simulated galaxies, and depends both on the galaxy selection and the way that galaxies are modeled. To address this, we leverage the CAMELS-SAM pipeline to explore how varying parameters of galaxy formation affects $b_φ$ and $b_1$ for various galaxy selections. We run separate-universe N-body simulations of $L=205 h^{-1}$ cMpc and $N=1280^3$ to measure $b_φ$, and run 55 unique instances of the Santa Cruz semi-analytic model with varying parameters of stellar and AGN feedback. We find the behavior and evolution of a SC-SAM model's stellar-, SFR- and sSFR- to halo mass relationships track well with how $b_1$ and $b_φ(b_1)$ change across redshift and selection for the SC-SAM. We find our variations of the SC-SAM encapsulate the $b_φ$ behavior previously measured in IllustrisTNG, the Munich SAM, and Galacticus.Finally, we identify sSFR selections as particularly robust to varied galaxy modeling.","abx":0,"nw":1,"d":"2026-02-04","dq":0,"y":2026,"au":[340,515,175,464],"c":6,"cs":0,"bib":"2026arXiv260204987P","v":"","lk":"arXiv:2602.04987","url":"https://arxiv.org/abs/2602.04987","doi":"","tg":{"s":["CAMELS-SAM"],"d":["Halo & galaxy catalogs","Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":-0.0444,"yy":-0.322,"p3":[0.3415,-0.0467,0.276],"sim":{"k":"e","l":[[30,0.964],[154,0.953],[24,0.942],[38,0.942],[89,0.941]]},"c3":[-3.38,-143.74,-17.67],"c2":[-63.77,-132.63],"k":6,"r":[154],"rm":0},{"id":"2601.14377","t":"Cosmo-FOLD: Fast generation and upscaling of field-level cosmological maps with overlap latent diffusion","ab":"We demonstrate the capabilities of probabilistic diffusion models to reduce dramatically the computational cost of expensive hydrodynamical simulations to study the relationship between observable baryonic cosmological probes and dark matter at field level and well into the non-linear regime. We introduce a novel technique, Cosmo-FOLD (Cosmological Fields via Overlap Latent Diffusion) to rapidly generate accurate and arbitrarily large cosmological and astrophysical 3-dimensional fields, conditioned on a given input field. We are able to generate TNG300-2 dark matter density and gas temperature fields from a model trained only on ~1% of the volume (a process we refer to as `upscaling'), reproducing both large scale coherent dark matter filaments and power spectra to within 10% for wavenumbers k <= 5 h Mpc^-1. These results are obtained within a small fraction of the original simulation cost and produced on a single GPU. Beyond one and two points statistics, the bispectrum is also faithfully reproduced through the inclusion of positional encodings. Finally, we demonstrate Cosmo-FOLD's generalisation capabilities by upscaling a CAMELS volume of 25 (Mpc h^-1)^3 to a full TNG300-2 volume of 205 (Mpc h^-1)^3$ with no fine-tuning. Cosmo-FOLD opens the door to full field-level simulation-based inference on cosmological scale.","abx":0,"nw":0,"d":"2026-01-20","dq":0,"y":2026,"au":[503,476,369],"c":7,"cs":0,"bib":"2026arXiv260114377M","v":"arXiv.org","lk":"arXiv:2601.14377","url":"https://arxiv.org/abs/2601.14377","doi":"10.48550/arXiv.2601.14377","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["3D fields","Power spectra & summary statistics"],"m":["Generative models"],"u":["CAMELS (suite not stated)"]},"x":-0.1519,"yy":0.8559,"p3":[-0.5286,0.0813,-0.0197],"sim":{"k":"e","l":[[64,0.962],[80,0.945],[3,0.943],[95,0.94],[105,0.939]]},"c3":[-134.82,58.08,-18.35],"c2":[-176.17,46.87],"k":5,"r":[64,67,98,102,103,144,164,165],"rm":0},{"id":"2601.06290","t":"CAMELS Environments: The Impact of Local Neighbours on Galaxy Evolution across the SIMBA, IllustrisTNG, ASTRID, and Swift-EAGLE Simulations","ab":"Internal feedback from massive stars and active galactic nuclei (AGN) play a key role in galaxy evolution, but external environmental effects can also strongly influence galaxies. We investigate the impact of environment on galaxy evolution, and its dependence on baryonic physics implementation, using Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) spanning a wide range of stellar and AGN feedback implementations in the SIMBA, IllustrisTNG, ASTRID, and Swift-EAGLE galaxy formation models. We show that satellite galaxies are significantly affected by the environment in all simulation models, with their gas fraction and star formation rate (SFR) suppressed in overdense regions compared to similar mass satellites in underdense environments at $z=0$. Central galaxies are less sensitive to environment but tend to show lower gas fraction and SFR in overdense regions at low stellar mass, transitioning to higher gas fraction and SFR for massive galaxies in higher-density environments. Halo baryon fraction ($f_{\\rm B}$) and circumgalactic medium mass fraction ($f_{\\rm CGM}$) at $z=0$ show clear environmental effects. In SIMBA, low-mass haloes in overdense regions have systematically lower $f_{\\rm B}$ and $f_{\\rm CGM}$ at fixed halo mass, while Swift-EAGLE haloes in overdense regions have systematically higher $f_{\\rm B}$ and $f_{\\rm CGM}$ across the full halo mass range, and IllustrisTNG and ASTRID show opposite trends at the low and high mass ends. Environmental effects can flip at higher redshift, with SFR and $f_{\\rm B}$ increasing with local density in low-mass haloes before quenching at an increasing overdensity threshold. Our results demonstrate that the impact of environment on galaxy evolution depends significantly on galaxy formation model, and higher-density environments can either suppress or enhance star formation depending on galaxy mass and cosmic epoch.","abx":0,"nw":0,"d":"2026-01-09","dq":0,"y":2026,"au":[583,134,80,133,279,249,597,118,207],"c":5,"cs":0,"bib":"2026MNRAS.551g1529S","v":"","lk":"arXiv:2601.06290","url":"https://arxiv.org/abs/2601.06290","doi":"","tg":{"s":["SIMBA","IllustrisTNG","Astrid","Swift-EAGLE"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.5695,"yy":-0.4718,"p3":[0.2906,-0.5661,0.0337],"sim":{"k":"e","l":[[89,0.967],[124,0.952],[101,0.95],[54,0.95],[81,0.949]]},"c3":[122.44,18.74,31.92],"c2":[136.05,97.38],"k":6,"r":[25,39,78,84,89,99,101,122,124,130,133,137,145,155,157,158,164,167,171],"rm":0},{"id":"2601.06258","t":"Cosmological back-reaction of baryons on dark matter in the CAMELS simulations","ab":"Baryonic processes such as radiative cooling and feedback from massive stars and active galactic nuclei (AGN) directly redistribute baryons in the Universe but also indirectly redistribute dark matter due to changes in the gravitational potential. In this work, we investigate this \"back-reaction\" of baryons on dark matter using thousands of cosmological hydrodynamic simulations from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project, including parameter variations in the SIMBA, IllustrisTNG, ASTRID, and Swift-EAGLE galaxy formation models. Matching haloes to corresponding N-body (dark matter-only) simulations, we find that virial masses decrease owing to the ejection of baryons by feedback. Relative to N-body simulations, halo profiles show an increased dark matter density in the center (due to radiative cooling) and a decrease in density farther out (due to feedback), with both effects being strongest in SIMBA (> 450% increase at r < 0.01 Rvir). The clustering of dark matter strongly responds to changes in baryonic physics, with dark matter power spectra in some simulations from each model showing as much as 20% suppression or increase in power at k ~ 10 h/Mpc relative to N-body simulations. We find that the dark matter back-reaction depends intrinsically on cosmology (Omega_m and sigma_8) at fixed baryonic physics, and varies strongly with the details of the feedback implementation. These results emphasize the need for marginalizing over uncertainties in baryonic physics to extract cosmological information from weak lensing surveys as well as their potential to constrain feedback models in galaxy evolution.","abx":0,"nw":0,"d":"2026-01-09","dq":0,"y":2026,"au":[371,134,515,133,80,249,279,498,379,583,118,140,479,374,280,207],"c":12,"cs":0,"bib":"2026MNRAS.547ag525G","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2601.06258","url":"https://arxiv.org/abs/2601.06258","doi":"10.1093/mnras/stag525","tg":{"s":["SIMBA","IllustrisTNG","Astrid","Swift-EAGLE","N-body (dark matter only)"],"d":["Halo & galaxy catalogs","Profiles"],"m":["No ML"],"u":[]},"x":0.3865,"yy":-0.4814,"p3":[-0.0465,-0.4256,-0.0404],"sim":{"k":"e","l":[[122,0.958],[89,0.952],[138,0.95],[156,0.947],[91,0.944]]},"c3":[88.43,-23.46,23.96],"c2":[98.99,43.89],"k":1,"r":[38,54,62,72,74,75,78,81,82,84,86,89,99,101,102,103,112,119,122,123,124,130,133,137,138,141,142,148,153,154,155,156,157,158,164,166,167,169,170,171],"rm":0},{"id":"2601.07543","t":"CASCO: Cosmological and AStrophysical parameters from Cosmological simulations and Observations IV. Testing warm dark matter cosmologies with galaxy scaling relations: A joint simulation-observation study using DREAMS simulations","ab":"Small-scale discrepancies in the standard Lambda cold dark matter paradigm have motivated the exploration of alternative dark matter (DM) models, such as warm dark matter (WDM). We investigate the constraining power of galaxy scaling relations on cosmological, astrophysical, and WDM parameters through a joint analysis of hydrodynamic simulations and observational data. Our study is based on the DREAMS project and combines large-volume uniform-box simulations with high-resolution Milky Way zoom-in runs in a $Λ$WDM cosmology. To ensure consistency between the different simulation sets, we apply calibrations to account for resolution effects, allowing us to exploit the complementary strengths of the two suites. We compare simulated relations, including stellar size, DM mass and fraction within the stellar half-mass radius, and the total-to-stellar mass ratio, with two complementary galaxy samples: the SPARC catalog of nearby spirals and the LVDB catalog of dwarf galaxies in the Local Volume. Using a bootstrap-based fitting procedure, we show that key cosmological parameters ($Ω_m$, $σ_8$) and supernova feedback strength can be recovered with good accuracy, particularly from the uniform-box simulations. While the WDM particle mass remains unconstrained, the zoom-in simulations reveal subtle WDM-induced trends at low stellar masses in both the DM mass and total-to-stellar mass ratio. We also find that the galaxy stellar mass function exhibits a measurable dependence on the WDM particle mass below log10(M_*/Msun) <~ 8, which appears separable from the impact of feedback, suggesting it as a promising complementary probe. Our results highlight the importance of combining multi-resolution simulations with diverse observational datasets to jointly constrain baryonic processes and DM properties.","abx":0,"nw":1,"d":"2026-01-12","dq":0,"y":2026,"au":[354,92,560,36,3,8,401,404,254,445,207,363],"c":2,"cs":0,"bib":"2026A&A...706A.382S","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2601.07543","url":"https://arxiv.org/abs/2601.07543","doi":"10.1051/0004-6361/202556698","tg":{"s":["IllustrisTNG","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":["IllustrisTNG"]},"x":0.2203,"yy":-0.3594,"p3":[0.2267,-0.2586,0.2037],"sim":{"k":"e","l":[[99,0.941],[82,0.937],[154,0.931],[101,0.931],[75,0.93]]},"c3":[57.92,-161.63,21.47],"c2":[167.25,-99.43],"k":6,"r":[75,82,119,130],"rm":0},{"id":"2512.17964","t":"A Correlation Between Black Hole Mass and Dark Matter Halo Concentration in Cosmological Simulations","ab":"We report the discovery of a positive correlation between supermassive black hole mass and dark matter halo concentration at fixed halo mass in cosmological hydrodynamical simulations. Analyzing central galaxies in TNG100 (N = 18,954), EAGLE (N = 1,522), and CAMELS-TNG (N = 6,664), we find partial correlation coefficients of r = +0.24, +0.34, and +0.66 respectively, all highly significant (p < 10^-10). The correlation is absent in SIMBA (r = +0.01, p = 0.09), which employs a torque-limited black hole accretion model rather than the Bondi-based prescription used by the other simulations. Both TNG and EAGLE exhibit a mass-dependent sign transition: the correlation is negative or null at log(M200/Msun) < 11.5 but strongly positive at higher masses. We interpret this pattern as reflecting the coupling between Bondi accretion rates and central gas density structure: halos with higher concentration have denser cores, enabling more efficient black hole growth at fixed halo mass. The absence of the correlation in torque-limited models supports this interpretation. These results suggest that halo concentration may be a fundamental parameter governing black hole-galaxy coevolution.","abx":0,"nw":0,"d":"2025-12-18","dq":0,"y":2025,"au":[277],"c":2,"cs":0,"bib":"2025arXiv251217964N","v":"","lk":"arXiv:2512.17964","url":"https://arxiv.org/abs/2512.17964","doi":"","tg":{"s":["IllustrisTNG","SIMBA","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.1005,"yy":-0.3758,"p3":[0.2998,-0.1848,0.2302],"sim":{"k":"e","l":[[99,0.928],[17,0.926],[110,0.925],[130,0.925],[104,0.923]]},"c3":[-52.29,-65.26,92.73],"c2":[-0.16,-132.04],"k":9,"r":[171],"rm":0},{"id":"2512.24422","t":"OmniCosmos: Transferring Particle Physics Knowledge Across the Cosmos","ab":"Foundation models build an effective representations of data that can be deployed on diverse downstream tasks. Previous research developed the OmniLearned foundation model for collider physics and showed that it could significantly advance discovery potential across collider experiments. In this paper we go beyond collider physics and show that Foundation Models trained on collider data can help improve the prediction of cosmological parameters and to predict halo and galaxy velocities in different datasets from CosmoBench. This is the first time a collider physics model is shown to generalize across scientific fields.","abx":0,"nw":1,"d":"2025-12-30","dq":0,"y":2025,"au":[568,245,72],"c":8,"cs":0,"bib":"2026PRXI....123004M","v":"PRX Intelligence","lk":"arXiv:2512.24422","url":"https://arxiv.org/abs/2512.24422","doi":"10.1103/85gr-9vw6","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["Other ML"],"u":["CAMELS (suite not stated)"]},"x":-0.1612,"yy":0.2822,"p3":[-0.0443,0.3995,-0.123],"sim":{"k":"e","l":[[2,0.92],[4,0.917],[132,0.915],[85,0.914],[171,0.913]]},"c3":[72.56,-10.07,-219.54],"c2":[-1.09,187.17],"k":8,"r":[59,111,133,146,153,154,163],"rm":0},{"id":"2511.21881","t":"Intrinsic galaxy alignments in CAMELS simulations and the significant impact of baryon model","ab":"We present a detection of the intrinsic galaxy alignments in the CAMELS suite of hydrodynamic simulations. We find that the alignment amplitude depends significantly on cosmological and supernova feedback parameters - specifically $Ω_m$, $σ_8$, $A_{\\text{SN1}}$, $A_{\\text{SN2}}$- while no dependence on AGN feedback is observed (due to the limited simulation volume $(25\\,h^{-1}\\,\\text{Mpc})^3$). The dependence on $σ_8$ vanishes when projected correlation functions $w_{m+}$ are normalized by matter density correlations $w_{mm}$, consistent with predictions from linear alignment models. We find alignment amplitudes in quiescent galaxies to exceed those in star-forming galaxies by an order of magnitude. Moreover, examining orientation-only correlation functions from ellipticity-normalized galaxies $\\tilde w_{m+}$, we confirm that alignment signals retain sensitivity to supernova feedback across full, star forming, quiescent, and ellipticity-normalized samples. Finally, we find evidence that supernova feedback impacts alignment signals differently in star-forming versus quiescent populations, suggesting that distinct alignment mechanisms operate across galaxy types. Our results offer key insights for understanding galaxy formation and alignment models for future weak gravitational lensing analyses.","abx":0,"nw":0,"d":"2025-11-26","dq":0,"y":2025,"au":[135,415],"c":1,"cs":0,"bib":"2026MNRAS.546ag229B","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2511.21881","url":"https://arxiv.org/abs/2511.21881","doi":"10.1093/mnras/stag229","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs","Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":-0.023,"yy":-0.6043,"p3":[0.0779,-0.1542,0.1713],"sim":{"k":"e","l":[[103,0.942],[72,0.936],[104,0.935],[122,0.935],[17,0.934]]},"c3":[91.77,29.29,29.23],"c2":[116.68,25.21],"k":9,"r":[138,158,171],"rm":0},{"id":"2512.10222","t":"Galaxy Phase-Space and Field-Level Cosmology: The Strength of Semi-Analytic Models","ab":"Semi-analytic models are a widely used approach to simulate galaxy properties within a cosmological framework, relying on simplified yet physically motivated prescriptions. They have also proven to be an efficient alternative for generating accurate galaxy catalogs, offering a faster and less computationally expensive option compared to full hydrodynamical simulations. In this paper, we demonstrate that using only galaxy $3$D positions and radial velocities, we can train a graph neural network coupled to a moment neural network to obtain a robust machine learning based model capable of estimating the matter density parameters, $Ω_{\\rm m}$, with a precision of approximately 10%. The network is trained on ($25 h^{-1}$Mpc)$^3$ volumes of galaxy catalogs from L-Galaxies and can successfully extrapolate its predictions to other semi-analytic models (GAEA, SC-SAM, and Shark) and, more remarkably, to hydrodynamical simulations (Astrid, SIMBA, IllustrisTNG, and SWIFT-EAGLE). Our results show that the network is robust to variations in astrophysical and subgrid physics, cosmological and astrophysical parameters, and the different halo-profile treatments used across simulations. This suggests that the physical relationships encoded in the phase-space of semi-analytic models are largely independent of their specific physical prescriptions, reinforcing their potential as tools for the generation of realistic mock catalogs for cosmological parameter inference.","abx":0,"nw":0,"d":"2025-12-11","dq":0,"y":2025,"au":[410,207,438,221,194,340,357,569,606,464,544],"c":1,"cs":0,"bib":"2026ApJ..1007...34D","v":"Astrophysical Journal","lk":"arXiv:2512.10222","url":"https://arxiv.org/abs/2512.10222","doi":"10.3847/1538-4357/ae84b4","tg":{"s":["CAMELS-SAM","Astrid","SIMBA","IllustrisTNG","Swift-EAGLE","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks"],"u":[]},"x":0.1016,"yy":0.2667,"p3":[-0.0005,0.2158,0.1643],"sim":{"k":"e","l":[[153,0.96],[163,0.958],[132,0.956],[146,0.954],[133,0.954]]},"c3":[18.18,-48.31,-161.41],"c2":[20.22,117.56],"k":8,"r":[67,76,111,114,130,132,133,146,153,154,157,158,167,171],"rm":0},{"id":"2512.03038","t":"A new constraint on the $y$-distortion with FIRAS: implications for feedback models in galaxy formation and cosmic shear measurements","ab":"The $y$-type distortion of the blackbody spectrum of the cosmic microwave background radiation probes the pressure of the gas trapped in galaxy groups and clusters. We reanalyze archival data of the FIRAS instrument with an improved astrophysical foreground cleaning technique, and measure a mean $y$-distortion of $\\langle y\\rangle = (1.2\\pm 2.0) \\times 10^{-6}$ ($\\langle y\\rangle\\lesssim 5.2\\times 10^{-6}$ at 95\\% C.L.), a factor of $\\sim 3$ tighter than the original FIRAS results. This measurement directly rules out many models of baryonic feedback as implemented in cosmological hydrodynamical simulations, mostly using information in objects with mass $M\\lesssim 10^{14} {\\rm M}_{\\odot}$. We discuss its implications for the analysis of cosmic shear and kinetic Sunyaev-Zel'dovich effect data, and future spectral distortion experiments.","abx":0,"nw":0,"d":"2025-12-02","dq":0,"y":2025,"au":[224,199,33,255,118,330,140],"c":8,"cs":0,"bib":"2025arXiv251203038F","v":"","lk":"arXiv:2512.03038","url":"https://arxiv.org/abs/2512.03038","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["Synthetic observables"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":0.3124,"yy":-0.7381,"p3":[-0.1847,-0.3242,0.3633],"sim":{"k":"e","l":[[19,0.937],[147,0.933],[160,0.932],[69,0.921],[5,0.918]]},"c3":[96.52,-65.67,13.07],"c2":[118.81,-45.78],"k":1,"r":[130,160,171],"rm":0},{"id":"2511.08438","t":"Galactification: painting galaxies onto dark matter only simulations using a transformer-based model","ab":"Connecting the formation and evolution of galaxies to the large-scale structure is crucial for interpreting cosmological observations. While hydrodynamical simulations accurately model the correlated properties of galaxies, they are computationally prohibitive to run over volumes that match modern surveys. We address this by developing a framework to rapidly generate mock galaxy catalogs conditioned on inexpensive dark-matter-only simulations. We present a multi-modal, transformer-based model that takes 3D dark matter density and velocity fields as input, and outputs a corresponding point cloud of galaxies with their physical properties. We demonstrate that our trained model faithfully reproduces a variety of galaxy summary statistics and correctly captures their variation with changes in the underlying cosmological and astrophysical parameters, making it the first accelerated forward model to capture all the relevant galaxy properties, their full spatial distribution, and their conditional dependencies in hydrosimulations.","abx":0,"nw":0,"d":"2025-11-11","dq":0,"y":2025,"au":[512,118,112,73],"c":6,"cs":0,"bib":"2025arXiv251108438P","v":"arXiv.org","lk":"arXiv:2511.08438","url":"https://arxiv.org/abs/2511.08438","doi":"10.48550/arXiv.2511.08438","tg":{"s":["CAMELS (suite not stated)"],"d":["3D fields","Halo & galaxy catalogs"],"m":["Generative models","Other ML"],"u":[]},"x":-0.0632,"yy":0.7244,"p3":[-0.312,0.007,0.2674],"sim":{"k":"e","l":[[92,0.955],[44,0.951],[80,0.95],[98,0.948],[5,0.948]]},"c3":[38.69,-71.69,34.28],"c2":[31.89,-62.54],"k":5,"r":[84,92,123,130,171],"rm":0},{"id":"2511.11787","t":"Towards Mitigating Systematics in Large-Scale Surveys via Few-Shot Optimal Transport-Based Feature Alignment","ab":"Systematics contaminate observables, leading to distribution shifts relative to theoretically simulated signals-posing a major challenge for using pre-trained models to label such observables. Since systematics are often poorly understood and difficult to model, removing them directly and entirely may not be feasible. To address this challenge, we propose a novel method that aligns learned features between in-distribution (ID) and out-of-distribution (OOD) samples by optimizing a feature-alignment loss on the representations extracted from a pre-trained ID model. We first experimentally validate the method on the MNIST dataset using possible alignment losses, including mean squared error and optimal transport, and subsequently apply it to large-scale maps of neutral hydrogen. Our results show that optimal transport is particularly effective at aligning OOD features when parity between ID and OOD samples is unknown, even with limited data-mimicking real-world conditions in extracting information from large-scale surveys. Our code is available at https://github.com/sultan-hassan/feature-alignment-for-OOD-generalization.","abx":0,"nw":1,"d":"2025-11-14","dq":0,"y":2025,"au":[532,499,73],"c":0,"cs":0,"bib":"2025arXiv251111787H","v":"arXiv.org","lk":"arXiv:2511.11787","url":"https://arxiv.org/abs/2511.11787","doi":"10.48550/arXiv.2511.11787","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["CNN","Other ML"],"u":["CNN"]},"x":-0.5414,"yy":0.7679,"p3":[-0.2435,0.5367,-0.2957],"sim":{"k":"e","l":[[106,0.936],[85,0.934],[142,0.924],[164,0.923],[26,0.919]]},"c3":[-27.51,-52.43,258.96],"c2":[35.53,-277.15],"k":0,"r":[],"rm":1},{"id":"2510.26593","t":"Hybrid Physical-Neural Simulator for Fast Cosmological Hydrodynamics","ab":"Cosmological field-level inference requires differentiable forward models that solve the challenging dynamics of gas and dark matter under hydrodynamics and gravity. We propose a hybrid approach where gravitational forces are computed using a differentiable particle-mesh solver, while the hydrodynamics are parametrized by a neural network that maps local quantities to an effective pressure field. We demonstrate that our method improves upon alternative approaches, such as an Enthalpy Gradient Descent baseline, both at the field and summary-statistic level. The approach is furthermore highly data efficient, with a single reference simulation of cosmological structure formation being sufficient to constrain the neural pressure model. This opens the door for future applications where the model is fit directly to observational data, rather than a training set of simulations.","abx":0,"nw":0,"d":"2025-10-30","dq":0,"y":2025,"au":[57,546,208],"c":1,"cs":0,"bib":"2025arXiv251026593T","v":"arXiv.org","lk":"arXiv:2510.26593","url":"https://arxiv.org/abs/2510.26593","doi":"10.48550/arXiv.2510.26593","tg":{"s":["CAMELS (suite not stated)"],"d":["3D fields"],"m":["Other ML"],"u":["CAMELS (suite not stated)"]},"x":-0.5047,"yy":0.1558,"p3":[-0.4065,0.3313,0.0855],"sim":{"k":"e","l":[[107,0.951],[4,0.947],[150,0.944],[27,0.94],[44,0.938]]},"c3":[-62.63,-46.51,44.23],"c2":[-46.29,-79.74],"k":4,"r":[55,130,150,171],"rm":0},{"id":"2510.26851","t":"jFoF: GPU Cluster Finding with Gradient Propagation","ab":"We present jFoF, a fully GPU-native Friends-of-Friends (FoF) halo finder designed for both high-performance simulation analysis and differentiable modeling. Implemented in JAX, jFoF achieves end-to-end acceleration by performing all neighbor searches, label propagation, and group construction directly on GPUs, eliminating costly host--device transfers. We introduce two complementary neighbor-search strategies, a standard k-d tree and a novel linked-cell grid, and demonstrate that jFoF attains up to an order-of-magnitude speedup compared to optimized CPU implementations while maintaining consistent halo catalogs. Beyond performance, jFoF enables gradient propagation through discrete halo-finding operations via both frozen-assignment and topological optimization modes. Using a topological optimization approach via a REINFORCE-style estimator, our approach allows smooth optimization of halo connectivity and membership, bridging continuous simulation fields with discrete structure catalogs. These capabilities make jFoF a foundation for differentiable inference, enabling end-to-end, gradient-based optimization of structure formation models within GPU-accelerated astrophysical pipelines. We make our code publicly available at https://github.com/bhorowitz/jFOF/.","abx":0,"nw":0,"d":"2025-10-30","dq":0,"y":2025,"au":[70,18],"c":10,"cs":0,"bib":"2026MNRAS.550g1151H","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2510.26851","url":"https://arxiv.org/abs/2510.26851","doi":"10.1093/mnras/stag1151","tg":{"s":["CAMELS (suite not stated)"],"d":["Particle snapshots","Halo & galaxy catalogs"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":0.0749,"yy":0.068,"p3":[0.2542,0.0215,-0.0373],"sim":{"k":"e","l":[[12,0.933],[151,0.931],[158,0.929],[11,0.927],[38,0.926]]},"c3":[-38.97,45.17,96.98],"c2":[23.22,-138.56],"k":4,"r":[127,171],"rm":0},{"id":"2510.19224","t":"BaryonBridge: Stochastic Interpolant Model for Fast Hydrodynamical Simulations","ab":"Constructing a general-purpose framework for mapping between dark matter simulations and observable hydrodynamical simulation outputs is a long-standing problem in modern astrophysics. In this work, we present a new approach utilizing stochastic interpolants to map between cheap fast particle mesh simulations and baryonic quantities in three dimensions, requiring a total of 7 GPU minutes per 256^3 grid size simulation. Using the CAMELS multifield dataset, we are able to condition our mapping on both cosmological and astrophysical properties. We focus this work on hydrodynamical quantities suitable for Lya observables finding excellent agreement up to small spatial scales, k ~ 10.0 (h^(-1) Mpc) at z=2.0, for Lya flux statistics. Our approach is fully convolutional, allowing training on comparatively small volumes and application to larger volumes, which was tested on TNG50.","abx":0,"nw":0,"d":"2025-10-22","dq":0,"y":2025,"au":[70,101,433],"c":8,"cs":0,"bib":"2025arXiv251019224H","v":"","lk":"arXiv:2510.19224","url":"https://arxiv.org/abs/2510.19224","doi":"","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["3D fields","Synthetic observables"],"m":["Generative models"],"u":[]},"x":-0.0808,"yy":0.5511,"p3":[-0.1037,0.174,-0.2886],"sim":{"k":"e","l":[[87,0.945],[171,0.94],[167,0.94],[12,0.936],[4,0.935]]},"c3":[-151.47,1.73,4.16],"c2":[-159.43,-35.12],"k":4,"r":[92,98,102,107,112,150,165,171],"rm":0},{"id":"title:leveragingmachinelearningandhydrodynamicsimulationsofgalaxyformationtoilluminate","t":"Leveraging Machine Learning and Hydrodynamic Simulations of Galaxy Formation to Illuminate the Effects of Incident Radiation Fields on Atomic Gas Cooling and Heating Functions","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[139],"c":0,"cs":2,"bib":"","v":"","lk":"PhD Thesis","url":"https://backend.production.deepblue-documents.lib.umich.edu/server/api/core/bitstreams/99e25db7-e1e5-4d4e-9ded-acc8e33c56f2/content","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":[],"m":["Other ML"],"u":["CAMELS (suite not stated)","Other ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.007,"yy":-0.1177,"p3":[-0.1687,-0.1297,-0.0305],"sim":{"k":"w","l":[[39,0.103],[77,0.099],[123,0.097],[94,0.093],[84,0.085]]},"c3":[-21.32,6.06,247.77],"c2":[119.25,-239.17],"k":10,"r":[],"rm":1},{"id":"2509.18260","t":"Exploring the impact of AGN feedback model variations on the Lyman-$α$ Forest Flux Power Spectrum","ab":"We study the effects of varying different Active Galactic Nuclei (AGN) feedback parameters on the Lyman-$α$ (Ly$α$) forest 1D transmitted flux power spectrum (P1D). We use the Cosmological and Astrophysics with Machine Learning Simulations (CAMELS) suite to explore variations on the Simba simulation AGN feedback model. The parameters explored include AGN momentum flux, AGN jet speed, supermassive black hole (SMBH) radiative efficiency, jet velocity threshold, and minimum SMBH mass needed to produce jet feedback. Although all parameters affect the P1D, this work explores the radiative efficiency, jet velocity threshold, and minimum SMBH mass in this context for the first time and finds the following results: Primarily, the most massive SMBHs impact the Ly$α$ forest through the jet feedback mode. While heating AGN jets to the virial temperature at injection aids in the removal of neutral hydrogen from the Ly$α$ forest, this heating also inhibits further jet feedback. Similar behaviors are seen when varying the SMBH radiative efficiency, with higher values resulting in a suppression of SMBH growth and thus a later reduction in AGN feedback and lower values directly reducing the impact of AGN feedback on the Ly$α$ forest P1D. These results imply that increasing the AGN feedback strength in the Simba simulation model suppresses the Ly$α$ forest P1D, but only if the feedback does not impact the number of massive jet producing BHs. Future studies of AGN feedback models will require careful exploration of the unique aspects of the specific subgrid model, and how they interact with one another, for a complete understanding of the potential astrophysical impacts of SMBH feedback.","abx":0,"nw":0,"d":"2025-09-22","dq":0,"y":2025,"au":[382,383,78,528,518],"c":1,"cs":0,"bib":"2026ApJ..1002...63P","v":"","lk":"arXiv:2509.18260","url":"https://arxiv.org/abs/2509.18260","doi":"","tg":{"s":["SIMBA"],"d":["Power spectra & summary statistics","Synthetic observables"],"m":["No ML"],"u":[]},"x":0.6076,"yy":-0.3466,"p3":[0.0805,-0.4801,-0.1302],"sim":{"k":"e","l":[[124,0.961],[145,0.949],[130,0.943],[89,0.94],[31,0.938]]},"c3":[73.73,-21.34,92.99],"c2":[75.81,-42.2],"k":1,"r":[39,89,124,130,137,145,158,171],"rm":0},{"id":"2509.01881","t":"One latent to fit them all: a unified representation of baryonic feedback on matter distribution","ab":"Accurate and parsimonious quantification of baryonic feedback on matter distribution is of crucial importance for understanding both cosmology and galaxy formation from observational data. This is, however, challenging given the large discrepancy among different models of galaxy formation simulations, and their distinct subgrid physics parameterizations. Using 5,072 simulations from 4 different models covering broad ranges in their parameter spaces, we find a unified 2D latent representation. Compared to the simulations and other phenomenological models, our representation is independent of both time and cosmology, much lower-dimensional, and disentangled in its impacts on the matter power spectra. The common latent space facilitates the comparison of parameter spaces of different models and is readily interpretable by correlation with each. The two latent dimensions provide a complementary representation of baryonic effects, linking black hole and supernova feedback to distinct and interpretable impacts on both the matter power spectrum, and field, level. Our approach enables developing robust and economical analytic models for optimal gain of physical information from data, and is generalizable to other fields with significant modeling uncertainty.","abx":0,"nw":0,"d":"2025-09-02","dq":0,"y":2025,"au":[513,591,515,207,77,575,588],"c":6,"cs":0,"bib":"2026ApJ...996L..41L","v":"Astrophysical Journal Letters","lk":"arXiv:2509.01881","url":"https://arxiv.org/abs/2509.01881","doi":"10.3847/2041-8213/ae3084","tg":{"s":["CAMELS (suite not stated)"],"d":["Power spectra & summary statistics"],"m":["Other ML"],"u":[]},"x":-0.0311,"yy":-0.3661,"p3":[0.0663,0.0521,0.4714],"sim":{"k":"e","l":[[32,0.938],[110,0.936],[14,0.931],[17,0.931],[123,0.93]]},"c3":[76.2,91.13,16.65],"c2":[58.14,-30.59],"k":3,"r":[62,78,99,103,130,171],"rm":0},{"id":"2508.21152","t":"How does feedback affect the star formation histories of galaxies?","ab":"Star formation in galaxies is regulated by the interplay of a range of processes that shape the multiphase gas in the interstellar and circumgalactic media. Using the CAMELS suite of cosmological simulations, we study the effects of varying feedback and cosmology on the average star formation histories (SFHs) of galaxies at $z\\sim0$ across the IllustrisTNG, SIMBA and ASTRID galaxy formation models. We find that galaxy SFHs in all three models are sensitive to changes in stellar feedback, which affects the efficiency of baryon cycling and the rates at which central black holes grow, while effects of varying AGN feedback depend on model-dependent implementations of black hole seeding, accretion and feedback. We also find strong interaction terms that couple stellar and AGN feedback, usually by regulating the amount of gas available for the central black hole to accrete. Using a double power-law to describe the average SFHs, we derive a general set of equations relating the shape of the SFHs to physical quantities like baryon fraction and black hole mass across all three models. We find that a single set of equations (albeit with different coefficients) can describe the SFHs across all three CAMELS models, with cosmology dominating the SFH at early times, followed by halo accretion, and feedback and baryon cycling at late times. Galaxy SFHs provide a novel, complementary probe to constrain cosmology and feedback, and can connect the observational constraints from current and upcoming galaxy surveys with the physical mechanisms responsible for regulating galaxy growth and quenching.","abx":0,"nw":0,"d":"2025-08-28","dq":0,"y":2025,"au":[298,549,228,464,289,134,530,479,62,515,532,325,114,118,80,96,340,326,285,501,383,207,276],"c":16,"cs":0,"bib":"2025ApJ...994..174I","v":"Astrophysical Journal","lk":"arXiv:2508.21152","url":"https://arxiv.org/abs/2508.21152","doi":"10.3847/1538-4357/ae0334","tg":{"s":["IllustrisTNG","SIMBA","Astrid"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.627,"yy":-0.5036,"p3":[0.2172,-0.581,0.1733],"sim":{"k":"e","l":[[89,0.964],[124,0.955],[101,0.951],[38,0.95],[81,0.945]]},"c3":[112.44,-87.29,26.1],"c2":[79.74,-60.68],"k":1,"r":[81,84,89,119,122,123,124,130,133,137,138,140,145,154,156,158,165,171],"rm":0},{"id":"2508.05744","t":"Detecting Model Misspecification in Cosmology with Scale-Dependent Normalizing Flows","ab":"Current and upcoming cosmological surveys will produce unprecedented amounts of high-dimensional data, which require complex high-fidelity forward simulations to accurately model both physical processes and systematic effects which describe the data generation process. However, validating whether our theoretical models accurately describe the observed datasets remains a fundamental challenge. An additional complexity to this task comes from choosing appropriate representations of the data which retain all the relevant cosmological information, while reducing the dimensionality of the original dataset. In this work we present a novel framework combining scale-dependent neural summary statistics with normalizing flows to detect model misspecification in cosmological simulations through Bayesian evidence estimation. By conditioning our neural network models for data compression and evidence estimation on the smoothing scale, we systematically identify where theoretical models break down in a data-driven manner. We demonstrate a first application to our approach using matter and gas density fields from three CAMELS simulation suites with different subgrid physics implementations.","abx":0,"nw":0,"d":"2025-08-07","dq":0,"y":2025,"au":[20,101,516],"c":5,"cs":0,"bib":"2025MLS&T...6d5020A","v":"Machine Learning: Science and Technology","lk":"arXiv:2508.05744","url":"https://arxiv.org/abs/2508.05744","doi":"10.1088/2632-2153/ae107d","tg":{"s":["CAMELS (suite not stated)"],"d":["Power spectra & summary statistics"],"m":["Normalizing flows","Other ML"],"u":["CAMELS (suite not stated)"]},"x":-0.7398,"yy":0.3385,"p3":[-0.1309,0.4244,0.0468],"sim":{"k":"e","l":[[120,0.952],[86,0.945],[71,0.942],[123,0.938],[67,0.937]]},"c3":[-32.93,-45.47,-57.58],"c2":[-54.73,-24.31],"k":2,"r":[86,95,120,130,142,165,171],"rm":0},{"id":"2507.21682","t":"Probabilistic cosmological inference on HI tomographic data","ab":"We explore the possibility of retrieving cosmological information from 21-cm tomographic data at intermediate redshift. The first step in our approach consists of training an encoder, composed of several three dimensional convolutional layers, to cast the neutral hydrogen 3D data into a lower dimension latent space. Once pre-trained, the featurizer is able to generate 3D grid representations which, in turn, will be mapped onto cosmology ($Ω_{\\rm m}$, $σ_{8}$) via likelihood-free inference. For the latter, which is framed as a density estimation problem, we consider a Bayesian approximation method which exploits the capacity of Masked Autoregressive Flow to estimate the posterior. It is found that the representations learned by the deep encoder are separable in latent space. Results show that the neural density estimator, trained on the latent codes, is able to constrain cosmology with a precision of $R^2 \\ge 0.91$ on all parameters and that most of the ground truth of the instances in the test set fall within $1σ$ uncertainty. It is established that the posterior uncertainty from the density estimator is reasonably calibrated. We also investigate the robustness of the feature extractor by using it to compress out-of-distribution dataset, that is either from a different simulation or from the same simulation but at different redshift. We find that, while trained on the latent codes corresponding to different types of out-of-distribution dataset, the probabilistic model is still reasonably capable of constraining cosmology, with $R^2 \\ge 0.80$ in general. This highlights both the predictive power of the density estimator considered in this work and the meaningfulness of the latent codes retrieved by the encoder. We believe that the approach prescribed in this proof of concept will be of great use when analyzing 21-cm data from various surveys in the near future.","abx":0,"nw":0,"d":"2025-07-29","dq":0,"y":2025,"au":[499],"c":0,"cs":0,"bib":"2025Ap&SS.370...76A","v":"Astrophysics and Space Science","lk":"arXiv:2507.21682","url":"https://arxiv.org/abs/2507.21682","doi":"10.1007/s10509-025-04470-3","tg":{"s":["CAMELS (suite not stated)"],"d":["3D fields"],"m":["CNN","Simulation-based inference","Normalizing flows"],"u":[]},"x":-0.4866,"yy":0.7268,"p3":[-0.1709,0.5401,-0.2502],"sim":{"k":"e","l":[[85,0.956],[113,0.942],[164,0.94],[27,0.939],[71,0.937]]},"c3":[-56.54,66.05,-102.36],"c2":[-94.48,105.2],"k":0,"r":[113,149,158,165,167,171],"rm":0},{"id":"2507.16816","t":"Stellar Mass-Dispersion Measure Correlations Constrain Baryonic Feedback in Fast Radio Burst Host Galaxies","ab":"Low redshift fast radio bursts (FRBs) provide robust measurements of the host-galaxy contribution to the dispersion measure (DM), which can constrain the circumgalactic medium (CGM) of the hosts. We curate a sample of 20 nearby FRBs with low scattering timescales and face-on host galaxies with stellar masses ranging from $10^9 < M^* / M_\\odot < 10^{11}$. We fit the distribution of the host galaxy DM to a quadratic model as a function of stellar mass with a mass-independent scatter and find that the more massive the host, the lower its host DM. We report that this relation has a negative slope of $m = -97 \\pm 44$ pc/cm$^{-3}$ per dex in stellar mass. We compare this measurement to similar fits to three sub-grid models implemented in the CAMELS suite of simulations from Astrid, IllustrisTNG, and SIMBA and find that fine-tuning of the host ISM contribution as a function of stellar mass is required in order to reconcile the observational data with the predictions of the fiducial CAMELS-Astrid model. More generally, models which attribute a positive correlation between stellar mass and host dispersion measure ($m > 0$) to the CGM are in tension with our measurement. We show that this conclusion is robust to a wide range of assumptions, such as the offset distribution of FRBs from their hosts and the statistics of the cosmic contribution to the DM budget along each sightline. Our results indirectly imply a lower limit on the strength of baryonic feedback in the Local Universe $(z < 0.2)$ in isolated $\\sim L^*$ halos, complementing results from weak lensing surveys and kSZ observations which target higher halo mass and redshift ranges.","abx":0,"nw":0,"d":"2025-07-22","dq":0,"y":2025,"au":[94,533,249,133,308,338,17,510,305,31,66,426,481,375,337,83,304,14,259,378,297,302,236],"c":23,"cs":0,"bib":"2025ApJ...991L..25L","v":"","lk":"arXiv:2507.16816","url":"https://arxiv.org/abs/2507.16816","doi":"","tg":{"s":["Astrid","IllustrisTNG","SIMBA"],"d":["Halo & galaxy catalogs","Synthetic observables"],"m":["No ML"],"u":[]},"x":0.4286,"yy":-0.9545,"p3":[-0.1631,-0.5742,0.2569],"sim":{"k":"w","l":[[100,0.334],[83,0.298],[69,0.216],[101,0.214],[5,0.209]]},"c3":[86.99,80.65,84.67],"c2":[173.03,114.98],"k":1,"r":[69,78,83,89,100,101,130,155,158,171],"rm":0},{"id":"2507.12530","t":"Reconstruction of Dark Matter and Baryon Density From Galaxies: A Comparison of Linear, Halo Model and Machine Learning-Based Methods","ab":"For many analyses in cosmology it is necessary to reconstruct the likely distribution of unobserved fields, such as dark matter or non-luminous baryons, from observed luminous tracers. The dominant approach in cosmology has been to use the so-called halo model, which assumes radially symmetric profiles centered around luminous tracers such as galaxies. More recently, field-level machine learning methods have been proposed that can learn to estimate the unobserved field after being trained on simulations. However, it is unclear whether machine learning methods indeed significantly improve over linear methods or the halo model. In this paper we make a systematic comparison of different approaches to reconstruct dark matter and non-luminous baryons, from galaxy data using the CAMELS simulations. These simulations are in a $25\\ \\texttt{Mpc/h}$ box, allowing us to compare performance on the mildly non-linear scales $(k\\sim 0.4\\ \\mathrm{h/Mpc})$ down to the size of individual halos. We find the best results using a combined GNN-CNN approach. We also provide a general analysis and visualization of the relationship of matter, non-luminous baryons, halos, and galaxies in these simulations to interpret our results.","abx":0,"nw":0,"d":"2025-07-16","dq":0,"y":2025,"au":[281,601,370,399],"c":5,"cs":0,"bib":"2026JCAP...03..037K","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2507.12530","url":"https://arxiv.org/abs/2507.12530","doi":"10.1088/1475-7516/2026/03/037","tg":{"s":["CAMELS (suite not stated)"],"d":["3D fields","Halo & galaxy catalogs"],"m":["Other ML"],"u":[]},"x":0.0636,"yy":0.6679,"p3":[-0.0591,-0.0669,-0.0128],"sim":{"k":"e","l":[[98,0.944],[146,0.943],[87,0.943],[11,0.942],[90,0.942]]},"c3":[-59.63,-46.9,-109.79],"c2":[-102.8,27.36],"k":8,"r":[70,87,98,103,109,130,153,158,163,165,166,167,171],"rm":0},{"id":"2507.03707","t":"CosmoBench: A Multiscale, Multiview, Multitask Cosmology Benchmark for Geometric Deep Learning","ab":"Cosmological simulations provide a wealth of data in the form of point clouds and directed trees. A crucial goal is to extract insights from this data that shed light on the nature and composition of the Universe. In this paper we introduce CosmoBench, a benchmark dataset curated from state-of-the-art cosmological simulations whose runs required more than 41 million core-hours and generated over two petabytes of data. CosmoBench is the largest dataset of its kind: it contains 34 thousand point clouds from simulations of dark matter halos and galaxies at three different length scales, as well as 25 thousand directed trees that record the formation history of halos on two different time scales. The data in CosmoBench can be used for multiple tasks -- to predict cosmological parameters from point clouds and merger trees, to predict the velocities of individual halos and galaxies from their collective positions, and to reconstruct merger trees on finer time scales from those on coarser time scales. We provide several baselines on these tasks, some based on established approaches from cosmological modeling and others rooted in machine learning. For the latter, we study different approaches -- from simple linear models that are minimally constrained by symmetries to much larger and more computationally-demanding models in deep learning, such as graph neural networks. We find that least-squares fits with a handful of invariant features sometimes outperform deep architectures with many more parameters and far longer training time. Still there remains tremendous potential to improve these baselines by combining machine learning and cosmology to fully exploit the data. CosmoBench sets the stage for bridging cosmology and geometric deep learning at scale. We invite the community to push the frontier of scientific discovery by engaging with this dataset, available at https://cosmobench.streamlit.app","abx":0,"nw":0,"d":"2025-07-04","dq":0,"y":2025,"au":[427,470,290,18,107,114,340,328,207],"c":12,"cs":0,"bib":"2025arXiv250703707H","v":"Neural Information Processing Systems","lk":"arXiv:2507.03707","url":"https://arxiv.org/abs/2507.03707","doi":"10.48550/arXiv.2507.03707","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs","Merger trees"],"m":["Graph neural networks"],"u":[]},"x":0.0817,"yy":-0.128,"p3":[0.366,0.2073,0.0625],"sim":{"k":"e","l":[[154,0.941],[99,0.936],[153,0.936],[65,0.935],[15,0.934]]},"c3":[12.81,-10.67,-178.37],"c2":[-2.69,86.72],"k":4,"r":[65,67,111,133,146,153,154,157,163,171],"rm":0},{"id":"2507.01820","t":"The Cosmological analysis of X-ray cluster surveys VII. Bypassing scaling relations with Lagrangian Deep Learning and Simulation-based inference","ab":"Galaxy clusters, the pinnacle of structure formation in our universe, are a powerful cosmological probe. Several approaches have been proposed to express cluster number counts, but all these methods rely on empirical explicit scaling relations that link observed properties to the total cluster mass. These scaling relations are over-parametrised, inducing some degeneracy with cosmology. Moreover, they do not provide a direct handle on the numerous non-gravitational phenomena that affect the physics of the intra-cluster medium. We present a proof-of-concept to model cluster number counts, that bypasses the explicit use of scaling relations. We rather implement the effect of several astrophysical processes to describe the cluster properties. We then evaluate the performances of this modelling for the cosmological inference. We developed an accelerated machine learning baryonic field-emulator, built upon the Lagrangian Deep Learning method and trained on the CAMELS simulations. We then created a pipeline that simulates cluster counts in terms of XMM observable quantities. We finally compare the performances of our model, with that involving scaling relations, for the purpose of cosmological inference based on simulations. Our model correctly reproduces the cluster population from the calibration simulations at the fiducial parameter values, and allows us to constrain feedback mechanisms. The cosmological-inference analyses indicate that our simulation-based model is less degenerate than the approach using scaling relations. This novel approach to model observed cluster number counts from simulations opens interesting perspectives for cluster cosmology. It has the potential to overcome the limitations of the standard approach, provided that the resolution and the volume of the simulations will allow a most realistic implementation of the complex phenomena driving cluster evolution.","abx":0,"nw":0,"d":"2025-07-02","dq":0,"y":2025,"au":[420,361,208,581],"c":8,"cs":0,"bib":"2025A&A...701A.110C","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2507.01820","url":"https://arxiv.org/abs/2507.01820","doi":"10.1051/0004-6361/202453553","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Synthetic observables"],"m":["Emulators & regression ML","Simulation-based inference"],"u":["CAMELS (suite not stated)"]},"x":0.2199,"yy":0.0574,"p3":[0.2915,0.1947,0.0117],"sim":{"k":"e","l":[[152,0.949],[11,0.944],[154,0.943],[153,0.942],[12,0.942]]},"c3":[41.84,59.24,33.31],"c2":[22.5,57.82],"k":6,"r":[89,99,124,130,158,164,165,171],"rm":0},{"id":"title:investigatingtheparametersdrivingblackholegalaxycoevolution","t":"Investigating the Parameters Driving Black Hole-Galaxy Coevolution","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[463],"c":0,"cs":2,"bib":"","v":"","lk":"University Scholar Project","url":"https://digitalcommons.lib.uconn.edu/cgi/viewcontent.cgi?article=1111&context=usp_projects","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":[],"m":[],"u":["CAMELS (suite not stated)"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.3653,"yy":-0.4743,"p3":[0.2696,-0.3581,0.1729],"sim":{"k":"w","l":[[41,0.258],[34,0.108],[54,0.107],[126,0.083],[124,0.07]]},"c3":[-119.61,-102.18,193.51],"c2":[-138.24,-218.08],"k":1,"r":[],"rm":1},{"id":"2506.08783","t":"syren-baryon: Analytic emulators for the impact of baryons on the matter power spectrum","ab":"Baryonic physics has a considerable impact on the distribution of matter in our Universe on scales probed by current and future cosmological surveys, acting as a key systematic in such analyses. We seek simple symbolic parametrisations for the impact of baryonic physics on the matter power spectrum for a range of physically motivated models, as a function of wavenumber, redshift, cosmology, and parameters controlling the baryonic feedback. We use symbolic regression to construct analytic approximations for the ratio of the matter power spectrum in the presence of baryons to that without such effects. We obtain separate functions of each of four distinct sub-grid prescriptions of baryonic physics from the CAMELS suite of hydrodynamical simulations (Astrid, IllustrisTNG, SIMBA and Swift-EAGLE) as well as for a baryonification algorithm. We also provide functions which describe the uncertainty on these predictions, due to both the stochastic nature of baryonic physics and the errors on our fits. The error on our approximations to the hydrodynamical simulations is comparable to the sample variance estimated through varying initial conditions, and our baryonification expression has a root mean squared error of better than one percent, although this increases on small scales. These errors are comparable to those of previous numerical emulators for these models. Our expressions are enforced to have the physically correct behaviour on large scales and at high redshift. Due to their analytic form, we are able to directly interpret the impact of varying cosmology and feedback parameters, and we can identify parameters which have little to no effect. Each function is based on a different implementation of baryonic physics, and can therefore be used to discriminate between these models when applied to real data. We provide publicly available code for all symbolic approximations found.","abx":0,"nw":0,"d":"2025-06-10","dq":0,"y":2025,"au":[343,144,218,238,447],"c":11,"cs":0,"bib":"2025A&A...701A.284K","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2506.08783","url":"https://arxiv.org/abs/2506.08783","doi":"10.1051/0004-6361/202555887","tg":{"s":["Astrid","IllustrisTNG","SIMBA","Swift-EAGLE"],"d":["Power spectra & summary statistics"],"m":["Symbolic regression"],"u":[]},"x":-0.0699,"yy":-0.4965,"p3":[0.0631,0.1298,0.1705],"sim":{"k":"e","l":[[103,0.954],[171,0.953],[12,0.949],[32,0.948],[130,0.946]]},"c3":[119.39,41.4,-60.84],"c2":[95.69,99.77],"k":3,"r":[76,84,103,122,130,137,138,146,147,153,158,163,166,171],"rm":0},{"id":"2506.06087","t":"Multilevel neural simulation-based inference","ab":"Neural simulation-based inference (SBI) is a popular set of methods for Bayesian inference when models are only available in the form of a simulator. These methods are widely used in the sciences and engineering, where writing down a likelihood can be significantly more challenging than constructing a simulator. However, the performance of neural SBI can suffer when simulators are computationally expensive, thereby limiting the number of simulations that can be performed. In this paper, we propose a novel approach to neural SBI which leverages multilevel Monte Carlo techniques for settings where several simulators of varying cost and fidelity are available. We demonstrate through both theoretical analysis and extensive experiments that our method can significantly enhance the accuracy of SBI methods given a fixed computational budget.","abx":0,"nw":0,"d":"2025-06-06","dq":0,"y":2025,"au":[598,63,415,210],"c":8,"cs":0,"bib":"2025arXiv250606087H","v":"Neural Information Processing Systems","lk":"arXiv:2506.06087","url":"https://arxiv.org/abs/2506.06087","doi":"10.48550/arXiv.2506.06087","tg":{"s":["CAMELS (suite not stated)"],"d":[],"m":["Simulation-based inference"],"u":["CAMELS (suite not stated)"]},"x":-0.5579,"yy":0.4392,"p3":[-0.3504,0.5059,-0.0382],"sim":{"k":"e","l":[[26,0.925],[66,0.914],[27,0.9],[107,0.899],[92,0.898]]},"c3":[14.37,132.7,-36.11],"c2":[-13.29,180.93],"k":2,"r":[66,158,171],"rm":0},{"id":"2506.08086","t":"Large, fast and accurate HI intensity maps with latent overlap diffusion","ab":"The distribution of 21 cm emission from neutral hydrogen is a powerful cosmological and astrophysical probe, as it traces the underlying dark matter and cold gas distributions throughout cosmic times. However, the prediction of observable signals is hindered by the large computational costs of the required hydrodynamic simulations. We introduce a novel machine learning pipeline that, once trained on a hydrodynamical simulation, is able to generate both halo mass density maps and the three-dimensional 21 cm brightness temperature signal, starting from a dark matter-only simulation. We use an attention-based ResUNet (HALO) to predict dark matter halo maps, which are then processed through a trained conditional variational diffusion model (LODI) to produce 21 cm brightness temperature maps. LODI is trained on smaller sub-volumes that are then seamlessly combined in 512-times larger volume using a new method, called `latent overlap'. We demonstrate that, once trained on 25^3 (Mpc/h)^3 volume simulations, we are able to predict the 21 cm power spectrum on an unseen dark matter map (with the same cosmology) to within 10% for wavenumbers k <= 10 h Mpc^-1, deep inside the non-linear regime, with a computational effort of the order of two minutes. While demonstrated on this specific volume, our approach is designed to be scalable to arbitrarily large simulations.","abx":0,"nw":1,"d":"2025-06-09","dq":0,"y":2025,"au":[503,476,369],"c":8,"cs":0,"bib":"2026MNRAS.545f2071M","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2506.08086","url":"https://arxiv.org/abs/2506.08086","doi":"10.1093/mnras/staf2071","tg":{"s":["IllustrisTNG","N-body (dark matter only)"],"d":["3D fields","Power spectra & summary statistics"],"m":["Generative models","CNN"],"u":["IllustrisTNG"]},"x":-0.0946,"yy":0.8535,"p3":[-0.325,-0.0031,0.0531],"sim":{"k":"e","l":[[37,0.962],[80,0.939],[95,0.937],[11,0.933],[92,0.932]]},"c3":[-161.85,22.23,-57.6],"c2":[-190.29,70.47],"k":5,"r":[98,164,165],"rm":0},{"id":"2505.23904","t":"Cosmology with Topological Deep Learning","ab":"The standard cosmological model with cold dark matter posits a hierarchical formation of structures. We introduce topological neural networks (TNNs), implemented as message-passing neural networks on higher-order structures, to effectively capture the topological information inherent in these hierarchies that traditional graph neural networks (GNNs) fail to account for. Our approach not only considers the vertices and edges that comprise a graph but also extends to higher-order cells such as tetrahedra, clusters, and hyperedges. This enables message-passing between these heterogeneous structures within a combinatorial complex. Furthermore, our TNNs are designed to conserve the $E(3)$-invariance, which refers to the symmetry arising from invariance against translations, reflections, and rotations. When applied to the Quijote suite, our TNNs achieve a significant reduction in the mean squared error. Compared to our GNNs, which lack higher-order message-passing, ClusterTNNs show improvements of up to 22% in $Ω_{\\rm m}$ and 34% in $σ_8$ jointly, while the best FullTNN achieves an improvement of up to 60% in $σ_8$. In the context of the CAMELS suite, our models yield results comparable to the current GNN benchmark, albeit with a slight decrease in performance. We emphasize that our topology and symmetry-aware neural networks provide enhanced expressive power in modeling the large-scale structures of our universe.","abx":0,"nw":0,"d":"2025-05-29","dq":0,"y":2025,"au":[290,207],"c":9,"cs":0,"bib":"2025ApJ...989...47L","v":"Astrophysical Journal","lk":"arXiv:2505.23904","url":"https://arxiv.org/abs/2505.23904","doi":"10.3847/1538-4357/ade806","tg":{"s":["Non-CAMELS simulations","CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks","Other ML"],"u":["CAMELS (suite not stated)"]},"x":0.2582,"yy":0.3707,"p3":[0.3763,0.3287,-0.1477],"sim":{"k":"e","l":[[133,0.944],[153,0.942],[146,0.94],[2,0.938],[165,0.935]]},"c3":[80.41,39.04,-134.83],"c2":[17.49,152.53],"k":8,"r":[130,133,146,153,158,162,163,171],"rm":0},{"id":"2505.21215","t":"Transfer learning for multifidelity simulation-based inference in cosmology","ab":"Simulation-based inference (SBI) enables cosmological parameter estimation when closed-form likelihoods or models are unavailable. However, SBI relies on machine learning for neural compression and density estimation. This requires large training datasets which are prohibitively expensive for high-quality simulations. We overcome this limitation with multifidelity transfer learning, combining less expensive, lower-fidelity simulations with a limited number of high-fidelity simulations. We demonstrate our methodology on dark matter density maps from two separate simulation suites in the hydrodynamical CAMELS Multifield Dataset. Pre-training on dark-matter-only $N$-body simulations reduces the required number of high-fidelity hydrodynamical simulations by a factor between $8$ and $15$, depending on the model complexity, posterior dimensionality, and performance metrics used. By leveraging cheaper simulations, our approach enables performant and accurate inference on high-fidelity models while substantially reducing computational costs.","abx":0,"nw":0,"d":"2025-05-27","dq":0,"y":2025,"au":[27,143,415,26,40,71],"c":17,"cs":0,"bib":"2025MNRAS.542.3231S","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2505.21215","url":"https://arxiv.org/abs/2505.21215","doi":"10.1093/mnras/staf1436","tg":{"s":["N-body (dark matter only)","CAMELS (suite not stated)"],"d":["2D maps"],"m":["Simulation-based inference","CNN"],"u":["CNN"]},"x":-0.4954,"yy":0.3144,"p3":[-0.3318,0.339,-0.0751],"sim":{"k":"e","l":[[4,0.963],[171,0.947],[27,0.945],[80,0.945],[165,0.944]]},"c3":[21.83,116.27,-91.66],"c2":[-27.99,156.17],"k":4,"r":[63,76,85,99,111,118,120,130,165,171],"rm":0},{"id":"2505.13620","t":"Field-Level Comparison and Robustness Analysis of Cosmological N-body Simulations","ab":"We present the first field-level comparison of cosmological N-body simulations, considering various widely used codes: Abacus, CUBEP$^3$M, Enzo, Gadget, Gizmo, PKDGrav, and Ramses. Unlike previous comparisons focused on summary statistics, we conduct a comprehensive field-level analysis: evaluating statistical similarity, quantifying implications for cosmological parameter inference, and identifying the regimes in which simulations are consistent. We begin with a traditional comparison using the power spectrum, cross-correlation coefficient, and visual inspection of the matter field. We follow this with a statistical out-of-distribution (OOD) analysis to quantify distributional differences between simulations, revealing insights not captured by the traditional metrics. We then perform field-level simulation-based inference (SBI) using convolutional neural networks (CNNs), training on one simulation and testing on others, including a full hydrody
