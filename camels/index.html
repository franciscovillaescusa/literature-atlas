namic simulation for comparison. We identify several causes of OOD behavior and biased inference, finding that resolution effects, such as those arising from adaptive mesh refinement (AMR), have a significant impact. Models trained on non-AMR simulations fail catastrophically when evaluated on AMR simulations, introducing larger biases than those from hydrodynamic effects. Differences in resolution, even when using the same N-body code, likewise lead to biased inference. We attribute these failures to a CNN's sensitivity to small-scale fluctuations, particularly in voids and filaments, and demonstrate that appropriate smoothing brings the simulations into statistical agreement. Our findings motivate the need for careful data filtering and the use of field-level OOD metrics, such as PQMass, to ensure robust inference.","abx":0,"nw":0,"d":"2025-05-19","dq":0,"y":2025,"au":[18,207,500,478,331,327,228,360,172],"c":19,"cs":0,"bib":"2025ApJ...989..207B","v":"Astrophysical Journal","lk":"arXiv:2505.13620","url":"https://arxiv.org/abs/2505.13620","doi":"10.3847/1538-4357/adef4e","tg":{"s":["N-body (dark matter only)","Non-CAMELS simulations"],"d":["3D fields","Power spectra & summary statistics"],"m":["CNN","Simulation-based inference"],"u":[]},"x":-0.3724,"yy":0.0831,"p3":[-0.128,0.1812,0.0138],"sim":{"k":"e","l":[[44,0.945],[107,0.943],[129,0.943],[12,0.943],[153,0.943]]},"c3":[-55.96,39.72,-148.66],"c2":[-93.84,145.19],"k":4,"r":[71,76,146,158,165,167,171],"rm":0},{"id":"2505.02920","t":"Probing the co-evolution of SMBHs and their hosts from scaling relations pairwise residuals: dominance of stellar velocity dispersion and host halo mass","ab":"The correlations between Supermassive Black Holes (SMBHs) and their host galaxies still defy our understanding from both the observational and theoretical perspectives. Here we perform pairwise residual analysis on the latest sample of local inactive galaxies with a uniform calibration of their photometric properties and with dynamically measured masses of their central SMBHs. The residuals reveal that stellar velocity dispersion $σ$ and, possibly host dark matter halo mass $M_{\\rm halo}$, appear as the galactic properties most correlated with SMBH mass, with a secondary (weaker) correlation with spheroidal (bulge) mass $M_{\\rm sph}$, as also corroborated by additional Machine Learning tests. These findings may favour energetic/kinetic feedback from Active Galactic Nuclei (AGN) as the main driver in shaping SMBH scaling relations. Two state-of-the-art hydrodynamic simulations, inclusive of kinetic AGN feedback, are able to broadly capture the mean trends observed in the residuals, although they tend to either favour $M_{\\rm sph}$ as the most fundamental property, or generate too flat residuals. Increasing AGN feedback kinetic output does not improve the comparison with the data. In the Appendix we also show that the galaxies with dynamically measured SMBHs are biased high in $σ$ at fixed luminosity with respect to the full sample of local galaxies, proving that this bias is not a byproduct of stellar mass discrepancies. Overall, our results suggest that probing the SMBH-galaxy scaling relations in terms of total stellar mass alone may induce biases, and that either current data sets are incomplete, and/or that more insightful modelling is required to fully reproduce observations.","abx":0,"nw":0,"d":"2025-05-05","dq":0,"y":2025,"au":[205,362,137,391,550,385,39,120,299,23,134,344,155,235,240,43,118,419,386,198],"c":21,"cs":0,"bib":"2025MNRAS.541.2070S","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2505.02920","url":"https://arxiv.org/abs/2505.02920","doi":"10.1093/mnras/staf747","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":0.0913,"yy":-0.7144,"p3":[0.1517,-0.05,0.3732],"sim":{"k":"e","l":[[32,0.928],[147,0.926],[24,0.924],[43,0.923],[69,0.922]]},"c3":[-14.62,61.54,19.31],"c2":[43.0,49.14],"k":3,"r":[158,171],"rm":0},{"id":"2504.18745","t":"A hydrodynamical simulations-based model that connects the FRB DM--redshift relation to suppression of the matter power spectrum via feedback","ab":"Understanding the impact of baryonic feedback on the small-scale ($k \\gtrsim 1\\,h\\,$Mpc$^{-1}$) matter power spectrum is a key astrophysical challenge, and essential for interpreting data from upcoming weak-lensing surveys, which require percent-level accuracy to fully harness their potential. Astrophysical probes, such as the kinematic and thermal Sunyaev-Zel'dovich effects, have been used to constrain feedback at large scales ($k \\lesssim 5\\,h\\,$Mpc$^{-1}$). The sightline-to-sightline variance in the fast radio bursts (FRBs) dispersion measure (DM) correlates with the strength of baryonic feedback and offers unique sensitivity at scales upto $k \\sim 10\\,h\\,$Mpc$^{-1}$. We develop a new simulation-based formalism in which we parameterize the distribution of DM at a given redshift, $p(\\mathrm{DM}|z)$, as a log-normal with its first two moments computed analytically in terms of cosmological parameters and the feedback-dependent electron power spectrum $P_\\mathrm{ee}(k, z)$. We find that the log-normal parameterization provides an improved description of the $p(\\mathrm{DM}|z)$ distribution observed in hydrodynamical simulations as compared to the standard $F$-parameterization. Our model robustly captures the baryonic feedback effects across a wide range of baryonic feedback prescriptions in hydrodynamical simulations, including IllustrisTNG, SIMBA and Astrid. Leveraging simulations incorporates the redshift evolution of the DM variance by construction and facilitates the translation of constrained feedback parameters to the suppression of matter power spectrum relative to gravity-only simulations. We show that with $10^4$ FRBs, the suppression can be constrained to percent-level precision at large scales and $\\sim 10$\\% precision at scales $k \\gtrsim 10\\,h\\,$Mpc$^{-1}$ with prior-to-posterior $1σ$ constraint width ratio $\\gtrsim 20$.","abx":0,"nw":0,"d":"2025-04-25","dq":0,"y":2025,"au":[310,175,565,473,452,334],"c":34,"cs":0,"bib":"2025ApJ...989...81S","v":"Astrophysical Journal","lk":"arXiv:2504.18745","url":"https://arxiv.org/abs/2504.18745","doi":"10.3847/1538-4357/adeca4","tg":{"s":["CAMELS (suite not stated)"],"d":["Synthetic observables","Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":0.4027,"yy":-0.8915,"p3":[-0.1523,-0.462,0.4182],"sim":{"k":"e","l":[[78,0.958],[83,0.951],[147,0.944],[155,0.944],[160,0.943]]},"c3":[93.54,42.71,108.68],"c2":[158.91,129.46],"k":1,"r":[78,83,100,101,130,138,155,158],"rm":0},{"id":"2504.11794","t":"Fast Baryonic Field Painting for Sunyaev-Zel'dovich Analyses: Transfer Function vs. Hybrid Effective Field Theory","ab":"We present two approaches for \"painting\" baryonic properties relevant to the Sunyaev-Zel'dovich (SZ) effect - optical depth and Compton-$y$ - onto 3-dimensional $N$-body simulations, using the MillenniumTNG suite as a benchmark. The goal of these methods is to produce fast and accurate reconstruction methods to aid future analyses of baryonic feedback using the SZ effect. The first approach employs a Gaussian Process emulator to model the SZ quantities via a transfer function, while the second utilizes Hybrid Effective Field Theory (HEFT) to reproduce these quantities within the simulation. Our analysis involves comparing both methods to the true MillenniumTNG optical depth and Compton-$y$ fields using several metrics, including the cross-correlation coefficient, power spectrum, and power spectrum error. Additionally, we assess how well the reconstructed fields correlate with dark matter haloes across various mass thresholds. The results indicate that the transfer function method yields more accurate reconstructions for fields with initially high correlations ($r \\approx 1$), such as between the optical depth and dark matter fields. Conversely, the HEFT-based approach proves more effective in enhancing correlations for fields with weaker initial correlations ($r \\sim 0.5$), such as between the Compton-$y$ and dark matter fields. Lastly, we discuss extensions of our methods to improve the reconstruction performance at the field level.","abx":0,"nw":0,"d":"2025-04-16","dq":0,"y":2025,"au":[459,82,520,523,124],"c":13,"cs":0,"bib":"2026PhRvD.113f3558L","v":"Physical Review D","lk":"arXiv:2504.11794","url":"https://arxiv.org/abs/2504.11794","doi":"10.1103/3vzd-hxg1","tg":{"s":["Non-CAMELS simulations","CAMELS (suite not stated)"],"d":["3D fields","Synthetic observables"],"m":["Emulators & regression ML"],"u":["CAMELS (suite not stated)"]},"x":-0.1731,"yy":-0.3686,"p3":[-0.0688,-0.1417,0.1887],"sim":{"k":"e","l":[[46,0.93],[99,0.93],[122,0.929],[58,0.929],[132,0.928]]},"c3":[-44.45,-13.9,-23.54],"c2":[-56.1,12.37],"k":5,"r":[98,103,130,158,166,167,171],"rm":0},{"id":"2504.17839","t":"Interpreting Cosmological Information from Neural Networks in the Hydrodynamic Universe","ab":"What happens when a black box (neural network) meets a black box (simulation of the Universe)? Recent work has shown that convolutional neural networks (CNNs) can infer cosmological parameters from the matter density field in the presence of complex baryonic processes. A key question that arises is, which parts of the cosmic web is the neural network obtaining information from? We shed light on the matter by identifying the Fourier scales, density scales, and morphological features of the cosmic web that CNNs pay most attention to. We find that CNNs extract cosmological information from both high and low density regions: overdense regions provide the most information per pixel, while underdense regions -- particularly deep voids and their surroundings -- contribute significantly due to their large spatial extent and coherent spatial features. Remarkably, we demonstrate that there is negligible degradation in cosmological constraining power after aggressive cutting in both maximum Fourier scale and density. Furthermore, we find similar results when considering both hydrodynamic and gravity-only simulations, implying that neural networks can marginalize over baryonic effects with minimal loss in cosmological constraining power. Our findings point to practical strategies for optimal and robust field-level cosmological inference in the presence of uncertainly modeled astrophysics.","abx":0,"nw":0,"d":"2025-04-24","dq":0,"y":2025,"au":[55,18,207],"c":8,"cs":0,"bib":"2025ApJ...994..129L","v":"Astrophysical Journal","lk":"arXiv:2504.17839","url":"https://arxiv.org/abs/2504.17839","doi":"10.3847/1538-4357/ae0b5a","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["CNN"],"u":[]},"x":0.2676,"yy":0.6264,"p3":[-0.1823,0.3668,-0.2619],"sim":{"k":"e","l":[[170,0.954],[166,0.947],[27,0.946],[167,0.945],[153,0.943]]},"c3":[-92.5,34.57,-117.55],"c2":[-123.17,103.41],"k":8,"r":[165,167,171],"rm":0},{"id":"2503.22654","t":"On the effects of parameters on galaxy properties in CAMELS and the predictability of $Ω_{\\rm m}$","ab":"Recent analyses of cosmological hydrodynamic simulations from CAMELS have shown that machine learning models can predict the parameter describing the total matter content of the universe, $Ω_{\\rm m}$, from the features of a single galaxy. We investigate the statistical properties of two of these simulation suites, IllustrisTNG and ASTRID, confirming that $Ω_{\\rm m}$ induces a strong displacement on the distribution of galaxy features. We also observe that most other parameters have little to no effect on the distribution, except for the stellar-feedback parameter $A_{SN1}$, which introduces some near-degeneracies that can be broken with specific features. These two properties explain the predictability of $Ω_{\\rm m}$. We use Optimal Transport to further measure the effect of parameters on the distribution of galaxy properties, which is found to be consistent with physical expectations. However, we observe discrepancies between the two simulation suites, both in the effect of $Ω_{\\rm m}$ on the galaxy properties and in the distributions themselves at identical parameter values. Thus, although $Ω_{\\rm m}$'s signature can be easily detected within a given simulation suite using just a single galaxy, applying this result to real observational data may prove significantly more challenging.","abx":0,"nw":0,"d":"2025-03-28","dq":0,"y":2025,"au":[220,476,504,142,207],"c":2,"cs":0,"bib":"2025ApJ...988...54C","v":"Astrophysical Journal","lk":"arXiv:2503.22654","url":"https://arxiv.org/abs/2503.22654","doi":"10.3847/1538-4357/addd08","tg":{"s":["IllustrisTNG","Astrid"],"d":["Halo & galaxy catalogs"],"m":["Other ML"],"u":[]},"x":-0.1817,"yy":0.0918,"p3":[0.0894,-0.0724,-0.2559],"sim":{"k":"e","l":[[171,0.949],[12,0.948],[157,0.948],[130,0.947],[117,0.946]]},"c3":[84.14,-120.97,-15.49],"c2":[182.83,-46.25],"k":7,"r":[74,81,96,115,117,119,129,130,157,158,171],"rm":0},{"id":"2503.21736","t":"Local Primordial non-Gaussian Bias from Time Evolution","ab":"Primordial non-Gaussianity (PNG) is a signature of fundamental physics in the early universe that is probed by cosmological observations. It is well known that the local type of PNG generates a strong signal in the two-point function of large-scale structure tracers, such as galaxies. This signal, often termed ``scale-dependent bias'' is a generic feature of modulation of gravitational structure formation by a large-scale mode. It is less well-appreciated that the coefficient controlling this signal, $b_φ$, is closely connected to the time evolution of the tracer number density. This correspondence between time evolution and local PNG can be simply explained for a universal tracer whose mass function only depends on peak height, and more generally for non-universal tracers in the separate universe picture, which we validate in simulations. We also describe how to recover the bias of tracers subject to a survey selection function, and perform a simple demonstration on simulated galaxies. Since the local PNG amplitude in $n-$point statistics ($f_{\\rm NL}$) is largely degenerate with the coefficient $b_φ$, this proof of concept study demonstrates that galaxy survey data can allow for more optimal and robust extraction of local PNG information from upcoming surveys.","abx":0,"nw":0,"d":"2025-03-27","dq":0,"y":2025,"au":[262,555],"c":11,"cs":0,"bib":"2025PhRvD.112h3522S","v":"Physical Review D","lk":"arXiv:2503.21736","url":"https://arxiv.org/abs/2503.21736","doi":"10.1103/8jvj-66zc","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":-0.2703,"yy":-0.8129,"p3":[0.1987,0.3635,0.4397],"sim":{"k":"e","l":[[21,0.938],[108,0.925],[30,0.922],[1,0.917],[24,0.914]]},"c3":[-5.0,-133.88,26.9],"c2":[60.42,-117.11],"k":3,"r":[84,108,171],"rm":0},{"id":"2502.17568","t":"Cosmology with One Galaxy: Auto-Encoding the Galaxy Properties Manifold","ab":"Cosmological simulations like CAMELS and IllustrisTNG characterize hundreds of thousands of galaxies using various internal properties. Previous studies have demonstrated that machine learning can be used to infer the cosmological parameter $Ω_m$ from the internal properties of even a single randomly selected simulated galaxy. This ability was hypothesized to originate from galaxies occupying a low-dimensional manifold within a higher-dimensional galaxy property space, which shifts with variations in $Ω_m$. In this work, we investigate how galaxies occupy the high-dimensional galaxy property space, particularly the effect of $Ω_m$ and other cosmological and astrophysical parameters on the putative manifold. We achieve this by using an autoencoder with an Information-Ordered Bottleneck (IOB), a neural layer with adaptive compression, to perform dimensionality reduction on individual galaxy properties from CAMELS simulations, which are run with various combinations of cosmological and astrophysical parameters. We find that for an autoencoder trained on the fiducial set of parameters, the reconstruction error increases significantly when the test set deviates from fiducial values of $Ω_m$ and $A_{\\text{SN1}}$, indicating that these parameters shift galaxies off the fiducial manifold. In contrast, variations in other parameters such as $σ_8$ cause negligible error changes, suggesting galaxies shift along the manifold. These findings provide direct evidence that the ability to infer $Ω_m$ from individual galaxies is tied to the way $Ω_m$ shifts the manifold. Physically, this implies that parameters like $σ_8$ produce galaxy property changes resembling natural scatter, while parameters like $Ω_m$ and $A_{\\text{SN1}}$ create unsampled properties, extending beyond the natural scatter in the fiducial model.","abx":0,"nw":0,"d":"2025-02-24","dq":0,"y":2025,"au":[38,515,358,207,372],"c":5,"cs":0,"bib":"2025ApJ...986..133L","v":"Astrophysical Journal","lk":"arXiv:2502.17568","url":"https://arxiv.org/abs/2502.17568","doi":"10.3847/1538-4357/add724","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["Other ML"],"u":[]},"x":-0.1625,"yy":0.2683,"p3":[0.1201,0.099,-0.3757],"sim":{"k":"e","l":[[157,0.953],[2,0.953],[171,0.942],[117,0.942],[25,0.941]]},"c3":[107.86,-128.82,-63.58],"c2":[172.55,-73.78],"k":7,"r":[117,126,129,157,171],"rm":0},{"id":"2502.13589","t":"CASCO: Cosmological and AStrophysical parameters from Cosmological simulations and Observations III. The physics behind the emergence of the golden mass scale","ab":"We investigate the origin and evolution of the \"golden mass\" (halo mass $\\sim10^{12} \\, \\rm M_{\\odot}$, stellar mass $\\sim5 \\times 10^{10} \\, \\rm M_{\\odot}$), linked to peak star formation efficiency, using \\textsc{camels} simulations based on IllustrisTNG. Exploring a range of SN/AGN feedback strengths and cosmologies ($Ω_{\\rm m}, σ_8$), we find a U-shaped relation between dark-to-stellar mass ratio and stellar mass, with a minimum at the golden mass, in line with observations. Cosmology affects the normalization of this relation, while feedback shapes its form and the emergence of the golden mass. Stronger SN feedback lowers its value; AGN feedback, especially radiative efficiency, alters the high-mass slope and shifts the golden mass. The golden mass appears earlier with stronger feedback, which quenches star formation more rapidly. Passive galaxies retain the U-shape; star-forming ones show decreasing dark matter fraction with stellar mass, with possible reversal at low redshift. Global stellar fractions also exhibit a U-shaped trend: in passive galaxies, the golden mass shifts to lower masses or vanishes; in star-forming ones, it emerges only at low redshift. Feedback governs the golden mass up to $z \\sim 1.5-2$, with a secondary role from cold streams and virial shocks. We speculate that at $z \\gtrsim 1.5-2$, a single stream-regulated scale governs galaxy growth, which later bifurcates into two: a low-mass scale tied to gas richness and a higher-mass golden mass regulating efficiency and quenching. (abridged)","abx":0,"nw":0,"d":"2025-02-19","dq":0,"y":2025,"au":[92,560,404,332,223,515,207,354],"c":9,"cs":0,"bib":"2025A&A...702A.177T","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2502.13589","url":"https://arxiv.org/abs/2502.13589","doi":"10.1051/0004-6361/202453412","tg":{"s":["IllustrisTNG"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.7302,"yy":-0.5245,"p3":[0.297,-0.599,0.0784],"sim":{"k":"e","l":[[1,0.96],[119,0.946],[82,0.945],[54,0.944],[89,0.94]]},"c3":[33.32,-99.62,2.53],"c2":[94.16,-42.54],"k":6,"r":[82,117,119,130,158,171],"rm":0},{"id":"2502.13239","t":"Towards Robustness Across Cosmological Simulation Models TNG, SIMBA, ASTRID, and EAGLE","ab":"The rapid advancement of large-scale cosmological simulations has opened new avenues for cosmological and astrophysical research. However, the increasing diversity among cosmological simulation models presents a challenge to the robustness. In this work, we develop the Model-Insensitive ESTimator (MIEST), a machine that can robustly estimate the cosmological parameters, $Ω_m$ and $σ_8$, from neural hydrogen maps of simulation models in the CAMELS project$-$TNG, SIMBA, ASTRID, and EAGLE. An estimator is considered robust if it possesses a consistent predictive power across all simulations, including those used during the training phase. We train our machine using multiple simulation models and ensure that it only extracts common features between the models while disregarding the model-specific features. This allows us to develop a novel model that is capable of accurately estimating parameters across a range of simulation models, without being biased towards any particular model. Upon the investigation of the latent space$-$a set of summary statistics, we find that the implementation of robustness leads to the blending of latent variables across different models, demonstrating the removal of model-specific features. In comparison to a standard machine lacking robustness, the average performance of MIEST on the unseen simulations during the training phase has been improved by $\\sim17$% for $Ω_m$ and $\\sim 38$% for $σ_8$. By using a machine learning approach that can extract robust, yet physical features, we hope to improve our understanding of galaxy formation and evolution in a (subgrid) model-insensitive manner, and ultimately, gain insight into the underlying physical processes responsible for robustness. This is a Learning the Universe publication.","abx":0,"nw":0,"d":"2025-02-18","dq":0,"y":2025,"au":[593,515,47,73,464,207],"c":16,"cs":0,"bib":"2025ApJ...991..120J","v":"","lk":"arXiv:2502.13239","url":"https://arxiv.org/abs/2502.13239","doi":"","tg":{"s":["IllustrisTNG","SIMBA","Astrid","Swift-EAGLE"],"d":["2D maps"],"m":["CNN","Other ML"],"u":["CNN"]},"x":-0.2713,"yy":-0.0216,"p3":[0.0019,0.0592,-0.2419],"sim":{"k":"e","l":[[129,0.948],[25,0.947],[132,0.946],[130,0.945],[171,0.945]]},"c3":[52.65,17.63,-100.35],"c2":[42.11,154.42],"k":6,"r":[85,99,101,114,119,124,129,130,132,133,140,146,153,164,165,166,167,171],"rm":0},{"id":"2502.06954","t":"Hydrodynamic methods and sub-resolution models for cosmological simulations","ab":"Cosmological simulations are powerful tools in the context of structure formation. They allow us to explore the assembly and clustering of dark matter halos, to validate or reject possible scenarios of structure formation, and to investigate the physical properties of evolving galaxies across time. Cosmological hydrodynamical simulations are especially key to study how the complex interstellar medium of forming galaxies responds to the most energetic processes during galaxy evolution, such as stellar feedback ensuing supernova explosions and feedback from AGN. Given the huge dynamical range of physical scales spanned by the astrophysical processes involved in cosmic structure formation and evolution, cosmological simulations resort to sub-resolution models to capture processes occurring below their resolution limit. The impact of different sub-grid prescriptions accounting for the same process is striking, though often overlooked. Some among the main aforementioned processes include: hot gas cooling, star formation and stellar feedback, stellar evolution and chemical enrichment, black hole growth and feedback. Producing simulations of cosmic structure formation and galaxy evolution in large computational volumes is key to shed light on what drives the formation of the first structures in the Universe, and their subsequent evolution. Not only are predictions from simulations crucial to compare with data from ongoing observational instruments, but they can also guide future observational campaigns. Besides, since we have entered the era of high-performance computing, it is fundamental to have numerical codes which are very efficient from the computational point of view. In this chapter, we review the main hydrodynamic methods used in cosmological simulations and the most common techniques adopted to include the astrophysical processes which drive galaxy formation and evolution (abridged).","abx":0,"nw":0,"d":"2025-02-10","dq":0,"y":2025,"au":[394,309],"c":12,"cs":0,"bib":"2025arXiv250206954V","v":"","lk":"arXiv:2502.06954","url":"https://arxiv.org/abs/2502.06954","doi":"","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":[],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":-0.48,"yy":0.0025,"p3":[-0.1348,0.0983,0.1297],"sim":{"k":"e","l":[[158,0.927],[48,0.923],[32,0.913],[103,0.913],[130,0.913]]},"c3":[-87.8,31.55,65.43],"c2":[-69.0,-118.62],"k":3,"r":[171],"rm":0},{"id":"2501.17922","t":"Constraining Baryonic Feedback Effects on the Matter Power Spectrum with Fast Radio Bursts","ab":"In the age of large-scale galaxy and lensing surveys, such as DESI, Euclid, Roman and Rubin, we stand poised to usher in a transformative new phase of data-driven cosmology. To fully harness the capabilities of these surveys, it is critical to constrain the poorly understood influence of baryon feedback physics on the matter power spectrum. We investigate the use of a powerful and novel cosmological probe - fast radio bursts (FRBs) - to capture baryonic effects on the matter power spectrum, leveraging simulations from the CAMELS projects, including IllustrisTNG, SIMBA, and Astrid. We find that FRB statistics exhibit a strong correlation, independent of the subgrid model and cosmology, with quantities known to encapsulate baryonic impacts on the matter power spectrum, such as baryon spread and the halo baryon fraction. We propose an innovative method utilizing FRB observations to quantify the effects of feedback physics and enhance weak lensing measurements of $S_{8}$. We outline the necessary steps to prepare for the imminent detection of large FRB populations in the coming years, focusing on understanding the redshift evolution of FRB observables and mitigating the effects of cosmic variance.","abx":0,"nw":0,"d":"2025-01-29","dq":0,"y":2025,"au":[249,133,134,371],"c":34,"cs":0,"bib":"2025ApJ...983...46M","v":"Astrophysical Journal","lk":"arXiv:2501.17922","url":"https://arxiv.org/abs/2501.17922","doi":"10.3847/1538-4357/adbc9c","tg":{"s":["IllustrisTNG","SIMBA","Astrid"],"d":["Synthetic observables","Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":0.3987,"yy":-0.8449,"p3":[-0.0857,-0.5171,0.3126],"sim":{"k":"e","l":[[101,0.959],[69,0.958],[155,0.95],[160,0.946],[138,0.943]]},"c3":[137.28,65.54,71.71],"c2":[183.98,77.32],"k":1,"r":[79,89,101,122,130,137,138,155,158,171],"rm":0},{"id":"2501.16709","t":"A Neural Network Model for the Cosmic Dispersion Measure in the CAMELS Simulations","ab":"The probability distribution, $p(\\mathrm{DM})$ of cosmic dispersion measures (DM) measured in fast radio bursts (FRBs) encodes information about both cosmology and galaxy feedback. In this work, we study the effect of feedback parameters in the $p(\\mathrm{DM})$ calculated from the full Latin Hypercube of parameters sampled by the CAMELS hydrodynamical simulation suite, building a neural network (NN) model that performs well in emulating the effect of feedback on $p(\\mathrm{DM})$ at arbitrary redshifts at $z\\leq1$. Using this NN model, we further study the parameter $F\\equiv σ_{\\rm DM} \\, z^{1/2}$, which is commonly used to summarize the scatter on $p(\\mathrm{DM})$. We find that $F$ does not depend monotonically on every feedback parameter; instead each feedback mechanism jointly influences the final feedback strength in non-trivial ways. Even the largest values of $F$ that we find in our entire parameter space are small compared to the current constraints from observed FRB DMs by Baptista et al. 2024, pointing at the limitations of the CAMELS suite due to the small simulation box sizes. In the future, with larger box-sizes from CAMELS-like suites, similar models can be used to constrain the parameters governing galaxy feedback in the increasing observational samples of FRBs.","abx":0,"nw":0,"d":"2025-01-28","dq":0,"y":2025,"au":[456,306],"c":9,"cs":0,"bib":"2025MNRAS.540..289G","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2501.16709","url":"https://arxiv.org/abs/2501.16709","doi":"10.1093/mnras/staf730","tg":{"s":["CAMELS (suite not stated)"],"d":["Synthetic observables"],"m":["Emulators & regression ML"],"u":[]},"x":-0.3064,"yy":0.3566,"p3":[-0.0598,-0.1376,-0.3672],"sim":{"k":"e","l":[[165,0.935],[171,0.932],[167,0.931],[156,0.93],[157,0.93]]},"c3":[170.9,36.4,32.28],"c2":[201.32,28.33],"k":7,"r":[99,101,122,130,137,155,160,171],"rm":0},{"id":"2412.05131","t":"Probabilistic Galaxy Field Generation with Diffusion Models","ab":"In the era of precision cosmology, the ability to generate accurate and large-scale galaxy catalogs is crucial for advancing our understanding of the universe. With the flood of cosmological data from current and upcoming missions, generating theoretical predictions to compare with these observations is essential for constraining key cosmological parameters. While traditional methods, such as the Halo-Occupation Distribution (HOD), have provided foundational insights, they struggle to balance the need for both accuracy and computational efficiency. High-fidelity hydrodynamic simulations offer improved precision but are computationally expensive and resource-intensive. In this work, we introduce a novel machine learning approach that harnesses Convolutional Neural Networks (CNNs) and Diffusion Models, trained on the CAMELS simulation suite, to bridge the gap between computationally inexpensive dark matter simulations and the galaxy distributions of more costly hydrodynamic simulations. Our method not only outperforms traditional HOD techniques in accuracy but also significantly accelerates the simulation process, offering a scalable solution for next-generation cosmological surveys. This advancement has the potential to revolutionize galaxy catalog generation, enabling more precise, data-driven cosmological analyses.","abx":0,"nw":0,"d":"2024-12-06","dq":0,"y":2024,"au":[539,167,376],"c":4,"cs":0,"bib":"2024arXiv241205131S","v":"","lk":"arXiv:2412.05131","url":"https://arxiv.org/abs/2412.05131","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["3D fields","Halo & galaxy catalogs"],"m":["CNN","Generative models"],"u":["3D fields"]},"x":-0.0632,"yy":0.8093,"p3":[-0.4187,0.051,0.1395],"sim":{"k":"e","l":[[98,0.955],[44,0.95],[46,0.95],[105,0.948],[114,0.948]]},"c3":[-98.36,-89.74,3.79],"c2":[-76.88,-80.45],"k":5,"r":[98,171],"rm":0},{"id":"2412.04559","t":"X-raying CAMELS: Constraining Baryonic Feedback in the Circum-Galactic Medium with the CAMELS simulations and eRASS X-ray Observations","ab":"The circumgalactic medium (CGM) around massive galaxies plays a crucial role in regulating star formation and feedback. Using the CAMELS simulation suite, we develop emulators for the X-ray surface brightness profile and the X-ray luminosity--stellar mass scaling relation to investigate how stellar and AGN feedback shape the X-ray properties of the hot CGM. Our analysis shows that at CGM scales ($10^{12} \\lesssim M_{\\rm halo}/M_\\odot \\lesssim 10^{13}$, $10\\lesssim r/{\\rm kpc} \\lesssim 400$), stellar feedback more significantly impacts the X-ray properties than AGN feedback within the parameters studied. Comparing the emulators to recent eROSITA All-Sky Survey observations, it was found that stronger feedback than currently implemented in the IllustrisTNG, SIMBA, and Astrid simulations is required to match observed CGM properties. However, adopting these enhanced feedback parameters causes deviations in the stellar-mass-halo-mass relations from observational constraints below the group mass scale. This tension suggests possible unaccounted systematics in X-ray CGM observations or inadequacies in the feedback models of cosmological simulations.","abx":0,"nw":0,"d":"2024-12-05","dq":0,"y":2024,"au":[182,133,605,249,69,417,134,515,597,207],"c":24,"cs":0,"bib":"2025ApJ...984..190L","v":"Astrophysical Journal","lk":"arXiv:2412.04559","url":"https://arxiv.org/abs/2412.04559","doi":"10.3847/1538-4357/adc450","tg":{"s":["IllustrisTNG","SIMBA","Astrid"],"d":["Profiles","Synthetic observables"],"m":["Emulators & regression ML"],"u":[]},"x":0.5798,"yy":-0.5829,"p3":[0.2382,-0.5987,-0.1049],"sim":{"k":"e","l":[[89,0.957],[156,0.956],[141,0.952],[38,0.949],[101,0.949]]},"c3":[159.73,42.03,3.69],"c2":[169.02,65.16],"k":1,"r":[89,90,99,101,118,122,130,137,138,147,155,156,167,171],"rm":0},{"id":"2412.00217","t":"CASCO: Cosmological and AStrophysical parameters from Cosmological simulations and Observations -- II. Constraining cosmology and astrophysical processes with early- and late-type galaxies","ab":"Physical processes impact galaxy formation and evolution in diverse ways, requiring validation of their implementation in cosmological simulations through comparisons with real data across various galaxy types and properties. In this second paper of the CASCO series, we compare the structural properties and dark matter (DM) content of early-type galaxies from the CAMELS IllustrisTNG simulations to three observational datasets (SPIDER, $\\textrm{ATLAS}^{\\textrm{3D}}$, and MaNGA DynPop), to constrain cosmological and astrophysical feedback parameters, contrasting these results with those obtained for late-type galaxies. We analyze the size-, internal DM fraction-, and DM mass-stellar mass relations, identifying the best-fit simulation for each dataset. For SPIDER, we find cosmological parameter values consistent with literature and results obtained from the comparison between simulations and late-type galaxies, with supernova feedback parameters differing from results derived for late-type galaxies. For $\\textrm{ATLAS}^{\\textrm{3D}}$, cosmological parameter results align with SPIDER, while supernova feedback parameters are more consistent with late-type galaxies results. MaNGA DynPop yields extreme cosmological parameter values but similar supernova feedback results to $\\textrm{ATLAS}^{\\textrm{3D}}$. However, no single simulation matches the full range of observational trends, especially when combining early- and late-type galaxies from MaNGA DynPop. These findings highlight the limitations of simulations in reproducing diverse galaxy properties, underscoring the challenge of capturing the complexity of galaxy formation across all types.","abx":0,"nw":1,"d":"2024-11-29","dq":0,"y":2024,"au":[560,92,223,332,354,404],"c":6,"cs":0,"bib":"2025A&A...693A.112B","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2412.00217","url":"https://arxiv.org/abs/2412.00217","doi":"10.1051/0004-6361/202451702","tg":{"s":["IllustrisTNG"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.5643,"yy":-0.3616,"p3":[0.4035,-0.2928,0.0504],"sim":{"k":"e","l":[[119,0.952],[75,0.945],[40,0.937],[154,0.936],[101,0.933]]},"c3":[50.27,-108.22,-45.2],"c2":[114.69,-26.31],"k":6,"r":[99,111,117,119,129,130,133,140,157,158,164,171],"rm":0},{"id":"2411.17682","t":"An analytical model for the dispersion measure of Fast Radio Burst host galaxies","ab":"The dispersion measure (DM) of fast radio bursts (FRBs) is sensitive to the electron distribution in the Universe, making it a promising probe of cosmology and astrophysical processes such as baryonic feedback. However, cosmological analyses of FRBs require knowledge of the contribution to the observed DM coming from the FRB host. The size and distribution of this contribution is still uncertain, thus significantly limiting current cosmological FRB analyses. In this study, we extend the baryonification (BCM) approach to derive a physically-motivated, analytic model for predicting the host contribution to FRB DMs. By focusing on the statistical properties of FRB host DMs, we find that our simple model is able to reproduce the probability distribution function (PDF) of host halo DMs measured from the CAMELS suite of hydrodynamic simulations, as well as their mass- and redshift dependence. Furthermore, we demonstrate that our model allows for self-consistent predictions of the host DM PDF and the matter power spectrum suppression due to baryonic effects, as observed in these simulations, making it promising for modelling host-DM-related systematics in FRB analyses. In general, we find that the shape of the host DM PDF is determined by the interplay between the FRB and gas distributions in halos. Our findings indicate that more compact FRB profiles require shallower gas profiles (and vice versa) in order to match the observed DM distributions in hydrodynamic simulations. Furthermore, the analytic model presented here shows that the shape of the host DM PDF is highly sensitive to the parameters of the BCM. This suggests that this observable could be used as an interesting test bed for baryonic processes, complementing other probes due to its sensitivity to feedback on galactic scales. We further discuss the main limitations of our analysis, and point out potential avenues for future work.","abx":0,"nw":0,"d":"2024-11-26","dq":0,"y":2024,"au":[473,388,46,527,60],"c":17,"cs":0,"bib":"2025OJAp....8E.127R","v":"The Open Journal of Astrophysics","lk":"arXiv:2411.17682","url":"https://arxiv.org/abs/2411.17682","doi":"10.33232/001c.143819","tg":{"s":["CAMELS (suite not stated)"],"d":["Synthetic observables"],"m":["No ML"],"u":[]},"x":0.4019,"yy":-0.9445,"p3":[-0.156,-0.5856,0.3896],"sim":{"k":"e","l":[[69,0.951],[100,0.941],[155,0.94],[78,0.938],[101,0.933]]},"c3":[65.04,45.13,130.03],"c2":[200.77,95.44],"k":3,"r":[100,101,171],"rm":0},{"id":"2411.13960","t":"Learning the Universe: Cosmological and Astrophysical Parameter Inference with Galaxy Luminosity Functions and Colours","ab":"We perform the first direct cosmological and astrophysical parameter inference from the combination of galaxy luminosity functions and colours using a simulation based inference approach. Using the Synthesizer code we simulate the dust attenuated ultraviolet-near infrared stellar emission from galaxies in thousands of cosmological hydrodynamic simulations from the CAMELS suite, including the Swift-EAGLE, IllustrisTNG, Simba & Astrid galaxy formation models. For each galaxy we calculate the rest-frame luminosity in a number of photometric bands, including the SDSS $\\textit{ugriz}$ and GALEX FUV & NUV filters; this dataset represents the largest catalogue of synthetic photometry based on hydrodynamic galaxy formation simulations produced to date, totalling >200 million sources. From these we compile luminosity functions and colour distributions, and find clear dependencies on both cosmology and feedback. We then perform simulation based (likelihood-free) inference using these distributions to constrain $Ω_m$, $σ_8$, and four parameters controlling the strength of stellar and AGN feedback. Both colour distributions and luminosity functions provide complementary information on certain parameters when performing inference. We achieve constraints on the stellar feedback parameters, as well as $Ω_m$ and $σ_8$. The latter is attributable to the fact that the photometry encodes the star formation-metal enrichment history of each galaxy; galaxies in a universe with a higher $σ_8$ tend to form earlier and have higher metallicities, which leads to redder colours. We find that a model trained on one galaxy formation simulation generalises poorly when applied to another, and attribute this to differences in the subgrid prescriptions, and lack of flexibility in our emission modelling. The photometric catalogues are publicly available at: https://camels.readthedocs.io/","abx":0,"nw":0,"d":"2024-11-21","dq":0,"y":2024,"au":[118,549,372,134,479,62,298,30,577,464,326,207],"c":31,"cs":0,"bib":"2025MNRAS.544.3949L","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2411.13960","url":"https://arxiv.org/abs/2411.13960","doi":"10.1093/mnras/staf1888","tg":{"s":["Swift-EAGLE","IllustrisTNG","SIMBA","Astrid"],"d":["Synthetic observables","Halo & galaxy catalogs"],"m":["Simulation-based inference"],"u":[]},"x":-0.012,"yy":-0.0349,"p3":[0.1159,0.0763,-0.0712],"sim":{"k":"e","l":[[12,0.956],[171,0.955],[158,0.954],[154,0.952],[130,0.951]]},"c3":[62.58,-83.47,-36.39],"c2":[104.3,-2.2],"k":1,"r":[90,98,114,117,122,123,124,129,130,133,137,140,141,142,146,147,153,154,155,157,158,160,164,167,171],"rm":0},{"id":"2411.10515","t":"Towards cosmological inference on unlabeled out-of-distribution HI observational data","ab":"We present an approach that can be utilized in order to account for the covariate shift between two datasets of the same observable with different distributions. This helps improve the generalizability of a neural network model trained on in-distribution samples (IDs) when inferring cosmology at the field level on out-of-distribution samples (OODs) of {\\it unknown labels}. We make use of HI maps from the two simulation suites in CAMELS, IllustrisTNG and SIMBA. We consider two different techniques, namely adversarial approach and optimal transport, to adapt a target network whose initial weights are those of a source network pre-trained on a labeled dataset. Results show that after adaptation, salient features that are extracted by source and target encoders are well aligned in the embedding space. This indicates that the target encoder has learned the representations of the target domain via the adversarial training and optimal transport. Furthermore, in all scenarios considered in our analyses, the target encoder, which does not have access to any labels ($Ω_{\\rm m}$) during adaptation phase, is able to retrieve the underlying $Ω_{\\rm m}$ from out-of-distribution maps to a great accuracy of $R^{2}$ score $\\ge$ 0.9, comparable to the performance of the source encoder trained in a supervised learning setup. We further test the viability of the techniques when only a few out-of-distribution instances are available for training and find that the target encoder still reasonably recovers the matter density. Our approach is critical in extracting information from upcoming large scale surveys.","abx":0,"nw":0,"d":"2024-11-15","dq":0,"y":2024,"au":[499,532],"c":8,"cs":0,"bib":"2025Ap&SS.370...14A","v":"Astrophysics and Space Science","lk":"arXiv:2411.10515","url":"https://arxiv.org/abs/2411.10515","doi":"10.1007/s10509-025-04405-y","tg":{"s":["IllustrisTNG","SIMBA"],"d":["2D maps"],"m":["CNN","Other ML"],"u":[]},"x":-0.5151,"yy":0.7213,"p3":[-0.1983,0.5248,-0.3775],"sim":{"k":"e","l":[[56,0.956],[102,0.945],[113,0.941],[166,0.941],[142,0.94]]},"c3":[-36.03,107.54,-56.48],"c2":[-69.48,149.81],"k":0,"r":[149,158,164,165,171],"rm":0},{"id":"2411.08957","t":"Learning Optimal and Interpretable Summary Statistics of Galaxy Catalogs with SBI","ab":"How much cosmological information can we reliably extract from existing and upcoming large-scale structure observations? Many summary statistics fall short in describing the non-Gaussian nature of the late-time Universe in comparison to existing and upcoming measurements. In this article we demonstrate that we can identify optimal summary statistics and that we can link them with existing summary statistics. Using simulation based inference (SBI) with automatic data-compression, we learn summary statistics for galaxy catalogs in the context of cosmological parameter estimation. By construction these summary statistics do not require the ability to write down an explicit likelihood. We demonstrate that they can be used for efficient parameter inference. These summary statistics offer a new avenue for analyzing different simulation models for baryonic physics with respect to their relevance for the resulting cosmological features. The learned summary statistics are low-dimensional, feature the underlying simulation parameters, and are similar across different network architectures. To link our models, we identify the relevant scales associated to our summary statistics (e.g. in the range of modes between $k= 5 - 30 h/\\mathrm{Mpc}$) and we are able to match the summary statistics to underlying simulation parameters across various simulation models.","abx":0,"nw":0,"d":"2024-11-13","dq":0,"y":2024,"au":[295,535,273,309],"c":10,"cs":0,"bib":"2025JCAP...12..032L","v":"","lk":"arXiv:2411.08957","url":"https://arxiv.org/abs/2411.08957","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Simulation-based inference"],"u":[]},"x":0.1633,"yy":0.5166,"p3":[0.0645,0.4659,0.113],"sim":{"k":"e","l":[[27,0.954],[153,0.95],[120,0.948],[44,0.946],[114,0.946]]},"c3":[138.33,-33.89,-67.46],"c2":[86.75,-2.68],"k":8,"r":[100,101,111,114,130,132,133,137,138,140,146,147,153,156,171],"rm":0},{"id":"2411.02496","t":"Reconstruction of Continuous Cosmological Fields from Discrete Tracers with Graph Neural Networks","ab":"We develop a hybrid GNN-CNN architecture for the reconstruction of 3-dimensional continuous cosmological matter fields from discrete point clouds, provided by observed galaxy catalogs. Using the CAMELS hydrodynamical cosmological simulations we demonstrate that the proposed architecture allows for an accurate reconstruction of both the dark matter and electron density given observed galaxies and their features. Our approach includes a learned grid assignment scheme that improves over the traditional cloud-in-cell method. Our method can improve cosmological analyses in situations where non-luminous (and thus unobservable) continuous fields need to be estimated from luminous (observable) discrete point cloud tracers.","abx":0,"nw":0,"d":"2024-11-04","dq":0,"y":2024,"au":[601,281,370,399],"c":3,"cs":0,"bib":"2024arXiv241102496K","v":"","lk":"arXiv:2411.02496","url":"https://arxiv.org/abs/2411.02496","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs","3D fields"],"m":["Graph neural networks","CNN"],"u":[]},"x":-0.019,"yy":0.5368,"p3":[0.1242,0.232,-0.2009],"sim":{"k":"e","l":[[153,0.949],[132,0.945],[50,0.945],[146,0.945],[114,0.945]]},"c3":[-39.4,-72.39,-79.53],"c2":[-70.25,-5.1],"k":8,"r":[98,103,109,130,153,158,163,171],"rm":0},{"id":"2410.21722","t":"On the Significance of Covariance for Constraining Theoretical Models From Galaxy Observables","ab":"In this study, we investigate the impact of covariance within uncertainties on the inference of cosmological and astrophysical parameters, specifically focusing on galaxy stellar mass functions derived from the CAMELS simulation suite. Utilizing both Fisher analysis and Implicit Likelihood Inference (ILI), we explore how different covariance structures, including simple toy models and physics-motivated uncertainties, affect posterior distributions and parameter variances. Our methodology utilizes forward modeling via emulators that are trained on CAMELS simulations to produce stellar mass functions based on input parameters, subsequently incorporating Gaussian noise as defined by covariance matrices. We examine both toy model covariance matrices and physically motivated covariance matrices derived from observational factors like the stellar Initial Mass Function (IMF) and photometric aperture size. Our results demonstrate that covariance terms significantly influence parameter inference, often leading to tighter constraints or revealing complex, multimodal posterior distributions. These findings underscore the necessity of accounting for covariance when interpreting astrophysical observations, especially in fields where accurate parameter estimation is critical for model validation and hypothesis testing.","abx":0,"nw":0,"d":"2024-10-29","dq":0,"y":2024,"au":[593,515,274,73],"c":1,"cs":0,"bib":"2026ApJ...998..238J","v":"Astrophysical Journal","lk":"arXiv:2410.21722","url":"https://arxiv.org/abs/2410.21722","doi":"10.3847/1538-4357/ae19e4","tg":{"s":["CAMELS (suite not stated)"],"d":["Power spectra & summary statistics","Halo & galaxy catalogs"],"m":["Simulation-based inference","Emulators & regression ML"],"u":[]},"x":-0.1948,"yy":-0.1509,"p3":[0.0845,-0.0109,-0.4092],"sim":{"k":"e","l":[[25,0.94],[140,0.938],[157,0.936],[171,0.935],[90,0.934]]},"c3":[2.07,-54.15,-105.19],"c2":[-20.53,54.82],"k":7,"r":[76,140,167,171],"rm":0},{"id":"2410.16361","t":"Quantifying Baryonic Feedback on Warm-Hot Circumgalactic Medium in CAMELS Simulations","ab":"The baryonic physics shaping galaxy formation and evolution are complex, spanning a vast range of scales and making them challenging to model. Cosmological simulations rely on subgrid models that produce significantly different predictions. Understanding how models of stellar and active galactic nuclei (AGN) feedback affect baryon behavior across different halo masses and redshifts is essential. Using the SIMBA and IllustrisTNG suites from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project, we explore the effect of parameters governing the subgrid implementation of stellar and AGN feedback. We find that while IllustrisTNG shows higher cumulative feedback energy across all halos, SIMBA demonstrates a greater spread of baryons, quantified by the closure radius and circumgalactic medium (CGM) gas fraction. This suggests that feedback in SIMBA couples more effectively to baryons and drives them more efficiently within the host halo. There is evidence that different feedback modes are highly interrelated in these subgrid models. Parameters controlling stellar feedback efficiency significantly impact AGN feedback, as seen in the suppression of black hole mass growth and delayed activation of AGN feedback to higher mass halos with increasing stellar feedback efficiency in both simulations. Additionally, AGN feedback efficiency parameters affect the CGM gas fraction at low halo masses in SIMBA, hinting at complex, non-linear interactions between AGN and SNe feedback modes. Overall, we demonstrate that stellar and AGN feedback are intimately interwoven, especially at low redshift, due to subgrid implementation, resulting in halo property effects that might initially seem counterintuitive.","abx":0,"nw":0,"d":"2024-10-21","dq":0,"y":2024,"au":[249,113,133,134,515,69,583,455,207],"c":28,"cs":0,"bib":"2025ApJ...980...61M","v":"Astrophysical Journal","lk":"arXiv:2410.16361","url":"https://arxiv.org/abs/2410.16361","doi":"10.3847/1538-4357/ada442","tg":{"s":["SIMBA","IllustrisTNG"],"d":["Profiles","Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.5607,"yy":-0.5074,"p3":[0.1297,-0.5237,0.0264],"sim":{"k":"e","l":[[38,0.967],[124,0.966],[54,0.964],[101,0.961],[81,0.957]]},"c3":[114.99,14.81,101.85],"c2":[158.32,46.27],"k":1,"r":[99,101,122,124,130,137,158,171],"rm":0},{"id":"2410.10942","t":"Cosmological and Astrophysical Parameter Inference from Stacked Galaxy Cluster Profiles Using CAMELS-zoomGZ","ab":"We present a study on the inference of cosmological and astrophysical parameters using stacked galaxy cluster profiles. Utilizing the CAMELS-zoomGZ simulations, we explore how various cluster properties--such as X-ray surface brightness, gas density, temperature, metallicity, and Compton-y profiles--can be used to predict parameters within the 28-dimensional parameter space of the IllustrisTNG model. Through neural networks, we achieve a high correlation coefficient of 0.97 or above for all cosmological parameters, including $Ω_{\\rm m}$, $H_0$, and $σ_8$, and over 0.90 for the remaining astrophysical parameters, showcasing the effectiveness of these profiles for parameter inference. We investigate the impact of different radial cuts, with bins ranging from $0.1R_{200c}$ to $0.7R_{200c}$, to simulate current observational constraints. Additionally, we perform a noise sensitivity analysis, adding up to 40\\% Gaussian noise (corresponding to signal-to-noise ratios as low as 2.5), revealing that key parameters such as $Ω_{\\rm m}$, $H_0$, and the IMF slope remain robust even under extreme noise conditions. We also compare the performance of full radial profiles against integrated quantities, finding that profiles generally lead to more accurate parameter inferences. Our results demonstrate that stacked galaxy cluster profiles contain crucial information on both astrophysical processes within groups and clusters and the underlying cosmology of the universe. This underscores their significance for interpreting the complex data expected from next-generation surveys and reveals, for the first time, their potential as a powerful tool for parameter inference.","abx":0,"nw":0,"d":"2024-10-14","dq":0,"y":2024,"au":[168,515,207,553,379,182,140],"c":7,"cs":0,"bib":"2025ApJ...981..170H","v":"Astrophysical Journal","lk":"arXiv:2410.10942","url":"https://arxiv.org/abs/2410.10942","doi":"10.3847/1538-4357/ada9e9","tg":{"s":["Zoom-ins (zoomGZ)","IllustrisTNG"],"d":["Profiles","Synthetic observables"],"m":["Emulators & regression ML"],"u":[]},"x":0.2633,"yy":-0.0859,"p3":[0.3725,-0.1879,-0.024],"sim":{"k":"e","l":[[154,0.95],[99,0.948],[97,0.947],[11,0.946],[101,0.945]]},"c3":[124.38,10.34,-90.6],"c2":[115.63,102.77],"k":6,"r":[81,99,114,129,130,133,146,157,166,167,171],"rm":0},{"id":"2408.04864","t":"The evolving role of astrophysical modelling in dark matter halo relaxation response","ab":"We study the change in the radial distribution of dark matter within haloes in response to baryonic astrophysical processes in galaxies at different epochs, investigating the role of astrophysical modeling in cosmological hydrodynamic simulations in producing the response. We find that the linear quasi-adiabatic relaxation with additional dependence on the halo-centric distance provides a good description not only at $z=0$, but also at an earlier epoch ($z=1$) in the IllustrisTNG simulation suite, with parameters being more universal across a much larger variety of haloes at $z=1$ than at $z=0$. Through systematic analysis of a large collection of simulations from the CAMELS project, we find that the baryonic prescriptions for both AGN and stellar feedbacks have a strong influence on the relaxation response of the dark matter halo. In particular, only the parameters controlling the overall feedback energy flux have an effect on the relaxation response, while the wind speed and burstiness have negligible effect on the relaxation at a fixed amount of energy flux. However, the exact role of these parameters on the relaxation depends on the redshift. We also study the role of a variety of baryonic astrophysical processes through the EAGLE physics variation simulations. While these depict a similar picture regarding the importance of feedback effects, they also reveal that the gas equation of state has one of the strongest influences on the relaxation response, consistent with the expectation from self-similar analyses.","abx":0,"nw":0,"d":"2024-08-09","dq":0,"y":2024,"au":[453,58],"c":1,"cs":0,"bib":"2025JCAP...07..026V","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2408.04864","url":"https://arxiv.org/abs/2408.04864","doi":"10.1088/1475-7516/2025/07/026","tg":{"s":["IllustrisTNG","CAMELS (suite not stated)"],"d":["Profiles","Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.4942,"yy":-0.4532,"p3":[0.189,-0.3885,0.0917],"sim":{"k":"e","l":[[89,0.949],[39,0.944],[38,0.942],[99,0.942],[7,0.941]]},"c3":[44.64,-1.05,61.81],"c2":[-3.07,-1.21],"k":1,"r":[124,158,171],"rm":0},{"id":"2408.00839","t":"Inpainting Galaxy Counts onto N-Body Simulations over Multiple Cosmologies and Astrophysics","ab":"Cosmological hydrodynamical simulations, while the current state-of-the art methodology for generating theoretical predictions for the large scale structures of the Universe, are among the most expensive simulation tools, requiring upwards of 100 millions CPU hours per simulation. N-body simulations, which exclusively model dark matter and its purely gravitational interactions, represent a less resource-intensive alternative, however, they do not model galaxies, and as such cannot directly be compared to observations. In this study, we use conditional score-based models to learn a mapping from N-body to hydrodynamical simulations, specifically from dark matter density fields to the observable distribution of galaxies. We demonstrate that our model is capable of generating galaxy fields statistically consistent with hydrodynamical simulations at a fraction of the computational cost, and demonstrate our emulator is significantly more precise than traditional emulators over the scales 0.36 $h\\ \\text{Mpc}^{-1}$ $\\leq$ k $\\leq$ 3.88 $h\\ \\text{Mpc}^{-1}$.","abx":0,"nw":1,"d":"2024-08-01","dq":0,"y":2024,"au":[52,480,372,29,590,327],"c":13,"cs":0,"bib":"2024arXiv240800839B","v":"","lk":"arXiv:2408.00839","url":"https://arxiv.org/abs/2408.00839","doi":"","tg":{"s":["CAMELS (suite not stated)","N-body (dark matter only)"],"d":["3D fields"],"m":["Generative models"],"u":["CAMELS (suite not stated)","N-body (dark matter only)"]},"x":-0.2115,"yy":0.2375,"p3":[-0.1791,0.1052,-0.013],"sim":{"k":"e","l":[[46,0.955],[2,0.947],[14,0.944],[167,0.943],[15,0.943]]},"c3":[-66.81,-19.91,-58.99],"c2":[-89.24,29.35],"k":8,"r":[98,133,158,165],"rm":0},{"id":"2407.18349","t":"Stirring the cosmic pot: how black hole feedback shapes the matter power spectrum in the Fable simulations","ab":"Understanding the impact of baryonic physics on cosmic structure formation is crucial for accurate cosmological predictions, especially as we usher in the era of large galaxy surveys with the Rubin Observatory as well as the Euclid and Roman Space Telescopes. A key process that can redistribute matter across a large range of scales is feedback from accreting supermassive black holes. How exactly these active galactic nuclei (AGN) operate from sub-parsec to Mega-parsec scales however remains largely unknown. To understand this, we investigate how different AGN feedback models in the Fable simulation suite affect the cosmic evolution of the matter power spectrum (MPS). Our analysis reveals that AGN feedback significantly suppresses clustering at scales $k \\sim 10\\,h\\,cMpc^{-1}$, with the strongest effect at redshift $z = 0$ causing a reduction of $\\sim 10\\%$ with respect to the dark matter-only simulation. This is due to the efficient feedback in both radio (low Eddington ratio) and quasar (high Eddington ratio) modes in our fiducial Fable model. We find that variations of the quasar and radio mode feedback with respect to the fiducial Fable model have distinct effects on the MPS redshift evolution, with the radio mode being more effective on larger scales and later epochs. Furthermore, MPS suppression is dominated by AGN feedback effects inside haloes at $z = 0$, while for $z \\gtrsim 1$ the matter distribution both inside and outside of haloes shapes the MPS suppression. Hence, future observations probing earlier cosmic times beyond $z \\sim 1$ will be instrumental in constraining the nature of AGN feedback.","abx":0,"nw":0,"d":"2024-07-25","dq":0,"y":2024,"au":[506,564,521,364,329,145],"c":9,"cs":0,"bib":"2025MNRAS.539.1738M","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2407.18349","url":"https://arxiv.org/abs/2407.18349","doi":"10.1093/mnras/staf470","tg":{"s":["Non-CAMELS simulations"],"d":["Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":0.5142,"yy":-0.8672,"p3":[0.0236,-0.636,0.2497],"sim":{"k":"e","l":[[78,0.938],[54,0.935],[124,0.933],[1,0.932],[83,0.932]]},"c3":[114.95,-26.81,-20.63],"c2":[95.82,-76.03],"k":1,"r":[122,171],"rm":0},{"id":"title:machinelearningmethodsforextractingcosmologicalinformation","t":"Machine Learning methods for extracting cosmological information","ab":"","abx":0,"nw":0,"d":"2024","dq":1,"y":2024,"au":[410],"c":0,"cs":1,"bib":"","v":"","lk":"PhD thesis","url":"https://www.teses.usp.br/teses/disponiveis/43/43134/tde-15072024-101341/publico/tesenatalisolermatubarodesanti.pdf","doi":"10.11606/t.43.2024.tde-15072024-101341","tg":{"s":["CAMELS (suite not stated)"],"d":[],"m":[],"u":["CAMELS (suite not stated)"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.0922,"yy":0.3387,"p3":[0.1073,-0.1068,-0.2203],"sim":{"k":"w","l":[[58,0.204],[96,0.174],[111,0.139],[51,0.093],[137,0.091]]},"c3":[-39.61,196.44,147.26],"c2":[-29.62,280.58],"k":8,"r":[],"rm":1},{"id":"2405.05255","t":"Diffusion-HMC: Parameter Inference with Diffusion-model-driven Hamiltonian Monte Carlo","ab":"Diffusion generative models have excelled at diverse image generation and reconstruction tasks across fields. A less explored avenue is their application to discriminative tasks involving regression or classification problems. The cornerstone of modern cosmology is the ability to generate predictions for observed astrophysical fields from theory and constrain physical models from observations using these predictions. This work uses a single diffusion generative model to address these interlinked objectives -- as a surrogate model or emulator for cold dark matter density fields conditional on input cosmological parameters, and as a parameter inference model that solves the inverse problem of constraining the cosmological parameters of an input field. The model is able to emulate fields with summary statistics consistent with those of the simulated target distribution. We then leverage the approximate likelihood of the diffusion generative model to derive tight constraints on cosmology by using the Hamiltonian Monte Carlo method to sample the posterior on cosmological parameters for a given test image. Finally, we demonstrate that this parameter inference approach is more robust to small perturbations of noise to the field than baseline parameter inference networks.","abx":0,"nw":0,"d":"2024-05-08","dq":0,"y":2024,"au":[411,101,154],"c":16,"cs":0,"bib":"2025ApJ...978...64M","v":"Astrophysical Journal","lk":"arXiv:2405.05255","url":"https://arxiv.org/abs/2405.05255","doi":"10.3847/1538-4357/ad8bc3","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":-0.104,"yy":0.946,"p3":[-0.651,0.0138,0.0623],"sim":{"k":"e","l":[[105,0.969],[143,0.951],[3,0.95],[80,0.943],[98,0.941]]},"c3":[-104.22,-32.01,-81.17],"c2":[-142.56,16.63],"k":5,"r":[98,103,105,143,153,165,167,171],"rm":0},{"id":"2405.04447","t":"Cosmology from one galaxy in a void?","ab":"Understanding galaxy properties may be the key to unlocking some of the most intriguing mysteries of modern cosmology. Recent work relied on machine learning to extract cosmological constraints on $Ω_\\mathrm{m}$ using only one galaxy. But if this is true, how should we select the galaxy to use for cosmology inference? In this paper, we consider selecting a galaxy that lies in cosmic voids, the underdense regions of the cosmic web, and compare the constraints obtained with the ones obtained when randomly selecting a galaxy in the whole sample. We use the IllustrisTNG galaxy catalog from the CAMELS project and the VIDE void finder to identify galaxies inside voids. We show that void galaxies provide stronger constraints on $Ω_\\mathrm{m}$ compared to randomly selected galaxies. This result suggests that the distinctive characteristics of void galaxies may provide a cleaner and more effective environment for extracting cosmological information.","abx":0,"nw":0,"d":"2024-05-07","dq":0,"y":2024,"au":[79,32],"c":14,"cs":0,"bib":"2024ApJ...970L..32W","v":"Astrophysical Journal Letters","lk":"arXiv:2405.04447","url":"https://arxiv.org/abs/2405.04447","doi":"10.3847/2041-8213/ad5ffe","tg":{"s":["IllustrisTNG"],"d":["Halo & galaxy catalogs"],"m":["Emulators & regression ML"],"u":["Emulators & regression ML"]},"x":0.1394,"yy":-0.0317,"p3":[0.2135,-0.0589,-0.2925],"sim":{"k":"e","l":[[154,0.953],[157,0.938],[158,0.934],[117,0.933],[74,0.932]]},"c3":[45.6,-154.89,-53.0],"c2":[140.59,-111.39],"k":7,"r":[115,117,129,130,157,171],"rm":0},{"id":"2404.04327","t":"Parameter estimation from Ly$α$ forest in Fourier space using Information Maximising Neural Network","ab":"We aim to present a robust parameter estimation with simulated Lya forest spectra from Sherwood-Relics simulations suite using Information Maximizing Neural Network(IMNN) to extract maximal information from Lya 1D-transmitted flux in Fourier space. We perform 1D estimations using IMNN for IGM thermal parameters $T_0$ & $γ$ at z=2-4 and cosmological parameters $σ_8$ & $n_s$ at z=3-4. We compare our results with estimates from power spectrum using posterior distribution from Markov Chain Monte Carlo(MCMC). We then check robustness of IMNN estimates against deviation in spectral noise levels,continuum uncertainties & instrumental smoothing effects. Using mock Lya forest sightlines from publicly available CAMELS project we also check the robustness of the trained IMNN on a different simulation. We also perform a 2D-parameter estimation for $T_0$ & HI photoionization rates $Γ_{HI}$. We obtain improved estimates of $T_0$ & $γ$ using IMNN over standard MCMC approach. These estimates are also more robust against SNR deviations at z=2 & 3. At z=4 the sensitivity to noise deviations is on par with MCMC estimates. The IMNN also provides $T_0$ and $γ$ estimates which are robust against continuum uncertainties by extracting continuum-independent small-scale information from Fourier domain. In case of $σ_8$ & $n_s$ IMNN performs on par with MCMC but still offers a significant speed boost in estimating parameters from a new dataset. The improved estimates with IMNN are seen for high instrumental-resolution(FWHM=6km/s). At medium or low resolutions IMNN performs similar to MCMC suggesting an improved extraction of small-scale information with IMNN. We also find that IMNN estimates are robust against the choice of simulation. By performing a 2D-parameter estimation for $T_0$ & $Γ_{HI}$ we also demonstrate how to take forward this approach observationally in the future.","abx":0,"nw":0,"d":"2024-04-05","dq":0,"y":2024,"au":[522,525,369,476,229],"c":7,"cs":0,"bib":"2024A&A...690A.154M","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2404.04327","url":"https://arxiv.org/abs/2404.04327","doi":"10.1051/0004-6361/202450259","tg":{"s":["Non-CAMELS simulations","CAMELS (suite not stated)"],"d":["Synthetic observables","Power spectra & summary statistics"],"m":["Other ML"],"u":[]},"x":0.3208,"yy":-0.0385,"p3":[0.283,0.0465,-0.2727],"sim":{"k":"e","l":[[31,0.95],[90,0.947],[25,0.942],[149,0.94],[124,0.939]]},"c3":[38.93,97.28,-59.67],"c2":[8.62,73.59],"k":6,"r":[118,171],"rm":0},{"id":"2403.10648","t":"Debiasing with Diffusion: Probabilistic reconstruction of Dark Matter fields from galaxies with CAMELS","ab":"Galaxies are biased tracers of the underlying cosmic web, which is dominated by dark matter components that cannot be directly observed. Galaxy formation simulations can be used to study the relationship between dark matter density fields and galaxy distributions. However, this relationship can be sensitive to assumptions in cosmology and astrophysical processes embedded in the galaxy formation models, that remain uncertain in many aspects. In this work, we develop a diffusion generative model to reconstruct dark matter fields from galaxies. The diffusion model is trained on the CAMELS simulation suite that contains thousands of state-of-the-art galaxy formation simulations with varying cosmological parameters and sub-grid astrophysics. We demonstrate that the diffusion model can predict the unbiased posterior distribution of the underlying dark matter fields from the given stellar mass fields, while being able to marginalize over uncertainties in cosmological and astrophysical models. Interestingly, the model generalizes to simulation volumes approximately 500 times larger than those it was trained on, and across different galaxy formation models. Code for reproducing these results can be found at https://github.com/victoriaono/variational-diffusion-cdm","abx":0,"nw":0,"d":"2024-03-15","dq":0,"y":2024,"au":[563,123,411,597,101,207],"c":24,"cs":0,"bib":"2024ApJ...970..174O","v":"Astrophysical Journal","lk":"arXiv:2403.10648","url":"https://arxiv.org/abs/2403.10648","doi":"10.3847/1538-4357/ad5957","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":-0.0166,"yy":0.8503,"p3":[-0.4923,-0.1069,0.1848],"sim":{"k":"e","l":[[109,0.965],[80,0.955],[105,0.955],[5,0.949],[13,0.948]]},"c3":[-100.98,-62.88,-43.28],"c2":[-114.26,-23.78],"k":5,"r":[109,130,133,143,165,167,171],"rm":0},{"id":"2403.10609","t":"Zooming by in the CARPoolGP lane: new CAMELS-TNG simulations of zoomed-in massive halos","ab":"Galaxy formation models within cosmological hydrodynamical simulations contain numerous parameters with non-trivial influences over the resulting properties of simulated cosmic structures and galaxy populations. It is computationally challenging to sample these high dimensional parameter spaces with simulations, particularly for halos in the high-mass end of the mass function. In this work, we develop a novel sampling and reduced variance regression method, CARPoolGP, which leverages built-in correlations between samples in different locations of high dimensional parameter spaces to provide an efficient way to explore parameter space and generate low variance emulations of summary statistics. We use this method to extend the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) to include a set of 768 zoom-in simulations of halos in the mass range of $10^{13} - 10^{14.5} M_\\odot\\,h^{-1}$ that span a 28-dimensional parameter space in the IllustrisTNG model. With these simulations and the CARPoolGP emulation method, we explore parameter trends in the Compton $Y-M$, black hole mass-halo mass, and metallicity-mass relations, as well as thermodynamic profiles and quenched fractions of satellite galaxies. We use these emulations to provide a physical picture of the complex interplay between supernova and active galactic nuclei feedback. We then use emulations of the $Y-M$ relation of massive halos to perform Fisher forecasts on astrophysical parameters for future Sunyaev-Zeldovich observations and find a significant improvement in forecasted constraints. We publicly release both the simulation suite and CARPoolGP software package.","abx":0,"nw":0,"d":"2024-03-15","dq":0,"y":2024,"au":[379,515,73,74,41,512,182,119,237,133,134,207,228],"c":23,"cs":0,"bib":"2024ApJ...968...11L","v":"Astrophysical Journal","lk":"arXiv:2403.10609","url":"https://arxiv.org/abs/2403.10609","doi":"10.3847/1538-4357/ad3d4a","tg":{"s":["Zoom-ins (zoomGZ)","IllustrisTNG"],"d":["Profiles","Power spectra & summary statistics"],"m":["Emulators & regression ML"],"u":[]},"x":0.1109,"yy":-0.2484,"p3":[0.1953,-0.0645,0.2217],"sim":{"k":"e","l":[[24,0.959],[12,0.959],[171,0.956],[11,0.955],[154,0.952]]},"c3":[126.67,95.15,1.35],"c2":[112.66,132.35],"k":3,"r":[122,124,128,130,133,137,147,156,159,166,167,170,171],"rm":0},{"id":"2403.08611","t":"Galaxy dispersion measured by Fast Radio Bursts as a probe of baryonic feedback models","ab":"Fast Radio Bursts (FRBs) are a sensitive probe of the electron distribution in both the large-scale structure and their host galaxies through the dispersion measure (DM) of the radio pulse. Baryonic feedback models are crucial for modelling small scales for ongoing cosmological surveys that are expected to change the electron distribution in galaxies in a way that can be probed by FRB observations. In this paper, we explore the impact of baryonic feedback on FRB hosts using numerical simulations and make a detailed study of the host galaxy dispersion as a function of redshift, galaxy type, feedback model and how these properties vary in independent simulation codes. We find that the host galaxy dispersion varies dramatically between different implementations of baryonic feedback, allowing FRBs with host identification to be a valuable probe of feedback physics and thus provide necessary priors for upcoming analysis of the statistical properties of the large-scale structure. We further find that any dependency on the exact location of events within the halo is small. While there exists an evolution of the dispersion measure with redshift and halo mass, it is largely driven by varying star formation rates of the halo. Spectral information from FRB hosts can therefore be used to put priors on the host galaxy dispersion measure, and FRBs can be used to distinguish between competing models of baryonic feedback in future studies.","abx":0,"nw":0,"d":"2024-03-13","dq":0,"y":2024,"au":[28,527,473,273],"c":30,"cs":0,"bib":"2024arXiv240308611T","v":"","lk":"arXiv:2403.08611","url":"https://arxiv.org/abs/2403.08611","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["Synthetic observables"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":0.4339,"yy":-0.9887,"p3":[-0.1241,-0.6187,0.2907],"sim":{"k":"e","l":[[83,0.941],[69,0.936],[101,0.93],[78,0.929],[155,0.921]]},"c3":[108.55,42.44,67.26],"c2":[156.42,78.44],"k":1,"r":[101,130,138,158,171],"rm":0},{"id":"2403.02313","t":"Probing the Circum-Galactic Medium with Fast Radio Bursts: Insights from the CAMELS Simulations","ab":"Most diffuse baryons, including the circumgalactic medium (CGM) surrounding galaxies and the intergalactic medium (IGM) in the cosmic web, remain unmeasured and unconstrained. Fast Radio Bursts (FRBs) offer an unparalleled method to measure the electron dispersion measures (DMs) of ionized baryons. Their distribution can resolve the missing baryon problem, and constrain the history of feedback theorized to impart significant energy to the CGM and IGM. We analyze the Cosmology and Astrophysics in Machine Learning (CAMEL) Simulations, using three suites: IllustrisTNG, SIMBA, and Astrid, each varying 6 parameters (2 cosmological & 4 astrophysical feedback), for a total of 183 distinct simulation models. We find significantly different predictions between the fiducial models of the suites, owing to their different implementations of feedback. SIMBA exhibits the strongest feedback, leading to the smoothest distribution of baryons, reducing the sightline-to-sightline variance in DMs between z=0-1. Astrid has the weakest feedback and the largest variance. We calculate FRB CGM measurements as a function of galaxy impact parameter, with SIMBA showing the weakest DMs due to aggressive AGN feedback and Astrid the strongest. Within each suite, the largest differences are due to varying AGN feedback. IllustrisTNG shows the most sensitivity to supernova feedback, but this is due to the change in the AGN feedback strengths, demonstrating that black holes, not stars, are most capable of redistributing baryons in the IGM and CGM. We compare our statistics directly to recent observations, paving the way for the use of FRBs to constrain the physics of galaxy formation and evolution.","abx":0,"nw":0,"d":"2024-03-04","dq":0,"y":2024,"au":[249,133,455,69,134,207],"c":48,"cs":0,"bib":"2024ApJ...967...32M","v":"Astrophysical Journal","lk":"arXiv:2403.02313","url":"https://arxiv.org/abs/2403.02313","doi":"10.3847/1538-4357/ad3070","tg":{"s":["IllustrisTNG","SIMBA","Astrid"],"d":["Synthetic observables"],"m":["No ML"],"u":[]},"x":0.5044,"yy":-0.6757,"p3":[0.0464,-0.5709,0.1085],"sim":{"k":"e","l":[[89,0.961],[78,0.959],[124,0.958],[141,0.955],[156,0.955]]},"c3":[145.03,17.57,85.4],"c2":[204.42,59.73],"k":1,"r":[122,124,130,137,138,145,155,158,160,166,171],"rm":0},{"id":"2402.10997","t":"Cosmological multifield emulator","ab":"We demonstrate the use of deep network to learn the distribution of data from state-of-the-art hydrodynamic simulations of the CAMELS project. To this end, we train a generative adversarial network to generate images composed of three different channels that represent gas density (Mgas), neutral hydrogen density (HI), and magnetic field amplitudes (B). We consider an unconstrained model and another scenario where the model is conditioned on the matter density $Ω_{\\rm m}$ and the amplitude of density fluctuations $σ_{8}$. We find that the generated images exhibit great quality which is on a par with that of data, visually. Quantitatively, we find that our model generates maps whose statistical properties, quantified by probability distribution function of pixel values and auto-power spectra, agree reasonably well with those of the real maps. Moreover, the cross-correlations between fields in all maps produced by the emulator are in good agreement with those of the real images, which indicates that our model generates instances whose maps in all three channels describe the same physical region. Furthermore, a CNN regressor, which has been trained to extract $Ω_{\\rm m}$ and $σ_{8}$ from CAMELS multifield dataset, recovers the cosmology from the maps generated by our conditional model, achieving $R^{2}$ = 0.96 and 0.83 corresponding to $Ω_{\\rm m}$ and $σ_{8}$ respectively. This further demonstrates the great capability of the model to mimic CAMELS data. Our model can be useful for generating data that are required to analyze the information from upcoming multi-wavelength cosmological surveys.","abx":0,"nw":0,"d":"2024-02-16","dq":0,"y":2024,"au":[499,532,207],"c":5,"cs":0,"bib":"2025Ap&SS.370...44A","v":"Astrophysics and Space Science","lk":"arXiv:2402.10997","url":"https://arxiv.org/abs/2402.10997","doi":"10.1007/s10509-025-04440-9","tg":{"s":["IllustrisTNG"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":-0.3713,"yy":0.6424,"p3":[-0.1833,0.4402,-0.5279],"sim":{"k":"e","l":[[144,0.97],[113,0.956],[167,0.953],[85,0.945],[66,0.94]]},"c3":[-90.58,88.76,-14.49],"c2":[-133.76,78.38],"k":0,"r":[85,106,131,149,158,164,165,171],"rm":0},{"id":"2401.15891","t":"A field-level emulator for modeling baryonic effects across hydrodynamic simulations","ab":"We develop a new and simple method to model baryonic effects at the field level relevant for weak lensing analyses. We analyze thousands of state-of-the-art hydrodynamic simulations from the CAMELS project, each with different cosmology and strength of feedback, and we find that the cross-correlation coefficient between full hydrodynamic and N-body simulations is very close to 1 down to $k\\sim10~h{\\rm Mpc}^{-1}$. This suggests that modeling baryonic effects at the field level down to these scales only requires N-body simulations plus a correction to the mode's amplitude given by: $\\sqrt{P_{\\rm hydro}(k)/P_{\\rm nbody}(k)}$. In this paper, we build an emulator for this quantity, using Gaussian processes, that is flexible enough to reproduce results from thousands of hydrodynamic simulations that have different cosmologies, astrophysics, subgrid physics, volumes, resolutions, and at different redshifts. Our emulator is accurate at the percent level and exhibits a range of validation superior to previous studies. This method and our emulator enable field-level simulation-based inference analyses and accounting for baryonic effects in weak lensing analyses.","abx":0,"nw":0,"d":"2024-01-29","dq":0,"y":2024,"au":[153,77,207,555],"c":29,"cs":0,"bib":"2025MNRAS.538.1415S","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2401.15891","url":"https://arxiv.org/abs/2401.15891","doi":"10.1093/mnras/staf355","tg":{"s":["CAMELS (suite not stated)","N-body (dark matter only)"],"d":["3D fields","Power spectra & summary statistics"],"m":["Emulators & regression ML"],"u":[]},"x":-0.0459,"yy":-0.5403,"p3":[0.1237,0.1088,0.1527],"sim":{"k":"e","l":[[62,0.954],[166,0.949],[17,0.946],[99,0.945],[43,0.942]]},"c3":[-36.31,34.95,1.45],"c2":[-75.09,16.98],"k":9,"r":[122,130,158,166,167,171],"rm":0},{"id":"2401.12318","t":"Modeling the Kinematics of Central and Satellite Galaxies Using Normalizing Flows","ab":"Galaxy clustering contains information on cosmology, galaxy evolution, and the relationship between galaxies and their dark matter hosts. On small scales, the detailed kinematics of gala
