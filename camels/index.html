xies within their host halos determines the galaxy clustering. In this paper, we investigate the dependence of the central and satellite galaxy kinematics on $\\boldsymbolθ$, the intrinsic host halo properties (mass, spin, concentration), cosmology ($Ω_{\\textrm{m}}$, $σ_8$), and baryonic feedback from active galactic nuclei and supernovae ($A_{\\rm AGN1}$, $A_{\\rm AGN2}$, $A_{\\rm SN1}$, $A_{\\rm SN2}$). We utilize 2,000 hydrodynamic simulations in CAMELS run using IllustrisTNG and SIMBA galaxy formation models. Focusing on central and satellite galaxies with $M>10^9M_\\ast$, we apply neural density estimation (NDE) with normalizing flows to estimate their $p(Δr|\\boldsymbolθ)$ and $p(Δv|\\boldsymbolθ)$, where $Δr$ and $Δv$ are the magnitudes of the halo-centric spatial and velocity offsets. With NDE, we accurately capture the dependence of galaxy kinematics on each component of $\\boldsymbolθ$. For central galaxies, we identify significant spatial and velocity biases dependent on halo mass, concentration, and spin. For satellite distributions, we find significant deviations from an NFW profile and evidence that they consist of distinct orbiting and infalling populations. However, we find no significant dependence on $\\boldsymbolθ$ besides a weak dependence on host halo spin. For both central and satellite galaxies, there is no significant dependence on cosmological parameters and baryonic feedback. These results provide key insights for improving the current halo occupation distribution (HOD) models. This work is the first in a series that will re-examine and develop HOD frameworks for improved modeling of galaxy clustering at smaller scales.","abx":0,"nw":0,"d":"2024-01-22","dq":0,"y":2024,"au":[294,105],"c":6,"cs":0,"bib":"2024ApJ...976...76K","v":"","lk":"arXiv:2401.12318","url":"https://arxiv.org/abs/2401.12318","doi":"","tg":{"s":["IllustrisTNG","SIMBA"],"d":["Halo & galaxy catalogs"],"m":["Normalizing flows"],"u":[]},"x":0.187,"yy":-0.2048,"p3":[-0.0117,-0.0509,0.1881],"sim":{"k":"e","l":[[99,0.95],[80,0.947],[12,0.945],[44,0.943],[123,0.943]]},"c3":[1.96,62.37,-79.33],"c2":[-50.82,113.78],"k":6,"r":[158,163,164,171],"rm":0},{"id":"2312.07534","t":"Cosmological Field Emulation and Parameter Inference with Diffusion Models","ab":"Cosmological simulations play a crucial role in elucidating the effect of physical parameters on the statistics of fields and on constraining parameters given information on density fields. We leverage diffusion generative models to address two tasks of importance to cosmology -- as an emulator for cold dark matter density fields conditional on input cosmological parameters $Ω_m$ and $σ_8$, and as a parameter inference model that can return constraints on the cosmological parameters of an input field. We show that the model is able to generate fields with power spectra that are consistent with those of the simulated target distribution, and capture the subtle effect of each parameter on modulations in the power spectrum. We additionally explore their utility as parameter inference models and find that we can obtain tight constraints on cosmological parameters.","abx":0,"nw":0,"d":"2023-12-12","dq":0,"y":2023,"au":[411,101,154],"c":13,"cs":0,"bib":"2023arXiv231207534M","v":"arXiv.org","lk":"arXiv:2312.07534","url":"https://arxiv.org/abs/2312.07534","doi":"10.48550/arXiv.2312.07534","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":-0.0616,"yy":0.9341,"p3":[-0.6136,0.0208,0.1389],"sim":{"k":"e","l":[[95,0.969],[98,0.955],[109,0.954],[80,0.948],[143,0.948]]},"c3":[-120.24,2.7,-102.1],"c2":[-149.55,47.9],"k":5,"r":[165,167,171],"rm":0},{"id":"2311.18007","t":"Towards out-of-distribution generalization in large-scale astronomical surveys: robust networks learn similar representations","ab":"The generalization of machine learning (ML) models to out-of-distribution (OOD) examples remains a key challenge in extracting information from upcoming astronomical surveys. Interpretability approaches are a natural way to gain insights into the OOD generalization problem. We use Centered Kernel Alignment (CKA), a similarity measure metric of neural network representations, to examine the relationship between representation similarity and performance of pre-trained Convolutional Neural Networks (CNNs) on the CAMELS Multifield Dataset. We find that when models are robust to a distribution shift, they produce substantially different representations across their layers on OOD data. However, when they fail to generalize, these representations change less from layer to layer on OOD data. We discuss the potential application of similarity representation in guiding model design, training strategy, and mitigating the OOD problem by incorporating CKA as an inductive bias during training.","abx":0,"nw":0,"d":"2023-11-29","dq":0,"y":2023,"au":[589,532,409,499],"c":2,"cs":0,"bib":"2023arXiv231118007G","v":"arXiv.org","lk":"arXiv:2311.18007","url":"https://arxiv.org/abs/2311.18007","doi":"10.48550/arXiv.2311.18007","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["CNN"],"u":[]},"x":-0.5828,"yy":0.7906,"p3":[-0.1083,0.4736,-0.3048],"sim":{"k":"e","l":[[47,0.936],[85,0.928],[142,0.923],[164,0.921],[149,0.92]]},"c3":[-83.19,45.52,-69.66],"c2":[-102.29,80.88],"k":0,"r":[165,167,171],"rm":0},{"id":"2311.18017","t":"Learning an Effective Evolution Equation for Particle-Mesh Simulations Across Cosmologies","ab":"Particle-mesh simulations trade small-scale accuracy for speed compared to traditional, computationally expensive N-body codes in cosmological simulations. In this work, we show how a data-driven model could be used to learn an effective evolution equation for the particles, by correcting the errors of the particle-mesh potential incurred on small scales during simulations. We find that our learnt correction yields evolution equations that generalize well to new, unseen initial conditions and cosmologies. We further demonstrate that the resulting corrected maps can be used in a simulation-based inference framework to yield an unbiased inference of cosmological parameters. The model, a network implemented in Fourier space, is exclusively trained on the particle positions and velocities.","abx":0,"nw":0,"d":"2023-11-29","dq":0,"y":2023,"au":[423,441,327,101,112,590],"c":6,"cs":0,"bib":"2023arXiv231118017P","v":"","lk":"arXiv:2311.18017","url":"https://arxiv.org/abs/2311.18017","doi":"","tg":{"s":["N-body (dark matter only)","CAMELS (suite not stated)"],"d":["Particle snapshots"],"m":["Other ML","Simulation-based inference"],"u":["N-body (dark matter only)","CAMELS (suite not stated)"]},"x":-0.5248,"yy":0.2069,"p3":[-0.3184,0.3745,0.1037],"sim":{"k":"e","l":[[4,0.962],[48,0.951],[150,0.95],[67,0.943],[66,0.941]]},"c3":[-55.84,-0.71,33.24],"c2":[-48.07,-42.16],"k":4,"r":[130,150,158,171],"rm":0},{"id":"2311.10088","t":"Taming assembly bias for primordial non-Gaussianity","ab":"Primordial non-Gaussianity of the local type induces a strong scale-dependent bias on the clustering of halos in the late-time Universe. This signature is particularly promising to provide constraints on the non-Gaussianity parameter $f_{\\rm NL}$ from galaxy surveys, as the bias amplitude grows with scale and becomes important on large, linear scales. However, there is a well-known degeneracy between the real prize, the $f_{\\rm NL}$ parameter, and the (non-Gaussian) assembly bias i.e., the halo formation history-dependent contribution to the amplitude of the signal, which could seriously compromise the ability of large-scale structure surveys to constrain $f_{\\rm NL}$. We show how the assembly bias can be modeled and constrained, thus almost completely recovering the power of galaxy surveys to competitively constrain primordial non-Gaussianity. In particular, studying hydrodynamical simulations, we find that a proxy for the halo properties that determine assembly bias can be constructed from photometric properties of galaxies. Using a prior on the assembly bias guided by this proxy degrades the statistical errors on $f_{\\rm NL}$ only mildly compared to an ideal case where the assembly bias is perfectly known. The systematic error on $f_{\\rm NL}$ that the proxy induces can be safely kept under control.","abx":0,"nw":0,"d":"2023-11-16","dq":0,"y":2023,"au":[178,335,207,359,579,217,152,389,44,73],"c":27,"cs":0,"bib":"2024JCAP...02..048F","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2311.10088","url":"https://arxiv.org/abs/2311.10088","doi":"10.1088/1475-7516/2024/02/048","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":-0.3403,"yy":-0.7741,"p3":[0.2154,0.4506,0.3377],"sim":{"k":"e","l":[[33,0.926],[73,0.925],[30,0.924],[86,0.919],[21,0.919]]},"c3":[4.88,-102.27,76.23],"c2":[31.09,-106.59],"k":3,"r":[130,171],"rm":0},{"id":"2311.08558","t":"Probabilistic reconstruction of Dark Matter fields from biased tracers using diffusion models","ab":"Galaxies are biased tracers of the underlying cosmic web, which is dominated by dark matter components that cannot be directly observed. The relationship between dark matter density fields and galaxy distributions can be sensitive to assumptions in cosmology and astrophysical processes embedded in the galaxy formation models, that remain uncertain in many aspects. Based on state-of-the-art galaxy formation simulation suites with varied cosmological parameters and sub-grid astrophysics, we develop a diffusion generative model to predict the unbiased posterior distribution of the underlying dark matter fields from the given stellar mass fields, while being able to marginalize over the uncertainties in cosmology and galaxy formation.","abx":0,"nw":0,"d":"2023-11-14","dq":0,"y":2023,"au":[123,563,411,597,101],"c":8,"cs":0,"bib":"2023arXiv231108558P","v":"arXiv.org","lk":"arXiv:2311.08558","url":"https://arxiv.org/abs/2311.08558","doi":"10.48550/arXiv.2311.08558","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":-0.001,"yy":0.8996,"p3":[-0.5999,-0.1202,0.1304],"sim":{"k":"e","l":[[98,0.965],[105,0.954],[95,0.938],[13,0.936],[80,0.933]]},"c3":[-84.64,-93.55,-59.74],"c2":[-89.32,-51.71],"k":5,"r":[130,143,165,171],"rm":0},{"id":"2311.03491","t":"Baryonic Imprints on DM Halos: the concentration-mass relation and its dependence on halo and galaxy properties","ab":"The halo concentration-mass relation has ubiquitous use in modeling the matter field for cosmological and astrophysical analyses, and including the imprints from galaxy formation physics is tantamount to its robust usage. Many analyses, however, probe the matter around halos selected by a given halo/galaxy property -- rather than by halo mass -- and the imprints under each selection choice can be different. We employ the CAMELS simulation suite to quantify the astrophysics and cosmology dependence of the concentration-mass relation, $c_{\\rm vir}-M_{\\rm vir}$, when selected on five properties: (i) velocity dispersion, (ii) formation time, (iii) halo spin, (iv) stellar mass, and (v) gas mass. We construct simulation-informed nonlinear models for all properties as a function of halo mass, redshift, and six cosmological/astrophysical parameters, with a mass range $M_{\\rm vir} \\in [10^{11}, 10^{14.5}] M_\\odot/h$. There are many mass-dependent imprints in all halo properties, with clear connections across different properties and non-linear couplings between the parameters. Finally, we extract the $c_{\\rm vir}-M_{\\rm vir}$ relation for subsamples of halos that have scattered above/below the mean property-$M_{\\rm vir}$ relation for a chosen property. Selections on gas mass or stellar mass have a significant impact on the astrophysics/cosmology dependence of $c_{\\rm vir}$, while those on any of the other three properties have a significant (mild) impact on the cosmology (astrophysics) dependence. We show that ignoring such selection effects can lead to errors of $\\approx 25\\%$ in baryon imprint modelling of $c_{\\rm vir}$. Our nonlinear model for all properties is made publicly available.","abx":0,"nw":0,"d":"2023-11-06","dq":0,"y":2023,"au":[400,149],"c":10,"cs":0,"bib":"2024OJAp....7E..29S","v":"The Open Journal of Astrophysics","lk":"arXiv:2311.03491","url":"https://arxiv.org/abs/2311.03491","doi":"10.33232/001c.116969","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Emulators & regression ML"],"u":["Emulators & regression ML"]},"x":0.1513,"yy":-0.4779,"p3":[0.2858,-0.0084,0.4682],"sim":{"k":"e","l":[[139,0.98],[7,0.976],[6,0.963],[99,0.945],[89,0.945]]},"c3":[157.01,-43.37,16.4],"c2":[162.72,-49.99],"k":9,"r":[122,128,130,138,139,171],"rm":0},{"id":"2311.01588","t":"Domain Adaptive Graph Neural Networks for Constraining Cosmological Parameters Across Multiple Data Sets","ab":"Deep learning models have been shown to outperform methods that rely on summary statistics, like the power spectrum, in extracting information from complex cosmological data sets. However, due to differences in the subgrid physics implementation and numerical approximations across different simulation suites, models trained on data from one cosmological simulation show a drop in performance when tested on another. Similarly, models trained on any of the simulations would also likely experience a drop in performance when applied to observational data. Training on data from two different suites of the CAMELS hydrodynamic cosmological simulations, we examine the generalization capabilities of Domain Adaptive Graph Neural Networks (DA-GNNs). By utilizing GNNs, we capitalize on their capacity to capture structured scale-free cosmological information from galaxy distributions. Moreover, by including unsupervised domain adaptation via Maximum Mean Discrepancy (MMD), we enable our models to extract domain-invariant features. We demonstrate that DA-GNN achieves higher accuracy and robustness on cross-dataset tasks (up to $28\\%$ better relative error and up to almost an order of magnitude better $χ^2$). Using data visualizations, we show the effects of domain adaptation on proper latent space data alignment. This shows that DA-GNNs are a promising method for extracting domain-independent cosmological information, a vital step toward robust deep learning for real cosmic survey data.","abx":0,"nw":0,"d":"2023-11-02","dq":0,"y":2023,"au":[45,24,356,207,84],"c":27,"cs":0,"bib":"2023arXiv231101588R","v":"Domain Adaptive Graph Neural Networks for Constraining Cosmological Parameters Across Multiple Data Sets","lk":"arXiv:2311.01588","url":"https://arxiv.org/abs/2311.01588","doi":"10.48550/arXiv.2311.01588","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks"],"u":[]},"x":0.1543,"yy":0.3899,"p3":[0.3445,0.2355,-0.279],"sim":{"k":"e","l":[[153,0.953],[114,0.941],[16,0.941],[133,0.939],[171,0.938]]},"c3":[18.62,36.24,-179.77],"c2":[-35.59,72.51],"k":8,"r":[133,146,153,163,165,166,171],"rm":0},{"id":"2311.00833","t":"HIDM: Emulating Large Scale HI Maps using Score-based Diffusion Models","ab":"Efficiently analyzing maps from upcoming large-scale surveys requires gaining direct access to a high-dimensional likelihood and generating large-scale fields with high fidelity, which both represent major challenges. Using CAMELS simulations, we employ the state-of-the-art score-based diffusion models to simultaneously achieve both tasks. We show that our model, HIDM, is able to efficiently generate high fidelity large scale HI maps that are in a good agreement with the CAMELS's power spectrum, probability distribution, and likelihood up to second moments. HIDM represents a step forward towards maximizing the scientific return of future large scale surveys.","abx":0,"nw":0,"d":"2023-11-01","dq":0,"y":2023,"au":[532,499],"c":3,"cs":0,"bib":"2023arXiv231100833H","v":"","lk":"arXiv:2311.00833","url":"https://arxiv.org/abs/2311.00833","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":-0.3458,"yy":0.9003,"p3":[-0.3505,0.2655,-0.1961],"sim":{"k":"e","l":[[142,0.919],[4,0.916],[37,0.914],[166,0.91],[47,0.909]]},"c3":[-100.37,-0.3,-1.65],"c2":[-97.17,-13.45],"k":5,"r":[131,142,143,164,165,171],"rm":0},{"id":"2311.00799","t":"Latent space representations of cosmological fields","ab":"We investigate the possibility of learning the representations of cosmological multifield dataset from the CAMELS project. We train a very deep variational encoder on images which comprise three channels, namely gas density (Mgas), neutral hydrogen density (HI), and magnetic field amplitudes (B). The clustering of the images in feature space with respect to some cosmological/astrophysical parameters (e.g. $Ω_{\\rm m}$) suggests that the generative model has learned latent space representations of the high dimensional inputs. We assess the quality of the latent codes by conducting a linear test on the extracted features, and find that a single dense layer is capable of recovering some of the parameters to a promising level of accuracy, especially the matter density whose prediction corresponds to a coefficient of determination $R^{2}$ = 0.93. Furthermore, results show that the generative model is able to produce images that exhibit statistical properties which are consistent with those of the training data, down to scales of $k\\sim 4h/{\\rm Mpc}.$","abx":0,"nw":0,"d":"2023-11-01","dq":0,"y":2023,"au":[499,532],"c":3,"cs":0,"bib":"2023arXiv231100799A","v":"","lk":"arXiv:2311.00799","url":"https://arxiv.org/abs/2311.00799","doi":"","tg":{"s":["IllustrisTNG"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":-0.3894,"yy":0.6914,"p3":[-0.2851,0.4754,-0.4217],"sim":{"k":"e","l":[[102,0.956],[144,0.947],[56,0.942],[85,0.941],[149,0.94]]},"c3":[-97.82,67.42,-90.8],"c2":[-126.89,40.63],"k":0,"r":[149,165,171],"rm":0},{"id":"2310.15234","t":"Field-level simulation-based inference with galaxy catalogs: the impact of systematic effects","ab":"It has been recently shown that a powerful way to constrain cosmological parameters from galaxy redshift surveys is to train graph neural networks to perform field-level likelihood-free inference without imposing cuts on scale. In particular, de Santi et al. (2023) developed models that could accurately infer the value of $Ω_{\\rm m}$ from catalogs that only contain the positions and radial velocities of galaxies that are robust to uncertainties in astrophysics and subgrid models. However, observations are affected by many effects, including 1) masking, 2) uncertainties in peculiar velocities and radial distances, and 3) different galaxy selections. Moreover, observations only allow us to measure redshift, intertwining galaxies' radial positions and velocities. In this paper we train and test our models on galaxy catalogs, created from thousands of state-of-the-art hydrodynamic simulations run with different codes from the CAMELS project, that incorporate these observational effects. We find that, although the presence of these effects degrades the precision and accuracy of the models, and increases the fraction of catalogs where the model breaks down, the fraction of galaxy catalogs where the model performs well is over 90 %, demonstrating the potential of these models to constrain cosmological parameters even when applied to real data.","abx":0,"nw":0,"d":"2023-10-23","dq":0,"y":2023,"au":[410,207,318,239,340,544,597,118,168,200,140,309,325,363],"c":15,"cs":0,"bib":"2025JCAP...01..082D","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2310.15234","url":"https://arxiv.org/abs/2310.15234","doi":"10.1088/1475-7516/2025/01/082","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":0.0662,"yy":0.3917,"p3":[0.2843,0.2706,-0.3596],"sim":{"k":"e","l":[[153,0.973],[133,0.972],[16,0.962],[146,0.959],[44,0.953]]},"c3":[56.01,-61.12,-137.14],"c2":[80.45,125.25],"k":8,"r":[123,130,132,133,146,153,154,155,158,165,167,169,171],"rm":0},{"id":"2310.08634","t":"Cosmology with Galaxy Photometry Alone","ab":"We present the first cosmological constraints using only the observed photometry of galaxies. Villaescusa-Navarro et al. (2022; arXiv:2201.02202) recently demonstrated that the internal physical properties of a single simulated galaxy contain a significant amount of cosmological information. These physical properties, however, cannot be directly measured from observations. In this work, we present how we can go beyond theoretical demonstrations to infer cosmological constraints from actual galaxy observables (e.g. optical photometry) using neural density estimation and the CAMELS suite of hydrodynamical simulations. We find that the cosmological information in the photometry of a single galaxy is limited. However, we combine the constraining power of photometry from many galaxies using hierarchical population inference and place significant cosmological constraints. With the observed photometry of $\\sim$20,000 NASA-Sloan Atlas galaxies, we constrain $Ω_m = 0.323^{+0.075}_{-0.095}$ and $σ_8 = 0.799^{+0.088}_{-0.085}$.","abx":0,"nw":0,"d":"2023-10-12","dq":0,"y":2023,"au":[105,207,450,478],"c":0,"cs":0,"bib":"2023mla..confE..14H","v":"Astrophysical Journal Letters","lk":"arXiv:2310.08634","url":"https://arxiv.org/abs/2310.08634","doi":"10.3847/2041-8213/ad3f1e","tg":{"s":["CAMELS (suite not stated)"],"d":["Synthetic observables","Halo & galaxy catalogs"],"m":["Simulation-based inference"],"u":[]},"x":-0.2516,"yy":0.233,"p3":[0.182,0.1416,-0.5358],"sim":{"k":"e","l":[[157,0.957],[117,0.954],[133,0.952],[167,0.949],[166,0.949]]},"c3":[23.66,-128.29,-48.76],"c2":[140.35,-71.76],"k":7,"r":[117,129,157,158,171],"rm":0},{"id":"2310.04499","t":"Exploring chemical enrichment of the intracluster medium with the Line Emission Mapper","ab":"Synthesized in the cores of stars and supernovae, most metals disperse over cosmic scales and are ultimately deposited well outside the gravitational potential of their host galaxies. Since their presence is well visible through their X-ray emission lines in the hot gas pervading galaxy clusters, measuring metal abundances in the intracluster medium (ICM) offers us a unique view of chemical enrichment of the Universe as a whole. Despite extraordinary progress in the field thanks to four decades of X-ray spectroscopy using CCD (and gratings) instruments, understanding the precise stellar origins of the bulk of metals, and when the latter were mixed on Mpc scales, requires an X-ray mission capable of spatial, non-dispersive high resolution spectroscopy covering at least the soft X-ray band over a large field of view. In this White Paper, we demonstrate how the Line Emission Mapper (LEM) probe mission concept will revolutionize our current picture of the ICM enrichment. Specifically, we show that LEM will be able to (i) spatially map the distribution of ten key chemical elements out to the virial radius of a nearby relaxed cluster and (ii) measure metal abundances in serendipitously discovered high-redshift protoclusters. Altogether, these key observables will allow us to constrain the chemical history of the largest gravitationally bound structures of the Universe. They will also solve key questions such as the universality of the initial mass function (IMF) and the initial metallicity of the stellar populations producing these metals, as well as the relative contribution of asymptotic giant branch (AGB) stars, core-collapse, and Type Ia supernovae to enrich the cosmic web over Mpc scales. Concrete observing strategies are also briefly discussed.","abx":0,"nw":0,"d":"2023-10-06","dq":0,"y":2023,"au":[209,596,380,121,61,170,507,248,56,466,48,398,580,117,275,526,309,561,184,396,278,605,246,428,414,454,529,363,49,397],"c":6,"cs":0,"bib":"2023arXiv231004499M","v":"","lk":"arXiv:2310.04499","url":"https://arxiv.org/abs/2310.04499","doi":"","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Synthetic observables"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":0.7228,"yy":-0.7355,"p3":[0.2263,-0.5112,-0.0187],"sim":{"k":"e","l":[[148,0.917],[20,0.913],[90,0.911],[101,0.91],[1,0.908]]},"c3":[-97.46,-58.49,55.26],"c2":[-46.27,-140.14],"k":6,"r":[171],"rm":0},{"id":"2309.12048","t":"Cosmology with multiple galaxies","ab":"Recent works have discovered a relatively tight correlation between $Ω_{\\rm m}$ and properties of individual simulated galaxies. Because of this, it has been shown that constraints on $Ω_{\\rm m}$ can be placed using the properties of individual galaxies while accounting for uncertainties on astrophysical processes such as feedback from supernova and active galactic nuclei. In this work, we quantify whether using the properties of multiple galaxies simultaneously can tighten those constraints. For this, we train neural networks to perform likelihood-free inference on the value of two cosmological parameters ($Ω_{\\rm m}$ and $σ_8$) and four astrophysical parameters using the properties of several galaxies from thousands of hydrodynamic simulations of the CAMELS project. We find that using properties of more than one galaxy increases the precision of the $Ω_{\\rm m}$ inference. Furthermore, using multiple galaxies enables the inference of other parameters that were poorly constrained with one single galaxy. We show that the same subset of galaxy properties are responsible for the constraints on $Ω_{\\rm m}$ from one and multiple galaxies. Finally, we quantify the robustness of the model and find that without identifying the model range of validity, the model does not perform well when tested on galaxies from other galaxy formation models.","abx":0,"nw":0,"d":"2023-09-21","dq":0,"y":2023,"au":[104,207,422,597,105,134],"c":16,"cs":0,"bib":"2024ApJ...969..105C","v":"Astrophysical Journal","lk":"arXiv:2309.12048","url":"https://arxiv.org/abs/2309.12048","doi":"10.3847/1538-4357/ad4969","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Simulation-based inference"],"u":[]},"x":-0.2343,"yy":0.1703,"p3":[0.1764,-0.0295,-0.4465],"sim":{"k":"e","l":[[157,0.967],[115,0.954],[72,0.946],[171,0.945],[130,0.945]]},"c3":[9.9,-136.71,-73.31],"c2":[86.63,-102.07],"k":7,"r":[119,129,130,140,157,158,165,171],"rm":0},{"id":"2309.07912","t":"An Observationally Driven Multifield Approach for Probing the Circum-Galactic Medium with Convolutional Neural Networks","ab":"The circum-galactic medium (CGM) can feasibly be mapped by multiwavelength surveys covering broad swaths of the sky. With multiple large datasets becoming available in the near future, we develop a likelihood-free Deep Learning technique using convolutional neural networks (CNNs) to infer broad-scale physical properties of a galaxy's CGM and its halo mass for the first time. Using CAMELS (Cosmology and Astrophysics with MachinE Learning Simulations) data, including IllustrisTNG, SIMBA, and Astrid models, we train CNNs on Soft X-ray and 21-cm (HI) radio 2D maps to trace hot and cool gas, respectively, around galaxies, groups, and clusters. Our CNNs offer the unique ability to train and test on ''multifield'' datasets comprised of both HI and X-ray maps, providing complementary information about physical CGM properties and improved inferences. Applying eRASS:4 survey limits shows that X-ray is not powerful enough to infer individual halos with masses $\\log(M_{\\rm{halo}}/M_{\\odot}) < 12.5$. The multifield improves the inference for all halo masses. Generally, the CNN trained and tested on Astrid (SIMBA) can most (least) accurately infer CGM properties. Cross-simulation analysis -- training on one galaxy formation model and testing on another -- highlights the challenges of developing CNNs trained on a single model to marginalize over astrophysical uncertainties and perform robust inferences on real data. The next crucial step in improving the resulting inferences on physical CGM properties hinges on our ability to interpret these deep-learning models.","abx":0,"nw":0,"d":"2023-09-14","dq":0,"y":2023,"au":[408,69,133,207,134],"c":7,"cs":0,"bib":"2024MNRAS.52710038G","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2309.07912","url":"https://arxiv.org/abs/2309.07912","doi":"10.1093/mnras/stad3784","tg":{"s":["IllustrisTNG","SIMBA","Astrid"],"d":["2D maps","Synthetic observables"],"m":["CNN"],"u":[]},"x":0.5345,"yy":-0.733,"p3":[0.1651,-0.3807,0.0343],"sim":{"k":"e","l":[[101,0.953],[89,0.942],[154,0.941],[124,0.938],[90,0.937]]},"c3":[70.38,57.67,-116.22],"c2":[49.18,136.9],"k":6,"r":[122,129,130,133,153,165,166,167,171],"rm":0},{"id":"2308.14822","t":"CASCO: Cosmological and AStrophysical parameters from Cosmological simulations and Observations -- I. Constraining physical processes in local star-forming galaxies","ab":"We compare the structural properties and dark matter content of star-forming galaxies taken from the CAMELS cosmological simulations to the observed trends derived from the SPARC sample in the stellar mass range $[10^{9}, 10^{11}]\\,\\textrm{M}_{\\odot}$, to provide constraints on the value of cosmological and astrophysical (SN- and AGN-related) parameters. We consider the size-, internal DM fraction-, internal DM mass- and total-stellar mass relations for all the 1065 simulations from the IllustrisTNG, SIMBA and ASTRID suites of CAMELS, and search for the parameters that minimize the $χ^{2}$ with respect to the observations. For the IllustrisTNG suite, we find the following constraints for the cosmological parameters: $Ω_{\\textrm{m}} = 0.27_{-0.05}^{+0.01}$, $σ_{8} = 0.83_{-0.11}^{+0.08}$ and $S_{8} = 0.78_{-0.09}^{+0.03}$, which are consistent within $1σ$ with the results from the nine-year WMAP observations. SN feedback-related astrophysical parameters, which describe the departure of outflow wind energy per unit star formation rate and wind velocity from the reference IllustrisTNG simulations, assume the following values: $A_{\\textrm{SN1}} = 0.48_{-0.16}^{+0.25}$ and $A_{\\textrm{SN2}} = 1.21_{-0.34}^{+0.03}$, respectively. Therefore, simulations with a lower value of outflow wind energy per unit star formation rate with respect to the reference illustrisTNG simulation better reproduce the observations. Simulations based on SIMBA and ASTRID suites predict central dark matter masses substantially larger than those observed in real galaxies, which can be reconciled with observations only by requiring values of $Ω_{\\textrm{m}}$ inconsistent with cosmological constraints for SIMBA, or simulations characterized by unrealistic galaxy mass distributions for ASTRID.","abx":0,"nw":0,"d":"2023-08-28","dq":0,"y":2023,"au":[560,92,404,332,223,195,333],"c":12,"cs":0,"bib":"2023MNRAS.525.6191B","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2308.14822","url":"https://arxiv.org/abs/2308.14822","doi":"10.1093/mnras/stad2691","tg":{"s":["IllustrisTNG","SIMBA","Astrid"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.7717,"yy":-0.5176,"p3":[0.3892,-0.4863,-0.0461],"sim":{"k":"e","l":[[82,0.952],[75,0.946],[90,0.94],[81,0.939],[38,0.937]]},"c3":[66.78,-146.9,-23.09],"c2":[125.93,-95.46],"k":6,"r":[129,130,139,140,157,169,171],"rm":0},{"id":"2308.09751","t":"Data Compression and Inference in Cosmology with Self-Supervised Machine Learning","ab":"The influx of massive amounts of data from current and upcoming cosmological surveys necessitates compression schemes that can efficiently summarize the data with minimal loss of information. We introduce a method that leverages the paradigm of self-supervised machine learning in a novel manner to construct representative summaries of massive datasets using simulation-based augmentations. Deploying the method on hydrodynamical cosmological simulations, we show that it can deliver highly informative summaries, which can be used for a variety of downstream tasks, including precise and accurate parameter inference. We demonstrate how this paradigm can be used to construct summary representations that are insensitive to prescribed systematic effects, such as the influence of baryonic physics. Our results indicate that self-supervised machine learning techniques offer a promising new approach for compression of cosmological data as well its analysis.","abx":0,"nw":0,"d":"2023-08-18","dq":0,"y":2023,"au":[20,516,122],"c":30,"cs":0,"bib":"2024MNRAS.527.7459A","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2308.09751","url":"https://arxiv.org/abs/2308.09751","doi":"10.1093/mnras/stad3646","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Other ML","Simulation-based inference"],"u":["CAMELS (suite not stated)","2D maps"]},"x":-0.7479,"yy":0.3789,"p3":[-0.0305,0.4013,0.1452],"sim":{"k":"e","l":[[55,0.952],[24,0.95],[86,0.948],[2,0.945],[153,0.941]]},"c3":[38.94,53.84,-134.67],"c2":[19.06,131.7],"k":2,"r":[130,133,137,146,153,163,165,166,170,171],"rm":0},{"id":"2307.14362","t":"Learnable wavelet neural networks for cosmological inference","ab":"Convolutional neural networks (CNNs) have been shown to both extract more information than the traditional two-point statistics from cosmological fields, and marginalise over astrophysical effects extremely well. However, CNNs require large amounts of training data, which is potentially problematic in the domain of expensive cosmological simulations, and it is difficult to interpret the network. In this work we apply the learnable scattering transform, a kind of convolutional neural network that uses trainable wavelets as filters, to the problem of cosmological inference and marginalisation over astrophysical effects. We present two models based on the scattering transform, one constructed for performance, and one constructed for interpretability, and perform a comparison with a CNN. We find that scattering architectures are able to outperform a CNN, significantly in the case of small training data samples. Additionally we present a lightweight scattering network that is highly interpretable.","abx":0,"nw":0,"d":"2023-07-24","dq":0,"y":2023,"au":[115,387,511],"c":4,"cs":0,"bib":"2022mla..confE..40P","v":"arXiv.org","lk":"arXiv:2307.14362","url":"https://arxiv.org/abs/2307.14362","doi":"10.48550/arXiv.2307.14362","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["CNN"],"u":[]},"x":0.3183,"yy":0.7202,"p3":[-0.3087,0.2692,-0.1405],"sim":{"k":"e","l":[[170,0.929],[71,0.928],[4,0.928],[127,0.925],[166,0.925]]},"c3":[-5.35,91.42,-138.15],"c2":[-76.27,165.9],"k":0,"r":[165,166,167,170],"rm":0},{"id":"2307.11832","t":"Cosmological baryon spread and impact on matter clustering in CAMELS","ab":"We quantify the cosmological spread of baryons relative to their initial neighboring dark matter distribution using thousands of state-of-the-art simulations from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project. We show that dark matter particles spread relative to their initial neighboring distribution owing to chaotic gravitational dynamics on spatial scales comparable to their host dark matter halo. In contrast, gas in hydrodynamic simulations spreads much further from the initial neighboring dark matter owing to feedback from supernovae (SNe) and Active Galactic Nuclei (AGN). We show that large-scale baryon spread is very sensitive to model implementation details, with the fiducial \\textsc{SIMBA} model spreading $\\sim$40\\% of baryons $>$1\\,Mpc away compared to $\\sim$10\\% for the IllustrisTNG and \\textsc{ASTRID} models. Increasing the efficiency of AGN-driven outflows greatly increases baryon spread while increasing the strength of SNe-driven winds can decrease spreading due to non-linear coupling of stellar and AGN feedback. We compare total matter power spectra between hydrodynamic and paired $N$-body simulations and demonstrate that the baryonic spread metric broadly captures the global impact of feedback on matter clustering over variations of cosmological and astrophysical parameters, initial conditions, and galaxy formation models. Using symbolic regression, we find a function that reproduces the suppression of power by feedback as a function of wave number ($k$) and baryonic spread up to $k \\sim 10\\,h$\\,Mpc$^{-1}$ while highlighting the challenge of developing models robust to variations in galaxy formation physics implementation.","abx":0,"nw":0,"d":"2023-07-21","dq":0,"y":2023,"au":[371,134,284,515,207,597,118,133,479,200,363,325],"c":53,"cs":0,"bib":"2024MNRAS.529.4896G","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2307.11832","url":"https://arxiv.org/abs/2307.11832","doi":"10.1093/mnras/stae817","tg":{"s":["SIMBA","IllustrisTNG","CAMELS (suite not stated)"],"d":["Particle snapshots"],"m":["No ML"],"u":[]},"x":0.3546,"yy":-0.4464,"p3":[0.0098,-0.326,0.0767],"sim":{"k":"e","l":[[39,0.958],[171,0.956],[89,0.952],[137,0.951],[12,0.946]]},"c3":[162.25,-0.69,-50.87],"c2":[162.1,22.39],"k":1,"r":[129,130,132,133,137,138,140,146,147,153,154,155,156,157,158,159,160,162,163,166,167,169,170,171],"rm":0},{"id":"2307.06967","t":"A Hierarchy of Normalizing Flows for Modelling the Galaxy-Halo Relationship","ab":"Using a large sample of galaxies taken from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project, a suite of hydrodynamic simulations varying both cosmological and astrophysical parameters, we train a normalizing flow (NF) to map the probability of various galaxy and halo properties conditioned on astrophysical and cosmological parameters. By leveraging the learnt conditional relationships we can explore a wide range of interesting questions, whilst enabling simple marginalisation over nuisance parameters. We demonstrate how the model can be used as a generative model for arbitrary values of our conditional parameters; we generate halo masses and matched galaxy properties, and produce realisations of the halo mass function as well as a number of galaxy scaling relations and distribution functions. The model represents a unique and flexible approach to modelling the galaxy-halo relationship.","abx":0,"nw":0,"d":"2023-07-13","dq":0,"y":2023,"au":[118,532,134,228,224,515,105,298,261,410,207],"c":12,"cs":0,"bib":"2023mla..confE..21L","v":"","lk":"arXiv:2307.06967","url":"https://arxiv.org/abs/2307.06967","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Normalizing flows","Generative models"],"u":[]},"x":0.0485,"yy":0.1857,"p3":[-0.2366,0.1614,0.0912],"sim":{"k":"e","l":[[44,0.947],[46,0.946],[80,0.945],[12,0.944],[104,0.943]]},"c3":[8.23,-81.18,6.29],"c2":[3.77,22.06],"k":3,"r":[130,142,158,164,171],"rm":0},{"id":"2307.06360","t":"An Exploration of AGN and Stellar Feedback Effects in the Intergalactic Medium via the Low Redshift Lyman-$α$ Forest","ab":"We explore the role of galactic feedback on the low redshift Lyman-$α$ (Ly$α$)~forest ($z \\lesssim 2$) statistics and its potential to alter the thermal state of the intergalactic medium. Using the Cosmology and Astrophysics with Machine Learning Simulations (CAMELS) suite, we explore variations of the AGN and stellar feedback models in the IllustrisTNG and Simba sub-grid models. We find that both AGN and stellar feedback in Simba play a role in setting the Ly$α$ forest column density distribution function (CDD) and the Doppler width ($b$-value) distribution. The Simba AGN jet feedback mode is able to efficiently transport energy out to the diffuse IGM causing changes in the shape and normalization of the CDD and a broadening of the $b$-value distribution. We find that stellar feedback plays a prominent role in regulating supermassive black hole growth and feedback, highlighting the importance of constraining stellar and AGN feedback simultaneously. In IllustrisTNG, the AGN feedback variations explored in CAMELS do not affect the Ly$α$ forest, but varying the stellar feedback model does produce subtle changes. Our results imply that the low-$z$ Ly$α$ forest can be sensitive to changes in the ultraviolet background (UVB), stellar and black hole feedback, and that AGN jet feedback in particular can have a strong effect on the thermal state of the IGM.","abx":0,"nw":0,"d":"2023-07-12","dq":0,"y":2023,"au":[383,78,528,518,228,134,532,464,479,200,325,363],"c":34,"cs":0,"bib":"2023AJ....166..228T","v":"Astronomical Journal","lk":"arXiv:2307.06360","url":"https://arxiv.org/abs/2307.06360","doi":"10.3847/1538-3881/ad02f5","tg":{"s":["IllustrisTNG","SIMBA"],"d":["Synthetic observables","Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":0.6142,"yy":-0.4052,"p3":[0.1253,-0.627,0.0421],"sim":{"k":"e","l":[[89,0.966],[52,0.961],[145,0.958],[101,0.958],[54,0.955]]},"c3":[112.79,-29.39,86.47],"c2":[95.55,-22.46],"k":1,"r":[130,137,145,158,171],"rm":0},{"id":"2306.10943","t":"Probabilistic Matching of Real and Generated Data Statistics in Generative Adversarial Networks","ab":"Generative adversarial networks constitute a powerful approach to generative modeling. While generated samples often are indistinguishable from real data, there is no guarantee that they will follow the true data distribution. For scientific applications in particular, it is essential that the true distribution is well captured by the generated distribution. In this work, we propose a method to ensure that the distributions of certain generated data statistics coincide with the respective distributions of the real data. In order to achieve this, we add a new loss term to the generator loss function, which quantifies the difference between these distributions via suitable f-divergences. Kernel density estimation is employed to obtain representations of the true distributions, and to estimate the corresponding generated distributions from minibatch values at each iteration. When compared to other methods, our approach has the advantage that the complete shapes of the distributions are taken into account. We evaluate the method on a synthetic dataset and a real-world dataset and demonstrate improved performance of our approach.","abx":0,"nw":0,"d":"2023-06-19","dq":0,"y":2023,"au":[451,425],"c":0,"cs":0,"bib":"2023arXiv230610943P","v":"Trans. Mach. Learn. Res.","lk":"arXiv:2306.10943","url":"https://arxiv.org/abs/2306.10943","doi":"10.48550/arXiv.2306.10943","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Generative models"],"u":["CAMELS (suite not stated)","2D maps"]},"x":-0.5353,"yy":0.5767,"p3":[-0.2407,0.5357,-0.4769],"sim":{"k":"e","l":[[26,0.906],[144,0.903],[85,0.902],[102,0.9],[142,0.896]]},"c3":[-40.52,86.51,66.22],"c2":[42.72,-150.25],"k":2,"r":[171],"rm":0},{"id":"2306.07728","t":"Multi-Epoch Machine Learning 2: Identifying physical drivers of galaxy properties in simulations","ab":"Using a novel machine learning method, we investigate the buildup of galaxy properties in different simulations, and in various environments within a single simulation. The aim of this work is to show the power of this approach at identifying the physical drivers of galaxy properties within simulations. We compare how the stellar mass is dependent on the value of other galaxy and halo properties at different points in time by examining the feature importance values of a machine learning model. By training the model on IllustrisTNG we show that stars are produced at earlier times in higher density regions of the universe than they are in low density regions. We also apply the technique to the Illustris, EAGLE, and CAMELS simulations. We find that stellar mass is built up in a similar way in EAGLE and IllustrisTNG, but significantly differently in the original Illustris, suggesting that subgrid model physics is more important than the choice of hydrodynamics method. These differences are driven by the efficiency of supernova feedback. Applying principal component analysis to the CAMELS simulations allows us to identify a component associated with the importance of a halo's gravitational potential and another component representing the time at which galaxies form. We discover that the speed of galactic winds is a more critical subgrid parameter than the total energy per unit star formation. Finally we find that the Simba black hole feedback model has a larger effect on galaxy formation than the IllustrisTNG black hole feedback model.","abx":0,"nw":0,"d":"2023-06-13","dq":0,"y":2023,"au":[472,496],"c":5,"cs":0,"bib":"2023MNRAS.523.5583M","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2306.07728","url":"https://arxiv.org/abs/2306.07728","doi":"10.1093/mnras/stad1811","tg":{"s":["Non-CAMELS simulations","CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs","Merger trees"],"m":["Emulators & regression ML"],"u":[]},"x":-0.0779,"yy":-0.1042,"p3":[0.1562,-0.1011,-0.0634],"sim":{"k":"e","l":[[171,0.951],[12,0.944],[130,0.943],[25,0.943],[154,0.941]]},"c3":[80.47,-39.53,-103.41],"c2":[80.61,48.09],"k":6,"r":[158,163,169,171],"rm":0},{"id":"2305.07531","t":"Forecasting the power of Higher Order Weak Lensing Statistics with automatically differentiable simulations","ab":"We present the Differentiable Lensing Lightcone (DLL), a fully differentiable physical model designed for being used as a forward model in Bayesian inference algorithms requiring access to derivatives of lensing observables with respect to cosmological parameters. We extend the public FlowPM N-body code, a particle-mesh N-body solver, simulating lensing lightcones and implementing the Born approximation in the Tensorflow framework. Furthermore, DLL is aimed at achieving high accuracy with low computational costs. As such, it integrates a novel Hybrid Physical-Neural parameterisation able to compensate for the small-scale approximations resulting from particle-mesh schemes for cosmological N-body simulations. We validate our simulations in an LSST setting against high-resolution $κ$TNG simulations by comparing both the lensing angular power spectrum and multiscale peak counts. We demonstrate an ability to recover lensing $C_\\ell$ up to a 10% accuracy at $\\ell=1000$ for sources at redshift 1, with as few as $\\sim 0.6$ particles per Mpc/h. As a first use case, we use this tool to investigate the relative constraining power of the angular power spectrum and peak counts statistic in an LSST setting. Such comparisons are typically very costly as they require a large number of simulations, and do not scale well with the increasing number of cosmological parameters. As opposed to forecasts based on finite differences, these statistics can be analytically differentiated with respect to cosmology, or any systematics included in the simulations at the same computational cost of the forward simulation. We find that the peak counts outperform the power spectrum on the cold dark matter parameter $Ω_c$, on the amplitude of density fluctuations $σ_8$, and on the amplitude of the intrinsic alignment signal $A_{IA}$.","abx":0,"nw":0,"d":"2023-05-12","dq":0,"y":2023,"au":[146,208,112,70,272,264,541],"c":19,"cs":0,"bib":"2023A&A...679A..61L","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2305.07531","url":"https://arxiv.org/abs/2305.07531","doi":"10.1051/0004-6361/202346888","tg":{"s":["Non-CAMELS simulations","CAMELS (suite not stated)"],"d":["Synthetic observables","Power spectra & summary statistics"],"m":["Other ML"],"u":["CAMELS (suite not stated)"]},"x":-0.4398,"yy":-0.2941,"p3":[-0.295,0.1291,0.0285],"sim":{"k":"e","l":[[14,0.942],[132,0.935],[4,0.934],[37,0.934],[27,0.932]]},"c3":[-44.22,6.71,105.75],"c2":[-17.55,-151.61],"k":4,"r":[171],"rm":0},{"id":"2305.00992","t":"Interpreting Sunyaev-Zel'dovich observations with MillenniumTNG: Mass and environment scaling relations","ab":"In the coming years, Sunyaev-Zel'dovich (SZ) measurements can dramatically improve our understanding of the Intergalactic Medium (IGM) and the role of feedback processes on galaxy formation, allowing us to calibrate important astrophysical systematics in cosmological constraints from weak lensing galaxy clustering surveys. However, the signal is only measured in a two-dimensional projection, and its correct interpretation relies on understanding the connection between observable quantities and the underlying intrinsic properties of the gas, in addition to the relation between the gas and the underlying matter distribution. One way to address these challenges is through the use of hydrodynamical simulations such as the high-resolution, large-volume MillenniumTNG suite. We find that measurements of the optical depth, $τ$, and the Compton-y parameter, $Y$, receive large line-of-sight contributions which can be removed effectively by applying a Compensated Aperture Photometry (CAP) filter. In contrast with other $τ$ probes (e.g., X-rays and Fast Radio Bursts), the kSZ-inferred $τ$ receives most of its signal from a confined cylindrical region around the halo due to the velocity decorrelation along the line-of-sight. Additionally, we perform fits to the $Y-M$ and $τ-M$ scaling relations and report best-fit parameters adopting the smoothly broken power law (SBPL) formalism. We note that subgrid physics modeling can broaden the error bar on these by 30\\% for intermediate-mass halos ($\\sim$$10^{13} \\, {\\rm M}_{\\odot}$). The scatter of the scaling relations can be captured by an intrinsic dependence on concentration, and an extrinsic dependence on tidal shear. Finally, we comment on the effect of using galaxies rather than halos in real observations, which can bias the inferred SZ profiles by $\\sim$20\\% for $L_\\ast$-galaxies.","abx":0,"nw":0,"d":"2023-05-01","dq":0,"y":2023,"au":[82,520,484,523,41,124,465,571,519,325],"c":32,"cs":0,"bib":"2023MNRAS.526..369H","v":"","lk":"arXiv:2305.00992","url":"https://arxiv.org/abs/2305.00992","doi":"","tg":{"s":["Non-CAMELS simulations"],"d":["Synthetic observables","Profiles"],"m":["No ML"],"u":[]},"x":0.1928,"yy":-0.3104,"p3":[0.0095,-0.2862,0.444],"sim":{"k":"e","l":[[99,0.938],[147,0.931],[69,0.93],[40,0.929],[161,0.928]]},"c3":[106.58,77.03,-31.4],"c2":[107.24,73.57],"k":9,"r":[158,159,171],"rm":0},{"id":"2304.06084","t":"Cosmology with one galaxy? -- The ASTRID model and robustness","ab":"Recent work has pointed out the potential existence of a tight relation between the cosmological parameter $Ω_{\\rm m}$, at fixed $Ω_{\\rm b}$, and the properties of individual galaxies in state-of-the-art cosmological hydrodynamic simulations. In this paper, we investigate whether such a relation also holds for galaxies from simulations run with a different code that made use of a distinct subgrid physics: Astrid. We find that also in this case, neural networks are able to infer the value of $Ω_{\\rm m}$ with a $\\sim10\\%$ precision from the properties of individual galaxies while accounting for astrophysics uncertainties as modeled in CAMELS. This tight relationship is present at all considered redshifts, $z\\leq3$, and the stellar mass, the stellar metallicity, and the maximum circular velocity are among the most important galaxy properties behind the relation. In order to use this method with real galaxies, one needs to quantify its robustness: the accuracy of the model when tested on galaxies generated by codes different from the one used for training. We quantify the robustness of the models by testing them on galaxies from four different codes: IllustrisTNG, SIMBA, Astrid, and Magneticum. We show that the models perform well on a large fraction of the galaxies, but fail dramatically on a small fraction of them. Removing these outliers significantly improves the accuracy of the models across simulation codes.","abx":0,"nw":0,"d":"2023-04-12","dq":0,"y":2023,"au":[421,207,104,597,105,168,478,134,309,544],"c":22,"cs":0,"bib":"2023ApJ...954..125E","v":"Astrophysical Journal","lk":"arXiv:2304.06084","url":"https://arxiv.org/abs/2304.06084","doi":"10.3847/1538-4357/ace96e","tg":{"s":["Astrid"],"d":["Halo & galaxy catalogs"],"m":["Emulators & regression ML"],"u":[]},"x":-0.275,"yy":0.0376,"p3":[-0.0839,-0.0652,-0.2909],"sim":{"k":"e","l":[[157,0.95],[158,0.949],[76,0.948],[130,0.947],[171,0.947]]},"c3":[57.16,-103.36,-95.58],"c2":[147.4,-30.6],"k":7,"r":[130,157,158,165,171],"rm":0},{"id":"2304.02096","t":"The CAMELS project: Expanding the galaxy formation model space with new ASTRID and 28-parameter TNG and SIMBA suites","ab":"We present CAMELS-ASTRID, the third suite of hydrodynamical simulations in the Cosmology and Astrophysics with MachinE Learning (CAMELS) project, along with new simulation sets that extend the model parameter space based on the previous frameworks of CAMELS-TNG and CAMELS-SIMBA, to provide broader training sets and testing grounds for machine-learning algorithms designed for cosmological studies. CAMELS-ASTRID employs the galaxy formation model following the ASTRID simulation and contains 2,124 hydrodynamic simulation runs that vary 3 cosmological parameters ($Ω_m$, $σ_8$, $Ω_b$) and 4 parameters controlling stellar and AGN feedback. Compared to the existing TNG and SIMBA simulation suites in CAMELS, the fiducial model of ASTRID features the mildest AGN feedback and predicts the least baryonic effect on the matter power spectrum. The training set of ASTRID covers a broader variation in the galaxy populations and the baryonic impact on the matter power spectrum compared to its TNG and SIMBA counterparts, which can make machine-learning models trained on the ASTRID suite exhibit better extrapolation performance when tested on other hydrodynamic simulation sets. We also introduce extension simulation sets in CAMELS that widely explore 28 parameters in the TNG and SIMBA models, demonstrating the enormity of the overall galaxy formation model parameter space and the complex non-linear interplay between cosmology and astrophysical processes. With the new simulation suites, we show that building robust machine-learning models favors training and testing on the largest possible diversity of galaxy formation models. We also demonstrate that it is possible to train accurate neural networks to infer cosmological parameters using the high-dimensional TNG-SB28 simulation set.","abx":0,"nw":0,"d":"2023-04-04","dq":0,"y":2023,"au":[597,515,134,207,593,518,547,483,416,410,371,239,512,325,479],"c":102,"cs":0,"bib":"2023ApJ...959..136N","v":"Astrophysical Journal","lk":"arXiv:2304.02096","url":"https://arxiv.org/abs/2304.02096","doi":"10.3847/1538-4357/ad022a","tg":{"s":["Astrid","IllustrisTNG","SIMBA"],"d":["Particle snapshots","Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":-0.1157,"yy":0.0243,"p3":[0.0398,-0.1541,-0.2006],"sim":{"k":"e","l":[[171,0.973],[158,0.965],[12,0.963],[31,0.954],[99,0.951]]},"c3":[65.69,-26.75,-17.65],"c2":[74.08,22.02],"k":7,"r":[132,133,137,138,140,141,145,146,147,148,151,153,155,156,157,162,163,165,166,167,170,171],"rm":0},{"id":"2303.07473","t":"Invertible mapping between fields in CAMELS","ab":"We build a bijective mapping between different physical fields from hydrodynamic CAMELS simulations. We train a CycleGAN on three different setups: translating dark matter to neutral hydrogen (Mcdm-HI), mapping between dark matter and magnetic fields magnitude (Mcdm-B), and finally predicting magnetic fields magnitude from neutral hydrogen (HI-B). We assess the performance of the models using various summary statistics, such as the probability distribution function (PDF) of the pixel values and 2D power spectrum ($P(k)$). Results suggest that in all setups, the model is capable of predicting the target field from the source field and vice versa, and the predicted maps exhibit statistical properties which are consistent with those of the target maps. This is indicated by the fact that the mean and standard deviation of the PDF of maps from the test set is in good agreement with those of the generated maps. The mean and variance of $P(k)$ of the real maps agree well with those of generated ones. The consistency tests on the model suggest that the source field can be recovered reasonably well by a forward mapping (source to target) followed by a backward mapping (target to source). This is demonstrated by the agreement between the statistical properties of the source images and those of the recovered ones.","abx":0,"nw":0,"d":"2023-03-13","dq":0,"y":2023,"au":[499,532,207],"c":6,"cs":0,"bib":"2023arXiv230307473A","v":"","lk":"arXiv:2303.07473","url":"https://arxiv.org/abs/2303.07473","doi":"","tg":{"s":["IllustrisTNG"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":-0.3689,"yy":0.5429,"p3":[-0.0334,0.4224,-0.4245],"sim":{"k":"e","l":[[144,0.934],[87,0.924],[166,0.923],[85,0.923],[167,0.922]]},"c3":[-112.18,35.49,-39.54],"c2":[-130.3,-2.64],"k":7,"r":[165,171],"rm":1},{"id":"2302.14591","t":"A universal equation to predict $Ω_{\\rm m}$ from halo and galaxy catalogues","ab":"We discover analytic equations that can infer the value of $Ω_{\\rm m}$ from the positions and velocity moduli of halo and galaxy catalogues. The equations are derived by combining a tailored graph neural network (GNN) architecture with symbolic regression. We first train the GNN on dark matter halos from Gadget N-body simulations to perform field-level likelihood-free inference, and show that our model can infer $Ω_{\\rm m}$ with $\\sim6\\%$ accuracy from halo catalogues of thousands of N-body simulations run with six different codes: Abacus, CUBEP$^3$M, Gadget, Enzo, PKDGrav3, and Ramses. By applying symbolic regression to the different parts comprising the GNN, we derive equations that can predict $Ω_{\\rm m}$ from halo catalogues of simulations run with all of the above codes with accuracies similar to those of the GNN. We show that by tuning a single free parameter, our equations can also infer the value of $Ω_{\\rm m}$ from galaxy catalogues of thousands of state-of-the-art hydrodynamic simulations of the CAMELS project, each with a different astrophysics model, run with five distinct codes that employ different subgrid physics: IllustrisTNG, SIMBA, Astrid, Magneticum, SWIFT-EAGLE. Furthermore, the equations also perform well when tested on galaxy catalogues from simulations covering a vast region in parameter space that samples variations in 5 cosmological and 23 astrophysical parameters. We speculate that the equations may reflect the existence of a fundamental physics relation between the phase-space distribution of generic tracers and $Ω_{\\rm m}$, one that is not affected by galaxy formation physics down to scales as small as $10~h^{-1}{\\rm kpc}$.","abx":0,"nw":0,"d":"2023-02-28","dq":0,"y":2023,"au":[239,410,207,478,597,134,515,325,553,544,169,309,118,172,331,392],"c":20,"cs":0,"bib":"2023ApJ...956..149S","v":"","lk":"arXiv:2302.14591","url":"https://arxiv.org/abs/2302.14591","doi":"","tg":{"s":["N-body (dark matter only)","Non-CAMELS simulations","CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks","Symbolic regression","Simulation-based inference"],"u":[]},"x":0.1697,"yy":0.2226,"p3":[0.1149,0.1847,0.0055],"sim":{"k":"e","l":[[146,0.972],[163,0.957],[11,0.957],[44,0.956],[133,0.955]]},"c3":[120.71,-12.01,-152.94],"c2":[64.09,82.77],"k":8,"r":[133,146,147,153,158,163,165,166,169,170,171],"rm":0},{"id":"2302.14101","t":"Robust Field-level Likelihood-free Inference with Galaxies","ab":"We train graph neural networks to perform field-level likelihood-free inference using galaxy catalogs from state-of-the-art hydrodynamic simulations of the CAMELS project. Our models are rotational, translational, and permutation invariant and do not impose any cut on scale. From galaxy catalogs that only contain $3$D positions and radial velocities of $\\sim 1, 000$ galaxies in tiny $(25~h^{-1}{\\rm Mpc})^3$ volumes our models can infer the value of $Ω_{\\rm m}$ with approximately $12$ % precision. More importantly, by testing the models on galaxy catalogs from thousands of hydrodynamic simulations, each having a different efficiency of supernova and AGN feedback, run with five different codes and subgrid models - IllustrisTNG, SIMBA, Astrid, Magneticum, SWIFT-EAGLE -, we find that our models are robust to changes in astrophysics, subgrid physics, and subhalo/galaxy finder. Furthermore, we test our models on $1,024$ simulations that cover a vast region in parameter space - variations in $5$ cosmological and $23$ astrophysical parameters - finding that the model extrapolates really well. Our results indicate that the key to building a robust model is the use of both galaxy positions and velocities, suggesting that the network have likely learned an underlying physical relation that does not depend on galaxy formation and is valid on scales larger than $\\sim10~h^{-1}{\\rm kpc}$.","abx":0,"nw":0,"d":"2023-02-27","dq":0,"y":2023,"au":[410,239,207,318,478,442,597,134,515,168,553,118,309,544,363],"c":65,"cs":0,"bib":"2023ApJ...952...69D","v":"Astrophysical Journal","lk":"arXiv:2302.14101","url":"https://arxiv.org/abs/2302.14101","doi":"10.3847/1538-4357/acd1e2","tg":{"s":["IllustrisTNG","SIMBA","Astrid","Magneticum","Swift-EAGLE"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":0.0394,"yy":0.3555,"p3":[0.2798,0.3343,-0.3458],"sim":{"k":"e","l":[[153,0.972],[114,0.972],[146,0.967],[16,0.96],[12,0.957]]},"c3":[99.07,-8.43,-134.7],"c2":[81.54,148.19],"k":8,"r":[130,132,146,153,154,157,158,162,163,165,167,169,171],"rm":0},{"id":"2302.01363","t":"Topological data analysis reveals differences between simulated galaxies and dark matter haloes","ab":"We use topological summaries based on Betti curves to characterize the large-scale spatial distribution of simulated dark matter haloes and galaxies. Using the IllustrisTNG and CAMELS-SAM simulations, we show that the topology of the galaxy distribution is significantly different from the topology of the dark matter halo distribution. Further, there are significant differences between the distributions of star-forming and quiescent galaxies. These topological differences are broadly consistent across all simulations, while at the same time there are noticeable differences when comparing between different models. Finally, using the CAMELS-SAM simulations, we show that the topology of the quiescent galaxies in particular depends strongly on the amount of supernova feedback. These results suggest that topological summary statistics could be used to help better understand the processes of galaxy formation and evolution.","abx":0,"nw":0,"d":"2023-02-02","dq":0,"y":2023,"au":[15,222,177],"c":8,"cs":0,"bib":"2023MNRAS.523.5738O","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2302.01363","url":"https://arxiv.org/abs/2302.01363","doi":"10.1093/mnras/stad1765","tg":{"s":["Non-CAMELS simulations","CAMELS-SAM"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":0.3366,"yy":-0.1667,"p3":[0.2603,-0.2204,0.0446],"sim":{"k":"e","l":[[82,0.925],[40,0.922],[90,0.921],[104,0.921],[146,0.921]]},"c3":[23.25,-79.65,-112.14],"c2":[-37.64,6.14],"k":6,"r":[154,158],"rm":0},{"id":"2301.09655","t":"Perturbation-theory informed integrators for cosmological simulations","ab":"Large-scale cosmological simulations are an indispensable tool for modern cosmology. To enable model-space exploration, fast and accurate predictions are critical. In this paper, we show that the performance of such simulations can be further improved with time-stepping schemes that use input from cosmological perturbation theory. Specifically, we introduce a class of time-stepping schemes derived by matching the particle trajectories in a single leapfrog/Verlet drift-kick-drift step to those predicted by Lagrangian perturbation theory (LPT). As a corollary, these schemes exactly yield the analytic Zel'dovich solution in 1D in the pre-shell-crossing regime (i.e. before particle trajectories cross). One representative of this class is the popular FastPM scheme by Feng et al. 2016, which we take as our baseline. We then construct more powerful LPT-inspired integrators and show that they outperform FastPM and standard integrators in fast simulations in two and three dimensions with $\\mathcal{O}(1 - 100)$ timesteps, requiring less steps to accurately reproduce the power spectrum and bispectrum of the density field. Furthermore, we demonstrate analytically and numerically that, for any integrator, convergence is limited in the post-shell-crossing regime (to order 3/2 for planar wave collapse), owing to the lacking regularity of the acceleration field, which makes the use of high-order integrators in this regime futile. Also, we study the impact of the timestep spacing and of a decaying mode present in the initial conditions. Importantly, we find that symplecticity of the integrator plays a minor role for fast approximate simulations with a small number of timesteps.","abx":0,"nw":0,"d":"2023-01-23","dq":0,"y":2023,"au":[203,432],"c":12,"cs":0,"bib":"2024JCoPh.51313201L","v":"Journal of Computational Physics","lk":"arXiv:2301.09655","url":"https://arxiv.org/abs/2301.09655","doi":"10.1016/j.jcp.2024.113201","tg":{"s":["CAMELS (suite not stated)","N-body (dark matter only)"],"d":["Particle snapshots"],"m":["No ML"],"u":["CAMELS (suite not stated)","N-body (dark matter only)"]},"x":-0.6277,"yy":0.1426,"p3":[-0.2477,0.3344,0.2449],"sim":{"k":"e","l":[[150,0.927],[107,0.925],[4,0.913],[32,0.91],[99,0.909]]},"c3":[-64.4,-113.71,34.4],"c2":[9.66,-156.74],"k":4,"r":[171],"rm":0},{"id":"2301.02253","t":"On the choice of the most suitable indicator for the assembly state of dark matter haloes through cosmic time","ab":"The dynamical state and morphological features of galaxies and galaxy clusters, and their high-redshift precursors, are tightly connected with their assembly history, encoding crucial information about the formation and evolution of such cosmic structures. As a first step towards finding an optimal indicator of the assembly state of observed structures, we use a cosmological simulation of a moderate volume to critically examine the best definition of an indicator that is able to discriminate dark matter haloes undergoing mergers and/or strong accretion from haloes experimenting a relaxed evolution. Using a combination of centre offset, virial ratio, mean radial velocity, sparsity and ellipticity of the dark matter halo, we study how the thresholds on these parameters, as well as their relative weights, should evolve with redshift to provide the best classification possible. This allows us to split a sample of haloes in a totally relaxed, a marginally relaxed and an unrelaxed subsamples. The resulting classification strongly correlates with the merging activity obtained from the analysis of complete merger trees extracted from whole simulation data. The results on how the different indicators depend on redshift and halo mass, and their optimal combination to better match the true assembly history of haloes, could constitute relevant hints to find a suitable set of indicators applicable to observational data.","abx":0,"nw":0,"d":"2023-01-05","dq":0,"y":2023,"au":[141,534,608,562],"c":17,"cs":0,"bib":"2023MNRAS.519.6111V","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2301.02253","url":"https://arxiv.org/abs/2301.02253","doi":"10.1093/mnras/stad059","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":0.4029,"yy":0.1471,"p3":[0.4544,-0.1266,0.1576],"sim":{"k":"e","l":[[161,0.936],[151,0.933],[1,0.919],[163,0.918],[134,0.918]]},"c3":[4.51,84.82,11.58],"c2":[64.89,117.42],"k":6,"r":[151,158,171],"rm":0},{"id":"2301.02231","t":"Predicting the impact of feedback on matter clustering with machine learning in CAMELS","ab":"Extracting information from the total matter power spectrum with the precision needed for upcoming cosmological surveys requires unraveling the complex effects of galaxy formation processes on the distribution of matter. We investigate the impact of baryonic physics on matter clustering at $z=0$ using a library of power spectra from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project, containing thousands of $(25\\,h^{-1}{\\rm Mpc})^3$ volume realizations with varying cosmology, initial random field, stellar and AGN feedback strength and sub-grid model implementation methods. We show that baryonic physics affects matter clustering on scales $k \\gtrsim 0.4\\,h\\,\\mathrm{Mpc}^{-1}$ and the magnitude of this effect is dependent on the details of the galaxy formation implementation and variations of cosmological and astrophysical parameters. Increasing AGN feedback strength decreases halo baryon fractions and yields stronger suppression of power relative to N-body simulations, while stronger stellar feedback often results in weaker effects by suppressing black hole growth and therefore the impact of AGN feedback. We find a broad correlation between mean baryon fraction of massive halos ($M_{\\rm 200c} > 10^{13.5}$\\,\\Msun) and suppression of matter clustering but with significant scatter compared to previous work owing to wider exploration of feedback parameters and cosmic variance effects. We show that a random forest regressor trained on the baryon content and abundance of halos across the full mass range $10^{10} \\leq M_\\mathrm{halo}/$\\Msun$< 10^{15}$ can predict the effect of galaxy formation on the matter power spectrum on scales $k = 1.0$--20.0\\,$h\\,\\mathrm{Mpc}^{-1}$.","abx":0,"nw":0,"d":"2023-01-05","dq":0,"y":2023,"au":[41,134,330,512,295,464,390,515,207,325],"c":45,"cs":0,"bib":"2023MNRAS.526.5306D","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2301.02231","url":"https://arxiv.org/abs/2301.02231","doi":"10.1093/mnras/stad2992","tg":{"s":["CAMELS (suite not stated)"],"d":["Power spectra & summary statistics"],"m":["Emulators & regression ML"],"u":[]},"x":0.3969,"yy":-0.3942,"p3":[0.0374,-0.5186,0.1017],"sim":{"k":"e","l":[[122,0.951],[138,0.948],[89,0.947],[54,0.944],[139,0.943]]},"c3":[160.35,-6.64,16.69],"c2":[130.91,6.49],"k":1,"r":[122,124,138,146,154,155,158,160,163,166,167,169,171],"rm":0},{"id":"2301.02186","t":"Inferring the impact of feedback on the matter distribution using the Sunyaev Zel'dovich effect: Insights from CAMELS simulations and ACT+DES data","ab":"Feedback from active galactic nuclei and stellar processes changes the matter distribution on small scales, leading to significant systematic uncertainty in weak lensing constraints on cosmology. We investigate how the observable properties of group-scale halos can constrain feedback's impact on the matter distribution using Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS). Extending the results of previous work to smaller halo masses and higher wavenumber, $k$, we find that the baryon fraction in halos contains significant information about the impact of feedback on the matter power spectrum. We explore how the thermal Sunyaev Zel'dovich (tSZ) signal from group-scale halos contains similar information. Using recent Dark Energy Survey (DES) weak lensing and Atacama Cosmology Telescope (ACT) tSZ cross-correlation measurements and models trained on CAMELS, we obtain $10\\%$ constraints on feedback effects on the power spectrum at $k \\sim 5\\, h/{\\rm Mpc}$. We show that with future surveys, it will be possible to constrain baryonic effects on the power spectrum to $\\mathcal{O}(<1\\%)$ at $k = 1\\, h/{\\rm Mpc}$ and $\\mathcal{O}(3\\%)$ at $k = 5\\, h/{\\rm Mpc}$ using the methods that we introduce here. Finally, we investigate the impact of feedback on the matter bispectrum, finding that tSZ observables are highly informative in this case.","abx":0,"nw":0,"d":"2023-01-05","dq":0,"y":2023,"au":[512,295,181,597,134,515,207,41,547],"c":45,"cs":0,"bib":"2023MNRAS.525.1779P","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2301.02186","url":"https://arxiv.org/abs/2301.02186","doi":"10.1093/mnras/stad2268","tg":{"s":["CAMELS (suite not stated)"],"d":["Profiles","Synthetic observables","Power spectra & summary statistics"],"m":["No ML"],"u":["No ML"]},"x":0.4016,"yy":-0.5421,"p3":[-0.1303,-0.5126,-0.0095],"sim":{"k":"e","l":[[39,0.95],[137,0.948],[156,0.947],[160,0.946],[139,0.944]]},"c3":[178.32,3.67,58.12],"c2":[207.14,-4.16],"k":1,"r":[122,137,147,155,156,171],"rm":0},{"id":"2212.05964","t":"Baryonic Imprints on DM Halos: The concentration-mass relation in the CAMELS simulations","ab":"The physics of baryons in halos, and their subsequent influence on the total matter phase space, has a rich phenomenology and must be well understood in order to pursue a vast set of questions in both cosmology and astrophysics. We use the CAMELS simulation suite to quantify the impact of four different galaxy formation parameters/processes (as well as two cosmological parameters) on the concentration-mass relation, $c_{\\rm vir} - M_{\\rm vir}$. We construct a simulation-informed nonlinear model for concentration as a function of halo mass, redshift, and 6 cosmological/astrophysical parameters. This is done for two galaxy formation models, IllustrisTNG and SIMBA, using 1000 simulations of each. We extract the imprints of galaxy formation across a wide range in mass $M_{\\rm vir} \\in [10^{11}, 10^{14.5}] M_{\\rm \\odot}/h$ and in redshift $z \\in [0,6]$ finding many strong mass- and redshift-dependent features. Comparisons between the IllustrisTNG and SIMBA results show the astrophysical model choices cause significant differences in the mass and redshift dependence of these baryon imprints. Finally, we use existing observational measurements of $c_{\\rm vir} - M_{\\rm vir}$ to provide rough limits on the four astrophysical parameters. Our nonlinear model is made publicly available and can be used to include CAMELS-based baryon imprints in any halo model-based analysis.","abx":0,"nw":0,"d":"2022-12-12","dq":0,"y":2022,"au":[400,149,111],"c":21,"cs":0,"bib":"2023MNRAS.523.3258S","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2212.05964","url":"https://arxiv.org/abs/2212.05964","doi":"10.1093/mnras/stad1620","tg":{"s":["IllustrisTNG","SIMBA"],"d":["Halo & galaxy catalogs"],"m":["Emulators & regression ML"],"u":["Emulators & regression ML"]},"x":0.1638,"yy":-0.5276,"p3":[0.2954,-0.2127,0.3994],"sim":{"k":"e","l":[[7,0.985],[110,0.98],[6,0.962],[89,0.947],[17,0.946]]},"c3":[111.03,-130.75,1.9],"c2":[88.6,-136.29],"k":9,"r":[171],"rm":0},{"id":"2211.16461","t":"Calibrating cosmological simulations with implicit likelihood inference using galaxy growth observables","ab":"In a novel approach employing implicit likelihood inference (ILI), also known as likelihood-free inference, we calibrate the parameters of cosmological hydrodynamic simulations against observations, which has previously been unfeasible due to the high computational cost of these simulations. For computational efficiency, we train neural networks as emulators on ~1000 cosmological simulations from the CAMELS project to estimate simulated observables, taking as input the cosmological and astrophysical parameters, and use these emulators as surrogates to the cosmological simulations. Using the cosmic star formation rate density (SFRD) and, separately, stellar mass functions (SMFs) at different redshifts, we perform ILI on selected cosmological and astrophysical parameters (Omega_m, sigma_8, stellar wind feedback, and kinetic black hole feedback) and obtain full 6-dimensional posterior distributions. In the performance test, the ILI from the emulated SFRD (SMFs) can recover the target observables with a relative error of 0.17% (0.4%). We find that degeneracies exist between the parameters inferred from the emulated SFRD, confirmed with new full cosmological simulations. We also find that the SMFs can break the degeneracy in the SFRD, which indicates that the SMFs provide complementary constraints for the parameters. Further, we find that the parameter combination inferred from an observationally-inferred SFRD reproduces the target observed SFRD very well, whereas, in the case of the SMFs, the inferred and observed SMFs show significant discrepancies that indicate potential limitations of the current galaxy formation modeling and calibration framework, and/or systematic differences and inconsistencies between observations of the stellar mass function.","abx":0,"nw":0,"d":"2022-11-29","dq":0,"y":2022,"au":[593,515,73,464,207,228,134,136,157,267],"c":23,"cs":0,"bib":"2023ApJ...944...67J","v":"Astrophysical Journal","lk":"arXiv:2211.16461","url":"https://arxiv.org/abs/2211.16461","doi":"10.3847/1538-4357/aca8fe","tg":{"s":["CAMELS (suite not stated)"],"d":["Power spectra & summary statistics"],"m":["Simulation-based inference","Emulators & regression ML"],"u":[]},"x":-0.0877,"yy":0.1694,"p3":[0.1172,0.1033,-0.5355],"sim":{"k":"e","l":[[31,0.951],[157,0.948],[167,0.947],[114,0.947],[166,0.945]]},"c3":[81.56,-111.79,-78.54],"c2":[49.3,-64.84],"k":7,"r":[162,171],"rm":0},{"id":"2211.15675","t":"X-ray Absorption Lines in the Warm-Hot Intergalactic Medium: Probing Chandra observations with the CAMEL simulations","ab":"Known as the \"Missing Baryon Problem\", about one-third of baryons in the local universe remain unaccounted for. The missing baryons are thought to reside in the warm-hot intergalactic medium (WHIM) of the cosmic web filaments, which are challenging to detect. Recent Chandra X-ray observations used a novel stacking analysis and detected an OVII absorption line toward the sightline of a luminous quasar, hinting that the missing baryons may reside in the WHIM. To explore how the properties of the OVII absorption line depend on feedback physics, we compare the observational results with predictions obtained from the Cosmology and Astrophysics with MachinE Learning (CAMEL) Simulation suite. CAMELS consists of cosmological simulations with state-of-the-art supernova (SN) and active galactic nuclei (AGN) feedback models from the IllustrisTNG and SIMBA simulations, with varying strengths. We find that the simulated OVII column densities are higher in the outskirts of galaxies than in the large-scale WHIM, but they are consistently lower than those obtained in the Chandra observations, for all feedback runs. We establish that the OVII distribution is primarily sensitive to changes in the SN feedback prescription, whereas changes in the AGN feedback prescription have minimal impact. We also find significant differences in the OVII column densities between the IllustrisTNG and SIMBA runs. We conclude that the tension between the observed and simulated OVII column densities cannot be explained by the wide range of feedback models implemented in CAMELS.","abx":0,"nw":0,"d":"2022-11-28","dq":0,"y":2022,"au":[37,182,69,605,383,133,434,78],"c":8,"cs":0,"bib":"2023MNRAS.519.2251B","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2211.15675","url":"https://arxiv.org/abs/2211.15675","doi":"10.1093/mnras/stac3631","tg":{"s":["CAMELS (suite not stated)"],"d":["Synthetic observables"],"m":["No ML"],"u":[]},"x":0.5983,"yy":-0.6516,"p3":[0.0857,-0.6326,-0.0965],"sim":{"k":"e","l":[[101,0.955],[81,0.952],[156,0.948],[89,0.946],[148,0.944]]},"c3":[68.35,-91.77,56.93],"c2":[137.7,51.81],"k":1,"r":[145,148,158],"rm":0},{"id":"2211.12724","t":"HIGlow: Conditional Normalizing Flows for High-Fidelity HI Map Modeling","ab":"Extracting the maximum amount of cosmological and astrophysical information from upcoming large-scale surveys remains a challenge. This includes evaluating the exact likelihood, parameter inference and generating new diverse synthetic examples of the incoming high-dimensional data sets. In this work, we propose the use of normalizing flows as a generative model of the neutral hydrogen (HI) maps from the CAMELS project. Normalizing flow
