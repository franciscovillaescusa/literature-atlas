s have been very successful at parameter inference and generating new, realistic examples. Our model utilizes the spatial structure of the HI maps in order to faithfully follow the statistics of the data, allowing for high-fidelity sample generation and efficient parameter inference.","abx":0,"nw":0,"d":"2022-11-23","dq":0,"y":2022,"au":[482,532],"c":15,"cs":0,"bib":"2022arXiv221112724F","v":"","lk":"arXiv:2211.12724","url":"https://arxiv.org/abs/2211.12724","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Normalizing flows","Generative models"],"u":[]},"x":-0.4371,"yy":0.8493,"p3":[-0.338,0.3871,-0.2275],"sim":{"k":"e","l":[[164,0.975],[85,0.94],[113,0.939],[123,0.939],[46,0.938]]},"c3":[-38.78,-50.67,5.04],"c2":[-40.58,30.34],"k":0,"r":[164,167,171],"rm":0},{"id":"2211.12444","t":"Can denoising diffusion probabilistic models generate realistic astrophysical fields?","ab":"Score-based generative models have emerged as alternatives to generative adversarial networks (GANs) and normalizing flows for tasks involving learning and sampling from complex image distributions. In this work we investigate the ability of these models to generate fields in two astrophysical contexts: dark matter mass density fields from cosmological simulations and images of interstellar dust. We examine the fidelity of the sampled cosmological fields relative to the true fields using three different metrics, and identify potential issues to address. We demonstrate a proof-of-concept application of the model trained on dust in denoising dust images. To our knowledge, this is the first application of this class of models to the interstellar medium.","abx":0,"nw":0,"d":"2022-11-22","dq":0,"y":2022,"au":[411,154],"c":25,"cs":0,"bib":"2022arXiv221112444M","v":"arXiv.org","lk":"arXiv:2211.12444","url":"https://arxiv.org/abs/2211.12444","doi":"10.48550/arXiv.2211.12444","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Generative models"],"u":["CAMELS (suite not stated)"]},"x":-0.0947,"yy":1.0,"p3":[-0.6643,-0.0865,0.1615],"sim":{"k":"e","l":[[95,0.951],[105,0.948],[3,0.942],[98,0.941],[144,0.937]]},"c3":[-147.54,-51.75,-49.67],"c2":[-156.63,-55.03],"k":5,"r":[165,171],"rm":0},{"id":"2211.05000","t":"Emulating cosmological multifields with generative adversarial networks","ab":"We explore the possibility of using deep learning to generate multifield images from state-of-the-art hydrodynamic simulations of the CAMELS project. We use a generative adversarial network to generate images with three different channels that represent gas density (Mgas), neutral hydrogen density (HI), and magnetic field amplitudes (B). The quality of each map in each example generated by the model looks very promising. The GAN considered in this study is able to generate maps whose mean and standard deviation of the probability density distribution of the pixels are consistent with those of the maps from the training data. The mean and standard deviation of the auto power spectra of the generated maps of each field agree well with those computed from the maps of IllustrisTNG. Moreover, the cross-correlations between fields in all instances produced by the emulator are in good agreement with those of the dataset. This implies that all three maps in each output of the generator encode the same underlying cosmology and astrophysics.","abx":0,"nw":0,"d":"2022-11-09","dq":0,"y":2022,"au":[499,207,532],"c":8,"cs":0,"bib":"2022arXiv221105000A","v":"","lk":"arXiv:2211.05000","url":"https://arxiv.org/abs/2211.05000","doi":"","tg":{"s":["IllustrisTNG"],"d":["2D maps"],"m":["Generative models"],"u":[]},"x":-0.3505,"yy":0.6114,"p3":[-0.1453,0.3881,-0.5627],"sim":{"k":"e","l":[[102,0.97],[113,0.947],[168,0.946],[167,0.946],[171,0.941]]},"c3":[-81.69,34.83,-41.11],"c2":[-113.38,56.57],"k":0,"r":[158,165,171],"rm":0},{"id":"2210.02467","t":"Efficient long-range AGN feedback affects the low redshift Lyman-$α$ forest","ab":"Active galactic nuclei (AGN) feedback models are generally calibrated to reproduce galaxy observables such as the stellar mass function and the bimodality in galaxy colors. We use variations of the AGN feedback implementations in the IllustrisTNG (TNG) and Simba cosmological hydrodynamic simulations to show that the low redshift Lyman-$α$ forest can provide constraints on the impact of AGN feedback. We show that TNG over-predicts the number density of absorbers at column densities $N_{\\rm HI} < 10^{14}$ cm$^{-2}$ compared to data from the Cosmic Origins Spectrograph (in agreement with previous work), and we demonstrate explicitly that its kinetic feedback mode, which is primarily responsible for galaxy quenching, has a negligible impact on the column density distribution (CDD) of absorbers. In contrast, we show that the fiducial Simba model which includes AGN jet feedback is the preferred fit to the observed CDD of the $z = 0.1$ Lyman-$α$ forest across five orders of magnitude in column density. We show that the Simba results with jets produce a quantitatively better fit to the observational data than the Simba results without jets, even when the UVB is left as a free parameter. AGN jets in Simba are high speed, collimated, weakly-interacting with the interstellar medium (via brief hydrodynamic decoupling) and heated to the halo virial temperature. Collectively these properties result in stronger long-range impacts on the IGM when compared to TNG's kinetic feedback mode, which drives isotropic winds with lower velocities at the galactic radius. Our results suggest that the low redshift Lyman-$α$ forest provides plausible evidence for long-range AGN jet feedback.","abx":0,"nw":0,"d":"2022-10-05","dq":0,"y":2022,"au":[383,78,528,518,228,134,479,515],"c":31,"cs":0,"bib":"2023ApJ...945L..17T","v":"Astrophysical Journal Letters","lk":"arXiv:2210.02467","url":"https://arxiv.org/abs/2210.02467","doi":"10.3847/2041-8213/acb7f1","tg":{"s":["IllustrisTNG","SIMBA"],"d":["Synthetic observables","Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":0.6634,"yy":-0.3667,"p3":[0.0346,-0.6278,-0.0313],"sim":{"k":"e","l":[[124,0.958],[52,0.949],[101,0.942],[89,0.939],[104,0.937]]},"c3":[76.22,-58.2,101.81],"c2":[130.53,-17.54],"k":1,"r":[158,171],"rm":0},{"id":"2209.06843","t":"Robust field-level inference with dark matter halos","ab":"We train graph neural networks on halo catalogues from Gadget N-body simulations to perform field-level likelihood-free inference of cosmological parameters. The catalogues contain $\\lesssim$5,000 halos with masses $\\gtrsim 10^{10}~h^{-1}M_\\odot$ in a periodic volume of $(25~h^{-1}{\\rm Mpc})^3$; every halo in the catalogue is characterized by several properties such as position, mass, velocity, concentration, and maximum circular velocity. Our models, built to be permutationally, translationally, and rotationally invariant, do not impose a minimum scale on which to extract information and are able to infer the values of $Ω_{\\rm m}$ and $σ_8$ with a mean relative error of $\\sim6\\%$, when using positions plus velocities and positions plus masses, respectively. More importantly, we find that our models are very robust: they can infer the value of $Ω_{\\rm m}$ and $σ_8$ when tested using halo catalogues from thousands of N-body simulations run with five different N-body codes: Abacus, CUBEP$^3$M, Enzo, PKDGrav3, and Ramses. Surprisingly, the model trained to infer $Ω_{\\rm m}$ also works when tested on thousands of state-of-the-art CAMELS hydrodynamic simulations run with four different codes and subgrid physics implementations. Using halo properties such as concentration and maximum circular velocity allow our models to extract more information, at the expense of breaking the robustness of the models. This may happen because the different N-body codes are not converged on the relevant scales corresponding to these parameters.","abx":0,"nw":0,"d":"2022-09-14","dq":0,"y":2022,"au":[239,207,442,478,331,360,147,597,553,392,172,228,134,544,168,309],"c":46,"cs":0,"bib":"2023ApJ...944...27S","v":"Astrophysical Journal","lk":"arXiv:2209.06843","url":"https://arxiv.org/abs/2209.06843","doi":"10.3847/1538-4357/acac7a","tg":{"s":["N-body (dark matter only)"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":0.1813,"yy":0.2669,"p3":[0.2987,0.1468,-0.1259],"sim":{"k":"e","l":[[132,0.972],[133,0.967],[163,0.962],[114,0.959],[153,0.956]]},"c3":[78.16,1.98,-163.89],"c2":[61.36,168.13],"k":8,"r":[153,158,165,166,167,171],"rm":0},{"id":"2209.02075","t":"The SZ flux-mass ($Y$-$M$) relation at low halo masses: improvements with symbolic regression and strong constraints on baryonic feedback","ab":"Feedback from active galactic nuclei (AGN) and supernovae can affect measurements of integrated SZ flux of halos ($Y_\\mathrm{SZ}$) from CMB surveys, and cause its relation with the halo mass ($Y_\\mathrm{SZ}-M$) to deviate from the self-similar power-law prediction of the virial theorem. We perform a comprehensive study of such deviations using CAMELS, a suite of hydrodynamic simulations with extensive variations in feedback prescriptions. We use a combination of two machine learning tools (random forest and symbolic regression) to search for analogues of the $Y-M$ relation which are more robust to feedback processes for low masses ($M\\lesssim 10^{14}\\, h^{-1} \\, M_\\odot$); we find that simply replacing $Y\\rightarrow Y(1+M_*/M_\\mathrm{gas})$ in the relation makes it remarkably self-similar. This could serve as a robust multiwavelength mass proxy for low-mass clusters and galaxy groups. Our methodology can also be generally useful to improve the domain of validity of other astrophysical scaling relations. We also forecast that measurements of the $Y-M$ relation could provide percent-level constraints on certain combinations of feedback parameters and/or rule out a major part of the parameter space of supernova and AGN feedback models used in current state-of-the-art hydrodynamic simulations. Our results can be useful for using upcoming SZ surveys (e.g., SO, CMB-S4) and galaxy surveys (e.g., DESI and Rubin) to constrain the nature of baryonic feedback. Finally, we find that the an alternative relation, $Y-M_*$, provides complementary information on feedback than $Y-M$","abx":0,"nw":0,"d":"2022-09-05","dq":0,"y":2022,"au":[150,330,255,512,207,140,395,133,134,511,325],"c":39,"cs":0,"bib":"2023MNRAS.522.2628W","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2209.02075","url":"https://arxiv.org/abs/2209.02075","doi":"10.1093/mnras/stad1128","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs","Synthetic observables"],"m":["Symbolic regression","Emulators & regression ML"],"u":[]},"x":0.384,"yy":-0.7265,"p3":[0.0438,-0.3139,0.3656],"sim":{"k":"e","l":[[101,0.951],[99,0.945],[160,0.945],[69,0.944],[124,0.944]]},"c3":[182.69,27.17,-65.47],"c2":[187.97,44.54],"k":1,"r":[132,155,156,159,160,169,171],"rm":0},{"id":"2209.00657","t":"Studying the Warm Hot Intergalactic Medium in emission: a reprise","ab":"The Warm-Hot Intergalactic Medium (WHIM) is believed to host a significant fraction of the ``missing baryons'' in the nearby Universe. Its signature has been detected in the X-ray absorption spectra of distant quasars. However, its detection in emission, that would allow us to study the WHIM in a systematic way, is still lacking. Motivated by the possibility to perform these studies with next generation integral field spectrometers, and thanks to the availability of a large suite of state-of-the-art hydrodynamic simulations -- the CAMELS suite -- we study here in detail the emission properties of the WHIM and the possibility to infer its physical properties with upcoming X-ray missions like Athena. We focused on the two most prominent WHIM emission lines, the OVII triplet and the OVIII singlet, and build line surface brightness maps in a lightcone, mimicking a data cube generated through integral field spectroscopy. We confirm that detectable WHIM emission, even with next generation instruments, is largely associated to galaxy-size dark matter halos and that the WHIM properties evolve little from $z\\simeq0.5$ to now. Some characteristics of the WHIM, like the line number counts as a function of their brightness, depend on the specific hydrodynamic simulation used, while others, like the WHIM clustering properties, are robust to this aspect. The large number of simulations available in the CAMELS datasets allows us to assess the sensitivity of the WHIM properties to the background cosmology and to the energy feedback mechanisms regulated by AGN and stellar activity. [ABRIDGED]","abx":0,"nw":0,"d":"2022-09-01","dq":0,"y":2022,"au":[219,160,369,207,278],"c":10,"cs":0,"bib":"2023MNRAS.523.2263P","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2209.00657","url":"https://arxiv.org/abs/2209.00657","doi":"10.1093/mnras/stad1495","tg":{"s":["CAMELS (suite not stated)"],"d":["Synthetic observables"],"m":["No ML"],"u":[]},"x":0.6699,"yy":-0.6915,"p3":[0.1786,-0.6524,-0.0158],"sim":{"k":"e","l":[[141,0.944],[101,0.942],[38,0.937],[89,0.935],[124,0.933]]},"c3":[75.64,-45.42,55.52],"c2":[66.77,49.68],"k":6,"r":[156,158,171],"rm":0},{"id":"2208.08927","t":"Predictive uncertainty on improved astrophysics recovery from multifield cosmology","ab":"We investigate how the constraints on cosmological and astrophysical parameters ($Ω_{\\rm m}$, $σ_{8}$, $A_{\\rm SN1}$, $A_{\\rm SN2}$) vary when exploiting information from multiple fields in cosmology. We make use of a convolutional neural network to retrieve the salient features from different combinations of field maps from IllustrisTNG in the CAMELS project. The fields considered are neutral hydrogen (HI), gas density (Mgas), magnetic fields (B) and gas metallicity (Z). We estimate the predictive uncertainty on the predictions of our model by using Monte Carlo dropout, a Bayesian approximation. Results show that overall, the performance of the model improves on all parameters as the number of channels of its input is increased. As compared to previous works, our model is able to predict the astrophysical parameters with up to $5\\%$ higher in accuracy. In the best setup which includes all fields (four channel input, Mgas-HI-B-Z) the model achieves $R^{2} > 0.96$ on all parameters. Similarly, we find that the total uncertainty, which is dominated by the aleatoric uncertainty, decreases as more fields are used to train the model in general. The uncertainties obtained by dropout variational inference are overestimated on all parameters in our case, in that the predictive uncertainty is much larger than the actual squared error. After calibration, which consists of a simple $σ$ scaling method, the average deviation of the total uncertainty from the actual error goes down to $25\\%$ at most (on $A_{\\rm SN1}$).","abx":0,"nw":0,"d":"2022-08-18","dq":0,"y":2022,"au":[499,532],"c":4,"cs":0,"bib":"2023JCAP...06..051A","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2208.08927","url":"https://arxiv.org/abs/2208.08927","doi":"10.1088/1475-7516/2023/06/051","tg":{"s":["IllustrisTNG"],"d":["2D maps"],"m":["CNN"],"u":[]},"x":-0.2291,"yy":0.4953,"p3":[0.094,0.3455,-0.3531],"sim":{"k":"e","l":[[167,0.951],[97,0.94],[2,0.94],[164,0.94],[113,0.94]]},"c3":[-56.9,108.76,-84.82],"c2":[-113.26,127.73],"k":0,"r":[158,165,166,167,171],"rm":0},{"id":"2207.05509","t":"Hybrid Physical-Neural ODEs for Fast N-body Simulations","ab":"We present a new scheme to compensate for the small-scales approximations resulting from Particle-Mesh (PM) schemes for cosmological N-body simulations. This kind of simulations are fast and low computational cost realizations of the large scale structures, but lack resolution on small scales. To improve their accuracy, we introduce an additional effective force within the differential equations of the simulation, parameterized by a Fourier-space Neural Network acting on the PM-estimated gravitational potential. We compare the results for the matter power spectrum obtained to the ones obtained by the PGD scheme (Potential gradient descent scheme). We notice a similar improvement in term of power spectrum, but we find that our approach outperforms PGD for the cross-correlation coefficients, and is more robust to changes in simulation settings (different resolutions, different cosmologies).","abx":0,"nw":0,"d":"2022-07-12","dq":0,"y":2022,"au":[146,208,264],"c":13,"cs":0,"bib":"2022mla..confE..60L","v":"arXiv.org","lk":"arXiv:2207.05509","url":"https://arxiv.org/abs/2207.05509","doi":"10.48550/arXiv.2207.05509","tg":{"s":["CAMELS (suite not stated)","N-body (dark matter only)"],"d":["Particle snapshots","Power spectra & summary statistics"],"m":["Other ML"],"u":["CAMELS (suite not stated)","N-body (dark matter only)"]},"x":-0.5681,"yy":0.1612,"p3":[-0.3833,0.3914,0.1833],"sim":{"k":"e","l":[[107,0.95],[48,0.944],[4,0.927],[135,0.927],[67,0.927]]},"c3":[-148.82,-12.87,72.7],"c2":[-137.59,-104.64],"k":4,"r":[],"rm":0},{"id":"2205.02245","t":"The halo finding problem revisited: a deep revision of the ASOHF code","ab":"Context. New-generation cosmological simulations are providing huge amounts of data, whose analysis becomes itself a cutting-edge computational problem. In particular, the identification of gravitationally bound structures, known as halo finding, is one of the main analyses. A handful of codes developed to tackle this task have been presented during the last years. Aims. We present a deep revision of the already existing code ASOHF. The algorithm has been throughfully redesigned in order to improve its capabilities to find bound structures and substructures, both using dark matter particles and stars, its parallel performance, and its abilities to handle simulation outputs with vast amounts of particles. This upgraded version of ASOHF is conceived to be a publicly available tool. Methods. A battery of idealised and realistic tests are presented in order to assess the performance of the new version of the halo finder. Results. In the idealised tests, ASOHF produces excellent results, being able to find virtually all the structures and substructures placed within the computational domain. When applied to realistic data from simulations, the performance of our finder is fully consistent with the results from other commonly used halo finders, with remarkable performance in substructure detection. Besides, ASOHF turns out to be extremely efficient in terms of computational cost. Conclusions. We present a public, deeply revised version of the ASOHF halo finder. The new version of the code produces remarkable results finding haloes and subhaloes in cosmological simulations, with an excellent parallel performance and with a contained computational cost.","abx":0,"nw":0,"d":"2022-05-04","dq":0,"y":2022,"au":[141,534,562],"c":18,"cs":0,"bib":"2022A&A...664A..42V","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2205.02245","url":"https://arxiv.org/abs/2205.02245","doi":"10.1051/0004-6361/202243712","tg":{"s":["CAMELS (suite not stated)","Non-CAMELS simulations"],"d":["Particle snapshots","Halo & galaxy catalogs"],"m":["No ML"],"u":["CAMELS (suite not stated)"]},"x":0.3643,"yy":0.1561,"p3":[0.5098,0.007,0.0425],"sim":{"k":"e","l":[[136,0.933],[163,0.932],[49,0.931],[11,0.926],[158,0.925]]},"c3":[37.44,57.24,6.8],"c2":[78.7,72.5],"k":6,"r":[158,171],"rm":0},{"id":"2205.05499","t":"Cosmology with X-RAY galaxy cluster surveys ?","ab":"This talk reviews the scientific motivations, the potential difficulty and recent advances in cosmology using cluster number-counts in the X-ray band. Our forward modelling approach shows that many of the practical and conceptual shortcomings can now be overcome. We present recent results from the XMM-XXL survey. The next step is to apply artificial intelligence techniques on simulations. This allows us to bypass the unnecessarily complicated scaling relation formalism. The net gain is to significantly reduce the number of free parameters and to provide direct access both to the cosmological parameters and to truly physical ingredients, such as AGN feedback. In this way, we achieve cluster cosmology without explicit cluster mass calculation.","abx":0,"nw":1,"d":"2022-05-11","dq":0,"y":2022,"au":[361],"c":0,"cs":0,"bib":"2022arXiv220505499P","v":"","lk":"arXiv:2205.05499","url":"https://arxiv.org/abs/2205.05499","doi":"","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs","Synthetic observables"],"m":["Other ML"],"u":["Halo & galaxy catalogs","Synthetic observables"]},"x":-0.0389,"yy":-0.0911,"p3":[0.4459,0.0229,0.0051],"sim":{"k":"e","l":[[60,0.949],[169,0.922],[90,0.919],[154,0.919],[159,0.919]]},"c3":[-137.44,29.22,-173.95],"c2":[-206.96,36.64],"k":6,"r":[165],"rm":0},{"id":"2204.13713","t":"Learning cosmology and clustering with cosmic graphs","ab":"We train deep learning models on thousands of galaxy catalogues from the state-of-the-art hydrodynamic simulations of the CAMELS project to perform regression and inference. We employ Graph Neural Networks (GNNs), architectures designed to work with irregular and sparse data, like the distribution of galaxies in the Universe. We first show that GNNs can learn to compute the power spectrum of galaxy catalogues with a few percent accuracy. We then train GNNs to perform likelihood-free inference at the galaxy-field level. Our models are able to infer the value of $Ω_{\\rm m}$ with a $\\sim12\\%-13\\%$ accuracy just from the positions of $\\sim1000$ galaxies in a volume of $(25~h^{-1}{\\rm Mpc})^3$ at $z=0$ while accounting for astrophysical uncertainties as modelled in CAMELS. Incorporating information from galaxy properties, such as stellar mass, stellar metallicity, and stellar radius, increases the accuracy to $4\\%-8\\%$. Our models are built to be translational and rotational invariant, and they can extract information from any scale larger than the minimum distance between two galaxies. However, our models are not completely robust: testing on simulations run with a different subgrid physics than the ones used for training does not yield as accurate results.","abx":0,"nw":0,"d":"2022-04-28","dq":0,"y":2022,"au":[442,207],"c":76,"cs":0,"bib":"2022ApJ...937..115V","v":"Astrophysical Journal","lk":"arXiv:2204.13713","url":"https://arxiv.org/abs/2204.13713","doi":"10.3847/1538-4357/ac8930","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":0.0911,"yy":0.3492,"p3":[0.2806,0.3149,-0.0903],"sim":{"k":"e","l":[[114,0.973],[133,0.972],[163,0.961],[171,0.96],[12,0.96]]},"c3":[54.83,-28.15,-167.17],"c2":[-3.86,147.99],"k":8,"r":[154,155,157,158,159,162,163,165,166,167,169,171],"rm":0},{"id":"2204.02408","t":"Constraining cosmology with machine learning and galaxy clustering: the CAMELS-SAM suite","ab":"As the next generation of large galaxy surveys come online, it is becoming increasingly important to develop and understand the machine learning tools that analyze big astronomical data. Neural networks are powerful and capable of probing deep patterns in data, but must be trained carefully on large and representative data sets. We developed and generated a new `hump' of the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project: CAMELS-SAM, encompassing one thousand dark-matter only simulations of (100 $h^{-1}$ cMpc)$^3$ with different cosmological parameters ($Ω_m$ and $σ_8$) and run through the Santa Cruz semi-analytic model for galaxy formation over a broad range of astrophysical parameters. As a proof-of-concept for the power of this vast suite of simulated galaxies in a large volume and broad parameter space, we probe the power of simple clustering summary statistics to marginalize over astrophysics and constrain cosmology using neural networks. We use the two-point correlation function, count-in-cells, and the Void Probability Function, and probe non-linear and linear scales across $0.68<$ R $<27\\ h^{-1}$ cMpc. Our cosmological constraints cluster around 3-8$\\%$ error on $Ω_{\\text{M}}$ and $σ_8$, and we explore the effect of various galaxy selections, galaxy sampling, and choice of clustering statistics on these constraints. We additionally explore how these clustering statistics constrain and inform key stellar and galactic feedback parameters in the Santa Cruz SAM. CAMELS-SAM has been publicly released alongside the rest of CAMELS, and offers great potential to many applications of machine learning in astrophysics: https://camels-sam.readthedocs.io.","abx":0,"nw":0,"d":"2022-04-05","dq":0,"y":2022,"au":[340,515,207,464,62,134,73,323],"c":42,"cs":0,"bib":"2023ApJ...954...11P","v":"Astrophysical Journal","lk":"arXiv:2204.02408","url":"https://arxiv.org/abs/2204.02408","doi":"10.3847/1538-4357/accd52","tg":{"s":["CAMELS-SAM","N-body (dark matter only)"],"d":["Halo & galaxy catalogs","Power spectra & summary statistics"],"m":["Emulators & regression ML"],"u":[]},"x":0.1056,"yy":-0.0651,"p3":[0.2649,0.1048,0.066],"sim":{"k":"e","l":[[171,0.959],[153,0.959],[158,0.955],[96,0.953],[36,0.953]]},"c3":[90.92,-65.41,-111.2],"c2":[-1.19,-33.57],"k":6,"r":[132,133,137,139,140,146,153,155,156,158,164,165,166,169,170,171],"rm":0},{"id":"2201.04142","t":"Breaking baryon-cosmology degeneracy with the electron density power spectrum","ab":"Uncertain feedback processes in galaxies affect the distribution of matter, currently limiting the power of weak lensing surveys. If we can identify cosmological statistics that are robust against these uncertainties, or constrain these effects by other means, then we can enhance the power of current and upcoming observations from weak lensing surveys such as DES, Euclid, the Rubin Observatory, and the Roman Space Telescope. In this work, we investigate the potential of the electron density auto-power spectrum as a robust probe of cosmology and baryonic feedback. We use a suite of (magneto-)hydrodynamic simulations from the CAMELS project and perform an idealized analysis to forecast statistical uncertainties on a limited set of cosmological and physically-motivated astrophysical parameters. We find that the electron number density auto-correlation, measurable through either kinematic Sunyaev-Zel'dovich observations or through Fast Radio Burst dispersion measures, provides tight constraints on $Ω_{m}$ and the mean baryon fraction in intermediate-mass halos, $\\bar{f}_{\\mathrm{bar}}$. By obtaining an empirical measure for the associated systematic uncertainties, we find these constraints to be largely robust to differences in baryonic feedback models implemented in hydrodynamic simulations. We further discuss the main caveats associated with our analysis, and point out possible directions for future work.","abx":0,"nw":0,"d":"2022-01-11","dq":0,"y":2022,"au":[46,207,140,271,134,479,515,325,133,464,73],"c":37,"cs":0,"bib":"2022JCAP...04..046N","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2201.04142","url":"https://arxiv.org/abs/2201.04142","doi":"10.1088/1475-7516/2022/04/046","tg":{"s":["CAMELS (suite not stated)"],"d":["Power spectra & summary statistics"],"m":["No ML"],"u":[]},"x":0.3388,"yy":-0.8698,"p3":[-0.0728,-0.4396,0.4716],"sim":{"k":"e","l":[[78,0.95],[69,0.944],[83,0.94],[147,0.94],[138,0.939]]},"c3":[140.47,59.46,-17.83],"c2":[137.08,126.92],"k":1,"r":[166,167,170,171],"rm":0},{"id":"2201.02708","t":"The Circumgalactic Medium from the CAMELS Simulations: Forecasting Constraints on Feedback Processes from Future Sunyaev-Zeldovich Observations","ab":"The cycle of baryons through the circumgalactic medium (CGM) is important to understand in the context of galaxy formation and evolution. In this study we forecast constraints on the feedback processes heating the CGM with current and future Sunyaev-Zeldovich (SZ) observations. To constrain these processes, we use a suite of cosmological simulations, the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS), that varies four different feedback parameters of two previously existing hydrodynamical simulations, IllustrisTNG and SIMBA. We capture the dependencies of SZ radial profiles on these feedback parameters with an emulator, calculate their derivatives, and forecast future constraints on these feedback parameters from upcoming experiments. We find that for a DESI-like (Dark Energy Spectroscopic Instrument) galaxy sample observed by the Simons Observatory all four feedback parameters are able to be constrained (some within the $10\\%$ level), indicating that future observations will be able to further restrict the parameter space for these sub-grid models. Given the modeled galaxy sample and forecasted errors in this work, we find that the inner SZ profiles contribute more to the constraining power than the outer profiles. Finally, we find that, despite the wide range of AGN feedback parameter variation in the CAMELS simulation suite, we cannot reproduce the tSZ signal of galaxies selected by the Baryon Oscillation Spectroscopic Survey as measured by the Atacama Cosmology Telescope.","abx":0,"nw":0,"d":"2022-01-07","dq":0,"y":2022,"au":[179,417,133,182,342,207,524,134,228,479,325,363],"c":41,"cs":0,"bib":"2022ApJ...933..133M","v":"Astrophysical Journal","lk":"arXiv:2201.02708","url":"https://arxiv.org/abs/2201.02708","doi":"10.3847/1538-4357/ac70c6","tg":{"s":["IllustrisTNG","SIMBA"],"d":["Profiles","Synthetic observables"],"m":["Emulators & regression ML"],"u":[]},"x":0.515,"yy":-0.5907,"p3":[-0.0253,-0.5077,-0.1333],"sim":{"k":"e","l":[[81,0.956],[101,0.955],[89,0.954],[160,0.95],[141,0.948]]},"c3":[152.04,-2.58,-7.34],"c2":[138.15,31.18],"k":1,"r":[158,171],"rm":0},{"id":"2201.02202","t":"Cosmology with one galaxy?","ab":"Galaxies can be characterized by many internal properties such as stellar mass, gas metallicity, and star-formation rate. We quantify the amount of cosmological and astrophysical information that the internal properties of individual galaxies and their host dark matter halos contain. We train neural networks using hundreds of thousands of galaxies from 2,000 state-of-the-art hydrodynamic simulations with different cosmologies and astrophysical models of the CAMELS project to perform likelihood-free inference on the value of the cosmological and astrophysical parameters. We find that knowing the internal properties of a single galaxy allow our models to infer the value of $Ω_{\\rm m}$, at fixed $Ω_{\\rm b}$, with a $\\sim10\\%$ precision, while no constraint can be placed on $σ_8$. Our results hold for any type of galaxy, central or satellite, massive or dwarf, at all considered redshifts, $z\\leq3$, and they incorporate uncertainties in astrophysics as modeled in CAMELS. However, our models are not robust to changes in subgrid physics due to the large intrinsic differences the two considered models imprint on galaxy properties. We find that the stellar mass, stellar metallicity, and maximum circular velocity are among the most important galaxy properties to determine the value of $Ω_{\\rm m}$. We believe that our results can be explained taking into account that changes in the value of $Ω_{\\rm m}$, or potentially $Ω_{\\rm b}/Ω_{\\rm m}$, affect the dark matter content of galaxies. That effect leaves a distinct signature in galaxy properties to the one induced by galactic processes. Our results suggest that the low-dimensional manifold hosting galaxy properties provides a tight direct link between cosmology and astrophysics.","abx":0,"nw":0,"d":"2022-01-06","dq":0,"y":2022,"au":[207,291,515,528,559,140,478,591,102,441,134,133,363],"c":63,"cs":0,"bib":"2022ApJ...929..132V","v":"Astrophysical Journal","lk":"arXiv:2201.02202","url":"https://arxiv.org/abs/2201.02202","doi":"10.3847/1538-4357/ac5d3f","tg":{"s":["IllustrisTNG","SIMBA"],"d":["Halo & galaxy catalogs"],"m":["Simulation-based inference"],"u":[]},"x":-0.2096,"yy":0.1878,"p3":[0.1114,-0.0501,-0.5127],"sim":{"k":"e","l":[[117,0.967],[115,0.957],[74,0.953],[129,0.95],[167,0.949]]},"c3":[90.02,-98.09,-113.03],"c2":[156.46,-4.69],"k":7,"r":[166,167,169,171],"rm":0},{"id":"2201.01300","t":"The CAMELS project: public data release","ab":"The Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project was developed to combine cosmology with astrophysics through thousands of cosmological hydrodynamic simulations and machine learning. CAMELS contains 4,233 cosmological simulations, 2,049 N-body and 2,184 state-of-the-art hydrodynamic simulations that sample a vast volume in parameter space. In this paper we present the CAMELS public data release, describing the characteristics of the CAMELS simulations and a variety of data products generated from them, including halo, subhalo, galaxy, and void catalogues, power spectra, bispectra, Lyman-$α$ spectra, probability distribution functions, halo radial profiles, and X-rays photon lists. We also release over one thousand catalogues that contain billions of galaxies from CAMELS-SAM: a large collection of N-body simulations that have been combined with the Santa Cruz Semi-Analytic Model. We release all the data, comprising more than 350 terabytes and containing 143,922 snapshots, millions of halos, galaxies and summary statistics. We provide further technical details on how to access, download, read, and process the data at \\url{https://camels.readthedocs.io}.","abx":0,"nw":0,"d":"2022-01-04","dq":0,"y":2022,"au":[207,515,134,340,442,150,239,196,532,179,182,342,46,330,593,431,69,383,105,413,32,371,41,288,116,301,579,387,219,597,553,559,479,417,133,140,325,78,148,73,464,228,369,591,564,300,363],"c":120,"cs":0,"bib":"2023ApJS..265...54V","v":"Astrophysical Journal Supplement Series","lk":"arXiv:2201.01300","url":"https://arxiv.org/abs/2201.01300","doi":"10.3847/1538-4365/acbf47","tg":{"s":["IllustrisTNG","SIMBA","N-body (dark matter only)"],"d":["Particle snapshots","Halo & galaxy catalogs","Power spectra & summary statistics","Profiles","Synthetic observables"],"m":["No ML"],"u":[]},"x":-0.1583,"yy":-0.0012,"p3":[-0.004,-0.0094,-0.1302],"sim":{"k":"e","l":[[171,0.973],[130,0.965],[12,0.96],[165,0.957],[154,0.955]]},"c3":[44.84,22.53,-35.22],"c2":[31.69,85.37],"k":7,"r":[155,156,157,159,160,162,163,164,165,166,167,168,169,170,171],"rm":0},{"id":"2201.01305","t":"Augmenting astrophysical scaling relations with machine learning: application to reducing the Sunyaev-Zeldovich flux-mass scatter","ab":"Complex astrophysical systems often exhibit low-scatter relations between observable properties (e.g., luminosity, velocity dispersion, oscillation period). These scaling relations illuminate the underlying physics, and can provide observational tools for estimating masses and distances. Machine learning can provide a fast and systematic way to search for new scaling relations (or for simple extensions to existing relations) in abstract high-dimensional parameter spaces. We use a machine learning tool called symbolic regression (SR), which models patterns in a dataset in the form of analytic equations. We focus on the Sunyaev-Zeldovich flux$-$cluster mass relation ($Y_\\mathrm{SZ}-M$), the scatter in which affects inference of cosmological parameters from cluster abundance data. Using SR on the data from the IllustrisTNG hydrodynamical simulation, we find a new proxy for cluster mass which combines $Y_\\mathrm{SZ}$ and concentration of ionized gas ($c_\\mathrm{gas}$): $M \\propto Y_\\mathrm{conc}^{3/5} \\equiv Y_\\mathrm{SZ}^{3/5} (1-A\\, c_\\mathrm{gas})$. $Y_\\mathrm{conc}$ reduces the scatter in the predicted $M$ by $\\sim 20-30$\\% for large clusters ($M\\gtrsim 10^{14}\\, h^{-1} \\, M_\\odot$), as compared to using just $Y_\\mathrm{SZ}$. We show that the dependence on $c_\\mathrm{gas}$ is linked to cores of clusters exhibiting larger scatter than their outskirts. Finally, we test $Y_\\mathrm{conc}$ on clusters from CAMELS simulations and show that $Y_\\mathrm{conc}$ is robust against variations in cosmology, subgrid physics, and cosmic variance. Our results and methodology can be useful for accurate multiwavelength cluster mass estimation from upcoming CMB and X-ray surveys like ACT, SO, eROSITA and CMB-S4.","abx":0,"nw":0,"d":"2022-01-04","dq":0,"y":2022,"au":[150,330,207,255,395,140,417,134,325,511],"c":31,"cs":0,"bib":"2023PNAS..12002074W","v":"Proceedings of the National Academy of Sciences of the United States of America","lk":"arXiv:2201.01305","url":"https://arxiv.org/abs/2201.01305","doi":"10.1073/pnas.2202074120","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs","Synthetic observables"],"m":["Symbolic regression"],"u":[]},"x":-0.6613,"yy":-0.2104,"p3":[0.2222,0.0062,0.2906],"sim":{"k":"e","l":[[169,0.947],[147,0.938],[24,0.932],[154,0.932],[60,0.929]]},"c3":[115.82,67.04,-108.5],"c2":[65.91,103.37],"k":3,"r":[147,163,165,166,167,169,171],"rm":0},{"id":"2201.01663","t":"Percent-level constraints on baryonic feedback with spectral distortion measurements","ab":"High-significance measurements of the monopole thermal Sunyaev-Zel'dovich CMB spectral distortions have the potential to tightly constrain poorly understood baryonic feedback processes. The sky-averaged Compton-y distortion and its relativistic correction are measures of the total thermal energy in electrons in the observable universe and their mean temperature. We use the CAMELS suite of hydrodynamic simulations to explore possible constraints on parameters describing the subgrid implementation of feedback from active galactic nuclei and supernovae, assuming a PIXIE-like measurement. The small 25 Mpc/h CAMELS boxes present challenges due to the significant cosmic variance. We utilize machine learning to construct interpolators through the noisy simulation data. Using the halo model, we translate the simulation halo mass functions into correction factors to reduce cosmic variance where required. Our results depend on the subgrid model. In the case of IllustrisTNG, we find that the best-determined parameter combination can be measured to ~2% and corresponds to a product of AGN and SN feedback. In the case of SIMBA, the tightest constraint is ~0.2% on a ratio between AGN and SN feedback. A second orthogonal parameter combination can be measured to ~8%. Our results demonstrate the significant constraining power a measurement of the late-time spectral distortion monopoles would have for baryonic feedback models.","abx":0,"nw":0,"d":"2022-01-05","dq":0,"y":2022,"au":[330,150,255,417,266,207,325,363,134,200],"c":22,"cs":0,"bib":"2022PhRvD.105h3505T","v":"Physical Review D","lk":"arXiv:2201.01663","url":"https://arxiv.org/abs/2201.01663","doi":"10.1103/PhysRevD.105.083505","tg":{"s":["CAMELS (suite not stated)"],"d":["Synthetic observables"],"m":["Emulators & regression ML"],"u":[]},"x":0.4354,"yy":-0.6489,"p3":[-0.0989,-0.369,0.142],"sim":{"k":"e","l":[[101,0.953],[89,0.951],[156,0.95],[12,0.947],[154,0.947]]},"c3":[173.55,-35.99,-20.6],"c2":[184.94,-7.94],"k":1,"r":[156,159,169,171],"rm":0},{"id":"2112.15305","t":"Properties beyond mass for unresolved haloes across redshift and cosmology using correlations with local halo environment","ab":"The structural and dynamic properties of the dark matter halos, though an important ingredient in understanding large-scale structure formation, require more conservative particle resolution than those required by halo mass alone in a simulation. This reduces the parameter space of the simulations, more severely for high-redshift and large-volume mocks which are required by the next-generation large sky surveys. Here, we incorporate redshift and cosmology dependence into an algorithm that assigns accurate halo properties such as concentration, spin, velocity, and spatial distribution to the sub-resolution haloes in a simulation. By focusing on getting the right correlations with halo mass and local tidal anisotropy $α$ measured at $4 \\times$ halo radius, our method will also recover the correlations of these small scale structural properties with the large-scale environment, i.e., the halo assembly bias at all scales greater than $5 \\times$ halo radius. We find that the distribution of halo properties is universal with redshift and cosmology. By applying the algorithm to a large volume simulation $(600 h^{-1}{\\rm Mpc})$, we can access the $30-500$ particle haloes, thus gaining an order of magnitude in halo mass and two to three orders of magnitude in number density at $z=2-4$. This technique reduces the cost of mocks required for the estimation of covariance matrices, weak lensing studies, or any large-scale clustering analysis with less massive haloes.","abx":0,"nw":1,"d":"2021-12-31","dq":0,"y":2021,"au":[531,453],"c":3,"cs":0,"bib":"2022MNRAS.516.5849R","v":"","lk":"arXiv:2112.15305","url":"https://arxiv.org/abs/2112.15305","doi":"10.1093/mnras/stac2605","tg":{"s":["N-body (dark matter only)","Non-CAMELS simulations"],"d":["Halo & galaxy catalogs"],"m":["No ML"],"u":["N-body (dark matter only)","No ML"]},"x":0.1857,"yy":0.061,"p3":[0.428,0.1494,0.1654],"sim":{"k":"e","l":[[136,0.936],[146,0.93],[24,0.929],[163,0.929],[132,0.928]]},"c3":[116.57,-136.5,-165.42],"c2":[-86.76,-153.07],"k":3,"r":[154],"rm":0},{"id":"2111.14874","t":"Weighing the Milky Way and Andromeda with Artificial Intelligence","ab":"We present new constraints on the masses of the halos hosting the Milky Way and Andromeda galaxies derived using graph neural networks. Our models, trained on thousands of state-of-the-art hydrodynamic simulations of the CAMELS project, only make use of the positions, velocities and stellar masses of the galaxies belonging to the halos, and are able to perform likelihood-free inference on halo masses while accounting for both cosmological and astrophysical uncertainties. Our constraints are in agreement with estimates from other traditional methods.","abx":0,"nw":0,"d":"2021-11-29","dq":0,"y":2021,"au":[442,207,515,134,325,200,140,363,148],"c":32,"cs":0,"bib":"2023PhRvD.107j3003V","v":"arXiv.org","lk":"arXiv:2111.14874","url":"https://arxiv.org/abs/2111.14874","doi":"10.48550/arXiv.2111.14874","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":-0.0022,"yy":0.3018,"p3":[0.1694,0.312,-0.2045],"sim":{"k":"e","l":[[133,0.95],[153,0.949],[12,0.945],[166,0.942],[171,0.941]]},"c3":[29.7,8.42,-140.6],"c2":[-20.89,129.27],"k":8,"r":[146,153,158,163,165,171],"rm":0},{"id":"2111.08683","t":"Inferring halo masses with Graph Neural Networks","ab":"Understanding the halo-galaxy connection is fundamental in order to improve our knowledge on the nature and properties of dark matter. In this work we build a model that infers the mass of a halo given the positions, velocities, stellar masses, and radii of the galaxies it hosts. In order to capture information from correlations among galaxy properties and their phase-space, we use Graph Neural Networks (GNNs), that are designed to work with irregular and sparse data. We train our models on galaxies from more than 2,000 state-of-the-art simulations from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project. Our model, that accounts for cosmological and astrophysical uncertainties, is able to constrain the masses of the halos with a $\\sim$0.2 dex accuracy. Furthermore, a GNN trained on a suite of simulations is able to preserve part of its accuracy when tested on simulations run with a different code that utilizes a distinct subgrid physics model, showing the robustness of our method. The PyTorch Geometric implementation of the GNN is publicly available on Github at https://github.com/PabloVD/HaloGraphNet","abx":0,"nw":0,"d":"2021-11-16","dq":0,"y":2021,"au":[442,207,134,515,200,140,325,363,479,148],"c":56,"cs":0,"bib":"2022ApJ...935...30V","v":"Astrophysical Journal","lk":"arXiv:2111.08683","url":"https://arxiv.org/abs/2111.08683","doi":"10.3847/1538-4357/ac7aa3","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Graph neural networks"],"u":[]},"x":0.2365,"yy":0.2304,"p3":[0.4017,0.1385,0.0331],"sim":{"k":"e","l":[[146,0.962],[153,0.961],[44,0.958],[132,0.957],[11,0.953]]},"c3":[53.7,25.8,-164.82],"c2":[-27.6,106.55],"k":8,"r":[153,158,159,162,165,169,171],"rm":0},{"id":"2110.02983","t":"HIFlow: Generating Diverse HI Maps and Inferring Cosmology while Marginalizing over Astrophysics using Normalizing Flows","ab":"A wealth of cosmological and astrophysical information is expected from many ongoing and upcoming large-scale surveys. It is crucial to prepare for these surveys now and develop tools that can efficiently extract most information. We present HIFlow: a fast generative model of the neutral hydrogen (HI) maps that is conditioned only on cosmology ($Ω_{m}$ and $σ_{8}$) and designed using a class of normalizing flow models, the Masked Autoregressive Flow (MAF). HIFlow is trained on the state-of-the-art simulations from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project. HIFlow has the ability to generate realistic diverse maps without explicitly incorporating the expected 2D maps structure into the flow as an inductive bias. We find that HIFlow is able to reproduce the CAMELS average and standard deviation HI power spectrum (Pk) within a factor of $\\lesssim$ 2, scoring a very high $R^{2} > 90\\%$. By inverting the flow, HIFlow provides a tractable high-dimensional likelihood for efficient parameter inference. We show that the conditional HIFlow on cosmology is successfully able to marginalize over astrophysics at the field level, regardless of the stellar and AGN feedback strengths. This new tool represents a first step toward a more powerful parameter inference, maximizing the scientific return of future HI surveys, and opening a new avenue to minimize the loss of complex information due to data compression down to summary statistics.","abx":0,"nw":0,"d":"2021-10-06","dq":0,"y":2021,"au":[532,207,73,140,134,515,395,228,479,464,387,148,511,499],"c":46,"cs":0,"bib":"2022ApJ...937...83H","v":"Astrophysical Journal","lk":"arXiv:2110.02983","url":"https://arxiv.org/abs/2110.02983","doi":"10.3847/1538-4357/ac8b09","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["Normalizing flows","Generative models"],"u":[]},"x":-0.4613,"yy":0.8472,"p3":[-0.0004,0.3376,-0.2102],"sim":{"k":"e","l":[[142,0.975],[76,0.944],[154,0.944],[25,0.943],[171,0.942]]},"c3":[-44.24,56.53,-18.19],"c2":[-71.47,99.54],"k":0,"r":[165,166,167,171],"rm":0},{"id":"2109.10915","t":"The CAMELS Multifield Dataset: Learning the Universe's Fundamental Parameters with Artificial Intelligence","ab":"We present the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) Multifield Dataset, CMD, a collection of hundreds of thousands of 2D maps and 3D grids containing many different properties of cosmic gas, dark matter, and stars from 2,000 distinct simulated universes at several cosmic times. The 2D maps and 3D grids represent cosmic regions that span $\\sim$100 million light years and have been generated from thousands of state-of-the-art hydrodynamic and gravity-only N-body simulations from the CAMELS project. Designed to train machine learning models, CMD is the largest dataset of its kind containing more than 70 Terabytes of data. In this paper we describe CMD in detail and outline a few of its applications. We focus our attention on one such task, parameter inference, formulating the problems we face as a challenge to the community. We release all data and provide further technical details at https://camels-multifield-dataset.readthedocs.io.","abx":0,"nw":0,"d":"2021-09-22","dq":0,"y":2021,"au":[207,515,134,330,479,148,46,591,442,73,140,464,283,196,532,239,150,387,301,220,593,179,182,342,340,133,417,363],"c":98,"cs":0,"bib":"2022ApJS..259...61V","v":"Astrophysical Journal Supplement Series","lk":"arXiv:2109.10915","url":"https://arxiv.org/abs/2109.10915","doi":"10.3847/1538-4365/ac5ab0","tg":{"s":["IllustrisTNG","SIMBA","N-body (dark matter only)"],"d":["2D maps","3D fields"],"m":["CNN","Simulation-based inference"],"u":[]},"x":-0.2427,"yy":0.3941,"p3":[-0.0601,-0.025,-0.3678],"sim":{"k":"e","l":[[167,0.963],[171,0.962],[158,0.957],[130,0.948],[31,0.946]]},"c3":[-55.26,11.08,-119.86],"c2":[-87.39,55.73],"k":7,"r":[162,163,166,167,170,171],"rm":0},{"id":"2109.10360","t":"Robust marginalization of baryonic effects for cosmological inference at the field level","ab":"We train neural networks to perform likelihood-free inference from $(25\\,h^{-1}{\\rm Mpc})^2$ 2D maps containing the total mass surface density from thousands of hydrodynamic simulations of the CAMELS project. We show that the networks can extract information beyond one-point functions and power spectra from all resolved scales ($\\gtrsim 100\\,h^{-1}{\\rm kpc}$) while performing a robust marginalization over baryonic physics at the field level: the model can infer the value of $Ω_{\\rm m} (\\pm 4\\%)$ and $σ_8 (\\pm 2.5\\%)$ from simulations completely different to the ones used to train it.","abx":0,"nw":0,"d":"2021-09-21","dq":0,"y":2021,"au":[207,515,134,140,591,73,330,46,283,239,532,148,479,363],"c":58,"cs":0,"bib":"2021arXiv210910360V","v":"arXiv.org","lk":"arXiv:2109.10360","url":"https://arxiv.org/abs/2109.10360","doi":"10.48550/arXiv.2109.10360","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["CNN","Simulation-based inference"],"u":[]},"x":-0.0691,"yy":0.402,"p3":[-0.0109,0.3252,-0.3314],"sim":{"k":"e","l":[[133,0.955],[31,0.954],[167,0.952],[114,0.95],[4,0.949]]},"c3":[54.8,84.92,-94.15],"c2":[0.9,115.2],"k":8,"r":[167,170,171],"rm":0},{"id":"2109.09747","t":"Multifield Cosmology with Artificial Intelligence","ab":"Astrophysical processes such as feedback from supernovae and active galactic nuclei modify the properties and spatial distribution of dark matter, gas, and galaxies in a poorly understood way. This uncertainty is one of the main theoretical obstacles to extract information from cosmological surveys. We use 2,000 state-of-the-art hydrodynamic simulations from the CAMELS project spanning a wide variety of cosmological and astrophysical models and generate hundreds of thousands of 2-dimensional maps for 13 different fields: from dark matter to gas and stellar properties. We use these maps to train convolutional neural networks to extract the maximum amount of cosmological information while marginalizing over astrophysical effects at the field level. Although our maps only cover a small area of $(25~h^{-1}{\\rm Mpc})^2$, and the different fields are contaminated by astrophysical effects in very different ways, our networks can infer the values of $Ω_{\\rm m}$ and $σ_8$ with a few percent level precision for most of the fields. We find that the marginalization performed by the network retains a wealth of cosmological information compared to a model trained on maps from gravity-only N-body simulations that are not contaminated by astrophysical effects. Finally, we train our networks on multifields -- 2D maps that contain several fields as different colors or channels -- and find that not only they can infer the value of all parameters with higher accuracy than networks trained on individual fields, but they can constrain the value of $Ω_{\\rm m}$ with higher accuracy than the maps from the N-body simulations.","abx":0,"nw":0,"d":"2021-09-20","dq":0,"y":2021,"au":[207,134,515,140,591,73,46,330,532,283,148,479,363],"c":81,"cs":0,"bib":"2021arXiv210909747V","v":"arXiv.org","lk":"arXiv:2109.09747","url":"https://arxiv.org/abs/2109.09747","doi":"10.48550/arXiv.2109.09747","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["CNN","Simulation-based inference"],"u":[]},"x":-0.2169,"yy":0.4384,"p3":[-0.0259,0.2114,-0.5015],"sim":{"k":"e","l":[[165,0.963],[133,0.954],[102,0.953],[166,0.952],[146,0.952]]},"c3":[-11.37,27.65,-100.07],"c2":[-47.18,138.4],"k":8,"r":[166,170,171],"rm":0},{"id":"2109.07070","t":"Inpainting hydrodynamical maps with deep learning","ab":"From 1,000 hydrodynamic simulations of the CAMELS project, each with a different value of the cosmological and astrophysical parameters, we generate 15,000 gas temperature maps. We use a state-of-the-art deep convolutional neural network to recover missing data from those maps. We mimic the missing data by applying regular and irregular binary masks that cover either $15\\%$ or $30\\%$ of the area of each map. We quantify the reliability of our results using two summary statistics: 1) the distance between the probability density functions (pdf), estimated using the Kolmogorov-Smirnov (KS) test, and 2) the 2D power spectrum. We find an excellent agreement between the model prediction and the unmasked maps when using the power spectrum: better than $1\\%$ for $k<20 h/$Mpc for any irregular mask. For regular masks, we observe a systematic offset of $\\sim5\\%$ when covering $15\\%$ of the maps while the results become unreliable when $30\\%$ of the data is missing. The observed KS-test p-values favor the null hypothesis that the reconstructed and the ground-truth maps are drawn from the same underlying distribution when irregular masks are used. For regular-shaped masks on the other hand, we find a strong evidence that the two distributions do not match each other. Finally, we use the model, trained on gas temperature maps, to perform inpainting on maps from completely different fields such as gas mass, gas pressure, and electron density and also for gas temperature maps from simulations run with other codes. We find that visually, our model is able to reconstruct the missing pixels from the maps of those fields with great accuracy, although its performance using summary statistics depends strongly on the considered field.","abx":0,"nw":0,"d":"2021-09-15","dq":0,"y":2021,"au":[196,207,515,134,363],"c":7,"cs":0,"bib":"2022ApJ...941..132M","v":"Astrophysical Journal","lk":"arXiv:2109.07070","url":"https://arxiv.org/abs/2109.07070","doi":"10.3847/1538-4357/ac9f14","tg":{"s":["CAMELS (suite not stated)"],"d":["2D maps"],"m":["CNN"],"u":[]},"x":-0.2632,"yy":0.5994,"p3":[-0.1059,0.2758,-0.4947],"sim":{"k":"e","l":[[144,0.946],[167,0.942],[166,0.936],[50,0.931],[71,0.931]]},"c3":[-24.03,38.6,-54.17],"c2":[-46.0,83.41],"k":0,"r":[158,165,171],"rm":0},{"id":"2109.04484","t":"Finding universal relations in subhalo properties with artificial intelligence","ab":"We use a generic formalism designed to search for relations in high-dimensional spaces to determine if the total mass of a subhalo can be predicted from other internal properties such as velocity dispersion, radius, or star-formation rate. We train neural networks using data from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project and show that the model can predict the total mass of a subhalo with high accuracy: more than 99% of the subhalos have a predicted mass within 0.2 dex of their true value. The networks exhibit surprising extrapolation properties, being able to accurately predict the total mass of any type of subhalo containing any kind of galaxy at any redshift from simulations with different cosmologies, astrophysics models, subgrid physics, volumes, and resolutions, indicating that the network may have found a universal relation. We then use different methods to find equations that approximate the relation found by the networks and derive new analytic expressions that predict the total mass of a subhalo from its radius, velocity dispersion, and maximum circular velocity. We show that in some regimes, the analytic expressions are more accurate than the neural networks. We interpret the relation found by the neural network and approximated by the analytic equation as being connected to the virial theorem.","abx":0,"nw":0,"d":"2021-09-09","dq":0,"y":2021,"au":[239,207,515,140,134,325,479,148,220,363],"c":35,"cs":0,"bib":"2022ApJ...927...85S","v":"Astrophysical Journal","lk":"arXiv:2109.04484","url":"https://arxiv.org/abs/2109.04484","doi":"10.3847/1538-4357/ac4d30","tg":{"s":["CAMELS (suite not stated)"],"d":["Halo & galaxy catalogs"],"m":["Emulators & regression ML"],"u":[]},"x":-0.6322,"yy":-0.1917,"p3":[0.2795,0.0139,0.0933],"sim":{"k":"e","l":[[159,0.947],[132,0.944],[126,0.94],[11,0.938],[154,0.937]]},"c3":[147.32,-43.01,-106.73],"c2":[126.77,73.31],"k":6,"r":[170,171],"rm":0},{"id":"2011.05992","t":"Neural networks as optimal estimators to marginalize over baryonic effects","ab":"Many different studies have shown that a wealth of cosmological information resides on small, non-linear scales. Unfortunately, there are two challenges to overcome to utilize that information. First, we do not know the optimal estimator that will allow us to retrieve the maximum information. Second, baryonic effects impact that regime significantly and in a poorly understood manner. Ideally, we would like to use an estimator that extracts the maximum cosmological information while marginalizing over baryonic effects. In this work we show that neural networks can achieve that. We made use of data where the maximum amount of cosmological information is known: power spectra and 2D Gaussian density fields. We also contaminate the data with simplified baryonic effects and train neural networks to predict the value of the cosmological parameters. For this data, we show that neural networks can 1) extract the maximum available cosmological information, 2) marginalize over baryonic effects, and 3) extract cosmological information that is buried in the regime dominated by baryonic physics. We also show that neural networks learn the priors of the data they are trained on. We conclude that a promising strategy to maximize the scientific return of cosmological experiments is to train neural networks on state-of-the-art numerical simulations with different strengths and implementations of baryonic effects.","abx":0,"nw":0,"d":"2020-11-11","dq":0,"y":2020,"au":[207,73,134,515,282,511,140],"c":23,"cs":0,"bib":"2020arXiv201105992V","v":"Astrophysical Journal","lk":"arXiv:2011.05992","url":"https://arxiv.org/abs/2011.05992","doi":"10.3847/1538-4357/ac54a5","tg":{"s":["Non-CAMELS simulations"],"d":["Power spectra & summary statistics","2D maps"],"m":["Emulators & regression ML"],"u":["Non-CAMELS simulations"]},"x":0.2981,"yy":0.6404,"p3":[-0.124,0.35,-0.1673],"sim":{"k":"e","l":[[71,0.954],[166,0.945],[27,0.935],[132,0.935],[167,0.932]]},"c3":[82.93,61.03,-78.37],"c2":[45.86,116.74],"k":8,"r":[171],"rm":0},{"id":"2010.00619","t":"The CAMELS project: Cosmology and Astrophysics with MachinE Learning Simulations","ab":"We present the Cosmology and Astrophysics with MachinE Learning Simulations --CAMELS-- project. CAMELS is a suite of 4,233 cosmological simulations of $(25~h^{-1}{\\rm Mpc})^3$ volume each: 2,184 state-of-the-art (magneto-)hydrodynamic simulations run with the AREPO and GIZMO codes, employing the same baryonic subgrid physics as the IllustrisTNG and SIMBA simulations, and 2,049 N-body simulations. The goal of the CAMELS project is to provide theory predictions for different observables as a function of cosmology and astrophysics, and it is the largest suite of cosmological (magneto-)hydrodynamic simulations designed to train machine learning algorithms. CAMELS contains thousands of different cosmological and astrophysical models by way of varying $Ω_m$, $σ_8$, and four parameters controlling stellar and AGN feedback, following the evolution of more than 100 billion particles and fluid elements over a combined volume of $(400~h^{-1}{\\rm Mpc})^3$. We describe the simulations in detail and characterize the large range of conditions represented in terms of the matter power spectrum, cosmic star formation rate density, galaxy stellar mass function, halo baryon fractions, and several galaxy scaling relations. We show that the IllustrisTNG and SIMBA suites produce roughly similar distributions of galaxy properties over the full parameter space but significantly different halo baryon fractions and baryonic effects on the matter power spectrum. This emphasizes the need for marginalizing over baryonic effects to extract the maximum amount of information from cosmological surveys. We illustrate the unique potential of CAMELS using several machine learning applications, including non-linear interpolation, parameter estimation, symbolic regression, data generation with Generative Adversarial Networks (GANs), dimensionality reduction, and anomaly detection.","abx":0,"nw":0,"d":"2020-10-01","dq":0,"y":2020,"au":[207,134,515,140,464,479,49,325,157,445,148,591,431,559,41,511,532,78,150,417,220,228],"c":415,"cs":0,"bib":"2021ApJ...915...71V","v":"Astrophysical Journal","lk":"arXiv:2010.00619","url":"https://arxiv.org/abs/2010.00619","doi":"10.3847/1538-4357/abf7ba","tg":{"s":["IllustrisTNG","SIMBA","N-body (dark matter only)"],"d":["Particle snapshots","Power spectra & summary statistics","Halo & galaxy catalogs"],"m":["No ML"],"u":[]},"x":-0.1099,"yy":-0.0186,"p3":[0.0058,0.0419,-0.1792],"sim":{"k":"e","l":[[158,0.973],[130,0.973],[12,0.969],[165,0.962],[25,0.961]]},"c3":[12.77,-14.62,-18.22],"c2":[30.1,-5.96],"k":7,"r":[170],"rm":0}],"co":{"1":[[104.64,215.69,321.51],[-6.05,78.13,279.82],[-277.96,89.39,128.78],[-21.76,-83.36,-207.56],[-136.76,-201.62,-299.18],[-115.4,-270.52,-265.83],[0.22,139.89,285.12],[-327.16,121.48,158.1],[18.98,-94.41,-248.53],[-289.52,60.06,144.76],[-30.66,107.46,332.77],[75.96,85.46,428.15],[71.52,220.21,328.49],[-275.38,100.4,196.9],[193.12,-68.48,286.09],[64.31,111.79,436.95],[160.1,102.23,321.96],[186.69,-45.07,319.49],[138.55,-1.83,35.71],[333.84,-213.89,-126.0],[-174.87,-201.36,74.78],[-328.19,-216.27,149.24],[120.76,56.02,278.53],[75.43,217.99,220.94],[18.97,-115.49,40.88],[-222.47,317.4,249.11],[-148.84,-288.65,245.28],[-96.46,-258.03,307.46],[-88.8,-235.58,-141.11],[-27.82,-4.53,-11.24],[112.7,16 };

function lev(a, b, max) {   // edit distance, giving up once it exceeds max
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;

// ---------- color by topic / year / method / suite ----------

const NCOLORS = 10, GREY = 10, RARE_SUITE_MIN = 5;
function cbSeries(axis) {   // tag values in config order, one colour each; the rest share grey "Other"
  const ax = axis === 'method' ? 'm' : 's', cnt = tg => P.filter(p => p.tg && p.tg[ax].includes(tg)).length;

  if (axis === 'suite') { small = names.filter(tg => cnt(tg) < RARE_SUITE_MIN); names = names.filter(tg => cnt(tg) >= RARE_SUITE_MIN); }

function trendSeries() {

    apply: () => { S.on = new Set([k]); renderLegend(); } })).filter(s => P.some(s.match));
  const axis = TR.by, { names, small, neutral, slot, ax } = CB[axis];   // same colours and "Other" as Color by
  const s = [...names, ...neutral].map(tg => ({ label: tg, color: `var(--t${slot(tg)})`, match: p => !!(p.tg && p.tg[ax].includes(tg)),
    apply: () => { S.tag[ax] = tg; $('f-' + axis).value = tg; } }));
  if (small.length) s.push({ label: 'Other (' + small.join(', ') + ')', color: 'var(--t10)',

}
function renderTrends() {

  const nowY = +String(D.fetched).slice(0, 4);
  const cnt = yrs.map(y => series.map(s => P.filter(p => pOn[p.i] && p.y === y && s.match(p)).length));
  const tot = yrs.map(y => P.filter(p => pOn[p.i] && p.y === y).length);
  const ww = Math.max(320, wrap.clientWidth - 40), hh = Math.max(220, Math.min(420, wrap.clientHeight - 190));
  const ml = 40, mr = 8, mt = 22, mb = 26, iw = ww - ml - mr, ih = hh - mt - mb;
  // Share: each segment as a fraction of its year's segments (for topics that is the year's papers)
  const sums = cnt.map(r => r.reduce((a, b) => a + b, 0)), val = (yi, si) => TR.share ? (sums[yi] ? cnt[yi][si] / sums[yi] : 0) : cnt[yi][si];
  const maxV = TR.share ? 1 : Math.max(1, ...sums);
  const step = TR.share ? 0.25 : [1, 2, 5, 10, 20, 25, 50, 100].find(s => maxV / s <= 6) || 200, top = TR.share ? 1 : Math.ceil(maxV / step) * step;
  const yS = v => mt + ih - v / top * ih, band = iw / Math.max(1, yrs.length), bw = Math.min(64, band * 0.62);

  let bars = '';

      bars += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1, y0 - y1 - 2)}" rx="2" fill="${s.color}" data-y="${y}" data-s="${si}" data-v="${cnt[yi][si]}" data-pct="${sums[yi] ? Math.round(100 * cnt[yi][si] / sums[yi]) : 0}" class="tseg${partial}"/>`;
    });
    bars += `<text x="${x + bw / 2}" y="${yS(acc) - 6}" text-anchor="middle" class="ttot">${tot[yi]}</text>`;
    bars += `<text x="${x + bw / 2}" y="${hh - 8}" text-anchor="middle" class="tax">${y}${y === nowY ? ' (to date)' : ''}</text>`;
  });
  const opts = ['topic', 'method', 'suite'].map(b => `<button type="button" data-by="${b}" aria-pressed="${TR.by === b}">${b[0].toUpperCase() + b.slice(1)}</button>`).join('');
  const modes = [['0', 'Counts'], ['1', 'Share']].map(([v, l]) => `<button type="button" data-share="${v}" aria-pressed="${TR.share === (v === '1')}">${l}</button>`).join('');
  // the legend lists the series top to bottom, as they are stacked

    return n ? `<span class="tleg"><i style="background:${s.color}"></i>${esc(s.label)} <span class="n">${n}</span></span>` : ''; }).join('');
  wrap.innerHTML = `<div class="trhead"><h3>Papers per year${TR.share ? ' (share)' : ''}</h3><div class="trbtns"><div class="dimtoggle" role="group" aria-label="Counts or share">${modes}</div><div class="dimtoggle" role="group" aria-label="Split by">${opts}</div></div></div>
    <svg width="${ww}" height="${hh}" viewBox="0 0 ${ww} ${hh}" role="img" aria-label="Stacked bar chart of papers per year by ${TR.by}">${g}${bars}</svg>
    <div class="tlegend">${legend}</div>
    <p class="tnote">Numbers above the bars count papers${TR.by !== 'topic' ? `; a paper with several ${TR.by === 'method' ? 'methods' : 'suites'} appears in each of its segments` : ''}. ${yrs.includes(nowY) ? nowY + ' is partial (data as of ' + D.fetched + '). ' : ''}Click a segment to list those papers.</p>`;
  wrap._series = series;
}

// ---------- export the papers currently shown ----------
function shownPapers() { return P.filter(p => pOn[p.i]).sort((a, b) => b.d.localeCompare(a.d)); }
function bibtex(list) {
  const used = new Set();
  const tex = s => String(s).replace(/([&%$#_])/g, '\\$1').replace(/\^/g, '\\textasciicircum{}').replace(/~/g, '\\textasciitilde{}');
  const lastFirst = n => { const w = n.trim().split(/\s+/); return w.length < 2 ? n : `${w[w.length - 1]}, ${w.slice(0, -1).join(' ')}`; };
  return list.map(p => {
    const first = p.au.length ? AU[p.au[0]].name.trim().split(/\s+/).pop() : 'anon';
    const word = (p.t.match(/[A-Za-z]{3,}/) || ['paper'])[0];
    let key = (first.normalize('NFKD').replace(/[^A-Za-z]/g, '') || 'anon') + p.y + word.toLowerCase(), k = key, n = 1;
    while (used.has(k)) k = key + String.fromCharCode(96 + n++);
    used.add(k);
    const ax = /^\d{4}\.\d{4,5}$/.test(p.id) ? p.id : '';
    const journal = p.v && !/arxiv/i.test(p.v) ? p.v : '';
    const f = [['title', `{${/[\\$]/.test(p.tRaw) ? p.tRaw.replace(/(^|[^\\])([&%#])/g, '$1\\$2') : tex(p.t)}}`], ['author', p.au.map(a => tex(lastFirst(AU[a].name))).join(' and ')], ['year', p.y],
      journal && ['journal', tex(journal)], p.doi && ['doi', p.doi], ax && ['eprint', ax], ax && ['archivePrefix', 'arXiv'],
      p.bib && ['adsurl', `https://ui.adsabs.harvard.edu/abs/${p.bib}`], ['url', p.url || (ax ? `https://arxiv.org/abs/${ax}` : '')]]
      .filter(x => x && x[1] !== '' && x[1] !== undefined);
    return `@${journal ? 'article' : 'misc'}{${k},\n` + f.map(([a, b]) => `  ${a} = {${b}}`).join(',\n') + '\n}';
  }).join('\n\n') + '\n';
}
function csv(list) {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['title', 'authors', 'year', 'date', 'topic', 'suites', 'data', 'methods', 'citations', 'citation_source', `cited_in_${NAME.toLowerCase()}`, 'arxiv', 'doi', 'ads_bibcode', 'url'];
  const rows = list.map(p => [p.t, p.au.map(a => AU[a].name).join('; '), p.y, p.d, TOP[p.k], p.tg ? p.tg.s.join('; ') : '', p.tg ? p.tg.d.join('; ') : '',
    p.tg ? p.tg.m.join('; ') : '', p.cs === 2 ? '' : p.c, ['ADS', 'Semantic Scholar', 'unknown'][p.cs], p.citers.length,
    /^\d{4}\.\d{4,5}$/.test(p.id) ? p.id : '', p.doi || '', p.bib || '', p.url || '']);
  return [head, ...rows].map(r => r.map(q).join(',')).join('\n') + '\n';
}

}

// ---------- play history: papers appear one by one in date order ----------
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const sortKey = p => p.d.length >= 7 ? p.d.slice(0, 10) : p.d.slice(0, 4) + '-07';   // year-only dates go mid-year
const playOrder = P.slice().sort((a, b) => sortKey(a).localeCompare(sortKey(b)) || a.i - b.i);
playOrder.forEach((p, r) => { p.rank = r; });
function stopPlay() {
  if (!PLAY.on) return;
  PLAY.on = false; clearTimeout(PLAY.timer); PLAY.upto = null; PLAY.flash = null;
  $('play').setAttribute('aria-pressed', 'false'); $('play').textContent = '▶'; $('play').title = 'Play the history: papers appear one by one in date order'; $('playyear').hidden = true;
  refresh();
}
function startPlay() {
  if (FLAT[S.view]) setView('topics', false);
  PLAY.on = true;
  $('play').setAttribute('aria-pressed', 'true'); $('play').textContent = '■'; $('play').title = 'Stop';
  // only the papers that pass the current filters take part, in date order
  PLAY.upto = Infinity; applyFilters();
  const seq = playOrder.filter(p => pOn[p.i]);
  PLAY.upto = -1;
  const dt = Math.max(40, Math.min(250, PLAY.total / Math.max(1, seq.length)));
  let i = 0;
  const step = () => {
    if (!PLAY.on) return;
    if (i >= seq.length) { PLAY.flash = null; draw(); PLAY.timer = setTimeout(() => stopPlay(), 1500); return; }
    const p = seq[i];
    PLAY.upto = p.rank; PLAY.flash = p.i; refresh();
    const k = sortKey(p), py = $('playyear');
    py.innerHTML = `${p.d.length >= 7 ? MON[+k.slice(5, 7) - 1] + ' ' : ''}${k.slice(0, 4)}<small>${i + 1} of ${seq.length} papers</small>`;
    py.hidden = false;
    i++; PLAY.timer = setTimeout(step, dt);
  };
  step();
}
$('play').addEventListener('click', e => { e.stopPropagation(); if (!PLAY.on) track('atlas_play', { view: S.view }); PLAY.on ? stopPlay() : startPlay(); });

// On the public site the address holds the view, the selected paper/author, the filters and 2D/3D,
// e.g. #citations&paper=2201.02202&years=2022-2024.
let applying = false, viewInit = false;
function stateHash() {
  const q = new URLSearchParams();
  if (S.sel) { if (S.sel.kind === 'p') q.set('paper', P[S.sel.i].id); else q.set('author', AU[S.sel.i].name); }
  if (S.q.trim()) q.set('q', S.q.trim());
  if (S.y0 !== years[0] || S.y1 !== years[years.length - 1]) q.set('years', S.y0 + '-' + S.y1);
  if (S.on.size !== TOP.length) q.set('topics', [...S.on].sort((a, b) => a - b).join('.'));
  if (S.tag.s) q.set('suite', S.tag.s);
  if (S.tag.d) q.set('data', S.tag.d);
  if (S.tag.m) q.set('method', S.tag.m);
  if (S.dim === 3) q.set('dim', '3');
  if (!S.selfc) q.set('self', '0');
  if (S.newOnly) q.set('new', '1');
  if (S.colorBy !== 'topic') q.set('color', S.colorBy);
  const s = q.toString();
  return '#' + S.view + (s ? '&' + s : '');
}
function writeHash(push) {   // push: add a history entry (selections), else replace (filters, view)
  if (applying || PLAY.on) return;
  const h = stateHash();
  if (location.hash === h) return;
  try { if (push) history.pushState(null, '', h); else history.replaceState(null, '', h); lastHash = location.hash; } catch (e) {}
}
function applyHash() {
  lastHash = location.hash;
  stopPlay();   // another shared link, or Back/Forward
  const amp = location.hash.indexOf('&');
  const raw = amp < 0 ? location.hash.slice(1) : location.hash.slice(1, amp);
  const v = VIEWS.includes(raw) ? raw : 'topics';
  const q = new URLSearchParams(amp < 0 ? '' : location.hash.slice(amp + 1));
  applying = true;
  try {
    {
      S.q = q.get('q') || ''; $('q').value = S.q;
      const yr = (q.get('years') || '').split('-').map(Number);
      S.y0 = years.includes(yr[0]) ? yr[0] : years[0];
      S.y1 = years.includes(yr[1]) ? yr[1] : years[years.length - 1];
      if (S.y0 > S.y1) [S.y0, S.y1] = [S.y1, S.y0];   // years=2025-2020 means 2020-2025
      $('y0').value = S.y0; $('y1').value = S.y1;
      S.newOnly = q.get('new') === '1';
      S.colorBy = ['year', 'method', 'suite'].includes(q.get('color')) ? q.get('color') : 'topic'; $('colorby').value = S.colorBy; dispSum();
      S.on = q.get('topics') ? new Set(q.get('topics').split('.').map(Number).filter(k => k >= 0 && k < TOP.length)) : new Set(TOP.map((_, k) => k));
      renderLegend();
      [['suite', 's'], ['data', 'd'], ['method', 'm']].forEach(([a, ax]) => {
        const sel = $('f-' + a); sel.value = q.get(a) || ''; S.tag[ax] = sel.value;   // unknown values fall back to "All"
      });
      const sc = q.get('self') !== '0';
      if (sc !== S.selfc) { $('selfc').checked = sc; $('selfc').dispatchEvent(new Event('change')); }
      setDim(q.get('dim') === '3' ? 3 : 2);
    }
    if (!viewInit || v !== S.view) { viewInit = true; setView(v, false); }
    applyFilters(); updateStats(); renderActive();
    let sel = null;
    if (q.get('paper')) { const p = P.find(x => x.id === q.get('paper')); if (p) sel = { kind: 'p', i: p.i }; }
    if (q.get('author')) { const a = AU.find(x => x.name === q.get('author')); if (a) sel = { kind: 'a', i: a.i }; }
    select(sel);
    if (S.view === 'table') renderTable();
    if (S.view === 'trends') renderTrends();
    if (!S.sel) overview();
    draw();
  } finally { applying = false; }
}
