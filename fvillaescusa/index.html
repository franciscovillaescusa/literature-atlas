 (DM) subhalo mass function (SHMF) in lens galaxies. However, comparing observationally inferred SHMFs to theoretical predictions remains challenging, as the predicted SHMF can vary significantly between galaxies - even within the same cosmological model - due to differences in the properties and environment of individual galaxies. We present a machine learning framework to infer the galaxy-specific predicted SHMF from galaxy images, conditioned on the assumed inverse warm DM particle mass $M^{-1}_{\\rm DM}$. To train the model, we use 1024 high-resolution hydrodynamical zoom-in simulations from the DREAMS suite. Mock observations are generated using Synthesizer, excluding gas particle contributions, and SHMFs are computed with the Rockstar halo finder. Our neural network takes as input both the galaxy images and the inverse DM mass. This method enables scalable, image-based predictions for the theoretical DM SHMFs of individual galaxies, facilitating direct comparisons with observational measurements.","abx":0,"nw":0,"d":"2025-10-16","dq":0,"y":2025,"au":[168,1744,1068,918,372,1331,633,1836],"c":2,"cs":0,"bib":"2025mla..confE...1F","v":"","lk":"arXiv:2510.14766","url":"https://arxiv.org/abs/2510.14766","doi":"","tg":{"s":["DREAMS"],"d":["Dark matter & modified gravity","Galaxies & baryonic feedback"],"m":["CNN"],"u":["CNN"]},"x":0.2132,"yy":0.4306,"p3":[0.2159,0.5177,0.1866],"sim":{"k":"e","l":[[56,0.952],[66,0.946],[64,0.945],[85,0.944],[154,0.937]]},"c3":[-24.01,-139.37,235.35],"c2":[268.4,-2.11],"k":6,"r":[64],"rm":0},{"id":"2510.05037","t":"On the sensitivity of different galaxy properties to warm dark matter","ab":"We study the impact of warm dark matter (WDM) particle mass on galaxy properties using 1,024 state-of-the-art cosmological hydrodynamical simulations from the DREAMS project. We begin by using a Multilayer Perceptron (MLP) coupled with a normalizing flow to explore global statistical descriptors of galaxy populations, such as the mean, standard deviation, and histograms of 14 galaxy properties. We find that subhalo gas mass is the most informative feature for constraining the WDM mass, achieving a determination coefficient of R^2 = 0.9. We employ symbolic regression to extract simple, interpretable relations with the WDM particle mass. Finally, we adopt a more localized approach by selecting individual dark matter halos and using a Graph Neural Network (GNN) with a normalizing flow to infer the WDM mass, incorporating subhalo properties as node features and global simulation statistics as graph-level features. The GNN approach yields only a residual improvement over MLP models based solely on global features, indicating that most of the predictive power resides in the global descriptors, with only marginal gains from halo-level information.","abx":0,"nw":0,"d":"2025-10-06","dq":0,"y":2025,"au":[246,265,633,146,918,1243,1440,201,1814,786],"c":4,"cs":0,"bib":"2025ApJ...994...62C","v":"Astrophysical Journal","lk":"arXiv:2510.05037","url":"https://arxiv.org/abs/2510.05037","doi":"10.3847/1538-4357/ae0e6c","tg":{"s":["DREAMS"],"d":["Dark matter & modified gravity","Galaxies & baryonic feedback"],"m":["Graph neural networks","Simulation-based inference","Normalizing flows","Emulators & regression ML","Symbolic regression"],"u":["Simulation-based inference"]},"x":0.072,"yy":0.4979,"p3":[0.0877,0.1449,0.5053],"sim":{"k":"e","l":[[70,0.955],[64,0.948],[98,0.946],[89,0.945],[125,0.941]]},"c3":[68.3,-82.43,171.07],"c2":[130.6,-149.53],"k":7,"r":[64,70,77,85,86,89,99,108,115,118,120,141],"rm":0},{"id":"2509.02661","t":"The Future of Artificial Intelligence and the Mathematical and Physical Sciences (AI+MPS)","ab":"This community paper developed out of the NSF Workshop on the Future of Artificial Intelligence (AI) and the Mathematical and Physics Sciences (MPS), which was held in March 2025 with the goal of understanding how the MPS domains (Astronomy, Chemistry, Materials Research, Mathematical Sciences, and Physics) can best capitalize on, and contribute to, the future of AI. We present here a summary and snapshot of the MPS community's perspective, as of Spring/Summer 2025, in a rapidly developing field. The link between AI and MPS is becoming increasingly inextricable; now is a crucial moment to strengthen the link between AI and Science by pursuing a strategy that proactively and thoughtfully leverages the potential of AI for scientific discovery and optimizes opportunities to impact the development of AI by applying concepts from fundamental science. To achieve this, we propose activities and strategic priorities that: (1) enable AI+MPS research in both directions; (2) build up an interdisciplinary community of AI+MPS researchers; and (3) foster education and workforce development in AI for MPS researchers and students. We conclude with a summary of suggested priorities for funding agencies, educational institutions, and individual researchers to help position the MPS community to be a leader in, and take full advantage of, the transformative potential of AI+MPS.","abx":0,"nw":0,"d":"2025-09-02","dq":0,"y":2025,"au":[74,1241,1062,902,1845,1455,1666,513,898,1658,348,986,548,198,261,920,392,173,634,1656,385,393,396,550,1088,1332,358,1528,1515,703,1669,1638,938,1628,912,268,1451,1286,536,758,1644,1326,1353,755,137,899,1833,1273,860,269,185,1252,935,1521,1841,1449,1684,1789,1784,542,1435,1447,272,895,1675,538,1652,382,1453,359,1452,712,270,1753,455,697,466,557,1724,1732,384,1679,1687,1523,633,716,251,1514,1265,1527,1680,1352,1278,1858,1834,260,1650,186,760,1741],"c":6,"cs":0,"bib":"2026MLS&T...7b3001F","v":"Machine Learning: Science and Technology","lk":"arXiv:2509.02661","url":"https://arxiv.org/abs/2509.02661","doi":"10.1088/2632-2153/ae3e4e","tg":{"s":["No simulations"],"d":["Surveys & instruments","AI for science"],"m":["Other ML"],"u":["Surveys & instruments","Other ML"]},"x":0.4984,"yy":0.9722,"p3":[0.5068,-0.4647,0.4291],"sim":{"k":"e","l":[[24,0.953],[4,0.935],[8,0.916],[31,0.913],[112,0.913]]},"c3":[12.9,-282.12,56.39],"c2":[30.19,-300.23],"k":0,"r":[],"rm":1},{"id":"2509.01881","t":"One latent to fit them all: a unified representation of baryonic feedback on matter distribution","ab":"Accurate and parsimonious quantification of baryonic feedback on matter distribution is of crucial importance for understanding both cosmology and galaxy formation from observational data. This is, however, challenging given the large discrepancy among different models of galaxy formation simulations, and their distinct subgrid physics parameterizations. Using 5,072 simulations from 4 different models covering broad ranges in their parameter spaces, we find a unified 2D latent representation. Compared to the simulations and other phenomenological models, our representation is independent of both time and cosmology, much lower-dimensional, and disentangled in its impacts on the matter power spectra. The common latent space facilitates the comparison of parameter spaces of different models and is readily interpretable by correlation with each. The two latent dimensions provide a complementary representation of baryonic effects, linking black hole and supernova feedback to distinct and interpretable impacts on both the matter power spectrum, and field, level. Our approach enables developing robust and economical analytic models for optimal gain of physical information from data, and is generalizable to other fields with significant modeling uncertainty.","abx":0,"nw":0,"d":"2025-09-02","dq":0,"y":2025,"au":[1649,1839,1651,633,262,1803,1832],"c":6,"cs":0,"bib":"2026ApJ...996L..41L","v":"Astrophysical Journal Letters","lk":"arXiv:2509.01881","url":"https://arxiv.org/abs/2509.01881","doi":"10.3847/2041-8213/ae3084","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Other ML"],"u":["Other simulations","Other ML"],"n":"5,072 sims from 4 galaxy-formation models, very likely CAMELS but not named"},"x":0.0786,"yy":0.028,"p3":[-0.2653,-0.0175,0.3303],"sim":{"k":"e","l":[[14,0.938],[84,0.932],[82,0.93],[18,0.928],[153,0.928]]},"c3":[13.12,133.53,186.88],"c2":[228.66,90.72],"k":4,"r":[66,71,87,141],"rm":0},{"id":"2508.21152","t":"How does feedback affect the star formation histories of galaxies?","ab":"Star formation in galaxies is regulated by the interplay of a range of processes that shape the multiphase gas in the interstellar and circumgalactic media. Using the CAMELS suite of cosmological simulations, we study the effects of varying feedback and cosmology on the average star formation histories (SFHs) of galaxies at $z\\sim0$ across the IllustrisTNG, SIMBA and ASTRID galaxy formation models. We find that galaxy SFHs in all three models are sensitive to changes in stellar feedback, which affects the efficiency of baryon cycling and the rates at which central black holes grow, while effects of varying AGN feedback depend on model-dependent implementations of black hole seeding, accretion and feedback. We also find strong interaction terms that couple stellar and AGN feedback, usually by regulating the amount of gas available for the central black hole to accrete. Using a double power-law to describe the average SFHs, we derive a general set of equations relating the shape of the SFHs to physical quantities like baryon fraction and black hole mass across all three models. We find that a single set of equations (albeit with different coefficients) can describe the SFHs across all three CAMELS models, with cosmology dominating the SFH at early times, followed by halo accretion, and feedback and baryon cycling at late times. Galaxy SFHs provide a novel, complementary probe to constrain cosmology and feedback, and can connect the observational constraints from current and upcoming galaxy surveys with the physical mechanisms responsible for regulating galaxy growth and quenching.","abx":0,"nw":0,"d":"2025-08-28","dq":0,"y":2025,"au":[979,1736,713,1513,939,444,1683,1533,208,1651,1685,1061,375,378,266,346,1083,1065,934,1634,1264,633,916],"c":17,"cs":0,"bib":"2025ApJ...994..174I","v":"Astrophysical Journal","lk":"arXiv:2508.21152","url":"https://arxiv.org/abs/2508.21152","doi":"10.3847/1538-4357/ae0334","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Perturbation theory & analytic models","No ML"],"u":["Perturbation theory & analytic models"]},"x":-0.2236,"yy":0.7587,"p3":[-0.752,0.2687,0.2743],"sim":{"k":"e","l":[[52,0.964],[67,0.951],[16,0.95],[48,0.945],[50,0.945]]},"c3":[66.96,109.63,180.94],"c2":[211.49,2.12],"k":5,"r":[48,50,52,81,82,87,90,91,92,94,111,114,118,123,141],"rm":0},{"id":"2508.05728","t":"CLAPP: The CLASS LLM Agent for Pair Programming","ab":"We introduce CLAPP (CLASS LLM Agent for Pair Programming), an interactive AI assistant designed to support researchers working with the Einstein-Boltzmann solver CLASS. CLAPP leverages large language models (LLMs) and domain-specific retrieval to provide conversational coding support for CLASS-answering questions, generating code, debugging errors, and producing plots. Its architecture combines multi-agent LLM orchestration, semantic search across CLASS documentation, and a live Python execution environment. Deployed as a user-friendly web application, CLAPP lowers the entry barrier for scientists unfamiliar with AI tools and enables more productive human-AI collaboration in computational and numerical cosmology. The app is available at https://classclapp.streamlit.app","abx":0,"nw":0,"d":"2025-08-07","dq":0,"y":2025,"au":[1635,374,267,633,944],"c":6,"cs":0,"bib":"2025arXiv250805728C","v":"arXiv.org","lk":"arXiv:2508.05728","url":"https://arxiv.org/abs/2508.05728","doi":"10.48550/arXiv.2508.05728","tg":{"s":["No simulations"],"d":["AI for science"],"m":["LLM agents"],"u":[]},"x":0.448,"yy":0.8977,"p3":[0.512,-0.5687,0.4736],"sim":{"k":"e","l":[[33,0.942],[4,0.924],[24,0.923],[34,0.919],[28,0.913]]},"c3":[-68.85,-241.96,15.7],"c2":[-41.59,-255.35],"k":0,"r":[33],"rm":1},{"id":"2508.01855","t":"$\\texttt{GENGARS}$: Accurate non-Gaussian initial conditions with arbitrary bispectrum for N-body simulations","ab":"Primordial non-Gaussianity is predicted by various inflationary models, and N-body simulations are a crucial tool for studying its imprints on large-scale structure. In this work, we present \\texttt{GENGARS} ( GEnerator of Non-Gaussian ARbitrary Shapes), a framework for generating accurate non-Gaussian initial conditions for N-body simulations. It builds upon the formulation introduced by Wagner \\& Verde (2012), enabling to generate a primordial gravitational potential with a desired separable bispectrum $B_Φ(k_1,k_2,k_3)$. For the local, equilateral and orthogonal non-Gaussian templates, we benchmark our method against the well-established \\texttt{2LPT-PNG} code. We show that \\texttt{GENGARS} achieves improved accuracy and lower noise by suppressing spurious contributions to the primordial power spectrum. This paper aims at presenting the method, quantifying its performance and illustrating the benefits and applicable use cases over existing approaches.","abx":0,"nw":0,"d":"2025-08-03","dq":0,"y":2025,"au":[541,1076,1230,1806,633,251],"c":6,"cs":0,"bib":"2026JCAP...08..020F","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2508.01855","url":"https://arxiv.org/abs/2508.01855","doi":"10.1088/1475-7516/2026/08/020","tg":{"s":["Other simulations"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["No ML"],"u":[]},"x":0.0061,"yy":-0.5819,"p3":[-0.0198,-0.7348,0.0505],"sim":{"k":"e","l":[[96,0.946],[148,0.942],[68,0.942],[105,0.941],[106,0.938]]},"c3":[-221.87,68.31,-5.62],"c2":[-180.28,164.21],"k":4,"r":[59,68,84,101,106,158],"rm":0},{"id":"2507.07257","t":"Open Source Planning & Control System with Language Agents for Autonomous Scientific Discovery","ab":"We present a multi-agent system for automation of scientific research tasks, cmbagent (https://github.com/CMBAgents/cmbagent). The system is formed by about 30 Large Language Model (LLM) agents and implements a Planning & Control strategy to orchestrate the agentic workflow, with no human-in-the-loop at any point. Each agent specializes in a different task (performing retrieval on scientific papers and codebases, writing code, interpreting results, critiquing the output of other agents) and the system is able to execute code locally. We successfully apply cmbagent to carry out a PhD level cosmology task (the measurement of cosmological parameters using supernova data) and evaluate its performance on two benchmark sets, finding superior performance over state-of-the-art LLMs. The source code is available on GitHub, demonstration videos are also available, and the system is deployed on HuggingFace and will be available on the cloud.","abx":0,"nw":0,"d":"2025-07-09","dq":0,"y":2025,"au":[1077,1281,192,1863,1434,1635,374,366,1750,134,360,1280,133,890,976,1689,175,944,195,1731,263,997,633,367,1816,267],"c":15,"cs":0,"bib":"2025arXiv250707257X","v":"arXiv.org","lk":"arXiv:2507.07257","url":"https://arxiv.org/abs/2507.07257","doi":"10.48550/arXiv.2507.07257","tg":{"s":["No simulations"],"d":["AI for science"],"m":["LLM agents"],"u":[]},"x":0.4413,"yy":0.9293,"p3":[0.41,-0.6484,0.549],"sim":{"k":"e","l":[[31,0.942],[24,0.941],[4,0.933],[9,0.921],[0,0.917]]},"c3":[-83.08,-172.17,24.23],"c2":[-46.48,-188.7],"k":0,"r":[39,57,151],"rm":0},{"id":"2507.07155","t":"Evaluating Retrieval-Augmented Generation Agents for Autonomous Scientific Discovery in Astrophysics","ab":"We evaluate 9 Retrieval Augmented Generation (RAG) agent configurations on 105 Cosmology Question-Answer (QA) pairs that we built specifically for this purpose.The RAG configurations are manually evaluated by a human expert, that is, a total of 945 generated answers were assessed. We find that currently the best RAG agent configuration is with OpenAI embedding and generative model, yielding 91.4\\% accuracy. Using our human evaluation results we calibrate LLM-as-a-Judge (LLMaaJ) system which can be used as a robust proxy for human evaluation. These results allow us to systematically select the best RAG agent configuration for multi-agent system for autonomous scientific discovery in astrophysics (e.g., cmbagent presented in a companion paper) and provide us with an LLMaaJ system that can be scaled to thousands of cosmology QA pairs. We make our QA dataset, human evaluation results, RAG pipelines, and LLMaaJ system publicly available for further use by the astrophysics community.","abx":0,"nw":0,"d":"2025-07-09","dq":0,"y":2025,"au":[1816,267,133,175,633,1077,1863],"c":3,"cs":0,"bib":"2025arXiv250707155X","v":"arXiv.org","lk":"arXiv:2507.07155","url":"https://arxiv.org/abs/2507.07155","doi":"10.48550/arXiv.2507.07155","tg":{"s":["No simulations"],"d":["AI for science"],"m":["LLM agents"],"u":[]},"x":0.3932,"yy":0.8769,"p3":[0.5428,-0.3939,0.4768],"sim":{"k":"e","l":[[8,0.922],[24,0.921],[31,0.919],[5,0.912],[33,0.911]]},"c3":[84.07,88.4,50.67],"c2":[107.41,-106.71],"k":0,"r":[115,141],"rm":0},{"id":"2507.03707","t":"CosmoBench: A Multiscale, Multiview, Multitask Cosmology Benchmark for Geometric Deep Learning","ab":"Cosmological simulations provide a wealth of data in the form of point clouds and directed trees. A crucial goal is to extract insights from this data that shed light on the nature and composition of the Universe. In this paper we introduce CosmoBench, a benchmark dataset curated from state-of-the-art cosmological simulations whose runs required more than 41 million core-hours and generated over two petabytes of data. CosmoBench is the largest dataset of its kind: it contains 34 thousand point clouds from simulations of dark matter halos and galaxies at three different length scales, as well as 25 thousand directed trees that record the formation history of halos on two different time scales. The data in CosmoBench can be used for multiple tasks -- to predict cosmological parameters from point clouds and merger trees, to predict the velocities of individual halos and galaxies from their collective positions, and to reconstruct merger trees on finer time scales from those on coarser time scales. We provide several baselines on these tasks, some based on established approaches from cosmological modeling and others rooted in machine learning. For the latter, we study different approaches -- from simple linear models that are minimally constrained by symmetries to much larger and more computationally-demanding models in deep learning, such as graph neural networks. We find that least-squares fits with a handful of invariant features sometimes outperform deep architectures with many more parameters and far longer training time. Still there remains tremendous potential to improve these baselines by combining machine learning and cosmology to fully exploit the data. CosmoBench sets the stage for bridging cosmology and geometric deep learning at scale. We invite the community to push the frontier of scientific discovery by engaging with this dataset, available at https://cosmobench.streamlit.app","abx":0,"nw":0,"d":"2025-07-04","dq":0,"y":2025,"au":[1333,1525,946,134,364,375,1083,1071,633],"c":12,"cs":0,"bib":"2025arXiv250703707H","v":"Neural Information Processing Systems","lk":"arXiv:2507.03707","url":"https://arxiv.org/abs/2507.03707","doi":"10.48550/arXiv.2507.03707","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback","AI for science"],"m":["Graph neural networks","Emulators & regression ML"],"u":["Other simulations","AI for science"],"n":"Simulations not named in abstract (likely Quijote/CAMELS-SAM); tagged Other simulations per naming rule."},"x":0.0571,"yy":0.3037,"p3":[-0.19,0.2037,0.3885],"sim":{"k":"e","l":[[62,0.942],[111,0.941],[66,0.936],[108,0.936],[36,0.935]]},"c3":[-99.48,52.91,135.31],"c2":[61.12,86.69],"k":6,"r":[36,37,56,62,73,79,90,98,108,111,115,120,129,132,141,158],"rm":0},{"id":"2505.23904","t":"Cosmology with Topological Deep Learning","ab":"The standard cosmological model with cold dark matter posits a hierarchical formation of structures. We introduce topological neural networks (TNNs), implemented as message-passing neural networks on higher-order structures, to effectively capture the topological information inherent in these hierarchies that traditional graph neural networks (GNNs) fail to account for. Our approach not only considers the vertices and edges that comprise a graph but also extends to higher-order cells such as tetrahedra, clusters, and hyperedges. This enables message-passing between these heterogeneous structures within a combinatorial complex. Furthermore, our TNNs are designed to conserve the $E(3)$-invariance, which refers to the symmetry arising from invariance against translations, reflections, and rotations. When applied to the Quijote suite, our TNNs achieve a significant reduction in the mean squared error. Compared to our GNNs, which lack higher-order message-passing, ClusterTNNs show improvements of up to 22% in $Ω_{\\rm m}$ and 34% in $σ_8$ jointly, while the best FullTNN achieves an improvement of up to 60% in $σ_8$. In the context of the CAMELS suite, our models yield results comparable to the current GNN benchmark, albeit with a slight decrease in performance. We emphasize that our topology and symmetry-aware neural networks provide enhanced expressive power in modeling the large-scale structures of our universe.","abx":0,"nw":0,"d":"2025-05-29","dq":0,"y":2025,"au":[946,633],"c":9,"cs":0,"bib":"2025ApJ...989...47L","v":"Astrophysical Journal","lk":"arXiv:2505.23904","url":"https://arxiv.org/abs/2505.23904","doi":"10.3847/1538-4357/ade806","tg":{"s":["CAMELS","Quijote"],"d":["Large-scale structure"],"m":["Graph neural networks"],"u":[]},"x":-0.1127,"yy":0.194,"p3":[-0.1232,-0.1708,0.5869],"sim":{"k":"e","l":[[62,0.946],[90,0.944],[108,0.942],[98,0.94],[123,0.935]]},"c3":[-106.55,88.76,98.84],"c2":[-2.81,86.67],"k":7,"r":[62,83,87,90,98,104,106,108,109,118,119,120,132,135,141,148,153],"rm":0},{"id":"2505.13620","t":"Field-Level Comparison and Robustness Analysis of Cosmological N-body Simulations","ab":"We present the first field-level comparison of cosmological N-body simulations, considering various widely used codes: Abacus, CUBEP$^3$M, Enzo, Gadget, Gizmo, PKDGrav, and Ramses. Unlike previous comparisons focused on summary statistics, we conduct a comprehensive field-level analysis: evaluating statistical similarity, quantifying implications for cosmological parameter inference, and identifying the regimes in which simulations are consistent. We begin with a traditional comparison using the power spectrum, cross-correlation coefficient, and visual inspection of the matter field. We follow this with a statistical out-of-distribution (OOD) analysis to quantify distributional differences between simulations, revealing insights not captured by the traditional metrics. We then perform field-level simulation-based inference (SBI) using convolutional neural networks (CNNs), training on one simulation and testing on others, including a full hydrodynamic simulation for comparison. We identify several causes of OOD behavior and biased inference, finding that resolution effects, such as those arising from adaptive mesh refinement (AMR), have a significant impact. Models trained on non-AMR simulations fail catastrophically when evaluated on AMR simulations, introducing larger biases than those from hydrodynamic effects. Differences in resolution, even when using the same N-body code, likewise lead to biased inference. We attribute these failures to a CNN's sensitivity to small-scale fluctuations, particularly in voids and filaments, and demonstrate that appropriate smoothing brings the simulations into statistical agreement. Our findings motivate the need for careful data filtering and the use of field-level OOD metrics, such as PQMass, to ensure robust inference.","abx":0,"nw":0,"d":"2025-05-19","dq":0,"y":2025,"au":[134,633,1631,1530,1073,1068,713,1231,535],"c":19,"cs":0,"bib":"2025ApJ...989..207B","v":"Astrophysical Journal","lk":"arXiv:2505.13620","url":"https://arxiv.org/abs/2505.13620","doi":"10.3847/1538-4357/adef4e","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["CNN","Simulation-based inference","Other ML"],"u":[]},"x":0.2281,"yy":0.0694,"p3":[-0.105,0.1771,0.3757],"sim":{"k":"e","l":[[18,0.945],[95,0.944],[86,0.943],[6,0.943],[108,0.943]]},"c3":[-42.69,-27.2,132.43],"c2":[75.44,29.33],"k":7,"r":[38,46,98,118,123,125,141],"rm":0},{"id":"2504.17839","t":"Interpreting Cosmological Information from Neural Networks in the Hydrodynamic Universe","ab":"What happens when a black box (neural network) meets a black box (simulation of the Universe)? Recent work has shown that convolutional neural networks (CNNs) can infer cosmological parameters from the matter density field in the presence of complex baryonic processes. A key question that arises is, which parts of the cosmic web is the neural network obtaining information from? We shed light on the matter by identifying the Fourier scales, density scales, and morphological features of the cosmic web that CNNs pay most attention to. We find that CNNs extract cosmological information from both high and low density regions: overdense regions provide the most information per pixel, while underdense regions -- particularly deep voids and their surroundings -- contribute significantly due to their large spatial extent and coherent spatial features. Remarkably, we demonstrate that there is negligible degradation in cosmological constraining power after aggressive cutting in both maximum Fourier scale and density. Furthermore, we find similar results when considering both hydrodynamic and gravity-only simulations, implying that neural networks can marginalize over baryonic effects with minimal loss in cosmological constraining power. Our findings point to practical strategies for optimal and robust field-level cosmological inference in the presence of uncertainly modeled astrophysics.","abx":0,"nw":0,"d":"2025-04-24","dq":0,"y":2025,"au":[200,134,633],"c":8,"cs":0,"bib":"2025ApJ...994..129L","v":"Astrophysical Journal","lk":"arXiv:2504.17839","url":"https://arxiv.org/abs/2504.17839","doi":"10.3847/1538-4357/ae0b5a","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["CNN","Other ML"],"u":["CAMELS"]},"x":-0.0006,"yy":-0.1001,"p3":[0.2624,-0.2697,0.3013],"sim":{"k":"e","l":[[139,0.954],[166,0.948],[124,0.947],[125,0.945],[108,0.943]]},"c3":[-43.64,19.93,53.06],"c2":[-17.03,14.93],"k":6,"r":[123,125,129,132,141],"rm":0},{"id":"2504.06919","t":"Correcting for interloper contamination in the power spectrum with neural networks","ab":"Modern slitless spectroscopic surveys, such as Euclid and the Roman Space Telescope, collect vast numbers of galaxy spectra but suffer from low signal-to-noise ratios. This often leads to incorrect redshift assignments when relying on a single emission line, due to noise spikes or contamination from non-target emission lines, commonly referred to as redshift interlopers. We propose a machine learning approach to correct the impact of interlopers at the level of measured summary statistics, focusing on the power spectrum monopole and line interlopers as a proof of concept. To model interloper effects, we use halo catalogs from the Quijote simulations as proxies for galaxies, displacing a fraction of halos by the distance corresponding to the redshift offset between target and interloper galaxies. This yields contaminated catalogs with varying interloper fractions across a wide range of cosmologies from the Quijote suite. We train a neural network on the power spectrum monopole, alone or combined with the bispectrum monopole, from contaminated mocks to estimate the interloper fraction and reconstruct the cleaned power spectrum. We evaluate performance in two settings: one with fixed cosmology and another where cosmological parameters vary under broad priors. In the fixed case, the network recovers the interloper fraction and corrects the power spectrum to better than 1% accuracy. When cosmology varies, performance degrades, but adding bispectrum information significantly improves results, reducing the interloper fraction error by 40-60%. We also study the method's performance as a function of the size of the training set and find that optimal strategies depend on the correlation between target and interloper samples: bispectrum information aids performance when target and interloper galaxies are uncorrelated, while tighter priors are more effective when the two are strongly correlated.","abx":0,"nw":0,"d":"2025-04-09","dq":0,"y":2025,"au":[1238,209,633],"c":6,"cs":0,"bib":"2025ApJ...991...48C","v":"Astrophysical Journal","lk":"arXiv:2504.06919","url":"https://arxiv.org/abs/2504.06919","doi":"10.3847/1538-4357/adf72a","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Emulators & regression ML"],"u":[]},"x":-0.0489,"yy":-0.015,"p3":[-0.2783,-0.3914,0.0633],"sim":{"k":"e","l":[[111,0.94],[135,0.933],[101,0.932],[68,0.932],[158,0.932]]},"c3":[-106.85,-57.37,53.67],"c2":[-39.5,-65.74],"k":6,"r":[41,61,79,123,157,158],"rm":0},{"id":"2503.22654","t":"On the effects of parameters on galaxy properties in CAMELS and the predictability of $Ω_{\\rm m}$","ab":"Recent analyses of cosmological hydrodynamic simulations from CAMELS have shown that machine learning models can predict the parameter describing the total matter content of the universe, $Ω_{\\rm m}$, from the features of a single galaxy. We investigate the statistical properties of two of these simulation suites, IllustrisTNG and ASTRID, confirming that $Ω_{\\rm m}$ induces a strong displacement on the distribution of galaxy features. We also observe that most other parameters have little to no effect on the distribution, except for the stellar-feedback parameter $A_{SN1}$, which introduces some near-degeneracies that can be broken with specific features. These two properties explain the predictability of $Ω_{\\rm m}$. We use Optimal Transport to further measure the effect of parameters on the distribution of galaxy properties, which is found to be consistent with physical expectations. However, we observe discrepancies between the two simulation suites, both in the effect of $Ω_{\\rm m}$ on the galaxy properties and in the distributions themselves at identical parameter values. Thus, although $Ω_{\\rm m}$'s signature can be easily detected within a given simulation suite using just a single galaxy, applying this result to real observational data may prove significantly more challenging.","abx":0,"nw":0,"d":"2025-03-28","dq":0,"y":2025,"au":[694,1529,1637,457,633],"c":2,"cs":0,"bib":"2025ApJ...988...54C","v":"Astrophysical Journal","lk":"arXiv:2503.22654","url":"https://arxiv.org/abs/2503.22654","doi":"10.3847/1538-4357/addd08","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Other ML"],"u":["Other ML"],"n":"ML for Omega_m is prior work; this paper uses optimal transport/statistics"},"x":-0.2407,"yy":0.4654,"p3":[0.1381,0.3515,0.6344],"sim":{"k":"e","l":[[141,0.949],[6,0.948],[115,0.948],[87,0.947],[77,0.946]]},"c3":[137.32,78.57,103.19],"c2":[210.13,-80.73],"k":7,"r":[43,48,76,77,86,87,115,118,141],"rm":0},{"id":"2503.13755","t":"How many simulations do we need for simulation-based inference in cosmology?","ab":"How many simulations do we need to train machine learning methods to extract information available from summary statistics of the cosmological density field? Neural methods have shown the potential to extract non-linear information available from cosmological data. Success depends critically on having sufficient simulations for training the networks and appropriate network architectures. In the first detailed convergence study of neural network training for cosmological inference, we show that currently available simulation suites, such as the Quijote Latin Hypercube(LH) with 2000 simulations, do not provide sufficient training data for a generic neural network to reach the optimal regime, even for the dark matter power spectrum, and in an idealized case. We discover an empirical neural scaling law that predicts how much information a neural network can extract from a highly informative summary statistic, the dark matter power spectrum, as a function of the number of simulations used to train the network, for a wide range of architectures and hyperparameters. We combine this result with the Cramer-Rao information bound to forecast the number of training simulations needed for near-optimal information extraction. To verify our method we created the largest publicly released simulation data set in cosmology, the Big Sobol Sequence(BSQ), consisting of 32,768 $Λ$CDM n-body simulations uniformly covering the $Λ$CDM parameter space. Our method enables efficient planning of simulation campaigns for machine learning applications in cosmology, while the BSQ dataset provides an unprecedented resource for studying the convergence behavior of neural networks in cosmological parameter inference. Our results suggest that new large simulation suites or new training approaches will be necessary to achieve information-optimal parameter inference from non-linear simulations.","abx":0,"nw":0,"d":"2025-03-17","dq":0,"y":2025,"au":[183,251,633],"c":31,"cs":0,"bib":"2025A&A...703A.301B","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2503.13755","url":"https://arxiv.org/abs/2503.13755","doi":"10.1051/0004-6361/202554602","tg":{"s":["Quijote","Other simulations"],"d":["Large-scale structure"],"m":["Simulation-based inference","Emulators & regression ML"],"u":["Emulators & regression ML"]},"x":0.0272,"yy":-0.1654,"p3":[0.0043,-0.1862,0.0515],"sim":{"k":"e","l":[[105,0.947],[139,0.947],[158,0.944],[45,0.943],[134,0.942]]},"c3":[-130.68,45.1,95.13],"c2":[2.12,41.46],"k":6,"r":[109,158],"rm":0},{"id":"2503.01956","t":"Lost in the FoG: Pitfalls of Models for Large-Scale Hydrogen Distributions","ab":"Large-scale HI surveys and their cross-correlations with galaxy distributions have immense potential as cosmological probes. Interpreting these measurements requires theoretical models that must incorporate redshift-space distortions (RSDs), such as the Kaiser and fingers-of-God (FoG) effect, and differences in the tracer and matter distributions via the tracer bias. These effects are commonly approximated with assumptions that should be tested on simulated distributions. In this work, we use the hydrodynamical simulation suite IllustrisTNG to assess the performance of models of $z \\leq 1$ HI auto and HI-galaxy cross-power spectra, finding that the models employed by recent observations introduce errors comparable to or exceeding their measurement uncertainties. In particular, neglecting FoG causes $\\gtrsim 10\\%$ deviations between the modeled and simulated power spectra at $k \\gtrsim 0.1$ $h$ / Mpc, larger than assuming a constant bias which reaches the same error threshold at slightly smaller scales. However, even without these assumptions, models can still err by $\\sim 10\\%$ on relevant scales. These remaining errors arise from multiple RSD damping sources on HI clustering, which are not sufficiently described with a single FoG term. Overall, our results highlight the need for an improved understanding of RSDs to harness the capabilities of future measurements of HI distributions.","abx":0,"nw":0,"d":"2025-03-03","dq":0,"y":2025,"au":[345,248,633],"c":5,"cs":0,"bib":"2025ApJ...994..171O","v":"Astrophysical Journal","lk":"arXiv:2503.01956","url":"https://arxiv.org/abs/2503.01956","doi":"10.3847/1538-4357/ae0e69","tg":{"s":["Other simulations"],"d":["Large-scale structure","Neutral hydrogen & 21cm"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.6213,"yy":-0.1109,"p3":[-0.0406,0.574,-0.0005],"sim":{"k":"e","l":[[6,0.94],[175,0.94],[198,0.939],[66,0.938],[74,0.938]]},"c3":[206.61,10.64,-102.43],"c2":[124.26,229.71],"k":2,"r":[51,74,165,176,180,189,193],"rm":0},{"id":"2502.17568","t":"Cosmology with One Galaxy: Auto-Encoding the Galaxy Properties Manifold","ab":"Cosmological simulations like CAMELS and IllustrisTNG characterize hundreds of thousands of galaxies using various internal properties. Previous studies have demonstrated that machine learning can be used to infer the cosmological parameter $Ω_m$ from the internal properties of even a single randomly selected simulated galaxy. This ability was hypothesized to originate from galaxies occupying a low-dimensional manifold within a higher-dimensional galaxy property space, which shifts with variations in $Ω_m$. In this work, we investigate how galaxies occupy the high-dimensional galaxy property space, particularly the effect of $Ω_m$ and other cosmological and astrophysical parameters on the putative manifold. We achieve this by using an autoencoder with an Information-Ordered Bottleneck (IOB), a neural layer with adaptive compression, to perform dimensionality reduction on individual galaxy properties from CAMELS simulations, which are run with various combinations of cosmological and astrophysical parameters. We find that for an autoencoder trained on the fiducial set of parameters, the reconstruction error increases significantly when the test set deviates from fiducial values of $Ω_m$ and $A_{\\text{SN1}}$, indicating that these parameters shift galaxies off the fiducial manifold. In contrast, variations in other parameters such as $σ_8$ cause negligible error changes, suggesting galaxies shift along the manifold. These findings provide direct evidence that the ability to infer $Ω_m$ from individual galaxies is tied to the way $Ω_m$ shifts the manifold. Physically, this implies that parameters like $σ_8$ produce galaxy property changes resembling natural scatter, while parameters like $Ω_m$ and $A_{\\text{SN1}}$ create unsampled properties, extending beyond the natural scatter in the fiducial model.","abx":0,"nw":0,"d":"2025-02-24","dq":0,"y":2025,"au":[158,1651,1225,633,1257],"c":5,"cs":0,"bib":"2025ApJ...986..133L","v":"Astrophysical Journal","lk":"arXiv:2502.17568","url":"https://arxiv.org/abs/2502.17568","doi":"10.3847/1538-4357/add724","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Other ML"],"u":[]},"x":-0.3663,"yy":0.4569,"p3":[0.2583,0.3224,0.6096],"sim":{"k":"e","l":[[115,0.953],[141,0.942],[77,0.942],[10,0.941],[76,0.939]]},"c3":[155.13,55.57,108.94],"c2":[216.5,-112.22],"k":7,"r":[77,86,115,141],"rm":0},{"id":"2502.13589","t":"CASCO: Cosmological and AStrophysical parameters from Cosmological simulations and Observations III. The physics behind the emergence of the golden mass scale","ab":"We investigate the origin and evolution of the \"golden mass\" (halo mass $\\sim10^{12} \\, \\rm M_{\\odot}$, stellar mass $\\sim5 \\times 10^{10} \\, \\rm M_{\\odot}$), linked to peak star formation efficiency, using \\textsc{camels} simulations based on IllustrisTNG. Exploring a range of SN/AGN feedback strengths and cosmologies ($Ω_{\\rm m}, σ_8$), we find a U-shaped relation between dark-to-stellar mass ratio and stellar mass, with a minimum at the golden mass, in line with observations. Cosmology affects the normalization of this relation, while feedback shapes its form and the emergence of the golden mass. Stronger SN feedback lowers its value; AGN feedback, especially radiative efficiency, alters the high-mass slope and shifts the golden mass. The golden mass appears earlier with stronger feedback, which quenches star formation more rapidly. Passive galaxies retain the U-shape; star-forming ones show decreasing dark matter fraction with stellar mass, with possible reversal at low redshift. Global stellar fractions also exhibit a U-shaped trend: in passive galaxies, the golden mass shifts to lower masses or vanishes; in star-forming ones, it emerges only at low redshift. Feedback governs the golden mass up to $z \\sim 1.5-2$, with a secondary role from cold streams and virial shocks. We speculate that at $z \\gtrsim 1.5-2$, a single stream-regulated scale governs galaxy growth, which later bifurcates into two: a low-mass scale tied to gas richness and a higher-mass golden mass regulating efficiency and quenching. (abridged)","abx":0,"nw":0,"d":"2025-02-19","dq":0,"y":2025,"au":[340,1759,1308,1050,650,1651,633,1200],"c":10,"cs":0,"bib":"2025A&A...702A.177T","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2502.13589","url":"https://arxiv.org/abs/2502.13589","doi":"10.1051/0004-6361/202453412","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":-0.269,"yy":0.7462,"p3":[-0.7575,0.3598,0.2552],"sim":{"k":"e","l":[[30,0.944],[52,0.94],[48,0.938],[16,0.937],[67,0.937]]},"c3":[88.21,75.52,122.46],"c2":[181.45,-56.85],"k":5,"r":[61,77,87,118,141],"rm":0},{"id":"2502.13242","t":"Learning the Universe: $3\\ h^{-1}{\\rm Gpc}$ Tests of a Field Level $N$-body Simulation Emulator","ab":"We apply and test a field-level emulator for non-linear cosmic structure formation in a volume matching next-generation surveys. Inferring the cosmological parameters and initial conditions from which the particular galaxy distribution of our Universe was seeded can be achieved by comparing simulated data to observational data. Previous work has focused on building accelerated forward models that efficiently mimic these simulations. One of these accelerated forward models uses machine learning to apply a non-linear correction to the linear $z=0$ Zeldovich approximation (ZA) fields, closely matching the cosmological statistics in the $N$-body simulation. This emulator was trained and tested at $(h^{-1}{\\rm Gpc})^3$ volumes, although cosmological inference requires significantly larger volumes. We test this emulator at $(3\\ h^{-1}{\\rm Gpc})^3$ by comparing emulator outputs to $N$-body simulations for eight unique cosmologies. We consider several summary statistics, applied to both the raw particle fields and the dark matter (DM) haloes. We find that the power spectrum, bispectrum and wavelet statistics of the raw particle fields agree with the $N$-body simulations within ${\\sim} 5 \\%$ at most scales. For the haloes, we find a similar agreement between the emulator and the $N$-body for power spectrum and bispectrum, though a comparison of the stacked profiles of haloes shows that the emulator has slight errors in the positions of particles in the highly non-linear interior of the halo. At these large $(3\\ h^{-1}{\\rm Gpc})^3$ volumes, the emulator can create $z=0$ particle fields in a thousandth of the time required for $N$-body simulations and will be a useful tool for large-scale cosmological inference. This is a Learning the Universe publication.","abx":0,"nw":0,"d":"2025-02-18","dq":0,"y":2025,"au":[1259,1257,633,476,1085,713],"c":1,"cs":0,"bib":"2025arXiv250213242S","v":"","lk":"arXiv:2502.13242","url":"https://arxiv.org/abs/2502.13242","doi":"","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["CNN","Emulators & regression ML"],"u":["CNN"],"n":"Learning the Universe field-level emulator; N-body suite not named (likely Quijote)"},"x":-0.1304,"yy":-0.2297,"p3":[0.3043,-0.174,-0.0963],"sim":{"k":"e","l":[[102,0.953],[136,0.951],[149,0.946],[121,0.946],[54,0.945]]},"c3":[-154.03,-61.42,86.66],"c2":[-25.42,-25.63],"k":6,"r":[55,56,57,102,158],"rm":0},{"id":"2502.13239","t":"Towards Robustness Across Cosmological Simulation Models TNG, SIMBA, ASTRID, and EAGLE","ab":"The rapid advancement of large-scale cosmological simulations has opened new avenues for cosmological and astrophysical research. However, the increasing diversity among cosmological simulation models presents a challenge to the robustness. In this work, we develop the Model-Insensitive ESTimator (MIEST), a machine that can robustly estimate the cosmological parameters, $Ω_m$ and $σ_8$, from neural hydrogen maps of simulation models in the CAMELS project$-$TNG, SIMBA, ASTRID, and EAGLE. An estimator is considered robust if it possesses a consistent predictive power across all simulations, including those used during the training phase. We train our machine using multiple simulation models and ensure that it only extracts common features between the models while disregarding the model-specific features. This allows us to develop a novel model that is capable of accurately estimating parameters across a range of simulation models, without being biased towards any particular model. Upon the investigation of the latent space$-$a set of summary statistics, we find that the implementation of robustness leads to the blending of latent variables across different models, demonstrating the removal of model-specific features. In comparison to a standard machine lacking robustness, the average performance of MIEST on the unseen simulations during the training phase has been improved by $\\sim17$% for $Ω_m$ and $\\sim 38$% for $σ_8$. By using a machine learning approach that can extract robust, yet physical features, we hope to improve our understanding of galaxy formation and evolution in a (subgrid) model-insensitive manner, and ultimately, gain insight into the underlying physical processes responsible for robustness. This is a Learning the Universe publication.","abx":0,"nw":0,"d":"2025-02-18","dq":0,"y":2025,"au":[1842,1651,184,251,1513,633],"c":16,"cs":0,"bib":"2025ApJ...991..120J","v":"","lk":"arXiv:2502.13239","url":"https://arxiv.org/abs/2502.13239","doi":"","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["CNN","Other ML"],"u":["CNN"]},"x":-0.0811,"yy":0.3919,"p3":[0.2735,0.315,0.3824],"sim":{"k":"e","l":[[86,0.948],[10,0.947],[89,0.946],[87,0.945],[141,0.945]]},"c3":[15.31,-23.68,158.14],"c2":[144.69,23.79],"k":7,"r":[66,67,75,86,87,89,90,94,98,102,108,122,123,124,125,141,180],"rm":0},{"id":"2412.05662","t":"Probing massive neutrinos and modified gravity with redshift-space morphologies and anisotropies of large-scale structure","ab":"Strong degeneracy exists between some modified gravity (MG) models and massive neutrinos because the enhanced structure growth produced by modified gravity can be suppressed due to the free-streaming massive neutrinos. Previous works showed this degeneracy can be broken with non-Gaussian or velocity information. Therefore in this work, we focus on the large-scale structure (LSS) in redshift space and investigate for the first time the possibility of using the non-Gaussian information and velocity information captured by the 3D scalar Minkowski functionals (MFs) and the 3D Minkowski tensors (MTs) to break this degeneracy. Based on the Quijote and Quijote-MG simulations, we find the imprints on redshift space LSS left by the Hu-Sawicki $f(R)$ gravity can be discriminated from those left by massive neutrinos with these statistics. With the Fisher information formalism, we first show how the MTs extract information with their perpendicular and parallel elements for both low- and high-density regions; then we compare constraints from the power spectrum monopole and MFs in real space with those in redshift space, and investigate how the constraining power is further improved with anisotropies captured by the quadrupole and hexadecapole of the power spectrum and the MTs; finally, we combine the power spectrum multipoles with MFs plus MTs and find the constraints from the power spectrum multipoles on $Ω_{\\mathrm{m}}, h, σ_8$, $M_ν$, and $f_{R_0}$ can be improved, because they are complemented with non-Gaussian information, by a factor of 3.4, 3.0, 3.3, 3.3, and 1.9 on small scales ($k_{\\rm{max}}=0.5~h\\rm{Mpc}^{-1},\\ R_G=5~h^{-1}\\rm{Mpc}$), and 2.8, 2.2, 3.4, 3.4, and 1.5 on large scales ($k_{\\rm{max}}=0.25~h\\rm{Mpc}^{-1},\\ R_G=10~h^{-1}\\rm{Mpc}$).","abx":0,"nw":0,"d":"2024-12-07","dq":0,"y":2024,"au":[1799,1075,633,1230,701,1802],"c":5,"cs":0,"bib":"2025JCAP...04..088L","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2412.05662","url":"https://arxiv.org/abs/2412.05662","doi":"10.1088/1475-7516/2025/04/088","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos","Dark matter & modified gravity"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.1449,"yy":-0.726,"p3":[-0.1079,-0.4023,-0.1954],"sim":{"k":"e","l":[[58,0.932],[104,0.929],[178,0.915],[157,0.913],[84,0.913]]},"c3":[-140.63,96.69,-105.16],"c2":[-213.15,72.3],"k":4,"r":[58,101,106,110,132,135,150,157,158,200,212],"rm":0},{"id":"2412.04559","t":"X-raying CAMELS: Constraining Baryonic Feedback in the Circum-Galactic Medium with the CAMELS simulations and eRASS X-ray Observations","ab":"The circumgalactic medium (CGM) around massive galaxies plays a crucial role in regulating star formation and feedback. Using the CAMELS simulation suite, we develop emulators for the X-ray surface brightness profile and the X-ray luminosity--stellar mass scaling relation to investigate how stellar and AGN feedback shape the X-ray properties of the hot CGM. Our analysis shows that at CGM scales ($10^{12} \\lesssim M_{\\rm halo}/M_\\odot \\lesssim 10^{13}$, $10\\lesssim r/{\\rm kpc} \\lesssim 400$), stellar feedback more significantly impacts the X-ray properties than AGN feedback within the parameters studied. Comparing the emulators to recent eROSITA All-Sky Survey observations, it was found that stronger feedback than currently implemented in the IllustrisTNG, SIMBA, and Astrid simulations is required to match observed CGM properties. However, adopting these enhanced feedback parameters causes deviations in the stellar-mass-halo-mass relations from observational constraints below the group mass scale. This tension suggests possible unaccounted systematics in X-ray CGM observations or inadequacies in the feedback models of cosmological simulations.","abx":0,"nw":0,"d":"2024-12-05","dq":0,"y":2024,"au":[555,441,1861,789,250,1325,444,1651,1848,633],"c":24,"cs":0,"bib":"2025ApJ...984..190L","v":"Astrophysical Journal","lk":"arXiv:2412.04559","url":"https://arxiv.org/abs/2412.04559","doi":"10.3847/1538-4357/adc450","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Emulators & regression ML"],"u":[]},"x":-0.1805,"yy":0.7873,"p3":[-0.7538,0.2934,0.1639],"sim":{"k":"e","l":[[52,0.957],[114,0.956],[16,0.949],[67,0.949],[30,0.945]]},"c3":[110.86,103.53,206.36],"c2":[281.91,4.18],"k":5,"r":[52,53,66,67,78,81,87,91,92,99,113,114,125,141],"rm":0},{"id":"2411.14377","t":"The constraining power of the Marked Power Spectrum: an analytical study","ab":"The marked power spectrum - a two-point correlation function of a transformed density field - has emerged as a promising tool for extracting cosmological information from the large-scale structure of the Universe. In this work, we present the first comprehensive analytical study of the marked power spectrum's sensitivity to primordial non-Gaussianity (PNG) of the non-local type. We extend previous effective field theory frameworks to incorporate PNG, developing a complete theoretical model that we validate against the Quijote simulation suite. Through a systematic Fisher analysis, we compare the constraining power of the marked power spectrum against traditional approaches combining the power spectrum and bispectrum (P+B). We explore different choices of mark parameters to evaluate their impact on parameter constraints, particularly focusing on equilateral and orthogonal PNG as well as neutrino masses. Our analysis shows that while marking up underdense regions yields optimal constraints in the low shot-noise regime, the marked power spectrum's performance for discrete tracers with BOSS-like number densities does not surpass that of P+B analysis at mildly non-linear scales ($k \\lesssim 0.25 \\,h/\\text{Mpc}$). However, the marked approach offers several practical advantages, including simpler estimation procedures and potentially more manageable systematic effects. Our theoretical framework reveals how the marked power spectrum incorporates higher-order correlation information through terms resembling tree-level bispectra and power spectrum convolutions. This work establishes a robust foundation for applying marked statistics to future large-volume surveys.","abx":0,"nw":0,"d":"2024-11-21","dq":0,"y":2024,"au":[1232,693,1272,166,631,126,1230,1806,467,633,255],"c":8,"cs":0,"bib":"2025JCAP...09..036M","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2411.14377","url":"https://arxiv.org/abs/2411.14377","doi":"10.1088/1475-7516/2025/09/036","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos","Primordial non-Gaussianity"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":[]},"x":0.2195,"yy":-0.6306,"p3":[-0.2785,-0.5961,-0.2669],"sim":{"k":"e","l":[[150,0.954],[153,0.943],[106,0.939],[101,0.936],[68,0.936]]},"c3":[-175.11,125.62,-5.73],"c2":[-172.93,125.77],"k":4,"r":[58,61,68,84,96,101,104,106,109,135,150,158],"rm":0},{"id":"2411.13960","t":"Learning the Universe: Cosmological and Astrophysical Parameter Inference with Galaxy Luminosity Functions and Colours","ab":"We perform the first direct cosmological and astrophysical parameter inference from the combination of galaxy luminosity functions and colours using a simulation based inference approach. Using the Synthesizer code we simulate the dust attenuated ultraviolet-near infrared stellar emission from galaxies in thousands of cosmological hydrodynamic simulations from the CAMELS suite, including the Swift-EAGLE, IllustrisTNG, Simba & Astrid galaxy formation models. For each galaxy we calculate the rest-frame luminosity in a number of photometric bands, including the SDSS $\\textit{ugriz}$ and GALEX FUV & NUV filters; this dataset represents the largest catalogue of synthetic photometry based on hydrodynamic galaxy formation simulations produced to date, totalling >200 million sources. From these we compile luminosity functions and colour distributions, and find clear dependencies on both cosmology and feedback. We then perform simulation based (likelihood-free) inference using these distributions to constrain $Ω_m$, $σ_8$, and four parameters controlling the strength of stellar and AGN feedback. Both colour distributions and luminosity functions provide complementary information on certain parameters when performing inference. We achieve constraints on the stellar feedback parameters, as well as $Ω_m$ and $σ_8$. The latter is attributable to the fact that the photometry encodes the star formation-metal enrichment history of each galaxy; galaxies in a universe with a higher $σ_8$ tend to form earlier and have higher metallicities, which leads to redder colours. We find that a model trained on one galaxy formation simulation generalises poorly when applied to another, and attribute this to differences in the subgrid prescriptions, and lack of flexibility in our emission modelling. The photometric catalogues are publicly available at: https://camels.readthedocs.io/","abx":0,"nw":0,"d":"2024-11-21","dq":0,"y":2024,"au":[378,1736,1257,444,1533,208,979,152,1805,1513,1065,633],"c":32,"cs":0,"bib":"2025MNRAS.544.3949L","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2411.13960","url":"https://arxiv.org/abs/2411.13960","doi":"10.1093/mnras/staf1888","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Simulation-based inference"],"u":[]},"x":-0.1119,"yy":0.5246,"p3":[-0.0635,0.3846,0.3875],"sim":{"k":"e","l":[[6,0.956],[141,0.955],[118,0.954],[111,0.952],[87,0.951]]},"c3":[60.51,103.69,116.22],"c2":[149.64,-76.89],"k":5,"r":[53,61,65,75,77,81,82,86,87,90,91,94,98,99,108,111,113,115,116,118,122,125,141,158],"rm":0},{"id":"2410.21225","t":"Boosting HI-Galaxy Cross-Clustering Signal through Higher-Order Cross-Correlations","ab":"After reionization, neutral hydrogen (HI) traces the large-scale structure (LSS) of the Universe, enabling HI intensity mapping (IM) to capture the LSS in 3D and constrain key cosmological parameters. We present a new framework utilizing higher-order cross-correlations to study HI clustering around galaxies, tested using real-space data from the IllustrisTNG300 simulation. This approach computes the joint distributions of $k$-nearest neighbor ($k$NN) optical galaxies and the HI brightness temperature field smoothed at relevant scales (the $k$NN-field framework), providing sensitivity to all higher-order cross-correlations, unlike two-point statistics. To simulate HI data from actual surveys, we add random thermal noise and apply a simple foreground cleaning model, filtering out Fourier modes of the brightness temperature field with $k_\\parallel < k_{\\rm min,\\parallel}$. Under current levels of thermal noise and foreground cleaning, typical of a Canadian Hydrogen Intensity Mapping Experiment (CHIME)-like survey, the HI-galaxy cross-correlation signal in our simulations, using the $k$NN-field framework, is detectable at $>30σ$ across $r = [3,12] \\, h^{-1}$Mpc. In contrast, the detectability of the standard two-point correlation function (2PCF) over the same scales depends strongly on the foreground filter: a sharp $k_\\parallel$ filter can spuriously boost detection to $8σ$ due to position-space ringing, whereas a less sharp filter yields no detection. Nonetheless, we conclude that $k$NN-field cross-correlations are robustly detectable across a broad range of foreground filtering and thermal noise conditions, suggesting their potential for enhanced constraining power over 2PCFs.","abx":0,"nw":0,"d":"2024-10-28","dq":0,"y":2024,"au":[528,199,1659,633],"c":6,"cs":0,"bib":"2025MNRAS.538.2204C","v":"","lk":"arXiv:2410.21225","url":"https://arxiv.org/abs/2410.21225","doi":"10.1093/mnras/staf433","tg":{"s":["Other simulations"],"d":["Large-scale structure","Neutral hydrogen & 21cm"],"m":["No ML"],"u":[]},"x":-0.6824,"yy":-0.1704,"p3":[-0.0709,0.5934,-0.1259],"sim":{"k":"e","l":[[74,0.946],[42,0.934],[53,0.934],[180,0.934],[189,0.934]]},"c3":[118.62,47.99,-55.36],"c2":[61.82,179.7],"k":2,"r":[74,141,153,173,180,204,205],"rm":0},{"id":"2410.16361","t":"Quantifying Baryonic Feedback on Warm-Hot Circumgalactic Medium in CAMELS Simulations","ab":"The baryonic physics shaping galaxy formation and evolution are complex, spanning a vast range of scales and making them challenging to model. Cosmological simulations rely on subgrid models that produce significantly different predictions. Understanding how models of stellar and active galactic nuclei (AGN) feedback affect baryon behavior across different halo masses and redshifts is essential. Using the SIMBA and IllustrisTNG suites from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project, we explore the effect of parameters governing the subgrid implementation of stellar and AGN feedback. We find that while IllustrisTNG shows higher cumulative feedback energy across all halos, SIMBA demonstrates a greater spread of baryons, quantified by the closure radius and circumgalactic medium (CGM) gas fraction. This suggests that feedback in SIMBA couples more effectively to baryons and drives them more efficiently within the host halo. There is evidence that different feedback modes are highly interrelated in these subgrid models. Parameters controlling stellar feedback efficiency significantly impact AGN feedback, as seen in the suppression of black hole mass growth and delayed activation of AGN feedback to higher mass halos with increasing stellar feedback efficiency in both simulations. Additionally, AGN feedback efficiency parameters affect the CGM gas fraction at low halo masses in SIMBA, hinting at complex, non-linear interactions between AGN and SNe feedback modes. Overall, we demonstrate that stellar and AGN feedback are intimately interwoven, especially at low redshift, due to subgrid implementation, resulting in halo property effects that might initially seem counterintuitive.","abx":0,"nw":0,"d":"2024-10-21","dq":0,"y":2024,"au":[789,371,441,444,1651,250,1810,1456,633],"c":28,"cs":0,"bib":"2025ApJ...980...61M","v":"Astrophysical Journal","lk":"arXiv:2410.16361","url":"https://arxiv.org/abs/2410.16361","doi":"10.3847/1538-4357/ada442","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":-0.1791,"yy":0.7451,"p3":[-0.6361,0.2934,0.2554],"sim":{"k":"e","l":[[16,0.967],[30,0.964],[67,0.961],[48,0.957],[114,0.954]]},"c3":[127.23,105.44,169.18],"c2":[262.82,41.93],"k":5,"r":[66,67,81,87,91,118,141],"rm":0},{"id":"2410.10942","t":"Cosmological and Astrophysical Parameter Inference from Stacked Galaxy Cluster Profiles Using CAMELS-zoomGZ","ab":"We present a study on the inference of cosmological and astrophysical parameters using stacked galaxy cluster profiles. Utilizing the CAMELS-zoomGZ simulations, we explore how various cluster properties--such as X-ray surface brightness, gas density, temperature, metallicity, and Compton-y profiles--can be used to predict parameters within the 28-dimensional parameter space of the IllustrisTNG model. Through neural networks, we achieve a high correlation coefficient of 0.97 or above for all cosmological parameters, including $Ω_{\\rm m}$, $H_0$, and $σ_8$, and over 0.90 for the remaining astrophysical parameters, showcasing the effectiveness of these profiles for parameter inference. We investigate the impact of different radial cuts, with bins ranging from $0.1R_{200c}$ to $0.7R_{200c}$, to simulate current observational constraints. Additionally, we perform a noise sensitivity analysis, adding up to 40\\% Gaussian noise (corresponding to signal-to-noise ratios as low as 2.5), revealing that key parameters such as $Ω_{\\rm m}$, $H_0$, and the IMF slope remain robust even under extreme noise conditions. We also compare the performance of full radial profiles against integrated quantities, finding that profiles generally lead to more accurate parameter inferences. Our results demonstrate that stacked galaxy cluster profiles contain crucial information on both astrophysical processes within groups and clusters and the underlying cosmology of the universe. This underscores their significance for interpreting the complex data expected from next-generation surveys and reveals, for the first time, their potential as a powerful tool for parameter inference.","abx":0,"nw":0,"d":"2024-10-14","dq":0,"y":2024,"au":[531,1651,633,1751,1263,555,452],"c":7,"cs":0,"bib":"2025ApJ...981..170H","v":"Astrophysical Journal","lk":"arXiv:2410.10942","url":"https://arxiv.org/abs/2410.10942","doi":"10.3847/1538-4357/ada9e9","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","CMB & SZ"],"m":["Emulators & regression ML"],"u":["CMB & SZ"]},"x":0.0168,"yy":0.3937,"p3":[-0.2438,0.4196,0.1475],"sim":{"k":"e","l":[[111,0.95],[66,0.948],[67,0.945],[10,0.945],[115,0.944]]},"c3":[8.16,91.7,195.86],"c2":[188.26,21.25],"k":5,"r":[48,66,75,86,87,90,98,115,124,125,141],"rm":0},{"id":"2409.20507","t":"Constraining Cosmology with Simulation-based inference and Optical Galaxy Cluster Abundance","ab":"We test the robustness of simulation-based inference (SBI) in the context of cosmological parameter estimation from galaxy cluster counts and masses in simulated optical datasets. We construct ``simulations'' using analytical models for the galaxy cluster halo mass function (HMF) and for the observed richness (number of observed member galaxies) to train and test the SBI method. We compare the SBI parameter posterior samples to those from an MCMC analysis that uses the same analytical models to construct predictions of the observed data vector. The two methods exhibit comparable performance, with reliable constraints derived for the primary cosmological parameters, ($Ω_m$ and $σ_8$), and richness-mass relation parameters. We also perform out-of-domain tests with observables constructed from galaxy cluster-sized halos in the Quijote simulations. Again, the SBI and MCMC results have comparable posteriors, with similar uncertainties and biases. Unsurprisingly, upon evaluating the SBI method on thousands of simulated data vectors that span the parameter space, SBI exhibits worsened posterior calibration metrics in the out-of-domain application. We note that such calibration tests with MCMC is less computationally feasible and highlight the potential use of SBI to stress-test limitations of analytical models, such as in the use for constructing models for inference with MCMC.","abx":0,"nw":0,"d":"2024-09-30","dq":0,"y":2024,"au":[1282,1846,347,1081,1661,633],"c":9,"cs":0,"bib":"2024arXiv240920507R","v":"","lk":"arXiv:2409.20507","url":"https://arxiv.org/abs/2409.20507","doi":"","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Simulation-based inference","Perturbation theory & analytic models"],"u":[]},"x":0.1651,"yy":0.239,"p3":[-0.0117,0.1293,-0.0605],"sim":{"k":"e","l":[[45,0.945],[12,0.942],[111,0.942],[66,0.942],[89,0.941]]},"c3":[-197.83,-63.21,-14.37],"c2":[-220.29,22.03],"k":6,"r":[158],"rm":0},{"id":"2409.09124","t":"CHARM: Creating Halos with Auto-Regressive Multi-stage networks","ab":"To maximize the amount of information extracted from cosmological datasets, simulations that accurately represent these observations are necessary. However, traditional simulations that evolve particles under gravity by estimating particle-particle interactions (N-body simulations) are computationally expensive and prohibitive to scale to the large volumes and resolutions necessary for the upcoming datasets. Moreover, modeling the distribution of galaxies typically involves identifying virialized dark matter halos, which is also a time- and memory-consuming process for large N-body simulations, further exacerbating the computational cost. In this study, we introduce CHARM, a novel method for creating mock halo catalogs by matching the spatial, mass, and velocity statistics of halos directly from the large-scale distribution of the dark matter density field. We develop multi-stage neural spline flow-based networks to learn this mapping at redshift z=0.5 directly with computationally cheaper low-resolution particle mesh simulations instead of relying on the high-resolution N-body simulations. We show that the mock halo catalogs and painted galaxy catalogs have the same statistical properties as obtained from $N$-body simulations in both real space and redshift space. Finally, we use these mock catalogs for cosmological inference using redshift-space galaxy power spectrum, bispectrum, and wavelet-based statistics using simulation-based inference, performing the first inference with accelerated forward model simulations and finding unbiased cosmological constraints with well-calibrated posteriors. The code was developed as part of the Simons Collaboration on Learning the Universe and is publicly available at \\url{https://github.com/shivampcosmo/CHARM}.","abx":0,"nw":0,"d":"2024-09-13","dq":0,"y":2024,"au":[1647,370,251,460,134,713,1257,718,1706,633],"c":13,"cs":0,"bib":"2025PhRvD.112j3503P","v":"","lk":"arXiv:2409.09124","url":"https://arxiv.org/abs/2409.09124","doi":"","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["Simulation-based inference","Normalizing flows","Generative models"],"u":["Other simulations"],"n":"Simulations not named (likely Quijote); flows used generatively."},"x":-0.091,"yy":0.0982,"p3":[0.192,-0.0734,0.0949],"sim":{"k":"e","l":[[98,0.945],[45,0.94],[41,0.938],[145,0.937],[66,0.937]]},"c3":[-108.53,-10.92,28.87],"c2":[-61.15,-48.31],"k":6,"r":[57,109,115,132,150,158,166],"rm":0},{"id":"2409.02980","t":"How DREAMS are made: Emulating Satellite Galaxy and Subhalo Populations with Diffusion Models and Point Clouds","ab":"The connection between galaxies and their host dark matter (DM) halos is critical to our understanding of cosmology, galaxy formation, and DM physics. To maximize the return of upcoming cosmological surveys, we need an accurate way to model this complex relationship. Many techniques have been developed to model this connection, from Halo Occupation Distribution (HOD) to empirical and semi-analytic models to hydrodynamic. Hydrodynamic simulations can incorporate more detailed astrophysical processes but are computationally expensive; HODs, on the other hand, are computationally cheap but have limited accuracy. In this work, we present NeHOD, a generative framework based on variational diffusion model and Transformer, for painting galaxies/subhalos on top of DM with an accuracy of hydrodynamic simulations but at a computational cost similar to HOD. By modeling galaxies/subhalos as point clouds, instead of binning or voxelization, we can resolve small spatial scales down to the resolution of the simulations. For each halo, NeHOD predicts the positions, velocities, masses, and concentrations of its central and satellite galaxies. We train NeHOD on the TNG-Warm DM suite of the DREAMS project, which consists of 1024 high-resolution zoom-in hydrodynamic simulations of Milky Way-mass halos with varying warm DM mass and astrophysical parameters. We show that our model captures the complex relationships between subhalo properties as a function of the simulation parameters, including the mass functions, stellar-halo mass relations, concentration-mass relations, and spatial clustering. Our method can be used for a large variety of downstream applications, from galaxy clustering to strong lensing studies.","abx":0,"nw":0,"d":"2024-09-04","dq":0,"y":2024,"au":[1744,633,1653,354,1440,201,146,918,1677,1243,1814,386,444,1334,941,632,1632,1078,980],"c":27,"cs":0,"bib":"2026ApJ...997..336N","v":"Astrophysical Journal","lk":"arXiv:2409.02980","url":"https://arxiv.org/abs/2409.02980","doi":"10.3847/1538-4357/ae28dc","tg":{"s":["DREAMS"],"d":["Dark matter & modified gravity","Galaxies & baryonic feedback"],"m":["Graph neural networks","Generative models"],"u":["Graph neural networks"]},"x":0.2479,"yy":0.4251,"p3":[0.0699,0.5843,0.183],"sim":{"k":"e","l":[[26,0.952],[66,0.951],[65,0.945],[21,0.941],[18,0.938]]},"c3":[-52.27,25.78,212.77],"c2":[167.99,57.53],"k":6,"r":[64,66,81,82,85,90,108,141],"rm":0},{"id":"2408.07699","t":"Field-level Emulation of Cosmic Structure Formation with Cosmology and Redshift Dependence","ab":"We present a field-level emulator for large-scale structure, capturing the cosmology dependence and the time evolution of cosmic structure formation. The emulator maps linear displacement fields to their corresponding nonlinear displacements from N-body simulations at specific redshifts. Designed as a neural network, the emulator incorporates style parameters that encode dependencies on $Ω_{\\rm m}$ and the linear growth factor $D(z)$ at redshift $z$. We train our model on the six-dimensional N-body phase space, predicting particle velocities as the time derivative of the model's displacement outputs. This innovation results in significant improvements in training efficiency and model accuracy. Tested on diverse cosmologies and redshifts not seen during training, the emulator achieves percent-level accuracy on scales of $k\\sim~1~{\\rm Mpc}^{-1}~h$ at $z=0$, with improved performance at higher redshifts. We compare predicted structure formation histories with N-body simulations via merger trees, finding consistent merger event sequences and statistical properties.","abx":0,"nw":0,"d":"2024-08-14","dq":0,"y":2024,"au":[476,1839,633,1646,452],"c":21,"cs":0,"bib":"2025JCAP...03..072J","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2408.07699","url":"https://arxiv.org/abs/2408.07699","doi":"10.1088/1475-7516/2025/03/072","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["CNN","Emulators & regression ML"],"u":["CNN"]},"x":-0.0852,"yy":-0.2844,"p3":[0.5293,-0.0952,-0.2119],"sim":{"k":"e","l":[[102,0.967],[103,0.945],[45,0.944],[134,0.94],[84,0.933]]},"c3":[-126.75,-112.12,4.37],"c2":[-92.53,-116.49],"k":6,"r":[102,103,109,121,134,136,151,158],"rm":0},{"id":"2407.18647","t":"Towards unveiling the large-scale nature of gravity with the wavelet scattering transform","ab":"We present the first application of the Wavelet Scattering Transform (WST) in order to constrain the nature of gravity using the three-dimensional (3D) large-scale structure of the universe. Utilizing the Quijote-MG N-body simulations, we can reliably model the 3D matter overdensity field for the f(R) Hu-Sawicki modified gravity (MG) model down to $k_{\\rm max}=0.5$ h/Mpc. Combining these simulations with the Quijote $ν$CDM collection, we then conduct a Fisher forecast of the marginalized constraints obtained on gravity using the WST coefficients and the matter power spectrum at redshift z=0. Our results demonstrate that the WST substantially improves upon the 1$σ$ error obtained on the parameter that captures deviations from standard General Relativity (GR), yielding a tenfold improvement compared to the corresponding matter power spectrum result. At the same time, the WST also enhances the precision on the $Λ$CDM parameters and the sum of neutrino masses, by factors of 1.2-3.4 compared to the matter power spectrum, respectively. Despite the overall reduction in the WST performance when we focus on larger scales, it still provides a relatively $4.5\\times$ tighter 1$σ$ error for the MG parameter at $k_{\\rm max}=0.2$ h/Mpc, highlighting its great sensitivity to the underlying gravity theory. This first proof-of-concept study reaffirms the constraining properties of the WST technique and paves the way for exciting future applications in order to perform precise large-scale tests of gravity with the new generation of cutting-edge cosmological data.","abx":0,"nw":0,"d":"2024-07-26","dq":0,"y":2024,"au":[701,633,1230],"c":14,"cs":0,"bib":"2024JCAP...11..061V","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2407.18647","url":"https://arxiv.org/abs/2407.18647","doi":"10.1088/1475-7516/2024/11/061","tg":{"s":["Quijote"],"d":["Large-scale structure","Dark matter & modified gravity"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.0923,"yy":-0.7221,"p3":[0.2691,-0.3857,-0.1206],"sim":{"k":"e","l":[[109,0.946],[25,0.933],[47,0.932],[148,0.927],[49,0.926]]},"c3":[-78.46,149.53,-30.99],"c2":[-117.5,98.97],"k":4,"r":[90,101,104,109,110,111,129,132,141,148,150,153,158,163,164,200],"rm":0},{"id":"2407.06641","t":"Cosmological simulations of scale-dependent primordial non-Gaussianity","ab":"We present the results of a set of cosmological N-body simulations with standard $Λ$CDM cosmology but characterized by a scale-dependent primordial non-Gaussianity of the local type featuring a power-law dependence of the $f_{\\rm NL}^{\\rm loc}(k)$ at large scales followed by a saturation to a constant value at smaller scales where non-linear growth leads to the formation of collapsed cosmic structures. Such models are built to ensure consistency with current Cosmic Microwave Background bounds on primordial non-Gaussianity yet allowing for large effects of the non-Gaussian statistics on the properties of non-linear structure formation. We show the impact of such scale-dependent non-Gaussian scenarios on a wide range of properties of the resulting cosmic structures, such as the non-linear matter power spectrum, the halo and sub-halo mass functions, the concentration-mass relation, the halo and void density profiles, and we highlight for the first time that some of these models might mimic the effects of Warm Dark Matter for several of such observables","abx":0,"nw":0,"d":"2024-07-09","dq":0,"y":2024,"au":[1230,541,467,1069,166,1806,693,1272,1232,1076,633,245],"c":8,"cs":0,"bib":"2024JCAP...11..053B","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2407.06641","url":"https://arxiv.org/abs/2407.06641","doi":"10.1088/1475-7516/2024/11/053","tg":{"s":["Other simulations"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["No ML"],"u":[]},"x":0.4508,"yy":-0.7162,"p3":[-0.0532,-0.5111,-0.4563],"sim":{"k":"e","l":[[152,0.941],[207,0.94],[149,0.94],[181,0.939],[195,0.939]]},"c3":[-139.87,133.77,-99.09],"c2":[-220.95,107.46],"k":3,"r":[61,84,95,106,195,209,212],"rm":0},{"id":"2406.15546","t":"The Impact of Non-Gaussian Primordial Tails on Cosmological Observables","ab":"Whilst current observational evidence favors a close-to-Gaussian spectrum of primordial perturbations, there exist many models of the early Universe that predict this distribution to have exponentially enhanced or suppressed tails. In this work, we generate realizations of the primordial potential with non-Gaussian tails via a phenomenological model; these are then evolved numerically to obtain maps of the cosmic microwave background (CMB) and large-scale structure (LSS). In the CMB maps, our added non-Gaussianity manifests as a localized enhancement of hot and cold spots, which would be expected to contribute to $N$-point functions up to large $N$. Such models are indirectly constrained by \\textit{Planck} trispectrum bounds, which restrict the changes in the temperature fluctuations to $O(10μ\\mathrm{K})$. In the late-time Universe, we find that tailed cosmologies lead to a halo mass function enhanced at high masses, as expected. Furthermore, significant scale-dependent bias in the halo-halo and halo-matter power spectrum is also sourced, which arises from the squeezed limit of large $N$-point functions that are implicitly generated through the enhancement of the tails. These results underscore that a detection of scale-dependent bias alone cannot be used to rule out single field inflation, but can be used together with other statistics to probe a wide range of primordial processes.","abx":0,"nw":0,"d":"2024-06-21","dq":0,"y":2024,"au":[1806,1356,633],"c":9,"cs":0,"bib":"2024arXiv240615546C","v":"","lk":"arXiv:2406.15546","url":"https://arxiv.org/abs/2406.15546","doi":"","tg":{"s":["Other simulations"],"d":["Large-scale structure","Primordial non-Gaussianity","CMB & SZ"],"m":["No ML"],"u":[]},"x":0.1622,"yy":-0.457,"p3":[-0.1364,-0.6986,-0.2375],"sim":{"k":"e","l":[[106,0.946],[101,0.943],[152,0.94],[59,0.938],[96,0.938]]},"c3":[-191.28,42.16,4.01],"c2":[-140.23,121.48],"k":4,"r":[83,106,156,158],"rm":0},{"id":"2405.13491","t":"Euclid. I. Overview of the Euclid mission","ab":"The current standard model of cosmology successfully describes a variety of measurements, but the nature of its main ingredients, dark matter and dark energy, remains unknown. Euclid is a medium-class mission in the Cosmic Vision 2015-2025 programme of the European Space Agency (ESA) that will provide high-resolution optical imaging, as well as near-infrared imaging and spectroscopy, over about 14,000 deg^2 of extragalactic sky. In addition to accurate weak lensing and clustering measurements that probe structure formation over half of the age of the Universe, its primary probes for cosmology, these exquisite data will enable a wide range of science. This paper provides a high-level overview of the mission, summarising the survey characteristics, the various data-processing steps, and data products. We also highlight the main science objectives and expected performance.","abx":0,"nw":0,"d":"2024-05-22","dq":0,"y":2024,"au":[2,1825,0,802,5,808,1461,659,1291,1092,1754,1835,6,7,776,636,637,8,1623,1755,111,210,9,1544,10,1001,809,779,1545,126,638,1478,560,11,1546,1547,1093,639,1094,1548,1095,810,1002,721,561,1096,482,1692,1292,211,722,1413,12,1549,1550,1462,279,483,399,1098,1097,212,13,484,1099,1230,763,14,1239,1338,1100,485,1463,1551,1101,1693,1465,793,228,15,1293,16,1370,57,313,1003,1004,799,1757,80,943,562,1102,544,949,1466,641,310,950,1371,865,563,449,1103,812,1104,564,280,1552,1468,458,1005,17,1498,18,813,1006,20,281,1694,725,1372,1106,19,1107,400,1007,282,1790,880,1673,101,486,213,1202,22,565,872,401,1695,1469,723,1460,1758,487,488,643,1553,1373,1165,1108,1089,814,1696,283,1109,1008,1269,1554,815,724,644,566,1374,284,1759,402,1471,1010,1238,25,1011,1112,26,645,568,215,1674,1012,646,675,1113,1760,489,1294,27,95
