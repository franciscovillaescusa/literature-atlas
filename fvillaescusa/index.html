 can infer the value of $Ω_{\\rm m}$ and $σ_8$ when tested using halo catalogues from thousands of N-body simulations run with five different N-body codes: Abacus, CUBEP$^3$M, Enzo, PKDGrav3, and Ramses. Surprisingly, the model trained to infer $Ω_{\\rm m}$ also works when tested on thousands of state-of-the-art CAMELS hydrodynamic simulations run with four different codes and subgrid physics implementations. Using halo properties such as concentration and maximum circular velocity allow our models to extract more information, at the expense of breaking the robustness of the models. This may happen because the different N-body codes are not converged on the relevant scales corresponding to these parameters.","abx":0,"nw":0,"d":"2022-09-14","dq":0,"y":2022,"au":[753,633,1434,1530,1073,1231,461,1848,1751,1276,535,713,444,1733,531,996],"c":46,"cs":0,"bib":"2023ApJ...944...27S","v":"Astrophysical Journal","lk":"arXiv:2209.06843","url":"https://arxiv.org/abs/2209.06843","doi":"10.3847/1538-4357/acac7a","tg":{"s":["CAMELS","Other simulations"],"d":["Large-scale structure"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":-0.0475,"yy":0.1793,"p3":[-0.0546,-0.1043,0.4928],"sim":{"k":"e","l":[[89,0.972],[90,0.967],[120,0.962],[75,0.959],[108,0.956]]},"c3":[-85.21,29.28,174.51],"c2":[83.19,49.5],"k":7,"r":[108,118,123,124,125,141,158],"rm":0},{"id":"2209.02075","t":"The SZ flux-mass ($Y$-$M$) relation at low halo masses: improvements with symbolic regression and strong constraints on baryonic feedback","ab":"Feedback from active galactic nuclei (AGN) and supernovae can affect measurements of integrated SZ flux of halos ($Y_\\mathrm{SZ}$) from CMB surveys, and cause its relation with the halo mass ($Y_\\mathrm{SZ}-M$) to deviate from the self-similar power-law prediction of the virial theorem. We perform a comprehensive study of such deviations using CAMELS, a suite of hydrodynamic simulations with extensive variations in feedback prescriptions. We use a combination of two machine learning tools (random forest and symbolic regression) to search for analogues of the $Y-M$ relation which are more robust to feedback processes for low masses ($M\\lesssim 10^{14}\\, h^{-1} \\, M_\\odot$); we find that simply replacing $Y\\rightarrow Y(1+M_*/M_\\mathrm{gas})$ in the relation makes it remarkably self-similar. This could serve as a robust multiwavelength mass proxy for low-mass clusters and galaxy groups. Our methodology can also be generally useful to improve the domain of validity of other astrophysical scaling relations. We also forecast that measurements of the $Y-M$ relation could provide percent-level constraints on certain combinations of feedback parameters and/or rule out a major part of the parameter space of supernova and AGN feedback models used in current state-of-the-art hydrodynamic simulations. Our results can be useful for using upcoming SZ surveys (e.g., SO, CMB-S4) and galaxy surveys (e.g., DESI and Rubin) to constrain the nature of baryonic feedback. Finally, we find that the an alternative relation, $Y-M_*$, provides complementary information on feedback than $Y-M$","abx":0,"nw":0,"d":"2022-09-05","dq":0,"y":2022,"au":[465,1072,820,1647,633,452,1280,441,444,1646,1061],"c":39,"cs":0,"bib":"2023MNRAS.522.2628W","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2209.02075","url":"https://arxiv.org/abs/2209.02075","doi":"10.1093/mnras/stad1128","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","CMB & SZ"],"m":["Symbolic regression","Other ML"],"u":[]},"x":-0.0339,"yy":0.7857,"p3":[-0.3585,0.0563,0.1299],"sim":{"k":"e","l":[[67,0.951],[66,0.945],[116,0.945],[114,0.942],[89,0.941]]},"c3":[144.96,-20.13,135.44],"c2":[197.71,-108.09],"k":5,"r":[89,113,114,116,117,127,131,138,141],"rm":0},{"id":"2209.00657","t":"Studying the Warm Hot Intergalactic Medium in emission: a reprise","ab":"The Warm-Hot Intergalactic Medium (WHIM) is believed to host a significant fraction of the ``missing baryons'' in the nearby Universe. Its signature has been detected in the X-ray absorption spectra of distant quasars. However, its detection in emission, that would allow us to study the WHIM in a systematic way, is still lacking. Motivated by the possibility to perform these studies with next generation integral field spectrometers, and thanks to the availability of a large suite of state-of-the-art hydrodynamic simulations -- the CAMELS suite -- we study here in detail the emission properties of the WHIM and the possibility to infer its physical properties with upcoming X-ray missions like Athena. We focused on the two most prominent WHIM emission lines, the OVII triplet and the OVIII singlet, and build line surface brightness maps in a lightcone, mimicking a data cube generated through integral field spectroscopy. We confirm that detectable WHIM emission, even with next generation instruments, is largely associated to galaxy-size dark matter halos and that the WHIM properties evolve little from $z\\simeq0.5$ to now. Some characteristics of the WHIM, like the line number counts as a function of their brightness, depend on the specific hydrodynamic simulation used, while others, like the WHIM clustering properties, are robust to this aspect. The large number of simulations available in the CAMELS datasets allows us to assess the sensitivity of the WHIM properties to the background cosmology and to the energy feedback mechanisms regulated by AGN and stellar activity. [ABRIDGED]","abx":0,"nw":0,"d":"2022-09-01","dq":0,"y":2022,"au":[678,488,1254,633,886],"c":10,"cs":0,"bib":"2023MNRAS.523.2263P","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2209.00657","url":"https://arxiv.org/abs/2209.00657","doi":"10.1093/mnras/stad1495","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","Surveys & instruments"],"m":["No ML"],"u":["Surveys & instruments"]},"x":-0.1689,"yy":0.6686,"p3":[-0.6058,0.3969,0.071],"sim":{"k":"e","l":[[67,0.942],[16,0.937],[52,0.935],[48,0.927],[210,0.924]]},"c3":[100.31,102.36,92.38],"c2":[194.11,52.86],"k":5,"r":[114,118,141],"rm":0},{"id":"2206.15450","t":"Quijote PNG: The information content of the halo power spectrum and bispectrum","ab":"We investigate how much can be learnt about four types of primordial non-Gaussianity (PNG) from small-scale measurements of the halo field. Using the QUIJOTE-PNG simulations, we quantify the information content accessible with measurements of the halo power spectrum monopole and quadrupole, the matter power spectrum, the halo-matter cross spectrum and the halo bispectrum monopole. This analysis is the first to include small, non-linear scales, up to $k_\\mathrm{max}=0.5 \\mathrm{h/Mpc}$, and to explore whether these scales can break degeneracies with cosmological and nuisance parameters making use of thousands of N-body simulations. We perform all the halo measurements in redshift space with a single sample comprised of all halos with mass $>3.2 \\times 10^{13}~h^{-1}M_\\odot$. For local PNG, measurements of the scale dependent bias effect from the power spectrum using sample variance cancellation provide significantly tighter constraints than measurements of the halo bispectrum. In this case measurements of the small scales add minimal additional constraining power. In contrast, the information on equilateral and orthogonal PNG is primarily accessible through the bispectrum. For these shapes, small scale measurements increase the constraining power of the halo bispectrum by up to $\\times4$, though the addition of scales beyond $k\\approx 0.3 \\mathrm{h/Mpc}$ improves constraints largely through reducing degeneracies between PNG and the other parameters. These degeneracies are even more powerfully mitigated through combining power spectrum and bispectrum measurements. However even with combined measurements and small scale information, equilateral non-Gaussianity remains highly degenerate with $σ_8$ and our bias model.","abx":0,"nw":0,"d":"2022-06-30","dq":0,"y":2022,"au":[1806,633,476,1230,693,467,1272,1076,251],"c":52,"cs":0,"bib":"2023ApJ...943..178C","v":"Astrophysical Journal","lk":"arXiv:2206.15450","url":"https://arxiv.org/abs/2206.15450","doi":"10.3847/1538-4357/aca7c1","tg":{"s":["Quijote"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":[]},"x":0.1179,"yy":-0.4906,"p3":[-0.2543,-0.6603,-0.0811],"sim":{"k":"e","l":[[106,0.968],[96,0.964],[84,0.963],[68,0.962],[105,0.951]]},"c3":[-202.31,100.04,-41.44],"c2":[-198.87,143.64],"k":4,"r":[105,106,135,152,156,157,158,164,181],"rm":0},{"id":"2206.04594","t":"Field Level Neural Network Emulator for Cosmological N-body Simulations","ab":"We build a field level emulator for cosmic structure formation that is accurate in the nonlinear regime. Our emulator consists of two convolutional neural networks trained to output the nonlinear displacements and velocities of N-body simulation particles based on their linear inputs. Cosmology dependence is encoded in the form of style parameters at each layer of the neural network, enabling the emulator to effectively interpolate the outcomes of structure formation between different flat $Λ$CDM cosmologies over a wide range of background matter densities. The neural network architecture makes the model differentiable by construction, providing a powerful tool for fast field level inference. We test the accuracy of our method by considering several summary statistics, including the density power spectrum with and without redshift space distortions, the displacement power spectrum, the momentum power spectrum, the density bispectrum, halo abundances, and halo profiles with and without redshift space distortions. We compare these statistics from our emulator with the full N-body results, the COLA method, and a fiducial neural network with no cosmological dependence. We find our emulator gives accurate results down to scales of $k \\sim 1\\ \\mathrm{Mpc}^{-1}\\, h$, representing a considerable improvement over both COLA and the fiducial neural network. We also demonstrate that our emulator generalizes well to initial conditions containing primordial non-Gaussianity, without the need for any additional style parameters or retraining.","abx":0,"nw":0,"d":"2022-06-09","dq":0,"y":2022,"au":[476,1839,1522,633,1646,452],"c":74,"cs":0,"bib":"2023ApJ...952..145J","v":"Astrophysical Journal","lk":"arXiv:2206.04594","url":"https://arxiv.org/abs/2206.04594","doi":"10.3847/1538-4357/acdb6c","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["CNN","Emulators & regression ML"],"u":[]},"x":-0.0883,"yy":-0.2617,"p3":[0.5199,-0.1095,-0.1394],"sim":{"k":"e","l":[[57,0.967],[103,0.957],[45,0.953],[121,0.953],[145,0.947]]},"c3":[-136.58,-47.5,55.12],"c2":[-50.38,6.21],"k":6,"r":[106,108,109,121,124,125,133,136,158],"rm":0},{"id":"2206.04573","t":"Simple lessons from complex learning: what a neural network model learns about cosmic structure formation","ab":"We train a neural network model to predict the full phase space evolution of cosmological N-body simulations. Its success implies that the neural network model is accurately approximating the Green's function expansion that relates the initial conditions of the simulations to its outcome at later times in the deeply nonlinear regime. We test the accuracy of this approximation by assessing its performance on well understood simple cases that have either known exact solutions or well understood expansions. These scenarios include spherical configurations, isolated plane waves, and two interacting plane waves: initial conditions that are very different from the Gaussian random fields used for training. We find our model generalizes well to these well understood scenarios, demonstrating that the networks have inferred general physical principles and learned the nonlinear mode couplings from the complex, random Gaussian training data. These tests also provide a useful diagnostic for finding the model's strengths and weaknesses, and identifying strategies for model improvement. We also test the model on initial conditions that contain only transverse modes, a family of modes that differ not only in their phases but also in their evolution from the longitudinal growing modes used in the training set. When the network encounters these initial conditions that are orthogonal to the training set, the model fails completely. In addition to these simple configurations, we evaluate the model's predictions for the density, displacement, and momentum power spectra with standard initial conditions for N-body simulations. We compare these summary statistics against N-body results and an approximate, fast simulation method called COLA. Our model achieves percent level accuracy at nonlinear scales of $k\\sim 1\\ \\mathrm{Mpc}^{-1}\\, h$, representing a significant improvement over COLA.","abx":0,"nw":0,"d":"2022-06-09","dq":0,"y":2022,"au":[476,1839,1662,633,1646,1522,452],"c":4,"cs":0,"bib":"2022arXiv220604573J","v":"PNAS Nexus","lk":"arXiv:2206.04573","url":"https://arxiv.org/abs/2206.04573","doi":"10.1093/pnasnexus/pgac250","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["CNN","Emulators & regression ML"],"u":["CNN"]},"x":-0.0597,"yy":-0.237,"p3":[0.6629,-0.1545,-0.132],"sim":{"k":"e","l":[[102,0.957],[57,0.945],[134,0.943],[136,0.94],[45,0.936]]},"c3":[-123.02,-93.64,-30.65],"c2":[-127.54,-89.5],"k":6,"r":[136,158],"rm":0},{"id":"2206.01709","t":"Cosmological Information in the Marked Power Spectrum of the Galaxy Field","ab":"Marked power spectra are two-point statistics of a marked field obtained by weighting each location with a function that depends on the local density around that point. We consider marked power spectra of the galaxy field in redshift space that up-weight low density regions, and perform a Fisher matrix analysis to assess the information content of this type of statistics using the Molino mock catalogs built upon the Quijote simulations. We identify four different ways to up-weight the galaxy field, and compare the Fisher information contained in their marked power spectra to the one of the standard galaxy power spectrum, when considering monopole and quadrupole of each statistic. Our results show that each of the four marked power spectra can tighten the standard power spectrum constraints on the cosmological parameters $Ω_{\\rm m}$, $Ω_{\\rm b}$, $h$, $n_s$, $M_ν$ by $15-25\\%$ and on $σ_8$ by a factor of 2. The same analysis performed by combining the standard and four marked power spectra shows a substantial improvement compared to the power spectrum constraints that is equal to a factor of 6 for $σ_8$ and $2.5-3$ for the other parameters. Our constraints may be conservative, since the galaxy number density in the Molino catalogs is much lower than the ones in future galaxy surveys, which will allow them to probe lower density regions of the large-scale structure.","abx":0,"nw":0,"d":"2022-06-03","dq":0,"y":2022,"au":[533,633,363,1285,1267,1646,1433,209,274],"c":61,"cs":0,"bib":"2023ApJ...951...70M","v":"Astrophysical Journal","lk":"arXiv:2206.01709","url":"https://arxiv.org/abs/2206.01709","doi":"10.3847/1538-4357/acd44d","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.2041,"yy":-0.6918,"p3":[-0.335,-0.569,-0.1618],"sim":{"k":"e","l":[[150,0.942],[49,0.929],[47,0.929],[68,0.925],[62,0.924]]},"c3":[-125.26,129.08,-49.21],"c2":[-169.77,94.41],"k":4,"r":[109,129,132,135,150,153,158,163,200],"rm":0},{"id":"2206.01624","t":"Quijote-PNG: Quasi-maximum likelihood estimation of Primordial Non-Gaussianity in the non-linear dark matter density field","ab":"Future Large Scale Structure surveys are expected to improve over current bounds on primordial non-Gaussianity (PNG), with a significant impact on our understanding of early Universe physics. The level of such improvements will however strongly depend on the extent to which late time non-linearities erase the PNG signal on small scales. In this work, we show how much primordial information remains in the bispectrum of the non-linear dark matter density field by implementing a new, simulation-based, methodology for joint estimation of PNG amplitudes ($f_{\\rm NL}$) and standard $Λ$CDM parameters. The estimator is based on optimally compressed statistics, which, for a given input density field, combine power spectrum and modal bispectrum measurements, and numerically evaluate their covariance and their response to changes in cosmological parameters. We train and validate the estimator using a large suite of N-body simulations (QUIJOTE-PNG), including different types of PNG (local, equilateral, orthogonal). We explicitly test the estimator's unbiasedness, optimality and stability with respect to changes in the total number of input realizations. While the dark matter power spectrum itself contains negligible PNG information, as expected, including it as an ancillary statistic increases the PNG information content extracted from the bispectrum by a factor of order $2$. As a result, we prove the capability of our approach to optimally extract PNG information on non-linear scales beyond the perturbative regime, up to $k_{\\rm max} = 0.5~h\\,{\\rm Mpc}^{-1}$, obtaining marginalized $1$-$σ$ bounds of $Δf_{\\rm NL}^{\\rm local} \\sim 16$, $Δf_{\\rm NL}^{\\rm equil} \\sim 77$ and $Δf_{\\rm NL}^{\\rm ortho} \\sim 40$ on a cubic volume of $1~(\\mathrm{Gpc}/h)^3$ at $z=1$. At the same time, we discuss the significant information on cosmological parameters contained on these scales.","abx":0,"nw":0,"d":"2022-06-03","dq":0,"y":2022,"au":[693,467,1272,1230,1806,476,1076,633,251],"c":26,"cs":0,"bib":"2022ApJ...940...71J","v":"Astrophysical Journal","lk":"arXiv:2206.01624","url":"https://arxiv.org/abs/2206.01624","doi":"10.3847/1538-4357/ac9837","tg":{"s":["Quijote"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["Fisher forecasts","No ML"],"u":["Fisher forecasts"]},"x":0.0388,"yy":-0.4868,"p3":[0.0151,-0.6157,0.0079],"sim":{"k":"e","l":[[96,0.975],[106,0.97],[68,0.958],[101,0.951],[84,0.949]]},"c3":[-172.84,98.68,-26.53],"c2":[-136.28,155.63],"k":4,"r":[106,135,142,152,157,158],"rm":0},{"id":"2206.01619","t":"Quijote-PNG: Simulations of primordial non-Gaussianity and the information content of the matter field power spectrum and bispectrum","ab":"Primordial non-Gaussianity (PNG) is one of the most powerful probes of the early Universe and measurements of the large scale structure of the Universe have the potential to transform our understanding of this area. However relating measurements of the late time Universe to the primordial perturbations is challenging due to the non-linear processes that govern the evolution of the Universe. To help address this issue we release a large suite of N-body simulations containing four types of PNG: \\textsc{quijote-png}. These simulations were designed to augment the \\textsc{quijote} suite of simulations that explored the impact of various cosmological parameters on large scale structure observables. Using these simulations we investigate how much information on PNG can be extracted by extending power spectrum and bispectrum measurements beyond the perturbative regime at $z=0.0$. This is the first joint analysis of the PNG and cosmological information content accessible with power spectrum and bispectrum measurements of the non-linear scales. We find that the constraining power improves significantly up to $k_\\mathrm{max}\\approx 0.3 h/{\\rm Mpc}$, with diminishing returns beyond as the statistical probes signal-to-noise ratios saturate. This saturation emphasizes the importance of accurately modelling all the contributions to the covariance matrix. Further we find that combining the two probes is a powerful method of breaking the degeneracies with the $Λ$CDM parameters.","abx":0,"nw":0,"d":"2022-06-03","dq":0,"y":2022,"au":[1806,633,476,1230,693,467,1272,1076,251],"c":67,"cs":0,"bib":"2023ApJ...943...64C","v":"Astrophysical Journal","lk":"arXiv:2206.01619","url":"https://arxiv.org/abs/2206.01619","doi":"10.3847/1538-4357/aca8a7","tg":{"s":["Quijote"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.0832,"yy":-0.4836,"p3":[-0.1685,-0.7146,-0.0675],"sim":{"k":"e","l":[[105,0.97],[101,0.968],[68,0.967],[96,0.962],[84,0.955]]},"c3":[-179.76,65.76,-30.05],"c2":[-152.08,170.93],"k":4,"r":[101,105,152,155,156,157,158,160],"rm":0},{"id":"2205.07898","t":"Fast and realistic large-scale structure from machine-learning-augmented random field simulations","ab":"Producing thousands of simulations of the dark matter distribution in the Universe with increasing precision is a challenging but critical task to facilitate the exploitation of current and forthcoming cosmological surveys. Many inexpensive substitutes to full $N$-body simulations have been proposed, even though they often fail to reproduce the statistics of the smaller, non-linear scales. Among these alternatives, a common approximation is represented by the lognormal distribution, which comes with its own limitations as well, while being extremely fast to compute even for high-resolution density fields. In this work, we train a generative deep learning model, mainly made of convolutional layers, to transform projected lognormal dark matter density fields to more realistic dark matter maps, as obtained from full $N$-body simulations. We detail the procedure that we follow to generate highly correlated pairs of lognormal and simulated maps, which we use as our training data, exploiting the information of the Fourier phases. We demonstrate the performance of our model comparing various statistical tests with different field resolutions, redshifts and cosmological parameters, proving its robustness and explaining its current limitations. When evaluated on 100 test maps, the augmented lognormal random fields reproduce the power spectrum up to wavenumbers of $1 \\ h \\ \\rm{Mpc}^{-1}$, and the bispectrum within 10%, and always within the error bars, of the fiducial target simulations. Finally, we describe how we plan to integrate our proposed model with existing tools to yield more accurate spherical random fields for weak lensing analysis.","abx":0,"nw":0,"d":"2022-05-16","dq":0,"y":2022,"au":[459,252,633],"c":22,"cs":0,"bib":"2023MNRAS.520..668P","v":"arXiv.org","lk":"arXiv:2205.07898","url":"https://arxiv.org/abs/2205.07898","doi":"10.1093/mnras/stad052","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["CNN","Generative models"],"u":[]},"x":-0.1892,"yy":-0.1359,"p3":[0.5686,-0.1905,-0.0469],"sim":{"k":"e","l":[[136,0.946],[154,0.945],[45,0.943],[166,0.942],[85,0.94]]},"c3":[-43.67,-13.58,19.02],"c2":[-30.7,-39.03],"k":6,"r":[127,134,136,141,142,148,151,158],"rm":0},{"id":"2204.13713","t":"Learning cosmology and clustering with cosmic graphs","ab":"We train deep learning models on thousands of galaxy catalogues from the state-of-the-art hydrodynamic simulations of the CAMELS project to perform regression and inference. We employ Graph Neural Networks (GNNs), architectures designed to work with irregular and sparse data, like the distribution of galaxies in the Universe. We first show that GNNs can learn to compute the power spectrum of galaxy catalogues with a few percent accuracy. We then train GNNs to perform likelihood-free inference at the galaxy-field level. Our models are able to infer the value of $Ω_{\\rm m}$ with a $\\sim12\\%-13\\%$ accuracy just from the positions of $\\sim1000$ galaxies in a volume of $(25~h^{-1}{\\rm Mpc})^3$ at $z=0$ while accounting for astrophysical uncertainties as modelled in CAMELS. Incorporating information from galaxy properties, such as stellar mass, stellar metallicity, and stellar radius, increases the accuracy to $4\\%-8\\%$. Our models are built to be translational and rotational invariant, and they can extract information from any scale larger than the minimum distance between two galaxies. However, our models are not completely robust: testing on simulations run with a different subgrid physics than the ones used for training does not yield as accurate results.","abx":0,"nw":0,"d":"2022-04-28","dq":0,"y":2022,"au":[1434,633],"c":76,"cs":0,"bib":"2022ApJ...937..115V","v":"Astrophysical Journal","lk":"arXiv:2204.13713","url":"https://arxiv.org/abs/2204.13713","doi":"10.3847/1538-4357/ac8930","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":-0.1321,"yy":0.258,"p3":[-0.1978,0.0495,0.5979],"sim":{"k":"e","l":[[75,0.973],[90,0.972],[120,0.961],[141,0.96],[6,0.96]]},"c3":[-69.63,5.3,116.97],"c2":[52.23,42.32],"k":7,"r":[109,111,113,115,117,118,119,120,123,124,125,127,132,133,135,141,147,148,150,152,153,157,158,161],"rm":0},{"id":"2204.07646","t":"Wavelet Moments for Cosmological Parameter Estimation","ab":"Extracting non-Gaussian information from the non-linear regime of structure formation is key to fully exploiting the rich data from upcoming cosmological surveys probing the large-scale structure of the universe. However, due to theoretical and computational complexities, this remains one of the main challenges in analyzing observational data. We present a set of summary statistics for cosmological matter fields based on 3D wavelets to tackle this challenge. These statistics are computed as the spatial average of the complex modulus of the 3D wavelet transform raised to a power $q$ and are therefore known as invariant wavelet moments. The 3D wavelets are constructed to be radially band-limited and separable on a spherical polar grid and come in three types: isotropic, oriented, and harmonic. In the Fisher forecast framework, we evaluate the performance of these summary statistics on matter fields from the Quijote suite, where they are shown to reach state-of-the-art parameter constraints on the base $Λ$CDM parameters, as well as the sum of neutrino masses. We show that we can improve constraints by a factor 5 to 10 in all parameters with respect to the power spectrum baseline.","abx":0,"nw":0,"d":"2022-04-15","dq":0,"y":2022,"au":[1267,554,209,1433,533,1285,363,1685,274,1646,1676,910,633],"c":62,"cs":0,"bib":"2022arXiv220407646E","v":"","lk":"arXiv:2204.07646","url":"https://arxiv.org/abs/2204.07646","doi":"","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.0578,"yy":-0.7043,"p3":[0.2699,-0.4947,-0.1175],"sim":{"k":"e","l":[[148,0.952],[58,0.946],[45,0.926],[110,0.926],[49,0.926]]},"c3":[-136.01,23.15,1.28],"c2":[-111.04,55.98],"k":4,"r":[124,125,133,135,145,148,150,153,157,158,161,214,215],"rm":0},{"id":"2204.05435","t":"Quantification of high dimensional non-Gaussianities and its implication to Fisher analysis in cosmology","ab":"It is well known that the power spectrum is not able to fully characterize the statistical properties of non-Gaussian density fields. Recently, many different statistics have been proposed to extract information from non-Gaussian cosmological fields that perform better than the power spectrum. The Fisher matrix formalism is commonly used to quantify the accuracy with which a given statistic can constrain the value of the cosmological parameters. However, these calculations typically rely on the assumption that the likelihood of the considered statistic follows a multivariate Gaussian distribution. In this work we follow Sellentin & Heavens (2017) and use two different statistical tests to identify non-Gaussianities in different statistics such as the power spectrum, bispectrum, marked power spectrum, and wavelet scatering transform (WST). We remove the non-Gaussian components of the different statistics and perform Fisher matrix calculations with the \\textit{Gaussianized} statistics using Quijote simulations. We show that constraints on the parameters can change by a factor of $\\sim 2$ in some cases. We show with simple examples how statistics that do not follow a multivariate Gaussian distribution can achieve artificially tight bounds on the cosmological parameters when using the Fisher matrix formalism. We think that the non-Gaussian tests used in this work represent a powerful tool to quantify the robustness of Fisher matrix calculations and their underlying assumptions. We release the code used to compute the power spectra, bispectra, and WST that can be run on both CPUs and GPUs.","abx":0,"nw":0,"d":"2022-04-11","dq":0,"y":2022,"au":[395,554,633,474],"c":20,"cs":0,"bib":"2023ApJ...946..107P","v":"Astrophysical Journal","lk":"arXiv:2204.05435","url":"https://arxiv.org/abs/2204.05435","doi":"10.3847/1538-4357/acbe3b","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Fisher forecasts","No ML"],"u":[]},"x":-0.01,"yy":-0.6834,"p3":[0.062,-0.6581,-0.132],"sim":{"k":"e","l":[[148,0.945],[49,0.932],[106,0.929],[105,0.928],[139,0.927]]},"c3":[-100.29,127.75,-70.6],"c2":[-164.27,75.06],"k":4,"r":[132,133,135,148,150,152,153,157,158,161],"rm":0},{"id":"2204.02408","t":"Constraining cosmology with machine learning and galaxy clustering: the CAMELS-SAM suite","ab":"As the next generation of large galaxy surveys come online, it is becoming increasingly important to develop and understand the machine learning tools that analyze big astronomical data. Neural networks are powerful and capable of probing deep patterns in data, but must be trained carefully on large and representative data sets. We developed and generated a new `hump' of the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project: CAMELS-SAM, encompassing one thousand dark-matter only simulations of (100 $h^{-1}$ cMpc)$^3$ with different cosmological parameters ($Ω_m$ and $σ_8$) and run through the Santa Cruz semi-analytic model for galaxy formation over a broad range of astrophysical parameters. As a proof-of-concept for the power of this vast suite of simulated galaxies in a large volume and broad parameter space, we probe the power of simple clustering summary statistics to marginalize over astrophysics and constrain cosmology using neural networks. We use the two-point correlation function, count-in-cells, and the Void Probability Function, and probe non-linear and linear scales across $0.68<$ R $<27\\ h^{-1}$ cMpc. Our cosmological constraints cluster around 3-8$\\%$ error on $Ω_{\\text{M}}$ and $σ_8$, and we explore the effect of various galaxy selections, galaxy sampling, and choice of clustering statistics on these constraints. We additionally explore how these clustering statistics constrain and inform key stellar and galactic feedback parameters in the Santa Cruz SAM. CAMELS-SAM has been publicly released alongside the rest of CAMELS, and offers great potential to many applications of machine learning in astrophysics: https://camels-sam.readthedocs.io.","abx":0,"nw":0,"d":"2022-04-05","dq":0,"y":2022,"au":[1083,1651,633,1513,208,444,251,1056],"c":42,"cs":0,"bib":"2023ApJ...954...11P","v":"Astrophysical Journal","lk":"arXiv:2204.02408","url":"https://arxiv.org/abs/2204.02408","doi":"10.3847/1538-4357/accd52","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Simulation-based inference"],"u":["Simulation-based inference"]},"x":0.0093,"yy":0.3462,"p3":[-0.1729,0.2122,0.1433],"sim":{"k":"e","l":[[141,0.959],[108,0.959],[118,0.955],[66,0.952],[50,0.952]]},"c3":[-13.01,113.75,109.62],"c2":[130.31,87.54],"k":6,"r":[89,90,91,94,98,108,113,114,118,122,123,124,127,132,133,135,139,141,150,153,158],"rm":0},{"id":"2203.08056","t":"Machine Learning and Cosmology","ab":"Methods based on machine learning have recently made substantial inroads in many corners of cosmology. Through this process, new computational tools, new perspectives on data collection, model development, analysis, and discovery, as well as new communities and educational pathways have emerged. Despite rapid progress, substantial potential at the intersection of cosmology and machine learning remains untapped. In this white paper, we summarize current and ongoing developments relating to the application of machine learning within cosmology and provide a set of recommendations aimed at maximizing the scientific impact of these burgeoning tools over the coming decade through both technical development as well as the fostering of emerging communities.","abx":0,"nw":0,"d":"2022-03-15","dq":0,"y":2022,"au":[393,1653,271,1756,347,985,143,173,1073,698,633],"c":37,"cs":0,"bib":"2022arXiv220308056D","v":"arXiv.org","lk":"arXiv:2203.08056","url":"https://arxiv.org/abs/2203.08056","doi":"10.48550/arXiv.2203.08056","tg":{"s":["No simulations"],"d":["Surveys & instruments","AI for science"],"m":["Other ML"],"u":["Surveys & instruments","Other ML"]},"x":0.2987,"yy":0.8359,"p3":[0.3051,0.0349,0.4417],"sim":{"k":"e","l":[[8,0.945],[141,0.936],[117,0.933],[123,0.933],[22,0.931]]},"c3":[5.47,-88.23,25.18],"c2":[-8.6,-125.71],"k":1,"r":[115,117,121,123,125,136,138,140,141,147,151,158],"rm":0},{"id":"2201.04142","t":"Breaking baryon-cosmology degeneracy with the electron density power spectrum","ab":"Uncertain feedback processes in galaxies affect the distribution of matter, currently limiting the power of weak lensing surveys. If we can identify cosmological statistics that are robust against these uncertainties, or constrain these effects by other means, then we can enhance the power of current and upcoming observations from weak lensing surveys such as DES, Euclid, the Rubin Observatory, and the Roman Space Telescope. In this work, we investigate the potential of the electron density auto-power spectrum as a robust probe of cosmology and baryonic feedback. We use a suite of (magneto-)hydrodynamic simulations from the CAMELS project and perform an idealized analysis to forecast statistical uncertainties on a limited set of cosmological and physically-motivated astrophysical parameters. We find that the electron number density auto-correlation, measurable through either kinematic Sunyaev-Zel'dovich observations or through Fast Radio Burst dispersion measures, provides tight constraints on $Ω_{m}$ and the mean baryon fraction in intermediate-mass halos, $\\bar{f}_{\\mathrm{bar}}$. By obtaining an empirical measure for the associated systematic uncertainties, we find these constraints to be largely robust to differences in baryonic feedback models implemented in hydrodynamic simulations. We further discuss the main caveats associated with our analysis, and point out possible directions for future work.","abx":0,"nw":0,"d":"2022-01-11","dq":0,"y":2022,"au":[178,633,452,909,444,1533,1651,1061,441,1513,251],"c":37,"cs":0,"bib":"2022JCAP...04..046N","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2201.04142","url":"https://arxiv.org/abs/2201.04142","doi":"10.1088/1475-7516/2022/04/046","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback","CMB & SZ"],"m":["Fisher forecasts","No ML"],"u":[]},"x":-0.0454,"yy":0.8426,"p3":[-0.6016,0.0613,0.1799],"sim":{"k":"e","l":[[99,0.94],[92,0.939],[116,0.938],[67,0.937],[71,0.936]]},"c3":[81.0,94.31,159.21],"c2":[212.99,49.76],"k":5,"r":[124,125,139,141],"rm":0},{"id":"2201.02708","t":"The Circumgalactic Medium from the CAMELS Simulations: Forecasting Constraints on Feedback Processes from Future Sunyaev-Zeldovich Observations","ab":"The cycle of baryons through the circumgalactic medium (CGM) is important to understand in the context of galaxy formation and evolution. In this study we forecast constraints on the feedback processes heating the CGM with current and future Sunyaev-Zeldovich (SZ) observations. To constrain these processes, we use a suite of cosmological simulations, the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS), that varies four different feedback parameters of two previously existing hydrodynamical simulations, IllustrisTNG and SIMBA. We capture the dependencies of SZ radial profiles on these feedback parameters with an emulator, calculate their derivatives, and forecast future constraints on these feedback parameters from upcoming experiments. We find that for a DESI-like (Dark Energy Spectroscopic Instrument) galaxy sample observed by the Simons Observatory all four feedback parameters are able to be constrained (some within the $10\\%$ level), indicating that future observations will be able to further restrict the parameter space for these sub-grid models. Given the modeled galaxy sample and forecasted errors in this work, we find that the inner SZ profiles contribute more to the constraining power than the outer profiles. Finally, we find that, despite the wide range of AGN feedback parameter variation in the CAMELS simulation suite, we cannot reproduce the tSZ signal of galaxies selected by the Baryon Oscillation Spectroscopic Survey as measured by the Atacama Cosmology Telescope.","abx":0,"nw":0,"d":"2022-01-07","dq":0,"y":2022,"au":[546,1325,441,555,1087,633,1671,444,713,1533,1061,1243],"c":41,"cs":0,"bib":"2022ApJ...933..133M","v":"Astrophysical Journal","lk":"arXiv:2201.02708","url":"https://arxiv.org/abs/2201.02708","doi":"10.3847/1538-4357/ac70c6","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","CMB & SZ","Surveys & instruments"],"m":["Emulators & regression ML","Fisher forecasts"],"u":["Emulators & regression ML"]},"x":-0.1418,"yy":0.793,"p3":[-0.6677,0.1461,0.1914],"sim":{"k":"e","l":[[48,0.956],[67,0.955],[52,0.954],[116,0.95],[92,0.947]]},"c3":[135.99,102.44,119.8],"c2":[243.91,8.92],"k":5,"r":[118,141],"rm":0},{"id":"2201.02202","t":"Cosmology with one galaxy?","ab":"Galaxies can be characterized by many internal properties such as stellar mass, gas metallicity, and star-formation rate. We quantify the amount of cosmological and astrophysical information that the internal properties of individual galaxies and their host dark matter halos contain. We train neural networks using hundreds of thousands of galaxies from 2,000 state-of-the-art hydrodynamic simulations with different cosmologies and astrophysical models of the CAMELS project to perform likelihood-free inference on the value of the cosmological and astrophysical parameters. We find that knowing the internal properties of a single galaxy allow our models to infer the value of $Ω_{\\rm m}$, at fixed $Ω_{\\rm b}$, with a $\\sim10\\%$ precision, while no constraint can be placed on $σ_8$. Our results hold for any type of galaxy, central or satellite, massive or dwarf, at all considered redshifts, $z\\leq3$, and they incorporate uncertainties in astrophysics as modeled in CAMELS. However, our models are not robust to changes in subgrid physics due to the large intrinsic differences the two considered models imprint on galaxy properties. We find that the stellar mass, stellar metallicity, and maximum circular velocity are among the most important galaxy properties to determine the value of $Ω_{\\rm m}$. We believe that our results can be explained taking into account that changes in the value of $Ω_{\\rm m}$, or potentially $Ω_{\\rm b}/Ω_{\\rm m}$, affect the dark matter content of galaxies. That effect leaves a distinct signature in galaxy properties to the one induced by galactic processes. Our results suggest that the low-dimensional manifold hosting galaxy properties provides a tight direct link between cosmology and astrophysics.","abx":0,"nw":0,"d":"2022-01-06","dq":0,"y":2022,"au":[633,947,1651,1678,1777,452,1530,1839,355,1433,444,441,1243],"c":63,"cs":0,"bib":"2022ApJ...929..132V","v":"Astrophysical Journal","lk":"arXiv:2201.02202","url":"https://arxiv.org/abs/2201.02202","doi":"10.3847/1538-4357/ac5d3f","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Simulation-based inference"],"u":[]},"x":-0.3245,"yy":0.4365,"p3":[0.2946,0.176,0.6968],"sim":{"k":"e","l":[[77,0.967],[76,0.957],[43,0.953],[86,0.95],[125,0.949]]},"c3":[18.7,56.01,67.74],"c2":[66.32,-42.17],"k":7,"r":[124,125,127,132,133,135,141,148,150,152,153,157,158,161],"rm":0},{"id":"2201.01663","t":"Percent-level constraints on baryonic feedback with spectral distortion measurements","ab":"High-significance measurements of the monopole thermal Sunyaev-Zel'dovich CMB spectral distortions have the potential to tightly constrain poorly understood baryonic feedback processes. The sky-averaged Compton-y distortion and its relativistic correction are measures of the total thermal energy in electrons in the observable universe and their mean temperature. We use the CAMELS suite of hydrodynamic simulations to explore possible constraints on parameters describing the subgrid implementation of feedback from active galactic nuclei and supernovae, assuming a PIXIE-like measurement. The small 25 Mpc/h CAMELS boxes present challenges due to the significant cosmic variance. We utilize machine learning to construct interpolators through the noisy simulation data. Using the halo model, we translate the simulation halo mass functions into correction factors to reduce cosmic variance where required. Our results depend on the subgrid model. In the case of IllustrisTNG, we find that the best-determined parameter combination can be measured to ~2% and corresponds to a product of AGN and SN feedback. In the case of SIMBA, the tightest constraint is ~0.2% on a ratio between AGN and SN feedback. A second orthogonal parameter combination can be measured to ~8%. Our results demonstrate the significant constraining power a measurement of the late-time spectral distortion monopoles would have for baryonic feedback models.","abx":0,"nw":0,"d":"2022-01-05","dq":0,"y":2022,"au":[1072,465,820,1325,896,633,1061,1243,444,627],"c":22,"cs":0,"bib":"2022PhRvD.105h3505T","v":"Physical Review D","lk":"arXiv:2201.01663","url":"https://arxiv.org/abs/2201.01663","doi":"10.1103/PhysRevD.105.083505","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","CMB & SZ"],"m":["Emulators & regression ML","Perturbation theory & analytic models"],"u":[]},"x":-0.0936,"yy":0.7768,"p3":[-0.5182,0.1171,0.257],"sim":{"k":"e","l":[[67,0.953],[52,0.951],[114,0.95],[6,0.947],[111,0.947]]},"c3":[150.89,-1.74,102.1],"c2":[179.5,-126.69],"k":5,"r":[114,117,127,138,141],"rm":0},{"id":"2201.01305","t":"Augmenting astrophysical scaling relations with machine learning: application to reducing the Sunyaev-Zeldovich flux-mass scatter","ab":"Complex astrophysical systems often exhibit low-scatter relations between observable properties (e.g., luminosity, velocity dispersion, oscillation period). These scaling relations illuminate the underlying physics, and can provide observational tools for estimating masses and distances. Machine learning can provide a fast and systematic way to search for new scaling relations (or for simple extensions to existing relations) in abstract high-dimensional parameter spaces. We use a machine learning tool called symbolic regression (SR), which models patterns in a dataset in the form of analytic equations. We focus on the Sunyaev-Zeldovich flux$-$cluster mass relation ($Y_\\mathrm{SZ}-M$), the scatter in which affects inference of cosmological parameters from cluster abundance data. Using SR on the data from the IllustrisTNG hydrodynamical simulation, we find a new proxy for cluster mass which combines $Y_\\mathrm{SZ}$ and concentration of ionized gas ($c_\\mathrm{gas}$): $M \\propto Y_\\mathrm{conc}^{3/5} \\equiv Y_\\mathrm{SZ}^{3/5} (1-A\\, c_\\mathrm{gas})$. $Y_\\mathrm{conc}$ reduces the scatter in the predicted $M$ by $\\sim 20-30$\\% for large clusters ($M\\gtrsim 10^{14}\\, h^{-1} \\, M_\\odot$), as compared to using just $Y_\\mathrm{SZ}$. We show that the dependence on $c_\\mathrm{gas}$ is linked to cores of clusters exhibiting larger scatter than their outskirts. Finally, we test $Y_\\mathrm{conc}$ on clusters from CAMELS simulations and show that $Y_\\mathrm{conc}$ is robust against variations in cosmology, subgrid physics, and cosmic variance. Our results and methodology can be useful for accurate multiwavelength cluster mass estimation from upcoming CMB and X-ray surveys like ACT, SO, eROSITA and CMB-S4.","abx":0,"nw":0,"d":"2022-01-04","dq":0,"y":2022,"au":[465,1072,633,820,1280,452,1325,444,1061,1646],"c":31,"cs":0,"bib":"2023PNAS..12002074W","v":"Proceedings of the National Academy of Sciences of the United States of America","lk":"arXiv:2201.01305","url":"https://arxiv.org/abs/2201.01305","doi":"10.1073/pnas.2202074120","tg":{"s":["CAMELS","Other simulations"],"d":["Galaxies & baryonic feedback","CMB & SZ"],"m":["Symbolic regression"],"u":[]},"x":0.1664,"yy":0.7877,"p3":[-0.1162,0.0566,0.217],"sim":{"k":"e","l":[[127,0.947],[99,0.938],[112,0.933],[111,0.932],[89,0.925]]},"c3":[78.48,-86.61,80.93],"c2":[66.65,-140.36],"k":7,"r":[99,120,121,123,124,125,127,129,131,138,141,145,146,151,154,155,162,166],"rm":0},{"id":"2201.01300","t":"The CAMELS project: public data release","ab":"The Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project was developed to combine cosmology with astrophysics through thousands of cosmological hydrodynamic simulations and machine learning. CAMELS contains 4,233 cosmological simulations, 2,049 N-body and 2,184 state-of-the-art hydrodynamic simulations that sample a vast volume in parameter space. In this paper we present the CAMELS public data release, describing the characteristics of the CAMELS simulations and a variety of data products generated from them, including halo, subhalo, galaxy, and void catalogues, power spectra, bispectra, Lyman-$α$ spectra, probability distribution functions, halo radial profiles, and X-rays photon lists. We also release over one thousand catalogues that contain billions of galaxies from CAMELS-SAM: a large collection of N-body simulations that have been combined with the Santa Cruz Semi-Analytic Model. We release all the data, comprising more than 350 terabytes and containing 143,922 snapshots, millions of halos, galaxies and summary statistics. We provide further technical details on how to access, download, read, and process the data at \\url{https://camels.readthedocs.io}.","abx":0,"nw":0,"d":"2022-01-04","dq":0,"y":2022,"au":[633,1651,444,1083,1434,465,753,626,1685,546,555,1087,178,1072,1842,1356,250,1264,363,1321,153,1256,162,937,376,983,1806,1267,678,1848,1751,1777,1533,1325,441,452,1061,264,462,251,1513,713,1254,1839,1783,981,1243],"c":122,"cs":0,"bib":"2023ApJS..265...54V","v":"Astrophysical Journal Supplement Series","lk":"arXiv:2201.01300","url":"https://arxiv.org/abs/2201.01300","doi":"10.3847/1538-4365/acbf47","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["No ML"],"u":[],"n":"data release paper"},"x":-0.128,"yy":0.4666,"p3":[0.039,0.337,0.3476],"sim":{"k":"e","l":[[141,0.973],[87,0.965],[6,0.96],[123,0.957],[111,0.955]]},"c3":[53.88,22.23,55.04],"c2":[86.56,-14.41],"k":7,"r":[113,114,115,116,117,119,120,121,122,123,124,125,126,127,129,130,132,134,135,136,137,138,139,140,141,145,146,147,148,150,151,152,153,154,155,157,158,162,166,209],"rm":0},{"id":"2111.14874","t":"Weighing the Milky Way and Andromeda with Artificial Intelligence","ab":"We present new constraints on the masses of the halos hosting the Milky Way and Andromeda galaxies derived using graph neural networks. Our models, trained on thousands of state-of-the-art hydrodynamic simulations of the CAMELS project, only make use of the positions, velocities and stellar masses of the galaxies belonging to the halos, and are able to perform likelihood-free inference on halo masses while accounting for both cosmological and astrophysical uncertainties. Our constraints are in agreement with estimates from other traditional methods.","abx":0,"nw":0,"d":"2021-11-29","dq":0,"y":2021,"au":[1434,633,1651,444,1061,627,452,1243,462],"c":32,"cs":0,"bib":"2023PhRvD.107j3003V","v":"arXiv.org","lk":"arXiv:2111.14874","url":"https://arxiv.org/abs/2111.14874","doi":"10.48550/arXiv.2111.14874","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":-0.2245,"yy":0.2224,"p3":[-0.0183,0.0125,0.5919],"sim":{"k":"e","l":[[90,0.95],[108,0.949],[6,0.945],[124,0.942],[141,0.941]]},"c3":[-37.8,-42.31,159.94],"c2":[99.2,17.57],"k":7,"r":[98,108,118,120,123,141],"rm":0},{"id":"2111.08683","t":"Inferring halo masses with Graph Neural Networks","ab":"Understanding the halo-galaxy connection is fundamental in order to improve our knowledge on the nature and properties of dark matter. In this work we build a model that infers the mass of a halo given the positions, velocities, stellar masses, and radii of the galaxies it hosts. In order to capture information from correlations among galaxy properties and their phase-space, we use Graph Neural Networks (GNNs), that are designed to work with irregular and sparse data. We train our models on galaxies from more than 2,000 state-of-the-art simulations from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project. Our model, that accounts for cosmological and astrophysical uncertainties, is able to constrain the masses of the halos with a $\\sim$0.2 dex accuracy. Furthermore, a GNN trained on a suite of simulations is able to preserve part of its accuracy when tested on simulations run with a different code that utilizes a distinct subgrid physics model, showing the robustness of our method. The PyTorch Geometric implementation of the GNN is publicly available on Github at https://github.com/PabloVD/HaloGraphNet","abx":0,"nw":0,"d":"2021-11-16","dq":0,"y":2021,"au":[1434,633,444,1651,627,452,1061,1243,1533,462],"c":56,"cs":0,"bib":"2022ApJ...935...30V","v":"Astrophysical Journal","lk":"arXiv:2111.08683","url":"https://arxiv.org/abs/2111.08683","doi":"10.3847/1538-4357/ac7aa3","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Graph neural networks"],"u":[]},"x":0.0174,"yy":0.1914,"p3":[-0.1147,0.0403,0.6261],"sim":{"k":"e","l":[[98,0.962],[108,0.961],[18,0.958],[89,0.957],[23,0.955]]},"c3":[1.08,-93.09,134.54],"c2":[107.99,-61.65],"k":7,"r":[108,117,118,119,123,127,138,141,147],"rm":0},{"id":"2111.02441","t":"NECOLA: Towards a Universal Field-level Cosmological Emulator","ab":"We train convolutional neural networks to correct the output of fast and approximate N-body simulations at the field level. Our model, Neural Enhanced COLA --NECOLA--, takes as input a snapshot generated by the computationally efficient COLA code and corrects the positions of the cold dark matter particles to match the results of full N-body Quijote simulations. We quantify the accuracy of the network using several summary statistics, and find that NECOLA can reproduce the results of the full N-body simulations with sub-percent accuracy down to $k\\simeq1~h{\\rm Mpc}^{-1}$. Furthermore, the model, that was trained on simulations with a fixed value of the cosmological parameters, is also able to correct the output of COLA simulations with different values of $Ω_{\\rm m}$, $Ω_{\\rm b}$, $h$, $n_s$, $σ_8$, $w$, and $M_ν$ with very high accuracy: the power spectrum and the cross-correlation coefficients are within $\\simeq1\\%$ down to $k=1~h{\\rm Mpc}^{-1}$. Our results indicate that the correction to the power spectrum from fast/approximate simulations or field-level perturbation theory is rather universal. Our model represents a first step towards the development of a fast field-level emulator to sample not only primordial mode amplitudes and phases, but also the parameter space defined by the values of the cosmological parameters.","abx":0,"nw":0,"d":"2021-11-03","dq":0,"y":2021,"au":[1321,633,530,1839,391,1261],"c":40,"cs":0,"bib":"2022ApJ...930..115K","v":"Astrophysical Journal","lk":"arXiv:2111.02441","url":"https://arxiv.org/abs/2111.02441","doi":"10.3847/1538-4357/ac5c4a","tg":{"s":["Quijote","Other simulations"],"d":["Large-scale structure"],"m":["CNN","Emulators & regression ML"],"u":[]},"x":-0.1796,"yy":-0.2738,"p3":[0.3831,-0.1379,0.0392],"sim":{"k":"e","l":[[102,0.953],[25,0.952],[89,0.949],[45,0.946],[85,0.943]]},"c3":[-82.2,-34.92,-64.67],"c2":[-125.97,-21.93],"k":6,"r":[132,133,135,136,148,150,152,153,155,157,158,161,206,214,215],"rm":0},{"id":"2110.02983","t":"HIFlow: Generating Diverse HI Maps and Inferring Cosmology while Marginalizing over Astrophysics using Normalizing Flows","ab":"A wealth of cosmological and astrophysical information is expected from many ongoing and upcoming large-scale surveys. It is crucial to prepare for these surveys now and develop tools that can efficiently extract most information. We present HIFlow: a fast generative model of the neutral hydrogen (HI) maps that is conditioned only on cosmology ($Ω_{m}$ and $σ_{8}$) and designed using a class of normalizing flow models, the Masked Autoregressive Flow (MAF). HIFlow is trained on the state-of-the-art simulations from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project. HIFlow has the ability to generate realistic diverse maps without explicitly incorporating the expected 2D maps structure into the flow as an inductive bias. We find that HIFlow is able to reproduce the CAMELS average and standard deviation HI power spectrum (Pk) within a factor of $\\lesssim$ 2, scoring a very high $R^{2} > 90\\%$. By inverting the flow, HIFlow provides a tractable high-dimensional likelihood for efficient parameter inference. We show that the conditional HIFlow on cosmology is successfully able to marginalize over astrophysics at the field level, regardless of the stellar and AGN feedback strengths. This new tool represents a first step toward a more powerful parameter inference, maximizing the scientific return of future HI surveys, and opening a new avenue to minimize the loss of complex information due to data compression down to summary statistics.","abx":0,"nw":0,"d":"2021-10-06","dq":0,"y":2021,"au":[1685,633,251,452,444,1651,1280,713,1533,1513,1267,462,1646,1629],"c":46,"cs":0,"bib":"2022ApJ...937...83H","v":"Astrophysical Journal","lk":"arXiv:2110.02983","url":"https://arxiv.org/abs/2110.02983","doi":"10.3847/1538-4357/ac8b09","tg":{"s":["CAMELS"],"d":["Neutral hydrogen & 21cm"],"m":["Normalizing flows","Generative models"],"u":[]},"x":-0.3572,"yy":0.0639,"p3":[0.2013,0.2871,0.23],"sim":{"k":"e","l":[[162,0.955],[46,0.944],[111,0.944],[10,0.943],[141,0.942]]},"c3":[76.24,31.93,86.66],"c2":[96.31,-40.85],"k":6,"r":[123,124,125,128,141,145,147],"rm":0},{"id":"2109.10915","t":"The CAMELS Multifield Dataset: Learning the Universe's Fundamental Parameters with Artificial Intelligence","ab":"We present the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) Multifield Dataset, CMD, a collection of hundreds of thousands of 2D maps and 3D grids containing many different properties of cosmic gas, dark matter, and stars from 2,000 distinct simulated universes at several cosmic times. The 2D maps and 3D grids represent cosmic regions that span $\\sim$100 million light years and have been generated from thousands of state-of-the-art hydrodynamic and gravity-only N-body simulations from the CAMELS project. Designed to train machine learning models, CMD is the largest dataset of its kind containing more than 70 Terabytes of data. In this paper we describe CMD in detail and outline a few of its applications. We focus our attention on one such task, parameter inference, formulating the problems we face as a challenge to the community. We release all data and provide further technical details at https://camels-multifield-dataset.readthedocs.io.","abx":0,"nw":0,"d":"2021-09-22","dq":0,"y":2021,"au":[633,1651,444,1072,1533,462,178,1839,1434,251,452,1513,929,626,1685,753,465,1267,983,694,1842,546,555,1087,1083,441,1325,1243],"c":98,"cs":0,"bib":"2022ApJS..259...61V","v":"Astrophysical Journal Supplement Series","lk":"arXiv:2109.10915","url":"https://arxiv.org/abs/2109.10915","doi":"10.3847/1538-4365/ac5ab0","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["CNN","Simulation-based inference"],"u":["CNN","Simulation-based inference"]},"x":-0.3387,"yy":0.3085,"p3":[0.2627,0.201,0.4929],"sim":{"k":"e","l":[[125,0.963],[141,0.962],[118,0.957],[87,0.948],[90,0.946]]},"c3":[12.36,-60.22,92.41],"c2":[33.26,-40.37],"k":7,"r":[119,120,124,125,134,136,137,138,139,140,141,145,146,147,151,154,155,166,180],"rm":0},{"id":"2109.10360","t":"Robust marginalization of baryonic effects for cosmological inference at the field level","ab":"We train neural networks to perform likelihood-free inference from $(25\\,h^{-1}{\\rm Mpc})^2$ 2D maps containing the total mass surface density from thousands of hydrodynamic simulations of the CAMELS project. We show that the networks can extract information beyond one-point functions and power spectra from all resolved scales ($\\gtrsim 100\\,h^{-1}{\\rm kpc}$) while performing a robust marginalization over baryonic physics at the field level: the model can infer the value of $Ω_{\\rm m} (\\pm 4\\%)$ and $σ_8 (\\pm 2.5\\%)$ from simulations completely different to the ones used to train it.","abx":0,"nw":0,"d":"2021-09-21","dq":0,"y":2021,"au":[633,1651,444,452,1839,251,1072,178,929,753,1685,462,1533,1243],"c":58,"cs":0,"bib":"2021arXiv210910360V","v":"arXiv.org","lk":"arXiv:2109.10360","url":"https://arxiv.org/abs/2109.10360","doi":"10.48550/arXiv.2109.10360","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["CNN","Simulation-based inference"],"u":["CNN"]},"x":-0.2579,"yy":0.2912,"p3":[0.1671,-0.1802,0.4903],"sim":{"k":"e","l":[[90,0.955],[125,0.952],[75,0.95],[76,0.949],[10,0.949]]},"c3":[-4.99,33.36,176.13],"c2":[145.65,46.92],"k":7,"r":[125,139,141],"rm":0},{"id":"2109.09747","t":"Multifield Cosmology with Artificial Intelligence","ab":"Astrophysical processes such as feedback from supernovae and active galactic nuclei modify the properties and spatial distribution of dark matter, gas, and galaxies in a poorly understood way. This uncertainty is one of the main theoretical obstacles to extract information from cosmological surveys. We use 2,000 state-of-the-art hydrodynamic simulations from the CAMELS project spanning a wide variety of cosmological and astrophysical models and generate hundreds of thousands of 2-dimensional maps for 13 different fields: from dark matter to gas and stellar properties. We use these maps to train convolutional neural networks to extract the maximum amount of cosmological information while marginalizing over astrophysical effects at the field level. Although our maps only cover a small area of $(25~h^{-1}{\\rm Mpc})^2$, and the different fields are contaminated by astrophysical effects in very different ways, our networks can infer the values of $Ω_{\\rm m}$ and $σ_8$ with a few percent level precision for most of the fields. We find that the marginalization performed by the network retains a wealth of cosmological information compared to a model trained on maps from gravity-only N-body simulations that are not contaminated by astrophysical effects. Finally, we train our networks on multifields -- 2D maps that contain several fields as different colors or channels -- and find that not only they can infer the value of all parameters with higher accuracy than networks trained on individual fields, but they can constrain the value of $Ω_{\\rm m}$ with higher accuracy than the maps from the N-body simulations.","abx":0,"nw":0,"d":"2021-09-20","dq":0,"y":2021,"au":[633,444,1651,452,1839,251,178,1072,1685,929,462,1533,1243],"c":82,"cs":0,"bib":"2021arXiv210909747V","v":"arXiv.org","lk":"arXiv:2109.09747","url":"https://arxiv.org/abs/2109.09747","doi":"10.48550/arXiv.2109.09747","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["CNN","Simulation-based inference"],"u":["Simulation-based inference"]},"x":-0.3224,"yy":0.2849,"p3":[0.3216,-0.1258,0.5311],"sim":{"k":"e","l":[[123,0.963],[90,0.954],[69,0.953],[124,0.952],[98,0.952]]},"c3":[-15.08,45.63,113.15],"c2":[53.14,-12.76],"k":7,"r":[124,132,133,139,141,148,150,152,153,157,158,161],"rm":0},{"id":"2109.07070","t":"Inpainting hydrodynamical maps with deep learning","ab":"From 1,000 hydrodynamic simulations of the CAMELS project, each with a different value of the cosmological and astrophysical parameters, we generate 15,000 gas temperature maps. We use a state-of-the-art deep convolutional neural network to recover missing data from those maps. We mimic the missing data by applying regular and irregular binary masks that cover either $15\\%$ or $30\\%$ of the area of each map. We quantify the reliability of our results using two summary statistics: 1) the distance between the probability density functions (pdf), estimated using the Kolmogorov-Smirnov (KS) test, and 2) the 2D power spectrum. We find an excellent agreement between the model prediction and the unmasked maps when using the power spectrum: better than $1\\%$ for $k<20 h/$Mpc for any irregular mask. For regular masks, we observe a systematic offset of $\\sim5\\%$ when covering $15\\%$ of the maps while the results become unreliable when $30\\%$ of the data is missing. The observed KS-test p-values favor the null hypothesis that the reconstructed and the ground-truth maps are drawn from the same underlying distribution when irregular masks are used. For regular-shaped masks on the other hand, we find a strong evidence that the two distributions do not match each other. Finally, we use the model, trained on gas temperature maps, to perform inpainting on maps from completely different fields such as gas mass, gas pressure, and electron density and also for gas temperature maps from simulations run with other codes. We find that visually, our model is able to reconstruct the missing pixels from the maps of those fields with great accuracy, although its performance using summary statistics depends strongly on the considered field.","abx":0,"nw":0,"d":"2021-09-15","dq":0,"y":2021,"au":[626,633,1651,444,1243],"c":7,"cs":0,"bib":"2022ApJ...941..132M","v":"Astrophysical Journal","lk":"arXiv:2109.07070","url":"https://arxiv.org/abs/2109.07070","doi":"10.3847/1538-4357/ac9f14","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["CNN"],"u":[]},"x":-0.4339,"yy":0.2313,"p3":[0.3235,-0.2411,0.4563],"sim":{"k":"e","l":[[97,0.946],[125,0.942],[124,0.936],[38,0.931],[75,0.93]]},"c3":[6.07,66.69,-29.14],"c2":[-42.11,29.94],"k":7,"r":[118,123,132,133,135,141,148,150,152,153,157,158,161,171],"rm":0},{"id":"2109.04484","t":"Finding universal relations in subhalo properties with artificial intelligence","ab":"We use a generic formalism designed to search for relations in high-dimensional spaces to determine if the total mass of a subhalo can be predicted from other internal properties such as velocity dispersion, radius, or star-formation rate. We train neural networks using data from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project and show that the model can predict the total mass of a subhalo with high accuracy: more than 99% of the subhalos have a predicted mass within 0.2 dex of their true value. The networks exhibit surprising extrapolation properties, being able to accurately predict the total mass of any type of subhalo containing any kind of galaxy at any redshift from simulations with different cosmologies, astrophysics models, subgrid physics, volumes, and resolutions, indicating that the network may have found a universal relation. We then use different methods to find equations that approximate the relation found by the networks and derive new analytic expressions that predict the total mass of a subhalo from its radius, velocity dispersion, and maximum circular velocity. We show that in some regimes, the analytic expressions are more accurate than the neural networks. We interpret the relation found by the neural network and approximated by the analytic equation as being connected to the virial theorem.","abx":0,"nw":0,"d":"2021-09-09","dq":0,"y":2021,"au":[753,633,1651,452,444,1061,1533,462,694,1243],"c":35,"cs":0,"bib":"2022ApJ...927...85S","v":"Astrophysical Journal","lk":"arXiv:2109.04484","url":"https://arxiv.org/abs/2109.04484","doi":"10.3847/1538-4357/ac4d30","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Emulators & regression ML","Symbolic regression"],"u":["Symbolic regression"]},"x":0.1519,"yy":0.7679,"p3":[-0.1539,0.1386,0.254],"sim":{"k":"e","l":[[117,0.947],[89,0.944],[111,0.937],[99,0.937],[136,0.935]]},"c3":[83.01,-18.09,103.06],"c2":[134.76,-52.24],"k":7,"r":[139,141,145],"rm":0},{"id":"2109.03840","t":"Reionization with Simba: How much does astrophysics matter in modeling cosmic reionization?","ab":"Traditional large-scale models of reionization usually employ simple deterministic relations between halo mass and luminosity to predict how reionization proceeds. We here examine the impact on modelling reionization of using more detailed models for the ionizing sources as identified within the $100~{\\rm Mpc/h}$ cosmological hydrodynamic simulation {\\sc Simba}, coupled with post-processed radiative transfer. Comparing with simple (one-to-one) models, the main difference of using {\\sc Simba} sources is the scatter in the relation between dark matter halos and star formation, and hence ionizing emissivity. We find that, at the power spectrum level, the ionization morphology remains mostly unchanged, regardless of the variability in the number of sources or escape fraction. In particular, the power spectrum shape remains unaffected and its amplitude changes slightly by less than 5-10\\%, throughout reionization, depending on the scale and neutral fraction. Our results show that simplified models of ionizing sources remain viable to efficiently model the structure of reionization on cosmological scales, although the precise progress of reionization requires accounting for the scatter induced by astrophysical effects.","abx":0,"nw":0,"d":"2021-09-08","dq":0,"y":2021,"au":[1685,1533,1258,1513,1064,444,633,452],"c":19,"cs":0,"bib":"2022ApJ...931...62H","v":"Astrophysical Journal","lk":"arXiv:2109.03840","url":"https://arxiv.org/abs/2109.03840","doi":"10.3847/1538-4357/ac69e2","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["No ML"],"u":[]},"x":-0.663,"yy":-0.2867,"p3":[0.2258,0.1527,-0.5167],"sim":{"k":"e","l":[[210,0.936],[199,0.935],[202,0.932],[189,0.932],[42,0.929]]},"c3":[151.83,-72.52,105.66],"c2":[86.49,-176.89],"k":2,"r":[],"rm":0},{"id":"2107.02304","t":"The GIGANTES dataset: precision cosmology from voids in the machine learning era","ab":"We present GIGANTES, the most extensive and realistic void catalog suite ever released -- containing over 1 billion cosmic voids covering a volume larger than the observable Universe, more than 20 TB of data, and created by running the void finder VIDE on QUIJOTE's halo simulations. The expansive and detailed GIGANTES suite, spanning thousands of cosmological models, opens up the study of voids, answering compelling questions: Do voids carry unique cosmological information? How is this information correlated with galaxy information? Leveraging the large number of voids in the GIGANTES suite, our Fisher constraints demonstrate voids contain additional information, critically tightening constraints on cosmological parameters. We use traditional void summary statistics (void size function, void density profile) and the void auto-correlation function, which independently yields an error of $0.13\\,\\mathrm{eV}$ on $\\sum\\,m_ν$ for a 1 $h^{-3}\\mathrm{Gpc}^3$ simulation, without CMB priors. Combining halos and voids we forecast an error of $0.09\\,\\mathrm{eV}$ from the same volume. Extrapolating to next generation multi-Gpc$^3$ surveys such as DESI, Euclid, SPHEREx, and the Roman Space Telescope, we expect voids should yield an independent determination of neutrino mass. Crucially, GIGANTES is the first void catalog suite expressly built for intensive machine learning exploration. We illustrate this by training a neural network to perform likelihood-free inference on the void size function. Cosmology problems provide an impetus to develop novel deep learning techniques, leveraging the symmetries embedded throughout the universe from physical laws, interpreting models, and accurately predicting errors. With GIGANTES, machine learning gains an impressive dataset, offering unique problems that will stimulate new techniques.","abx":0,"nw":0,"d":"2021-07-05","dq":0,"y":2021,"au":[376,153,633,452,251,1327,134],"c":82,"cs":0,"bib":"2022ApJ...935..100K","v":"Astrophysical Journal","lk":"arXiv:2107.02304","url":"https://arxiv.org/abs/2107.02304","doi":"10.3847/1538-4357/ac7d4b","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos"],"m":["Simulation-based inference","Fisher forecasts"],"u":[]},"x":0.3348,"yy":0.2427,"p3":[-0.4119,0.1842,-0.1822],"sim":{"k":"e","l":[[93,0.976],[163,0.954],[158,0.953],[111,0.951],[209,0.943]]},"c3":[-13.65,65.21,-67.93],"c2":[-119.54,13.42],"k":6,"r":[131,132,133,134,135,136,139,142,143,144,148,149,150,151,152,153,155,157,158,161,163,200,209,217],"rm":0},{"id":"2105.11444","t":"MillimeterDL: Deep Learning Simulations of the Microwave Sky","ab":"We present 500 high-resolution, full-sky millimeter-wave Deep Learning (DL) simulations that include lensed CMB maps and correlated foreground components. We find that these MillimeterDL simulations can reproduce a wide range of non-Gaussian summary statistics matching the input training simulations, while only being optimized to match the power spectra. The procedure we develop in this work enables the capability to mass produce independent full-sky realizations from a single expensive full-sky simulation, when ordinarily the latter would not provide enough training data. We also circumvent a common limitation of high-resolution DL simulations that they be confined to small sky areas, often due to memory or GPU issues; we do this by developing a \"stitching\" procedure that can faithfully recover the high-order statistics of a full-sky map without discontinuities or repeated features. In addition, since our network takes as input a full-sky lensing convergence map, it can in principle take a full-sky lensing convergence map from any large-scale structure (LSS) simulation and generate the corresponding lensed CMB and correlated foreground components at millimeter wavelengths; this is especially useful in the current era of combining results from both CMB and LSS surveys, which require a common set of simulations.","abx":0,"nw":0,"d":"2021-05-24","dq":0,"y":2021,"au":[471,1320,633],"c":26,"cs":0,"bib":"2021PhRvD.104l3521H","v":"Physical Review D","lk":"arXiv:2105.11444","url":"https://arxiv.org/abs/2105.11444","doi":"10.1103/PhysRevD.104.123521","tg":{"s":["Other simulations"],"d":["CMB & SZ"],"m":["CNN","Generative models"],"u":["CNN"]},"x":-0.3136,"yy":-0.2794,"p3":[0.4353,0.352,0.0262],"sim":{"k":"e","l":[[25,0.943],[85,0.94],[140,0.939],[26,0.935],[136,0.935]]},"c3":[54.97,-9.41,-5.54],"c2":[6.24,-65.15],"k":6,"r":[134,136,138,139],"rm":0},{"id":"2103.12099","t":"Detecting the radiative decay of the cosmic neutrino background with line-intensity mapping","ab":"We study the possibility to use line-intensity mapping (LIM) to seek photons from the radiative decay of neutrinos in the cosmic neutrino background. The Standard Model prediction for the rate for these decays is extremely small, but it can be enhanced if new physics increases the neutrino electromagnetic moments. The decay photons will appear as an interloper of astrophysical spectral lines. We propose that the neutrino-decay line can be identified with anisotropies in LIM clustering and also with the voxel intensity distribution. Ongoing and future LIM experiments will have -- depending on the neutrino hierarchy, transition and experiment considered -- a sensitivity to an effective electromagnetic transition moment $\\sim 10^{-12}\\, -\\,10^{-8}\\, (m_ic^2/{0.1 \\rm eV})^{3/2}μ_{\\rm B}$, where $m_i$ is the mass of the decaying neutrino and $μ_{\\rm B}$ is the Bohr magneton. This will be significantly more sensitive than cosmic microwave background spectral distortions, and it will be competitive with stellar cooling studies. As a byproduct, we also report an analytic form of the one-point probability distribution function for neutrino-density fluctuations, obtained from the Quijote simulations using symbolic regression.","abx":0,"nw":0,"d":"2021-03-22","dq":0,"y":2021,"au":[936,163,633,1226],"c":35,"cs":0,"bib":"2021PhRvL.127m1102B","v":"Physical Review Letters","lk":"arXiv:2103.12099","url":"https://arxiv.org/abs/2103.12099","doi":"10.1103/PhysRevLett.127.131102","tg":{"s":["Quijote"],"d":["Massive neutrinos","Neutral hydrogen & 21cm"],"m":["Symbolic regression","Perturbation theory & analytic models"],"u":[]},"x":0.7306,"yy":-0.5623,"p3":[-0.0772,-0.0653,-0.7281],"sim":{"k":"e","l":[[144,0.925],[216,0.923],[183,0.914],[186,0.911],[187,0.911]]},"c3":[63.05,-34.73,-18.11],"c2":[1.39,-48.7],"k":3,"r":[158,183],"rm":0},{"id":"2102.05049","t":"Detecting Neutrino Mass by Combining Matter Clustering, Halos, and Voids","ab":"We quantify the information content of the non-linear matter power spectrum, the halo mass function, and the void size function, using the Quijote $N$-body simulations. We find that these three statistics exhibit very different degeneracies amongst the cosmological parameters, and thus the combination of all three probes enables the breaking of degeneracies, in turn yielding remarkably tight constraints. We perform a Fisher analysis using the full covariance matrix, including all auto- and cross-correlations, finding that this increases the information content for neutrino mass compared to a correlation-free analysis. The multiplicative improvement of the constraints on the cosmological parameters obtained by combining all three probes compared to using the power spectrum alone are: 137, 5, 8, 20, 10, and 43, for $Ω_m$, $Ω_b$, $h$, $n_s$, $σ_8$, and $M_ν$, respectively. The marginalized error on the sum of the neutrino masses is $σ(M_ν)=0.018\\,{\\rm eV}$ for a cosmological volume of $1\\,(h^{-1}{\\rm Gpc})^3$, using $k_{\\max}=0.5\\,h{\\rm Mpc}^{-1}$, and without CMB priors. We note that this error is an underestimate insomuch as we do not consider super-sample covariance, baryonic effects, and realistic survey noises and systematics. On the other hand, it is an overestimate insomuch as our cuts and binning are suboptimal due to restrictions imposed by the simulation resolution. Given upcoming galaxy surveys will observe volumes spanning $\\sim 100\\,(h^{-1}{\\rm Gpc})^3$, this presents a promising new avenue to measure neutrino mass without being restricted by the need for accurate knowledge of the optical depth, which is required for CMB-based measurements. Furthermore, the improved constraints on other cosmological parameters, notably $Ω_m$, may also be competitive with CMB-based measurements.","abx":0,"nw":0,"d":"2021-02-09","dq":0,"y":2021,"au":[134,633,533,905,452,1076,251,1254,1646],"c":101,"cs":0,"bib":"2021ApJ...919...24B","v":"Astrophysical Journal","lk":"arXiv:2102.05049","url":"https://arxiv.org/abs/2102.05049","doi":"10.3847/1538-4357/ac0e91","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.2927,"yy":-0.6008,"p3":[-0.4515,-0.3054,-0.3429],"sim":{"k":"e","l":[[150,0.947],[153,0.947],[215,0.945],[157,0.942],[106,0.933]]},"c3":[-89.83,63.34,-54.78],"c2":[-143.14,10.44],"k":4,"r":[135,141,142,148,150,153,157,158,182,185,196,200,209,213,214,215,216,218],"rm":0},{"id":"2102.01696","t":"Information Content of Higher-Order Galaxy Correlation Functions","ab":"The shapes of galaxy N-point correlation functions can be used as standard rulers to constrain the distance-redshift relationship and thence the expansion rate of the Universe. The cosmological density fields traced by late-time galaxy formation are initially nearly Gaussian, and hence all the cosmological information can be extracted from their 2-Point Correlation Function (2PCF) or its Fourier-space analog the power spectrum. Subsequent nonlinear evolution under gravity, as well as halo and then galaxy formation, generate higher-order correlation functions. Since the mapping of the initial to the final density field is, on large scales, invertible, it is often claimed that the information content of the initial field's power spectrum is equal to that of all the higher-order functions of the final, nonlinear field. This claim implies that reconstruction of the initial density field from the nonlinear field renders analysis of higher-order correlation functions of the latter superfluous. We here show that this claim is false when the N-point functions are used as standard rulers. Constraints available from joint analysis of the galaxy power spectrum and bispectrum (Fourier-space analog of the 3-Point Correlation Function) can, in some cases, exceed those offered by the initial power spectrum even when the reconstruction is perfect. We provide a mathematical justification for this claim and also demonstrate it using a large suite of N-body simulations. In particular, we show that for the z = 0 real-space matter field in the limit of vanishing shot noise, taking modes up to k_max = 0.2 h/Mpc, using the bispectrum alone offers a factor of two reduction in the variance on the cosmic distance scale relative to that available from the power spectrum.","abx":0,"nw":0,"d":"2021-02-02","dq":0,"y":2021,"au":[1059,1855,633],"c":37,"cs":0,"bib":"2021MNRAS.505..628S","v":"","lk":"arXiv:2102.01696","url":"https://arxiv.org/abs/2102.01696","doi":"10.1093/mnras/stab1199","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Other simulations","Fisher forecasts"],"n":"'large suite of N-body simulations' not named (possibly Quijote)"},"x":-0.0095,"yy":-0.4721,"p3":[-0.1555,-0.6296,-0.032],"sim":{"k":"e","l":[[105,0.938],[96,0.935],[106,0.935],[157,0.929],[45,0.929]]},"c3":[-46.42,43.92,2.73],"c2":[-31.72,71.99],"k":4,"r":[139,157,158,210],"rm":0},{"id":"2012.05472","t":"Learning the Evolution of the Universe in N-body Simulations","ab":"Understanding the physics of large cosmological surveys down to small (nonlinear) scales will significantly improve our knowledge of the Universe. Large N-body simulations have been built to obtain predictions in the non-linear regime. However, N-body simulations are computationally expensive and generate large amount of data, putting burdens on storage. These data are snapshots of the simulated Universe at different times, and fine sampling is necessary to accurately save its whole history. We employ a deep neural network model to predict the nonlinear N-body simulation at an intermediate time step given two widely separated snapshots. Our results outperform the cubic Hermite interpolation benchmark method in interpolating N-body simulations. This work can greatly reduce the storage requirement and allow us to reconstruct the cosmic history from far fewer snapshots of the universe.","abx":0,"nw":0,"d":"2020-12-10","dq":0,"y":2020,"au":[362,1839,633,1646,191],"c":6,"cs":0,"bib":"2020arXiv201205472C","v":"arXiv.org","lk":"arXiv:2012.05472","url":"https://arxiv.org/abs/2012.05472","doi":"10.48550/arXiv.2012.05472","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["CNN"],"u":["Other simulations","CNN"]},"x":-0.0942,"yy":-0.1814,"p3":[0.5734,-0.2081,-0.1581],"sim":{"k":"e","l":[[136,0.95],[102,0.943],[103,0.943],[45,0.942],[41,0.942]]},"c3":[-19.51,-40.6,-15.64],"c2":[-55.58,-78.22],"k":6,"r":[157,158],"rm":1},{"id":"2012.02200","t":"Constraining $M_ν$ with the Bispectr
