um II: The Total Information Content of the Galaxy Bispectrum","ab":"Massive neutrinos suppress the growth of structure on small scales and leave an imprint on large-scale structure that can be measured to constrain their total mass, $M_ν$. With standard analyses of two-point clustering statistics, $M_ν$ constraints are severely limited by parameter degeneracies. Hahn et al.(2020) demonstrated that the bispectrum, the next higher-order statistic, can break these degeneracies and dramatically improve constraints on $M_ν$ and other cosmological parameters. In this paper, we present the constraining power of the redshift-space galaxy bispectrum, $B_0^g$. We construct the Molino suite of 75,000 mock galaxy catalogs from the Quijote $N$-body simulations using the halo occupation distribution (HOD) model, which provides a galaxy bias framework well-suited for simulation-based approaches. Using these mocks, we present Fisher matrix forecasts for $\\{Ω_m,Ω_b,h,n_s,σ_8, M_ν\\}$ and quantify, for the first time, the total information content of $B_0^g$ down to nonlinear scales. For $k_{\\rm max}=0.5h/Mpc$, $B_0^g$ improves constraints on $Ω_m,Ω_b,h,n_s,σ_8$, and $M_ν$ by 2.8, 3.1, 3.8, 4.2, 4.2, and $4.6\\times$ over the power spectrum, after marginalizing over HOD parameters. Even with priors from $Planck$, $B_0^g$ improves all of the cosmological constraints by $\\gtrsim2\\times$. In fact, for $P_\\ell^g$ and $B_0^g$ out to $k_{\\rm max}=0.5h/Mpc$ with $Planck$ priors, we achieve a $1σ$ $M_ν$ constraint of 0.048 eV, which is tighter than the current best cosmological constraint. While effects such as survey geometry and assembly bias will have an impact, these constraints are derived for $(1h^{-1}{\\rm Gpc})^3$, a substantially smaller volume than upcoming surveys. Therefore, we conclude that the galaxy bispectrum will significantly improve cosmological constraints for upcoming galaxy surveys -- especially for $M_ν$.","abx":0,"nw":0,"d":"2020-12-03","dq":0,"y":2020,"au":[363,633],"c":107,"cs":0,"bib":"2021JCAP...04..029H","v":"","lk":"arXiv:2012.02200","url":"https://arxiv.org/abs/2012.02200","doi":"","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.2307,"yy":-0.5014,"p3":[-0.3256,-0.6097,0.0186],"sim":{"k":"e","l":[[157,0.959],[101,0.942],[96,0.942],[68,0.94],[84,0.935]]},"c3":[-128.37,59.58,-53.4],"c2":[-151.17,54.12],"k":4,"r":[148,150,153,156,157,158,182,185,196,216],"rm":0},{"id":"2012.00240","t":"Fast and Accurate Non-Linear Predictions of Universes with Deep Learning","ab":"Cosmologists aim to model the evolution of initially low amplitude Gaussian density fluctuations into the highly non-linear \"cosmic web\" of galaxies and clusters. They aim to compare simulations of this structure formation process with observations of large-scale structure traced by galaxies and infer the properties of the dark energy and dark matter that make up 95% of the universe. These ensembles of simulations of billions of galaxies are computationally demanding, so that more efficient approaches to tracing the non-linear growth of structure are needed. We build a V-Net based model that transforms fast linear predictions into fully nonlinear predictions from numerical simulations. Our NN model learns to emulate the simulations down to small scales and is both faster and more accurate than the current state-of-the-art approximate methods. It also achieves comparable accuracy when tested on universes of significantly different cosmological parameters from the one used in training. This suggests that our model generalizes well beyond our training set.","abx":0,"nw":0,"d":"2020-12-01","dq":0,"y":2020,"au":[1522,1839,633,1646,452],"c":34,"cs":0,"bib":"2020arXiv201200240A","v":"arXiv.org","lk":"arXiv:2012.00240","url":"https://arxiv.org/abs/2012.00240","doi":"10.48550/arXiv.2012.00240","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["CNN","Emulators & regression ML"],"u":["Other simulations"],"n":"training simulations not named in abstract"},"x":-0.1501,"yy":-0.1761,"p3":[0.5258,-0.1613,0.0207],"sim":{"k":"e","l":[[154,0.954],[45,0.951],[134,0.95],[102,0.947],[146,0.947]]},"c3":[-55.57,-49.87,-26.74],"c2":[-85.57,-51.07],"k":6,"r":[148,150,153,157,158],"rm":0},{"id":"2012.00186","t":"dm2gal: Mapping Dark Matter to Galaxies with Neural Networks","ab":"Maps of cosmic structure produced by galaxy surveys are one of the key tools for answering fundamental questions about the Universe. Accurate theoretical predictions for these quantities are needed to maximize the scientific return of these programs. Simulating the Universe by including gravity and hydrodynamics is one of the most powerful techniques to accomplish this; unfortunately, these simulations are very expensive computationally. Alternatively, gravity-only simulations are cheaper, but do not predict the locations and properties of galaxies in the cosmic web. In this work, we use convolutional neural networks to paint galaxy stellar masses on top of the dark matter field generated by gravity-only simulations. Stellar mass of galaxies are important for galaxy selection in surveys and thus an important quantity that needs to be predicted. Our model outperforms the state-of-the-art benchmark model and allows the generation of fast and accurate models of the observed galaxy distribution.","abx":0,"nw":0,"d":"2020-12-01","dq":0,"y":2020,"au":[1336,633,901,1646],"c":14,"cs":0,"bib":"2020arXiv201200186K","v":"","lk":"arXiv:2012.00186","url":"https://arxiv.org/abs/2012.00186","doi":"","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["CNN"],"u":["Other simulations"]},"x":-0.1876,"yy":-0.0369,"p3":[0.6197,0.0347,-0.0439],"sim":{"k":"e","l":[[154,0.967],[166,0.961],[145,0.943],[136,0.942],[62,0.941]]},"c3":[13.54,-19.46,14.31],"c2":[2.35,-10.58],"k":6,"r":[145,153,157,166],"rm":0},{"id":"2012.00111","t":"Modeling assembly bias with machine learning and symbolic regression","ab":"Upcoming 21cm surveys will map the spatial distribution of cosmic neutral hydrogen (HI) over unprecedented volumes. Mock catalogues are needed to fully exploit the potential of these surveys. Standard techniques employed to create these mock catalogs, like Halo Occupation Distribution (HOD), rely on assumptions such as the baryonic properties of dark matter halos only depend on their masses. In this work, we use the state-of-the-art magneto-hydrodynamic simulation IllustrisTNG to show that the HI content of halos exhibits a strong dependence on their local environment. We then use machine learning techniques to show that this effect can be 1) modeled by these algorithms and 2) parametrized in the form of novel analytic equations. We provide physical explanations for this environmental effect and show that ignoring it leads to underprediction of the real-space 21-cm power spectrum at $k\\gtrsim 0.05$ h/Mpc by $\\gtrsim$10\\%, which is larger than the expected precision from upcoming surveys on such large scales. Our methodology of combining numerical simulations with machine learning techniques is general, and opens a new direction at modeling and parametrizing the complex physics of assembly bias needed to generate accurate mocks for galaxy and line intensity mapping surveys.","abx":0,"nw":0,"d":"2020-11-30","dq":0,"y":2020,"au":[465,633,1646,1068],"c":37,"cs":0,"bib":"2020arXiv201200111W","v":"","lk":"arXiv:2012.00111","url":"https://arxiv.org/abs/2012.00111","doi":"","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["Symbolic regression","Other ML"],"u":[]},"x":-0.4651,"yy":-0.1076,"p3":[0.2377,0.335,-0.0582],"sim":{"k":"e","l":[[145,0.951],[175,0.945],[180,0.944],[89,0.941],[45,0.937]]},"c3":[76.35,-101.18,-3.15],"c2":[26.38,-82.05],"k":6,"r":[141,145,146,151,154,155,157,158,162,166,180,188,193,205,210],"rm":0},{"id":"2011.05992","t":"Neural networks as optimal estimators to marginalize over baryonic effects","ab":"Many different studies have shown that a wealth of cosmological information resides on small, non-linear scales. Unfortunately, there are two challenges to overcome to utilize that information. First, we do not know the optimal estimator that will allow us to retrieve the maximum information. Second, baryonic effects impact that regime significantly and in a poorly understood manner. Ideally, we would like to use an estimator that extracts the maximum cosmological information while marginalizing over baryonic effects. In this work we show that neural networks can achieve that. We made use of data where the maximum amount of cosmological information is known: power spectra and 2D Gaussian density fields. We also contaminate the data with simplified baryonic effects and train neural networks to predict the value of the cosmological parameters. For this data, we show that neural networks can 1) extract the maximum available cosmological information, 2) marginalize over baryonic effects, and 3) extract cosmological information that is buried in the regime dominated by baryonic physics. We also show that neural networks learn the priors of the data they are trained on. We conclude that a promising strategy to maximize the scientific return of cosmological experiments is to train neural networks on state-of-the-art numerical simulations with different strengths and implementations of baryonic effects.","abx":0,"nw":0,"d":"2020-11-11","dq":0,"y":2020,"au":[633,251,444,1651,928,1646,452],"c":23,"cs":0,"bib":"2020arXiv201105992V","v":"Astrophysical Journal","lk":"arXiv:2011.05992","url":"https://arxiv.org/abs/2011.05992","doi":"10.3847/1538-4357/ac54a5","tg":{"s":["No simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["CNN","Emulators & regression ML"],"u":["No simulations","CNN"],"n":"Uses Gaussian random fields and power spectra, not simulations."},"x":0.0113,"yy":-0.1261,"p3":[0.2558,-0.3162,0.133],"sim":{"k":"e","l":[[38,0.954],[41,0.947],[124,0.945],[136,0.94],[96,0.938]]},"c3":[23.83,82.83,75.33],"c2":[89.27,77.15],"k":6,"r":[141,152,153,156,157,158],"rm":0},{"id":"2010.15843","t":"deep21: a Deep Learning Method for 21cm Foreground Removal","ab":"We seek to remove foreground contaminants from 21cm intensity mapping observations. We demonstrate that a deep convolutional neural network (CNN) with a UNet architecture and three-dimensional convolutions, trained on simulated observations, can effectively separate frequency and spatial patterns of the cosmic neutral hydrogen (HI) signal from foregrounds in the presence of noise. Cleaned maps recover cosmological clustering statistics within 10% at all relevant angular scales and frequencies. This amounts to a reduction in prediction variance of over an order of magnitude on small angular scales ($\\ell > 300$), and improved accuracy for small radial scales ($k_{\\parallel} > 0.17\\ \\rm h\\ Mpc^{-1})$ compared to standard Principal Component Analysis (PCA) methods. We estimate posterior confidence intervals for the network's prediction by training an ensemble of UNets. Our approach demonstrates the feasibility of analyzing 21cm intensity maps, as opposed to derived summary statistics, for upcoming radio experiments, as long as the simulated foreground model is sufficiently realistic. We provide the code used for this analysis on Github https://github.com/tlmakinen/deep21 as well as a browser-based tutorial for the experiment and UNet model via the accompanying http://bit.ly/deep21-colab Colab notebook.","abx":0,"nw":0,"d":"2020-10-29","dq":0,"y":2020,"au":[1706,1058,633,1447,1646,1068,452],"c":58,"cs":0,"bib":"2021JCAP...04..081M","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2010.15843","url":"https://arxiv.org/abs/2010.15843","doi":"10.1088/1475-7516/2021/04/081","tg":{"s":["Other simulations"],"d":["Neutral hydrogen & 21cm"],"m":["CNN"],"u":[]},"x":-0.4028,"yy":-0.2798,"p3":[0.4816,0.3498,-0.1564],"sim":{"k":"e","l":[[130,0.939],[147,0.939],[162,0.935],[145,0.935],[180,0.934]]},"c3":[108.85,-40.45,-59.87],"c2":[26.85,85.18],"k":1,"r":[145,147,160,171,174,180,194,205],"rm":0},{"id":"2010.00619","t":"The CAMELS project: Cosmology and Astrophysics with MachinE Learning Simulations","ab":"We present the Cosmology and Astrophysics with MachinE Learning Simulations --CAMELS-- project. CAMELS is a suite of 4,233 cosmological simulations of $(25~h^{-1}{\\rm Mpc})^3$ volume each: 2,184 state-of-the-art (magneto-)hydrodynamic simulations run with the AREPO and GIZMO codes, employing the same baryonic subgrid physics as the IllustrisTNG and SIMBA simulations, and 2,049 N-body simulations. The goal of the CAMELS project is to provide theory predictions for different observables as a function of cosmology and astrophysics, and it is the largest suite of cosmological (magneto-)hydrodynamic simulations designed to train machine learning algorithms. CAMELS contains thousands of different cosmological and astrophysical models by way of varying $Ω_m$, $σ_8$, and four parameters controlling stellar and AGN feedback, following the evolution of more than 100 billion particles and fluid elements over a combined volume of $(400~h^{-1}{\\rm Mpc})^3$. We describe the simulations in detail and characterize the large range of conditions represented in terms of the matter power spectrum, cosmic star formation rate density, galaxy stellar mass function, halo baryon fractions, and several galaxy scaling relations. We show that the IllustrisTNG and SIMBA suites produce roughly similar distributions of galaxy properties over the full parameter space but significantly different halo baryon fractions and baryonic effects on the matter power spectrum. This emphasizes the need for marginalizing over baryonic effects to extract the maximum amount of information from cosmological surveys. We illustrate the unique potential of CAMELS using several machine learning applications, including non-linear interpolation, parameter estimation, symbolic regression, data generation with Generative Adversarial Networks (GANs), dimensionality reduction, and anomaly detection.","abx":0,"nw":0,"d":"2020-10-01","dq":0,"y":2020,"au":[633,444,1651,452,1513,1533,189,1061,478,1440,462,1839,1356,1777,162,1646,1685,264,465,1325,694,713],"c":416,"cs":0,"bib":"2021ApJ...915...71V","v":"Astrophysical Journal","lk":"arXiv:2010.00619","url":"https://arxiv.org/abs/2010.00619","doi":"10.3847/1538-4357/abf7ba","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Generative models","Emulators & regression ML","Symbolic regression","Other ML"],"u":[]},"x":-0.1566,"yy":0.4458,"p3":[0.0996,0.2843,0.5058],"sim":{"k":"e","l":[[118,0.973],[87,0.973],[6,0.969],[123,0.962],[10,0.961]]},"c3":[36.16,21.33,108.38],"c2":[126.67,-5.24],"k":7,"r":[139,145,146,147,148,150,151,152,153,154,155,157,158,166],"rm":0},{"id":"2009.08970","t":"CARPool: fast, accurate computation of large-scale structure statistics by pairing costly and cheap cosmological simulations","ab":"To exploit the power of next-generation large-scale structure surveys, ensembles of numerical simulations are necessary to give accurate theoretical predictions of the statistics of observables. High-fidelity simulations come at a towering computational cost. Therefore, approximate but fast simulations, surrogates, are widely used to gain speed at the price of introducing model error. We propose a general method that exploits the correlation between simulations and surrogates to compute fast, reduced-variance statistics of large-scale structure observables without model error at the cost of only a few simulations. We call this approach Convergence Acceleration by Regression and Pooling (CARPool). In numerical experiments with intentionally minimal tuning, we apply CARPool to a handful of GADGET-III $N$-body simulations paired with surrogates computed using COmoving Lagrangian Acceleration (COLA). We find $\\sim 100$-fold variance reduction even in the non-linear regime, up to $k_\\mathrm{max} \\approx 1.2$ $h {\\rm Mpc^{-1}}$ for the matter power spectrum. CARPool realises similar improvements for the matter bispectrum. In the nearly linear regime CARPool attains far larger sample variance reductions. By comparing to the 15,000 simulations from the Quijote suite, we verify that the CARPool estimates are unbiased, as guaranteed by construction, even though the surrogate misses the simulation truth by up to $60\\%$ at high $k$. Furthermore, even with a fully configuration-space statistic like the non-linear matter density probability density function, CARPool achieves unbiased variance reduction factors of up to $\\sim 10$, without any further tuning. Conversely, CARPool can be used to remove model error from ensembles of fast surrogates by combining them with a few high-accuracy simulations.","abx":0,"nw":0,"d":"2020-09-18","dq":0,"y":2020,"au":[1328,251,1835,633],"c":53,"cs":0,"bib":"2021MNRAS.503.1897C","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2009.08970","url":"https://arxiv.org/abs/2009.08970","doi":"10.1093/MNRAS/STAB430","tg":{"s":["Quijote","Other simulations"],"d":["Large-scale structure"],"m":["No ML"],"u":[]},"x":0.1401,"yy":0.1004,"p3":[-0.0804,0.202,0.1503],"sim":{"k":"e","l":[[14,0.942],[111,0.94],[66,0.935],[41,0.935],[45,0.934]]},"c3":[-54.68,26.36,-59.97],"c2":[-98.16,71.92],"k":6,"r":[151,157,158,171,177],"rm":0},{"id":"2008.12265","t":"The impact of massive neutrinos on halo assembly bias","ab":"Using the publicly available Quijote simulations, we present the first measurements of the assembly bias of dark matter halos in N-body simulations which include massive neutrinos. We focus on the dependence of the linear bias $b_1$ on three halo properties: 1) concentration $c$, 2) spin $λ$, and 3) ellipticity $s$. Although these simulations cover a large volume, superior to any future surveys, we do not detect any effect of neutrinos on the relations $b_1(c)$, $b_1(λ)$ and $b_1(s)$ at fixed halo mass. We further study the dependence of halo properties and environment on neutrinos, finding these quantities to be impacted by neutrino masses at the same level as assembly bias. We find that the effect of neutrinos on spin and shape can be largely attributed to the change in the cold dark matter $σ_8$ in neutrinos simulations, which is not the case for concentration.","abx":0,"nw":0,"d":"2020-08-27","dq":0,"y":2020,"au":[1734,633,1254],"c":10,"cs":0,"bib":"2021JCAP...03..022L","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2008.12265","url":"https://arxiv.org/abs/2008.12265","doi":"10.1088/1475-7516/2021/03/022","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos"],"m":["No ML"],"u":[]},"x":0.4429,"yy":-0.5056,"p3":[-0.4135,-0.0771,-0.4086],"sim":{"k":"e","l":[[215,0.949],[169,0.938],[158,0.937],[150,0.936],[191,0.934]]},"c3":[-44.27,22.23,-161.3],"c2":[-184.18,-49.74],"k":3,"r":[144,150,153,157,158,161,164,167,169,180,185,199,200,201,206,213,214,215,216,217,218],"rm":0},{"id":"2007.10345","t":"The effects of massive neutrinos on the linear point of the correlation function","ab":"The linear point (LP), defined as the mid-point between the dip and the peak of the two-point clustering correlation function (TPCF), has been shown to be an excellent standard ruler for cosmology. In fact, it is nearly redshift-independent, being weakly sensitive to non-linearities, scale-dependent halo bias and redshift-space distortions. So far, these findings were tested assuming that neutrinos are massless; in this paper we extend the analysis to massive-neutrino cosmologies. In particular, we examine if the scale-dependent growth induced by neutrinos affects the LP position and if it is possible to detect the neutrino masses using the shift of the LP compared to the massless-neutrino case. For our purposes, we employ two sets of state-of-the-art $N$-body simulations with massive neutrinos. For each of them we measure the TPCF of cold dark matter (CDM) and halos and, to estimate the LP, fit the TPCF with a model-independent parametric fit in the range of scales of the Baryon Acoustic Oscillations (BAO). Overall, we find that the LP retains its features as a standard ruler even when neutrinos are massive. The cosmic distances measured with the LP can therefore be employed to constrain the neutrino mass.","abx":0,"nw":0,"d":"2020-07-20","dq":0,"y":2020,"au":[678,1546,1254,288,633,1365,1826,1520,708,783],"c":35,"cs":0,"bib":"2021JCAP...01..009P","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2007.10345","url":"https://arxiv.org/abs/2007.10345","doi":"10.1088/1475-7516/2021/01/009","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["No ML"],"u":[]},"x":0.6617,"yy":-0.5739,"p3":[-0.1068,-0.1766,-0.6428],"sim":{"k":"e","l":[[215,0.947],[169,0.944],[201,0.942],[216,0.941],[161,0.939]]},"c3":[-11.51,-41.78,-158.61],"c2":[-133.21,-61.69],"k":3,"r":[158,169,180,194,196,201,213,214,215],"rm":0},{"id":"2007.10340","t":"HInet: Generating neutral hydrogen from dark matter with neural networks","ab":"Upcoming 21cm surveys will map the spatial distribution of cosmic neutral hydrogen (HI) over very large cosmological volumes. In order to maximize the scientific return of these surveys, accurate theoretical predictions are needed. Hydrodynamic simulations currently are the most accurate tool to provide those predictions in the mildly to non-linear regime. Unfortunately, their computational cost is very high: tens of millions of CPU hours. We use convolutional neural networks to find the mapping between the spatial distribution of matter from N-body simulations and HI from the state-of-the-art hydrodynamic simulation IllustrisTNG. Our model performs better than the widely used theoretical model: Halo Occupation Distribution (HOD) for all statistical properties up to the non-linear scales $k\\lesssim1$ h/Mpc. Our method allows the generation of 21cm mocks over very big cosmological volumes with similar properties as hydrodynamic simulations.","abx":0,"nw":0,"d":"2020-07-20","dq":0,"y":2020,"au":[465,633,1646,1068],"c":36,"cs":0,"bib":"2021ApJ...916...42W","v":"Astrophysical Journal","lk":"arXiv:2007.10340","url":"https://arxiv.org/abs/2007.10340","doi":"10.3847/1538-4357/ac033a","tg":{"s":["Other simulations"],"d":["Neutral hydrogen & 21cm"],"m":["CNN"],"u":[]},"x":-0.4225,"yy":-0.08,"p3":[0.432,0.2138,-0.0748],"sim":{"k":"e","l":[[162,0.96],[138,0.951],[146,0.951],[166,0.948],[102,0.947]]},"c3":[76.59,-80.47,-49.23],"c2":[20.42,22.16],"k":6,"r":[135,138,146,147,151,154,155,157,158,162,166,175,180,184,193,194,199,202,205,210],"rm":0},{"id":"2007.07267","t":"Teaching neural networks to generate Fast Sunyaev Zel'dovich Maps","ab":"The thermal Sunyaev-Zel'dovich (tSZ) and the kinematic Sunyaev-Zel'dovich (kSZ) effects trace the distribution of electron pressure and momentum in the hot Universe. These observables depend on rich multi-scale physics, thus, simulated maps should ideally be based on calculations that capture baryonic feedback effects such as cooling, star formation, and other complex processes. In this paper, we train deep convolutional neural networks with a U-Net architecture to map from the three-dimensional distribution of dark matter to electron density, momentum and pressure at ~ 100 kpc resolution. These networks are trained on a combination of the TNG300 volume and a set of cluster zoom-in simulations from the IllustrisTNG project. The neural nets are able to reproduce the power spectrum, one-point probability distribution function, bispectrum, and cross-correlation coefficients of the simulations more accurately than the state-of-the-art semi-analytical models. Our approach offers a route to capture the richness of a full cosmological hydrodynamical simulation of galaxy formation with the speed of an analytical calculation.","abx":0,"nw":0,"d":"2020-07-14","dq":0,"y":2020,"au":[1072,633,452,478,189],"c":25,"cs":0,"bib":"2020ApJ...902..129T","v":"Astrophysical Journal","lk":"arXiv:2007.07267","url":"https://arxiv.org/abs/2007.07267","doi":"10.3847/1538-4357/abb80f","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback","CMB & SZ"],"m":["CNN"],"u":[]},"x":-0.3743,"yy":-0.083,"p3":[0.279,0.1523,0.1234],"sim":{"k":"e","l":[[145,0.951],[136,0.947],[89,0.943],[66,0.94],[102,0.94]]},"c3":[98.14,-93.42,47.2],"c2":[58.94,-115.9],"k":6,"r":[166],"rm":0},{"id":"2006.14305","t":"Removing Astrophysics in 21 cm maps with Neural Networks","ab":"Measuring temperature fluctuations in the 21 cm signal from the Epoch of Reionization and the Cosmic Dawn is one of the most promising ways to study the Universe at high redshifts. Unfortunately, the 21 cm signal is affected by both cosmology and astrophysics processes in a non-trivial manner. We run a suite of 1,000 numerical simulations with different values of the main astrophysical parameters. From these simulations we produce tens of thousands of 21 cm maps at redshifts $10\\leq z\\leq 20$. We train a convolutional neural network to remove the effects of astrophysics from the 21 cm maps, and output maps of the underlying matter field. We show that our model is able to generate 2D matter fields that not only resemble the true ones visually, but whose statistical properties agree with the true ones within a few percent down to pretty small scales. We demonstrate that our neural network retains astrophysical information, that can be used to constrain the value of the astrophysical parameters. Finally, we use saliency maps to try to understand which features of the 21 cm maps is the network using in order to determine the value of the astrophysical parameters.","abx":0,"nw":0,"d":"2020-06-25","dq":0,"y":2020,"au":[1434,633],"c":48,"cs":0,"bib":"2021ApJ...907...44V","v":"Astrophysical Journal","lk":"arXiv:2006.14305","url":"https://arxiv.org/abs/2006.14305","doi":"10.3847/1538-4357/abd245","tg":{"s":["Other simulations"],"d":["Neutral hydrogen & 21cm"],"m":["CNN","Other ML"],"u":[]},"x":-0.4536,"yy":-0.2827,"p3":[0.4917,0.3341,-0.3138],"sim":{"k":"e","l":[[189,0.94],[140,0.939],[145,0.935],[205,0.935],[210,0.932]]},"c3":[65.93,-103.44,42.53],"c2":[40.9,-106.85],"k":2,"r":[151,155,162],"rm":0},{"id":"2006.06298","t":"New Interpretable Statistics for Large Scale Structure Analysis and Generation","ab":"We introduce Wavelet Phase Harmonics (WPH) statistics: interpretable low-dimensional statistics that describe 2D non-Gaussian fields. These statistics are built from WPH moments, which were recently introduced in the data science and machine learning community. We apply WPH statistics to projected 2D matter density fields from the Quijote N-body simulations of the large-scale structure of the Universe. By computing Fisher information matrices, we find that the WPH statistics place more stringent constraints on four of five cosmological parameters when compared to statistics based on the combination of the power spectrum and bispectrum. We also use the WPH statistics with a maximum entropy model to statistically generate new 2D density fields that accurately reproduce the probability density function, the mean and standard deviation of the power spectrum, the bispectrum, and Minkowski functionals of the input density fields. Although other methods are efficient for either parameter estimates or statistical syntheses of the large-scale structure, WPH statistics are the first statistics that achieve state-of-the-art results for both tasks as well as being interpretable.","abx":0,"nw":0,"d":"2020-06-11","dq":0,"y":2020,"au":[554,1708,796,633,1646,1676],"c":101,"cs":0,"bib":"2020PhRvD.102j3506A","v":"Physical Review D","lk":"arXiv:2006.06298","url":"https://arxiv.org/abs/2006.06298","doi":"10.1103/physrevd.102.103506","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Fisher forecasts","No ML"],"u":["No ML"],"n":"WPH moments from ML/data-science community + max-entropy generative model; treated as non-ML statistics"},"x":0.0295,"yy":-0.6831,"p3":[0.1824,-0.6382,-0.051],"sim":{"k":"e","l":[[109,0.952],[110,0.945],[32,0.942],[105,0.941],[96,0.938]]},"c3":[-38.1,91.03,-8.14],"c2":[-71.03,47.11],"k":4,"r":[150,151,157,158,163],"rm":0},{"id":"2004.09515","t":"The Effective Halo Model: Creating a Physical and Accurate Model of the Matter Power Spectrum and Cluster Counts","ab":"We introduce a physically-motivated model of the matter power spectrum, based on the halo model and perturbation theory. This model achieves 1\\% accuracy on all $k-$scales between $k=0.02h\\,\\mathrm{Mpc}^{-1}$ to $k=1h\\,\\mathrm{Mpc}^{-1}$. Our key ansatz is that the number density of halos depends on the non-linear density contrast filtered on some unknown scale $R$. Using the Effective Field Theory of Large Scale Structure to evaluate the two-halo term, we obtain a model for the power spectrum with only two fitting parameters: $R$ and the effective `sound speed', which encapsulates small-scale physics. This is tested with two suites of cosmological simulations across a broad range of cosmologies and found to be highly accurate. Due to its physical motivation, the statistics can be easily extended beyond the power spectrum; we additionally derive the one-loop covariance matrices of cluster counts and their combination with the matter power spectrum. This yields a significantly better fit to simulations than previous models, and includes a new model for super-sample effects, which is rigorously tested with separate universe simulations. At low redshift, we find a significant ($\\sim 10\\%$) exclusion covariance from accounting for the finite size of halos which has not previously been modeled. Such power spectrum and covariance models will enable joint analysis of upcoming large-scale structure surveys, gravitational lensing surveys and cosmic microwave background maps on scales down to the non-linear scale. We provide a publicly released Python code.","abx":0,"nw":0,"d":"2020-04-20","dq":0,"y":2020,"au":[1356,452,633],"c":38,"cs":0,"bib":"2020PhRvD.101l3520P","v":"Physical Review D","lk":"arXiv:2004.09515","url":"https://arxiv.org/abs/2004.09515","doi":"10.1103/PHYSREVD.101.123520","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["Perturbation theory & analytic models","No ML"],"u":[],"n":"'two suites of cosmological simulations' not named"},"x":0.4872,"yy":-0.439,"p3":[0.0031,-0.1446,-0.3739],"sim":{"k":"e","l":[[45,0.946],[214,0.944],[215,0.943],[59,0.94],[95,0.939]]},"c3":[-18.5,-8.2,-104.4],"c2":[-69.02,-17.34],"k":3,"r":[158,193,206],"rm":0},{"id":"2001.11024","t":"Using the Marked Power Spectrum to Detect the Signature of Neutrinos in Large-Scale Structure","ab":"Cosmological neutrinos have their greatest influence in voids: these are the regions with the highest neutrino to dark matter density ratios. The marked power spectrum can be used to emphasize low density regions over high density regions, and therefore is potentially much more sensitive than the power spectrum to the effects of neutrino masses. Using 22,000 N-body simulations from the Quijote suite, we quantify the information content in the marked power spectrum of the matter field, and show that it outperforms the standard power spectrum by setting constraints improved by a factor larger than 2 on all cosmological parameters. The combination of marked and standard power spectrum allows to place a 4.3σ constraint on the minimum sum of the neutrino masses with a volume equal to 1 (Gpc/h)^3 and without CMB priors. Combinations of different marked power spectra yield a 6σ constraint within the same conditions.","abx":0,"nw":0,"d":"2020-01-29","dq":0,"y":2020,"au":[533,633,1646,1319,452],"c":122,"cs":0,"bib":"2021PhRvL.126a1301M","v":"Physical Review Letters","lk":"arXiv:2001.11024","url":"https://arxiv.org/abs/2001.11024","doi":"10.1103/physrevlett.126.011301","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.2419,"yy":-0.6436,"p3":[-0.4452,-0.4251,-0.3486],"sim":{"k":"e","l":[[49,0.954],[132,0.947],[153,0.944],[104,0.942],[158,0.938]]},"c3":[-73.11,95.78,-58.45],"c2":[-130.25,35.7],"k":4,"r":[153,157,158,161,163,164,200,214,215],"rm":0},{"id":"2001.05519","t":"Super-resolution emulator of cosmological simulations using deep physical models","ab":"We present an extension of our recently developed Wasserstein optimized model to emulate accurate high-resolution features from computationally cheaper low-resolution cosmological simulations. Our deep physical modelling technique relies on restricted neural networks to perform a mapping of the distribution of the low-resolution cosmic density field to the space of the high-resolution small-scale structures. We constrain our network using a single triplet of high-resolution initial conditions and the corresponding low- and high-resolution evolved dark matter simulations from the Quijote suite of simulations. We exploit the information content of the high-resolution initial conditions as a well constructed prior distribution from which the network emulates the small-scale structures. Once fitted, our physical model yields emulated high-resolution simulations at low computational cost, while also providing some insights about how the large-scale modes affect the small-scale structure in real space.","abx":0,"nw":0,"d":"2020-01-15","dq":0,"y":2020,"au":[473,1739,633,251],"c":78,"cs":0,"bib":"2020MNRAS.495.4227K","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2001.05519","url":"https://arxiv.org/abs/2001.05519","doi":"10.1093/MNRAS/STAA1428","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Generative models"],"u":[]},"x":-0.1938,"yy":-0.2059,"p3":[0.3422,-0.3432,-0.0142],"sim":{"k":"e","l":[[136,0.945],[45,0.942],[121,0.942],[105,0.937],[107,0.937]]},"c3":[-8.44,-106.45,-8.3],"c2":[-35.43,-123.2],"k":6,"r":[155,158,162,166],"rm":0},{"id":"1912.06621","t":"Primordial non-Gaussianity without tails -- how to measure fNL with the bulk of the density PDF","ab":"We investigate the possibility to detect primordial non-Gaussianity by analysing the bulk of the probability distribution function (PDF) of late-time cosmic density fluctuations. For this purpose we devise a new method to predict the impact of general non-Gaussian initial conditions on the late-time density PDF. At redshift $z=1$ and for a smoothing scale of 30Mpc/$h$ our predictions agree with the high-resolution Quijote N-body simulations to $\\sim 0.2\\%$ precision. This is within cosmic variance of a $\\sim 100(\\mathrm{Gpc}/h)^3$ survey volume. When restricting to this 30Mpc/$h$ smoothing scale and to mildly non-linear densities ($δ[30\\mathrm{Mpc}/h] \\in [-0.3, 0.4]$) and also marginalizing over potential ignorance of the amplitude of the non-linear power spectrum an analysis of the PDF for such a survey volume can still measure the amplitude of different primordial bispectrum shapes to an accuracy of \\smash{$Δf_{\\mathrm{NL}}^{\\mathrm{loc}}=\\pm 7.4\\ ,\\ Δf_{\\mathrm{NL}}^{\\mathrm{equi}}=\\pm 22.0\\ ,\\ Δf_{\\mathrm{NL}}^{\\mathrm{ortho}}=\\pm 46.0$} . When pushing to smaller scales and assuming a joint analysis of the PDF with smoothing radii of 30Mpc/$h$ and 15Mpc/$h$ ($δ[15\\mathrm{Mpc}/h] \\in [-0.4, 0.5]$) this improves to \\smash{$Δf_{\\mathrm{NL}}^{\\mathrm{loc}}=\\pm 3.3\\ ,\\ Δf_{\\mathrm{NL}}^{\\mathrm{equi}}=\\pm 11.0\\ ,\\ Δf_{\\mathrm{NL}}^{\\mathrm{ortho}}=\\pm 17.0\\ $} - even when marginalizing over the non-linear variances at both scales as two free parameters. Especially, such an analysis could simultaneously measure $f_{\\mathrm{NL}}$ and the amplitude and slope of the non-linear power spectrum. However, at 15Mpc/$h$ our predictions are only accurate to $\\lesssim 0.8\\%$ for the considered density range. We discuss how this has to be improved in order to push to these small scales and make full use of upcoming surveys with a PDF-based analysis.","abx":0,"nw":0,"d":"2019-12-13","dq":0,"y":2019,"au":[1355,394,633,1737,1227,1722],"c":65,"cs":0,"bib":"2020MNRAS.498..464F","v":"","lk":"arXiv:1912.06621","url":"https://arxiv.org/abs/1912.06621","doi":"10.1093/mnras/staa2160","tg":{"s":["Quijote"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fisher forecasts"]},"x":0.3809,"yy":-0.7332,"p3":[-0.0052,-0.6911,-0.2585],"sim":{"k":"e","l":[[181,0.942],[59,0.941],[60,0.94],[96,0.935],[68,0.935]]},"c3":[-84.03,107.92,25.84],"c2":[-56.89,98.35],"k":4,"r":[153,156,158],"rm":0},{"id":"1911.11158","t":"Fisher for complements: Extracting cosmology and neutrino mass from the counts-in-cells PDF","ab":"We comprehensively analyse the cosmology dependence of counts-in-cell statistics. We focus on the shape of the one-point probability distribution function (PDF) of the matter density field at mildly nonlinear scales. Based on large-deviation statistics, we parametrise the cosmology dependence of the matter PDF in terms of the linear power spectrum, the growth factor, the spherical collapse dynamics, and the nonlinear variance. We extend our formalism to include massive neutrinos, finding that the total matter PDF is highly sensitive to the total neutrino mass $M_ν$ and can disentangle it from the clustering amplitude $σ_8$. Using more than a million PDFs extracted from the Quijote simulations, we determine the response of the matter PDF to changing parameters in the $νΛ$CDM model and successfully cross-validate the theoretical model and the simulation measurements. We present the first $νΛ$CDM Fisher forecast for the matter PDF at multiple scales and redshifts, and its combination with the matter power spectrum. We establish that the matter PDF and the matter power spectrum are highly complementary at mildly nonlinear scales. The matter PDF is particularly powerful for constraining the matter density $Ω_m$, clustering amplitude $σ_8$ and the total neutrino mass $M_ν$. Adding the mildly nonlinear matter PDF to the mildly nonlinear matter power spectrum improves constraints on $Ω_m$ by a factor of 5 and $σ_8$ by a factor of 2 when considering the three lowest redshifts. In our joint analysis of the matter PDF and matter power spectrum at three redshifts, the total neutrino mass is constrained to better than 0.01 eV with a total volume of 6 (Gpc/h)$^3$. We discuss how density-split statistics can be used to translate those encouraging results for the matter PDF into realistic observables in galaxy surveys.","abx":0,"nw":0,"d":"2019-11-25","dq":0,"y":2019,"au":[394,1355,633,199,1633],"c":125,"cs":0,"bib":"2020MNRAS.495.4006U","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:1911.11158","url":"https://arxiv.org/abs/1911.11158","doi":"10.1093/mnras/staa1155","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":[]},"x":0.2647,"yy":-0.5769,"p3":[-0.4433,-0.487,-0.2548],"sim":{"k":"e","l":[[132,0.947],[157,0.947],[150,0.944],[49,0.943],[215,0.94]]},"c3":[-29.45,94.62,-39.44],"c2":[-73.46,75.35],"k":4,"r":[150,156,157,158,175,185,200,216,218],"rm":0},{"id":"1910.07813","t":"From Dark Matter to Galaxies with Convolutional Neural Networks","ab":"Cosmological simulations play an important role in the interpretation of astronomical data, in particular in comparing observed data to our theoretical expectations. However, to compare data with these simulations, the simulations in principle need to include gravity, magneto-hydrodyanmics, radiative transfer, etc. These ideal large-volume simulations (gravo-magneto-hydrodynamical) are incredibly computationally expensive which can cost tens of millions of CPU hours to run. In this paper, we propose a deep learning approach to map from the dark-matter-only simulation (computationally cheaper) to the galaxy distribution (from the much costlier cosmological simulation). The main challenge of this task is the high sparsity in the target galaxy distribution: space is mainly empty. We propose a cascade architecture composed of a classification filter followed by a regression procedure. We show that our result outperforms a state-of-the-art model used in the astronomical community, and provides a good trade-off between computational cost and prediction accuracy.","abx":0,"nw":0,"d":"2019-10-17","dq":0,"y":2019,"au":[887,1813,1829,1800,1847,694,633,1662,1651,1646],"c":18,"cs":0,"bib":"2019arXiv191007813Y","v":"arXiv.org","lk":"arXiv:1910.07813","url":"https://arxiv.org/abs/1910.07813","doi":"10.48550/arXiv.1910.07813","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["CNN"],"u":[]},"x":-0.1957,"yy":-0.0732,"p3":[0.6414,-0.0453,0.0537],"sim":{"k":"e","l":[[166,0.976],[137,0.967],[136,0.954],[145,0.947],[107,0.945]]},"c3":[58.24,-61.06,63.68],"c2":[71.19,-69.45],"k":6,"r":[],"rm":1},{"id":"1910.04255","t":"Learning neutrino effects in Cosmology with Convolutional Neural Networks","ab":"Measuring the sum of the three active neutrino masses, $M_ν$, is one of the most important challenges in modern cosmology. Massive neutrinos imprint characteristic signatures on several cosmological observables in particular on the large-scale structure of the Universe. In order to maximize the information that can be retrieved from galaxy surveys, accurate theoretical predictions in the non-linear regime are needed. Currently, one way to achieve those predictions is by running cosmological numerical simulations. Unfortunately, producing those simulations requires high computational resources -- several hundred to thousand core-hours for each neutrino mass case. In this work, we propose a new method, based on a deep learning network, to quickly generate simulations with massive neutrinos from standard $Λ$CDM simulations without neutrinos. We computed multiple relevant statistical measures of deep-learning generated simulations, and conclude that our approach is an accurate alternative to the traditional N-body techniques. In particular the power spectrum is within $\\simeq 6\\%$ down to non-linear scales $k=0.7$~\\rm h/Mpc. Finally, our method allows us to generate massive neutrino simulations 10,000 times faster than the traditional methods.","abx":0,"nw":0,"d":"2019-10-09","dq":0,"y":2019,"au":[530,1262,633,1662,1646,363],"c":37,"cs":0,"bib":"2023ApJ...950...70G","v":"Astrophysical Journal","lk":"arXiv:1910.04255","url":"https://arxiv.org/abs/1910.04255","doi":"10.3847/1538-4357/accd61","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["CNN","Emulators & regression ML"],"u":["Other simulations"],"n":"Simulations not named (likely Quijote-like N-body); network maps LCDM to massive-neutrino fields."},"x":-0.1925,"yy":-0.341,"p3":[0.4684,-0.1662,-0.0619],"sim":{"k":"e","l":[[25,0.945],[45,0.943],[136,0.94],[121,0.933],[102,0.931]]},"c3":[-2.26,-48.93,-71.96],"c2":[-75.24,-97.77],"k":6,"r":[157,158,162,163,185,200,201,214,215,217],"rm":0},{"id":"1910.03597","t":"Baryonic effects on the matter bispectrum","ab":"The large-scale clustering of matter is impacted by baryonic physics, particularly AGN feedback. Modelling or mitigating this impact will be essential for making full use of upcoming measurements of cosmic shear and other large-scale structure probes. We study baryonic effects on the matter bispectrum, using measurements from a selection of state-of-the-art hydrodynamical simulations: IllustrisTNG, Illustris, EAGLE, and BAHAMAS. We identify a low-redshift enhancement of the bispectrum, peaking at $k\\sim 3h\\,{\\rm Mpc}^{-1}$, that is present in several simulations, and discuss how it can be associated to the evolving nature of AGN feedback at late times. This enhancement does not appear in the matter power spectrum, and therefore represents a new source of degeneracy breaking between two- and three-point statistics. In addition, we provide physical interpretations for other aspects of these measurements, and make initial comparisons to predictions from perturbation theory, empirical fitting formulas, and the response function formalism. We publicly release our measurements (including estimates of their uncertainty due to sample variance) and bispectrum measurement code as resources for the community.","abx":0,"nw":0,"d":"2019-10-08","dq":0,"y":2019,"au":[1659,1806,633,150],"c":66,"cs":0,"bib":"2020MNRAS.498.2887F","v":"","lk":"arXiv:1910.03597","url":"https://arxiv.org/abs/1910.03597","doi":"10.1093/MNRAS/STAA2523","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.2216,"yy":-0.0388,"p3":[-0.2981,-0.0239,0.0868],"sim":{"k":"e","l":[[157,0.935],[116,0.935],[95,0.935],[71,0.935],[42,0.933]]},"c3":[-89.67,113.69,-9.28],"c2":[-64.36,144.44],"k":5,"r":[157,173,177],"rm":0},{"id":"1909.11107","t":"Constraining $M_ν$ with the Bispectrum I: Breaking Parameter Degeneracies","ab":"Massive neutrinos suppress the growth of structure below their free-streaming scale and leave an imprint on large-scale structure. Measuring this imprint allows us to constrain the sum of neutrino masses, $M_ν$, a key parameter in particle physics beyond the Standard Model. However, degeneracies among cosmological parameters, especially between $M_ν$ and $σ_8$, limit the constraining power of standard two-point clustering statistics. In this work, we investigate whether we can break these degeneracies and constrain $\\smnu$ with the next higher-order correlation function --- the bispectrum. We first examine the redshift-space halo bispectrum of $800$ $N$-body simulations from the HADES suite and demonstrate that the bispectrum helps break the $M_ν$--$σ_8$ degeneracy. Then using 22,000 $N$-body simulations of the Quijote suite, we quantify for the first time the full information content of the redshift-space halo bispectrum down to nonlinear scales using a Fisher matrix forecast of $\\{Ω_m$, $Ω_b$, $h$, $n_s$, $σ_8$, $M_ν\\}$. For $k_{\\rm max}{=}0.5~h/{\\rm Mpc}$, the bispectrum provides $Ω_m$, $Ω_b$, $h$, $n_s$, and $σ_8$ constraints 1.9, 2.6, 3.1, 3.6, and 2.6 times tighter than the power spectrum. For $M_ν$, the bispectrum improves the 1$σ$ constraint from 0.2968 to 0.0572 eV --- over 5 times tighter than the power spectrum. Even with priors from {\\em Planck}, the bispectrum improves $M_ν$ constraints by a factor of 1.8. Although we reserve marginalizing over a more complete set of bias parameters to the next paper of the series, these constraints are derived for a $(1~h^{-1}{\\rm Gpc})^3$ box, a substantially smaller volume than upcoming surveys. Thus, our results demonstrate that the bispectrum offers significant improvements over the power spectrum, especially for constraining $M_ν$.","abx":0,"nw":0,"d":"2019-09-24","dq":0,"y":2019,"au":[363,633,540,1532],"c":148,"cs":0,"bib":"2020JCAP...03..040H","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:1909.11107","url":"https://arxiv.org/abs/1909.11107","doi":"10.1088/1475-7516/2020/03/040","tg":{"s":["Quijote","Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.2465,"yy":-0.5192,"p3":[-0.3205,-0.4505,-0.1397],"sim":{"k":"e","l":[[135,0.959],[153,0.947],[101,0.946],[106,0.945],[132,0.942]]},"c3":[-80.67,16.92,-38.05],"c2":[-97.92,30.31],"k":4,"r":[158,185,196,214,215,216],"rm":0},{"id":"1909.05273","t":"The Quijote simulations","ab":"The Quijote simulations are a set of 44,100 full N-body simulations spanning more than 7,000 cosmological models in the $\\{Ω_{\\rm m}, Ω_{\\rm b}, h, n_s, σ_8, M_ν, w \\}$ hyperplane. At a single redshift the simulations contain more than 8.5 trillions of particles over a combined volume of 44,100 $(h^{-1}{\\rm Gpc})^3$; each simulation follow the evolution of $256^3$, $512^3$ or $1024^3$ particles in a box of $1~h^{-1}{\\rm Gpc}$ length. Billions of dark matter halos and cosmic voids have been identified in the simulations, whose runs required more than 35 million core hours. The Quijote simulations have been designed for two main purposes: 1) to quantify the information content on cosmological observables, and 2) to provide enough data to train machine learning algorithms. In this paper we describe the simulations and show a few of their applications. We also release the Petabyte of data generated, comprising hundreds of thousands of simulation snapshots at multiple redshifts, halo and void catalogs, together with millions of summary statistics such as power spectra, bispectra, correlation functions, marked power spectra, and estimated probability density functions.","abx":0,"nw":0,"d":"2019-09-11","dq":0,"y":2019,"au":[633,363,533,199,162,473,1739,530,1839,554,193,394,368,1662,153,170,1844,540,694,376,178,948,1532,1076,1254,1646,1676,251,452],"c":445,"cs":0,"bib":"2020ApJS..250....2V","v":"Astrophysical Journal Supplement Series","lk":"arXiv:1909.05273","url":"https://arxiv.org/abs/1909.05273","doi":"10.3847/1538-4365/ab9d82","tg":{"s":["Quijote"],"d":["Large-scale structure","Massive neutrinos"],"m":["Fisher forecasts","No ML"],"u":[],"n":"overview paper; applications mostly information-content/Fisher"},"x":0.2668,"yy":0.2357,"p3":[-0.2767,0.1261,-0.104],"sim":{"k":"e","l":[[129,0.953],[111,0.95],[118,0.949],[12,0.949],[98,0.947]]},"c3":[-108.39,0.37,-15.06],"c2":[-96.87,-9.31],"k":6,"r":[149,150,151,153,155,157,172,177,182,196,216,218],"rm":0},{"id":"1907.13090","t":"Research and Development for HI Intensity Mapping","ab":"Development of the hardware, data analysis, and simulation techniques for large compact radio arrays dedicated to mapping the 21 cm line of neutral hydrogen gas has proven to be more difficult than imagined twenty years ago when such telescopes were first proposed. Despite tremendous technical and methodological advances, there are several outstanding questions on how to optimally calibrate and analyze such data. On the positive side, it has become clear that the outstanding issues are purely technical in nature and can be solved with sufficient development activity. Such activity will enable science across redshifts, from early galaxy evolution in the pre-reionization era to dark energy evolution at low redshift.","abx":0,"nw":0,"d":"2019-07-29","dq":0,"y":2019,"au":[1856,451,1287,1540,558,990,127,1450,540,1745,1533,933,149,121,1660,1659,930,446,705,447,467,147,1080,545,135,1840,995,1730,982,1283,1063,169,1438,170,747,453,1360,454,253,1320,870,373,553,1518,557,1742,197,1439,142,1448,715,1807,633,443],"c":6,"cs":0,"bib":"2019arXiv190713090A","v":"","lk":"arXiv:1907.13090","url":"https://arxiv.org/abs/1907.13090","doi":"10.2172/1558438","tg":{"s":["No simulations"],"d":["Neutral hydrogen & 21cm","Surveys & instruments"],"m":["No ML"],"u":[]},"x":-0.6575,"yy":-0.4867,"p3":[0.1208,0.4449,-0.6095],"sim":{"k":"e","l":[[173,0.947],[183,0.943],[210,0.942],[193,0.928],[180,0.927]]},"c3":[77.56,86.92,-159.32],"c2":[-82.61,190.52],"k":1,"r":[160,164,173,180],"rm":0},{"id":"1907.12559","t":"Packed Ultra-wideband Mapping Array (PUMA): A Radio Telescope for Cosmology and Transients","ab":"PUMA is a proposal for an ultra-wideband, low-resolution and transit interferometric radio telescope operating at $200-1100\\,\\mathrm{MHz}$. Its design is driven by six science goals which span three science themes: the physics of dark energy (measuring the expansion history and growth of the universe up to $z=6$), the physics of inflation (constraining primordial non-Gaussianity and primordial features) and the transient radio sky (detecting one million fast radio bursts and following up SKA-discovered pulsars). We propose two array configurations composed of hexagonally close-packed 6m dish arrangements with 50% fill factor. The initial 5,000 element 'petite array' is scientifically compelling, and can act as a demonstrator and a stepping stone to the full 32,000 element 'full array'. Viewed as a 21cm intensity mapping telescope, the program has the noise equivalent of a traditional spectroscopic galaxy survey comprised of 0.6 and 2.5 billion galaxies at a comoving wavenumber of $k=0.5\\,h\\mathrm{Mpc}^{-1}$ spanning the redshift range $z = 0.3 - 6$ for the petite and full configurations, respectively. At redshifts beyond $z=2$, the 21cm technique is a uniquely powerful way of mapping the universe, while the low-redshift range will allow for numerous cross-correlations with existing and upcoming surveys. This program is enabled by the development of ultra-wideband radio feeds, cost-effective dish construction methods, commodity radio-frequency electronics driven by the telecommunication industry and the emergence of sufficient computing power to facilitate real-time signal processing that exploits the full potential of massive radio arrays. The project has an estimated construction cost of 55 and 330 million FY19 USD for the petite and full array configurations. Including R&D, design, operations and science analysis, the cost rises to 125 and 600 million FY19 USD, respectively.","abx":0,"nw":0,"d":"2019-07-29","dq":0,"y":2019,"au":[990,540,1074,1659,446,467,135,995,440,1283,1063,365,1438,170,747,253,870,383,1439,197,142,1448,1807,633,254,1245],"c":113,"cs":0,"bib":"2019BAAS...51g..53S","v":"","lk":"arXiv:1907.12559","url":"https://arxiv.org/abs/1907.12559","doi":"10.2172/1558437","tg":{"s":["No simulations"],"d":["Primordial non-Gaussianity","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["Fisher forecasts","No ML"],"u":["Fisher forecasts"]},"x":-0.6426,"yy":-0.5823,"p3":[-0.0368,0.6324,-0.6756],"sim":{"k":"e","l":[[171,0.939],[173,0.928],[204,0.926],[174,0.926],[159,0.924]]},"c3":[56.89,55.59,-124.73],"c2":[-63.27,234.68],"k":1,"r":[173,194],"rm":0},{"id":"1907.06598","t":"Weighing neutrinos with the halo environment","ab":"Nonlinear objects like halos and voids exhibit a scale-dependent bias on linear scales in massive neutrino cosmologies. The shape of this scale-dependent bias is a unique signature of the neutrino masses, but the amplitude of the signal is generally small, of the order of $f_ν$, the contribution of neutrinos to the total matter content ($\\lesssim 1\\%$). In this paper, we demonstrate for the first time how the strength of this signal can be substantially enhanced by using information about the halo environment at a range of scales. This enhancement is achieved by using certain combinations of the large scale Cold Dark Matter and total matter environments of halos, both of which are measurable from galaxy clustering and weak lensing surveys.","abx":0,"nw":0,"d":"2019-07-15","dq":0,"y":2019,"au":[199,540,633,1743,1254],"c":29,"cs":0,"bib":"2020JCAP...06..032B","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:1907.06598","url":"https://arxiv.org/abs/1907.06598","doi":"10.1088/1475-7516/2020/06/032","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["No ML"],"u":["Other simulations"]},"x":0.5732,"yy":-0.5304,"p3":[-0.336,-0.1302,-0.6778],"sim":{"k":"e","l":[[215,0.948],[186,0.946],[169,0.946],[214,0.944],[218,0.944]]},"c3":[-100.38,34.44,-104.75],"c2":[-158.03,-32.83],"k":3,"r":[158,163,164,167,169,181,185,186,200,214,215,217],"rm":0},{"id":"1904.12846","t":"HIGAN: Cosmic Neutral Hydrogen with Generative Adversarial Networks","ab":"One of the most promising ways to observe the Universe is by detecting the 21cm emission from cosmic neutral hydrogen (HI) through radio-telescopes. Those observations can shed light on fundamental astrophysical questions only if accurate theoretical predictions are available. In order to maximize the scientific return of these surveys, those predictions need to include different observables and be precise on non-linear scales. Currently, one of the best ways to achieve this is via cosmological hydrodynamic simulations; however, the computational cost of these simulations is high -- tens of millions of CPU hours. In this work, we use Wasserstein Generative Adversarial Networks (WGANs) to generate new high-resolution ($35~h^{-1}{\\rm kpc}$) 3D realizations of cosmic HI at $z=5$. We do so by sampling from a 100-dimension manifold, learned by the generator, that characterizes the fully non-linear abundance and clustering of cosmic HI from the state-of-the-art simulation IllustrisTNG. We show that different statistical properties of the produced samples -- 1D PDF, power spectrum, bispectrum, and void size function -- match very well those of IllustrisTNG, and outperform state-of-the-art models such as Halo Occupation Distributions (HODs). Our WGAN samples reproduce the abundance of HI across 9 orders of magnitude, from the Ly$α$ forest to Damped Lyman Absorbers. WGAN can produce new samples orders of magnitude faster than hydrodynamic simulations.","abx":0,"nw":0,"d":"2019-04-29","dq":0,"y":2019,"au":[940,204,633,1636,203,1662,1068,1646],"c":41,"cs":0,"bib":"2019arXiv190412846Z","v":"arXiv.org","lk":"arXiv:1904.12846","url":"https://arxiv.org/abs/1904.12846","doi":"10.48550/arXiv.1904.12846","tg":{"s":["Other simulations"],"d":["Neutral hydrogen & 21cm"],"m":["Generative models"],"u":[]},"x":-0.3943,"yy":0.054,"p3":[0.5052,0.1745,0.1541],"sim":{"k":"e","l":[[145,0.96],[122,0.955],[69,0.955],[97,0.953],[3,0.949]]},"c3":[125.56,-85.36,-43.41],"c2":[47.59,-64.39],"k":6,"r":[166,173,180,193,199,204],"rm":0},{"id":"1903.05161","t":"Cosmic voids: a novel probe to shed light on our Universe","ab":"Cosmic voids, the less dense patches of the Universe, are promising laboratories to extract cosmological information. Thanks to their unique low density character, voids are extremely sensitive to diffuse components such as neutrinos and dark energy, and represent ideal environments to study modifications of gravity, where the effects of such modifications are expected to be more prominent. Robust void-related observables, including for example redshift-space distortions (RSD) and weak lensing around voids, are a promising way to chase and test new physics. Cosmological analysis of the large-scale structure of the Universe predominantly relies on the high density regions. Current and upcoming surveys are designed to optimize the extraction of cosmological information from these zones, but leave voids under-exploited. A dense, large area spectroscopic survey with imaging capabilities is ideal to exploit the power of voids fully. Besides helping illuminate the nature of dark energy, modified gravity, and neutrinos, this survey will give access to a detailed map of under-dense regions, providing an unprecedented opportunity to observe and study a so far under-explored galaxy population.","abx":0,"nw":0,"d":"2019-03-12","dq":0,"y":2019,"au":[153,533,452,451,1725,1830,1242,380,1778,1359,180,1288,1327,128,381,1646,258,376,628,1322,706,1184,1520,1513,791,1526,633,251,1849],"c":84,"cs":0,"bib":"2019BAAS...51c..40P","v":"","lk":"arXiv:1903.05161","url":"https://arxiv.org/abs/1903.05161","doi":"","tg":{"s":["No simulations"],"d":["Large-scale structure","Massive neutrinos","Dark matter & modified gravity","Surveys & instruments"],"m":["No ML"],"u":[]},"x":0.386,"yy":0.2355,"p3":[-0.3733,0.3203,-0.3044],"sim":{"k":"e","l":[[93,0.954],[129,0.954],[209,0.934],[158,0.926],[61,0.926]]},"c3":[-45.78,136.41,-112.54],"c2":[-190.42,43.43],"k":1,"r":[200,209,217],"rm":0},{"id":"1903.03689","t":"Neutrino Mass from Cosmology: Probing Physics Beyond the Standard Model","ab":"Recent advances in cosmic observations have brought us to the verge of discovery of the absolute scale of neutrino masses. Nonzero neutrino masses are known evidence of new physics beyond the Standard Model. Our understanding of the clustering of matter in the presence of massive neutrinos has significantly improved over the past decade, yielding cosmological constraints that are tighter than any laboratory experiment, and which will improve significantly over the next decade, resulting in a guaranteed detection of the absolute neutrino mass scale.","abx":0,"nw":0,"d":"2019-03-08","dq":0,"y":2019,"au":[393,1246,451,1325,1657,161,171,699,1248,1237,941,263,197,633],"c":76,"cs":0,"bib":"2019BAAS...51c..64D","v":"","lk":"arXiv:1903.03689","url":"https://arxiv.org/abs/1903.03689","doi":"","tg":{"s":["No simulations"],"d":["Massive neutrinos","Surveys & instruments"],"m":["No ML"],"u":["Surveys & instruments"]},"x":0.5808,"yy":-0.4676,"p3":[-0.3595,-0.3261,-0.5821],"sim":{"k":"e","l":[[161,0.939],[150,0.937],[215,0.934],[207,0.934],[132,0.932]]},"c3":[-70.0,97.35,-163.49],"c2":[-212.27,35.49],"k":3,"r":[163,169,200,214,215,216,217],"rm":0},{"id":"1902.10714","t":"Atomic and molecular gas in IllustrisTNG galaxies at low redshift","ab":"We have recently developed a post-processing framework to estimate the abundance of atomic and molecular hydrogen (HI and H2, respectively) in galaxies in large-volume cosmological simulations. Here we compare the HI and H2 content of IllustrisTNG galaxies to observations. We mostly restrict this comparison to $z \\approx 0$ and consider six observational metrics: the overall abundance of HI and H2, their mass functions, gas fractions as a function of stellar mass, the correlation between H2 and star formation rate, the spatial distribution of gas, and the correlation between gas content and morphology. We find generally good agreement between simulations and observations, particularly for the gas fractions and the HI mass-size relation. The H2 mass correlates with star formation rate as expected, revealing an almost constant depletion time that evolves up to z = 2 as observed. However, we also discover a number of tensions with varying degrees of significance, including an overestimate of the total neutral gas abundance at z = 0 by about a factor of two and a possible excess of satellites with no or very little neutral gas. These conclusions are robust to the modelling of the HI/H2 transition. In terms of their neutral gas properties, the IllustrisTNG simulations represent an enormous improvement over the original Illustris run. All data used in this paper are publicly available as part of the IllustrisTNG data release.","abx":0,"nw":0,"d":"2019-02-27","dq":0,"y":2019,"au":[248,130,388,94,1634,1061,627,478,189,1781,633,1243],"c":133,"cs":0,"bib":"2019MNRAS.487.1529D","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:1902.10714","url":"https://arxiv.org/abs/1902.10714","doi":"10.1093/mnras/stz1323","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["No ML"],"u":[]},"x":-0.6788,"yy":-0.0406,"p3":[-0.2518,0.6175,-0.0677],"sim":{"k":"e","l":[[176,0.937],[74,0.932],[16,0.928],[42,0.928],[198,0.927]]},"c3":[225.65,44.03,-119.5],"c2":[158.48,224.7],"k":2,"r":[176,179,180],"rm":0},{"id":"1902.05965","t":"From Dark Matter to Galaxies with Convolutional Networks","ab":"Cosmological surveys aim at answering fundamental questions about our Universe, including the nature of dark matter or the reason of unexpected accelerated expansion of the Universe. In order to answer these questions, two important ingredients are needed: 1) data from observations and 2) a theoretical model that allows fast comparison between observation and theory. Most of the cosmological surveys observe galaxies, which are very difficult to model theoretically due to the complicated physics involved in their formation and evolution; modeling realistic galaxies over cosmological volumes requires running computationally expensive hydrodynamic simulations that can cost millions of CPU hours. In this paper, we propose to use deep learning to establish a mapping between the 3D galaxy distribution in hydrodynamic simulations and its underlying dark matter distribution. One of the major challenges in this pursuit is the very high sparsity in the predicted galaxy distribution. To this end, we develop a two-phase convolutional neural network architecture to generate fast galaxy catalogues, and compare our results against a standard cosmological technique. We find that our proposed approach either outperforms or is competitive with traditional cosmological techniques. Compared to the common methods used in cosmology, our approach also provides a nice trade-off between time-consumption (comparable to fastest benchmark in the literature) and the quality and accuracy of the predicted simulation. In combination with current and upcoming data from cosmological observations, our method has the potential to answer fundamental questions about our Universe with the highest accuracy.","abx":0,"nw":0,"d":"2019-02-15","dq":0,"y":2019,"au":[1813,1829,1800,1847,1662,694,633,1646],"c":84,"cs":0,"bib":"2019arXiv190205965Z","v":"arXiv.org","lk":"arXiv:1902.05965","url":"https://arxiv.org/abs/1902.05965","doi":"10.48550/arXiv.1902.05965","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["CNN"],"u":[]},"x":-0.217,"yy":-0.0592,"p3":[0.5501,-0.0463,0.0289],"sim":{"k":"e","l":[[154,0.976],[137,0.961],[38,0.948],[145,0.948],[125,0.943]]},"c3":[27.52,-105.39,42.99],"c2":[21.79,-131.39],"k":6,"r":[215],"rm":0},{"id":"1901.06045","t":"BE-HaPPY: Bias Emulator for Halo Power Spectrum including massive neutrinos","ab":"We study the clustering properties of dark matter halos in real- and redshift-space in cosmologies with massless and massive neutrinos through a large set of state-of-the-art N-body simulations. We provide quick and easy-to-use prescriptions for the halo bias on linear and mildly non-linear scales, both in real and redshift space, which are valid also for massive neutrinos cosmologies. Finally we present a halo bias emulator,$\\textbf{BE-HaPPY}$, calibrated on the N-body simulations, which is fast enough to be used in the standard Markov Chain Monte Carlo approach to cosmological inference. For a fiducial standard $Λ$CDM cosmology $\\textbf{BE-HaPPY}$ provides percent or sub-percent accuracy on the scales of interest (linear and well into the mildly non-linear regime), meeting therefore for the halo-bias the accuracy requirements for the analysis of next-generation large--scale structure surveys.","abx":0,"nw":0,"d":"2019-01-18","dq":0,"y":2019,"au":[456,633,1076,156],"c":20,"cs":0,"bib":"2019JCAP...12..057V","v":"","lk":"arXiv:1901.06045","url":"https://arxiv.org/abs/1901.06045","doi":"","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Perturbation theory & analytic models","No ML"],"u":["Perturbation theory & analytic models","No ML"]},"x":0.4986,"yy":-0.5137,"p3":[-0.2435,-0.0684,-0.6301],"sim":{"k":"w","l":[[191,0.223],[144,0.208],[214,0.205],[203,0.202],[185,0.2]]},"c3":[-134.8,-68.02,-171.03],"c2":[-197.73,-163.76],"k":3,"r":[169,177,185,186,196,214,215,216],"rm":0},{"id":"1812.02148","t":"Dipole Distortions in the Intergalactic Medium","ab":"Baryonic feedback can significantly modify the spatial distribution of matter on small scales and create a bulk relative velocity between the dominant cold dark matter and the hot gas. We study the consequences of such bulk motions using two high resolution hydrodynamic simulations, one with no feedback and one with very strong feedback. We find that relative velocities of order $100\\ \\kms$ are produced in the strong feedback simulation whereas it is much smaller when there is no feedback. Such relative motions induce dipole distortions to the gas, which we quantify by computing the dipole correlation function. We find halo coordinates and velocities are systematically changed in the direction of the relative velocity. Finally, we discuss potential to observe the relative velocity via large scale structure, Sunyaev-Zel'dovich and line emission measurements. Given the nonlinear nature of this effect, it should next be studied in simulations with different feedback implementations/strengths to determine the available model space.","abx":0,"nw":0,"d":"2018-12-05","dq":0,"y":2018,"au":[461,1749,633],"c":1,"cs":0,"bib":"2019MNRAS.487.4181I","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:1812.02148","url":"https://arxiv.org/abs/1812.02148","doi":"10.1093/mnras/stz1542","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":-0.0438,"yy":0.7107,"p3":[-0.5055,0.3111,0.0667],"sim":{"k":"e","l":[[67,0.93],[52,0.924],[114,0.923],[198,0.922],[100,0.921]]},"c3":[-3.41,-147.2,-148.27],"c2":[-95.92,-66.6],"k":5,"r":[190,196,210],"rm":0},{"id":"1811.12412","t":"First detection of scale-dependent linear halo bias in $N$-body simulations with massive neutrinos","ab":"Using $N$-body simulations with massive neutrino density perturbations, we detect the scale-dependent linear halo bias with high significance. This is the first time that this effect is detected in simulations containing neutrino density perturbations on all scales, confirming the same finding from separate universe simulations. The scale dependence is the result of the additional scale in the system, i.e. the massive neutrino free-streaming length, and it persists even if the bias is defined with respect to the cold dark matter plus baryon (instead of total matter) power spectrum. The separate universe approach provides a good model for the scale-dependent linear bias, and the effect is approximately $0.25f_ν$ and $0.43f_ν$ for halos with bias of 1.7 and 3.5, respectively. While the size of the effect is small, it is ${\\it not}$ insignificant in terms of $f_ν$ and should therefore be included to accurately constrain neutrino mass from clustering statistics of biased tracers. More importantly, this feature is a distinct signature of free-streaming particles and cannot be mimicked by other components of the standard cosmological model.","abx":0,"nw":0,"d":"2018-11-29","dq":0,"y":2018,"au":[368,1237,633],"c":55,"cs":0,"bib":"2019PhRvL.122d1302C","v":"Physical Review Letters","lk":"arXiv:1811.12412","url":"https://arxiv.org/abs/1811.12412","doi":"10.1103/PhysRevLett.122.041302","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Perturbation theory & analytic models","No ML"],"u":["Perturbation theory & analytic models"]},"x":0.5333,"yy":-0.5514,"p3":[-0.2299,-0.0238,-0.6818],"sim":{"k":"e","l":[[215,0.949],[161,0.946],[144,0.944],[186,0.94],[214,0.938]]},"c3":[-128.61,-41.01,-195.53],"c2":[-219.12,-151.37],"k":3,"r":[185,186,196,213,214,215,216,218],"rm":0},{"id":"1811.10609","t":"Measuring the EoR Power Spectrum Without Measuring the EoR Power Spectrum","ab":"The large-scale structure of the Universe should soon be measured at high redshift during the Epoch of Reionization (EoR) through line-intensity mapping. A number of ongoing and planned surveys are using the 21 cm line to trace neutral hydrogen fluctuations in the intergalactic medium (IGM) during the EoR. These may be fruitfully combined with separate efforts to measure large-scale emission fluctuations from galactic lines such as [CII], CO, H-$α$, and Ly-$α$ during the same epoch. The large scale power spectrum of each line encodes important information about reionization, with the 21 cm power spectrum providing a relatively direct tracer of the ionization history. Here we show that the large scale 21 cm power spectrum can be extracted using only cross-power spectra between the 21 cm fluctuations and each of two separate line-intensity mapping data cubes. This technique is more robust to residual foregrounds than the usual 21 cm auto-power spectrum measurements and so can help in verifying auto-spectrum detections. We characterize the accuracy of this method using numerical simulations and find that the large-scale 21 cm power spectrum can be inferred to an accuracy of within 5% for most of the EoR, reaching 0.6% accuracy on a scale of $k\\sim0.1\\,\\text{Mpc}^{-1}$ at $\\left< x_i \\right> = 0.36$ ($z = 8.34$ in our model). An extension from two to $N$ additional lines would provide $N(N-1)/2$ cross-checks on the large-scale 21 cm power spectrum. This work strongly motivates redundant line-intensity mapping surveys probing the same cosmological volumes.","abx":0,"nw":0,"d":"2018-11-26","dq":0,"y":2018,"au":[182,633,129],"c":32,"cs":0,"bib":"2019ApJ...874..133B","v":"Astrophysical Journal","lk":"arXiv:1811.10609","url":"https://arxiv.org/abs/1811.10609","doi":"10.3847/1538-4357/ab0a08","tg":{"s":["Other simulations"],"d":["Neutral hydrogen & 21cm"],"m":["No ML"],"u":[]},"x":-0.5459,"yy":-0.3481,"p3":[0.3737,0.3885,-0.5879],"sim":{"k":"e","l":[[189,0.951],[205,0.95],[210,0.945],[194,0.933],[184,0.931]]},"c3":[196.86,-121.59,-125.62],"c2":[59.64,251.28],"k":2,"r":[183,205],"rm":0},{"id":"1811.02743","t":"Cosmology with Phase 1 of the Square Kilometre Array; Red Book 2018: Technical specifications and performance forecasts","ab":"We present a detailed overview of the cosmological surveys that will be carried out with Phase 1 of the Square Kilometre Array (SKA1), and the science that they will enable. We highlight three main surveys: a medium-deep continuum weak lensing and low-redshift spectroscopic HI galaxy survey over 5,000 sqdeg; a wide and deep continuum galaxy and HI intensity mapping survey over 20,000 sqdeg from z = 0.35 - 3; and a deep, high-redshift HI intensity mapping survey over 100 sqdeg from z = 3 - 6. Taken together, these surveys will achieve an array of important scientific goals: measuring the equation of state of dark energy out to z ~ 3 with percent-level precision measurements of the cosmic expansion rate; constraining possible deviations from General Relativity on cosmological scales by measuring the growth rate of structure through multiple independent methods; mapping the structure of the Universe on the largest accessible scales, thus constraining fundamental properties such as isotropy, homogeneity, and non-Gaussianity; and measuring the HI density and bias out to z = 6. These surveys will also provide highly complementary clustering and weak lensing measurements that have independent systematic uncertainties to those of optical surveys like LSST and Euclid, leading to a multitude of synergies that can improve constraints significantly beyond what optical or radio surveys can achieve on their own. This document, the 2018 Red Book, provides reference technical specifications, cosmological parameter forecasts, and an overview of relevant systematic effects for the three key surveys, and will be regularly updated by the Cosmology Science Working Group in the run up to start of operations and the Key Science Programme of SKA1.","abx":0,"nw":0,"d":"2018-11-07","dq":0,"y":2018,"au":[3,399,1524,1450,1674,1443,784,453,92,1240,1066,629,1835,451,1629,1239,936,449,349,187,282,1269,547,1667,1815,1681,1723,390,832,987,1682,1251,1534,1317,747,924,156,1247,1630,1184,469,1727,1254,633,1838,442,911],"c":435,"cs":0,"bib":"2020PASA...37....7S","v":"Publications Astronomical Society of Australia","lk":"arXiv:1811.02743","url":"https://arxiv.org/abs/1811.02743","doi":"10.1017/pasa.2019.51","tg":{"s":["No simulations"],"d":["Large-scale structure","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["Fisher forecasts","No ML"],"u":[]},"x":-0.6885,"yy":-0.5732,"p3":[-0.0813,0.5585,-0.6262],"sim":{"k":"e","l":[[61,0.949],[183,0.941],[160,0.939],[174,0.934],[204,0.933]]},"c3":[91.09,2.06,-152.11],"c2":[-57.45,173.2],"k":1,"r":[180,183,193,194,199,200,202,204,210],"rm":0},{"id":"1811.00043","t":"Cosmological Hydrodynamic Simulations with Suppressed Variance in the Lyman-$α$ Forest Power Spectrum","ab":"We test a method to reduce unwanted sample variance when predicting Lyman-$α$ (ly$α$) forest power spectra from cosmological hydrodynamical simulations. Sample variance arises due to sparse sampling of modes on large scales and propagates to small scales through non-linear gravitational evolution. To tackle this, we generate initial conditions in which the density perturbation amplitudes are {\\it fixed} to the ensemble average power spectrum -- and are generated in {\\it pairs} with exactly opposite phases. We run $50$ such simulations ($25$ pairs) and compare their performance against $50$ standard simulations by measuring the ly$α$ 1D and 3D power spectra at redshifts $z=2$, 3, and 4. Both ensembles use periodic boxes of $40$ Mpc/h containing $512^3$ particles each of dark matter and gas. As a typical example of improvement, for wavenumbers $k=0.25$ h/Mpc at $z=3$, we find estimates of the 1D and 3D power spectra converge $34$ and $12$ times faster in a paired-fixed ensemble compared with a standard ensemble. We conclude that, by reducing the computational time required to achieve fixed accuracy on predicted power spectra, the method frees up resources for exploration of varying thermal and cosmological parameters -- ultimately allowing the improved precision and accuracy of statistical inference.","abx":0,"nw":0,"d":"2018-10-31","dq":0,"y":2018,"au":[1067,177,171,633,984,1651],"c":1,"cs":0,"bib":"2018arXiv181100043A","v":"Astrophysical Journal","lk":"arXiv:1811.00043","url":"https://arxiv.org/abs/1811.00043","doi":"10.3847/1538-4357/aaf576","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["No ML"],"u":["Galaxies & baryonic feedback"]},"x":0.3685,"yy":-0.0048,"p3":[-0.2136,-0.1261,0.1998],"sim":{"k":"e","l":[[177,0.933],[41,0.932],[75,0.927],[158,0.926],[156,0.925]]},"c3":[-157.87,-76.94,-81.82],"c2":[-166.84,-74.58],"k":6,"r":[177,196],"rm":0},{"id":"1810.09572","t":"Inflation and Early Dark Energy with a Stage II Hydrogen Intensity Mapping Experiment","ab":"This white paper envisions a revolutionary post-DESI, post-LSST dark energy program based on intensity mapping of the redshifted 21cm emission line from neutral hydrogen at radio frequencies. The proposed intensity mapping survey has the unique capability to quadruple the volume of the Universe surveyed by optical programs, provide a percent-level measurement of the expansion history to $z \\sim 6$, open a window to explore physics beyond the concordance $Λ$CDM model, and to significantly improve the precision on standard cosmological parameters. In addition, characterization of dark energy and new physics will be powerfully enhanced by cross-correlations with optical surveys and cosmic microwave background measurements. The rich dataset obtained by the proposed intensity mapping instrument will be simultaneously useful in exploring the time-domain physics of fast radio transients and pulsars, potentially in live \"multi-messenger\" coincidence with other observatories. The core dark energy/inflation science advances enabled by this program are the following: (i) Measure the expansion history of the universe over $z=0.3-6$ with a single instrument, extending the range deep into the pre-acceleration era, providing an unexplored window for new physics; (ii) Measure the growth rate of structure in the universe over the same redshift range; (iii) Observe, or constrain, the presence of inflationary relics in the primordial power spectrum, improving existing constraints by an order of magnitude; (iv) Observe, or constrain, primordial non-Gaussianity with unprecedented precision, improving constraints on several key numbers by an order of magnitude. Detailed mapping of the enormous, and still largely unexplored, volume of cosmic space will thus provide unprecedented information on fundamental questions of the vacuum energy and early-universe physics.","abx":0,"nw":0,"d":"2018-10-22","dq":0,"y":2018,"au":[1,1540,558,990,1450,540,1745,1643,1074,1659,930,446,1255,467,135,995,1383,1283,1063,170,1438,747,870,383,197,988,1439,142,1448,633,254,1245],"c":136,"cs":0,"bib":"2018arXiv181009572C","v":"","lk":"arXiv:1810.09572","url":"https://arxiv.org/abs/1810.09572","doi":"","tg":{"s":["No simulations"],"d":["Primordial non-Gaussianity","Dark matter & modifie
