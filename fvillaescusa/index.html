d gravity","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["No ML"],"u":["Dark matter & modified gravity"]},"x":-0.6299,"yy":-0.5093,"p3":[0.0178,0.515,-0.6971],"sim":{"k":"e","l":[[159,0.947],[204,0.938],[183,0.935],[171,0.93],[160,0.928]]},"c3":[122.49,55.16,-140.99],"c2":[-9.21,228.06],"k":1,"r":[160,164,179,180,184,189,193,194],"rm":0},{"id":"1810.02680","t":"Fundamental Physics with the Square Kilometre Array","ab":"The Square Kilometre Array (SKA) is a planned large radio interferometer designed to operate over a wide range of frequencies, and with an order of magnitude greater sensitivity and survey speed than any current radio telescope. The SKA will address many important topics in astronomy, ranging from planet formation to distant galaxies. However, in this work, we consider the perspective of the SKA as a facility for studying physics. We review four areas in which the SKA is expected to make major contributions to our understanding of fundamental physics: cosmic dawn and reionisation; gravity and gravitational radiation; cosmology and dark energy; and dark matter and astroparticle physics. These discussions demonstrate that the SKA will be a spectacular physics machine, which will provide many new breakthroughs and novel insights on matter, energy and spacetime.","abx":0,"nw":0,"d":"2018-10-05","dq":0,"y":2018,"au":[159,1450,1674,959,747,924,156,1654,1045,1629,481,399,1464,642,282,21,1110,284,285,567,805,290,1492,1860,1400,832,1298,413,784,848,1840,1534,1164,1560,1570,453,92,1398,1176,1419,1184,1185,875,1718,620,1720,622,633,1829,344,1066,624,233],"c":502,"cs":0,"bib":"2020PASA...37....2W","v":"Publications Astronomical Society of Australia","lk":"arXiv:1810.02680","url":"https://arxiv.org/abs/1810.02680","doi":"10.1017/pasa.2019.42","tg":{"s":["No simulations"],"d":["Large-scale structure","Dark matter & modified gravity","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["No ML"],"u":[]},"x":-0.6756,"yy":-0.6179,"p3":[-0.108,0.5276,-0.6862],"sim":{"k":"e","l":[[171,0.934],[204,0.93],[61,0.928],[183,0.928],[160,0.926]]},"c3":[31.37,4.77,-188.28],"c2":[-129.64,-37.94],"k":1,"r":[193,197,199,200,202,213,214,215,216],"rm":0},{"id":"1808.09968","t":"Extreme Spheres: Counts-in-cells for 21cm intensity mapping","ab":"Intensity mapping surveys will provide access to a coarse view of the cosmic large-scale structure in unprecedented large volumes at high redshifts. Given the large fractions of the sky that can be efficiently scanned using emission from cosmic neutral hydrogen (HI), intensity mapping is ideally suited to probe a wide range of density environments and hence to constrain cosmology and fundamental physics. To efficiently extract information from 21cm intensities beyond average, one needs non-Gaussian statistics that capture large deviations from mean HI density. Counts-in-cells statistics are ideally suited for this purpose, as the statistics of matter densities in spheres can be predicted accurately on scales where their variance is below unity. We use a large state-of-the-art magneto-hydrodynamic simulation from the IllustrisTNG project to determine the relation between neutral hydrogen and matter densities in cells. We demonstrate how our theoretical knowledge about the matter PDF for a given cosmology can be used to extract a parametrisation-independent HI bias function from a measured neutral hydrogen PDF. When combining the predicted matter PDFs with a simple bias fit to the simulation, we obtain a prediction for neutral hydrogen PDFs at a few percent accuracy at scale R=5 Mpc/h from redshift z=5 to z=1. Furthermore, we find a density-dependent HI clustering signal that is consistent with theoretical expectations and could allow for joint constraints of HI bias and the amplitude of matter fluctuations or the growth of structure.","abx":0,"nw":0,"d":"2018-08-29","dq":0,"y":2018,"au":[1357,394,633,1633,1061,1651],"c":17,"cs":0,"bib":"2019MNRAS.484..269L","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:1808.09968","url":"https://arxiv.org/abs/1808.09968","doi":"10.1093/mnras/sty3469","tg":{"s":["Other simulations"],"d":["Large-scale structure","Neutral hydrogen & 21cm"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.5365,"yy":-0.1329,"p3":[0.2148,0.482,-0.1872],"sim":{"k":"e","l":[[180,0.948],[145,0.947],[138,0.945],[189,0.94],[198,0.94]]},"c3":[142.43,-14.43,-149.71],"c2":[44.64,196.43],"k":2,"r":[176,180,183,184,189,193,194,199,202,204,205,210],"rm":0},{"id":"1806.02341","t":"Modeling the atomic-to-molecular transition in cosmological simulations of galaxy formation","ab":"Large-scale cosmological simulations of galaxy formation currently do not resolve the densities at which molecular hydrogen forms, implying that the atomic-to-molecular transition must be modeled either on the fly or in postprocessing. We present an improved postprocessing framework to estimate the abundance of atomic and molecular hydrogen and apply it to the IllustrisTNG simulations. We compare five different models for the atomic-to-molecular transition, including empirical, simulation-based, and theoretical prescriptions. Most of these models rely on the surface density of neutral hydrogen and the ultraviolet (UV) flux in the Lyman-Werner band as input parameters. Computing these quantities on the kiloparsec scales resolved by the simulations emerges as the main challenge. We show that the commonly used Jeans length approximation to the column density of a system can be biased and exhibits large cell-to-cell scatter. Instead, we propose to compute all surface quantities in face-on projections and perform the modeling in two dimensions. In general, the two methods agree on average, but their predictions diverge for individual galaxies and for models based on the observed midplane pressure of galaxies. We model the UV radiation from young stars by assuming a constant escape fraction and optically thin propagation throughout the galaxy. With these improvements, we find that the five models for the atomic-to-molecular transition roughly agree on average but that the details of the modeling matter for individual galaxies and the spatial distribution of molecular hydrogen. We emphasize that the estimated molecular fractions are approximate due to the significant systematic uncertainties.","abx":0,"nw":0,"d":"2018-06-06","dq":0,"y":2018,"au":[248,130,915,627,1061,388,160,189,478,702,633,1440,1243],"c":125,"cs":0,"bib":"2018ApJS..238...33D","v":"Astrophysical Journal Supplement Series","lk":"arXiv:1806.02341","url":"https://arxiv.org/abs/1806.02341","doi":"10.3847/1538-4365/aae387","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["Perturbation theory & analytic models","No ML"],"u":["Perturbation theory & analytic models"]},"x":-0.656,"yy":-0.0241,"p3":[0.0038,0.6082,-0.1349],"sim":{"k":"e","l":[[165,0.937],[175,0.927],[198,0.926],[42,0.926],[16,0.92]]},"c3":[211.92,13.69,-138.28],"c2":[134.73,200.23],"k":2,"r":[180],"rm":0},{"id":"1806.01871","t":"Statistical properties of paired fixed fields","ab":"The initial conditions of cosmological simulations are commonly drawn from a Gaussian ensemble. The limited number of modes inside a simulation volume gives rise to statistical fluctuations known as \\textit{sample variance}, limiting the accuracy of simulation predictions. Fixed fields offer an alternative initialization strategy; they have the same power spectrum as standard Gaussian fields but without intrinsic amplitude scatter at linear order. Paired fixed fields consists of two fixed fields with opposite phases that cancel phase correlations which otherwise induce second-order scatter in the non-linear power spectrum. We study the statistical properties of those fields for 19 different quantities at different redshifts through a large set of 600 N-body and 506 state-of-the-art magneto-hydrodynamic simulations covering a wide range of scales, mass and spatial resolutions. We find that paired fixed simulations do not introduce a bias on any of the examined quantities. We quantify the statistical improvement brought by these simulations, over standard ones, on different power spectra such as matter, halos, CDM, gas, stars, black-holes and magnetic fields, finding that they can reduce their variance by factors as large as $10^6$. We quantify the improvement achieved by fixing and by pairing, showing that sample variance in some quantities can be highly suppressed by pairing after fixing. Paired fixed simulations do not change the scatter in quantities such as the probability distribution function of matter density, or the halo, void or stellar mass functions. We argue that procedures aiming at reducing the sample variance of those quantities are unlikely to work. Our results show that paired fixed simulations do not affect either mean relations or scatter of galaxy properties, and suggest that the information embedded in 1-pt statistics is highly complementary to that in clustering.","abx":0,"nw":0,"d":"2018-06-05","dq":0,"y":2018,"au":[633,1655,1651,177,251,1067,171,1325,452],"c":68,"cs":0,"bib":"2018ApJ...867..137V","v":"Astrophysical Journal","lk":"arXiv:1806.01871","url":"https://arxiv.org/abs/1806.01871","doi":"10.3847/1538-4357/aae52b","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":0.3796,"yy":0.0167,"p3":[-0.235,-0.0784,0.4437],"sim":{"k":"e","l":[[172,0.933],[37,0.921],[7,0.917],[98,0.917],[75,0.916]]},"c3":[-141.83,-29.09,-111.05],"c2":[-185.21,-28.71],"k":7,"r":[191,196],"rm":0},{"id":"1805.11607","t":"The kinematic Sunyaev-Zel'dovich effect of the large-scale structure (II): the effect of modified gravity","ab":"The key to understand the nature of dark energy relies in our ability to probe the distant Universe. In this framework, the recent detection of the kinematic Sunyaev-Zel'dovich (kSZ) effect signature in the cosmic microwave background obtained with the South Pole Telescope (SPT) is extremely useful since this observable is sensitive to the high-redshift diffuse plasma. We analyse a set of cosmological hydrodynamical simulation with 4 different realisations of a Hu & Sawicki $f(R)$ gravity model, parametrised by the values of $\\overline{f}_{\\rm R,0}=(0,-10^{-6},-10^{-5},-10^{-4})$, to compute the properties of the kSZ effect due to the ionized Universe and how they depend on $\\overline{f}_{\\rm R,0}$ and on the redshift of reionization, $z_{\\rm re}$. In the standard General Relativity limit ($\\overline{f}_{\\rm R,0}$=0) we obtain an amplitude of the kSZ power spectrum of $\\mathcal{D}^{\\rm kSZ}_{3000}=4.1\\,$$μ$K$^2$ ($z_{\\rm re}$=8.8), close to the $+1σ$ limit of the $\\mathcal{D}^{\\rm kSZ}_{3000}=(2.9\\pm1.3)\\,$$μ$K$^2$ measurement by SPT. This corresponds to an upper limit on the kSZ contribute from patchy reionization of $\\mathcal{D}^{\\rm kSZ,patchy}_{3000}<0.9\\,$$μ$K$^2$ (95 per cent confidence level). Modified gravity boosts the kSZ signal by about 3, 12 and 50 per cent for $\\overline{f}_{\\rm R,0}=(-10^{-6},-10^{-5},-10^{-4})$, respectively, with almost no dependence on the angular scale. This means that with modified gravity the limits on patchy reionization shrink significantly: for $\\overline{f}_{\\rm R,0}=-10^{-5}$ we obtain $\\mathcal{D}^{\\rm kSZ,patchy}_{3000}<0.4\\,$$μ$K$^2$. Finally, we provide an analytical formula for the scaling of the kSZ power spectrum with $z_{\\rm re}$ and $\\overline{f}_{\\rm R,0}$ at different multipoles: at $\\ell=3000$ we obtain $\\mathcal{D}^{\\rm kSZ}_{3000}\\propto z_{\\rm re}^{0.24}\\left(1+\\sqrt{\\left|\\overline{f}_{\\rm R,0}\\right|}\\right)^{41}$.","abx":0,"nw":0,"d":"2018-05-29","dq":0,"y":2018,"au":[1182,1230,633],"c":13,"cs":0,"bib":"2018MNRAS.481.2497R","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:1805.11607","url":"https://arxiv.org/abs/1805.11607","doi":"10.1093/mnras/sty2225","tg":{"s":["Other simulations"],"d":["Dark matter & modified gravity","CMB & SZ"],"m":["Perturbation theory & analytic models","No ML"],"u":["Perturbation theory & analytic models"]},"x":0.4039,"yy":-0.256,"p3":[-0.0341,-0.1302,-0.32],"sim":{"k":"e","l":[[187,0.964],[99,0.928],[217,0.927],[128,0.925],[202,0.922]]},"c3":[-74.64,58.41,-267.15],"c2":[-306.54,-26.77],"k":2,"r":[187,212],"rm":0},{"id":"1805.00934","t":"The HI content of dark matter halos at $z\\approx 0$ from ALFALFA","ab":"We combine information from the clustering of HI galaxies in the 100% data release of the Arecibo Legacy Fast ALFA survey (ALFALFA), and from the HI content of optically-selected galaxy groups found in the Sloan Digital Sky Survey (SDSS) to constrain the relation between halo mass $M_h$ and its average total HI mass content $M_{\\rm HI}$. We model the abundance and clustering of neutral hydrogen through a halo-model-based approach, parametrizing the $M_{\\rm HI}(M_h)$ relation as a power law with an exponential mass cutoff. To break the degeneracy between the amplitude and low-mass cutoff of the $M_{\\rm HI}(M_h)$ relation, we also include a recent measurement of the cosmic HI abundance from the $α$.100 sample. We find that all datasets are consistent with a power-law index $α=0.44\\pm 0.08$ and a cutoff halo mass $\\log_{10}M_{\\rm min}/(h^{-1}M_\\odot)=11.27^{+0.24}_{-0.30}$. We compare these results with predictions from state-of-the-art magneto-hydrodynamical simulations, and find both to be in good qualitative agreement, although the data favours a significantly larger cutoff mass that is consistent with the higher cosmic HI abundance found in simulations. Both data and simulations seem to predict a similar value for the HI bias ($b_{\\rm HI}=0.875\\pm0.022$) and shot-noise power ($P_{\\rm SN}=92^{+20}_{-18}\\,[h^{-1}{\\rm Mpc}]^3$) at redshift $z=0$.","abx":0,"nw":0,"d":"2018-05-02","dq":0,"y":2018,"au":[170,451,633,787,1268],"c":52,"cs":0,"bib":"2019MNRAS.486.5124O","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:1805.00934","url":"https://arxiv.org/abs/1805.00934","doi":"10.1093/mnras/stz1118","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.7362,"yy":-0.0512,"p3":[-0.205,0.5316,-0.1712],"sim":{"k":"e","l":[[165,0.906],[100,0.9],[180,0.899],[198,0.899],[193,0.896]]},"c3":[191.78,-24.58,-146.4],"c2":[89.65,209.59],"k":2,"r":[180,193,198,210],"rm":0},{"id":"1804.09180","t":"Ingredients for 21cm intensity mapping","ab":"[Abridged] We study the abundance and clustering properties of HI at redshifts $z\\leqslant5$ using TNG100, a large state-of-the-art magneto-hydrodynamic simulation of a 75 Mpc/h box size. We show that most of the HI lies within dark matter halos and quantify the average HI mass hosted by halos of mass M at redshift z. We find that only halos with circular velocities larger than $\\simeq$ 30 km/s contain HI. While the density profiles of HI exhibit a large halo-to-halo scatter, the mean profiles are universal across mass and redshift. The HI in low-mass halos is mostly located in the central galaxy, while in massive halos is concentrated in the satellites. We show that the HI and matter density probability distribution functions differ significantly. Our results point out that for small halos the HI bulk velocity goes in the same direction and has the same magnitude as the halo peculiar velocity, while in large halos differences show up. We find that halo HI velocity dispersion follows a power-law with halo mass. We find a complicated HI bias, with HI becoming non-linear already at $k=0.3$ h/Mpc at $z\\gtrsim3$. Our simulation reproduces the DLAs bias value from observations. We find that the clustering of HI can be accurately reproduced by perturbative methods. We identify a new secondary bias, by showing that the clustering of halos depends not only on mass but also on HI content. We compute the amplitude of the HI shot-noise and find that it is small at all redshifts. We study the clustering of HI in redshift-space, and show that linear theory can explain the ratio between the monopoles in redshift- and real-space down to small scales at high redshift. We find that the amplitude of the Fingers-of-God effect is larger for HI than for matter. We point out that accurate 21 cm maps can be created from N-body or approximate simulations rather than full hydrodynamic simulations.","abx":0,"nw":0,"d":"2018-04-24","dq":0,"y":2018,"au":[633,1651,540,170,452,1061,478,790,189,627,248,1243,1516,1535],"c":239,"cs":0,"bib":"2018ApJ...866..135V","v":"Astrophysical Journal","lk":"arXiv:1804.09180","url":"https://arxiv.org/abs/1804.09180","doi":"10.3847/1538-4357/aadba0","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.5513,"yy":-0.189,"p3":[0.1333,0.5246,-0.314],"sim":{"k":"e","l":[[210,0.948],[175,0.948],[193,0.946],[138,0.944],[145,0.941]]},"c3":[140.43,-8.27,-113.34],"c2":[50.98,150.69],"k":2,"r":[176,179,184,189,192,193,194,199,202,204,206,210],"rm":0},{"id":"1803.11539","t":"Primordial non-Gaussianities and zero bias tracers of the Large Scale Structure","ab":"We develop a new method to constraint primordial non-Gaussianities of the local kind using unclustered tracers of the Large Scale Structure. We show that in the limit of low noise, zero bias tracers yield large improvement over standard methods, mostly due to vanishing sampling variance. We propose a simple technique to construct such a tracer, using environmental information obtained from the original sample, and validate our method with N-body simulations. Our results indicate that $σ_{f_{\\mathrm{NL}}^{\\mathrm{loc}}}\\simeq1$ can be reached using only information on a single tracer of sufficiently high number density.","abx":0,"nw":0,"d":"2018-03-30","dq":0,"y":2018,"au":[540,1844,1753,633],"c":33,"cs":0,"bib":"2018PhRvL.121j1301C","v":"Physical Review Letters","lk":"arXiv:1803.11539","url":"https://arxiv.org/abs/1803.11539","doi":"10.1103/PhysRevLett.121.101301","tg":{"s":["Other simulations"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["No ML"],"u":[]},"x":0.3972,"yy":-0.7675,"p3":[-0.1216,-0.6719,-0.3141],"sim":{"k":"e","l":[[152,0.942],[59,0.939],[72,0.934],[101,0.931],[68,0.931]]},"c3":[-203.62,46.65,-86.61],"c2":[-238.8,73.85],"k":4,"r":[],"rm":0},{"id":"1801.03906","t":"Reducing Noise in Cosmological N-body Simulations with Neutrinos","ab":"We present a new method for generating initial conditions for numerical cosmological simulations in which massive neutrinos are treated as an extra set of N-body (collisionless) particles. It allows us to accurately follow the density field for both Cold Dark Matter (CDM) and neutrinos at both high and low redshifts. At high redshifts, the new method is able to reduce the shot noise in the neutrino power spectrum by a factor of more than $10^7$ compared to previous methods, where the power spectrum was dominated by shot noise at all scales. We find that our new approach also helps to reduce the noise on the total matter power spectrum on large scales, whereas on small scales the results agree with previous simulations. Our new method also allows for a systematic study of clustering of the low velocity tail of the distribution function of neutrinos. This method also allows for the study of the evolution of the overall velocity distribution as a function of the environment determined by the CDM field.","abx":0,"nw":0,"d":"2018-01-11","dq":0,"y":2018,"au":[199,463,1738,633],"c":51,"cs":0,"bib":"2018JCAP...09..028B","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:1801.03906","url":"https://arxiv.org/abs/1801.03906","doi":"10.1088/1475-7516/2018/09/028","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["No ML"],"u":[]},"x":0.5875,"yy":-0.3112,"p3":[0.2238,-0.2198,-0.48],"sim":{"k":"e","l":[[196,0.944],[216,0.938],[199,0.935],[45,0.933],[102,0.933]]},"c3":[-132.09,-9.61,-158.48],"c2":[-232.41,-77.94],"k":3,"r":[185,186,187,196,200,206,213,214,215,216],"rm":0},{"id":"1709.09066","t":"Line-Intensity Mapping: 2017 Status Report","ab":"Following the first two annual intensity mapping workshops at Stanford in March 2016 and Johns Hopkins in June 2017, we report on the recent advances in theory, instrumentation and observation that were presented in these meetings and some of the opportunities and challenges that were identified looking forward. With preliminary detections of CO, [CII], Lya and low-redshift 21cm, and a host of experiments set to go online in the next few years, the field is rapidly progressing on all fronts, with great anticipation for a flood of new exciting results. This current snapshot provides an efficient reference for experts in related fields and a useful resource for nonspecialists. We begin by introducing the concept of line-intensity mapping and then discuss the broad array of science goals that will be enabled, ranging from the history of star formation, reionization and galaxy evolution to measuring baryon acoustic oscillations at high redshift and constraining theories of dark matter, modified gravity and dark energy. After reviewing the first detections reported to date, we survey the experimental landscape, presenting the parameters and capabilities of relevant instruments such as COMAP, mmIMe, AIM-CO, CCAT-p, TIME, CONCERTO, CHIME, HIRAX, HERA, STARFIRE, MeerKAT/SKA and SPHEREx. Finally, we describe recent theoretical advances: different approaches to modeling line luminosity functions, several techniques to separate the desired signal from foregrounds, statistical methods to analyze the data, and frameworks to generate realistic intensity map simulations.","abx":0,"nw":0,"d":"2017-09-26","dq":0,"y":2017,"au":[539,1233,129,1063,1284,552,1226,888,1229,889,869,709,318,1436,1450,1745,1850,472,993,202,124,1537,1359,1266,164,832,447,696,717,719,135,982,1337,207,702,191,470,1648,247,1240,1513,710,700,633,535,159,1066,1271],"c":307,"cs":0,"bib":"2017arXiv170909066K","v":"","lk":"arXiv:1709.09066","url":"https://arxiv.org/abs/1709.09066","doi":"","tg":{"s":["No simulations"],"d":["Neutral hydrogen & 21cm","Surveys & instruments"],"m":["No ML"],"u":[]},"x":-0.6843,"yy":-0.519,"p3":[-0.0235,0.3842,-0.65],"sim":{"k":"e","l":[[159,0.943],[171,0.941],[173,0.935],[61,0.93],[174,0.928]]},"c3":[140.88,-85.13,-155.77],"c2":[3.4,187.24],"k":1,"r":[198,199,204],"rm":0},{"id":"1709.07893","t":"High-redshift post-reionization cosmology with 21cm intensity mapping","ab":"We investigate the possibility of performing cosmological studies in the redshift range $2.5<z<5$ through suitable extensions of existing and upcoming radio-telescopes like CHIME, HIRAX and FAST. We use the Fisher matrix technique to forecast the bounds that those instruments can place on the growth rate, the BAO distance scale parameters, the sum of the neutrino masses and the number of relativistic degrees of freedom at decoupling, $N_{\\rm eff}$. We point out that quantities that depend on the amplitude of the 21cm power spectrum, like $fσ_8$, are completely degenerate with $Ω_{\\rm HI}$ and $b_{\\rm HI}$, and propose several strategies to independently constraint them through cross-correlations with other probes. Assuming $5\\%$ priors on $Ω_{\\rm HI}$ and $b_{\\rm HI}$, $k_{\\rm max}=0.2~h{\\rm Mpc}^{-1}$ and the primary beam wedge, we find that a HIRAX extension can constrain, within bins of $Δz=0.1$: 1) the value of $fσ_8$ at $\\simeq4\\%$, 2) the value of $D_A$ and $H$ at $\\simeq1\\%$. In combination with data from Euclid-like galaxy surveys and CMB S4, the sum of the neutrino masses can be constrained with an error equal to $23$ meV ($1σ$), while $N_{\\rm eff}$ can be constrained within 0.02 ($1σ$). We derive similar constraints for the extensions of the other instruments. We study in detail the dependence of our results on the instrument, amplitude of the HI bias, the foreground wedge coverage, the nonlinear scale used in the analysis, uncertainties in the theoretical modeling and the priors on $b_{\\rm HI}$ and $Ω_{\\rm HI}$. We conclude that 21cm intensity mapping surveys operating in this redshift range can provide extremely competitive constraints on key cosmological parameters.","abx":0,"nw":0,"d":"2017-09-22","dq":0,"y":2017,"au":[170,540,633,1254],"c":73,"cs":0,"bib":"2018JCAP...05..004O","v":"","lk":"arXiv:1709.07893","url":"https://arxiv.org/abs/1709.07893","doi":"10.1088/1475-7516/2018/05/004","tg":{"s":["No simulations"],"d":["Massive neutrinos","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["Fisher forecasts","No ML"],"u":[]},"x":-0.5417,"yy":-0.4082,"p3":[0.2912,0.5047,-0.4767],"sim":{"k":"e","l":[[194,0.943],[180,0.939],[205,0.938],[210,0.934],[189,0.934]]},"c3":[85.19,-57.67,-180.53],"c2":[-35.69,141.44],"k":2,"r":[185,192,193,198,199,202,204,210,214,215],"rm":0},{"id":"1708.01154","t":"The imprint of neutrinos on clustering in redshift-space","ab":"(abridged) We investigate the signatures left by the cosmic neutrino background on the clustering of matter, CDM+baryons and halos in redshift-space using a set of more than 1000 N-body and hydrodynamical simulations with massless and massive neutrinos. We find that the effect neutrinos induce on the clustering of CDM+baryons in redshift-space on small scales is almost entirely due to the change in $σ_8$. Neutrinos imprint a characteristic signature in the quadrupole of the matter (CDM+baryons+neutrinos) field on small scales, that can be used to disentangle the effect of $σ_8$ and $M_ν$. We show that the effect of neutrinos on the clustering of halos is very different, on all scales, to the one induced by $σ_8$. We find that the effects of neutrinos of the growth rate of CDM+baryons ranges from $\\sim0.3\\%$ to $2\\%$ on scales $k\\in[0.01, 0.5]~h{\\rm Mpc}^{-1}$ for neutrinos with masses $M_ν\\leqslant 0.15$ eV. We compute the bias between the momentum of halos and the momentum of CDM+baryon and find it to be 1 on large scales for all models with massless and massive neutrinos considered. This point towards a velocity bias between halos and total matter on large scales that it is important to account for in order to extract unbiased neutrino information from velocity/momentum surveys such as kSZ observations. We show that baryonic effects can affect the clustering of matter and CDM+baryons in redshift-space by up to a few percent down to $k=0.5~h{\\rm Mpc}^{-1}$. We find that hydrodynamics and astrophysical processes, as implemented in our simulations, only distort the relative effect that neutrinos induce on the anisotropic clustering of matter, CDM+baryons and halos in redshift-space by less than $1\\%$. Thus, the effect of neutrinos in the fully non-linear regime can be written as a transfer function with very weak dependence on astrophysics.","abx":0,"nw":0,"d":"2017-08-03","dq":0,"y":2017,"au":[633,199,1319,540,1532,1478,452],"c":100,"cs":0,"bib":"2018ApJ...861...53V","v":"Astrophysical Journal","lk":"arXiv:1708.01154","url":"https://arxiv.org/abs/1708.01154","doi":"10.3847/1538-4357/aac6bf","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["No ML"],"u":[]},"x":0.6606,"yy":-0.5026,"p3":[-0.2719,-0.2863,-0.4479],"sim":{"k":"e","l":[[215,0.938],[157,0.937],[144,0.937],[218,0.934],[216,0.934]]},"c3":[-68.3,-59.73,-162.22],"c2":[-161.01,-90.89],"k":3,"r":[186,187,190,196,199,200,201,206,214,215,216,217,218],"rm":0},{"id":"1704.07837","t":"Biases from neutrino bias: to worry or not to worry?","ab":"The relation between the halo field and the matter fluctuations (halo bias), in the presence of massive neutrinos depends on the total neutrino mass, massive neutrinos introduce an additional scale-dependence of the bias which is usually neglected in cosmological analyses. We investigate the magnitude of the systematic effect on interesting cosmological parameters induced by neglecting this scale dependence, finding that while it is not a problem for current surveys, it is non-negligible for future, denser or deeper ones depending on the neutrino mass, the maximum scale used for the analyses and the details of the nuisance parameters considered. However there is a simple recipe to account for the bulk of the effect as to make it fully negligible, which we illustrate and advocate should be included in analysis of forthcoming large-scale structure surveys.","abx":0,"nw":0,"d":"2017-04-25","dq":0,"y":2017,"au":[156,1076,633],"c":51,"cs":0,"bib":"2019MNRAS.483..734R","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:1704.07837","url":"https://arxiv.org/abs/1704.07837","doi":"10.1093/mnras/sty2162","tg":{"s":["No simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["No simulations","Fisher forecasts"]},"x":0.5724,"yy":-0.5858,"p3":[-0.2118,-0.1549,-0.8159],"sim":{"k":"e","l":[[161,0.946],[207,0.941],[169,0.94],[203,0.938],[215,0.937]]},"c3":[-97.42,-83.14,-200.46],"c2":[-173.81,-159.59],"k":3,"r":[185,196,199,214,215,216,218],"rm":0},{"id":"1702.00676","t":"The kinematic Sunyaev-Zel'dovich effect of the large-scale structure (I): dependence on neutrino mass","ab":"The study of neutrinos in astrophysics requires the combination of different observational probes. The temperature anisotropies of the cosmic microwave background induced via the kinematic Sunyaev-Zel'dovich (kSZ) effect may provide interesting information since they are expected to receive significant contribution from high-redshift plasma. We present a set of cosmological hydrodynamical simulations that include a treatment of the neutrino component considering four different sum of neutrino masses: $Σm_ν=(0,0.15,0.3,0.6)$ eV. Using their outputs, we modelled the kSZ effect due to the large-scale structure after the reionization by producing mock maps, then computed the kSZ power spectrum and studied how it depends on $z_{\\rm re}$ and $Σm_ν$. We also run a set of four simulations to study and correct possible systematics due to resolution, finite box size and astrophysics. With massless neutrinos we obtain $\\mathcal{D}^{\\rm kSZ}_{3000}=4.0$ $μ{\\rm K}^2$ ($z_{\\rm re}$=8.8), enough to account for all of the kSZ signal of $\\mathcal{D}^{\\rm kSZ}_{3000}=(2.9\\pm1.3)$ $μ{\\rm K}^2$ measured with the South Pole Telescope. This translates into an upper limit on the kSZ effect due to patchy reionization of $\\mathcal{D}^{\\rm kSZ,patchy}_{3000}<1.0$ $μ{\\rm K}^2$ (95 per cent confidence level). Massive neutrinos induce a damping of kSZ effect power of about 8, 12 and 40 per cent for $Σm_ν=(0.15,0.3,0.6)$ eV, respectively. We study the dependence of the kSZ signal with $z_{\\rm re}$ and the neutrino mass fraction, $f_ν$, and obtain $\\mathcal{D}^{\\rm kSZ}_{3000}\\propto z_{\\rm re}^{0.26}(1-f_ν)^{14.3}$. Interestingly, the scaling with $f_ν$ is significantly shallower with respect to the equivalent thermal SZ effect, and may be used to break the degeneracy with other cosmological parameters.","abx":0,"nw":0,"d":"2017-02-02","dq":0,"y":2017,"au":[1182,633,1230],"c":17,"cs":0,"bib":"2017MNRAS.467..985R","v":"","lk":"arXiv:1702.00676","url":"https://arxiv.org/abs/1702.00676","doi":"10.1093/mnras/stx170","tg":{"s":["Other simulations"],"d":["Massive neutrinos","CMB & SZ"],"m":["No ML"],"u":[]},"x":0.3988,"yy":-0.2753,"p3":[0.041,-0.2632,-0.5101],"sim":{"k":"e","l":[[178,0.964],[59,0.938],[199,0.937],[217,0.936],[216,0.934]]},"c3":[-53.84,-6.43,-216.61],"c2":[-219.43,-19.36],"k":3,"r":[195,196,199,212],"rm":0},{"id":"1611.08606","t":"Lensing is Low: Cosmology, Galaxy Formation, or New Physics?","ab":"We present high signal-to-noise galaxy-galaxy lensing measurements of the BOSS CMASS sample using 250 square degrees of weak lensing data from CFHTLenS and CS82. We compare this signal with predictions from mock catalogs trained to match observables including the stellar mass function and the projected and two dimensional clustering of CMASS. We show that the clustering of CMASS, together with standard models of the galaxy-halo connection, robustly predicts a lensing signal that is 20-40% larger than observed. Detailed tests show that our results are robust to a variety of systematic effects. Lowering the value of $S_{\\rm 8}=σ_{\\rm 8} \\sqrt{Ω_{\\rm m}/0.3}$ compared to Planck2015 reconciles the lensing with clustering. However, given the scale of our measurement ($r<10$ $h^{-1}$ Mpc), other effects may also be at play and need to be taken into consideration. We explore the impact of baryon physics, assembly bias, massive neutrinos, and modifications to general relativity on $ΔΣ$ and show that several of these effects may be non-negligible given the precision of our measurement. Disentangling cosmological effects from the details of the galaxy-halo connection, the effects of baryons, and massive neutrinos, is the next challenge facing joint lensing and clustering analyses. This is especially true in the context of large galaxy samples from Baryon Acoustic Oscillation surveys with precise measurements but complex selection functions.","abx":0,"nw":0,"d":"2016-11-25","dq":0,"y":2016,"au":[151,1648,1670,150,1686,1245,1642,1445,991,894,1728,357,754,1512,1060,273,1235,1639,613,759,1254,633],"c":214,"cs":0,"bib":"2017MNRAS.467.3024L","v":"","lk":"arXiv:1611.08606","url":"https://arxiv.org/abs/1611.08606","doi":"10.1093/mnras/stx258","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":0.7436,"yy":-0.6833,"p3":[-0.2329,-0.0393,-0.4609],"sim":{"k":"e","l":[[218,0.926],[161,0.926],[215,0.922],[54,0.921],[111,0.92]]},"c3":[-25.12,-90.75,-152.51],"c2":[-129.5,-162.96],"k":3,"r":[196,207,214,215],"rm":0},{"id":"1611.07527","t":"The cross-correlation between 21cm intensity mapping maps and the Lyman-alpha forest in the post-reionization era","ab":"We investigate the cross-correlation signal between 21cm intensity mapping maps and the Lyman-alpha forest in the fully non-linear regime using state-of-the-art hydrodynamic simulations. The cross-correlation signal between these fields can provide a coherent and comprehensive picture of the neutral hydrogen (HI) content of our Universe in the post-reionization era, probing both its mass content and volume distribution. We compute the auto-power spectra of both fields together with their cross-power spectrum at z = 2.4 and find that on large scales the fields are completely anti-correlated. This anti-correlation arises because regions with high (low) 21cm emission, such as those with a large (low) concentration of damped Lyman-alpha systems, will show up as regions with low (high) transmitted flux. We find that on scales smaller than k = 0.2 h/Mpc the cross-correlation coefficient departs from -1, at a scale where non-linearities show up. We use the anisotropy of the power spectra in redshift-space to determine the values of the bias and of the redshift-space distortion parameters of both fields; we find that the errors on the value of these parameters could decrease by 30% when adding data from the cross-power spectrum in a conservative analysis. Our results point out that linear theory is capable of reproducing the shape and amplitude of the cross-power up to rather non-linear scales. Finally, we find that the 21cm-Lya cross-power spectrum can be detected by combining data from a BOSS-like survey together with 21cm intensity mapping observations by SKA1-MID with a S/N ratio higher than 3 in the range 0.06< k <1 h/Mpc. We emphasize that while the shape and amplitude of the 21cm auto-power spectrum can be severely affected by residual foreground contamination, cross-power spectra will be less sensitive to that and therefore can be used to identify systematics in the 21cm maps.","abx":0,"nw":0,"d":"2016-11-22","dq":0,"y":2016,"au":[790,633,1254],"c":34,"cs":0,"bib":"2017JCAP...04..001C","v":"","lk":"arXiv:1611.07527","url":"https://arxiv.org/abs/1611.07527","doi":"10.1088/1475-7516/2017/04/001","tg":{"s":["Other simulations"],"d":["Large-scale structure","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["Perturbation theory & analytic models","No ML"],"u":["Surveys & instruments","Perturbation theory & analytic models"]},"x":-0.5338,"yy":-0.3012,"p3":[0.3951,0.3223,-0.465],"sim":{"k":"e","l":[[205,0.968],[210,0.952],[170,0.951],[202,0.944],[175,0.94]]},"c3":[176.05,-26.64,-179.38],"c2":[57.1,220.56],"k":2,"r":[193,198,199,202,204,205,210],"rm":0},{"id":"1610.08501","t":"Accurate initial conditions in mixed Dark Matter--Baryon simulations","ab":"We quantify the error in the results of mixed baryon--dark-matter hydrodynamic simulations, stemming from outdated approximations for the generation of initial conditions. The error at redshift 0 in contemporary large simulations, is of the order of few to ten percent in the power spectra of baryons and dark matter, and their combined total-matter power spectrum. After describing how to properly assign initial displacements and peculiar velocities to multiple species, we review several approximations: (1) {using the total-matter power spectrum to compute displacements and peculiar velocities of both fluids}, (2) scaling the linear redshift-zero power spectrum back to the initial power spectrum using the Newtonian growth factor ignoring homogeneous radiation, (3) using longitudinal-gauge velocities with synchronous-gauge densities, and (4) ignoring the phase-difference in the Fourier modes for the offset baryon grid, relative to the dark-matter grid. Three of these approximations do not take into account that dark matter and baryons experience a scale-dependent growth after photon decoupling, which results in directions of velocity which are not the same as their direction of displacement. We compare the outcome of hydrodynamic simulations with these four approximations to our reference simulation, all setup with the same random seed and simulated using Gadget-III.","abx":0,"nw":0,"d":"2016-10-26","dq":0,"y":2016,"au":[1804,633],"c":24,"cs":0,"bib":"2017MNRAS.467.4401V","v":"","lk":"arXiv:1610.08501","url":"https://arxiv.org/abs/1610.08501","doi":"10.1093/mnras/stx376","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["No ML"],"u":[]},"x":0.6278,"yy":-0.2608,"p3":[0.3269,-0.1715,-0.424],"sim":{"k":"e","l":[[196,0.924],[182,0.923],[199,0.911],[102,0.909],[18,0.906]]},"c3":[-66.58,-150.81,-169.67],"c2":[-134.11,-187.72],"k":3,"r":[196,201,208],"rm":0},{"id":"1610.07624","t":"Simulating cosmologies beyond $Λ$CDM with PINOCCHIO","ab":"We present a method that extends the capabilities of the PINpointing Orbit-Crossing Collapsed HIerarchical Objects (PINOCCHIO) code, allowing it to generate accurate dark matter halo mock catalogues in cosmological models where the linear growth factor and the growth rate depend on scale. Such cosmologies comprise, among others, models with massive neutrinos and some classes of modified gravity theories. We validate the code by comparing the halo properties from PINOCCHIO against N-body simulations, focusing on cosmologies with massive neutrinos: $νΛ$CDM. We analyse the halo mass function, halo two-point correlation function, halo power spectrum and the moments of the halo density field, showing that PINOCCHIO reproduces the results from simulations with the same level of precision as the original code ($\\sim5-10\\%$). We demonstrate that the abundance of halos in cosmologies with massless and massive neutrinos from PINOCCHIO matches very well the outcome of simulations, and point out that PINOCCHIO can reproduce the $Ω_ν-σ_8$ degeneracy that affects the halo mass function. We show that the clustering properties of the halos from PINOCCHIO matches accurately those from simulations both in real and redshift-space, in the latter case up to $k=0.3~h~{\\rm Mpc}^{-1}$. We finally point out that the first moments of the halo density field from simulations are precisely reproduced by PINOCCHIO. We emphasize that the computational time required by PINOCCHIO to generate mock halo catalogues is orders of magnitude lower than the one needed for N-body simulations. This makes this tool ideal for applications like covariance matrix studies within the standard $Λ$CDM model but also in cosmologies with massive neutrinos or some modified gravity theories.","abx":0,"nw":0,"d":"2016-10-24","dq":0,"y":2016,"au":[1082,633,1407,511,1673,540,543],"c":24,"cs":0,"bib":"2017JCAP...01..008R","v":"","lk":"arXiv:1610.07624","url":"https://arxiv.org/abs/1610.07624","doi":"10.1088/1475-7516/2017/01/008","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.4031,"yy":-0.4563,"p3":[-0.3051,0.0205,-0.3522],"sim":{"k":"e","l":[[215,0.934],[143,0.934],[158,0.933],[95,0.929],[153,0.925]]},"c3":[-58.57,-27.95,-246.23],"c2":[-223.11,-122.25],"k":3,"r":[199,200,201,206,207,212,213,214,215,216,217,218],"rm":0},{"id":"1610.05768","t":"Baryon Acoustic Oscillations reconstruction with pixels","ab":"Gravitational non-linear evolution induces a shift in the position of the baryon acoustic oscillations (BAO) peak together with a damping and broadening of its shape that bias and degrades the accuracy with which the position of the peak can be determined. BAO reconstruction is a technique developed to undo part of the effect of non-linearities. We present and analyse a reconstruction method that consists of displacing pixels instead of galaxies and whose implementation is easier than the standard reconstruction method. We show that this method is equivalent to the standard reconstruction technique in the limit where the number of pixels becomes very large. This method is particularly useful in surveys where individual galaxies are not resolved, as in 21cm intensity mapping observations. We validate this method by reconstructing mock pixelated maps, that we build from the distribution of matter and halos in real- and redshift-space, from a large set of numerical simulations. We find that this method is able to decrease the uncertainty in the BAO peak position by 30-50% over the typical angular resolution scales of 21 cm intensity mapping experiments.","abx":0,"nw":0,"d":"2016-10-18","dq":0,"y":2016,"au":[170,633,540,1254],"c":22,"cs":0,"bib":"2017JCAP...09..012O","v":"","lk":"arXiv:1610.05768","url":"https://arxiv.org/abs/1610.05768","doi":"10.1088/1475-7516/2017/09/012","tg":{"s":["Other simulations"],"d":["Large-scale structure","Neutral hydrogen & 21cm"],"m":["No ML"],"u":[]},"x":-0.4812,"yy":-0.4434,"p3":[0.2181,0.457,-0.4373],"sim":{"k":"e","l":[[194,0.939],[180,0.933],[183,0.926],[140,0.925],[205,0.924]]},"c3":[113.82,-102.66,-190.5],"c2":[11.04,174.32],"k":2,"r":[193,194,198,201,210],"rm":0},{"id":"1609.05157","t":"On the spatial distribution of neutral hydrogen in the Universe: bias and shot-noise of the HI Power Spectrum","ab":"The spatial distribution of neutral hydrogen (HI) in the Universe contains a wealth of cosmological information. The 21 cm emission line can be used to map the HI up to very high redshift and therefore reveal us something about the evolution of the large scale structures in the Universe. However little is known about the abundance and clustering properties of the HI over cosmic time. Motivated by this, we build an analytic framework where the relevant parameters that govern how the HI is distributed among dark matter halos can be fixed using observations. At the same time we provide tools to study the column density distribution function of the HI absorbers together with their clustering properties. Our formalism is the first one able to account for all observations at a single redshift, $z = 2.3$. The linear bias of the HI and the mean number density of HI sources, two main ingredients in the calculation of the signal-to-noise ratio of a cosmological survey, are then discussed in detail, also extrapolating the results to low and high redshift. We find that HI bias is relatively higher than the value reported in similar studies, but the shot noise level is always sub dominant, making the HI Power Spectrum always a high signal-to-noise measurements up to $z\\simeq5$ in the limit of no instrumental noise and foreground contamination.","abx":0,"nw":0,"d":"2016-09-16","dq":0,"y":2016,"au":[540,633],"c":80,"cs":0,"bib":"2017MNRAS.471.1788C","v":"","lk":"arXiv:1609.05157","url":"https://arxiv.org/abs/1609.05157","doi":"10.1093/mnras/stx1599","tg":{"s":["No simulations"],"d":["Neutral hydrogen & 21cm"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.5872,"yy":-0.2017,"p3":[0.1896,0.5385,-0.4473],"sim":{"k":"e","l":[[180,0.946],[210,0.938],[74,0.935],[205,0.929],[159,0.928]]},"c3":[127.99,-58.85,-136.97],"c2":[28.64,139.35],"k":2,"r":[198,199,210],"rm":0},{"id":"1609.00019","t":"Baryonic acoustic oscillations from 21cm intensity mapping: the Square Kilometre Array case","ab":"We quantitatively investigate the possibility of detecting baryonic acoustic oscillations (BAO) using single-dish 21cm intensity mapping observations in the post-reionization era. We show that the telescope beam smears out the isotropic BAO signature and, in the case of the Square Kilometer Array (SKA) instrument, makes it undetectable at redshifts $z\\gtrsim1$. We however demonstrate that the BAO peak can still be detected in the radial 21cm power spectrum and describe a method to make this type of measurements. By means of numerical simulations, containing the 21cm cosmological signal as well as the most relevant Galactic and extra-Galactic foregrounds and basic instrumental effect, we quantify the precision with which the radial BAO scale can be measured in the 21cm power spectrum. We systematically investigate the signal-to-noise and the precision of the recovered BAO signal as a function of cosmic variance, instrumental noise, angular resolution and foreground contamination. We find that the expected noise levels of SKA would degrade the final BAO errors by $\\sim5\\%$ with respect to the cosmic-variance limited case at low redshifts, but that the effect grows up to $\\sim65\\%$ at $z\\sim2-3$. Furthermore, we find that the radial BAO signature is robust against foreground systematics, and that the main effect is an increase of $\\sim20\\%$ in the final uncertainty on the standard ruler caused by the contribution of foreground residuals as well as the reduction in sky area needed to avoid high-foreground regions. We also find that it should be possible to detect the radial BAO signature with high significance in the full redshift range. We conclude that a 21cm experiment carried out by the SKA should be able to make direct measurements of the expansion rate $H(z)$ with competitive per-cent level precision on redshifts $z\\lesssim2.5$.","abx":0,"nw":0,"d":"2016-08-31","dq":0,"y":2016,"au":[633,451,1254],"c":72,"cs":0,"bib":"2017MNRAS.466.2736V","v":"","lk":"arXiv:1609.00019","url":"https://arxiv.org/abs/1609.00019","doi":"10.1093/mnras/stw3224","tg":{"s":["Other simulations"],"d":["Large-scale structure","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["No ML"],"u":[]},"x":-0.5151,"yy":-0.4334,"p3":[0.2655,0.5267,-0.607],"sim":{"k":"e","l":[[184,0.943],[192,0.939],[170,0.933],[204,0.93],[180,0.929]]},"c3":[113.13,-41.63,-180.8],"c2":[-26.45,172.06],"k":1,"r":[198,199,201,202,204,210],"rm":0},{"id":"1608.08057","t":"Cosmic Degeneracies II: Structure formation in joint simulations of Warm Dark Matter and $f(R)$ gravity","ab":"We present for the first time the outcomes of a cosmological N-body simulation that simultaneously implements a Warm Dark Matter (WDM) particle candidate and a modified gravitational interaction in the form of $f(R)$ gravity, and compare its results with the individual effects of these two independent extensions of the standard $Λ$CDM scenario, and with the reference cosmology itself. We consider a rather extreme value of the WDM particle mass ($m_{\\rm WDM}=0.4$ keV) and a single realisation of $f(R)$ gravity with $|\\bar{f}_{R0}|=10^{-5}$, and we investigate the impact of these models and of their combination on a wide range of cosmological observables with the aim to identify possible observational degeneracies. In particular, we focus on the large-scale matter distribution, as well as on the statistical and structural properties of collapsed halos and cosmic voids. Differently from the case of combining $f(R)$ gravity with massive neutrinos -- previously investigated in Baldi et al. (2014) -- we find that most of the considered observables do not show any significant degeneracy due to the fact that WDM and $f(R)$ gravity are characterised by individual observational footprints with a very different functional dependence on cosmic scales and halo masses. In particular, this is the case for the nonlinear matter power spectrum in real space, for the halo and sub-halo mass functions, for the halo density profiles and for the concentration-mass relation. However, other observables -- like e.g. the halo bias -- do show some level of degeneracy between the two models, while a very strong degeneracy is observed for the nonlinear matter power spectrum in redshift space, for the density profiles of small cosmic voids -- with radius below $\\approx 5$ Mpc$/h$ -- and for the voids abundance as a function of the void core density.","abx":0,"nw":0,"d":"2016-08-29","dq":0,"y":2016,"au":[1230,633],"c":8,"cs":0,"bib":"2016arXiv160808057B","v":"","lk":"arXiv:1608.08057","url":"https://arxiv.org/abs/1608.08057","doi":"10.1093/MNRAS/STX2594","tg":{"s":["Other simulations"],"d":["Large-scale structure","Dark matter & modified gravity"],"m":["No ML"],"u":[]},"x":0.4831,"yy":-0.6945,"p3":[-0.218,-0.4287,-0.6115],"sim":{"k":"e","l":[[59,0.939],[212,0.93],[207,0.928],[216,0.921],[196,0.919]]},"c3":[-1.25,120.39,-159.53],"c2":[-172.27,142.3],"k":3,"r":[202,209,212,220],"rm":0},{"id":"1605.05283","t":"Initial Conditions for Accurate N-Body Simulations of Massive Neutrino Cosmologies","ab":"The set-up of the initial conditions in cosmological N-body simulations is usually implemented by rescaling the desired low-redshift linear power spectrum to the required starting redshift consistently with the Newtonian evolution of the simulation. The implementation of this practical solution requires more care in the context of massive neutrino cosmologies, mainly because of the non-trivial scale-dependence of the linear growth that characterises these models. In this work we consider a simple two-fluid, Newtonian approximation for cold dark matter and massive neutrinos perturbations that can reproduce the cold matter linear evolution predicted by Boltzmann codes such as CAMB or CLASS with a 0.1% accuracy or below for all redshift relevant to nonlinear structure formation. We use this description, in the first place, to quantify the systematic errors induced by several approximations often assumed in numerical simulations, including the typical set-up of the initial conditions for massive neutrino cosmologies adopted in previous works. We then take advantage of the flexibility of this approach to rescale the late-time linear power spectra to the simulation initial redshift, in order to be as consistent as possible with the dynamics of the N-body code and the approximations it assumes. We implement our method in a public code providing the initial displacements and velocities for cold dark matter and neutrino particles that will allow accurate, i.e. one-percent level, numerical simulations for this cosmological scenario.","abx":0,"nw":0,"d":"2016-05-17","dq":0,"y":2016,"au":[1220,943,633,288,543,1086],"c":96,"cs":0,"bib":"2017MNRAS.466.3244Z","v":"","lk":"arXiv:1605.05283","url":"https://arxiv.org/abs/1605.05283","doi":"10.1093/mnras/stw3340","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.6124,"yy":-0.3073,"p3":[0.1228,-0.3087,-0.4033],"sim":{"k":"e","l":[[182,0.944],[95,0.935],[59,0.934],[144,0.929],[207,0.926]]},"c3":[-110.77,-91.18,-137.05],"c2":[-161.69,-132.82],"k":3,"r":[190,216],"rm":0},{"id":"1512.05356","t":"Beyond $Λ$CDM: Problems, solutions, and the road ahead","ab":"Despite its continued observational successes, there is a persistent (and growing) interest in extending cosmology beyond the standard model, $Λ$CDM. This is motivated by a range of apparently serious theoretical issues, involving such questions as the cosmological constant problem, the particle nature of dark matter, the validity of general relativity on large scales, the existence of anomalies in the CMB and on small scales, and the predictivity and testability of the inflationary paradigm. In this paper, we summarize the current status of $Λ$CDM as a physical theory, and review investigations into possible alternatives along a number of different lines, with a particular focus on highlighting the most promising directions. While the fundamental problems are proving reluctant to yield, the study of alternative cosmologies has led to considerable progress, with much more to come if hopes about forthcoming high-precision observations and new theoretical ideas are fulfilled.","abx":0,"nw":0,"d":"2015-12-16","dq":0,"y":2015,"au":[1450,1835,808,1725,544,927,537,1674,1691,921,549,919,141,1070,259,389,1534,527,1640,913,1531,1228,1726,1275,181,1654,1249,900,788,1785,785,131,475,708,450,780,1076,633,1277,749],"c":588,"cs":0,"bib":"2016PDU....12...56B","v":"","lk":"arXiv:1512.05356","url":"https://arxiv.org/abs/1512.05356","doi":"10.1016/j.dark.2016.02.001","tg":{"s":["No simulations"],"d":["Dark matter & modified gravity"],"m":["No ML"],"u":[]},"x":-0.064,"yy":-0.6993,"p3":[0.1571,-0.5236,-0.2002],"sim":{"k":"e","l":[[110,0.911],[152,0.909],[139,0.908],[196,0.906],[32,0.906]]},"c3":[-18.41,39.28,-231.24],"c2":[-232.89,-52.84],"k":3,"r":[212,215],"rm":0},{"id":"1510.04277","t":"Neutral hydrogen in galaxy clusters: impact of AGN feedback and implications for intensity mapping","ab":"By means of zoom-in hydrodynamic simulations we quantify the amount of neutral hydrogen (HI) hosted by groups and clusters of galaxies. Our simulations, which are based on an improved formulation of smoothed particle hydrodynamics (SPH), include radiative cooling, star formation, metal enrichment and supernova feedback, and can be split in two different groups, depending on whether feedback from active galactic nuclei (AGN) is turned on or off. Simulations are analyzed to account for HI self-shielding and the presence of molecular hydrogen. We find that the mass in neutral hydrogen of dark matter halos monotonically increases with the halo mass and can be well described by a power-law of the form $M_{\\rm HI}(M,z)\\propto M^{3/4}$. Our results point out that AGN feedback reduces both the total halo mass and its HI mass, although it is more efficient in removing HI. We conclude that AGN feedback reduces the neutral hydrogen mass of a given halo by $\\sim50\\%$, with a weak dependence on halo mass and redshift. The spatial distribution of neutral hydrogen within halos is also affected by AGN feedback, whose effect is to decrease the fraction of HI that resides in the halo inner regions. By extrapolating our results to halos not resolved in our simulations we derive astrophysical implications from the measurements of $Ω_{\\rm HI}(z)$: halos with circular velocities larger than $\\sim25~{\\rm km/s}$ are needed to host HI in order to reproduce observations. We find that only the model with AGN feedback is capable of reproducing the value of $Ω_{\\rm HI}b_{\\rm HI}$ derived from available 21cm intensity mapping observations.","abx":0,"nw":0,"d":"2015-10-14","dq":0,"y":2015,"au":[633,1688,1673,1254,534,707,996,1079,1779,148,387],"c":46,"cs":0,"bib":"2016MNRAS.456.3553V","v":"","lk":"arXiv:1510.04277","url":"https://arxiv.org/abs/1510.04277","doi":"10.1093/mnras/stv2904","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["No ML"],"u":[]},"x":-0.5811,"yy":-0.0965,"p3":[0.001,0.45,-0.1819],"sim":{"k":"e","l":[[175,0.94],[210,0.939],[42,0.939],[145,0.934],[180,0.933]]},"c3":[157.43,-74.69,-200.59],"c2":[16.46,231.29],"k":2,"r":[199,202,205,210],"rm":0},{"id":"1507.05102","t":"Weighing neutrinos with cosmic neutral hydrogen","ab":"We investigate the signatures left by massive neutrinos on the spatial distribution of neutral hydrogen (HI) in the post-reionization era by running hydrodynamic simulations that include massive neutrinos as additional collisionless particles. We find that halos in massive/massless neutrino cosmologies host a similar amount of neutral hydrogen, although for a fixed halo mass, on average, the HI mass increases with the sum of the neutrino masses. Our results show that HI is more strongly clustered in cosmologies with massive neutrinos, while its abundance, $Ω_{\\rm HI}(z)$, is lower. These effects arise mainly from the impact of massive neutrinos on cosmology: they suppress both the amplitude of the matter power spectrum on small scales and the abundance of dark matter halos. Modelling the HI distribution with hydrodynamic simulations at $z > 3$, and a simple analytic model at $z<3$, we use the Fisher matrix formalism to conservatively forecast the constraints that Phase 1 of the Square Kilometre Array (SKA) will place on the sum of neutrino masses, $M_ν\\equiv Σm_ν$. We find that with 10,000 hours of interferometric observations at $3 \\lesssim z \\lesssim 6$ from a deep and narrow survey with SKA1-LOW, the sum of the neutrino masses can be measured with an error $σ(M_ν)\\lesssim0.3$ eV (95% CL). Similar constraints can be obtained with a wide and deep SKA1-MID survey at $z \\lesssim 3$, using the single-dish mode. By combining data from MID, LOW, and Planck, plus priors on cosmological parameters from a Stage IV spectroscopic galaxy survey, the sum of the neutrino masses can be determined with an error $σ(M_ν)\\simeq0.06$ eV (95% CL).","abx":0,"nw":0,"d":"2015-07-17","dq":0,"y":2015,"au":[633,1450,1254],"c":73,"cs":0,"bib":"2015ApJ...814..146V","v":"","lk":"arXiv:1507.05102","url":"https://arxiv.org/abs/1507.05102","doi":"10.1088/0004-637X/814/2/146","tg":{"s":["Other simulations"],"d":["Massive neutrinos","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.6475,"yy":-0.333,"p3":[0.1052,-0.0417,-0.5713],"sim":{"k":"e","l":[[210,0.944],[169,0.937],[187,0.937],[215,0.936],[182,0.935]]},"c3":[53.15,-47.07,-204.88],"c2":[-68.87,21.85],"k":2,"r":[200,201,202,204,206,210,213,214,215,216,217],"rm":0},{"id":"1506.03088","t":"Voids in massive neutrino cosmologies","ab":"Cosmic voids are a promising environment to characterize neutrino-induced effects on the large-scale distribution of matter in the universe. We perform a comprehensive numerical study of the statistical properties of voids, identified both in the matter and galaxy distributions, in massive and massless neutrino cosmologies. The matter density field is obtained by running several independent $N$-body simulations with cold dark matter and neutrino particles, while the galaxy catalogs are modeled by populating the dark matter halos in simulations via a halo occupation distribution (HOD) model to reproduce the clustering properties observed by the Sloan Digital Sky Survey (SDSS) II Data Release 7. We focus on the impact of massive neutrinos on the following void statistical properties: number density, ellipticities, two-point statistics, density and velocity profiles. Considering the matter density field, we find that voids in massive neutrino cosmologies are less evolved than those in the corresponding massless neutrinos case: there is a larger number of small voids and a smaller number of large ones, their profiles are less evacuated, and they present a lower wall at the edge. Moreover, the degeneracy between $σ_8$ and $Ω_ν$ is broken when looking at void properties. In terms of the galaxy density field, we find that differences among cosmologies are difficult to detect because of the small number of galaxy voids in the simulations. Differences are instead present when looking at the matter density and velocity profiles around these voids.","abx":0,"nw":0,"d":"2015-06-09","dq":0,"y":2015,"au":[533,633,1254,1404],"c":135,"cs":0,"bib":"2015JCAP...11..018M","v":"","lk":"arXiv:1506.03088","url":"https://arxiv.org/abs/1506.03088","doi":"10.1088/1475-7516/2015/11/018","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["No ML"],"u":[]},"x":0.4033,"yy":-0.5536,"p3":[-0.5028,-0.0814,-0.4382],"sim":{"k":"e","l":[[215,0.943],[129,0.931],[143,0.928],[132,0.926],[158,0.925]]},"c3":[-45.15,81.45,-170.93],"c2":[-227.79,1.16],"k":3,"r":[206,207,209,212,213,214,215,216,217,218],"rm":0},{"id":"1505.07477","t":"The effect of massive neutrinos on the BAO peak","ab":"We study the impact of neutrino masses on the shape and height of the BAO peak of the matter correlation function, both in real and redshift space. In order to describe the nonlinear evolution of the BAO peak we run N-body simulations and compare them with simple analytic formulae. We show that the evolution with redshift of the correlation function and its dependence on the neutrino masses is well reproduced in a simplified version of the Zel'dovich approximation, in which the mode-coupling contribution to the power spectrum is neglected. While in linear theory the BAO peak decreases for increasing neutrino masses, the effect of nonlinear structure formation goes in the opposite direction, since the peak broadening by large scale flows is less effective. As a result of this combined effect, the peak decreases by $\\sim 0.6 \\%$ for $ \\sum m_ν= 0.15$ eV and increases by $\\sim1.2 \\%$ for $ \\sum m_ν= 0.3$ eV, with respect to a massless neutrino cosmology with equal value of the other cosmological parameters. We extend our analysis to redshift space and to halos, and confirm the agreement between simulations and the analytic formulae. We argue that all analytical approaches having the Zel'dovich propagator in their lowest order approximation should give comparable performances, irrespectively to their formulation in Lagrangian or in Eulerian space.","abx":0,"nw":0,"d":"2015-05-27","dq":0,"y":2015,"au":[1234,1250,1254,633],"c":34,"cs":0,"bib":"2015JCAP...07..001P","v":"","lk":"arXiv:1505.07477","url":"https://arxiv.org/abs/1505.07477","doi":"10.1088/1475-7516/2015/07/001","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.6691,"yy":-0.6242,"p3":[-0.1182,-0.2283,-0.7997],"sim":{"k":"e","l":[[144,0.942],[203,0.935],[186,0.934],[216,0.931],[185,0.927]]},"c3":[-2.62,-92.77,-208.53],"c2":[-122.14,-118.68],"k":3,"r":[208,213,214,215],"rm":0},{"id":"1502.06961","t":"Warm dark matter signatures on the 21cm power spectrum: Intensity mapping forecasts for SKA","ab":"We investigate the impact that warm dark matter (WDM) has in terms of 21cm intensity mapping in the post-reionization Universe at z = 3 - 5. We perform hydrodynamic simulations for 5 different models: cold dark matter and WDM with 1,2,3,4 keV (thermal relic) mass and assign the neutral hydrogen a-posteriori using two different methods that both reproduce observations in terms of column density distribution function of neutral hydrogen systems. Contrary to naive expectations, the suppression of power present in the linear and non-linear matter power spectra, results in an increase of power in terms of neutral hydrogen and 21cm power spectra. This is due to the fact that there is a lack of small mass halos in WDM models with respect to cold dark matter: in order to distribute a total amount of neutral hydrogen within the two cosmological models, a larger quantity has to be placed in the most massive halos, that are more biased compared to the cold dark matter cosmology. We quantify this effect and address significance for the telescope SKA1-LOW, including a realistic noise modeling. The results indicate that we will be able to rule out a 4 keV WDM model with 5000 hours of observations at z > 3, with a statistical significance of > 3 sigma, while a smaller mass of 3 keV, comparable to present day constraints, can be ruled out at more than 2 sigma confidence level with 1000 hours of observations at z > 5.","abx":0,"nw":0,"d":"2015-02-24","dq":0,"y":2015,"au":[790,633,1254,165],"c":60,"cs":0,"bib":"2015JCAP...07..047C","v":"","lk":"arXiv:1502.06961","url":"https://arxiv.org/abs/1502.06961","doi":"10.1088/1475-7516/2015/07/047","tg":{"s":["Other simulations"],"d":["Dark matter & modified gravity","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["No ML"],"u":[]},"x":-0.591,"yy":-0.2739,"p3":[0.3031,0.3659,-0.4665],"sim":{"k":"e","l":[[210,0.955],[205,0.946],[189,0.944],[180,0.935],[128,0.932]]},"c3":[122.77,7.76,-192.91],"c2":[-37.1,205.33],"k":2,"r":[205,210,220],"rm":0},{"id":"1501.04546","t":"Small scales structures and neutrino masses","ab":"We review the impact of massive neutrinos on cosmological observables at the linear order. By means of N-body simulations we investigate the signatures left by neutrinos on the fully non-linear regime. We present the effects induced by massive neutrinos on the matter power spectrum, the halo mass function and on the halo-matter bias in massive neutrino cosmologies. We also investigate the clustering of cosmic neutrinos within galaxy clusters.","abx":0,"nw":0,"d":"2015-01-19","dq":0,"y":2015,"au":[633],"c":2,"cs":0,"bib":"2015NPPP..265...56V","v":"","lk":"arXiv:1501.04546","url":"https://arxiv.org/abs/1501.04546","doi":"10.1016/J.NUCLPHYSBPS.2015.06.015","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["No ML"],"u":[]},"x":0.6098,"yy":-0.659,"p3":[-0.2561,-0.2363,-0.7369],"sim":{"k":"e","l":[[207,0.943],[216,0.94],[186,0.938],[215,0.936],[212,0.936]]},"c3":[-117.43,-25.14,-231.49],"c2":[-263.0,-133.35],"k":3,"r":[213,214,215,216,218],"rm":0},{"id":"1501.03989","t":"Cosmology with a SKA HI intensity mapping survey","ab":"HI intensity mapping (IM) is a novel technique capable of mapping the large-scale structure of the Universe in three dimensions and delivering exquisite constraints on cosmology, by using HI as a biased tracer of the dark matter density field. This is achieved by measuring the intensity of the redshifted 21cm line over the sky in a range of redshifts without the requirement to resolve individual galaxies. In this chapter, we investigate the potential of SKA1 to deliver HI intensity maps over a broad range of frequencies and a substantial fraction of the sky. By pinning down the baryon acoustic oscillation and redshift space distortion features in the matter power spectrum -- thus determining the expansion and growth history of the Universe -- these surveys can provide powerful tests of dark energy models and modifications to General Relativity. They can also be used to probe physics on extremely large scales, where precise measurements of spatial curvature and primordial non-Gaussianity can be used to test inflation; on small scales, by measuring the sum of neutrino masses; and at high redshifts where non-standard evolution models can be probed. We discuss the impact of foregrounds as well as various instrumental and survey design parameters on the achievable constraints. In particular we analyse the feasibility of using the SKA1 autocorrelations to probe the large-scale signal.","abx":0,"nw":0,"d":"2015-01-16","dq":0,"y":2015,"au":[1240,1450,451,1674,1443,704,1534,1254,633,629,1251,1467,92,1066],"c":200,"cs":0,"bib":"2015aska.confE..19S","v":"","lk":"arXiv:1501.03989","url":"https://arxiv.org/abs/1501.03989","doi":"10.22323/1.215.0019","tg":{"s":["No simulations"],"d":["Large-scale structure","Massive neutrinos","Primordial non-Gaussianity","Dark matter & modified gravity","Neutral hydrogen & 21cm","Surveys & instruments"],"m":["Fisher forecasts","No ML"],"u":["Fisher forecasts","Massive neutrinos","Dark matter & modified gravity"]},"x":-0.604,"yy":-0.5444,"p3":[0.0662,0.5991,-0.6698],"sim":{"k":"e","l":[[173,0.938],[171,0.933],[174,0.93],[194,0.93],[149,0.929]]},"c3":[163.97,-57.56,-121.47],"c2":[80.02,144.67],"k":1,"r":[],"rm":0},{"id":"1410.7393","t":"Cross-correlating 21cm intensity maps with Lyman Break Galaxies in the post-reionization era","ab":"We investigate the cross-correlation between the spatial distribution of Lyman Break Galaxies (LBGs) and the 21cm intensity mapping signal at $z\\sim[3-5]$. At these redshifts, galactic feedback is supposed to only marginally affect the matter power spectrum, and the neutral hydrogen distribution is independently constrained by quasar spectra. Using a high resolution N-body simulation, populated with neutral hydrogen a posteriori, we forecast for the expected LBG-21cm cross-spectrum and its error for a 21cm field observed by the Square Kilometre Array (SKA1-LOW and SKA1-MID), combined with a spectroscopic LBG survey with the same volume. The cross power can be detected with a signal-to-noise ratio (SNR) up to ~10 times higher (and down to ~4 times smaller scales) than the 21cm auto-spectrum for this set-up, with the SNR depending only very weakly on redshift and the LBG population. We also show that while both the 21cm auto- and LBG-21cm cross-spectra can be reliably recovered after the cleaning of smooth-spectrum foreground contamination, only the cross-power is robust to problematic non-smooth foregrounds like polarized synchrotron emission.","abx":0,"nw":0,"d":"2014-10-27","dq":0,"y":2014,"au":[633,1254,451,978,1450,1240],"c":42,"cs":0,"bib":"2015JCAP...03..034V","v":"","lk":"arXiv:1410.7393","url":"https://arxiv.org/abs/1410.7393","doi":"10.1088/1475-7516/2015/03/034","tg":{"s":["Other simulations"],"d":["Neutral hydrogen & 21cm","Surveys & instruments"],"m":["Fisher forecasts","No ML"],"u":["Fisher forecasts"]},"x":-0.5572,"yy":-0.3116,"p3":[0.4076,0.4343,-0.4842],"sim":{"k":"e","l":[[189,0.968],[210,0.957],[170,0.95],[202,0.946],[180,0.939]]},"c3":[170.21,-77.86,-97.02],"c2":[81.52,166.52],"k":2,"r":[210],"rm":0},{"id":"1410.6813","t":"The halo model in a massive neutrino cosmology","ab":"We provide a quantitative analysis of the halo model in the context of massive neutrino cosmologies. We discuss all the ingredients necessary to model the non-linear matter and cold dark matter power spectra and compare with the results of N-body simulations that incorporate massive neutrinos. Our neutrino halo model is able to capture the non-linear behavior of matter clustering with a $\\sim 20\\%$ accuracy up to very non-linear scales of $k=10~h/$Mpc (which would be affected by baryon physics). The largest discrepancies arise in the range $k=0.5-1~h/$Mpc where the 1-halo and 2-halo terms are comparable and are present also in a massless neutrino cosmology. However, at scales $k<0.2~h/$Mpc our neutrino halo model agrees with the results of N-body simulations at the level of 8\\% for total neutrino masses of $<0.3$ eV. We also model the neutrino non-linear density field as a sum of a linear and clustered component and predict the neutrino power spectrum and the cold dark matter-neutrino cross-power spectrum up to $k=1~h/$Mpc with $\\sim$ 30\\% accuracy. For masses below 0.15 eV the neutrino halo model captures the neutrino induced suppression, casted in terms of matter power ratios between massive and massless scenarios, with a 2\\% agreement with the results of N-body/neutrino simulations. Finally, we provide a simple application of the halo model: the computation of the clustering of galaxies, in massless and massive neutrinos cosmologies, using a simple Halo Occupation Distribution scheme and our halo model extension.","abx":0,"nw":0,"d":"2014-10-24","dq":0,"y":2014,"au":[533,633,1254],"c":64,"cs":0,"bib":"2014JCAP...12..053M","v":"","lk":"arXiv:1410.6813","url":"https://arxiv.org/abs/1410.6813","doi":"","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.5064,"yy":-0.5526,"p3":[-0.4219,-0.112,-0.6114],"sim":{"k":"w","l":[[215,0.225],[200,0.223],[203,0.221],[213,0.204],[167,0.189]]},"c3":[-17.94,-6.09,-216.88],"c2":[-170.27,-110.92],"k":3,"r":[207,212,213,214,215,216,217,218],"rm":0},{"id":"1409.6309","t":"Semi-Analytic Galaxy Formation in Massive Neutrino Cosmologies","ab":"The constraints on neutrino masses led to the revision of their cosmological role, since the existence of a cosmological neutrino background is a clear prediction of the standard cosmological model. In this paper, we study the impact of such background on the spatial distribution of both Dark Matter (DM) and galaxies, by coupling $N$-body numerical simulations with semi-analytic models (SAMs) of galaxy formation. Cosmological simulations including massive neutrinos predict a slower evolution of DM perturbations with respect to the $Λ$CDM runs with the same initial conditions and a suppression on the matter power spectrum on small and intermediate scales, thus impacting on the predicted properties of galaxy populations. We explicitly show that most of these deviations are driven by the different $σ_8$ predicted for cosmologies including a massive neutrino background. We conclude that independent estimates of $σ_8$ are needed, in order to unambiguously characterise the effect of this background on the growth of structures. Galaxy properties alone are a weak tracer of deviations with respect to the $Λ$CDM run, but their combination with the overall matter distribution at all scales allows to disentangle between different cosmological models. Moreover, these deviations go on opposite direction with respect to competing models like modified gravity, thus weakening any detectable cosmological signal. Given the ubiquitous presence of a neutrino background, these effects have to be taken into account in future missions aimed at constraining the properties of the \"Dark\" components of the Universe.","abx":0,"nw":0,"d":"2014-09-22","dq":0,"y":2014,"au":[625,633,458,1254],"c":12,"cs":0,"bib":"2015MNRAS.447.3361F","v":"","lk":"arXiv:1409.6309","url":"https://arxiv.org/abs/1409.6309","doi":"10.1093/mnras/stu2705","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos","Galaxies & baryonic feedback"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.5739,"yy":-0.6412,"p3":[-0.2034,-0.394,-0.7153],"sim":{"k":"e","l":[[216,0.944],[203,0.943],[186,0.941],[59,0.94],[212,0.939]]},"c3":[-48.31,20.76,-247.76],"c2":[-245.9,-138.26],"k":3,"r":[212,213,214,215,217,218],"rm":0},{"id":"1407.1342","t":"A coarse grained perturbation theory for the Large Scale Structure, with cosmology and time independence in the UV","ab":"Standard cosmological perturbation theory (SPT) for the Large Scale Structure (LSS) of the Universe fails at small scales (UV) due to strong nonlinearities and to multistreaming effects. In Pietroni et al. 2011 a new framework was proposed in which the large scales (IR) are treated perturbatively while the information on the UV, mainly small scale velocity dispersion, is obtained by nonlinear methods like N-body simulations. Here we develop this approach, showing that it is possible to reproduce the fully nonlinear power spectrum (PS) by combining a simple (and fast) 1-loop computation for the IR scales and the measurement of a single, dominant, correlator from N-body simulations for the UV ones. We measure this correlator for a suite of seven different cosmologies, and we show that its inclusion in our perturbation scheme reproduces the fully non-linear PS with percent level accuracy, for wave numbers up to $k\\sim 0.4\\, h~{\\rm Mpc^{-1}}$ down to $z=0$. We then show that, once this correlator has been measured in a given cosmology, there is no need to run a new simulation for a different cosmology in the suite. Indeed, by rescaling this correlator by a proper function computable in SPT, the reconstruction procedure works also for the other cosmologies and for all redshifts, with comparable accuracy. Finally, we clarify the relation of this approach to the Effective Field Theory methods recently proposed in the LSS context.","abx":0,"nw":0,"d":"2014-07-04","dq":0,"y":2014,"au":[144,1234,1250,1254,633],"c":36,"cs":0,"bib":"2014JCAP...09..047M","v":"","lk":"arXiv:1407.1342","url":"https://arxiv.org/abs/1407.1342","doi":"","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.1078,"yy":-0.3024,"p3":[0.2993,-0.0638,-0.112],"sim":{"k":"w","l":[[149,0.186],[57,0.159],[136,0.132],[71,0.128],[107,0.123]]},"c3":[-17.9,-168.34,-202.95],"c2":[-105.19,-217.63],"k":4,"r":[],"rm":0},{"id":"1406.1191","t":"VIDE: The Void IDentification and Examination toolkit","ab":"We present VIDE, the Void IDentification and Examination toolkit, an open-source Python/C++ code for finding cosmic voids in galaxy redshift surveys and N-body simulations, characterizing their properties, and providing a platform for more detailed analysis. At its core, VIDE uses a substantially enhanced version of ZOBOV (Neyinck 2008) to calculate a Voronoi tessellation for estimating the density field and a performing a watershed transform to construct voids. Additionally, VIDE provides significant functionality for both pre- and post-processing: for example, vide can work with volume- or magnitude-limited galaxy samples with arbitrary survey geometries, or dark matter particles or halo catalogs in a variety of common formats. It can also randomly subsample inputs and includes a Halo Occupation Distribution model for constructing mock galaxy populations. VIDE uses the watershed levels to place voids in a hierarchical tree, outputs a summary of void properties in plain ASCII, and provides a Python API to perform many analysis tasks, such as loading and manipulating void catalogs and particle members, filtering, plotting, computing clustering statistics, stacking, comparing catalogs, and fitting density profiles. While centered around ZOBOV, the toolkit is designed to be as modular as possible and accommodate other void finders. VIDE has been in development for several years and has already been used to produce a wealth of results, which we summarize in this work to highlight the capabilities of the toolkit. VIDE is publicly available at http://bitbucket.org/cosmicvoids/vide public and http://www.cosmicvoids.net.","abx":0,"nw":0,"d":"2014-06-04","dq":0,"y":2014,"au":[1404,718,1327,153,251,1270,633,1441,1458,249],"c":199,"cs":0,"bib":"2015A&C.....9....1S","v":"Astronomy and Computing","lk":"arXiv:1406.1191","url":"https://arxiv.org/abs/1406.1191","doi":"10.1016/J.ASCOM.2014.10.002","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["No ML"],"u":["Other simulations"]},"x":0.3395,"yy":0.197,"p3":[-0.4439,0.2691,-0.2215],"sim":{"k":"e","l":[[129,0.943],[93,0.939],[158,0.938],[163,0.934],[118,0.926]]},"c3":[-16.34,147.06,-69.39],"c2":[-132.49,73.17],"k":6,"r":[],"rm":0},{"id":"1405.6713","t":"Modeling the neutral hydrogen distribution in the post-reionization Universe: intensity mapping","ab":"We model the distribution of neutral hydrogen (HI) in the post-reionization era and investigate its detectability in 21 cm intensity mapping with the future SKA radio telescope. We rely on high resolution hydrodynamical N-body simulations. The HI is assigned a-posteriori to the gas particles following two different approaches: a halo-based method in which HI is assigned only to gas particles residing within dark matter halos; a particle-based met
