1796,1624,1213,691,422,1290,1214,1055,1829,866,883,1215,417,768,117,1216,884,1350,749,118,838,52,1776,746,1218,1625,1056,119,1057,692,120,1219,1220,597,762,885,526,1221],"c":1186,"cs":0,"bib":"2025A&A...697A...1E","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2405.13491","url":"https://arxiv.org/abs/2405.13491","doi":"10.1051/0004-6361/202450810","tg":{"s":["No simulations"],"d":["Large-scale structure","Dark matter & modified gravity","Surveys & instruments"],"m":["No ML"],"u":[]},"x":-0.7187,"yy":-0.5809,"p3":[-0.1992,0.4616,-0.566],"sim":{"k":"e","l":[[171,0.949],[183,0.93],[174,0.928],[163,0.926],[22,0.925]]},"c3":[-55.93,151.92,68.0],"c2":[24.58,49.66],"k":1,"r":[209],"rm":0},{"id":"2405.13119","t":"Cosmology from Point Clouds with Dark Matter Halos from the Quijote Simulations","ab":"We train a novel deep learning architecture to perform likelihood-free inference on the value of the cosmological parameters from halo catalogs of the Quijote N-body simulations. Our model takes as input a halo catalog where each halo is characterized by its position, mass, and velocity modulus. By construction, our model is E(3) invariant and is designed to extract information hierarchically. Unlike graph neural networks, it does not require the transformation of the input halo (or galaxy) catalog into a graph. Given its simplicity, our model can process point clouds with large numbers of points. We discuss the advantages of this class of methods but also point out their limitations and potential ways to improve them for cosmological data.","abx":0,"nw":0,"d":"2024-05-21","dq":0,"y":2024,"au":[205,633],"c":11,"cs":0,"bib":"2025ApJ...985..132C","v":"Astrophysical Journal","lk":"arXiv:2405.13119","url":"https://arxiv.org/abs/2405.13119","doi":"10.3847/1538-4357/adc99d","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":-0.0324,"yy":0.2263,"p3":[-0.1258,-0.0065,0.5234],"sim":{"k":"e","l":[[98,0.955],[120,0.95],[89,0.946],[36,0.946],[23,0.945]]},"c3":[-91.91,12.07,83.9],"c2":[15.92,65.58],"k":6,"r":[73,90,93,98,108,109,111,115,118,119,120,122,123,129,132,133,141,152,153,157,158],"rm":0},{"id":"2405.05598","t":"Denoising Diffusion Delensing Delight: Reconstructing the Non-Gaussian CMB Lensing Potential with Diffusion Models","ab":"Optimal extraction of cosmological information from observations of the Cosmic Microwave Background critically relies on our ability to accurately undo the distortions caused by weak gravitational lensing. In this work, we demonstrate the use of denoising diffusion models in performing Bayesian lensing reconstruction. We show that score-based generative models can produce accurate, uncorrelated samples from the CMB lensing convergence map posterior, given noisy CMB observations. To validate our approach, we compare the samples of our model to those obtained using established Hamiltonian Monte Carlo methods, which assume a Gaussian lensing potential. We then go beyond this assumption of Gaussianity, and train and validate our model on non-Gaussian lensing data, obtained by ray-tracing N-body simulations. We demonstrate that in this case, samples from our model have accurate non-Gaussian statistics beyond the power spectrum. The method provides an avenue towards more efficient and accurate lensing reconstruction, that does not rely on an approximate analytic description of the posterior probability. The reconstructed lensing maps can be used as an unbiased tracer of the matter distribution, and to improve delensing of the CMB, resulting in more precise cosmological parameter inference.","abx":0,"nw":0,"d":"2024-05-09","dq":0,"y":2024,"au":[1729,1806,132,633,251],"c":18,"cs":0,"bib":"2024MNRAS.533..423F","v":"","lk":"arXiv:2405.05598","url":"https://arxiv.org/abs/2405.05598","doi":"","tg":{"s":["Other simulations"],"d":["CMB & SZ"],"m":["Generative models"],"u":[]},"x":-0.0264,"yy":-0.3021,"p3":[0.3929,0.0218,-0.1142],"sim":{"k":"e","l":[[102,0.945],[65,0.937],[45,0.935],[57,0.932],[1,0.928]]},"c3":[183.57,-48.13,125.12],"c2":[126.09,-205.53],"k":6,"r":[65],"rm":0},{"id":"2405.00766","t":"Introducing the DREAMS Project: DaRk mattEr and Astrophysics with Machine learning and Simulations","ab":"We introduce the DREAMS project, an innovative approach to understanding the astrophysical implications of alternative dark matter models and their effects on galaxy formation and evolution. The DREAMS project will ultimately comprise thousands of cosmological hydrodynamic simulations that simultaneously vary over dark matter physics, astrophysics, and cosmology in modeling a range of systems -- from galaxy clusters to ultra-faint satellites. Such extensive simulation suites can provide adequate training sets for machine-learning-based analyses. This paper introduces two new cosmological hydrodynamical suites of Warm Dark Matter, each comprised of 1024 simulations generated using the Arepo code. One suite consists of uniform-box simulations covering a $(25~h^{-1}~{\\rm M}_\\odot)^3$ volume, while the other consists of Milky Way zoom-ins with sufficient resolution to capture the properties of classical satellites. For each simulation, the Warm Dark Matter particle mass is varied along with the initial density field and several parameters controlling the strength of baryonic feedback within the IllustrisTNG model. We provide two examples, separately utilizing emulators and Convolutional Neural Networks, to demonstrate how such simulation suites can be used to disentangle the effects of dark matter and baryonic physics on galactic properties. The DREAMS project can be extended further to include different dark matter models, galaxy formation physics, and astrophysical targets. In this way, it will provide an unparalleled opportunity to characterize uncertainties on predictions for small-scale observables, leading to robust predictions for testing the particle physics nature of dark matter on these scales.","abx":0,"nw":0,"d":"2024-05-01","dq":0,"y":2024,"au":[918,1440,633,1236,1744,1632,980,1243,632,1279,1651,444,1334,265,246,1677,386,1668,146,1538,1649,1358,139,163,201,941,1078,1530,942,452],"c":47,"cs":0,"bib":"2025ApJ...982...68R","v":"Astrophysical Journal","lk":"arXiv:2405.00766","url":"https://arxiv.org/abs/2405.00766","doi":"10.3847/1538-4357/adb8e5","tg":{"s":["DREAMS"],"d":["Dark matter & modified gravity","Galaxies & baryonic feedback"],"m":["CNN","Emulators & regression ML"],"u":[]},"x":0.134,"yy":0.459,"p3":[0.1351,0.4696,0.3909],"sim":{"k":"e","l":[[66,0.954],[141,0.951],[85,0.951],[27,0.948],[70,0.948]]},"c3":[6.23,-63.94,212.24],"c2":[166.03,-65.95],"k":6,"r":[70,81,85,87,89,90,98,108,123,124,125,139,141,166],"rm":0},{"id":"2403.10648","t":"Debiasing with Diffusion: Probabilistic reconstruction of Dark Matter fields from galaxies with CAMELS","ab":"Galaxies are biased tracers of the underlying cosmic web, which is dominated by dark matter components that cannot be directly observed. Galaxy formation simulations can be used to study the relationship between dark matter density fields and galaxy distributions. However, this relationship can be sensitive to assumptions in cosmology and astrophysical processes embedded in the galaxy formation models, that remain uncertain in many aspects. In this work, we develop a diffusion generative model to reconstruct dark matter fields from galaxies. The diffusion model is trained on the CAMELS simulation suite that contains thousands of state-of-the-art galaxy formation simulations with varying cosmological parameters and sub-grid astrophysics. We demonstrate that the diffusion model can predict the unbiased posterior distribution of the underlying dark matter fields from the given stellar mass fields, while being able to marginalize over uncertainties in cosmological and astrophysical models. Interestingly, the model generalizes to simulation volumes approximately 500 times larger than those it was trained on, and across different galaxy formation models. Code for reproducing these results can be found at https://github.com/victoriaono/variational-diffusion-cdm","abx":0,"nw":0,"d":"2024-03-15","dq":0,"y":2024,"au":[1782,395,1318,1848,354,633],"c":24,"cs":0,"bib":"2024ApJ...970..174O","v":"Astrophysical Journal","lk":"arXiv:2403.10648","url":"https://arxiv.org/abs/2403.10648","doi":"10.3847/1538-4357/ad5957","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Generative models"],"u":[]},"x":0.2868,"yy":0.4176,"p3":[0.0272,0.3836,0.1395],"sim":{"k":"e","l":[[56,0.945],[63,0.937],[66,0.933],[81,0.932],[141,0.932]]},"c3":[63.22,-14.2,136.45],"c2":[120.53,-85.89],"k":6,"r":[87,90,123,125,141,147],"rm":0},{"id":"2403.10609","t":"Zooming by in the CARPoolGP lane: new CAMELS-TNG simulations of zoomed-in massive halos","ab":"Galaxy formation models within cosmological hydrodynamical simulations contain numerous parameters with non-trivial influences over the resulting properties of simulated cosmic structures and galaxy populations. It is computationally challenging to sample these high dimensional parameter spaces with simulations, particularly for halos in the high-mass end of the mass function. In this work, we develop a novel sampling and reduced variance regression method, CARPoolGP, which leverages built-in correlations between samples in different locations of high dimensional parameter spaces to provide an efficient way to explore parameter space and generate low variance emulations of summary statistics. We use this method to extend the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) to include a set of 768 zoom-in simulations of halos in the mass range of $10^{13} - 10^{14.5} M_\\odot\\,h^{-1}$ that span a 28-dimensional parameter space in the IllustrisTNG model. With these simulations and the CARPoolGP emulation method, we explore parameter trends in the Compton $Y-M$, black hole mass-halo mass, and metallicity-mass relations, as well as thermodynamic profiles and quenched fractions of satellite galaxies. We use these emulations to provide a physical picture of the complex interplay between supernova and active galactic nuclei feedback. We then use emulations of the $Y-M$ relation of massive halos to perform Fisher forecasts on astrophysical parameters for future Sunyaev-Zeldovich observations and find a significant improvement in forecasted constraints. We publicly release both the simulation suite and CARPoolGP software package.","abx":0,"nw":0,"d":"2024-03-15","dq":0,"y":2024,"au":[1263,1651,251,256,162,1647,555,379,751,441,444,633,713],"c":23,"cs":0,"bib":"2024ApJ...968...11L","v":"Astrophysical Journal","lk":"arXiv:2403.10609","url":"https://arxiv.org/abs/2403.10609","doi":"10.3847/1538-4357/ad3d4a","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","CMB & SZ"],"m":["Emulators & regression ML","Fisher forecasts"],"u":[]},"x":0.0869,"yy":0.4084,"p3":[-0.0404,0.4101,0.2224],"sim":{"k":"e","l":[[6,0.959],[141,0.956],[64,0.954],[111,0.952],[21,0.952]]},"c3":[48.32,125.33,160.26],"c2":[205.53,79.69],"k":5,"r":[81,87,90,91,99,114,117,124,125,139,141,142],"rm":0},{"id":"2403.02313","t":"Probing the Circum-Galactic Medium with Fast Radio Bursts: Insights from the CAMELS Simulations","ab":"Most diffuse baryons, including the circumgalactic medium (CGM) surrounding galaxies and the intergalactic medium (IGM) in the cosmic web, remain unmeasured and unconstrained. Fast Radio Bursts (FRBs) offer an unparalleled method to measure the electron dispersion measures (DMs) of ionized baryons. Their distribution can resolve the missing baryon problem, and constrain the history of feedback theorized to impart significant energy to the CGM and IGM. We analyze the Cosmology and Astrophysics in Machine Learning (CAMEL) Simulations, using three suites: IllustrisTNG, SIMBA, and Astrid, each varying 6 parameters (2 cosmological & 4 astrophysical feedback), for a total of 183 distinct simulation models. We find significantly different predictions between the fiducial models of the suites, owing to their different implementations of feedback. SIMBA exhibits the strongest feedback, leading to the smoothest distribution of baryons, reducing the sightline-to-sightline variance in DMs between z=0-1. Astrid has the weakest feedback and the largest variance. We calculate FRB CGM measurements as a function of galaxy impact parameter, with SIMBA showing the weakest DMs due to aggressive AGN feedback and Astrid the strongest. Within each suite, the largest differences are due to varying AGN feedback. IllustrisTNG shows the most sensitivity to supernova feedback, but this is due to the change in the AGN feedback strengths, demonstrating that black holes, not stars, are most capable of redistributing baryons in the IGM and CGM. We compare our statistics directly to recent observations, paving the way for the use of FRBs to constrain the physics of galaxy formation and evolution.","abx":0,"nw":0,"d":"2024-03-04","dq":0,"y":2024,"au":[789,441,1456,250,444,633],"c":48,"cs":0,"bib":"2024ApJ...967...32M","v":"Astrophysical Journal","lk":"arXiv:2403.02313","url":"https://arxiv.org/abs/2403.02313","doi":"10.3847/1538-4357/ad3070","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":-0.1173,"yy":0.7267,"p3":[-0.6069,0.2548,0.1483],"sim":{"k":"e","l":[[52,0.961],[114,0.955],[116,0.953],[78,0.953],[30,0.951]]},"c3":[135.05,41.71,183.67],"c2":[261.86,-20.28],"k":5,"r":[81,87,91,92,113,116,118,124,141],"rm":0},{"id":"2403.00490","t":"Quijote-PNG: Optimizing the summary statistics to measure Primordial non-Gaussianity","ab":"We apply a suite of different estimators to the Quijote-PNG halo catalogues to find the best approach to constrain Primordial non-Gaussianity (PNG) at non-linear cosmological scales, up to $k_{\\rm max} = 0.5 \\, h\\,{\\rm Mpc}^{-1}$. The set of summary statistics considered in our analysis includes the power spectrum, bispectrum, halo mass function, marked power spectrum, and marked modal bispectrum. Marked statistics are used here for the first time in the context of PNG study. We perform a Fisher analysis to estimate their cosmological information content, showing substantial improvements when marked observables are added to the analysis. Starting from these summaries, we train deep neural networks (NN) to perform likelihood-free inference of cosmological and PNG parameters. We assess the performance of different subsets of summary statistics; in the case of $f_\\mathrm{NL}^\\mathrm{equil}$, we find that a combination of the power spectrum and a suitable marked power spectrum outperforms the combination of power spectrum and bispectrum, the baseline statistics usually employed in PNG analysis. A minimal pipeline to analyse the statistics we identified can be implemented either with our ML algorithm or via more traditional estimators, if these are deemed more reliable.","abx":0,"nw":0,"d":"2024-03-01","dq":0,"y":2024,"au":[693,166,1272,1230,1806,633,251],"c":13,"cs":0,"bib":"2024ApJ...976..109J","v":"Astrophysical Journal","lk":"arXiv:2403.00490","url":"https://arxiv.org/abs/2403.00490","doi":"10.3847/1538-4357/ad83bd","tg":{"s":["Quijote"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["Simulation-based inference","Fisher forecasts"],"u":[]},"x":0.0957,"yy":-0.5306,"p3":[-0.2443,-0.6789,0.061],"sim":{"k":"e","l":[[84,0.971],[96,0.969],[106,0.967],[101,0.962],[105,0.958]]},"c3":[-173.17,36.02,66.06],"c2":[-77.08,126.37],"k":4,"r":[73,84,90,96,98,101,104,106,108,123,150,158],"rm":0},{"id":"2402.10997","t":"Cosmological multifield emulator","ab":"We demonstrate the use of deep network to learn the distribution of data from state-of-the-art hydrodynamic simulations of the CAMELS project. To this end, we train a generative adversarial network to generate images composed of three different channels that represent gas density (Mgas), neutral hydrogen density (HI), and magnetic field amplitudes (B). We consider an unconstrained model and another scenario where the model is conditioned on the matter density $Ω_{\\rm m}$ and the amplitude of density fluctuations $σ_{8}$. We find that the generated images exhibit great quality which is on a par with that of data, visually. Quantitatively, we find that our model generates maps whose statistical properties, quantified by probability distribution function of pixel values and auto-power spectra, agree reasonably well with those of the real maps. Moreover, the cross-correlations between fields in all maps produced by the emulator are in good agreement with those of the real images, which indicates that our model generates instances whose maps in all three channels describe the same physical region. Furthermore, a CNN regressor, which has been trained to extract $Ω_{\\rm m}$ and $σ_{8}$ from CAMELS multifield dataset, recovers the cosmology from the maps generated by our conditional model, achieving $R^{2}$ = 0.96 and 0.83 corresponding to $Ω_{\\rm m}$ and $σ_{8}$ respectively. This further demonstrates the great capability of the model to mimic CAMELS data. Our model can be useful for generating data that are required to analyze the information from upcoming multi-wavelength cosmological surveys.","abx":0,"nw":0,"d":"2024-02-16","dq":0,"y":2024,"au":[1629,1685,633],"c":5,"cs":0,"bib":"2025Ap&SS.370...44A","v":"Astrophysics and Space Science","lk":"arXiv:2402.10997","url":"https://arxiv.org/abs/2402.10997","doi":"10.1007/s10509-025-04440-9","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["CNN","Generative models"],"u":["Neutral hydrogen & 21cm"]},"x":-0.4062,"yy":0.1492,"p3":[0.5166,-0.0003,0.3439],"sim":{"k":"e","l":[[97,0.97],[162,0.955],[125,0.953],[3,0.941],[123,0.939]]},"c3":[118.62,11.06,20.36],"c2":[93.94,-77.57],"k":6,"r":[88,118,122,123,141,162,174],"rm":0},{"id":"2401.17940","t":"Can we constrain warm dark matter masses with individual galaxies?","ab":"We study the impact of warm dark matter mass on the internal properties of individual galaxies using a large suite of 1,024 state-of-the-art cosmological hydrodynamic simulations from the DREAMS project. We take individual galaxies' properties from the simulations, which have different cosmologies, astrophysics, and warm dark matter masses, and train normalizing flows to learn the posterior of the parameters. We find that our models cannot infer the value of the warm dark matter mass, even when the values of the cosmological and astrophysical parameters are given explicitly. This result holds for galaxies with stellar mass larger than $2\\times10^8 M_\\odot/h$ at both low and high redshifts. We calculate the mutual information and find no significant dependence between the WDM mass and galaxy properties. On the other hand, our models can infer the value of $Ω_{\\rm m}$ with a $\\sim10\\%$ accuracy from the properties of individual galaxies while marginalizing astrophysics and warm dark matter masses.","abx":0,"nw":0,"d":"2024-01-31","dq":0,"y":2024,"au":[1649,633,918,1440,201,980,146,1632,1334,1243,1837,1803],"c":7,"cs":0,"bib":"2024ApJ...970..170L","v":"Astrophysical Journal","lk":"arXiv:2401.17940","url":"https://arxiv.org/abs/2401.17940","doi":"10.3847/1538-4357/ad54b6","tg":{"s":["DREAMS"],"d":["Dark matter & modified gravity","Galaxies & baryonic feedback"],"m":["Simulation-based inference","Normalizing flows"],"u":[]},"x":0.0672,"yy":0.5216,"p3":[0.1828,0.1551,0.6328],"sim":{"k":"e","l":[[27,0.955],[64,0.948],[94,0.945],[76,0.943],[66,0.942]]},"c3":[-28.34,-75.35,173.57],"c2":[85.3,-93.67],"k":7,"r":[64,77,85,86,90,93,98,108,115,119,120,141],"rm":0},{"id":"2401.15891","t":"A field-level emulator for modeling baryonic effects across hydrodynamic simulations","ab":"We develop a new and simple method to model baryonic effects at the field level relevant for weak lensing analyses. We analyze thousands of state-of-the-art hydrodynamic simulations from the CAMELS project, each with different cosmology and strength of feedback, and we find that the cross-correlation coefficient between full hydrodynamic and N-body simulations is very close to 1 down to $k\\sim10~h{\\rm Mpc}^{-1}$. This suggests that modeling baryonic effects at the field level down to these scales only requires N-body simulations plus a correction to the mode's amplitude given by: $\\sqrt{P_{\\rm hydro}(k)/P_{\\rm nbody}(k)}$. In this paper, we build an emulator for this quantity, using Gaussian processes, that is flexible enough to reproduce results from thousands of hydrodynamic simulations that have different cosmologies, astrophysics, subgrid physics, volumes, resolutions, and at different redshifts. Our emulator is accurate at the percent level and exhibits a range of validation superior to previous studies. This method and our emulator enable field-level simulation-based inference analyses and accounting for baryonic effects in weak lensing analyses.","abx":0,"nw":0,"d":"2024-01-29","dq":0,"y":2024,"au":[468,262,633,1753],"c":29,"cs":0,"bib":"2025MNRAS.538.1415S","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2401.15891","url":"https://arxiv.org/abs/2401.15891","doi":"10.1093/mnras/staf355","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Emulators & regression ML"],"u":[]},"x":-0.248,"yy":0.5503,"p3":[0.0621,0.156,0.2622],"sim":{"k":"e","l":[[124,0.949],[66,0.945],[6,0.942],[87,0.94],[75,0.938]]},"c3":[26.53,101.66,133.37],"c2":[162.95,80.46],"k":5,"r":[81,87,118,124,125,141,156],"rm":0},{"id":"2311.10088","t":"Taming assembly bias for primordial non-Gaussianity","ab":"Primordial non-Gaussianity of the local type induces a strong scale-dependent bias on the clustering of halos in the late-time Universe. This signature is particularly promising to provide constraints on the non-Gaussianity parameter $f_{\\rm NL}$ from galaxy surveys, as the bias amplitude grows with scale and becomes important on large, linear scales. However, there is a well-known degeneracy between the real prize, the $f_{\\rm NL}$ parameter, and the (non-Gaussian) assembly bias i.e., the halo formation history-dependent contribution to the amplitude of the signal, which could seriously compromise the ability of large-scale structure surveys to constrain $f_{\\rm NL}$. We show how the assembly bias can be modeled and constrained, thus almost completely recovering the power of galaxy surveys to competitively constrain primordial non-Gaussianity. In particular, studying hydrodynamical simulations, we find that a proxy for the halo properties that determine assembly bias can be constructed from photometric properties of galaxies. Using a prior on the assembly bias guided by this proxy degrades the statistical errors on $f_{\\rm NL}$ only mildly compared to an ideal case where the assembly bias is perfectly known. The systematic error on $f_{\\rm NL}$ that the proxy induces can be safely kept under control.","abx":0,"nw":0,"d":"2023-11-16","dq":0,"y":2023,"au":[541,1076,633,1230,1806,693,467,1272,166,251],"c":27,"cs":0,"bib":"2024JCAP...02..048F","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2311.10088","url":"https://arxiv.org/abs/2311.10088","doi":"10.1088/1475-7516/2024/02/048","tg":{"s":["Other simulations"],"d":["Large-scale structure","Primordial non-Gaussianity","Galaxies & baryonic feedback"],"m":["Fisher forecasts","No ML"],"u":["Other simulations","Fisher forecasts"],"n":"hydro simulations not named in abstract"},"x":0.395,"yy":-0.8057,"p3":[-0.091,-0.6107,-0.2399],"sim":{"k":"e","l":[[181,0.934],[59,0.925],[152,0.924],[84,0.923],[156,0.921]]},"c3":[-122.63,88.01,58.61],"c2":[-38.11,98.04],"k":4,"r":[84,87,101,105,106,141,158],"rm":0},{"id":"2311.01588","t":"Domain Adaptive Graph Neural Networks for Constraining Cosmological Parameters Across Multiple Data Sets","ab":"Deep learning models have been shown to outperform methods that rely on summary statistics, like the power spectrum, in extracting information from complex cosmological data sets. However, due to differences in the subgrid physics implementation and numerical approximations across different simulation suites, models trained on data from one cosmological simulation show a drop in performance when tested on another. Similarly, models trained on any of the simulations would also likely experience a drop in performance when applied to observational data. Training on data from two different suites of the CAMELS hydrodynamic cosmological simulations, we examine the generalization capabilities of Domain Adaptive Graph Neural Networks (DA-GNNs). By utilizing GNNs, we capitalize on their capacity to capture structured scale-free cosmological information from galaxy distributions. Moreover, by including unsupervised domain adaptation via Maximum Mean Discrepancy (MMD), we enable our models to extract domain-invariant features. We demonstrate that DA-GNN achieves higher accuracy and robustness on cross-dataset tasks (up to $28\\%$ better relative error and up to almost an order of magnitude better $χ^2$). Using data visualizations, we show the effects of domain adaptation on proper latent space data alignment. This shows that DA-GNNs are a promising method for extracting domain-independent cosmological information, a vital step toward robust deep learning for real cosmic survey data.","abx":0,"nw":0,"d":"2023-11-02","dq":0,"y":2023,"au":[167,143,1223,633,271],"c":27,"cs":0,"bib":"2023arXiv231101588R","v":"Domain Adaptive Graph Neural Networks for Constraining Cosmological Parameters Across Multiple Data Sets","lk":"arXiv:2311.01588","url":"https://arxiv.org/abs/2311.01588","doi":"10.48550/arXiv.2311.01588","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Graph neural networks","Other ML"],"u":[]},"x":-0.11,"yy":0.2941,"p3":[-0.2097,-0.158,0.6547],"sim":{"k":"e","l":[[108,0.953],[75,0.941],[7,0.941],[90,0.939],[141,0.938]]},"c3":[-101.37,-26.37,158.82],"c2":[90.89,104.71],"k":7,"r":[90,98,108,120,123,124,141],"rm":0},{"id":"2310.16884","t":"Atomic Hydrogen Shows its True Colours: Correlations between HI and Galaxy Colour in Simulations","ab":"Intensity mapping experiments are beginning to measure the spatial distribution of neutral atomic hydrogen (HI) to constrain cosmological parameters and the large-scale distribution of matter. However, models of the behaviour of HI as a tracer of matter are complicated by galaxy evolution. In this work, we examine the clustering of HI in relation to galaxy colour, stellar mass, and HI mass in IllustrisTNG at $z$ = 0, 0.5, and 1. We compare the HI-red and HI-blue galaxy cross-power spectra, finding that HI-red has an amplitude 1.5 times higher than HI-blue at large scales. The cross-power spectra intersect at $\\approx 3$ Mpc in real space and $\\approx 10$ Mpc in redshift space, consistent with $z \\approx 0$ observations. We show that HI clustering increases with galaxy HI mass and depends weakly on detection limits in the range $M_{\\mathrm{HI}} \\leq 10^8 M_\\odot$. In terms of $M_\\star$, we find blue galaxies in the greatest stellar mass bin cluster more than blue galaxies in other stellar mass bins. Red galaxies in the greatest stellar mass bin, however, cluster the weakest amongst red galaxies. These trends arise due to central-satellite compositions. Centrals correlate less with HI for increasing stellar mass, whereas satellites correlate more, irrespective of colour. Despite the clustering relationships with stellar mass, we find that the cross-power spectra are largely insensitive to detection limits in HI and galaxy surveys. Counter-intuitively, all auto and cross-power spectra for red and blue galaxies and HI decrease with time at all scales in IllustrisTNG. We demonstrate that processes associated with quenching contribute to this trend. The complex interplay between HI and galaxies underscores the importance of understanding baryonic effects when interpreting the large-scale clustering of HI, blue, and red galaxies at $z \\leq 1$.","abx":0,"nw":0,"d":"2023-10-25","dq":0,"y":2023,"au":[345,248,633,529,1448],"c":4,"cs":0,"bib":"2024MNRAS.531..450O","v":"","lk":"arXiv:2310.16884","url":"https://arxiv.org/abs/2310.16884","doi":"10.1093/mnras/stae1102","tg":{"s":["Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["No ML"],"u":[]},"x":-0.6653,"yy":-0.1503,"p3":[-0.0053,0.6454,-0.2315],"sim":{"k":"e","l":[[51,0.946],[42,0.938],[193,0.935],[180,0.935],[165,0.932]]},"c3":[178.49,51.71,-138.01],"c2":[88.41,246.62],"k":2,"r":[165,173,176,180,184],"rm":0},{"id":"2310.15234","t":"Field-level simulation-based inference with galaxy catalogs: the impact of systematic effects","ab":"It has been recently shown that a powerful way to constrain cosmological parameters from galaxy redshift surveys is to train graph neural networks to perform field-level likelihood-free inference without imposing cuts on scale. In particular, de Santi et al. (2023) developed models that could accurately infer the value of $Ω_{\\rm m}$ from catalogs that only contain the positions and radial velocities of galaxies that are robust to uncertainties in astrophysics and subgrid models. However, observations are affected by many effects, including 1) masking, 2) uncertainties in peculiar velocities and radial distances, and 3) different galaxy selections. Moreover, observations only allow us to measure redshift, intertwining galaxies' radial positions and velocities. In this paper we train and test our models on galaxy catalogs, created from thousands of state-of-the-art hydrodynamic simulations run with different codes from the CAMELS project, that incorporate these observational effects. We find that, although the presence of these effects degrades the precision and accuracy of the models, and increases the fraction of catalogs where the model breaks down, the fraction of galaxy catalogs where the model performs well is over 90 %, demonstrating the potential of these models to constrain cosmological parameters even when applied to real data.","abx":0,"nw":0,"d":"2023-10-23","dq":0,"y":2023,"au":[1316,633,1040,753,1083,1733,1848,378,531,627,452,996,1061,1243],"c":15,"cs":0,"bib":"2025JCAP...01..082D","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2310.15234","url":"https://arxiv.org/abs/2310.15234","doi":"10.1088/1475-7516/2025/01/082","tg":{"s":["CAMELS"],"d":["Large-scale structure"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":-0.1674,"yy":0.2656,"p3":[-0.128,-0.2072,0.5396],"sim":{"k":"e","l":[[108,0.973],[90,0.972],[7,0.962],[98,0.959],[18,0.953]]},"c3":[-1.79,-8.15,105.18],"c2":[72.02,6.89],"k":7,"r":[79,82,87,89,90,98,108,111,113,118,123,125,127,138,141,153,154,157,158,166],"rm":0},{"id":"2310.08634","t":"Cosmology with Galaxy Photometry Alone","ab":"We present the first cosmological constraints using only the observed photometry of galaxies. Villaescusa-Navarro et al. (2022; arXiv:2201.02202) recently demonstrated that the internal physical properties of a single simulated galaxy contain a significant amount of cosmological information. These physical properties, however, cannot be directly measured from observations. In this work, we present how we can go beyond theoretical demonstrations to infer cosmological constraints from actual galaxy observables (e.g. optical photometry) using neural density estimation and the CAMELS suite of hydrodynamical simulations. We find that the cosmological information in the photometry of a single galaxy is limited. However, we combine the constraining power of photometry from many galaxies using hierarchical population inference and place significant cosmological constraints. With the observed photometry of $\\sim$20,000 NASA-Sloan Atlas galaxies, we constrain $Ω_m = 0.323^{+0.075}_{-0.095}$ and $σ_8 = 0.799^{+0.088}_{-0.085}$.","abx":0,"nw":0,"d":"2023-10-12","dq":0,"y":2023,"au":[363,633,1447,1530],"c":0,"cs":0,"bib":"2023mla..confE..14H","v":"Astrophysical Journal Letters","lk":"arXiv:2310.08634","url":"https://arxiv.org/abs/2310.08634","doi":"10.3847/2041-8213/ad3f1e","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Simulation-based inference"],"u":[]},"x":-0.3272,"yy":0.3945,"p3":[0.2277,-0.0287,0.6826],"sim":{"k":"e","l":[[115,0.957],[77,0.954],[90,0.952],[125,0.949],[124,0.949]]},"c3":[132.57,33.9,75.06],"c2":[136.37,-118.21],"k":7,"r":[77,86,115,118,141],"rm":0},{"id":"2309.12048","t":"Cosmology with multiple galaxies","ab":"Recent works have discovered a relatively tight correlation between $Ω_{\\rm m}$ and properties of individual simulated galaxies. Because of this, it has been shown that constraints on $Ω_{\\rm m}$ can be placed using the properties of individual galaxies while accounting for uncertainties on astrophysical processes such as feedback from supernova and active galactic nuclei. In this work, we quantify whether using the properties of multiple galaxies simultaneously can tighten those constraints. For this, we train neural networks to perform likelihood-free inference on the value of two cosmological parameters ($Ω_{\\rm m}$ and $σ_8$) and four astrophysical parameters using the properties of several galaxies from thousands of hydrodynamic simulations of the CAMELS project. We find that using properties of more than one galaxy increases the precision of the $Ω_{\\rm m}$ inference. Furthermore, using multiple galaxies enables the inference of other parameters that were poorly constrained with one single galaxy. We show that the same subset of galaxy properties are responsible for the constraints on $Ω_{\\rm m}$ from one and multiple galaxies. Finally, we quantify the robustness of the model and find that without identifying the model range of validity, the model does not perform well when tested on galaxies from other galaxy formation models.","abx":0,"nw":0,"d":"2023-09-21","dq":0,"y":2023,"au":[361,633,1330,1848,363,444],"c":16,"cs":0,"bib":"2024ApJ...969..105C","v":"Astrophysical Journal","lk":"arXiv:2309.12048","url":"https://arxiv.org/abs/2309.12048","doi":"10.3847/1538-4357/ad4969","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Simulation-based inference"],"u":[]},"x":-0.304,"yy":0.4434,"p3":[0.235,0.2446,0.7085],"sim":{"k":"e","l":[[115,0.967],[76,0.954],[40,0.946],[141,0.945],[87,0.945]]},"c3":[119.08,9.3,133.31],"c2":[155.56,-149.56],"k":7,"r":[86,87,94,115,118,123,141],"rm":0},{"id":"2309.07912","t":"An Observationally Driven Multifield Approach for Probing the Circum-Galactic Medium with Convolutional Neural Networks","ab":"The circum-galactic medium (CGM) can feasibly be mapped by multiwavelength surveys covering broad swaths of the sky. With multiple large datasets becoming available in the near future, we develop a likelihood-free Deep Learning technique using convolutional neural networks (CNNs) to infer broad-scale physical properties of a galaxy's CGM and its halo mass for the first time. Using CAMELS (Cosmology and Astrophysics with MachinE Learning Simulations) data, including IllustrisTNG, SIMBA, and Astrid models, we train CNNs on Soft X-ray and 21-cm (HI) radio 2D maps to trace hot and cool gas, respectively, around galaxies, groups, and clusters. Our CNNs offer the unique ability to train and test on ''multifield'' datasets comprised of both HI and X-ray maps, providing complementary information about physical CGM properties and improved inferences. Applying eRASS:4 survey limits shows that X-ray is not powerful enough to infer individual halos with masses $\\log(M_{\\rm{halo}}/M_{\\odot}) < 12.5$. The multifield improves the inference for all halo masses. Generally, the CNN trained and tested on Astrid (SIMBA) can most (least) accurately infer CGM properties. Cross-simulation analysis -- training on one galaxy formation model and testing on another -- highlights the challenges of developing CNNs trained on a single model to marginalize over astrophysical uncertainties and perform robust inferences on real data. The next crucial step in improving the resulting inferences on physical CGM properties hinges on our ability to interpret these deep-learning models.","abx":0,"nw":0,"d":"2023-09-14","dq":0,"y":2023,"au":[1315,250,441,633,444],"c":7,"cs":0,"bib":"2024MNRAS.52710038G","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2309.07912","url":"https://arxiv.org/abs/2309.07912","doi":"10.1093/mnras/stad3784","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["CNN","Simulation-based inference"],"u":["Simulation-based inference"]},"x":-0.1029,"yy":0.6794,"p3":[-0.447,0.3189,0.176],"sim":{"k":"e","l":[[67,0.953],[52,0.942],[111,0.941],[53,0.937],[10,0.936]]},"c3":[34.77,1.02,185.68],"c2":[155.98,-20.19],"k":5,"r":[81,86,87,90,108,123,124,125,141],"rm":0},{"id":"2309.05850","t":"Predicting Interloper Fraction with Graph Neural Networks","ab":"Upcoming emission-line spectroscopic surveys, such as Euclid and the Roman Space Telescope, will be affected by systematic effects due to the presence of interlopers: galaxies whose redshift and distance from us are miscalculated due to line confusion in their emission spectra. Particularly pernicious are interlopers involving the confusion between two lines with close emitted wavelengths, like H$β$ emitters confused as \\oiii, since those are strongly spatially correlated with the target galaxies. They introduce a particular pattern in the 3D distribution of the observed galaxy catalog that can shift the position of the BAO peak in the galaxy correlation function and bias any cosmological analysis performed with that sample. Here we present a novel method to predict the fraction of interlopers in a galaxy catalog, using Graph Neural Networks (GNNs) to learn the posterior distribution of the interloper fraction while marginalizing over cosmology and galaxy bias. The method is developed using simulations with halos acting as a proxy for galaxies. The GNN can infer the mean and standard deviation of the posterior distribution of interloper fraction using small-scale information that is usually not considered in cosmological analyses. The injection of large-scale information into the graph as a global attribute improves the performance of the GNN when marginalizing over cosmology.","abx":0,"nw":0,"d":"2023-09-11","dq":0,"y":2023,"au":[533,633,1795],"c":9,"cs":0,"bib":"2023JCAP...12..012M","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2309.05850","url":"https://arxiv.org/abs/2309.05850","doi":"10.1088/1475-7516/2023/12/012","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["Graph neural networks","Simulation-based inference"],"u":["Other simulations"],"n":"Halo catalogs from unnamed simulations (likely Quijote)."},"x":0.067,"yy":0.1782,"p3":[-0.156,-0.0584,0.6909],"sim":{"k":"e","l":[[120,0.934],[108,0.926],[98,0.925],[23,0.923],[119,0.922]]},"c3":[-77.6,-65.22,129.71],"c2":[43.3,9.69],"k":7,"r":[89,90,108,119,120,123,139,158],"rm":0},{"id":"2308.13648","t":"Emulating Radiative Transfer with Artificial Neural Networks","ab":"Forward-modeling observables from galaxy simulations enables direct comparisons between theory and observations. To generate synthetic spectral energy distributions (SEDs) that include dust absorption, re-emission, and scattering, Monte Carlo radiative transfer is often used in post-processing on a galaxy-by-galaxy basis. However, this is computationally expensive, especially if one wants to make predictions for suites of many cosmological simulations. To alleviate this computational burden, we have developed a radiative transfer emulator using an artificial neural network (ANN), ANNgelina, that can reliably predict SEDs of simulated galaxies using a small number of integrated properties of the simulated galaxies: star formation rate, stellar and dust masses, and mass-weighted metallicities of all star particles and of only star particles with age <10 Myr. Here, we present the methodology and quantify the accuracy of the predictions. We train the ANN on SEDs computed for galaxies from the IllustrisTNG project's TNG50 cosmological magnetohydrodynamical simulation. ANNgelina is able to predict the SEDs of TNG50 galaxies in the ultraviolet (UV) to millimetre regime with a typical median absolute error of ~7 per cent. The prediction error is the greatest in the UV, possibly due to the viewing-angle dependence being greatest in this wavelength regime. Our results demonstrate that our ANN-based emulator is a promising computationally inexpensive alternative for forward-modeling galaxy SEDs from cosmological simulations.","abx":0,"nw":0,"d":"2023-08-25","dq":0,"y":2023,"au":[1664,1511,377,1787,633,702,917],"c":6,"cs":0,"bib":"2023MNRAS.526.4520S","v":"","lk":"arXiv:2308.13648","url":"https://arxiv.org/abs/2308.13648","doi":"","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback"],"m":["Emulators & regression ML"],"u":[]},"x":-0.0791,"yy":0.5514,"p3":[-0.0122,0.3341,0.4513],"sim":{"k":"e","l":[[50,0.933],[127,0.924],[141,0.923],[118,0.921],[87,0.92]]},"c3":[-173.36,-231.51,50.6],"c2":[-131.87,-284.23],"k":6,"r":[],"rm":0},{"id":"2307.11832","t":"Cosmological baryon spread and impact on matter clustering in CAMELS","ab":"We quantify the cosmological spread of baryons relative to their initial neighboring dark matter distribution using thousands of state-of-the-art simulations from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project. We show that dark matter particles spread relative to their initial neighboring distribution owing to chaotic gravitational dynamics on spatial scales comparable to their host dark matter halo. In contrast, gas in hydrodynamic simulations spreads much further from the initial neighboring dark matter owing to feedback from supernovae (SNe) and Active Galactic Nuclei (AGN). We show that large-scale baryon spread is very sensitive to model implementation details, with the fiducial \\textsc{SIMBA} model spreading $\\sim$40\\% of baryons $>$1\\,Mpc away compared to $\\sim$10\\% for the IllustrisTNG and \\textsc{ASTRID} models. Increasing the efficiency of AGN-driven outflows greatly increases baryon spread while increasing the strength of SNe-driven winds can decrease spreading due to non-linear coupling of stellar and AGN feedback. We compare total matter power spectra between hydrodynamic and paired $N$-body simulations and demonstrate that the baryonic spread metric broadly captures the global impact of feedback on matter clustering over variations of cosmological and astrophysical parameters, initial conditions, and galaxy formation models. Using symbolic regression, we find a function that reproduces the suppression of power by feedback as a function of wave number ($k$) and baryonic spread up to $k \\sim 10\\,h$\\,Mpc$^{-1}$ while highlighting the challenge of developing models robust to variations in galaxy formation physics implementation.","abx":0,"nw":0,"d":"2023-07-21","dq":0,"y":2023,"au":[1256,444,932,1651,633,1848,378,441,1533,627,1243,1061],"c":53,"cs":0,"bib":"2024MNRAS.529.4896G","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2307.11832","url":"https://arxiv.org/abs/2307.11832","doi":"10.1093/mnras/stae817","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Symbolic regression"],"u":[]},"x":-0.1963,"yy":0.8867,"p3":[-0.3814,0.3036,0.3841],"sim":{"k":"e","l":[[17,0.958],[141,0.956],[52,0.952],[91,0.951],[6,0.946]]},"c3":[89.51,24.55,194.81],"c2":[220.75,-27.72],"k":5,"r":[86,87,89,90,91,92,94,98,99,108,111,113,114,115,116,117,118,119,120,124,125,127,139,141],"rm":0},{"id":"2307.06967","t":"A Hierarchy of Normalizing Flows for Modelling the Galaxy-Halo Relationship","ab":"Using a large sample of galaxies taken from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project, a suite of hydrodynamic simulations varying both cosmological and astrophysical parameters, we train a normalizing flow (NF) to map the probability of various galaxy and halo properties conditioned on astrophysical and cosmological parameters. By leveraging the learnt conditional relationships we can explore a wide range of interesting questions, whilst enabling simple marginalisation over nuisance parameters. We demonstrate how the model can be used as a generative model for arbitrary values of our conditional parameters; we generate halo masses and matched galaxy properties, and produce realisations of the halo mass function as well as a number of galaxy scaling relations and distribution functions. The model represents a unique and flexible approach to modelling the galaxy-halo relationship.","abx":0,"nw":0,"d":"2023-07-13","dq":0,"y":2023,"au":[378,1685,444,713,661,1651,363,979,891,1316,633],"c":12,"cs":0,"bib":"2023mla..confE..21L","v":"","lk":"arXiv:2307.06967","url":"https://arxiv.org/abs/2307.06967","doi":"","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Normalizing flows"],"u":[]},"x":0.0081,"yy":0.0645,"p3":[-0.2166,0.3227,0.4202],"sim":{"k":"e","l":[[18,0.947],[6,0.944],[14,0.94],[66,0.939],[122,0.938]]},"c3":[33.46,127.64,130.01],"c2":[174.86,32.36],"k":7,"r":[87,118,122,141],"rm":0},{"id":"2306.11782","t":"Signatures of a Parity-Violating Universe","ab":"What would a parity-violating universe look like? We present a numerical and theoretical study of mirror asymmetries in the late universe, using a new suite of $N$-body simulations: QUIJOTE-Odd. These feature parity-violating initial conditions, injected via a simple ansatz for the imaginary primordial trispectrum and evolved into the non-linear regime. We find that the realization-averaged power spectrum, bispectrum, halo mass function, and matter PDF are not affected by our modifications to the initial conditions, deep into the non-linear regime, which we argue arises from rotational and translational invariance. In contrast, the parity-odd trispectrum of matter (measured using a new estimator), shows distinct signatures proportional to the parity-violating parameter, $p_{\\rm NL}$, which sets the amplitude of the primordial trispectrum. We additionally find intriguing signatures in the angular momentum of halos, with the primordial trispectrum inducing a non-zero correlation between angular momentum and smoothed velocity field, proportional to $p_{\\rm NL}$. Our simulation suite has been made public to facilitate future analyses.","abx":0,"nw":0,"d":"2023-06-20","dq":0,"y":2023,"au":[1806,1356,633],"c":43,"cs":0,"bib":"2024PhRvD.109b3531C","v":"Physical Review D","lk":"arXiv:2306.11782","url":"https://arxiv.org/abs/2306.11782","doi":"10.1103/physrevd.109.023531","tg":{"s":["Quijote"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["Perturbation theory & analytic models","No ML"],"u":["Perturbation theory & analytic models"]},"x":0.0994,"yy":-0.4305,"p3":[-0.2465,-0.7846,0.007],"sim":{"k":"e","l":[[101,0.942],[106,0.942],[96,0.936],[68,0.932],[60,0.931]]},"c3":[-160.87,66.54,44.49],"c2":[-91.45,116.06],"k":4,"r":[84,101,106,141,156,158],"rm":0},{"id":"2305.10597","t":"Quijote-PNG: The Information Content of the Halo Mass Function","ab":"We study signatures of primordial non-Gaussianity (PNG) in the redshift-space halo field on non-linear scales, using a combination of three summary statistics, namely the halo mass function (HMF), power spectrum, and bispectrum. The choice of adding the HMF to our previous joint analysis of power spectrum and bispectrum is driven by a preliminary field-level analysis, in which we train graph neural networks on halo catalogues to infer the PNG $f_\\mathrm{NL}$ parameter. The covariance matrix and the responses of our summaries to changes in model parameters are extracted from a suite of halo catalogues constructed from the Quijote-PNG N-body simulations. We consider the three main types of PNG: local, equilateral and orthogonal. Adding the HMF to our previous joint analysis of power spectrum and bispectrum produces two main effects. First, it reduces the equilateral $f_\\mathrm{NL}$ predicted errors by roughly a factor $2$, while also producing notable, although smaller, improvements for orthogonal PNG. Second, it helps break the degeneracy between the local PNG amplitude, $f_\\mathrm{NL}^\\mathrm{local}$, and assembly bias, $b_φ$, without relying on any external prior assumption. Our final forecasts for PNG parameters are $Δf_\\mathrm{NL}^\\mathrm{local} = 40$, $Δf_\\mathrm{NL}^\\mathrm{equil} = 210$, $Δf_\\mathrm{NL}^\\mathrm{ortho} = 91$, on a cubic volume of $1 \\left(h^{-1}{\\rm Gpc}\\right)^3$, with a halo number density of $\\bar{n}\\sim 5.1 \\times 10^{-5}~h^3\\mathrm{Mpc}^{-3}$, at $z = 1$, and considering scales up to $k_\\mathrm{max} = 0.5~h\\,\\mathrm{Mpc}^{-1}$.","abx":0,"nw":0,"d":"2023-05-17","dq":0,"y":2023,"au":[693,166,1230,1806,476,467,1272,753,1076,633,251],"c":26,"cs":0,"bib":"2023ApJ...957...50J","v":"Astrophysical Journal","lk":"arXiv:2305.10597","url":"https://arxiv.org/abs/2305.10597","doi":"10.3847/1538-4357/acfe70","tg":{"s":["Quijote"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["Graph neural networks","Fisher forecasts"],"u":[]},"x":0.069,"yy":-0.548,"p3":[-0.2173,-0.5571,0.0715],"sim":{"k":"e","l":[[96,0.975],[68,0.971],[101,0.963],[106,0.955],[105,0.949]]},"c3":[-175.72,92.93,32.12],"c2":[-110.2,145.22],"k":4,"r":[90,96,98,101,105,106,108,132,135,153,157,158],"rm":0},{"id":"2304.14432","t":"Inferring Warm Dark Matter Masses with Deep Learning","ab":"We present a new suite of over 1,500 cosmological N-body simulations with varied Warm Dark Matter (WDM) models ranging from 2.5 to 30 keV. We use these simulations to train Convolutional Neural Networks (CNNs) to infer WDM particle masses from images of DM field data. Our fiducial setup can make accurate predictions of the WDM particle mass up to 7.5 keV at a 95% confidence level from small maps that cover an area of (25 h$^{-1}$ Mpc)$^2$. We vary the image resolution, simulation resolution, redshift, and cosmology of our fiducial setup to better understand how our model is making predictions. Using these variations, we find that our models are most dependent on simulation resolution, minimally dependent on image resolution, not systematically dependent on redshift, and robust to varied cosmologies. We also find that an important feature to distinguish between WDM models is present with a linear size between 100 and 200 h$^{-1}$ kpc. We compare our fiducial model to one trained on the power spectrum alone and find that our field-level model can make 2x more precise predictions and can make accurate predictions to 2x as massive WDM particle masses when used on the same data. Overall, we find that the field-level data can be used to accurately differentiate between WDM models and contain more information than is captured by the power spectrum. This technique can be extended to more complex DM models and opens up new opportunities to explore alternative DM models in a cosmological environment.","abx":0,"nw":0,"d":"2023-04-27","dq":0,"y":2023,"au":[918,1440,633,1243,1677,1279,1538,1517,444],"c":12,"cs":0,"bib":"2024MNRAS.527..739R","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2304.14432","url":"https://arxiv.org/abs/2304.14432","doi":"10.1093/mnras/stad3260","tg":{"s":["Other simulations"],"d":["Large-scale structure","Dark matter & modified gravity"],"m":["CNN"],"u":[]},"x":0.1493,"yy":0.4189,"p3":[0.2378,0.3463,0.1233],"sim":{"k":"e","l":[[64,0.951],[111,0.944],[25,0.944],[26,0.944],[154,0.943]]},"c3":[18.97,-72.68,175.99],"c2":[120.66,-116.7],"k":6,"r":[118,123,124,125,141],"rm":0},{"id":"2304.06084","t":"Cosmology with one galaxy? -- The ASTRID model and robustness","ab":"Recent work has pointed out the potential existence of a tight relation between the cosmological parameter $Ω_{\\rm m}$, at fixed $Ω_{\\rm b}$, and the properties of individual galaxies in state-of-the-art cosmological hydrodynamic simulations. In this paper, we investigate whether such a relation also holds for galaxies from simulations run with a different code that made use of a distinct subgrid physics: Astrid. We find that also in this case, neural networks are able to infer the value of $Ω_{\\rm m}$ with a $\\sim10\\%$ precision from the properties of individual galaxies while accounting for astrophysics uncertainties as modeled in CAMELS. This tight relationship is present at all considered redshifts, $z\\leq3$, and the stellar mass, the stellar metallicity, and the maximum circular velocity are among the most important galaxy properties behind the relation. In order to use this method with real galaxies, one needs to quantify its robustness: the accuracy of the model when tested on galaxies generated by codes different from the one used for training. We quantify the robustness of the models by testing them on galaxies from four different codes: IllustrisTNG, SIMBA, Astrid, and Magneticum. We show that the models perform well on a large fraction of the galaxies, but fail dramatically on a small fraction of them. Removing these outliers significantly improves the accuracy of the models across simulation codes.","abx":0,"nw":0,"d":"2023-04-12","dq":0,"y":2023,"au":[1329,633,361,1848,363,531,1530,444,996,1733],"c":22,"cs":0,"bib":"2023ApJ...954..125E","v":"Astrophysical Journal","lk":"arXiv:2304.06084","url":"https://arxiv.org/abs/2304.06084","doi":"10.3847/1538-4357/ace96e","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Simulation-based inference","Emulators & regression ML"],"u":["Simulation-based inference"]},"x":-0.078,"yy":0.4359,"p3":[0.221,0.3409,0.5081],"sim":{"k":"e","l":[[115,0.95],[118,0.949],[46,0.948],[87,0.947],[141,0.947]]},"c3":[109.76,-15.73,156.91],"c2":[162.31,-116.11],"k":7,"r":[87,115,118,123,141],"rm":0},{"id":"2304.02096","t":"The CAMELS project: Expanding the galaxy formation model space with new ASTRID and 28-parameter TNG and SIMBA suites","ab":"We present CAMELS-ASTRID, the third suite of hydrodynamical simulations in the Cosmology and Astrophysics with MachinE Learning (CAMELS) project, along with new simulation sets that extend the model parameter space based on the previous frameworks of CAMELS-TNG and CAMELS-SIMBA, to provide broader training sets and testing grounds for machine-learning algorithms designed for cosmological studies. CAMELS-ASTRID employs the galaxy formation model following the ASTRID simulation and contains 2,124 hydrodynamic simulation runs that vary 3 cosmological parameters ($Ω_m$, $σ_8$, $Ω_b$) and 4 parameters controlling stellar and AGN feedback. Compared to the existing TNG and SIMBA simulation suites in CAMELS, the fiducial model of ASTRID features the mildest AGN feedback and predicts the least baryonic effect on the matter power spectrum. The training set of ASTRID covers a broader variation in the galaxy populations and the baryonic impact on the matter power spectrum compared to its TNG and SIMBA counterparts, which can make machine-learning models trained on the ASTRID suite exhibit better extrapolation performance when tested on other hydrodynamic simulation sets. We also introduce extension simulation sets in CAMELS that widely explore 28 parameters in the TNG and SIMBA models, demonstrating the enormity of the overall galaxy formation model parameter space and the complex non-linear interplay between cosmology and astrophysical processes. With the new simulation suites, we show that building robust machine-learning models favors training and testing on the largest possible diversity of galaxy formation models. We also demonstrate that it is possible to train accurate neural networks to infer cosmological parameters using the high-dimensional TNG-SB28 simulation set.","abx":0,"nw":0,"d":"2023-04-04","dq":0,"y":2023,"au":[1848,1651,444,633,1842,1657,1735,1537,1324,1316,1256,753,1647,1061,1533],"c":103,"cs":0,"bib":"2023ApJ...959..136N","v":"Astrophysical Journal","lk":"arXiv:2304.02096","url":"https://arxiv.org/abs/2304.02096","doi":"10.3847/1538-4357/ad022a","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Simulation-based inference"],"u":["Simulation-based inference"]},"x":-0.1674,"yy":0.4763,"p3":[0.1668,0.4056,0.46],"sim":{"k":"e","l":[[141,0.973],[118,0.965],[6,0.963],[66,0.951],[50,0.951]]},"c3":[36.72,56.31,186.36],"c2":[188.83,-6.71],"k":5,"r":[89,90,91,92,94,98,99,100,108,113,114,115,119,120,123,124,125,139,141,157],"rm":0},{"id":"2303.07473","t":"Invertible mapping between fields in CAMELS","ab":"We build a bijective mapping between different physical fields from hydrodynamic CAMELS simulations. We train a CycleGAN on three different setups: translating dark matter to neutral hydrogen (Mcdm-HI), mapping between dark matter and magnetic fields magnitude (Mcdm-B), and finally predicting magnetic fields magnitude from neutral hydrogen (HI-B). We assess the performance of the models using various summary statistics, such as the probability distribution function (PDF) of the pixel values and 2D power spectrum ($P(k)$). Results suggest that in all setups, the model is capable of predicting the target field from the source field and vice versa, and the predicted maps exhibit statistical properties which are consistent with those of the target maps. This is indicated by the fact that the mean and standard deviation of the PDF of maps from the test set is in good agreement with those of the generated maps. The mean and variance of $P(k)$ of the real maps agree well with those of generated ones. The consistency tests on the model suggest that the source field can be recovered reasonably well by a forward mapping (source to target) followed by a backward mapping (target to source). This is demonstrated by the agreement between the statistical properties of the source images and those of the recovered ones.","abx":0,"nw":0,"d":"2023-03-13","dq":0,"y":2023,"au":[1629,1685,633],"c":6,"cs":0,"bib":"2023arXiv230307473A","v":"","lk":"arXiv:2303.07473","url":"https://arxiv.org/abs/2303.07473","doi":"","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["Generative models"],"u":[]},"x":-0.3703,"yy":0.2147,"p3":[0.295,-0.0068,0.4895],"sim":{"k":"e","l":[[97,0.934],[124,0.923],[125,0.922],[10,0.922],[123,0.921]]},"c3":[122.99,-71.2,15.92],"c2":[105.94,-26.87],"k":7,"r":[123,141,145,147,204],"rm":1},{"id":"2302.14591","t":"A universal equation to predict $Ω_{\\rm m}$ from halo and galaxy catalogues","ab":"We discover analytic equations that can infer the value of $Ω_{\\rm m}$ from the positions and velocity moduli of halo and galaxy catalogues. The equations are derived by combining a tailored graph neural network (GNN) architecture with symbolic regression. We first train the GNN on dark matter halos from Gadget N-body simulations to perform field-level likelihood-free inference, and show that our model can infer $Ω_{\\rm m}$ with $\\sim6\\%$ accuracy from halo catalogues of thousands of N-body simulations run with six different codes: Abacus, CUBEP$^3$M, Gadget, Enzo, PKDGrav3, and Ramses. By applying symbolic regression to the different parts comprising the GNN, we derive equations that can predict $Ω_{\\rm m}$ from halo catalogues of simulations run with all of the above codes with accuracies similar to those of the GNN. We show that by tuning a single free parameter, our equations can also infer the value of $Ω_{\\rm m}$ from galaxy catalogues of thousands of state-of-the-art hydrodynamic simulations of the CAMELS project, each with a different astrophysics model, run with five distinct codes that employ different subgrid physics: IllustrisTNG, SIMBA, Astrid, Magneticum, SWIFT-EAGLE. Furthermore, the equations also perform well when tested on galaxy catalogues from simulations covering a vast region in parameter space that samples variations in 5 cosmological and 23 astrophysical parameters. We speculate that the equations may reflect the existence of a fundamental physics relation between the phase-space distribution of generic tracers and $Ω_{\\rm m}$, one that is not affected by galaxy formation physics down to scales as small as $10~h^{-1}{\\rm kpc}$.","abx":0,"nw":0,"d":"2023-02-28","dq":0,"y":2023,"au":[753,1316,633,1530,1848,444,1651,1061,1751,1733,532,996,378,535,1073,1276],"c":20,"cs":0,"bib":"2023ApJ...956..149S","v":"","lk":"arXiv:2302.14591","url":"https://arxiv.org/abs/2302.14591","doi":"","tg":{"s":["CAMELS","Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Graph neural networks","Simulation-based inference","Symbolic regression"],"u":[]},"x":-0.0265,"yy":0.1639,"p3":[0.0909,0.0675,0.3378],"sim":{"k":"e","l":[[98,0.972],[120,0.957],[18,0.956],[90,0.955],[108,0.953]]},"c3":[42.26,-58.64,152.46],"c2":[161.53,-1.43],"k":7,"r":[90,98,99,108,118,120,123,124,127,138,139,141],"rm":0},{"id":"2302.14101","t":"Robust Field-level Likelihood-free Inference with Galaxies","ab":"We train graph neural networks to perform field-level likelihood-free inference using galaxy catalogs from state-of-the-art hydrodynamic simulations of the CAMELS project. Our models are rotational, translational, and permutation invariant and do not impose any cut on scale. From galaxy catalogs that only contain $3$D positions and radial velocities of $\\sim 1, 000$ galaxies in tiny $(25~h^{-1}{\\rm Mpc})^3$ volumes our models can infer the value of $Ω_{\\rm m}$ with approximately $12$ % precision. More importantly, by testing the models on galaxy catalogs from thousands of hydrodynamic simulations, each having a different efficiency of supernova and AGN feedback, run with five different codes and subgrid models - IllustrisTNG, SIMBA, Astrid, Magneticum, SWIFT-EAGLE -, we find that our models are robust to changes in astrophysics, subgrid physics, and subhalo/galaxy finder. Furthermore, we test our models on $1,024$ simulations that cover a vast region in parameter space - variations in $5$ cosmological and $23$ astrophysical parameters - finding that the model extrapolates really well. Our results indicate that the key to building a robust model is the use of both galaxy positions and velocities, suggesting that the network have likely learned an underlying physical relation that does not depend on galaxy formation and is valid on scales larger than $\\sim10~h^{-1}{\\rm kpc}$.","abx":0,"nw":0,"d":"2023-02-27","dq":0,"y":2023,"au":[1316,753,633,1040,1530,1434,1848,444,1651,531,1751,378,996,1733,1243],"c":65,"cs":0,"bib":"2023ApJ...952...69D","v":"Astrophysical Journal","lk":"arXiv:2302.14101","url":"https://arxiv.org/abs/2302.14101","doi":"10.3847/1538-4357/acd1e2","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":-0.1703,"yy":0.2319,"p3":[-0.0025,-0.1737,0.6035],"sim":{"k":"e","l":[[108,0.972],[75,0.972],[98,0.967],[7,0.96],[6,0.957]]},"c3":[-40.33,35.65,143.03],"c2":[113.82,47.01],"k":7,"r":[87,89,98,108,111,115,118,119,120,123,125,127,137,138,141,153,154,157,158,166],"rm":0},{"id":"2301.02231","t":"Predicting the impact of feedback on matter clustering with machine learning in CAMELS","ab":"Extracting information from the total matter power spectrum with the precision needed for upcoming cosmological surveys requires unraveling the complex effects of galaxy formation processes on the distribution of matter. We investigate the impact of baryonic physics on matter clustering at $z=0$ using a library of power spectra from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project, containing thousands of $(25\\,h^{-1}{\\rm Mpc})^3$ volume realizations with varying cosmology, initial random field, stellar and AGN feedback strength and sub-grid model implementation methods. We show that baryonic physics affects matter clustering on scales $k \\gtrsim 0.4\\,h\\,\\mathrm{Mpc}^{-1}$ and the magnitude of this effect is dependent on the details of the galaxy formation implementation and variations of cosmological and astrophysical parameters. Increasing AGN feedback strength decreases halo baryon fractions and yields stronger suppression of power relative to N-body simulations, while stronger stellar feedback often results in weaker effects by suppressing black hole growth and therefore the impact of AGN feedback. We find a broad correlation between mean baryon fraction of massive halos ($M_{\\rm 200c} > 10^{13.5}$\\,\\Msun) and suppression of matter clustering but with significant scatter compared to previous work owing to wider exploration of feedback parameters and cosmic variance effects. We show that a random forest regressor trained on the baryon content and abundance of halos across the full mass range $10^{10} \\leq M_\\mathrm{halo}/$\\Msun$< 10^{15}$ can predict the effect of galaxy formation on the matter power spectrum on scales $k = 1.0$--20.0\\,$h\\,\\mathrm{Mpc}^{-1}$.","abx":0,"nw":0,"d":"2023-01-05","dq":0,"y":2023,"au":[162,444,1072,1647,977,1513,1274,1651,633,1061],"c":45,"cs":0,"bib":"2023MNRAS.526.5306D","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2301.02231","url":"https://arxiv.org/abs/2301.02231","doi":"10.1093/mnras/stad2992","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Other ML"],"u":[]},"x":-0.1523,"yy":0.911,"p3":[-0.6546,0.2231,0.3871],"sim":{"k":"e","l":[[81,0.951],[92,0.948],[52,0.947],[30,0.944],[6,0.939]]},"c3":[94.84,66.39,202.81],"c2":[244.02,-38.57],"k":5,"r":[81,92,98,111,113,116,118,120,124,125,127,141],"rm":0},{"id":"2301.02186","t":"Inferring the impact of feedback on the matter distribution using the Sunyaev Zel'dovich effect: Insights from CAMELS simulations and ACT+DES data","ab":"Feedback from active galactic nuclei and stellar processes changes the matter distribution on small scales, leading to significant systematic uncertainty in weak lensing constraints on cosmology. We investigate how the observable properties of group-scale halos can constrain feedback's impact on the matter distribution using Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS). Extending the results of previous work to smaller halo masses and higher wavenumber, $k$, we find that the baryon fraction in halos contains significant information about the impact of feedback on the matter power spectrum. We explore how the thermal Sunyaev Zel'dovich (tSZ) signal from group-scale halos contains similar information. Using recent Dark Energy Survey (DES) weak lensing and Atacama Cosmology Telescope (ACT) tSZ cross-correlation measurements and models trained on CAMELS, we obtain $10\\%$ constraints on feedback effects on the power spectrum at $k \\sim 5\\, h/{\\rm Mpc}$. We show that with future surveys, it will be possible to constrain baryonic effects on the power spectrum to $\\mathcal{O}(<1\\%)$ at $k = 1\\, h/{\\rm Mpc}$ and $\\mathcal{O}(3\\%)$ at $k = 5\\, h/{\\rm Mpc}$ using the methods that we introduce here. Finally, we investigate the impact of feedback on the matter bispectrum, finding that tSZ observables are highly informative in this case.","abx":0,"nw":0,"d":"2023-01-05","dq":0,"y":2023,"au":[1647,977,551,1848,444,1651,633,162,1735],"c":45,"cs":0,"bib":"2023MNRAS.525.1779P","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2301.02186","url":"https://arxiv.org/abs/2301.02186","doi":"10.1093/mnras/stad2268","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback","CMB & SZ"],"m":["Emulators & regression ML"],"u":["Emulators & regression ML"]},"x":-0.1226,"yy":0.8636,"p3":[-0.6915,0.0555,0.3067],"sim":{"k":"e","l":[[17,0.95],[91,0.948],[114,0.947],[116,0.946],[113,0.939]]},"c3":[149.37,80.49,168.34],"c2":[273.15,-42.35],"k":5,"r":[81,91,99,113,114,141,156],"rm":0},{"id":"2212.06860","t":"Machine-learning cosmology from void properties","ab":"Cosmic voids are the largest and most underdense structures in the Universe. Their properties have been shown to encode precious information about the laws and constituents of the Universe. We show that machine learning techniques can unlock the information in void features for cosmological parameter inference. We rely on thousands of void catalogs from the GIGANTES dataset, where every catalog contains an average of 11,000 voids from a volume of $1~(h^{-1}{\\rm Gpc})^3$. We focus on three properties of cosmic voids: ellipticity, density contrast, and radius. We train 1) fully connected neural networks on histograms from individual void properties and 2) deep sets from void catalogs, to perform likelihood-free inference on the value of cosmological parameters. We find that our best models are able to constrain the value of $Ω_{\\rm m}$, $σ_8$, and $n_s$ with mean relative errors of $10\\%$, $4\\%$, and $3\\%$, respectively, without using any spatial information from the void catalogs. Our results provide an illustration for the use of machine learning to constrain cosmology with voids.","abx":0,"nw":0,"d":"2022-12-13","dq":0,"y":2022,"au":[265,153,633,251],"c":16,"cs":0,"bib":"2023ApJ...955..131W","v":"Astrophysical Journal","lk":"arXiv:2212.06860","url":"https://arxiv.org/abs/2212.06860","doi":"10.3847/1538-4357/aceaf6","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Graph neural networks","Simulation-based inference"],"u":["Graph neural networks"]},"x":0.3542,"yy":0.255,"p3":[-0.3627,0.2735,-0.1183],"sim":{"k":"e","l":[[129,0.976],[163,0.954],[111,0.947],[158,0.94],[209,0.939]]},"c3":[-50.2,77.84,25.62],"c2":[-44.51,52.11],"k":7,"r":[98,108,123,124,129,132,153,158,163,195,209],"rm":0},{"id":"2211.16461","t":"Calibrating cosmological simulations with implicit likelihood inference using galaxy growth observables","ab":"In a novel approach employing implicit likelihood inference (ILI), also known as likelihood-free inference, we calibrate the parameters of cosmological hydrodynamic simulations against observations, which has previously been unfeasible due to the high computational cost of these simulations. For computational efficiency, we train neural networks as emulators on ~1000 cosmological simulations from the CAMELS project to estimate simulated observables, taking as input the cosmological and astrophysical parameters, and use these emulators as surrogates to the cosmological simulations. Using the cosmic star formation rate density (SFRD) and, separately, stellar mass functions (SMFs) at different redshifts, we perform ILI on selected cosmological and astrophysical parameters (Omega_m, sigma_8, stellar wind feedback, and kinetic black hole feedback) and obtain full 6-dimensional posterior distributions. In the performance test, the ILI from the emulated SFRD (SMFs) can recover the target observables with a relative error of 0.17% (0.4%). We find that degeneracies exist between the parameters inferred from the emulated SFRD, confirmed with new full cosmological simulations. We also find that the SMFs can break the degeneracy in the SFRD, which indicates that the SMFs provide complementary constraints for the parameters. Further, we find that the parameter combination inferred from an observationally-inferred SFRD reproduces the target observed SFRD very well, whereas, in the case of the SMFs, the inferred and observed SMFs show significant discrepancies that indicate potential limitations of the current galaxy formation modeling and calibration framework, and/or systematic differences and inconsistencies between observations of the stellar mass function.","abx":0,"nw":0,"d":"2022-11-29","dq":0,"y":2022,"au":[1842,1651,251,1513,633,713,444,445,478,904],"c":23,"cs":0,"bib":"2023ApJ...944...67J","v":"Astrophysical Journal","lk":"arXiv:2211.16461","url":"https://arxiv.org/abs/2211.16461","doi":"10.3847/1538-4357/aca8fe","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["Simulation-based inference","Emulators & regression ML"],"u":[]},"x":-0.274,"yy":0.358,"p3":[0.1738,-0.0952,0.644],"sim":{"k":"e","l":[[115,0.948],[125,0.947],[75,0.947],[124,0.945],[76,0.945]]},"c3":[38.78,39.19,213.63],"c2":[202.43,-56.7],"k":7,"r":[119,141],"rm":0},{"id":"2211.12457","t":"Euclid: Modelling massive neutrinos in cosmology -- a code comparison","ab":"The measurement of the absolute neutrino mass scale from cosmological large-scale clustering data is one of the key science goals of the Euclid mission. Such a measurement relies on precise modelling of the impact of neutrinos on structure formation, which can be studied with $N$-body simulations. Here we present the results from a major code comparison effort to establish the maturity and reliability of numerical methods for treating massive neutrinos. The comparison includes eleven full $N$-body implementations (not all of them independent), two $N$-body schemes with approximate time integration, and four additional codes that directly predict or emulate the matter power spectrum. Using a common set of initial data we quantify the relative agreement on the nonlinear power spectrum of cold dark matter and baryons and, for the $N$-body codes, also the relative agreement on the bispectrum, halo mass function, and halo bias. We find that the different numerical implementations produce fully consistent results. We can therefore be confident that we can model the impact of massive neutrinos at the sub-percent level in the most common summary statistics. We also provide a code validation pipeline for future reference.","abx":0,"nw":0,"d":"2022-11-22","dq":0,"y":2022,"au":[808,1478,278,1230,1105,213,288,1733,823,996,1791,374,299,1577,589,305,961,232,1495,1407,319,409,325,678,429,102,1613,1480,1788,877,1717,1254,633,749,241,1220,1291,1001,1292,400,488,1108,1674,1760,1765,817,591,1115,1555,29,1475,649,1015,1818,32,728,1123,577,277,1808,1564,1567,1568,1391,1129,495,1571,224,1793,225,48,1620,1794,55,958,1587,62,1143,1705,1146,740,1369,771,1347,1348,628,1494,509,1158,672,1163,1069,511,1541,324,1601,603,972,1795,1772,679,1172,1000,607,1502,98,868,680,515,1182,1504,430,242,1420,1716,103,683,335,686,1048,798,1424,81,780,1507,619,781,1053,1719,1829,883,119,692,885,661,1774],"c":32,"cs":0,"bib":"2023JCAP...06..035.","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2211.12457","url":"https://arxiv.org/abs/2211.12457","doi":"10.1088/1475-7516/2023/06/035","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos","Surveys & instruments"],"m":["No ML"],"u":["No ML"],"n":"Euclid neutrino code comparison; some compared codes are emulators but no ML developed here."},"x":0.2499,"yy":0.0376,"p3":[-0.1355,0.0805,-0.0609],"sim":{"k":"e","l":[[37,0.944],[111,0.941],[149,0.939],[66,0.938],[158,0.937]]},"c3":[-127.52,-8.25,-210.06],"c2":[-265.04,-101.64],"k":3,"r":[182,191,196,206,213,214,215],"rm":0},{"id":"2211.07565","t":"Quijote-PNG: Quasi-maximum likelihood estimation of Primordial Non-Gaussianity in the non-linear halo density field","ab":"We study primordial non-Gaussian signatures in the redshift-space halo field on non-linear scales, using a quasi-maximum likelihood estimator based on optimally compressed power spectrum and modal bispectrum statistics. We train and validate the estimator on a suite of halo catalogues constructed from the Quijote-PNG N-body simulations, which we release to accompany this paper. We verify its unbiasedness and near optimality, for the three main types of primordial non-Gaussianity (PNG): local, equilateral, and orthogonal. We compare the modal bispectrum expansion with a $k$-binning approach, showing that the former allows for faster convergence of numerical derivatives in the computation of the score-function, thus leading to better final constraints. We find, in agreement with previous studies, that the local PNG signal in the halo-field is dominated by the scale-dependent bias signature on large scales and saturates at $k \\sim 0.2~h\\,\\mathrm{Mpc}^{-1}$, whereas the small-scale bispectrum is the main source of information for equilateral and orthogonal PNG. Combining power spectrum and bispectrum on non-linear scales plays an important role in breaking degeneracies between cosmological and PNG parameters; such degeneracies remain however strong for equilateral PNG. We forecast that PNG parameters can be constrained with $Δf_\\mathrm{NL}^\\mathrm{local} = 45$, $Δf_\\mathrm{NL}^\\mathrm{equil} = 570$, $Δf_\\mathrm{NL}^\\mathrm{ortho} = 110$, on a cubic volume of $1 \\left({ {\\rm Gpc}/{ {\\rm h}}} \\right)^3$, at $z = 1$, considering scales up to $k_\\mathrm{max} = 0.5~h\\,\\mathrm{Mpc}^{-1}$.","abx":0,"nw":0,"d":"2022-11-14","dq":0,"y":2022,"au":[693,467,1272,1230,1806,476,1076,633,251],"c":16,"cs":0,"bib":"2023ApJ...948..135J","v":"Astrophysical Journal","lk":"arXiv:2211.07565","url":"https://arxiv.org/abs/2211.07565","doi":"10.3847/1538-4357/acc4bd","tg":{"s":["Quijote"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.0499,"yy":-0.5202,"p3":[-0.1429,-0.7439,0.0306],"sim":{"k":"e","l":[[84,0.975],[105,0.975],[68,0.969],[101,0.964],[106,0.962]]},"c3":[-192.87,16.53,-27.5],"c2":[-186.71,97.33],"k":4,"r":[101,102,105,106,107,121,135,142,152,157,158,181],"rm":0},{"id":"2211.05000","t":"Emulating cosmological multifields with generative adversarial networks","ab":"We explore the possibility of using deep learning to generate multifield images from state-of-the-art hydrodynamic simulations of the CAMELS project. We use a generative adversarial network to generate images with three different channels that represent gas density (Mgas), neutral hydrogen density (HI), and magnetic field amplitudes (B). The quality of each map in each example generated by the model looks very promising. The GAN considered in this study is able to generate maps whose mean and standard deviation of the probability density distribution of the pixels are consistent with those of the maps from the training data. The mean and standard deviation of the auto power spectra of the generated maps of each field agree well with those computed from the maps of IllustrisTNG. Moreover, the cross-correlations between fields in all instances produced by the emulator are in good agreement with those of the dataset. This implies that all three maps in each output of the generator encode the same underlying cosmology and astrophysics.","abx":0,"nw":0,"d":"2022-11-09","dq":0,"y":2022,"au":[1629,633,1685],"c":8,"cs":0,"bib":"2022arXiv221105000A","v":"","lk":"arXiv:2211.05000","url":"https://arxiv.org/abs/2211.05000","doi":"","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback","Neutral hydrogen & 21cm"],"m":["Generative models"],"u":["Neutral hydrogen & 21cm"]},"x":-0.4065,"yy":0.1784,"p3":[0.4608,-0.0683,0.4161],"sim":{"k":"e","l":[[69,0.97],[162,0.953],[126,0.946],[125,0.946],[141,0.941]]},"c3":[98.78,-45.06,48.63],"c2":[81.47,-106.65],"k":7,"r":[118,123,141,162],"rm":0},{"id":"2209.06843","t":"Robust field-level inference with dark matter halos","ab":"We train graph neural networks on halo catalogues from Gadget N-body simulations to perform field-level likelihood-free inference of cosmological parameters. The catalogues contain $\\lesssim$5,000 halos with masses $\\gtrsim 10^{10}~h^{-1}M_\\odot$ in a periodic volume of $(25~h^{-1}{\\rm Mpc})^3$; every halo in the catalogue is characterized by several properties such as position, mass, velocity, concentration, and maximum circular velocity. Our models, built to be permutationally, translationally, and rotationally invariant, do not impose a minimum scale on which to extract information and are able to infer the values of $Ω_{\\rm m}$ and $σ_8$ with a mean relative error of $\\sim6\\%$, when using positions plus velocities and positions plus masses, respectively. More importantly, we find that our models are very robust: they
