hod that assigns HI to all gas particles using a prescription based on the physical properties of the particles. The HI statistical properties are then compared to the observational properties of Damped Lyman-$α$ Absorbers (DLAs) and of lower column density systems and reasonable good agreement is found for all the cases. Among the halo-based method, we further consider two different schemes that aim at reproducing the observed properties of DLAs by distributing HI inside halos: one of this results in a much higher bias for DLAs, in agreement with recent observations, which boosts the 21 cm power spectrum by a factor $\\sim 4$ with respect to the other recipe. We compute the 21 cm power spectrum from the simulated HI distribution and calculate the expected signal for both SKA1-mid and SKA1-low configurations at $2.4 \\leq z \\leq 4$. We find that SKA will be able to detect the 21 cm power spectrum, in the non-linear regime, up to $k\\sim 1\\,h$/Mpc for SKA1-mid and $k\\sim 5\\,h$/Mpc for SKA1-low with 100 hours of observations. We also investigate the perspective of imaging the HI distribution. Our findings indicate that SKA1-low could detect the most massive HI peaks with a signal to noise ratio (SNR) higher than 5 for an observation time of about 1000 hours at $z=4$, for a synthesized beam width of $2'$. Detection at redshifts $z\\geqslant2.4$ with SKA1-mid would instead require a much longer observation time to achieve a comparable SNR level.","abx":0,"nw":0,"d":"2014-05-26","dq":0,"y":2014,"au":[633,1254,978,1714],"c":85,"cs":0,"bib":"2014JCAP...09..050V","v":"","lk":"arXiv:1405.6713","url":"https://arxiv.org/abs/1405.6713","doi":"10.1088/1475-7516/2014/09/050","tg":{"s":["Other simulations"],"d":["Neutral hydrogen & 21cm","Surveys & instruments"],"m":["No ML"],"u":[]},"x":-0.5996,"yy":-0.3031,"p3":[0.226,0.3524,-0.5106],"sim":{"k":"e","l":[[205,0.957],[202,0.955],[189,0.952],[180,0.948],[170,0.945]]},"c3":[113.49,-101.23,-137.24],"c2":[5.1,154.96],"k":2,"r":[],"rm":0},{"id":"1403.2185","t":"Constraining Warm Dark Matter with high-$z$ supernova lensing","ab":"We propose a new method to constrain the warm dark matter (WDM) particle mass, $m_χ$, based on the counts of multiply imaged, distant supernovae (SN) produced by strong lensing by intervening cosmological matter fluctuations. The counts are very sensitive to the WDM particle mass, assumed here to be $m_χ=1, 1.5, 2$ keV. We use the analytic approach developed by Das & Ostriker to compute the probability density function of the cold dark matter (CDM) convergence ($κ$) on the lens plane; such method has been extensively tested against numerical simulations. We have extended this method generalizing it to the WDM case, after testing it against WDM $N$-body simulations. Using the observed cosmic star formation history we compute the probability for a distant SN to undergo a strong lensing event in different cosmologies. A minimum observing time of 2 yr (5 yr) is required for a future 100 square degrees survey reaching $z \\approx 4$ ($z \\approx 3$) to disentangle at 2$σ$ a WDM ($m_χ=1$ keV) model from the standard CDM scenario. Our method is not affected by any astrophysical uncertainty (such as baryonic physics effects), and, in principle, it does not require any particular dedicated survey strategy, as it may come as a byproduct of a future SN survey.","abx":0,"nw":0,"d":"2014-03-10","dq":0,"y":2014,"au":[1672,351,164,633],"c":7,"cs":0,"bib":"2014MNRAS.442...13P","v":"","lk":"arXiv:1403.2185","url":"https://arxiv.org/abs/1403.2185","doi":"10.1093/mnras/stu785","tg":{"s":["Other simulations"],"d":["Dark matter & modified gravity"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.5444,"yy":-0.3135,"p3":[0.1269,-0.2005,-0.4333],"sim":{"k":"e","l":[[182,0.931],[178,0.916],[196,0.916],[149,0.915],[45,0.915]]},"c3":[-102.89,-269.72,-35.34],"c2":[-65.49,-301.63],"k":3,"r":[],"rm":0},{"id":"1311.2588","t":"Cosmic Degeneracies I: Joint N-body Simulations of Modified Gravity and Massive Neutrinos","ab":"We present the first suite of cosmological N-body simulations that simultaneously include the effects of two different and theoretically independent extensions of the standard $Λ$CDM cosmological scenario - namely an $f(R)$ theory of Modified Gravity (MG) and a cosmological background of massive neutrinos - with the aim to investigate their possible observational degeneracies. We focus on three basic statistics of the large-scale matter distribution, more specifically the nonlinear matter power spectrum, the halo mass function, and the halo bias, for which we determine the deviation with respect to the fiducial $Λ$CDM cosmology in the context of both separate and combined simulations of $f(R)$ MG and massive neutrinos scenarios. Our results show that while these two extended models separately determine very prominent and potentially detectable features in all the three statistics, when we allow them to be simultaneously at work these features are strongly suppressed, resulting in much weaker deviations from the standard model's predictions. In particular, when an $f(R)$ gravity model with $f_{R0}=-1\\times 10^{-4}$ is combined with a total neutrino mass of $Σ_{i}m_{ν_{i}}=0.4$ eV, the resulting matter power spectrum, halo mass function, and bias at z=0 are found to be consistent with the standard model's predictions at the 10%, 20%, and 5% accuracy levels, respectively. Therefore, our results imply an intrinsic theoretical limit to the effective discriminating power of present and future observational data sets with respect to these widely considered extensions of the standard cosmological scenario in the absence of independent measurements of the neutrino masses from laboratory experiments, even though the high-redshift evolution might still allow to partially break the degeneracy [Abridged].","abx":0,"nw":0,"d":"2013-11-11","dq":0,"y":2013,"au":[1230,633,1254,559,1788,1069],"c":137,"cs":0,"bib":"2014MNRAS.440...75B","v":"","lk":"arXiv:1311.2588","url":"https://arxiv.org/abs/1311.2588","doi":"10.1093/mnras/stu259","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos","Dark matter & modified gravity"],"m":["No ML"],"u":[]},"x":0.5461,"yy":-0.6847,"p3":[-0.1294,-0.3981,-0.6656],"sim":{"k":"e","l":[[207,0.939],[214,0.938],[59,0.937],[203,0.936],[215,0.933]]},"c3":[-82.73,76.81,-220.44],"c2":[-272.8,-17.93],"k":3,"r":[213,214,215,216,217,218],"rm":0},{"id":"1311.1514","t":"Cosmology with massive neutrinos III: the halo mass function and an application to galaxy clusters","ab":"We use a suite of N-body simulations that incorporate massive neutrinos as an extra-set of particles to investigate their effect on the halo mass function. We show that for cosmologies with massive neutrinos the mass function of dark matter haloes selected using the spherical overdensity (SO) criterion is well reproduced by the fitting formula of Tinker et al. (2008) once the cold dark matter power spectrum is considered instead of the total matter power, as it is usually done. The differences between the two implementations, i.e. using $P_{\\rm cdm}(k)$ instead of $P_{\\rm m}(k)$, are more pronounced for large values of the neutrino masses and in the high end of the halo mass function: in particular, the number of massive haloes is higher when $P_{\\rm cdm}(k)$ is considered rather than $P_{\\rm m}(k)$. As a quantitative application of our findings we consider a Planck-like SZ-clusters survey and show that the differences in predicted number counts can be as large as $30\\%$ for $\\sum m_ν= 0.4$ eV. Finally, we use the Planck-SZ clusters sample, with an approximate likelihood calculation, to derive Planck-like constraints on cosmological parameters. We find that, in a massive neutrino cosmology, our correction to the halo mass function produces a shift in the $σ_8(Ω_{\\rm m}/0.27)^γ$ relation which can be quantified as $Δγ\\sim 0.05$ and $Δγ\\sim 0.14$ assuming one ($N_ν=1$) or three ($N_ν=3$) degenerate massive neutrino, respectively. The shift results in a lower mean value of $σ_8$ with $Δσ_8 = 0.01$ for $N_ν=1$ and $Δσ_8 = 0.02$ for $N_ν=3$, respectively. Such difference, in a cosmology with massive neutrinos, would increase the tension between cluster abundance and Planck CMB measurements.","abx":0,"nw":0,"d":"2013-11-06","dq":0,"y":2013,"au":[1253,633,1254,945,1673,540,543],"c":125,"cs":0,"bib":"2013JCAP...12..012C","v":"","lk":"arXiv:1311.1514","url":"https://arxiv.org/abs/1311.1514","doi":"10.1088/1475-7516/2013/12/012","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos","CMB & SZ"],"m":["No ML"],"u":[]},"x":0.4696,"yy":-0.571,"p3":[-0.3175,-0.0516,-0.5723],"sim":{"k":"e","l":[[215,0.947],[214,0.936],[149,0.927],[169,0.926],[199,0.926]]},"c3":[-79.69,0.58,-236.29],"c2":[-234.71,-105.37],"k":3,"r":[214,215,216,218],"rm":0},{"id":"1311.1212","t":"Cosmology with massive neutrinos II: on the universality of the halo mass function and bias","ab":"We use a large suite of N-body simulations to study departures from universality in halo abundances and clustering in cosmologies with non-vanishing neutrino masses. To this end, we study how the halo mass function and halo bias factors depend on the scaling variable $σ^2(M,z)$, the variance of the initial matter fluctuation field, rather than on halo mass $M$ and redshift $z$ themselves. We show that using the variance of the cold dark matter rather than the total mass field, i.e., $σ^2_{cdm}(M,z)$ rather than $σ^2_{m}(M,z)$, yields more universal results. Analysis of halo bias yields similar conclusions: When large-scale halo bias is defined with respect to the cold dark matter power spectrum, the result is both more universal, and less scale- or $k$-dependent. These results are used extensively in Papers I and III of this series.","abx":0,"nw":0,"d":"2013-11-05","dq":0,"y":2013,"au":[540,543,1520,633,1254],"c":180,"cs":0,"bib":"2014JCAP...02..049C","v":"","lk":"arXiv:1311.1212","url":"https://arxiv.org/abs/1311.1212","doi":"10.1088/1475-7516/2014/02/049","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["No ML"],"u":[]},"x":0.5101,"yy":-0.5042,"p3":[-0.2014,-0.1488,-0.6484],"sim":{"k":"e","l":[[215,0.952],[149,0.944],[161,0.944],[169,0.938],[212,0.938]]},"c3":[-72.07,-40.21,-193.29],"c2":[-194.23,-121.74],"k":3,"r":[213,215,216,218],"rm":0},{"id":"1311.0866","t":"Cosmology with massive neutrinos I: towards a realistic modeling of the relation between matter, haloes and galaxies","ab":"By using a suite of large box-size N-body simulations that incorporate massive neutrinos as an extra set of particles, we investigate the impact of neutrino masses on the spatial distribution of dark matter haloes and galaxies. We compute the bias between the spatial distribution of dark matter haloes and the overall matter and cold dark matter distributions using statistical tools such as the power spectrum and the two-point correlation function. Overall we find a scale-dependent bias on large scales for the cosmologies with massive neutrinos. However, our results indicate that the scale-dependence in the bias is reduced if the latter is computed with respect to the cold dark matter distribution only. We find that the value of the bias on large scales is reasonably well reproduced by the Tinker fitting formula once the linear cold dark matter power spectrum is used, instead of the total matter power spectrum. We investigate whether scale-dependent bias really comes from purely neutrino's effect or from nonlinear gravitational collapse of haloes. For this purpose, we address the $Ω_ν$-$σ_8$ degeneracy and find that such degeneracy is not perfect, implying that neutrinos imprint a slight scale dependence on the large-scale bias. Finally, by using a simple halo occupation distribution (HOD) model, we investigate the impact of massive neutrinos on the distribution of galaxies within dark matter haloes. We use the main galaxy sample in the Sloan Digital Sky Survey II Data Release 7 to investigate if the small-scale galaxy clustering alone can be used to discriminate among different cosmological models with different neutrino masses. Our results suggest that different choices of the HOD parameters can reproduce the observational measurements relatively well, and we quantify the difference between the values of the HOD parameters between massless and massive neutrino cosmologies.","abx":0,"nw":0,"d":"2013-11-04","dq":0,"y":2013,"au":[633,628,1254,488,540,543,1648],"c":164,"cs":0,"bib":"2014JCAP...03..011V","v":"","lk":"arXiv:1311.0866","url":"https://arxiv.org/abs/1311.0866","doi":"10.1088/1475-7516/2014/03/011","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.4858,"yy":-0.5299,"p3":[-0.2736,-0.1412,-0.5297],"sim":{"k":"e","l":[[214,0.952],[143,0.949],[169,0.949],[161,0.948],[213,0.947]]},"c3":[-52.82,-21.17,-177.02],"c2":[-192.86,-90.18],"k":3,"r":[213,214,216,217,218],"rm":0},{"id":"1212.4855","t":"Non-linear evolution of the cosmic neutrino background","ab":"We investigate the non-linear evolution of the relic cosmic neutrino background by running large box-size, high resolution N-body simulations. Our set of simulations explore the properties of neutrinos in a reference $Λ$CDM model with total neutrino masses between 0.05-0.60 eV in cold dark matter haloes of mass $10^{11}-10^{15}$ $h^{-1}$M$_{\\odot}$, over a redshift range $z=0-2$. We compute the halo mass function and show that it is reasonably well fitted by the Sheth-Tormen formula. More importantly, we focus on the CDM and neutrino properties of the density and peculiar velocity fields in the cosmological volume, inside and in the outskirts of virialized haloes. The dynamical state of the neutrino particles depends strongly on their momentum: whereas neutrinos in the low velocity tail behave similarly to CDM particles, neutrinos in the high velocity tail are not affected by the clustering of the underlying CDM component. We find that the neutrino (linear) unperturbed momentum distribution is modified and mass and redshift dependent deviations from the expected Fermi-Dirac distribution are in place both in the cosmological volume and inside haloes. The neutrino density profiles around virialized haloes have been carefully investigated and a simple fitting formula is provided. The neutrino profile, unlike the cold dark matter one, is found to be cored with core size and central density that depend on the neutrino mass, redshift and mass of the halo, for halos of masses larger than $\\sim 10^{13.5}h^{-1}$M$_{\\odot}$. For lower masses the neutrino profile is best fitted by a simple power-law relation in the range probed by the simulations. Our findings are particularly important in view of upcoming large-scale structure surveys, like Euclid, that are expected to probe the non-linear regime at the percent level with lensing and clustering observations.","abx":0,"nw":0,"d":"2012-12-19","dq":0,"y":2012,"au":[633,1657,350,1254],"c":71,"cs":0,"bib":"2013JCAP...03..019V","v":"","lk":"arXiv:1212.4855","url":"https://arxiv.org/abs/1212.4855","doi":"10.1088/1475-7516/2013/03/019","tg":{"s":["Other simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["No ML"],"u":[]},"x":0.6178,"yy":-0.6062,"p3":[-0.0908,-0.2811,-0.6815],"sim":{"k":"e","l":[[207,0.944],[215,0.944],[144,0.941],[203,0.94],[218,0.938]]},"c3":[-97.85,12.56,-173.6],"c2":[-212.67,-67.25],"k":3,"r":[217,218],"rm":0},{"id":"1106.2543","t":"Neutrino Signatures on the High Transmission Regions of the Lyman-alpha Forest","ab":"We quantify the impact of massive neutrinos on the statistics of low density regions in the intergalactic medium (IGM) as probed by the Lyman-alpha forest at redshifts z=2.2--4. Based on mock but realistic quasar (QSO) spectra extracted from hydrodynamic simulations with cold dark matter, baryons and neutrinos, we find that the probability distribution of weak Lyman-alpha absorption features, as sampled by Lyman-alpha flux regions at high transmissivity, is strongly affected by the presence of massive neutrinos. We show that systematic errors affecting the Lyman-alpha forest reduce but do not erase the neutrino signal. Using the Fisher matrix formalism, we conclude that the sum of the neutrino masses can be measured, using the method proposed in this paper, with a precision smaller than 0.4 eV using a catalog of 200 high resolution (S/N~100) QSO spectra. This number reduces to 0.27 eV by making use of reasonable priors in the other parameters that also affect the statistics of the high transitivity regions of the Lyman-alpha forest. The constraints obtained with this method can be combined with independent bounds from the CMB, large scale structures and measurements of the matter power spectrum from the Lyman-alpha forest to produce tighter upper limits on the sum of the masses of the neutrinos.","abx":0,"nw":0,"d":"2011-06-13","dq":0,"y":2011,"au":[633,1243,1254,125],"c":31,"cs":0,"bib":"2013MNRAS.431.3670V","v":"","lk":"arXiv:1106.2543","url":"https://arxiv.org/abs/1106.2543","doi":"10.1093/mnras/stt452","tg":{"s":["Other simulations"],"d":["Massive neutrinos","Galaxies & baryonic feedback"],"m":["Fisher forecasts","No ML"],"u":["Galaxies & baryonic feedback"]},"x":0.3778,"yy":-0.3097,"p3":[-0.0398,-0.125,-0.5216],"sim":{"k":"e","l":[[187,0.936],[178,0.927],[215,0.927],[199,0.925],[153,0.924]]},"c3":[-21.35,55.28,-196.35],"c2":[-239.86,-36.0],"k":3,"r":[],"rm":0},{"id":"1104.4770","t":"Neutrino Halos in Clusters of Galaxies and their Weak Lensing Signature","ab":"We study whether non-linear gravitational effects of relic neutrinos on the development of clustering and large-scale structure may be observable by weak gravitational lensing. We compute the density profile of relic massive neutrinos in a spherical model of a cluster of galaxies, for several neutrino mass schemes and cluster masses. Relic neutrinos add a small perturbation to the mass profile, making it more extended in the outer parts. In principle, this non-linear neutrino perturbation is detectable in an all-sky weak lensing survey such as EUCLID by averaging the shear profile of a large fraction of the visible massive clusters in the universe, or from its signature in the general weak lensing power spectrum or its cross-spectrum with galaxies. However, correctly modeling the distribution of mass in baryons and cold dark matter and suppressing any systematic errors to the accuracy required for detecting this neutrino perturbation is severely challenging.","abx":0,"nw":0,"d":"2011-04-25","dq":0,"y":2011,"au":[633,926,350,1780],"c":28,"cs":0,"bib":"2011JCAP...06..027V","v":"","lk":"arXiv:1104.4770","url":"https://arxiv.org/abs/1104.4770","doi":"10.1088/1475-7516/2011/06/027","tg":{"s":["No simulations"],"d":["Large-scale structure","Massive neutrinos"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.6132,"yy":-0.5289,"p3":[-0.2619,-0.2189,-0.6079],"sim":{"k":"e","l":[[161,0.944],[216,0.938],[185,0.934],[214,0.931],[157,0.929]]},"c3":[-115.89,34.02,-186.67],"c2":[-253.66,-70.8],"k":3,"r":[],"rm":0},{"id":"1101.1903","t":"Signatures of photon and axion-like particle mixing in the gamma-ray burst jet","ab":"Photons couple to Axion-Like Particles (ALPs) or more generally to any pseudo Nambu-Goldstone boson in the presence of an external electromagnetic field. Mixing between photons and ALPs in the strong magnetic field of a Gamma-Ray Burst (GRB) jet during the prompt emission phase can leave observable imprints on the gamma-ray polarization and spectrum. Mixing in the intergalactic medium is not expected to modify these signatures for ALP mass > 10^(-14) eV and/or for < nG magnetic field. We show that the depletion of photons due to conversion to ALPs changes the linear degree of polarization from the values predicted by the synchrotron model of gamma ray emission. We also show that when the magnetic field orientation in the propagation region is perpendicular to the field orientation in the production region, the observed synchrotron spectrum becomes steeper than the theoretical prediction and as detected in a sizable fraction of GRB sample. Detection of the correlated polarization and spectral signatures from these steep-spectrum GRBs by gamma-ray polarimeters can be a very powerful probe to discover ALPs. Measurement of gamma-ray polarization from GRBs in general, with high statistics, can also be useful to search for ALPs.","abx":0,"nw":0,"d":"2011-01-10","dq":0,"y":2011,"au":[1354,1665,633],"c":28,"cs":0,"bib":"2011JCAP...02..030M","v":"","lk":"arXiv:1101.1903","url":"https://arxiv.org/abs/1101.1903","doi":"10.1088/1475-7516/2011/02/030","tg":{"s":["No simulations"],"d":["Dark matter & modified gravity"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.7707,"yy":-0.5453,"p3":[-0.1932,-0.3752,-0.5555],"sim":{"k":"e","l":[[131,0.902],[216,0.896],[164,0.89],[49,0.889],[83,0.887]]},"c3":[67.76,-262.66,-93.91],"c2":[-11.43,-304.21],"k":3,"r":[],"rm":0},{"id":"1010.3008","t":"Cores and Cusps in Warm Dark Matter Halos","ab":"The apparent presence of large core radii in Low Surface Brightness galaxies has been claimed as evidence in favor of warm dark matter. Here we show that WDM halos do not have cores that are large fractions of the halo size: typically, r_core/r_200 < 0.001. This suggests an astrophysical origin for the large cores observed in these galaxies, as has been argued by other authors.","abx":0,"nw":0,"d":"2010-10-14","dq":0,"y":2010,"au":[633,1319],"c":74,"cs":0,"bib":"2011JCAP...03..024V","v":"","lk":"arXiv:1010.3008","url":"https://arxiv.org/abs/1010.3008","doi":"10.1088/1475-7516/2011/03/024","tg":{"s":["Other simulations"],"d":["Dark matter & modified gravity"],"m":["No ML"],"u":["Other simulations"]},"x":0.4307,"yy":-0.6131,"p3":[-0.4498,-0.184,-0.5258],"sim":{"k":"e","l"     let key = (first.normalize('NFKD').replace(/[^A-Za-z]/g, '') || 'anon') + p.y + word.toLowerCase(), k = key, n = 1;
    while (used.has(k)) k = key + String.fromCharCode(96 + n++);

  const rows = list.map(p => [p.t, p.au.map(a => AU[a].name).join('; '), p.y, p.d, TOP[p.k], p.tg ? p.tg.s.join('; ') : '', p.tg ? p.tg.d.join('; ') : '',

  if (!PLAY.on) return;
  PLAY.on = false; clearTimeout(PLAY.timer); PLAY.upto = null; PLAY.flash = null;
  $('play').setAttribute('aria-pressed', 'false'); $('play').textContent = '▶'; $('play').title = 'Play the history: papers appear one by one in date order'; $('playyear').hidden = true;
  refresh();
}
function startPlay() {
  if (FLAT[S.view]) setView('topics', false);
  PLAY.on = true;
  $('play').setAttribute('aria-pressed', 'true'); $('play').textContent = '■'; $('play').title = 'Stop';
  // only the papers that pass the current filters take part, in date order
  PLAY.upto = Infinity; applyFilters();
  const seq = playOrder.filter(p => pOn[p.i]);
  PLAY.upto = -1;
  const dt = Math.max(40, Math.min(250, PLAY.total / Math.max(1, seq.length)));
  let i = 0;
  const step = () => {
    if (!PLAY.on) return;
    if (i >= seq.length) { PLAY.flash = null; draw(); PLAY.timer = setTimeout(() => stopPlay(), 1500); return; }
    const p = seq[i];
    PLAY.upto = p.rank; PLAY.flash = p.i; refresh();
    const k = sortKey(p), py = $('playyear');
    py.innerHTML = `${p.d.length >= 7 ? MON[+k.slice(5, 7) - 1] + ' ' : ''}${k.slice(0, 4)}<small>${i + 1} of ${seq.length} papers</small>`;
    py.hidden = false;
    i++; PLAY.timer = setTimeout(step, dt);
  };
  step();
}
$('play').addEventListener('click', e => { e.stopPropagation(); if (!PLAY.on) track('atlas_play', { view: S.view }); PLAY.on ? stopPlay() : startPlay(); });
// The animation plays the papers that passed the filters when it started, so any change to the filters
// (search, years, topics, tags, New, the active-filter chips, Clear filters) stops it, as does a click on
// the map. Capture phase: it stops before the control's own handler refreshes the page.
cv.addEventListener('pointerdown', () => stopPlay());
document.addEventListener('input', e => { if (e.target.closest('#q, #fpanel')) stopPlay(); }, true);
document.addEventListener('change', e => { if (e.target.closest('#y0, #y1, #fpanel')) stopPlay(); }, true);
document.addEventListener('click', e => { if (e.target.closest('#fpanel, #active, #reset')) stopPlay(); }, true);

// ---------- usage events for Google Analytics (public site only; no-op when gtag is absent) ----------
const track = (name, params) => { try { if (window.gtag) window.gtag('event', name, params || {}); } catch (e) {} };

// ---------- shareable links ----------
// On the public site the address holds the view, the selected paper/author, the filters and 2D/3D,
// e.g. #citations&paper=2201.02202&years=2022-2024.
let applying = false, viewInit = false;
function stateHash() {
  const q = new URLSearchParams();
  if (S.sel) { if (S.sel.kind === 'p') q.set('paper', P[S.sel.i].id); else q.set('author', AU[S.sel.i].name); }
  if (S.q.trim()) q.set('q', S.q.trim());
  if (S.y0 !== years[0] || S.y1 !== years[years.length - 1]) q.set('years', S.y0 + '-' + S.y1);
  if (S.on.size !== TOP.length) q.set('topics', [...S.on].sort((a, b) => a - b).join('.'));
  if (S.tag.s) q.set('suite', S.tag.s);
  if (S.tag.d) q.set('data', S.tag.d);
  if (S.tag.m) q.set('method', S.tag.m);
  if (S.dim === 3) q.set('dim', '3');
  if (!S.selfc) q.set('self', '0');
  if (S.newOnly) q.set('new', '1');
  if (S.colorBy !== 'topic') q.set('color', S.colorBy);
  const s = q.toString();
  return '#' + S.view + (s ? '&' + s : '');
}
function writeHash(push) {   // push: add a history entry (selections), else replace (filters, view)
  if (applying || PLAY.on) return;
  const h = stateHash();
  if (location.hash === h) return;
  try { if (push) history.pushState(null, '', h); else history.replaceState(null, '', h); lastHash = location.hash; } catch (e) {}
}
function applyHash() {
  lastHash = location.hash;
  stopPlay();   // another shared link, or Back/Forward
  const amp = location.hash.indexOf('&');
  const raw = amp < 0 ? location.hash.slice(1) : location.hash.slice(1, amp);
  const v = VIEWS.includes(raw) ? raw : 'topics';
  const q = new URLSearchParams(amp < 0 ? '' : location.hash.slice(amp + 1));
  applying = true;
  try {
    {
      S.q = q.get('q') || ''; $('q').value = S.q;
      const yr = (q.get('years') || '').split('-').map(Number);
      S.y0 = years.includes(yr[0]) ? yr[0] : years[0];
      S.y1 = years.includes(yr[1]) ? yr[1] : years[years.length - 1];
      if (S.y0 > S.y1) [S.y0, S.y1] = [S.y1, S.y0];   // years=2025-2020 means 2020-2025
      $('y0').value = S.y0; $('y1').value = S.y1;
      S.newOnly = q.get('new') === '1';
      S.colorBy = ['year', 'method', 'suite'].includes(q.get('color')) ? q.get('color') : 'topic'; $('colorby').value = S.colorBy; dispSum();
      S.on = q.get('topics') ? new Set(q.get('topics').split('.').map(Number).filter(k => k >= 0 && k < TOP.length)) : new Set(TOP.map((_, k) => k));
      renderLegend();
      [['suite', 's'], ['data', 'd'], ['method', 'm']].forEach(([a, ax]) => {
        const sel = $('f-' + a); sel.value = q.get(a) || ''; S.tag[ax] = sel.value;   // unknown values fall back to "All"
      });
      const sc = q.get('self') !== '0';
      if (sc !== S.selfc) { $('selfc').checked = sc; $('selfc').dispatchEvent(new Event('change')); }
      setDim(q.get('dim') === '3' ? 3 : 2);
    }
    if (!viewInit || v !== S.view) { viewInit = true; setView(v, false); }
    applyFilters(); updateStats(); renderActive();
    let sel = null;
    if (q.get('paper')) { const p = P.find(x => x.id === q.get('paper')); if (p) sel = { kind: 'p', i: p.i }; }
    if (q.get('author')) { const a = AU.find(x => x.name === q.get('author')); if (a) sel = { kind: 'a', i: a.i }; }
    select(sel);
    if (S.view === 'table') renderTable();
    if (S.view === 'trends') renderTrends();
    if (!S.sel) overview();
    draw();
  } finally { applying = false; }
}

// ---------- boot ----------
renderLegend(); applyFilters(); renderPanel();
new ResizeObserver(() => { resize(); if (!userMoved) fit(false); if (S.view === 'trends') renderTrends(); }).observe(stage);
const mq = matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
applyHash(); dispSum();
document.fonts && document.fonts.ready.then(draw);
})();
</script>
