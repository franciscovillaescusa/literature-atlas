<style>
/* Layout: one working screen — header + toolbar on top, canvas map left, detail panel right (stacks below on phones). */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --t0: #855900; --t1: #7fa150; --t2: #e359a8; --t3: #a473f7; --t4: #c72b3f; --t5: #058057; --t6: #2566b8; --t7: #9d309d; --t8: #209dc3; --t9: #e56c03; --t10: #7b808a; --seq0: #1c5cab; --seq1: #cde2fb; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --ink: #eef0f4; --ink-2: #b6bcc8; --muted: #858c99;
  --line: #2a303b; --edge: rgba(238,240,244,0.12); --edge-hi: #eef0f4; --accent: #3987e5; --wash: rgba(57,135,229,0.14);
  --t0: #855900; --t1: #7fa150; --t2: #e359a8; --t3: #a473f7; --t4: #c72b3f; --t5: #058057; --t6: #2566b8; --t7: #9d309d; --t8: #209dc3; --t9: #e56c03; --t10: #7b808a; --seq0: #1c5cab; --seq1: #cde2fb; color-scheme: dark; }

html, body { height: 100%; }

[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.newb { display: inline-block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--surface); background: var(--accent); border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: 1px; }

  display: inline-flex; align-items: center; gap: 8px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

.search { flex: 1 1 220px; max-width: 320px; position: relative; }

.toolbar select { max-width: 175px; }
#fbtn { white-space: nowrap; }

  border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; }

  box-shadow: 0 8px 24px rgba(0,0,0,.08); }
.frow { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.frow select { max-width: 220px; }
.ftitle { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.ftitle span { text-transform: none; letter-spacing: 0; font-weight: 400; }
#dlwrap { position: relative; flex: none; }
#reset { margin-left: auto; }
body.nofilter #reset { display: none; }   /* "Clear filters" only when a filter or search is active */
.dlmenu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; display: flex; flex-direction: column; min-width: 170px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; }
.dlmenu button { all: unset; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); cursor: pointer; }
.dlmenu button:hover, .dlmenu button:focus-visible { background: var(--wash); }
.mapopts { position: absolute; left: 10px; bottom: 32px; z-index: 2; display: flex; flex-direction: column; gap: 4px; }   /* above the note */
@media (max-width: 600px) { .mapopts { bottom: 46px; } }   /* the note wraps to two lines */
.playbtn { padding: 5px 0; width: 32px; text-align: center; font-size: 12px; }
.playbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.playyear { position: absolute; right: 64px; bottom: 26px; font-family: var(--f-display); font-size: 48px; font-weight: 700; text-align: right;
  color: var(--ink); opacity: .22; pointer-events: none; font-variant-numeric: tabular-nums; line-height: 1; }
.playyear small { display: block; font-family: var(--f-body); font-size: 13px; font-weight: 600; margin-top: 6px; }
.mapopts select { font-size: 12px; padding: 1px 4px; margin-left: 4px; border-radius: 6px; }
.cbkey { background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  font-size: 11.5px; color: var(--ink-2); display: grid; gap: 3px; max-width: 230px; }
.cbkey .row { display: flex; align-items: center; gap: 6px; }
.cbkey i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.cbkey .ramp { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--seq0), var(--seq1)); }
.cbkey .ends { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.cbkey .hint { color: var(--muted); }
.cbkey .keyhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; color: var(--ink); }
.cbkey .keytoggle { border: 0; background: none; color: var(--muted); font: inherit; padding: 0 2px; cursor: pointer; line-height: 1; }
.cbkey .keytoggle:hover, .cbkey .keytoggle:focus-visible { color: var(--ink); }
.cbkey.closed { padding: 3px 9px; }
.mapopts .chk { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12.5px; }
.tablewrap { position: absolute; inset: 44px 0 0 0; overflow: auto; }
.tablebar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 12px; border-bottom: 1px solid var(--line); z-index: 2; background: var(--surface); }
.tcap { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.trendswrap { position: absolute; inset: 0; overflow: auto; padding: 16px 20px; }
.trhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.trhead .dimtoggle { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
.trhead .dimtoggle button { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; }
.trhead .dimtoggle button:not([aria-pressed="true"]):hover { background: var(--wash); color: var(--ink); }
.trhead h3 { margin: 0; font-family: var(--f-display); font-size: 16px; }
.trendswrap .tgrid { stroke: var(--line); stroke-width: 1; }
.trendswrap .tax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.trendswrap .ttot { fill: var(--ink-2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.trendswrap .tseg { cursor: pointer; stroke: var(--surface); stroke-width: 1; }
.trendswrap .tseg:hover { opacity: .8; }
.trendswrap .tseg.partial { opacity: .55; }   /* the current year, not over yet */
.trendswrap .tseg.partial:hover { opacity: .45; }
.trbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.tlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.tleg { display: inline-flex; align-items: center; gap: 6px; }
.tleg i { width: 10px; height: 10px; border-radius: 3px; }
.tleg .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.tnote { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ptable th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; font-size: 12px;
  color: var(--ink-2); border-bottom: 1px solid var(--line); padding: 0; z-index: 1; white-space: nowrap; }
.ptable th button { all: unset; display: block; padding: 9px 10px; cursor: pointer; }

.ptable th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 9px; }
.ptable th[aria-sort="descending"] button::after { content: " ▼"; font-size: 9px; }
.ptable td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ptable td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ptable td.tt { min-width: 280px; color: var(--ink); line-height: 1.35; }
.ptable td.sm { color: var(--ink-2); font-size: 12px; }
.ptable td.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 145px; }
@media (max-width: 1360px) { .ptable td.tt { min-width: 200px; } .ptable td.one { max-width: 120px; } .ptable td.tp { min-width: 125px; } .ptable td.mt { min-width: 182px; max-width: 190px; } .ptable td.tt { min-width: 180px; } }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:nth-child(even) { background: color-mix(in srgb, var(--ink) 4%, transparent); }   /* zebra; hover/selection below win */
.ptable td.tp { min-width: 150px; max-width: 170px; line-height: 1.3; }
.ptable td.mt { min-width: 190px; max-width: 215px; line-height: 1.2; }
.mtag { display: inline-block; margin: 1px 4px 2px 0; padding: 0 6px; border: 1px solid var(--line); border-radius: 9px;
  font-size: 11px; line-height: 15px; padding-top: 1px; padding-bottom: 1px; color: var(--ink-2); background: var(--surface); }   /* long names wrap inside the tag */
.ptable tbody tr:hover { background: var(--wash); }
.ptable tbody tr[aria-selected="true"] { background: var(--wash); box-shadow: inset 3px 0 0 var(--accent); }
.ptable tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ptable i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.tagrow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; align-items: baseline; margin-bottom: 4px; }
.tagax { font-size: 12px; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: 12px; color: var(--ink); background: var(--wash); }
.tag.unsure { background: transparent; border-style: dashed; color: var(--ink-2); }
.tagnote { font-size: 12px; margin-top: 4px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.ghost { border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 12px; color: var(--ink); }
.chip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip[aria-pressed="false"] { color: var(--muted); }
.chip[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; position: relative; }
/* the side panel can be collapsed on wide screens: a small tab on the edge between map and panel */
.paneltab { position: absolute; top: 50%; right: 366px; transform: translate(50%, -50%); z-index: 3; width: 20px; height: 46px; padding: 0;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); font-size: 15px; line-height: 1; cursor: pointer; }
.paneltab:hover, .paneltab:focus-visible { color: var(--ink); border-color: var(--ink-2); }
body.nopanel main { grid-template-columns: minmax(0, 1fr) 0; gap: 0; }
body.nopanel aside { display: none; }
body.nopanel .paneltab { right: 0; transform: translate(0, -50%); border-radius: 8px 0 0 8px; border-right: 0; }
.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 420px; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
canvas.hovering { cursor: pointer; }
.stage-note { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none;
  background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 2px 6px; border-radius: 6px; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 2; }
.zoom button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); }
.zoom button svg { width: 16px; height: 16px; }
.zoom button:hover { color: var(--ink); background: var(--wash); }
.dispwrap { position: relative; }
.dispbtn { display: inline-flex !important; align-items: center; gap: 4px; width: auto !important; height: 30px !important; padding: 0 10px !important; font-size: 12.5px; font-weight: 500; color: var(--ink) !important;
  background: var(--surface) !important; border: 1px solid var(--line) !important; border-radius: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.05); white-space: nowrap; }
.dispbtn span { color: var(--muted); font-weight: 400; }
.dispmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; min-width: 230px; display: grid; gap: 10px; padding: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.drow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--ink-2); }
.drow select { font-size: 12.5px; padding: 3px 6px; border-radius: 6px; }
.chkrow { justify-content: flex-start; gap: 7px; cursor: pointer; }
.drow .ghost { width: auto; height: auto; padding: 3px 10px; font-size: 12px; }
.zgroup, .dimtoggle, #zspin { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.05); overflow: hidden; }
.zgroup { display: flex; flex-direction: column; }
.zgroup button + button { border-top: 1px solid var(--line); }
.dimtoggle { display: flex; padding: 2px; gap: 2px; }
.dimtoggle button { width: auto; height: 26px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 600; }
.dimtoggle button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tip { position: absolute; pointer-events: none; max-width: 300px; background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 8px;
  font-size: 12.5px; line-height: 1.35; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.tip small { display: block; opacity: .75; margin-top: 3px; font-variant-numeric: tabular-nums; }

aside { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; min-width: 0; padding: 18px 18px 22px;
  display: flex; flex-direction: column; gap: 14px; }
aside h2 { font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.3; margin: 0; text-wrap: balance; }
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
aside p { margin: 0; color: var(--ink-2); }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.eyebrow i { width: 10px; height: 10px; border-radius: 50%; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meta a, .mono { font-family: var(--f-mono); font-size: 12.5px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
.abstract { font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.names { display: flex; flex-wrap: wrap; gap: 4px; }
.names button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 7px; font-size: 12.5px; cursor: pointer; color: var(--ink); }
.names button:hover { background: var(--wash); border-color: var(--accent); }
.names button.more { border-style: dashed; color: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list button { width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 6px; border-radius: 6px; cursor: pointer;
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 9px; align-items: baseline; }
.list button:hover { background: var(--wash); }
.list i { width: 8px; height: 8px; border-radius: 50%; transform: translateY(-1px); }
.list .tt { font-size: 13px; color: var(--ink); line-height: 1.35; }
.list .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.back { align-self: flex-start; }
.howto summary { list-style: none; cursor: pointer; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.howto summary::-webkit-details-marker { display: none; }
.howto summary .more { color: var(--accent); font-size: 12px; white-space: nowrap; }
.howto summary:hover .more { text-decoration: underline; }
.howto[open] summary .more { color: var(--muted); }
.howto > p { margin: 10px 0 8px; font-size: 13px; }
.how { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.how div { display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
.how b { color: var(--ink); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.bars { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
footer { font-size: 12px; color: var(--muted); }

@media (max-width: 880px) {
  .paneltab { display: none; }   /* the panel is below the map here */
  body.nopanel main { grid-template-columns: minmax(0, 1fr); gap: 12px; } body.nopanel aside { display: block; }
  body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 380px; }
  aside { overflow: visible; }
  .modes button span { display: none; }
  .modes button { padding: 8px 12px; }
  .legend { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chip { flex: none; }
  .tapcard:not([hidden]) { display: flex; }
}
@media (max-width: 600px) {
  /* phones: compact header, a tall map, and the table as cards */
  .tagline { display: none; }
  .stage { height: 78vh; height: 78svh; min-height: 420px; }
  .ptable, .ptable tbody { display: block; }
  .ptable thead tr { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .ptable th { position: static; border: 0; padding: 0; background: none; }
  .ptable th button { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; }
  .ptable th:nth-child(5), .ptable th:nth-child(7), .ptable td:nth-child(5), .ptable td:nth-child(7) { display: none; }
  .ptable tbody tr { display: flex; flex-wrap: wrap; align-items: baseline; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .ptable td { border: 0; padding: 0; min-width: 0; max-width: none; text-align: left; }
  .ptable td.tt { flex: 0 0 100%; min-width: 0; margin-bottom: 3px; }
  .ptable td:nth-child(n+2) { font-size: 12px; color: var(--ink-2); }
  .ptable td:nth-child(2) { order: 1; max-width: 48%; }        /* first author · year · citations · topic */
  .ptable td:nth-child(3) { order: 2; } .ptable td:nth-child(6) { order: 3; }
  .ptable td:nth-child(4) { order: 4; flex: 0 0 100%; margin-top: 2px; }   /* the topic on its own line */
  .ptable td:nth-child(3)::before, .ptable td:nth-child(6)::before { content: "·"; margin: 0 6px; color: var(--muted); }
  .ptable td:nth-child(6)::after { content: " citations"; }
  .field label[for^="f-"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .frow .field { flex: 1 1 100%; } .frow select { width: 100%; max-width: none; }
  .search { flex-basis: 100%; max-width: none; }
}
@media (pointer: coarse) {
  .zoom button { width: 40px; height: 40px; }
  .chip, .ghost, .names button { min-height: 34px; }
}
.tapcard { display: none; position: absolute; left: 10px; right: 10px; bottom: 10px; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.tapcard .tt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; color: var(--ink); overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tapcard button { flex: none; }
@media (min-width: 881px) { .modes button span.short { display: none; } }

 Busillo","V. Capobianco","V. Conforti","V. Cuozzo","V. Desjacques","V. Duret","V. F. Cardone","V. Gautard","V. Kansal","V. Laurent","V. Le Brun","V. Lindholm","V. Mehta","V. Pettorino","V. Popa","V. Scottez","V. Testa","V. Yankelevich","Valentina La Torre","Vasiliy Demchenko","Veronica Biffi","Vicent Quilis","Vicente Rodriguez-Gomez","Victoria Ono","Vid Irsic","Vidya Manian","Vincenzo Salzano","Violeta Gonzalez-Perez","Viviana Acquaviva","Volker Springel","Vuk Mandic","W. Bon","W. Elbers","W. G. Hartley","W. Gillard","W. Holmes","W. J. Percival","W. J. Vriend","W. Roster","W. d'Assignies Doumerg","Wei Liu","Wei Zhang","Wen-Han Zhou","Wenjuan Fang","Wentao Luo","Wessel Valkenburg","William J. Roper","William R. Coulton","William Tyndall","X. Dupac","X. Lopez Lopez","Xavier Sims","Xiaowei Ou","Xiaowen Zhang","Xinyue Zhang","Xuejian Shen","Xuelei Chen","Xueqing Xu","Y. Charles","Y. Copin","Y. Deville","Y. Fang","Y. Fu","Y. Jimenez-Teja","Y. Kang","Y. Matsuoka","Y. Mellier","Y. Rasera","Y. Revaz","Y. Toba","Y. Wang","Yan-Chuan Cai","Yan-Fei Jiang","Yang Wang","Yannis Kevrekidis","Yaroslava G. Yingling","Yashar Akrami","Yashar Hezaveh","Yi-Fu Cai","Yidong Xu","Yin Li","Yin-Zhe Ma","Yongmin Liu","Yongseok Jo","Yossi Yovel","Yu Feng","Yuan-Sen Ting","Yuanyuan Zhang","Yueqiu Sun","Yueying Ni","Yun Wang","Yun-Ting Cheng","Yuri Oku","Z. Ghaffari","Z. Sakr","Zachary Lubberts","Zachary Slepian","Zeeshan Ahmed","Zhengxuan Wu","Zhuoran Yang","Zora Zhiruo Wang","Á. de la Cruz-Dombriz","Ákos Bogdán","Ángel Chandro-Gómez","Íñigo Zubeldia"],"papers":[{"id":"2611.17052","t":"Auditing AI peer reviewers: a benchmark on real scientific papers","ab":"LLM-based peer review is now used at production scale, but its evaluation remains limited. We introduce a benchmark that injects objective, localisable errors of four types (general issues, mathematics, numerics, citations) at three severity levels into real papers and measures each reviewer's detection rate by error type and severity, together with its false-positive rate on clean copies. We also present Skepthical, a multi-agent reviewer that verifies citation-backed claims by retrieving the cited papers, mathematics with computer algebra, and numerical claims with executed code. We apply the benchmark to two corpora of 15 recent arXiv preprints each, one in astrophysics and one in machine learning (ML), injecting a total of 357 errors, and evaluate twelve reviewer systems: six single-LLM reviewers, two Claude Code configurations, three publicly available reviewers, and Skepthical. The choice of model has the largest impact on detection rate: given the same prompt, three frontier LLMs differ by about 50 percentage points in total detection on both corpora. Tools and scaffolding help when they contribute what the model cannot supply on its own. In particular, on astrophysics, Claude Code improves on a single Claude call in mathematics and numerics detection, and enforced citation retrieval gives Skepthical the highest citation error detection rate of all systems by a large margin. This citation lead, however, is not observed on ML, where the models appear to know the literature better and Skepthical's citation detection rate is statistically indistinguishable from that of the best single LLM. False-positive rates are below 10% for most systems, but vary with prompt, model, and scaffolding, with mathematics flags the main source of false positives. The evaluation pipeline, the injected errors, and the adjudication logs are released as a benchmark.","abx":0,"nw":0,"d":"2026-11-12","dq":0,"y":2026,"au":[1863,267,633,1434,1280],"c":0,"cs":0,"bib":"2026arXiv261117052Z","v":"","lk":"arXiv:2611.17052","url":"https://arxiv.org/abs/2611.17052","doi":"","tg":{"s":["No simulations"],"d":["AI for science"],"m":["LLM agents"],"u":[]},"x":0.4105,"yy":0.9748,"p3":[0.4226,-0.4996,0.5774],"sim":{"k":"e","l":[[24,0.933],[9,0.924],[33,0.917],[31,0.907],[5,0.906]]},"c3":[-63.39,-98.91,72.56],"c2":[18.31,-109.7],"k":0,"r":[24,33],"rm":0},{"id":"2610.40617","t":"Field-level inference under pressure: the information content of the thermal Sunyaev-Zel'dovich field","ab":"The thermal Sunyaev--Zel'dovich (tSZ) field is highly non-Gaussian and contains cosmological information that cannot be fully captured by its angular power spectrum. In this work, we investigate the information content of this field using a convolutional neural network (CNN), and compare to simple and interpretable summary statistics, in a simulation-based inference (SBI) framework. We perform the first field-level analysis of the tSZ field, using a suite of $10{,}000$ simulated Compton-$y$ maps, where we jointly vary the cosmological parameters $Ω_c$ and $σ_8$ (the density fraction for cold dark matter and the matter clustering amplitude, respectively) and two parameters describing the amplitude and shape of the electron pressure profile, $P_0$ and $β$, that aim to capture astrophysical uncertainties. We consider both noiseless simulations and simulations including realistic Simons Observatory (SO) noise after component separation. We use SBI to compare the constraints obtained from the CNN with those from the three Minkowski functionals (MFs), individually and in combination, as well as the angular power spectrum. This is the first application of SBI to the MFs of the tSZ field. We find that the CNN provides tighter constraints than conventional summary statistics in the noiseless case. However, at SO-like noise levels, the combination of MFs and the power spectrum recovers constraints comparable to those obtained with the CNN. Our results highlight the potential of these interpretable summary statistics, as well as field-level inference, for extracting information from the tSZ field, motivating efforts toward their application to real data.","abx":0,"nw":0,"d":"2026-10-29","dq":0,"y":2026,"au":[352,134,1806,154,633,263,190,820,1325],"c":0,"cs":0,"bib":"2026arXiv261040617E","v":"","lk":"arXiv:2610.40617","url":"https://arxiv.org/abs/2610.40617","doi":"","tg":{"s":["Other simulations"],"d":["CMB & SZ"],"m":["CNN","Simulation-based inference"],"u":["Other simulations"]},"x":0.1028,"yy":-0.1796,"p3":[-0.1077,-0.297,0.1692],"sim":{"k":"e","l":[[99,0.937],[13,0.937],[38,0.936],[41,0.935],[139,0.935]]},"c3":[-136.03,35.48,128.05],"c2":[13.59,115.98],"k":6,"r":[36,38,108],"rm":0},{"id":"2610.23825","t":"ENFR: Evidence Networks with Flow-Matched References for Amortized Simulation-Based Model Inference","ab":"The evidence, $\\mathcal{Z} = p(x | \\mathcal{M})$, of a data-generating model $\\mathcal{M}$ is a powerful tool in Bayesian frameworks: it enables model inference, model misspecification tests, and goodness-of-fit assessment as an alternative to standard discrepancy statistics, e.g. $χ^2$. While versatile, the evidence is notoriously difficult to compute, even when the likelihood is available. In both likelihood-based and simulation-based inference, estimating $\\mathcal{Z}$ provides an immediate solution to high-dimensional goodness-of-fit or model misspecification tests: using $\\mathcal{Z}(x)$ as the test statistic induces a minimum-volume level-$α$ test. Such tests are essential to assess model fidelity, which is necessary to trust simulation-based parameter inference. Existing learned approaches largely target Bayes factors, which only measure evidence ratios. Instead, we provide accurate, fast, and amortized estimates of the absolute evidence. We present ENFR: Evidence Networks with Flow-matched References. Building on the Evidence Network framework of Jeffrey & Wandelt (2024), the proposed method first learns Bayes factors with respect to a flow-matched reference, from which the absolute evidence is recovered. We show improvement in estimation of $\\mathcal{Z}$ over the flow-based baseline in all applications considered and the best performance of all density estimation methods considered in our benchmarks. We furthermore introduce and provide the proof for an architecture that jointly learns the individual evidences of a set of models $\\{\\mathcal{M}_i\\}$. We demonstrate the performance and scaling behavior of these approaches on data from a variety of scientific applications.","abx":0,"nw":0,"d":"2026-10-16","dq":0,"y":2026,"au":[977,893,354,1323,251,633,1689,883],"c":0,"cs":0,"bib":"2026arXiv261023825L","v":"","lk":"arXiv:2610.23825","url":"https://arxiv.org/abs/2610.23825","doi":"","tg":{"s":["Other simulations"],"d":["Large-scale structure"],"m":["Simulation-based inference","Normalizing flows"],"u":["Other simulations","Large-scale structure","Normalizing flows"],"n":"generic SBI method paper; applications/simulations not specified"},"x":-0.1761,"yy":0.1602,"p3":[0.0556,-0.2172,0.3585],"sim":{"k":"e","l":[[90,0.899],[36,0.897],[98,0.893],[45,0.893],[122,0.892]]},"c3":[-51.18,-30.36,55.34],"c2":[6.22,-30.87],"k":7,"r":[141,158],"rm":0},{"id":"2610.06710","t":"AI-assisted super-resolution cosmological simulations V: Cosmology-aware super-resolution","ab":"We present a cosmology-aware generative model for super-resolution (SR) of cosmological $N$-body simulations in particle phase space. The model jointly generates displacements and velocities, conditioning a generative adversarial network (GAN) based generator and discriminator on evolved low-resolution (LR) fields and five $Λ$CDM parameters $(Ω_m,Ω_b,h,n_s,σ_8)$. We train a single model on 100 matched low-high resolution pairs from the Quijote Latin-hypercube suite at $z = 0$, mapping $512^3$ to $1024^3$ particles in $1\\,h^{-1}\\,\\mathrm{Gpc}$ boxes. On ten cosmologies excluded from SR training, the model reproduces the broad matter distribution and the cosmological variation of clustering and halo abundances. Over $0.1<k<3\\,h\\,\\mathrm{Mpc}^{-1}$, the mean of the per-cosmology maximum absolute power-spectrum errors is $3.6\\%$, while FoF halo abundances agree with HR to within $15\\%$ in the analyzed mass bins below $10^{14.8}\\,h^{-1}M_\\odot$. Satellite abundances and occupations retain larger, mass-dependent discrepancies. Corrections measured at one near-fiducial cosmology reduce a shared component of these systematic errors when applied to the other nine test cosmologies. A power spectrum based inference test also shows that calibration reduces the mean shifts in all parameters. These results extend our SR model across cosmologies and provide 6D phase space realizations for subsequent studies of non-linear structure and field-level cosmological inference.","abx":0,"nw":0,"d":"2026-10-05","dq":0,"y":2026,"au":[1812,1437,1537,1735,633],"c":0,"cs":0,"bib":"2026arXiv261006710Z","v":"","lk":"arXiv:2610.06710","url":"https://arxiv.org/abs/2610.06710","doi":"","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Generative models"],"u":[]},"x":-0.4286,"yy":0.0726,"p3":[0.4365,0.0247,0.172],"sim":{"k":"e","l":[[162,0.949],[69,0.941],[89,0.933],[102,0.933],[122,0.933]]},"c3":[-58.24,-87.83,37.45],"c2":[-17.75,-86.16],"k":6,"r":[102,112,141,151,158],"rm":0},{"id":"2610.00492","t":"EurekaBench: Measuring Agentic Ability to Discover New Scientific Insights","ab":"When Isaac Newton discovered the law of gravitation, he did so through an iterative process of analyzing observed data such as planetary patterns, finding the underlying mechanisms by describing patterns in mathematical equations, and refining his theory against the Moon's orbit, revealing the startling insight that the same force governs both falling apples and orbiting planets. Would it be possible for AI agents to make similar discoveries? To measure this ability, we introduce EurekaBench, a cross-domain benchmark that tests AI agents' ability to conduct long-horizon experiments and discover mechanisms that explain observations. We evaluate these mechanisms by the scientific insights that can be derived from them. EurekaBench contains an expert-verified set of 26 long-horizon tasks across neuroscience, computer science, chemistry, astrophysics, geophysics, and plasma physics, with a total of 306 scientific insights that the discovered mechanisms are expected to support. Our evaluation framework tests three axes of scientific discovery: agents' ability to follow known scientific constraints, the predictive accuracy of the discovered mechanisms, and whether these mechanisms yield scientific insights or inform future research. Our results show that current AI agents often overly fixate on predictive accuracy optimization, surpassing human scientists, while falling substantially short in deriving scientific insights.","abx":0,"nw":0,"d":"2026-09-30","dq":0,"y":2026,"au":[908,1857,992,1641,931,1859,257,1536,122,176,1353,633,369,757,711],"c":3,"cs":0,"bib":"2026arXiv261000492G","v":"","lk":"arXiv:2610.00492","url":"https://arxiv.org/abs/2610.00492","doi":"","tg":{"s":["No simulations"],"d":["AI for science"],"m":["LLM agents"],"u":[]},"x":0.4889,"yy":0.9323,"p3":[0.4212,-0.627,0.4593],"sim":{"k":"e","l":[[24,0.943],[28,0.935],[33,0.933],[31,0.924],[9,0.917]]},"c3":[52.37,-12.79,232.61],"c2":[233.21,-92.46],"k":0,"r":[14,16,19,23,27,64,141],"rm":0},{"id":"2609.30536","t":"FOTO: Figure-Level Semantic Search for Astronomy","ab":"Astronomy papers carry much of their content in figures, but literature search indexes text, so there is no way to find a plot by describing what it shows. We present FOTO, a figure-level search tool over 482,750 captions from 53,839 peer-reviewed astro-ph papers. Each figure is indexed once by its title and caption, embedded with a 110M-parameter open model that runs locally, and a large language model is applied only to the retrieved shortlist, where it verifies real figures rather than generating references to ones that do not exist. Held to the harder figure-level criterion, FOTO recovers the target for 29 to 79% of queries at recall 20 depending on register, against 6 to 20% for Pathfinder and 8 to 16% for Semantic Scholar on the easier paper-level criterion, and it beats the paid embedding API it replaced. Reranking the shortlist then raises recall at 1 from 0.667 to 0.875 on detailed queries and from 0.071 to 0.571 on vague ones. Openly available models match or beat paid LLM models for verification","abx":0,"nw":0,"d":"2026-09-24","dq":0,"y":2026,"au":[761,633],"c":0,"cs":0,"bib":"2026arXiv260930536T","v":"","lk":"arXiv:2609.30536","url":"https://arxiv.org/abs/2609.30536","doi":"","tg":{"s":["No simulations"],"d":["AI for science"],"m":["LLM agents","Other ML"],"u":["Other ML"]},"x":0.3429,"yy":0.9024,"p3":[0.4849,-0.2604,0.5057],"sim":{"k":"e","l":[[8,0.916],[34,0.912],[112,0.908],[0,0.906],[24,0.902]]},"c3":[159.73,-240.24,11.64],"c2":[123.19,-287.47],"k":0,"r":[],"rm":0},{"id":"2609.23982","t":"The CAMELS-CROCODILE Simulation Suite: A New Cosmology--Astrophysics Playground for Machine Learning","ab":"We present CAMELS-CROCODILE, a suite of cosmological hydrodynamic simulations that extends the CAMELS framework with the \\gadget{} smoothed particle hydrodynamics code and the Osaka feedback model. As a companion to the IllustrisTNG-based second-generation CAMELS suite, it provides an independent implementation of the baryonic physics that shapes galaxies, the intergalactic medium, and large-scale structure, broadening the range of subgrid models over which machine-learning (ML) inference can be marginalized and tested. The suite comprises $25$ and $50Mpc/h$ boxes organized into one-parameter, cosmic-variance, and Sobol-sequence sets that vary $26$ cosmological and astrophysical parameters around a fiducial Osaka model. We describe the simulation design and validate the suite against benchmarks and other CAMELS suites. Compared with IllustrisTNG, the fiducial model suppresses the matter power spectrum by only a few per cent, against up to ${\\sim}27\\%$ at $z=0$, and forms stars with similar efficiency below $10^{12.2} M_\\odot/h$ but up to $2.5$ times more efficiently in group-scale halos, both consistent with weaker AGN feedback. We also present the stellar and black hole bias and the Ly$α$ absorption around galaxies. As a first ML application, we apply a graph neural network trained on IllustrisTNG galaxy catalogs, with frozen weights, to CAMELS-CROCODILE. It fails to recover $Ω_{\\rm m}$ and $σ_8$ and returns overconfident posteriors, mainly for simulations containing more galaxies than any in its training set; within that range $Ω_{\\rm m}$ is recovered with an error only $1.5$ times the in-distribution value. These results underline the need to train and test ML inference across physically distinct galaxy formation models.","abx":0,"nw":0,"d":"2026-09-21","dq":0,"y":2026,"au":[989,1851,206,946,633,1651,444],"c":0,"cs":0,"bib":"2026arXiv260923982N","v":"","lk":"arXiv:2609.23982","url":"https://arxiv.org/abs/2609.23982","doi":"","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Graph neural networks","Simulation-based inference"],"u":["Simulation-based inference"]},"x":-0.1521,"yy":0.4133,"p3":[-0.0946,0.3078,0.476],"sim":{"k":"e","l":[[141,0.969],[87,0.963],[108,0.96],[118,0.96],[66,0.959]]},"c3":[-37.2,296.3,23.95],"c2":[-54.2,318.23],"k":7,"r":[],"rm":1},{"id":"2609.09504","t":"Inductive Biases in Field-Level Cosmological Inference from Galaxy Catalogs","ab":"We perform field-level likelihood-free inference of the matter density parameter $Ω_m$ from simulated galaxy catalogs using machine learning models with differing inductive biases. Using hydrodynamic simulations from CAMELS, we examine how observable choice and architecture govern cosmological information extraction. We consider galaxy positions and line-of-sight peculiar velocities, separately and jointly, and compare permutation-invariant Deep Sets, implemented with either multilayer perceptrons (MLPs) or Kolmogorov-Arnold Networks (KANs), to graph neural networks (GNNs), which explicitly encode spatial relations. We test in-distribution and out-of-distribution (OOD) performance across simulations with different subgrid galaxy-formation prescriptions. Deep Sets infer $Ω_m$ from velocities alone with mean relative errors of approximately $18\\%$ in-distribution and $\\sim25\\%$ OOD, with KANs and MLPs achieving comparable performance. In contrast, the same set-based approach does not yield useful $σ_8$ predictions in either in-distribution or cross-suite tests. Adding positions does not improve Deep Sets, while GNNs infer $Ω_m$ with mean relative errors of about $10\\%$ in-distribution and $10$--$17\\%$ OOD. These results indicate that peculiar velocities provide the dominant source of $Ω_m$ information for set-based models in this setting, while spatial information is most effectively used by architectures that explicitly encode galaxy-galaxy relations. Because the velocity inputs are exact simulated peculiar velocities, applications to survey data will require validation under realistic velocity-measurement noise, selection effects, and survey geometry.","abx":0,"nw":0,"d":"2026-09-08","dq":0,"y":2026,"au":[892,1651,633],"c":1,"cs":0,"bib":"2026ApJ..1010..203B","v":"Astrophysical Journal","lk":"arXiv:2609.09504","url":"https://arxiv.org/abs/2609.09504","doi":"10.3847/1538-4357/aea400","tg":{"s":["CAMELS"],"d":["Large-scale structure"],"m":["Graph neural networks","Simulation-based inference"],"u":[]},"x":-0.1788,"yy":0.2999,"p3":[-0.2339,-0.0468,0.6075],"sim":{"k":"e","l":[[75,0.962],[90,0.96],[108,0.96],[6,0.954],[18,0.951]]},"c3":[-52.71,63.56,61.3],"c2":[2.3,9.25],"k":7,"r":[13,61,87,90,108,109,118,123,132,141,158,161],"rm":0},{"id":"2606.30855","t":"Deep Learning for Astrophysics: An Open Textbook from the NASA Cosmic Origins AI/ML Science and Technology Interest Group","ab":"Recent community assessments identify education as a principal barrier to adopting modern machine learning in astronomy. We present Deep Learning for Astrophysics, a freely available textbook at https://deeplearning4astro.com, curated from the NASA Cosmic Origins Artificial Intelligence and Machine Learning Science and Technology Interest Group (AI/ML STIG) lecture series. The book collects 23 chapters by 17 lecturers across six parts, moving from computational foundations and deep-learning architectures through generative modeling, simulation-based inference, reinforcement learning, and large-language-model agents to the practice of AI-laden science. Many include executable notebooks using astronomical data.","abx":0,"nw":0,"d":"2026-06-29","dq":0,"y":2026,"au":[1845,465,1454,353,179,714,1539,448,1744,752,1740,188,902,1076,633,916,477,1663,145,1653,174,701,1446,1690],"c":0,"cs":0,"bib":"2026RNAAS..10..202T","v":"Research Notes of the AAS","lk":"arXiv:2606.30855","url":"https://arxiv.org/abs/2606.30855","doi":"10.3847/2515-5172/ae8cf8","tg":{"s":["No simulations"],"d":["AI for science"],"m":["Simulation-based inference","Generative models","LLM agents","Other ML"],"u":["Other ML"]},"x":0.32,"yy":0.8499,"p3":[0.4998,-0.157,0.3611],"sim":{"k":"e","l":[[112,0.945],[136,0.935],[154,0.929],[141,0.927],[127,0.926]]},"c3":[58.12,-274.47,65.66],"c2":[70.08,-297.23],"k":6,"r":[28],"rm":1},{"id":"2606.22859","t":"AI Scientists as Engines of Discovery: A Case for Development within Reformed Institutions","ab":"Agentic artificial intelligence (AI) systems are beginning to assist, accelerate, and partially automate scientific discovery, performing tasks that span literature synthesis, code generation, data analysis, hypothesis proposal, and model criticism. We argue that this transition is qualitative rather than incremental, and that suitably designed multi-agent systems may evolve from passive computational tools into ``AI scientists'' that can expand the hypothesis-generating and verification capacity of science. Such systems must be developed and deployed within a scientific ecosystem fit for purpose: institutions must be redesigned for verification, accountability, interpretability, and dual-use safety. We sketch how multi-agent architectures, illustrated by the prototype framework \\textit{Denario}, accelerate the discovery cycle and traverse model spaces beyond human reach; examine what this implies for authorship, peer review, and the enduring role of human scientists; and close with recommendations for governing AI as an epistemic actor rather than a mere instrument.","abx":0,"nw":0,"d":"2026-06-22","dq":0,"y":2026,"au":[1519,267,633,1510,251,452,1731,903,748,1076],"c":2,"cs":0,"bib":"2026arXiv260622859J","v":"arXiv.org","lk":"arXiv:2606.22859","url":"https://arxiv.org/abs/2606.22859","doi":"10.48550/arXiv.2606.22859","tg":{"s":["No simulations"],"d":["AI for science"],"m":["LLM agents"],"u":[]},"x":0.4458,"yy":1.0,"p3":[0.3455,-0.6075,0.5708],"sim":{"k":"e","l":[[24,0.943],[0,0.924],[33,0.921],[4,0.917],[28,0.908]]},"c3":[20.66,204.33,53.02],"c2":[100.38,218.81],"k":0,"r":[24],"rm":0},{"id":"2606.10038","t":"Learning the Universe with the 2nd Generation of CAMELS: Varying 35 parameters of the IllustrisTNG model in (50Mpc/h)^3 boxes","ab":"We present a new set of 1,192 cosmological simulations as part of the CAMELS project, in which a space of 35 cosmological, astrophysical, and numerical parameters is explored around the fiducial IllustrisTNG model. The volume of each of these simulations is (50Mpc/h)^3, eight times larger than that of previous CAMELS simulations. This provides lower sample variance as well as access to more massive halos and more diverse environments. We focus this work on exploring the advantages these differences provide for parameter inference powered by neural networks. We generate training sets based on the matter power spectra, projected maps of the volumes, graphs representing galaxy spatial distributions, and thermodynamical properties of massive halos. We employ multilayer perceptrons, convolutional neural networks, graph neural networks, and Gaussian processes, respectively, to extract information on the simulation parameters from these inputs while comparing systematically to analogous results from our previous generation of (25Mpc/h)^3 simulations. We generally find that the new, larger volumes produce tighter marginal constraints on the parameters, to degrees that vary between the different inputs. The improvements, however, scale more weakly than with the square root of the increase in the amount of data (i.e., physical volume). We interpret this as originating either from information loss due to mode coupling or from complex degeneracies in parameter space. We also discuss the effects on statistics of the intergalactic medium temperature from four new parameters that are varied in these simulations, which control the amplitude and timing of the ionizing background radiation. We publicly release the simulation outputs and ancillary data at https://camels.readthedocs.io.","abx":0,"nw":0,"d":"2026-06-08","dq":0,"y":2026,"au":[1651,1842,266,1264,1263,946,531,378,1810,264,989,444,633],"c":7,"cs":0,"bib":"2026arXiv260610038G","v":"","lk":"arXiv:2606.10038","url":"https://arxiv.org/abs/2606.10038","doi":"","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["CNN","Graph neural networks","Simulation-based inference","Emulators & regression ML"],"u":["Simulation-based inference"]},"x":-0.1949,"yy":0.4095,"p3":[0.1415,0.3497,0.3952],"sim":{"k":"e","l":[[141,0.961],[6,0.959],[66,0.949],[87,0.949],[124,0.949]]},"c3":[-29.99,99.6,188.7],"c2":[175.05,99.88],"k":7,"r":[16,17,29,35,36,41,46,48,53,61,66,81,87,90,91,98,108,111,113,117,123,124,141],"rm":0},{"id":"2605.31548","t":"Reconciling the Fundamental Plane of Early-Type Galaxies with hydrodynamical simulations: The case of IllustrisTNG100-1","ab":"The Fundamental Plane (FP) of Early-Type Galaxies (ETGs) encapsulates a tight correlation among their structural and dynamical properties and provides an important benchmark for galaxy formation models. However, cosmological hydrodynamical simulations have historically struggled to reproduce the observed FP tilt, with discrepancies often attributed to to flawed feedback physics or insufficient resolution. Using the IllustrisTNG100-1 simulation, we show that adopting observationally motivated measurements, including Sérsic-derived photometric parameters and dynamically inferred velocity dispersions designed to minimise softening-length effects, substantially reduces the discrepancy between simulated and observed FPs. We further explore the impact of non-universal, mass-dependent Initial Mass Function (IMF) variations through forward modelling of their effects on galaxy structural and dynamical quantities. In particular, bottom-heavy IMF variations produce FP coefficients fully consistent with observational constraints for both direct and orthogonal fits. Our results suggest that a significant fraction of the long-standing FP tension arises from how galaxy observables are extracted and interpreted in simulations, although residual discrepancies may still reflect limitations in the underlying baryonic physics. These findings highlight the importance of observational realism and IMF variations for interpreting galaxy scaling relations and for improving the predictive power of hydrodynamical simulations of ETG formation.","abx":0,"nw":0,"d":"2026-05-29","dq":0,"y":2026,"au":[1443,1308,340,1084,633],"c":0,"cs":0,"bib":"2026arXiv260531548D","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2605.31548","url":"https://arxiv.org/abs/2605.31548","doi":"10.1093/mnras/stag2081","tg":{"s":["Other simulations"],"d":["Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":0.1623,"yy":-0.0216,"p3":[-0.2411,0.2657,0.2719],"sim":{"k":"e","l":[[156,0.926],[14,0.925],[18,0.924],[66,0.921],[42,0.921]]},"c3":[149.75,246.15,-27.21],"c2":[38.77,324.47],"k":5,"r":[],"rm":0},{"id":"2604.17981","t":"Efficiently emulating distribution functions in gigaparsec volumes for varying cosmological parameters","ab":"We present a new method for emulating the halo mass function (HMF) and other distribution functions in large effective volumes, down to low halo masses, whilst simultaneously modifying large ranges of parameters, for a fraction of the cost of traditional periodic cosmological simulations. We demonstrate the method by selecting small regions, $V \\sim (50 \\,h^{-1}{\\rm Mpc})^3$, with a range of overdensities from the Quijote suite, consisting of tens of thousands of $(1 \\,h^{-1}{\\rm Gpc})^3$ $N$-body simulation volumes run with varying $Λ$CDM parameters. We train a differentiable emulator, conditioned on the overdensity of the region and these global parameters, to reproduce the halo mass function in these regions. We then successfully recover the global distribution of halo masses of the entire box by integrating over the overdensity distribution. Our approach uses just $\\sim\\,$0.026% of the original simulation volume, and suggests that suites of targeted `zoom' simulations, extracted from low resolution parent volumes, can be used to emulate large volume simulations at a fraction of the computational cost, whilst simultaneously pushing the dynamic range to much lower masses than can be achieved in periodic simulations. We discuss emulation of other key dark matter and baryonic distribution functions, as well as higher order statistics, with implications for the interpretation of upcoming wide field surveys on observatories such as Euclid, Roman and Rubin.","abx":0,"nw":0,"d":"2026-04-20","dq":0,"y":2026,"au":[378,1263,1805,444,1651,1647,633],"c":1,"cs":0,"bib":"2026MNRAS.552g1860L","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2604.17981","url":"https://arxiv.org/abs/2604.17981","doi":"10.1093/mnras/stag1860","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["Emulators & regression ML"],"u":[]},"x":0.213,"yy":0.2819,"p3":[0.0391,0.1185,0.0479],"sim":{"k":"e","l":[[66,0.952],[158,0.949],[89,0.942],[45,0.942],[54,0.942]]},"c3":[-37.49,101.88,130.79],"c2":[114.48,19.72],"k":6,"r":[16,17,30,41,50,55,56,61,66,82,87,90,107,115,122,123,141,158],"rm":0},{"id":"2603.20855","t":"Field-Level Inference of Primordial Non-Gaussianity with the Quijote Simulation Suite","ab":"Local primordial non-Gaussianity, parameterised as $f_{\\rm NL}^{\\rm local}$, will be stringently constrained using state-of-the-art methods applied to next-generation galaxy redshift survey data. In this paper, in preparation for the upcoming data sets, we demonstrate for the first time the joint field-level inference of $f_{\\rm NL}^{\\rm local}$, nuisance parameters, and the initial conditions in realistic halo catalogues, ones which are generated through full dark-matter-only $N$-body simulations. The field-level inference algorithm optimally constrains $f_{\\rm NL}^{\\rm local}$ through a Bayesian forward-modelling approach at the field level, which outperforms traditional methods by leveraging the full statistical power of the data at the scales considered. In addition, we assess its performance under various design choices in the forward model, including tests of the structure formation model and resolution. We demonstrate the robustness of our approach by applying it to a subset of the \\textit{Quijote} simulation suite, performing the inference at scales down to $k_{\\rm max} \\approx 0.1 h \\rm{Mpc}^{-1}$. Compared with a power spectrum and bispectrum estimator, we find a $\\sim1.3$ improvement in $σ(f_{\\rm NL}^{\\rm local})$ when applying \\borg{}, while marginalising over the initial conditions and bias parameters. From the small-scale information sensitivity tests, we show that the constraints on $f_{\\rm NL}^{\\rm local}$ improve as we increase the resolution of the inference. These findings underscore the transformative potential of field-level inference to leverage the information available in ongoing surveys such as \\textit{Euclid}, providing accurate insights into the physics of cosmic inflation and the number of fields driving it.","abx":0,"nw":0,"d":"2026-03-21","dq":0,"y":2026,"au":[126,897,718,1806,633,1230,476,693,467,630,1272,1232,251],"c":3,"cs":0,"bib":"2026arXiv260320855A","v":"","lk":"arXiv:2603.20855","url":"https://arxiv.org/abs/2603.20855","doi":"","tg":{"s":["Quijote"],"d":["Large-scale structure","Primordial non-Gaussianity"],"m":["No ML"],"u":[]},"x":0.1268,"yy":-0.5557,"p3":[-0.1747,-0.6398,0.1341],"sim":{"k":"e","l":[[68,0.957],[106,0.95],[84,0.948],[96,0.948],[101,0.944]]},"c3":[-71.81,185.02,59.92],"c2":[-32.16,121.21],"k":4,"r":[],"rm":1},{"id":"2602.07651","t":"Cosmology with one galaxy: An analytic formula relating $Ω_{\\rm m}$ with galaxy properties","ab":"Standard cosmological analyses typically treat galaxy formation and cosmological parameter inference as decoupled problems, relying on population-level statistics such as clustering, lensing, or halo abundances. However, classical studies of baryon fractions in massive galaxy clusters have long suggested that gravitationally bound systems may retain cosmological information through their baryonic content. Building on this insight, we present the first analytic and physically interpretable cosmological tracer that links the matter density parameter, $Ω_m$, directly to intrinsic galaxy-scale observables, demonstrating that cosmological information can be extracted from individual galaxies. Using symbolic regression applied to state-of-the-art hydrodynamical simulations from the CAMELS project, we identify a compact functional form that robustly recovers $Ω_m$ across multiple simulation suites (IllustrisTNG, ASTRID, SIMBA, and Swift-EAGLE), requiring only modest recalibration of a small number of coefficients. The resulting expression admits a transparent physical interpretation in terms of baryonic retention and enrichment efficiency regulated by gravitational potential depth, providing a clear explanation for why $Ω_m$ is locally encoded in galaxy properties. Our work establishes a direct, interpretable bridge between small-scale galaxy physics and large-scale cosmology, opening a complementary pathway to cosmological inference that bypasses traditional clustering-based statistics and enables new synergies between galaxy formation theory and precision cosmology.","abx":0,"nw":0,"d":"2026-02-07","dq":0,"y":2026,"au":[994,633,1530,1316],"c":2,"cs":0,"bib":"2026ApJ..1003..192L","v":"Astrophysical Journal","lk":"arXiv:2602.07651","url":"https://arxiv.org/abs/2602.07651","doi":"10.3847/1538-4357/ae64e3","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Symbolic regression"],"u":[]},"x":0.0842,"yy":0.0774,"p3":[-0.162,0.2734,0.3413],"sim":{"k":"e","l":[[18,0.953],[89,0.952],[66,0.949],[6,0.947],[108,0.943]]},"c3":[97.81,54.4,151.2],"c2":[180.46,-97.14],"k":7,"r":[43,50,87,115,141],"rm":0},{"id":"2601.07543","t":"CASCO: Cosmological and AStrophysical parameters from Cosmological simulations and Observations IV. Testing warm dark matter cosmologies with galaxy scaling relations: A joint simulation-observation study using DREAMS simulations","ab":"Small-scale discrepancies in the standard Lambda cold dark matter paradigm have motivated the exploration of alternative dark matter (DM) models, such as warm dark matter (WDM). We investigate the constraining power of galaxy scaling relations on cosmological, astrophysical, and WDM parameters through a joint analysis of hydrodynamic simulations and observational data. Our study is based on the DREAMS project and combines large-volume uniform-box simulations with high-resolution Milky Way zoom-in runs in a $Λ$WDM cosmology. To ensure consistency between the different simulation sets, we apply calibrations to account for resolution effects, allowing us to exploit the complementary strengths of the two suites. We compare simulated relations, including stellar size, DM mass and fraction within the stellar half-mass radius, and the total-to-stellar mass ratio, with two complementary galaxy samples: the SPARC catalog of nearby spirals and the LVDB catalog of dwarf galaxies in the Local Volume. Using a bootstrap-based fitting procedure, we show that key cosmological parameters ($Ω_m$, $σ_8$) and supernova feedback strength can be recovered with good accuracy, particularly from the uniform-box simulations. While the WDM particle mass remains unconstrained, the zoom-in simulations reveal subtle WDM-induced trends at low stellar masses in both the DM mass and total-to-stellar mass ratio. We also find that the galaxy stellar mass function exhibits a measurable dependence on the WDM particle mass below log10(M_*/Msun) <~ 8, which appears separable from the impact of feedback, suggesting it as a promising complementary probe. Our results highlight the importance of combining multi-resolution simulations with diverse observational datasets to jointly constrain baryonic processes and DM properties.","abx":0,"nw":0,"d":"2026-01-12","dq":0,"y":2026,"au":[1200,340,1759,157,201,146,1334,1308,918,1440,633,1243],"c":2,"cs":0,"bib":"2026A&A...706A.382S","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2601.07543","url":"https://arxiv.org/abs/2601.07543","doi":"10.1051/0004-6361/202556698","tg":{"s":["DREAMS"],"d":["Dark matter & modified gravity","Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":0.1684,"yy":0.5112,"p3":[0.0517,0.6388,0.3196],"sim":{"k":"e","l":[[64,0.948],[21,0.946],[66,0.941],[19,0.941],[26,0.937]]},"c3":[76.46,-43.15,217.66],"c2":[198.01,-145.16],"k":5,"r":[27,44,64,85,87],"rm":0},{"id":"2601.06290","t":"CAMELS Environments: The Impact of Local Neighbours on Galaxy Evolution across the SIMBA, IllustrisTNG, ASTRID, and Swift-EAGLE Simulations","ab":"Internal feedback from massive stars and active galactic nuclei (AGN) play a key role in galaxy evolution, but external environmental effects can also strongly influence galaxies. We investigate the impact of environment on galaxy evolution, and its dependence on baryonic physics implementation, using Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) spanning a wide range of stellar and AGN feedback implementations in the SIMBA, IllustrisTNG, ASTRID, and Swift-EAGLE galaxy formation models. We show that satellite galaxies are significantly affected by the environment in all simulation models, with their gas fraction and star formation rate (SFR) suppressed in overdense regions compared to similar mass satellites in underdense environments at $z=0$. Central galaxies are less sensitive to environment but tend to show lower gas fraction and SFR in overdense regions at low stellar mass, transitioning to higher gas fraction and SFR for massive galaxies in higher-density environments. Halo baryon fraction ($f_{\\rm B}$) and circumgalactic medium mass fraction ($f_{\\rm CGM}$) at $z=0$ show clear environmental effects. In SIMBA, low-mass haloes in overdense regions have systematically lower $f_{\\rm B}$ and $f_{\\rm CGM}$ at fixed halo mass, while Swift-EAGLE haloes in overdense regions have systematically higher $f_{\\rm B}$ and $f_{\\rm CGM}$ across the full halo mass range, and IllustrisTNG and ASTRID show opposite trends at the low and high mass ends. Environmental effects can flip at higher redshift, with SFR and $f_{\\rm B}$ increasing with local density in low-mass haloes before quenching at an increasing overdensity threshold. Our results demonstrate that the impact of environment on galaxy evolution depends significantly on galaxy formation model, and higher-density environments can either suppress or enhance star formation depending on galaxy mass and cosmic epoch.","abx":0,"nw":0,"d":"2026-01-09","dq":0,"y":2026,"au":[1810,444,266,441,923,789,1848,378,633],"c":5,"cs":0,"bib":"2026MNRAS.551g1529S","v":"","lk":"arXiv:2601.06290","url":"https://arxiv.org/abs/2601.06290","doi":"","tg":{"s":["CAMELS"],"d":["Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":-0.1955,"yy":0.7167,"p3":[-0.6535,0.4206,0.1586],"sim":{"k":"e","l":[[52,0.967],[67,0.95],[30,0.95],[48,0.949],[6,0.948]]},"c3":[54.36,102.52,202.99],"c2":[227.36,-2.83],"k":5,"r":[10,17,50,52,66,67,81,87,90,91,113,115,118,122,125,141],"rm":0},{"id":"2601.06258","t":"Cosmological back-reaction of baryons on dark matter in the CAMELS simulations","ab":"Baryonic processes such as radiative cooling and feedback from massive stars and active galactic nuclei (AGN) directly redistribute baryons in the Universe but also indirectly redistribute dark matter due to changes in the gravitational potential. In this work, we investigate this \"back-reaction\" of baryons on dark matter using thousands of cosmological hydrodynamic simulations from the Cosmology and Astrophysics with MachinE Learning Simulations (CAMELS) project, including parameter variations in the SIMBA, IllustrisTNG, ASTRID, and Swift-EAGLE galaxy formation models. Matching haloes to corresponding N-body (dark matter-only) simulations, we find that virial masses decrease owing to the ejection of baryons by feedback. Relative to N-body simulations, halo profiles show an increased dark matter density in the center (due to radiative cooling) and a decrease in density farther out (due to feedback), with both effects being strongest in SIMBA (> 450% increase at r < 0.01 Rvir). The clustering of dark matter strongly responds to changes in baryonic physics, with dark matter power spectra in some simulations from each model showing as much as 20% suppression or increase in power at k ~ 10 h/Mpc relative to N-body simulations. We find that the dark matter back-reaction depends intrinsically on cosmology (Omega_m and sigma_8) at fixed baryonic physics, and varies strongly with the details of the feedback implementation. These results emphasize the need for marginalizing over uncertainties in baryonic physics to extract cosmological information from weak lensing surveys as well as their potential to constrain feedback models in galaxy evolution.","abx":0,"nw":0,"d":"2026-01-09","dq":0,"y":2026,"au":[1256,444,1651,441,266,789,923,1627,1263,1810,378,452,1533,1260,925,633],"c":12,"cs":0,"bib":"2026MNRAS.547ag525G","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2601.06258","url":"https://arxiv.org/abs/2601.06258","doi":"10.1093/mnras/stag525","tg":{"s":["CAMELS"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":-0.1822,"yy":0.8574,"p3":[-0.6352,0.169,0.3414],"sim":{"k":"e","l":[[81,0.958],[52,0.952],[92,0.95],[114,0.947],[66,0.941]]},"c3":[98.75,133.4,132.5],"c2":[233.08,41.24],"k":5,"r":[16,30,40,43,44,48,50,52,64,66,67,69,71,81,82,87,90,91,92,100,108,111,113,114,115,118,122,124,125,127,139,141],"rm":0},{"id":"2512.10222","t":"Galaxy Phase-Space and Field-Level Cosmology: The Strength of Semi-Analytic Models","ab":"Semi-analytic models are a widely used approach to simulate galaxy properties within a cosmological framework, relying on simplified yet physically motivated prescriptions. They have also proven to be an efficient alternative for generating accurate galaxy catalogs, offering a faster and less computationally expensive option compared to full hydrodynamical simulations. In this paper, we demonstrate that using only galaxy $3$D positions and radial velocities, we can train a graph neural network coupled to a moment neural network to obtain a robust machine learning based model capable of estimating the matter density parameters, $Ω_{\\rm m}$, with a precision of approximately 10%. The network is trained on ($25 h^{-1}$Mpc)$^3$ volumes of galaxy catalogs from L-Galaxies and can successfully extrapolate its predictions to other semi-analytic models (GAEA, SC-SAM, and Shark) and, more remarkably, to hydrodynamical simulations (Astrid, SIMBA, IllustrisTNG, and SWIFT-EAGLE). Our results show that the network is robust to variations in astrophysical and subgrid physics, cosmological and astrophysical parameters, and the different halo-profile treatments used across simulations. This suggests that the physical relationships encoded in the phase-space of semi-analytic models are largely independent of their specific physical prescriptions, reinforcing their potential as tools for the generation of realistic mock catalogs for cosmological parameter inference.","abx":0,"nw":0,"d":"2025-12-11","dq":0,"y":2025,"au":[1316,633,1430,695,625,1083,1224,1786,1862,1513,1733],"c":1,"cs":0,"bib":"2026ApJ..1007...34D","v":"Astrophysical Journal","lk":"arXiv:2512.10222","url":"https://arxiv.org/abs/2512.10222","doi":"10.3847/1538-4357/ae84b4","tg":{"s":["CAMELS","Other simulations"],"d":["Large-scale structure","Galaxies & baryonic feedback"],"m":["Graph neural networks","Simulation-based inference"],"u":["CAMELS"],"n":"SAMs+hydro in 25 Mpc/h boxes are CAMELS(-SAM) but CAMELS not named"},"x":0.0243,"yy":0.1138,"p3":[-0.212,0.141,0.4863],"sim":{"k":"e","l":[[108,0.96],[120,0.958],[89,0.956],[98,0.954],[90,0.954]]},"c3":[-45.64,12.39,171.59],"c2":[114.83,69.08],"k":7,"r":[37,46,62,73,75,87,89,90,98,108,111,115,118,125,141],"rm":0},{"id":"2512.03132","t":"The DREAMS Project: Disentangling the Impact of Halo-to-Halo Variance and Baryonic Feedback on Milky Way Dark Matter Density Profiles","ab":"In this work, we utilize a new suite of Milky Way-mass halos from the DREAMS Project, simulated with Cold Dark Matter (CDM), to quantify the influence of baryon feedback and intrinsic halo-to-halo variance on dark matter density profiles. Our suite of 1024 halos varies over supernova and black hole feedback parameters from the IllustrisTNG model, as well as variations in two cosmological parameters. We find that, for the DREAMS parameter variations, Milky Way-mass dark matter density profiles in the IllustrisTNG model are largely insensitive to astrophysics and cosmology variations, with the dominant source of scatter instead arising from halo-to-halo variance. However, most of the (comparatively minor) feedback-driven variations come from the changes to supernova prescriptions. By comparing to dark matter-only simulations, we find that the strongest supernova wind energies are so effective at preventing galaxy formation that the halos are nearly entirely collisionless dark matter. Finally, regardless of physics variation, all the DREAMS halos are roughly consistent with a halo contracting adiabatically from the presence of baryons, unlike models that have bursty stellar feedback. This work represents a step toward assessing the uncertainty in Milky Way dark matter profiles, with direct implications for dark matter searches where systematic uncertainty in the density profile remains a major challenge.","abx":0,"nw":0,"d":"2025-12-02","dq":0,"y":2025,"au":[146,918,1440,163,1236,172,756,123,750,633,914,786,246,922,556,907,1335,140,1744,1677,1811,1814,201,1334,1078,1243],"c":9,"cs":0,"bib":"2026ApJ..1002....8G","v":"Astrophysical Journal","lk":"arXiv:2512.03132","url":"https://arxiv.org/abs/2512.03132","doi":"10.3847/1538-4357/ae5938","tg":{"s":["DREAMS"],"d":["Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":0.201,"yy":0.5663,"p3":[-0.0145,0.6272,0.3481],"sim":{"k":"e","l":[[20,0.956],[21,0.956],[66,0.948],[64,0.947],[15,0.941]]},"c3":[-5.11,17.66,244.48],"c2":[225.76,18.47],"k":5,"r":[20,21,56,64,87,139,141],"rm":0},{"id":"2512.02095","t":"The DREAMS Project: Disentangling the Impact of Halo-to-Halo Variance and Baryonic Feedback on Milky Way Satellite Galaxies","ab":"We analyze the properties of satellite galaxies around 1,024 Milky Way-mass hosts from the DREAMS Project, simulated within a $Λ$CDM cosmology. Utilizing the TNG galaxy-formation model, the DREAMS simulations incorporate both baryonic physics and cosmological uncertainties for a large sample of galaxies with diverse environments and formation histories. We investigate the relative impact of the physical uncertainty from the galaxy-formation model on predicted satellite properties using four metrics: the satellite stellar mass function, radial distribution, inner slope of dark matter density profile, and stellar half-light radius. We compare these predictions to observations from the SAGA Survey and the DREAMS N-body simulations and find that uncertainties from baryonic physics modeling are subdominant to the scatter arising from halo-to-halo variance. Where baryonic modeling does affect satellites, the supernova wind energy has the largest effect on the satellite properties that we investigate. Specifically, increased supernova wind energy suppresses the stellar mass of satellites and results in more extended stellar half-light radii. The adopted wind speed has only a minor impact, and other astrophysical and cosmological parameters show no measurable effect. Our findings highlight the robustness of satellite properties against uncertainties in baryonic physics modeling.","abx":0,"nw":0,"d":"2025-12-01","dq":0,"y":2025,"au":[918,1236,1440,633,146,201,356,157,1334,980,556,907,1358,139,1744,1632,172,1335,1677,1814,632,136,1244,1078,1243,941,942],"c":4,"cs":0,"bib":"2026ApJ..1006..244R","v":"Astrophysical Journal","lk":"arXiv:2512.02095","url":"https://arxiv.org/abs/2512.02095","doi":"10.3847/1538-4357/ae82f8","tg":{"s":["DREAMS"],"d":["Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":0.2323,"yy":0.5718,"p3":[-0.0723,0.651,0.2702],"sim":{"k":"e","l":[[19,0.956],[21,0.95],[15,0.934],[66,0.931],[26,0.929]]},"c3":[-13.22,-39.25,238.4],"c2":[220.44,-54.66],"k":5,"r":[19,21,56,64,87,123,141],"rm":0},{"id":"2512.00148","t":"The DREAMS Project: A New Suite of 1,024 Simulations to Contextualize the Milky Way and Assess Physics Uncertainties","ab":"We introduce a new suite of 1,024 cosmological and hydrodynamical zoom-in simulations of Milky Way-mass halos, run with Cold Dark Matter, as part of the DREAMS Project. Each simulation in the suite has a unique set of initial conditions and combination of cosmological and astrophysical parameters. The suite is designed to quantify theoretical uncertainties from halo-to-halo variance, as well as stellar and black hole feedback. We develop a novel weighting scheme that prioritizes regions of the input parameter space, yielding galaxies consistent with the observed present-day stellar mass--halo mass relation. The resulting galaxy population exhibits a wide diversity in structural properties that encompasses those of the actual Milky Way, providing a powerful statistical sample for galactic archaeology. To demonstrate the suite's scientific utility, we investigate the connection between a galaxy's merger history, focusing on Gaia-Sausage-Enceladus~(GSE) analogs, and its present-day properties. We find that galaxies with a GSE analog have lower star formation rates, more compact disks, and more spherical stellar halos. Crucially, significant halo-to-halo scatter remains, demonstrating that matching more than the most significant events in the Milky Way's past is necessary to recover its present-day properties. Our results highlight the necessity for large statistical samples to disentangle the stochastic nature of galaxy formation and robustly model the Milky Way's unique history.","abx":0,"nw":0,"d":"2025-11-28","dq":0,"y":2025,"au":[918,1236,1440,633,146,201,356,157,1334,980,556,265,139,1632,172,1335,1677,386,1814,1243],"c":9,"cs":0,"bib":"2025arXiv251200148R","v":"","lk":"arXiv:2512.00148","url":"https://arxiv.org/abs/2512.00148","doi":"","tg":{"s":["DREAMS"],"d":["Galaxies & baryonic feedback"],"m":["No ML"],"u":[]},"x":0.2143,"yy":0.5339,"p3":[0.0017,0.6848,0.2373],"sim":{"k":"e","l":[[19,0.956],[66,0.952],[20,0.95],[15,0.946],[56,0.941]]},"c3":[7.84,-26.15,222.02],"c2":[190.74,-35.16],"k":5,"r":[23,56,64,87,123,141],"rm":0},{"id":"2511.13393","t":"Learning Cosmology from Nearest Neighbour Statistics","ab":"Extracting cosmological parameters from galaxy/halo catalogues with sub-percent level accuracy is an important aspect of modern cosmology, especially in view of ongoing and upcoming surveys such as Euclid, DESI, and LSST. While traditional two-point statistics have been known to be suboptimal for this task, recently proposed k-Nearest Neighbour (kNN) based summary statistics have demonstrated tighter constraining power. Building on the kNN statistics, we introduce a new field-level representation of discrete halo catalogues - NN distance maps. We employ this technique on the halo catalogues obtained from Quijote N-body simulation suites. By combining these maps with kNN-based summary statistics, we train a hybrid neural network to infer cosmological parameters, showing that the resulting constraints achieve state-of-the-art, if not the best, accuracy. In addition, our hybrid framework is 5-10 times more computationally efficient than some of the existing point-cloud-based ML methods.","abx":0,"nw":0,"d":"2025-11-17","dq":0,"y":2025,"au":[205,199,633,1738],"c":2,"cs":0,"bib":"2026A&A...711A..53C","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2511.13393","url":"https://arxiv.org/abs/2511.13393","doi":"10.1051/0004-6361/202558143","tg":{"s":["Quijote"],"d":["Large-scale structure"],"m":["CNN","Simulation-based inference"],"u":["CNN","Simulation-based inference"]},"x":-0.0163,"yy":0.2852,"p3":[-0.1048,0.0745,0.4027],"sim":{"k":"e","l":[[62,0.944],[111,0.943],[89,0.94],[120,0.938],[53,0.937]]},"c3":[-88.54,43.46,63.96],"c2":[12.1,97.69],"k":6,"r":[35,36,51,62,73,90,98,108,109,115,119,122,123,132,133,152,153,157,158],"rm":0},{"id":"2511.05367","t":"Linking Warm Dark Matter to Merger Tree Histories via Deep Learning Networks","ab":"Dark matter (DM) halos form hierarchically in the Universe through a series of merger events. Cosmological simulations can represent this series of mergers as a graph-like ``tree'' structure. Previous work has shown these merger trees are sensitive to cosmology simulation parameters, but as DM structures, the outstanding question of their sensitivity to DM models remains unanswered. In this work, we investigate the feasibility of deep learning methods trained on merger trees to infer Warm Dark Matter (WDM) particles masses from the DREAMS simulation suite. We organize the merger trees from 1,024 zoom-in simulations into graphs with nodes representing the merger history of galaxies and edges denoting hereditary links. We vary the complexity of the node features included in the graphs ranging from a single node feature up through an array of several galactic properties (e.g., halo mass, star formation rate, etc.). We train a Graph Neural Network (GNN) to predict the WDM mass using the graph representation of the merger tree as input. We find that the GNN can predict the mass of the WDM particle ($R^2$ from 0.07 to 0.95), with success depending on the graph complexity and node features. We extend the same methods to supernovae and active galactic nuclei feedback parameters $A_\\text{SN1}$, $A_\\text{SN2}$, and $A_\\text{AGN}$, successfully inferring the supernovae parameters. The GNN can even infer the WDM mass from merger tree histories without any node features, indicating that the structure of merger trees alone inherits information about the cosmological parameters of the simulations from which they form.","abx":0,"nw":0,"d":"2025-11-07","dq":0,"y":2025,"au":[786,1440,146,918,633,1854,201,1677,1814,1358,1334,464,462,1243],"c":4,"cs":0,"bib":"2026ApJ..1005..186L","v":"Astrophysical Journal","lk":"arXiv:2511.05367","url":"https://arxiv.org/abs/2511.05367","doi":"10.3847/1538-4357/ae7bec","tg":{"s":["DREAMS"],"d":["Dark matter & modified gravity","Galaxies & baryonic feedback"],"m":["Graph neural networks"],"u":[]},"x":0.0386,"yy":0.2274,"p3":[-0.042,-0.0557,0.6126],"sim":{"k":"e","l":[[120,0.955],[62,0.945],[98,0.944],[89,0.944],[85,0.943]]},"c3":[-37.44,-22.82,207.09],"c2":[148.91,-39.36],"k":6,"r":[19,20,27,30,35,64,70,75,79,85,87,90,94,98,108,118,123,124,125,139,141],"rm":0},{"id":"2510.26887","t":"The Denario project: Deep knowledge AI agents for scientific discovery","ab":"We present Denario, an AI multi-agent system designed to serve as a scientific research assistant. Denario can perform many different tasks, such as generating ideas, checking the literature, developing research plans, writing and executing code, making plots, and drafting and reviewing a scientific paper. The system has a modular architecture, allowing it to handle specific tasks, such as generating an idea, or carrying out end-to-end scientific analysis using Cmbagent as a deep-research backend. In this work, we describe in detail Denario and its modules, and illustrate its capabilities by presenting multiple AI-generated papers generated by it in many different scientific disciplines such as astrophysics, biology, biophysics, biomedical informatics, chemistry, material science, mathematical physics, medicine, neuroscience and planetary science. Denario also excels at combining ideas from different disciplines, and we illustrate this by showing a paper that applies methods from quantum physics and machine learning to astrophysical data. We report the evaluations performed on these papers by domain experts, who provided both numerical scores and review-like feedback. We then highlight the strengths, weaknesses, and limitations of the current system. Finally, we discuss the ethical implications of AI-driven research and reflect on how such technology relates to the philosophy of science. We publicly release the code at https://github.com/AstroPilot-AI/Denario. A Denario demo can also be run directly on the web at https://huggingface.co/spaces/astropilot-ai/Denario, and the full app will be deployed on the cloud.","abx":0,"nw":0,"d":"2025-10-30","dq":0,"y":2025,"au":[633,267,1434,134,138,366,155,1431,348,1432,1280,1752,363,1831,1519,946,194,1361,1731,196,1442,1645,452,1444,1750,1254,465,367,265,1077,1843,1650,1801,1459,906,1863],"c":42,"cs":0,"bib":"2025arXiv251026887V","v":"PRX Intelligence","lk":"arXiv:2510.26887","url":"https://arxiv.org/abs/2510.26887","doi":"10.1103/kk55-gc95","tg":{"s":["No simulations"],"d":["AI for science"],"m":["LLM agents"],"u":[]},"x":0.4642,"yy":0.9637,"p3":[0.4724,-0.5574,0.5394],"sim":{"k":"e","l":[[28,0.953],[9,0.943],[4,0.943],[33,0.941],[0,0.933]]},"c3":[-10.39,90.81,78.74],"c2":[111.78,91.02],"k":0,"r":[35,111,118,141],"rm":0},{"id":"2510.20086","t":"MG-NECOLA: Fast Neural Emulators for Modified Gravity Cosmologies","ab":"Observations of the large-scale structure (LSS) provide a powerful test of gravity on cosmological scales, but high-resolution N-body simulations of modified gravity (MG) are prohibitively expensive. We present MG-NECOLA, a convolutional neural network that enhances fast MG-PICOLA simulations to near-N-body fidelity at a fraction of the cost. MG-NECOLA reproduces QUIJOTE-MG N-body results in the power spectrum and bispectrum with better than 1% accuracy down to non-linear scales ($k \\simeq 1~h~\\mathrm{Mpc}^{-1}$), while reducing computational time by several orders of magnitude. Importantly, although trained only on $f(R)$ models with massless neutrinos, the network generalizes robustly to scenarios with massive neutrinos, preserving accuracy to within 5% at non-linear scales. This combination of precision and robustness establishes MG-NECOLA as a practical emulator for producing large ensembles of high-fidelity simulations, enabling efficient exploration of modified gravity and beyond-$Λ$CDM cosmologies in upcoming surveys.","abx":0,"nw":0,"d":"2025-10-23","dq":0,"y":2025,"au":[811,1261,530,633,1321,397],"c":1,"cs":0,"bib":"2025arXiv251020086B","v":"","lk":"arXiv:2510.20086","url":"https://arxiv.org/abs/2510.20086","doi":"","tg":{"s":["Quijote","Other simulations"],"d":["Large-scale structure","Dark matter & modified gravity"],"m":["CNN","Emulators & regression ML"],"u":[]},"x":-0.2067,"yy":-0.297,"p3":[0.4666,0.0065,-0.0295],"sim":{"k":"e","l":[[121,0.952],[102,0.945],[136,0.945],[155,0.945],[85,0.944]]},"c3":[-123.39,-71.12,-47.96],"c2":[-164.29,-11.75],"k":6,"r":[121,136,158],"rm":0},{"id":"2510.14766","t":"Predicting the Subhalo Mass Functions in Simulations from Galaxy Images","ab":"Strong gravitational lensing provides a powerful tool to directly infer the dark matter
