<style>
/* Layout: one working screen — header + toolbar on top, canvas map left, detail panel right (stacks below on phones). */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --ink: #12151c; --ink-2: #4c5361; --muted: #7d8492;
  --line: #e1e5eb; --edge: rgba(18,21,28,0.13); --edge-hi: #12151c; --accent: #2a78d6; --wash: rgba(42,120,214,0.08);
  --t0: #a27825; --t1: #426b10; --t2: #f76cb1; --t3: #9c7be5; --t4: #bd383a; --t5: #0da26b; --t6: #2b62bd; --t7: #9634a0; --t8: #22b6da; --t9: #fb7c01; --t10: #8b9099; --seq0: #9ec5f4; --seq1: #104281;
  --f-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --surface: #161a21; --ink: #eef0f4; --ink-2: #b6bcc8; --muted: #858c99;
  --line: #2a303b; --edge: rgba(238,240,244,0.12); --edge-hi: #eef0f4; --accent: #3987e5; --wash: rgba(57,135,229,0.14);
  --t0: #855900; --t1: #7fa150; --t2: #e359a8; --t3: #a473f7; --t4: #c72b3f; --t5: #058057; --t6: #2566b8; --t7: #9d309d; --t8: #209dc3; --t9: #e56c03; --t10: #7b808a; --seq0: #1c5cab; --seq1: #cde2fb; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --ink: #eef0f4; --ink-2: #b6bcc8; --muted: #858c99;
  --line: #2a303b; --edge: rgba(238,240,244,0.12); --edge-hi: #eef0f4; --accent: #3987e5; --wash: rgba(57,135,229,0.14);
  --t0: #855900; --t1: #7fa150; --t2: #e359a8; --t3: #a473f7; --t4: #c72b3f; --t5: #058057; --t6: #2566b8; --t7: #9d309d; --t8: #209dc3; --t9: #e56c03; --t10: #7b808a; --seq0: #1c5cab; --seq1: #cde2fb; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.newb { display: inline-block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--surface); background: var(--accent); border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: 1px; }
.reportlink { margin: 4px 0 0; font-size: 12px; }
.reportlink a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.reportlink a:hover { color: var(--accent); }
.panelbar { display: flex; justify-content: space-between; gap: 8px; }
.linkbtn { all: unset; color: var(--accent); cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
dialog#about { max-width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--line); border-radius: 12px;
  padding: 0; background: var(--surface); color: var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
dialog#about::backdrop { background: rgba(10,12,16,.45); }
.about-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
.about-head h2 { font-family: var(--f-display); font-size: 18px; margin: 0; }
#about-body { padding: 4px 18px 18px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
#about-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
#about-body ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
#about-body p { margin: 0; }
#about-body ul + p { margin-top: 14px; }
#about-body b { color: var(--ink); font-weight: 600; }
.tagline { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 100ch; text-wrap: pretty; }
.stats { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

.modes { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.modes button { border: 0; background: transparent; padding: 7px 14px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 8px; }
.modes button svg { width: 16px; height: 16px; flex: none; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.modes button:not([aria-pressed="true"]):hover { background: var(--wash); color: var(--ink); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.field { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.search { flex: 1 1 220px; max-width: 320px; position: relative; }
.qcount { position: absolute; right: 28px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--muted); pointer-events: none; font-variant-numeric: tabular-nums; }
.search input { width: 100%; padding: 7px 70px 7px 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-variant-numeric: tabular-nums; }
.toolbar select { max-width: 175px; }
#fbtn { white-space: nowrap; }
.fcount { color: var(--accent); font-weight: 600; }
.active { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
.achip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--accent); background: var(--wash); color: var(--ink);
  border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
.achip span { color: var(--muted); font-size: 13px; }
.achip:hover span { color: var(--ink); }
.fpanel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.08); }
.frow { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.frow select { max-width: 220px; }
.ftitle { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.ftitle span { text-transform: none; letter-spacing: 0; font-weight: 400; }
#dlwrap { position: relative; flex: none; }
#reset { margin-left: auto; }
body.nofilter #reset { display: none; }   /* "Clear filters" only when a filter or search is active */
.dlmenu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; display: flex; flex-direction: column; min-width: 170px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; }
.dlmenu button { all: unset; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--ink); cursor: pointer; }
.dlmenu button:hover, .dlmenu button:focus-visible { background: var(--wash); }
.mapopts { position: absolute; left: 10px; bottom: 32px; z-index: 2; display: flex; flex-direction: column; gap: 4px; }   /* above the note */
@media (max-width: 600px) { .mapopts { bottom: 46px; } }   /* the note wraps to two lines */
.playbtn { padding: 5px 0; width: 32px; text-align: center; font-size: 12px; }
.playbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.playyear { position: absolute; right: 64px; bottom: 26px; font-family: var(--f-display); font-size: 48px; font-weight: 700; text-align: right;
  color: var(--ink); opacity: .22; pointer-events: none; font-variant-numeric: tabular-nums; line-height: 1; }
.playyear small { display: block; font-family: var(--f-body); font-size: 13px; font-weight: 600; margin-top: 6px; }
.mapopts select { font-size: 12px; padding: 1px 4px; margin-left: 4px; border-radius: 6px; }
.cbkey { background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  font-size: 11.5px; color: var(--ink-2); display: grid; gap: 3px; max-width: 230px; }
.cbkey .row { display: flex; align-items: center; gap: 6px; }
.cbkey i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.cbkey .ramp { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--seq0), var(--seq1)); }
.cbkey .ends { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.cbkey .hint { color: var(--muted); }
.cbkey .keyhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; color: var(--ink); }
.cbkey .keytoggle { border: 0; background: none; color: var(--muted); font: inherit; padding: 0 2px; cursor: pointer; line-height: 1; }
.cbkey .keytoggle:hover, .cbkey .keytoggle:focus-visible { color: var(--ink); }
.cbkey.closed { padding: 3px 9px; }
.mapopts .chk { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12.5px; }
.tablewrap { position: absolute; inset: 44px 0 0 0; overflow: auto; }
.tablebar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 12px; border-bottom: 1px solid var(--line); z-index: 2; background: var(--surface); }
.tcap { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.trendswrap { position: absolute; inset: 0; overflow: auto; padding: 16px 20px; }
.trhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.trhead .dimtoggle { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
.trhead .dimtoggle button { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; }
.trhead .dimtoggle button:not([aria-pressed="true"]):hover { background: var(--wash); color: var(--ink); }
.trhead h3 { margin: 0; font-family: var(--f-display); font-size: 16px; }
.trendswrap .tgrid { stroke: var(--line); stroke-width: 1; }
.trendswrap .tax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.trendswrap .ttot { fill: var(--ink-2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.trendswrap .tseg { cursor: pointer; stroke: var(--surface); stroke-width: 1; }
.trendswrap .tseg:hover { opacity: .8; }
.trendswrap .tseg.partial { opacity: .55; }   /* the current year, not over yet */
.trendswrap .tseg.partial:hover { opacity: .45; }
.trbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.tlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.tleg { display: inline-flex; align-items: center; gap: 6px; }
.tleg i { width: 10px; height: 10px; border-radius: 3px; }
.tleg .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.tnote { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ptable th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; font-size: 12px;
  color: var(--ink-2); border-bottom: 1px solid var(--line); padding: 0; z-index: 1; white-space: nowrap; }
.ptable th button { all: unset; display: block; padding: 9px 10px; cursor: pointer; }
.ptable th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ptable th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 9px; }
.ptable th[aria-sort="descending"] button::after { content: " ▼"; font-size: 9px; }
.ptable td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ptable td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ptable td.tt { min-width: 280px; color: var(--ink); line-height: 1.35; }
.ptable td.sm { color: var(--ink-2); font-size: 12px; }
.ptable td.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 145px; }
@media (max-width: 1360px) { .ptable td.tt { min-width: 200px; } .ptable td.one { max-width: 120px; } .ptable td.tp { min-width: 125px; } .ptable td.mt { min-width: 182px; max-width: 190px; } .ptable td.tt { min-width: 180px; } }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:nth-child(even) { background: color-mix(in srgb, var(--ink) 4%, transparent); }   /* zebra; hover/selection below win */
.ptable td.tp { min-width: 150px; max-width: 170px; line-height: 1.3; }
.ptable td.mt { min-width: 190px; max-width: 215px; line-height: 1.2; }
.mtag { display: inline-block; margin: 1px 4px 2px 0; padding: 0 6px; border: 1px solid var(--line); border-radius: 9px;
  font-size: 11px; line-height: 15px; padding-top: 1px; padding-bottom: 1px; color: var(--ink-2); background: var(--surface); }   /* long names wrap inside the tag */
.ptable tbody tr:hover { background: var(--wash); }
.ptable tbody tr[aria-selected="true"] { background: var(--wash); box-shadow: inset 3px 0 0 var(--accent); }
.ptable tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ptable i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.tagrow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; align-items: baseline; margin-bottom: 4px; }
.tagax { font-size: 12px; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: 12px; color: var(--ink); background: var(--wash); }
.tag.unsure { background: transparent; border-style: dashed; color: var(--ink-2); }
.tagnote { font-size: 12px; margin-top: 4px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.ghost { border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 12px; color: var(--ink); }
.chip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip[aria-pressed="false"] { color: var(--muted); }
.chip[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; position: relative; }
/* the side panel can be collapsed on wide screens: a small tab on the edge between map and panel */
.paneltab { position: absolute; top: 50%; right: 366px; transform: translate(50%, -50%); z-index: 3; width: 20px; height: 46px; padding: 0;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); font-size: 15px; line-height: 1; cursor: pointer; }
.paneltab:hover, .paneltab:focus-visible { color: var(--ink); border-color: var(--ink-2); }
body.nopanel main { grid-template-columns: minmax(0, 1fr) 0; gap: 0; }
body.nopanel aside { display: none; }
body.nopanel .paneltab { right: 0; transform: translate(0, -50%); border-radius: 8px 0 0 8px; border-right: 0; }
.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 420px; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
canvas.hovering { cursor: pointer; }
.stage-note { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none;
  background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 2px 6px; border-radius: 6px; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 2; }
.zoom button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); }
.zoom button svg { width: 16px; height: 16px; }
.zoom button:hover { color: var(--ink); background: var(--wash); }
.dispwrap { position: relative; }
.dispbtn { display: inline-flex !important; align-items: center; gap: 4px; width: auto !important; height: 30px !important; padding: 0 10px !important; font-size: 12.5px; font-weight: 500; color: var(--ink) !important;
  background: var(--surface) !important; border: 1px solid var(--line) !important; border-radius: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.05); white-space: nowrap; }
.dispbtn span { color: var(--muted); font-weight: 400; }
.dispmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; min-width: 230px; display: grid; gap: 10px; padding: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.drow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--ink-2); }
.drow select { font-size: 12.5px; padding: 3px 6px; border-radius: 6px; }
.chkrow { justify-content: flex-start; gap: 7px; cursor: pointer; }
.drow .ghost { width: auto; height: auto; padding: 3px 10px; font-size: 12px; }
.zgroup, .dimtoggle, #zspin { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.05); overflow: hidden; }
.zgroup { display: flex; flex-direction: column; }
.zgroup button + button { border-top: 1px solid var(--line); }
.dimtoggle { display: flex; padding: 2px; gap: 2px; }
.dimtoggle button { width: auto; height: 26px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 600; }
.dimtoggle button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tip { position: absolute; pointer-events: none; max-width: 300px; background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 8px;
  font-size: 12.5px; line-height: 1.35; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.tip small { display: block; opacity: .75; margin-top: 3px; font-variant-numeric: tabular-nums; }

aside { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; min-width: 0; padding: 18px 18px 22px;
  display: flex; flex-direction: column; gap: 14px; }
aside h2 { font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.3; margin: 0; text-wrap: balance; }
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
aside p { margin: 0; color: var(--ink-2); }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.eyebrow i { width: 10px; height: 10px; border-radius: 50%; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meta a, .mono { font-family: var(--f-mono); font-size: 12.5px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
.abstract { font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.names { display: flex; flex-wrap: wrap; gap: 4px; }
.names button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 7px; font-size: 12.5px; cursor: pointer; color: var(--ink); }
.names button:hover { background: var(--wash); border-color: var(--accent); }
.names button.more { border-style: dashed; color: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list button { width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 6px; border-radius: 6px; cursor: pointer;
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 9px; align-items: baseline; }
.list button:hover { background: var(--wash); }
.list i { width: 8px; height: 8px; border-radius: 50%; transform: translateY(-1px); }
.list .tt { font-size: 13px; color: var(--ink); line-height: 1.35; }
.list .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.back { align-self: flex-start; }
.howto summary { list-style: none; cursor: pointer; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.howto summary::-webkit-details-marker { display: none; }
.howto summary .more { color: var(--accent); font-size: 12px; white-space: nowrap; }
.howto summary:hover .more { text-decoration: underline; }
.howto[open] summary .more { color: var(--muted); }
.howto > p { margin: 10px 0 8px; font-size: 13px; }
.how { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.how div { display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
.how b { color: var(--ink); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.bars { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
footer { font-size: 12px; color: var(--muted); }

@media (max-width: 880px) {
  .paneltab { display: none; }   /* the panel is below the map here */
  body.nopanel main { grid-template-columns: minmax(0, 1fr); gap: 12px; } body.nopanel aside { display: block; }
  body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 380px; }
  aside { overflow: visible; }
  .modes button span { display: none; }
  .modes button { padding: 8px 12px; }
  .legend { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chip { flex: none; }
  .tapcard:not([hidden]) { display: flex; }
}
@media (max-width: 600px) {
  /* phones: compact header, a tall map, and the table as cards */
  .tagline { display: none; }
  .stage { height: 78vh; height: 78svh; min-height: 420px; }
  .ptable, .ptable tbody { display: block; }
  .ptable thead tr { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .ptable th { position: static; border: 0; padding: 0; background: none; }
  .ptable th button { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; }
  .ptable th:nth-child(5), .ptable th:nth-child(7), .ptable td:nth-child(5), .ptable td:nth-child(7) { display: none; }
  .ptable tbody tr { display: flex; flex-wrap: wrap; align-items: baseline; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .ptable td { border: 0; padding: 0; min-width: 0; max-width: none; text-align: left; }
  .ptable td.tt { flex: 0 0 100%; min-width: 0; margin-bottom: 3px; }
  .ptable td:nth-child(n+2) { font-size: 12px; color: var(--ink-2); }
  .ptable td:nth-child(2) { order: 1; max-width: 48%; }        /* first author · year · citations · topic */
  .ptable td:nth-child(3) { order: 2; } .ptable td:nth-child(6) { order: 3; }
  .ptable td:nth-child(4) { order: 4; flex: 0 0 100%; margin-top: 2px; }   /* the topic on its own line */
  .ptable td:nth-child(3)::before, .ptable td:nth-child(6)::before { content: "·"; margin: 0 6px; color: var(--muted); }
  .ptable td:nth-child(6)::after { content: " citations"; }
  .field label[for^="f-"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .frow .field { flex: 1 1 100%; } .frow select { width: 100%; max-width: none; }
  .search { flex-basis: 100%; max-width: none; }
}
@media (pointer: coarse) {
  .zoom button { width: 40px; height: 40px; }
  .chip, .ghost, .names button { min-height: 34px; }
}
.tapcard { display: none; position: absolute; left: 10px; right: 10px; bottom: 10px; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.tapcard .tt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; color: var(--ink); overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tapcard button { flex: none; }
@media (min-width: 881px) { .modes button span.short { display: none; } }

m Ortolá Leonard","William R. Coulton","Wojciech A. Hellwing","Xiangru Li","Xiao-Dong Li","Xiaohu Yang","Xiaoma Wang","Xiaowen Zhang","Xiaoyong Mu","Xin Sun","Xin Zhang","Xinyi Chen","Xu Xiao","Y. Rasera","Yan-Chuan Cai","Yang Wang","Yash Gondhalekar","Yashar Akrami","Yashar Hezaveh","Ye Ma","Yin Li","Ying Zu","Yizhou Gu","Yong Xu Zhang","Yoonyoung Lee","Yosuke Kobayashi","Youcai Zhang","Yu Chin Fabian Lim","Yu Feng","Yu Yu","Yu Zhou","Yuanyuan Zhang","Yue Zhao","Yueying Ni","Yuling Yao","Yun Chen","Yun Wang","Yunchen Xie","Yunchong Wang","Yunjia Song","Yurii Kvasiuk","Yuting Wang","Zachary Slepian","Ze'ev Vladimir","Zeyu Xia","Zhao Chen","Zhiqi Huang","Zhiwei Min","Zhixin Chen","Zhongxu Zhai","Zhujun Jiang","Zhuoyang Li","Zucheng Gao","Zvonimir Vlah"],"papers":[{"id":"2611.15398","t":"$r$-Largest Order Statistics for Galaxy Cluster Cosmology I: Reconstruction of the high-mass end of the Halo Mass Function","ab":"We introduce the $r$-largest order statistics ($r$-LOS) framework for galaxy clusters, a generalization of the standard extreme value statistics (EVS) approach. While conventional EVS focuses on the probability distribution of the most massive cluster within a given volume, the $r$-LOS framework exploits the additional statistical information encoded in the joint distribution of the $r$ most massive clusters, ranked in descending order of mass. We develop the corresponding mathematical formalism, discuss its asymptotic properties, and derive a set of relations relevant to galaxy cluster cosmology. In particular, we demonstrate that the high-mass end of the halo mass function (HMF) can be reconstructed from the generalized extreme value (GEV) parameters inferred using an extension of the block maxima method that incorporates the $r$ most massive clusters in each volume. This provides a means of recovering the high-mass tail of the HMF using only a small subsample of the halo population. We validate these relations using both comoving and light-cone halo catalogues from numerical simulations. Finally, we investigate the sensitivity of the $r$-LOS framework to primordial non-Gaussianity, focusing on its impact on the statistics of massive clusters.","abx":0,"nw":1,"d":"2026-11-11","dq":0,"y":2026,"au":[611,505],"c":0,"cs":0,"bib":"2026arXiv261115398G","v":"","lk":"arXiv:2611.15398","url":"https://arxiv.org/abs/2611.15398","doi":"","tg":{"s":["Quijote-PNG","Non-Quijote simulations"],"d":["Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Non-Quijote simulations"]},"x":-0.2696,"yy":0.347,"p3":[0.0796,-0.1173,-0.5362],"sim":{"k":"e","l":[[329,0.936],[18,0.931],[197,0.929],[25,0.928],[148,0.928]]},"c3":[-132.77,-189.65,-84.46],"c2":[-20.14,-219.79],"k":4,"r":[263,264],"rm":0},{"id":"2611.13542","t":"OASIS: A Fast Dynamical Halo Finding Algorithm","ab":"In recent work (García et al. 2023), we advocated for defining a dynamical halo as the collection of particles that orbit their self-generated potential. Here we introduce the Orbiting-mass ASsIgnment Scheme (OASIS), a fast energy-based algorithm for constructing dynamical halo catalogs. Using single-snapshot information, OASIS achieves $\\simeq 9\\%$ scatter in orbiting mass estimates relative to the SPARTA particle-tracking algorithm. As an illustration of the applications enabled by OASIS, we use the Quijote and Erebos simulation suites to show that the $z=0$ dynamical halo mass function is nearly universal with respect to cosmology, and that it is well described by a modified Press-Schechter form with an effective collapse threshold $δ_{\\rm sc} = 1.54$ at intermediate masses. However, this description fails at high masses.","abx":0,"nw":1,"d":"2026-11-10","dq":0,"y":2026,"au":[91,195,197,94,112,341,641,707],"c":0,"cs":0,"bib":"2026arXiv261113542H","v":"","lk":"arXiv:2611.13542","url":"https://arxiv.org/abs/2611.13542","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Particle snapshots","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Particle snapshots"]},"x":-0.2402,"yy":-0.1761,"p3":[0.2349,-0.2615,-0.0914],"sim":{"k":"e","l":[[168,0.932],[51,0.922],[37,0.919],[318,0.916],[13,0.915]]},"c3":[-44.92,-110.45,355.03],"c2":[-394.45,14.69],"k":7,"r":[],"rm":1},{"id":"2610.00674","t":"ROBIN-PIP: Robust Bayesian Field-Level Inference with Physics-Informed Priors","ab":"Accurately extracting information from galaxy surveys, particularly at non-linear scales, requires increasingly complex and flexible forward models of the observed galaxy distribution. A key component is the galaxy bias relation, which connects the underlying matter distribution to observed galaxies and requires more expressive representations than those currently incorporated into Bayesian field-level inference. Certain parameterized models for this mapping can be overparameterized, with individual parameters carrying no direct physical interpretation, making them challenging to constrain. Our objective is to guide the inference of flexible model parameters towards physically plausible regions of parameter space through physics-informed priors. These priors are derived from high-fidelity simulations, thereby enabling the indirect use of simulations that cannot be integrated directly into gradient-based field-level inference. To this end, we introduce the ROBIN-PIP (RObust Bayesian INference with Physics-Informed Priors) framework. As a proof of concept, we jointly infer the cosmic initial conditions and the parameters of a truncated power-law galaxy bias model for a simulated universe. We integrate ROBIN-PIP into the Bayesian Origin Reconstruction from Galaxies algorithm and benchmark against inference without the simulation-based prior. With the additional prior, posterior standard deviations of the bias model parameters are reduced by up to $20\\%$ and autocorrelation lengths are reduced from $730$-$870$ to $440$-$550$, increasing the effective sample sizes. We find no bias in the recovered initial conditions, demonstrating that ROBIN-PIP guides inference towards physically consistent solutions without compromising the data likelihood and highlighting its potential to incorporate overparameterized models in field-level inference.","abx":0,"nw":1,"d":"2026-09-30","dq":0,"y":2026,"au":[406,589,264,319],"c":0,"cs":0,"bib":"2026arXiv261000674D","v":"","lk":"arXiv:2610.00674","url":"https://arxiv.org/abs/2610.00674","doi":"","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Density fields","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Non-Quijote simulations","Density fields"]},"x":-0.5327,"yy":-0.434,"p3":[0.3082,-0.2333,0.419],"sim":{"k":"e","l":[[134,0.947],[260,0.943],[105,0.94],[188,0.939],[143,0.939]]},"c3":[190.52,3.64,59.85],"c2":[235.57,-144.84],"k":7,"r":[145,146,147,156,174,188,214,260,269,339],"rm":0},{"id":"2610.06710","t":"AI-assisted super-resolution cosmological simulations V: Cosmology-aware super-resolution","ab":"We present a cosmology-aware generative model for super-resolution (SR) of cosmological $N$-body simulations in particle phase space. The model jointly generates displacements and velocities, conditioning a generative adversarial network (GAN) based generator and discriminator on evolved low-resolution (LR) fields and five $Λ$CDM parameters $(Ω_m,Ω_b,h,n_s,σ_8)$. We train a single model on 100 matched low-high resolution pairs from the Quijote Latin-hypercube suite at $z = 0$, mapping $512^3$ to $1024^3$ particles in $1\\,h^{-1}\\,\\mathrm{Gpc}$ boxes. On ten cosmologies excluded from SR training, the model reproduces the broad matter distribution and the cosmological variation of clustering and halo abundances. Over $0.1<k<3\\,h\\,\\mathrm{Mpc}^{-1}$, the mean of the per-cosmology maximum absolute power-spectrum errors is $3.6\\%$, while FoF halo abundances agree with HR to within $15\\%$ in the analyzed mass bins below $10^{14.8}\\,h^{-1}M_\\odot$. Satellite abundances and occupations retain larger, mass-dependent discrepancies. Corrections measured at one near-fiducial cosmology reduce a shared component of these systematic errors when applied to the other nine test cosmologies. A power spectrum based inference test also shows that calibration reduces the mean shifts in all parameters. These results extend our SR model across cosmologies and provide 6D phase space realizations for subsequent studies of non-linear structure and field-level cosmological inference.","abx":0,"nw":1,"d":"2026-10-05","dq":0,"y":2026,"au":[671,509,550,628,240],"c":0,"cs":0,"bib":"2026arXiv261006710Z","v":"","lk":"arXiv:2610.06710","url":"https://arxiv.org/abs/2610.06710","doi":"","tg":{"s":["Latin hypercube"],"d":["Particle snapshots","Halo catalogs","Power spectra"],"m":["Generative models"],"u":[]},"x":-0.4041,"yy":-0.492,"p3":[0.5742,0.0488,0.6971],"sim":{"k":"e","l":[[31,0.968],[137,0.944],[127,0.935],[260,0.933],[16,0.933]]},"c3":[-90.57,-93.03,45.45],"c2":[-60.44,-158.73],"k":1,"r":[31,137,260,332,339],"rm":0},{"id":"2610.04486","t":"Forecasting cosmological constraints from the nonlinear halo density field with Zel'dovich-inspired transform","ab":"The Zel'dovich-inspired (ZI) transform is a local nonlinear transform of the density field that can Gaussianize the late-time matter field and recover information from higher-order $N$-point correlation functions through its power spectrum, with the parameter $η$ controlling the weighting of higher-order information. Using Fisher-matrix analyses of halo catalogs from the Quijote and Quijote-PNG simulations, we study the redshift-space monopole power spectrum of the ZI-transformed halo density field. The joint statistic $P_{\\rm ZI,0}$, constructed from three representative transforms with $η=1$, $10$, and $+\\infty$, yields substantially tighter constraints than the conventional halo power spectrum $P_{\\rm h,0}$ on standard cosmological parameters, the summed neutrino mass, and primordial non-Gaussianity amplitudes, while outperforming the marked power spectrum for many parameters. We further calibrate a scale-dependent noise correction for the ZI power spectrum, with an effective noise amplitude that depends on wavenumber, and find that the correction further tightens the constraints. In particular, the noise-corrected $P_{\\rm ZI,0}$ improves the constraints on $f_{\\rm NL}^{\\rm equil}$, $f_{\\rm NL}^{\\rm ortho}$, $M_ν$, and $n_{\\rm s}$ by factors of $5.6$, $5.5$, $5.2$, and $5.8$, respectively, relative to $P_{\\rm h,0}$. These results demonstrate the potential of ZI power spectra as a complement to standard two-point statistics for extracting nonlinear cosmological information. Our forecasts may be conservative because the halo catalogs have substantially lower number densities than those expected from forthcoming galaxy surveys.","abx":0,"nw":1,"d":"2026-10-03","dq":0,"y":2026,"au":[694,700,272,444,582,693,674],"c":0,"cs":0,"bib":"2026arXiv261004486Z","v":"","lk":"arXiv:2610.04486","url":"https://arxiv.org/abs/2610.04486","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Quijote-PNG"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.276,"yy":0.3806,"p3":[-0.2879,0.3408,-0.1961],"sim":{"k":"e","l":[[62,0.97],[288,0.955],[154,0.955],[242,0.954],[226,0.952]]},"c3":[126.66,26.53,-124.57],"c2":[223.47,-3.58],"k":5,"r":[62,108,154,176,198,228,241,249,257,262,264,278,282,326,339],"rm":0},{"id":"2610.02395","t":"FlashSinkhorn 2: Block-Sparse Entropic Optimal Transport","ab":"Streaming GPU solvers for entropic optimal transport (EOT), such as FlashSinkhorn, avoid storing the dense kernel but still evaluate all $n\\times m$ point pairs in every Sinkhorn iteration. We present \\textbf{FlashSinkhorn~2} (FS2), a solver for squared-Euclidean cost on low-dimensional point clouds that solves large discrete EOT problems to a prescribed marginal residual on a single GPU by coupling two stages. A coarse stage solves on cell centroids, lifts the potentials to every point and, when a sampled marginal check rejects the lift, continues on the centroids, replacing most point-level updates. A block-sparse fine stage then removes the centroid error that coarse updates cannot. Its Morton-ordered blocks support screening and fused tensor-core execution, and a threshold set by the block masses bounds each omitted tile's contribution to every row and column. On synthetic benchmarks, FS2 reaches the target residual on all 32 problems and GeomLoss multiscale on 10. On one A100, FS2 solves discrete EOT between two $1.34\\times10^8$-particle measures from a cosmological $N$-body simulation, at an entropic blur equal to the mean interparticle distance, to an all-particle marginal residual below 0.01 in under 2.5 hours. To our knowledge, it is the largest discrete EOT problem solved to this accuracy within hours. For reproducibility, we release an open-source implementation at https://github.com/ot-triton-lab/flash-sinkhorn","abx":0,"nw":1,"d":"2026-10-01","dq":0,"y":2026,"au":[228,691,475,170],"c":0,"cs":0,"bib":"2026arXiv261002395Y","v":"","lk":"arXiv:2610.02395","url":"https://arxiv.org/abs/2610.02395","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Particle snapshots"],"m":["No ML"],"u":[]},"x":-0.5359,"yy":-0.1928,"p3":[0.5148,-0.336,0.2271],"sim":{"k":"e","l":[[318,0.915],[20,0.913],[22,0.912],[131,0.91],[300,0.909]]},"c3":[-110.69,23.52,99.47],"c2":[-185.78,9.45],"k":6,"r":[339],"rm":0},{"id":"2610.32837","t":"Modelling kNN-CDFs of biased tracers in redshift space using hybrid Lagrangian bias expansion","ab":"Higher-order statistics are becoming increasingly useful in clustering studies of the large-scale structure (LSS) of the universe. The kNN-CDFs are one such higher-order statistic, sensitive to all N-point correlations and easy to compute on data. Utilising their statistical gains for cosmological inference requires modelling them accurately for the tracer of interest. We use the hybrid Lagrangian bias expansion to enable this modelling in redshift space, building and validating the pipeline on Quijote simulations. We show that the kNN-CDFs of a luminous red galaxy (LRG)-like sample can be modelled down to scales as small as r = 10 Mpc/h, with the minimum reliable scale increasing with nearest-neighbour order. Moreover, the model parameters inferred from the kNN-CDFs also describe the galaxy power spectrum P(k), indicating model consistency across the two statistics and the feasibility of combining them. Fisher forecasts for galaxy auto clustering show that combining P(k) and kNN-CDFs improves constraints on all parameters relative to either statistic alone. Relative to P(k), the constraints on $b_3$ improve the most, while those on $σ_8$ and $Ω_m$ improve by factors of 3.5 and 1.7, respectively. Including galaxy-matter cross clustering alongside galaxy auto clustering further improves the Fisher constraints from both P(k) and kNN-CDFs, with their combination yielding the tightest constraints overall. Relative to P(k), the largest improvement from this combination is found for $b_2$, while the constraints on $σ_8$ and $Ω_m$ improve by factors of 4.2 and 1.7, respectively. These results demonstrate the applicability of the hybrid Lagrangian bias framework to model the kNN-CDFs of biased tracers in redshift space, and the potential of combining higher-order and two-point statistics to extract cosmological information.","abx":0,"nw":1,"d":"2026-10-23","dq":0,"y":2026,"au":[198,73],"c":0,"cs":0,"bib":"2026arXiv261032837C","v":"","lk":"arXiv:2610.32837","url":"https://arxiv.org/abs/2610.32837","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Galaxy mocks (HOD)"]},"x":-0.3122,"yy":0.3106,"p3":[0.316,-0.2297,-0.7097],"sim":{"k":"e","l":[[295,0.956],[214,0.949],[245,0.939],[143,0.937],[204,0.934]]},"c3":[-104.86,169.33,-148.86],"c2":[64.45,116.07],"k":2,"r":[42,70,112,186,199,211,247,249,280,295,310,322,334,339],"rm":0},{"id":"2610.18707","t":"Testing the 4-Point Correlation Function as a Probe of Parity Violation with the Quijote-Odd Simulations","ab":"We investigate parity violation searches with the 4-Point Correlation Function (4PCF) using the Quijote and Quijote-Odd halo catalogs. Specifically, we explore the auto- and cross-correlation searching methodologies that have been previously used in the Baryon Oscillation Spectroscopic Survey (BOSS) and the Dark Energy Spectroscopic Instrument (DESI) searches. Although the Quijote-Odd simulations are initialized with a parity-violating primordial trispectrum, we find no statistically detectable parity-odd signal in the halo 4PCF. Instead, we find that the halo measurements are dominated by Poisson noise. We are able to distinguish this noise-dominated behavior from the response expected for a parity-odd signal. These results clarify how parity-sensitive 4PCF statistics respond to noise in a controlled simulation setting.","abx":0,"nw":1,"d":"2026-10-13","dq":0,"y":2026,"au":[664,706,34,590],"c":0,"cs":0,"bib":"2026arXiv261018707O","v":"","lk":"arXiv:2610.18707","url":"https://arxiv.org/abs/2610.18707","doi":"","tg":{"s":["Fiducial","Quijote-Odd (parity-violating)"],"d":["Halo catalogs","Higher-order statistics"],"m":["No ML"],"u":["Fiducial"]},"x":0.1997,"yy":0.8332,"p3":[-0.8557,0.1705,0.0585],"sim":{"k":"e","l":[[81,0.95],[221,0.94],[181,0.927],[257,0.923],[84,0.919]]},"c3":[65.35,-113.44,-124.17],"c2":[84.38,5.62],"k":5,"r":[221,294,339],"rm":0},{"id":"2610.36027","t":"Field-level modeling of halo and galaxy alignments","ab":"We develop an effective field theory (EFT) of intrinsic alignments at the level of spin-2 field fluctuations of large-scale structure tracers, such as the shapes of galaxies and dark matter halos. Our perturbative model includes the non-linear treatment of the Zel'dovich displacement, and contains all necessary shape operators through the third order. We apply our field-level model to the full 3D distribution of galaxy shapes, whose sky projections are a known contaminant of cosmic shear measurements. Our field-level EFT model achieves a better description of the helicity fields of dark matter halo shapes than the standard non-linear alignment (NLA) and tidal torquing + tidal alignment (TATT) models in the literature, as evidenced by improved correlations with the simulations' initial conditions. We perform precision measurements of field-level bias parameters by means of a generalized least-squares problem, for which we derive an optimal estimator and analytic covariance matrices. We measure the full set of linear, quadratic, and cubic shape bias coefficients as a function of halo mass in the $\\texttt{Quijote}$ N-body simulations. We then study the intrinsic alignments of galaxies in the $\\texttt{FLAMINGO}$ hydrodynamical simulation, focusing on observationally relevant samples: spirals, ellipticals, luminous red galaxies (LRG) and emission-line galaxies (ELG). We detect linear and nonlinear alignment coefficients at high significance for LRG, spiral and elliptical galaxies. We also find evidence for non-zero density-weighted tidal bias coefficient of the simulated ELG. This work supports the notion that EFT-based models of alignments will be paramount in optimally extracting constraints from future shape correlations, and lays the foundation for the development of simulation-based priors for future galaxy shape samples.","abx":0,"nw":1,"d":"2026-10-26","dq":0,"y":2026,"au":[484,465,309],"c":0,"cs":0,"bib":"2026arXiv261036027K","v":"","lk":"arXiv:2610.36027","url":"https://arxiv.org/abs/2610.36027","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Density fields"]},"x":-0.0347,"yy":0.5022,"p3":[-0.1635,-0.3608,-0.0532],"sim":{"k":"e","l":[[11,0.941],[338,0.935],[146,0.935],[148,0.934],[121,0.934]]},"c3":[128.99,-113.43,52.91],"c2":[181.04,-184.1],"k":2,"r":[68,121,133,146,339],"rm":0},{"id":"2610.30267","t":"Density-split analyses of the pairwise kinetic Sunyaev-Zeldovich effect","ab":"We consider the dependence of the kinetic Sunyaev-Zeldovich (kSZ) effect on the environments of foreground cosmological structures. Standard pairwise kSZ estimators exploit the fact that galaxies below separations of $\\sim 200\\,h^{-1}{\\rm M}_\\odot$ fall towards each other on average, yielding a negative mean pairwise kSZ signal. However, this signal is the residual from a near-cancellation between outflows from underdense regions and infall towards overdensities giving a large variance in the pairwise velocity distribution and hence a low signal-to-noise ratio for the mean kSZ signal. This effect is especially marked at the largest scales, where the pairwise velocity distribution becomes more symmetric about zero. We show that splitting galaxies according to their local overdensity allows the convergence and divergence flows to be separated, yielding pairwise kSZ signals of opposing sign, with a reduction in variance for each subset. We use simulations to perform a detailed analysis of this phenomenon, comparing the cosmological information content in the global pairwise kSZ signal with our new density-split pairwise kSZ estimator. We consider galaxy catalogues comparable to datasets from the Dark Energy Spectroscopic Instrument, together with cosmic microwave background instrumental noise characteristic of recent and planned ground-based experiments. We predict that the density-split pairwise kSZ will increase the significance of detection by only a modest factor; nevertheless, we expect improvements by factors of respectively 11 and 4 in constraining $σ_8$ and $Ω_{\\rm m}$ when using the combination of Dark Energy Spectroscopic Instrument and Simons Observatory Large Aperture Telescope surveys.","abx":0,"nw":1,"d":"2026-10-21","dq":0,"y":2026,"au":[232,72,678,340],"c":0,"cs":0,"bib":"2026arXiv261030267R","v":"","lk":"arXiv:2610.30267","url":"https://arxiv.org/abs/2610.30267","doi":"","tg":{"s":["Fiducial"],"d":["Halo catalogs","Weak lensing & 2D maps"],"m":["Fisher forecasts","No ML"],"u":["Fisher forecasts"]},"x":-0.1312,"yy":0.3748,"p3":[0.2406,-0.1045,-0.3314],"sim":{"k":"e","l":[[100,0.946],[13,0.928],[197,0.922],[144,0.92],[30,0.916]]},"c3":[81.84,28.87,130.98],"c2":[-46.52,-83.31],"k":2,"r":[30,100,164,339],"rm":0},{"id":"2610.23825","t":"ENFR: Evidence Networks with Flow-Matched References for Amortized Simulation-Based Model Inference","ab":"The evidence, $\\mathcal{Z} = p(x | \\mathcal{M})$, of a data-generating model $\\mathcal{M}$ is a powerful tool in Bayesian frameworks: it enables model inference, model misspecification tests, and goodness-of-fit assessment as an alternative to standard discrepancy statistics, e.g. $χ^2$. While versatile, the evidence is notoriously difficult to compute, even when the likelihood is available. In both likelihood-based and simulation-based inference, estimating $\\mathcal{Z}$ provides an immediate solution to high-dimensional goodness-of-fit or model misspecification tests: using $\\mathcal{Z}(x)$ as the test statistic induces a minimum-volume level-$α$ test. Such tests are essential to assess model fidelity, which is necessary to trust simulation-based parameter inference. Existing learned approaches largely target Bayes factors, which only measure evidence ratios. Instead, we provide accurate, fast, and amortized estimates of the absolute evidence. We present ENFR: Evidence Networks with Flow-matched References. Building on the Evidence Network framework of Jeffrey & Wandelt (2024), the proposed method first learns Bayes factors with respect to a flow-matched reference, from which the absolute evidence is recovered. We show improvement in estimation of $\\mathcal{Z}$ over the flow-based baseline in all applications considered and the best performance of all density estimation methods considered in our benchmarks. We furthermore introduce and provide the proof for an architecture that jointly learns the individual evidences of a set of models $\\{\\mathcal{M}_i\\}$. We demonstrate the performance and scaling behavior of these approaches on data from a variety of scientific applications.","abx":0,"nw":1,"d":"2026-10-16","dq":0,"y":2026,"au":[367,312,118,483,95,240,609,338],"c":0,"cs":0,"bib":"2026arXiv261023825L","v":"","lk":"arXiv:2610.23825","url":"https://arxiv.org/abs/2610.23825","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Power spectra"],"m":["Simulation-based inference","Normalizing flows","Other ML"],"u":["Halo catalogs","Power spectra"]},"x":0.0611,"yy":-0.641,"p3":[0.1235,-0.2009,0.4662],"sim":{"k":"e","l":[[124,0.927],[136,0.909],[52,0.904],[60,0.903],[127,0.901]]},"c3":[-160.68,-52.89,29.68],"c2":[-148.44,-103.86],"k":6,"r":[339],"rm":0},{"id":"2609.24948","t":"Two-dimensional weak lensing shear for cluster mass, concentration, ellipticity and miscentering estimation","ab":"The effects of weak gravitational lensing induced by clusters of galaxies makes it possible to constrain their dark matter distribution. In general mass estimates from weak lensing are made by compressing the two-dimensional shear-field into one-dimension. In this work we build a forward model of the two-dimensional reduced-shear field around a galaxy cluster, including the non-Gaussian correlated large-scale structure from N-body simulations, the uncorrelated line-of-sight structure, cluster miscentering and ellipticity. We then use simulation-based inference to obtain posteriors on the cluster mass, concentration, miscentering and ellipticity from the full field. The two-dimensional approach leads to improvements on cluster mass constraints by up to 20\\%. We show that this is due to a better treatment of the spatially correlated noise across the shear field. There is also significant improvements on the cluster concentration and miscentering. Whilst improvements are also made to the estimation of cluster ellipticity, the constraints are still prior dependent for these individual cluster constraints. We also quantify the impact of the line-of-sight structure on the constraints. Neglecting it underestimates the mass uncertainty by up to a factor of $2$ for the most massive clusters.","abx":0,"nw":1,"d":"2026-09-21","dq":0,"y":2026,"au":[111,436,143],"c":0,"cs":0,"bib":"2026arXiv260924948M","v":"","lk":"arXiv:2609.24948","url":"https://arxiv.org/abs/2609.24948","doi":"","tg":{"s":["Fiducial"],"d":["Particle snapshots","Weak lensing & 2D maps"],"m":["Simulation-based inference"],"u":["Particle snapshots"]},"x":0.0365,"yy":0.0829,"p3":[-0.2276,-0.1753,0.1987],"sim":{"k":"e","l":[[8,0.941],[198,0.931],[141,0.93],[119,0.929],[244,0.929]]},"c3":[-138.42,-1.9,83.54],"c2":[-171.64,-67.13],"k":0,"r":[339],"rm":0},{"id":"2609.04313","t":"It's All About the Environment: Local $f_{\\rm NL}$ from a Dark Matter Conditioned Multitracer Analysis","ab":"Primordial non-Gaussianity (PNG) offers a powerful test of inflationary physics beyond the simplest single-field scenarios. In large-scale structure, biased tracers respond to local-type PNG with a distinctive scale-dependent signature that is strongest on large scales, but single-tracer measurements are fundamentally limited by cosmic variance. Multitracer methods can mitigate this limitation; however, many existing proposals require splitting tracers using a wide range of halo masses which are often not available, or using secondary halo properties that are not directly observable. Here we develop and validate an alternative strategy based on splitting a tracer sample by its large-scale dark matter environment. We derive a theoretical framework for the $f_{\\rm NL}$ response of environmentally selected tracers and test it in $N$-body simulations, confirming consistency between separate-universe predictions and direct power-spectrum inference. To enable observational implementation, we show that a simple linear-theory reconstruction of the dark matter environment from halos yields unbiased $f_{\\rm NL}$ constraints in $\\mathtt{Quijote}$ simulations. Forecasts for the DESI LRG sample indicate that environmental multitracing can improve constraints on local PNG by a factor of 2-3 relative to conventional single-tracer analyses for high density tracers, comparable to gains achieved when halo formation time is assumed to be perfectly known. We develop an analytic model explaining why the gains are smaller for a halo environment split and why separate-universe predictions fail in this case. Unlike approaches that require modeling assembly bias or inferring secondary halo properties, our method relies only on linear theory. These results establish environmental multitracer techniques as a promising route toward $σ(f_{\\rm NL})\\sim 1$ with upcoming galaxy surveys.","abx":0,"nw":1,"d":"2026-09-03","dq":0,"y":2026,"au":[355,638],"c":0,"cs":0,"bib":"2026arXiv260904313A","v":"","lk":"arXiv:2609.04313","url":"https://arxiv.org/abs/2609.04313","doi":"","tg":{"s":["Quijote-PNG"],"d":["Density fields","Halo catalogs","Power spectra"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Quijote-PNG","Density fields"]},"x":0.2952,"yy":0.6494,"p3":[-0.6282,0.092,-0.0052],"sim":{"k":"e","l":[[203,0.949],[62,0.945],[133,0.945],[46,0.943],[68,0.943]]},"c3":[-81.21,-146.87,85.1],"c2":[36.16,-238.2],"k":5,"r":[46,106,133,193,264,339],"rm":0},{"id":"2609.07976","t":"Non-linear Pairwise Velocities as a Cosmological Probe","ab":"Peculiar velocities trace gravitational dynamics directly, complementing density-based clustering as wide-field spectroscopic surveys (DESI, Euclid, PFS) and kinetic Sunyaev-Zel'dovich (kSZ) measurements enter the precision era. Observational analyses of pairwise velocities and the pairwise kSZ signal remain largely restricted to linear and quasi-linear scales ($\\gtrsim20-30$ $h^{-1}Mpc$), despite substantial cosmological information available at smaller separations. We present a simulation-calibrated likelihood for $v_{12}(r,a)$, built on the exact pair conservation equation and PyCAMB HMcode-2020 non-linear clustering, and validate it against the QUIJOTE and TNG300-3 suites across resolution, particle sampling, box size, and redshift. Using QUIJOTE, we show that extending the fit to non-linear scales tightens the $1σ$ uncertainty on $Ω_\\mathrm{m}$ and $σ_8$ by $74\\%$ and $81\\%$ at $z=0.5$ ($r_{\\rm min}=4$ $h^{-1}Mpc$), and by $70\\%$ and $74\\%$ at $z=0$ ($r_{\\rm min}=8$ $h^{-1}Mpc$), relative to the linear-regime baseline ($r_{\\rm min}=50$ $h^{-1}Mpc$) (all at fixed $r_{max}=140$ $h^{-1}Mpc$); $σ(fσ_8)$ tightens by up to $86\\%$, and the joint $Ω_\\mathrm{m}$-$fσ_8$ Figure-of-Merit improves by up to $9.1\\times$ relative to the same baseline. These constraints are conditional on $h$ fixed at its QUIJOTE fiducial value, due to a near-degenerate response with $σ_8$; jointly sampling $h$ shifts and widens them substantially. This framework provides a validated route to exploiting that information in upcoming direct peculiar-velocity, redshift-space, and kSZ analyses.","abx":0,"nw":1,"d":"2026-09-07","dq":0,"y":2026,"au":[430,68,533,666],"c":0,"cs":0,"bib":"2026arXiv260907976J","v":"","lk":"arXiv:2609.07976","url":"https://arxiv.org/abs/2609.07976","doi":"","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Particle snapshots","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Halo catalogs"]},"x":0.2058,"yy":0.1334,"p3":[0.3939,-0.0327,-0.578],"sim":{"k":"e","l":[[80,0.945],[307,0.945],[100,0.945],[28,0.93],[243,0.928]]},"c3":[113.59,-142.51,-26.42],"c2":[-129.19,-118.46],"k":0,"r":[339],"rm":0},{"id":"2609.18221","t":"Void probability function in the Quijote simulations","ab":"The void probability function (VPF) is the likelihood of finding no tracers (galaxies or dark-matter haloes) within a given volume and is sensitive to the large-scale matter distribution. We investigate the VPF of dark matter haloes and galaxies using the \\textsc{Quijote} N-body simulations across a range of cosmological models, including $Λ$CDM and several extensions. We examine its dependence on cosmology, redshift, halo mass, morphology, and sample dilution, and compare the results with theoretical predictions from the geometric hierarchical (GH) and negative binomial (NB) models. We find that the halo VPF is sensitive to cosmology and halo mass and follows the GH model at $z=0$, with $Λ$CDM showing the smallest deviation and the massive-neutrino cosmology the largest. At higher redshift and stronger sample dilution, the VPF departs from the GH model and approaches the NB model. The dependence on halo mass varies with cosmology, with low-mass haloes showing the largest deviations in $Λ$CDM, while intermediate- and high-mass haloes show stronger deviations in the modified-gravity scenario. In redshift space, the VPF shifts toward the NB model, with primordial non-Gaussianity producing the largest deviations. For galaxies, the VPF depends on morphology and cosmology, with ellipticals following the GH model and spirals following the NB model. We also find that cosmic variance introduces non-negligible scatter in the VPF measurements. Overall, these results suggest that the VPF could be useful as a computationally efficient probe to distinguish extensions of the standard $Λ$CDM model in upcoming large-volume galaxy surveys.","abx":0,"nw":1,"d":"2026-09-16","dq":0,"y":2026,"au":[596],"c":0,"cs":0,"bib":"2026PhRvD.114f3513B","v":"Physical Review D","lk":"arXiv:2609.18221","url":"https://arxiv.org/abs/2609.18221","doi":"10.1103/w3g9-n7cw","tg":{"s":["Fiducial","Massive neutrinos","Quijote-PNG","Quijote-MG","Non-Quijote simulations"],"d":["Halo catalogs","Void catalogs","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Massive neutrinos","Quijote-MG","Quijote-PNG","Non-Quijote simulations","Void catalogs"]},"x":0.1478,"yy":-0.08,"p3":[0.219,0.0895,-0.2976],"sim":{"k":"e","l":[[308,0.946],[339,0.943],[331,0.94],[334,0.937],[113,0.936]]},"c3":[-0.55,-49.61,-114.17],"c2":[62.25,-24.25],"k":8,"r":[264,312,339],"rm":0},{"id":"2609.05607","t":"Analytic bispectrum covariance for galaxy survey cosmology","ab":"The bispectrum of galaxy distribution remains an underutilized statistic in cosmological data analysis. This can be attributed to mathematical and computational challenges associated with a proper modeling of the signal and its covariance. While recent theoretical advances have made it possible to analytically model the bispectrum signal and covariance using perturbation theory, a fully non-Gaussian analytical treatment of the covariance for a realistic survey with window remains elusive. The full bispectrum covariance of observed galaxies is a non-Gaussian six-point function with each of its legs convolved with a complex window function. Although it has so far proven intractable, the problem is well-posed. In this article, we present the derivation, implementation, and validation of a numerical routine for the analytic calculation of the bispectrum covariance for a spherical window, carried out by a large language model (LLM). The derivation uncovered terms that vanish in the windowless case but that dominate the covariance for triangles with survey scale modes. As a development benchmark for the implementation, we used the sample covariance of the halo bispectrum measured from 6000 fiducial Quijote halo catalogs in real space. Over several iterations of refinement, the LLM converged on a regime-specific numerical scheme for the covariance matrix calculation, mixing exact and approximate approaches, resulting in a highly optimized, tractable and accurate covariance across scales and shapes, using only tree-level models for the input polyspectra. Closing the loop still required human expertise, which illustrates what human-AI collaboration in research may look like in the near term.","abx":0,"nw":1,"d":"2026-09-04","dq":0,"y":2026,"au":[639,277,500],"c":0,"cs":0,"bib":"2026arXiv260905607G","v":"","lk":"arXiv:2609.05607","url":"https://arxiv.org/abs/2609.05607","doi":"","tg":{"s":["Fiducial"],"d":["Halo catalogs","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.2595,"yy":0.3221,"p3":[0.145,0.1098,-0.3983],"sim":{"k":"e","l":[[232,0.945],[87,0.944],[312,0.943],[223,0.943],[336,0.939]]},"c3":[4.6,-190.95,-98.6],"c2":[108.0,-125.34],"k":7,"r":[223,229,285,339],"rm":0},{"id":"2609.09950","t":"Learning cosmic web environments with diffusion models","ab":"The cosmic web, consisting of an intricate network of voids, walls, filaments, and nodes, encodes key information about structure formation and the cosmological parameters that govern it. In the era of high-precision cosmology, large ensembles of numerical simulations are required to analyse next-generation galaxy surveys, motivating the use of generative models to circumvent their high computational cost. While they have shown promise in emulating high-fidelity cosmic web simulations, their ability to capture distinct cosmic web environments remains largely unexplored. For this study, we trained a diffusion model on the Quijote N-body simulation suite to investigate the semantic information learnt by its self-attention maps. Using statistical estimators such as the Dice coefficient and cross-power spectra, we quantified the correspondence between attention maps and cosmic web environments defined by the T-Web classifier. We find that attention maps of varying spatial resolutions across different layers capture overdense and underdense structures in distinct ways, exhibiting strong positive correlations and anti-correlations with both the overall matter distribution and individual cosmic web environments. Moreover, the diffusion model predominantly encodes cosmological information at intermediate-to-large spatial scales, indicating that attention maps primarily capture globally coherent structures. Our results show that, beyond accurately reproducing two-point statistics, diffusion models learn a multi-scale representation of the cosmic web through self-attention, including non-Gaussian information.","abx":0,"nw":1,"d":"2026-09-09","dq":0,"y":2026,"au":[457,634,474,82],"c":1,"cs":0,"bib":"2026A&A...714A.388N","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2609.09950","url":"https://arxiv.org/abs/2609.09950","doi":"10.1051/0004-6361/202660142","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Power spectra"],"m":["Generative models"],"u":[]},"x":-0.0104,"yy":-0.5599,"p3":[0.1204,0.2157,0.4579],"sim":{"k":"e","l":[[184,0.945],[189,0.945],[235,0.944],[21,0.942],[108,0.94]]},"c3":[67.72,123.72,-43.69],"c2":[131.96,-2.27],"k":1,"r":[107,282,339],"rm":0},{"id":"2608.26276","t":"$\\texttt{SPINE}$: Symbolic Models to Predict the Evolution of the $Λ$CDM Nonlinear Power Spectrum","ab":"We present $\\texttt{SPINE}$ and $\\texttt{SPINEX}$, a pair of analytical emulators developed to predict the nonlinear power spectrum based on its linear counterpart and several essential cosmological parameters within the range of $0.01\\;h\\;\\mathrm{Mpc}^{-1} <k< 2\\;h\\;\\mathrm{Mpc}^{-1} $. The primary difference between the two models is their parameterisation. Our methodology is grounded in the mapping originally proposed by Peacock and Dodds (1996). Both models are defined by clear mathematical expressions derived from symbolic regression, a machine learning technique that utilises genetic programming to identify analytical equations that accurately represent the underlying data. This approach provides a more interpretable and efficient alternative to conventional numerical methods that should also exhibit superior extrapolation behaviour beyond the training range. The emulators have been trained on the $Λ$CDM Quijote Latin Hypercube simulations. We provide fits for both emulators across three distinct scenarios: cosmologies within 20$σ$ of the Planck-2018 observations, a designated fiducial cosmology, and a broader range of cosmologies sampled from the Quijote simulations. Our findings indicate that $\\texttt{SPINE}$ and $\\texttt{SPINEX}$ maintain an accuracy of better than 5% in the majority of cases. These emulators provide a rapid alternative to numerical methods, and future initiatives will focus on developing expressions that incorporate galaxy bias and redshift-space distortions. This advancement aims to enhance the modelling of redshift space power spectra across multiple redshifts, enabling their application in large-scale cosmological surveys.","abx":0,"nw":1,"d":"2026-08-26","dq":0,"y":2026,"au":[421,161,71,373,432,164],"c":0,"cs":0,"bib":"2026MNRAS.552g1647C","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2608.26276","url":"https://arxiv.org/abs/2608.26276","doi":"10.1093/mnras/stag1647","tg":{"s":["Latin hypercube"],"d":["Power spectra"],"m":["Emulators & regression ML","Symbolic regression"],"u":[]},"x":0.0467,"yy":-0.4947,"p3":[0.2476,0.658,0.0513],"sim":{"k":"e","l":[[183,0.962],[158,0.947],[135,0.946],[35,0.94],[97,0.94]]},"c3":[-188.3,18.69,-13.46],"c2":[-168.63,106.24],"k":7,"r":[135,183,339],"rm":0},{"id":"2608.26572","t":"Approximating the peculiar velocity distribution of dark matter halos with Tsallis statistics","ab":"Dark matter halos, which host galaxies and galaxy clusters, have peculiar velocities far from thermal equilibrium. Characterizing the nonlinear and non-Gaussian features of this velocity distribution improves our understanding of the gravitational evolution of the cosmic web and supports related cosmological applications. We endeavor to establish a connection between the peculiar velocity distribution of halos and nonequilibrium statistical mechanics, with the objective of obtaining a model that is both concise and accurate for practical applications. We extracted halo samples from large N-body simulations and performed maximum-likelihood fits to the peculiar velocity distributions using a two-parameter Tsallis model, derived from non-extensive statistical mechanics. On the theoretical side, we reformulated the halo distribution in the superstatistics framework by means of a generalized Gram-Charlier expansion based on the gamma distribution. For halo peculiar velocities below 1000 km/s, the Tsallis model achieves 5 percent accuracy over z=0-2, with performance improving toward lower redshifts. Our results show that the halo velocity distribution becomes increasingly non-Gaussian and departs further from equilibrium over time. The best-fit parameters depend only weakly on mass, though low-mass halos exhibit slightly stronger non-Gaussianity. The two parameters, especially the velocity dispersion, offer promising probes of cosmological parameters. Theoretically, we find that in general the halo peculiar velocity distribution function is expressible as a superposition of a series of Tsallis distribution functions, while simulation results demonstrate that the zeroth-order approximation, namely a single Tsallis function, already achieves sufficient accuracy.","abx":0,"nw":1,"d":"2026-08-27","dq":0,"y":2026,"au":[356,467],"c":0,"cs":0,"bib":"2026A&A...714A.104P","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2608.26572","url":"https://arxiv.org/abs/2608.26572","doi":"10.1051/0004-6361/202661215","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.0525,"yy":0.302,"p3":[0.0397,-0.0591,-0.7438],"sim":{"k":"e","l":[[80,0.935],[109,0.933],[0,0.931],[25,0.928],[148,0.926]]},"c3":[137.86,-104.08,17.37],"c2":[-110.34,1.73],"k":2,"r":[339],"rm":0},{"id":"2607.09116","t":"Climbing the $N$-point Ladder Part I: Information in the Higher-Order Configuration-Space Clustering of Dark Matter Halos","ab":"We quantify the information content of the configuration-space two-, three-, and connected four-point correlation functions of Quijote dark-matter haloes at $z=0$ and fixed number density. We build Fisher forecasts for $\\{Ω_m, Ω_b, h, n_s, σ_8, M_ν\\}$ in real and redshift space from ${\\sim}38{,}000$ GPU-accelerated $N$-point measurements. Treating the statistics as a ladder, $\\mathrm{2PCF} \\rightarrow +\\mathrm{3PCF} \\rightarrow +ζ^{(4)}_{\\mathrm{conn}}$, we report the information gained at each rung. The 3PCF supplies most of the accessible higher-order information: it tightens every parameter, most strongly $σ_8$ and $M_ν$, whose degeneracy it partially breaks, by factors of $1.6$--$6.3$ over the redshift-space $\\{ξ_0,ξ_2\\}$ baseline with per-parameter gains consistent with those of the Fourier-space halo bispectrum on the same simulations. The 3PCF gains persist under conservative, modelling-motivated scale cuts: restricted to the tree-level-validated regime with minimum triangle side $\\ge40\\,h^{-1}{\\rm Mpc}$, it still improves $M_ν$ by $3.9\\times$. The connected 4PCF adds a further $\\sim1.2$--$1.5\\times$, an increment insensitive to whether the quadrupole is included in the baseline but traceable to small-scale configurations with sides $\\lesssim30\\,h^{-1}{\\rm Mpc}$. This rung-to-rung increment is stable against derivative-sample noise and compression regularization, whereas the absolute constraints remain limited by the finite simulation ensembles and are reported as preliminary. The configuration-space ladder thus offers an independent and complementary route to the higher-order information probed by the Fourier-space poly-spectra.","abx":0,"nw":1,"d":"2026-07-10","dq":0,"y":2026,"au":[605,148,293],"c":1,"cs":0,"bib":"2026JCAP...09..139K","v":"","lk":"arXiv:2607.09116","url":"https://arxiv.org/abs/2607.09116","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.0775,"yy":0.4827,"p3":[-0.05,-0.1497,-0.2289],"sim":{"k":"e","l":[[143,0.937],[46,0.936],[309,0.934],[20,0.933],[237,0.932]]},"c3":[59.19,67.56,-217.86],"c2":[95.61,190.93],"k":2,"r":[20,61,167,227,291,304,308,312,322,331,336,339],"rm":0},{"id":"2607.06604","t":"Fast Graph-based Higher-Order Clustering Statistics on the GPU","ab":"We present a significant update to GRAMSCI (GRAph Made Statistics for Cosmological Information; Sabiu et al. 2019), an algorithm for the fast computation of the general $N$-point spatial correlation function of any discrete point set. Version 2 adds several features. We replace the binary-search inner loop ($O(m\\log m)$ per hub-spoke pair, $m$ being the mean neighbor count) with a merge-walk algorithm that reduces the inner loop to $O(m)$. We implement a parity-decomposed 4pCF that separates the signal into even and odd channels. We estimate the disconnected 4pCF internally on the same graph to return the connected 4pCF. We add a Python/NumPy interface to the Fortran engine. Principally, we present a GPU port of the full query engine (OpenACC): the 3pCF, 4pCF, and parity-decomposed 4pCF kernels run on a single consumer GPU with measured speedups of $2.6\\times$ (3pCF) to $9\\times$ (4pCF) over a 64-thread CPU node, and out-of-core tiling handles graphs exceeding device memory. We measure a $9\\times10^9$-edge BAO-scale 3pCF on a 24 GB card with $\\sim 20\\%$ overhead. We validate the code against its CPU reference, against analytic injection tests, and on exactly solvable random fields (a non-Gaussian multiplicative cascade and a Gaussian field, whose full and connected 4pCF the estimators reproduce without bias), and demonstrate BAO-scale applications on the DESI DR1 LRG sample (the 3pCF and the full and connected 4pCF over the complete configuration space, both to 150 $h^{-1}$ Mpc).","abx":0,"nw":1,"d":"2026-07-07","dq":0,"y":2026,"au":[148],"c":1,"cs":0,"bib":"2026arXiv260706604S","v":"","lk":"arXiv:2607.06604","url":"https://arxiv.org/abs/2607.06604","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Higher-order statistics"],"m":["No ML"],"u":["Halo catalogs"]},"x":0.1636,"yy":-0.0381,"p3":[0.3396,-0.3522,0.0082],"sim":{"k":"e","l":[[87,0.936],[173,0.934],[22,0.933],[19,0.933],[322,0.933]]},"c3":[22.15,-54.16,-180.89],"c2":[83.7,55.46],"k":2,"r":[19,221,339],"rm":0},{"id":"2607.27320","t":"Emulating Cosmic Structure Formation with a Lagrangian Neural Cellular Automaton","ab":"Field-level inference of cosmological initial conditions from galaxy surveys requires a forward model that is simultaneously accurate in the non-linear regime, computationally efficient, and fully differentiable. Traditional N-body simulations are accurate but computationally prohibitive for iterative inference, while approximate solvers like Lagrangian Perturbation Theory (LPT) fail to capture the knotty halo-forming dynamics of the cosmic web at late times. We introduce the \\textit{Lagrangian Neural Cellular Automaton} (LNCA), a hybrid deep learning framework that can be applied to emulate structure formation as a local, iterative dynamical process on a comoving lattice. Unlike convolutional emulators which map fixed grids in a single pass, the LNCA operates in the Lagrangian frame, iteratively advecting the computational graph itself to follow the flow of mass. By training the network to learn only the \\textit{residual} displacement corrections to the Zeldovich approximation, we achieve high-fidelity emulation of the non-linear physics while guaranteeing accuracy at large scales. We further constrain our model to produce complete trajectories, not just final states, by adopting an equivariant cellular automaton architecture, which recurrently iterates on its internal states to yield a dynamic history. The resulting update rule acts on a single fixed neighborhood, is translationally and rotationally equivariant, and is integrated over discrete substeps to yield trajectories, making it a differentiable forward model for reconstructing the initial conditions of the universe from lightcone data. We train our model to emulate the real-space matter distributions of a diverse set of N-body simulations from the Quijote suite, for a range of redshifts and cosmologies, given only the initial conditions.","abx":0,"nw":1,"d":"2026-07-29","dq":0,"y":2026,"au":[144,93,498],"c":0,"cs":0,"bib":"2026arXiv260727320J","v":"arXiv.org","lk":"arXiv:2607.27320","url":"https://arxiv.org/abs/2607.27320","doi":"10.48550/arXiv.2607.27320","tg":{"s":["Latin hypercube"],"d":["Particle snapshots"],"m":["Graph neural networks","Emulators & regression ML","Other ML"],"u":["Latin hypercube","Graph neural networks"]},"x":-0.5109,"yy":-0.4458,"p3":[0.4076,-0.0239,0.6461],"sim":{"k":"e","l":[[260,0.957],[156,0.948],[261,0.943],[16,0.942],[31,0.94]]},"c3":[68.35,-42.38,-34.22],"c2":[91.65,-95.16],"k":1,"r":[156,188,244,260,286,318,332,339],"rm":0},{"id":"2607.23494","t":"Hermes - Towards an Optimal High-Performance Algorithm for Cosmic Statistics of Large Data Sets","ab":"We present Hermes, an in situ multiresolution framework for efficient and flexible measurements of cosmic large-scale-structure statistics from discrete catalogues. Hermes replaces conventional ex situ counting of particle tuples with algebraic operations among window-filtered continuous fields. A discrete point distribution is first reconstructed as a continuous density field in a compact scaling-function representation, in which two- and higher-point statistics are formulated as spatial products of locally filtered fields. This formulation expresses conventional binning for counts-in-cells and two- and higher-point correlation functions through window functions. Changing the window kernels defines generalised statistics without redesigning the estimator. We further introduce PyHermes, an open-source Python implementation of this framework, combining multiresolution field reconstruction with FFT-based window convolution, MPI/thread parallelism, and GPU acceleration for high-order field contractions. The framework supports a broad range of measurements, including isotropic and anisotropic two-point statistics, marked correlations, standard and multipole three-point functions, filtered statistics, and Fourier-space differential operators for constructing derived physical fields. Using halo catalogues from cosmological N-body simulations, we demonstrate PyHermes through a range of clustering statistics and use benchmarks to quantify its computational efficiency and scalability for large-scale data sets. By separating field representation from statistical windows, Hermes provides a unified computational framework in which a single reconstructed field can be reused for a wide range of standard and customised cosmic statistics. This field-window architecture enables scalable analysis of the large data sets expected from current and future galaxy surveys.","abx":0,"nw":1,"d":"2026-07-26","dq":0,"y":2026,"au":[399,620,624,329,673,658,715,583,656,678],"c":0,"cs":0,"bib":"2026arXiv260723494F","v":"","lk":"arXiv:2607.23494","url":"https://arxiv.org/abs/2607.23494","doi":"","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["No ML"],"u":["Redshift space"]},"x":0.0822,"yy":-0.2613,"p3":[0.6603,-0.2052,-0.2084],"sim":{"k":"e","l":[[322,0.939],[20,0.933],[152,0.932],[318,0.928],[112,0.926]]},"c3":[4.79,39.83,-236.09],"c2":[-19.2,182.2],"k":2,"r":[96,143,152,211,249,282,290,294,308,309,326,328,331,333,339],"rm":0},{"id":"2607.26021","t":"Weighted Webs: Morphology-Informed Marked Fields","ab":"The morphology of the cosmic web formed by the late-time matter distribution encodes c
