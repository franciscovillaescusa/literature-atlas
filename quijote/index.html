r field can be modeled given a set of low-redshift HEFT component fields and bias parameter values. These are the same ingredients needed to predict the two-point clustering. For a specific sample of halos, we show that both the two-point clustering \\textit{and} the $k{\\rm NN}$-${\\rm CDF}$s can be well-fit on quasi-linear scales ($\\gtrsim 20 h^{-1}{\\rm Mpc}$) by the second-order HEFT formalism with the \\textit{same values} of the bias parameters, implying that joint modeling of the two is possible. Finally, using a Fisher matrix analysis, we show that including $k{\\rm NN}$-${\\rm CDF}$ measurements over the range of allowed scales in the HEFT framework can improve the constraints on $σ_8$ by roughly a factor of $3$, compared to the case where only two-point measurements are considered. Combining the statistical power of $k{\\rm NN}$ measurements with the modeling power of HEFT, therefore, represents an exciting prospect for extracting greater information from small-scale cosmological clustering.","abx":0,"nw":0,"d":"2021-07-21","dq":0,"y":2021,"au":[73,484,631],"c":34,"cs":0,"bib":"2022MNRAS.511.2765B","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2107.10287","url":"https://arxiv.org/abs/2107.10287","doi":"10.1093/mnras/stac193","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.4081,"yy":0.2105,"p3":[0.4763,-0.2466,-0.6972],"sim":{"k":"e","l":[[6,0.956],[214,0.955],[143,0.94],[247,0.939],[322,0.938]]},"c3":[-142.99,57.25,-187.99],"c2":[-58.61,97.08],"k":2,"r":[280,298,310,312,322,334,336,339],"rm":0},{"id":"2107.08054","t":"The reach of next-to-leading-order perturbation theory for the matter bispectrum","ab":"We provide a comparison between the matter bispectrum derived with different flavours of perturbation theory at next-to-leading order and measurements from an unprecedentedly large suite of $N$-body simulations. We use the $χ^2$ goodness-of-fit test to determine the range of accuracy of the models as a function of the volume covered by subsets of the simulations. We find that models based on the effective-field-theory (EFT) approach have the largest reach, standard perturbation theory has the shortest, and `classical' resummed schemes lie in between. The gain from EFT, however, is less than in previous studies. We show that the estimated range of accuracy of the EFT predictions is heavily influenced by the procedure adopted to fit the amplitude of the counterterms. For the volumes probed by galaxy redshift surveys, our results indicate that it is advantageous to set three counterterms of the EFT bispectrum to zero and measure the fourth from the power spectrum. We also find that large fluctuations in the estimated reach occur between different realisations. We conclude that it is difficult to unequivocally define a range of accuracy for the models containing free parameters. Finally, we approximately account for systematic effects introduced by the $N$-body technique either in terms of a scale- and shape-dependent bias or by boosting the statistical error bars of the measurements (as routinely done in the literature). We find that the latter approach artificially inflates the reach of EFT models due to the presence of tunable parameters.","abx":0,"nw":0,"d":"2021-07-16","dq":0,"y":2021,"au":[171,149,205,442,56,54,645],"c":28,"cs":0,"bib":"2022MNRAS.512.4961A","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2107.08054","url":"https://arxiv.org/abs/2107.08054","doi":"10.1093/mnras/stac567","tg":{"s":["Fiducial"],"d":["Power spectra","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":-0.6436,"yy":0.3656,"p3":[0.2373,-0.4225,-0.7304],"sim":{"k":"e","l":[[79,0.95],[196,0.938],[210,0.938],[317,0.935],[329,0.935]]},"c3":[96.56,-98.14,-163.79],"c2":[129.33,113.99],"k":4,"r":[309,312,339],"rm":0},{"id":"2107.02304","t":"The GIGANTES dataset: precision cosmology from voids in the machine learning era","ab":"We present GIGANTES, the most extensive and realistic void catalog suite ever released -- containing over 1 billion cosmic voids covering a volume larger than the observable Universe, more than 20 TB of data, and created by running the void finder VIDE on QUIJOTE's halo simulations. The expansive and detailed GIGANTES suite, spanning thousands of cosmological models, opens up the study of voids, answering compelling questions: Do voids carry unique cosmological information? How is this information correlated with galaxy information? Leveraging the large number of voids in the GIGANTES suite, our Fisher constraints demonstrate voids contain additional information, critically tightening constraints on cosmological parameters. We use traditional void summary statistics (void size function, void density profile) and the void auto-correlation function, which independently yields an error of $0.13\\,\\mathrm{eV}$ on $\\sum\\,m_ν$ for a 1 $h^{-3}\\mathrm{Gpc}^3$ simulation, without CMB priors. Combining halos and voids we forecast an error of $0.09\\,\\mathrm{eV}$ from the same volume. Extrapolating to next generation multi-Gpc$^3$ surveys such as DESI, Euclid, SPHEREx, and the Roman Space Telescope, we expect voids should yield an independent determination of neutrino mass. Crucially, GIGANTES is the first void catalog suite expressly built for intensive machine learning exploration. We illustrate this by training a neural network to perform likelihood-free inference on the void size function. Cosmology problems provide an impetus to develop novel deep learning techniques, leveraging the symmetries embedded throughout the universe from physical laws, interpreting models, and accurately predicting errors. With GIGANTES, machine learning gains an impressive dataset, offering unique problems that will stimulate new techniques.","abx":0,"nw":0,"d":"2021-07-05","dq":0,"y":2021,"au":[135,43,240,166,95,485,21],"c":82,"cs":0,"bib":"2022ApJ...935..100K","v":"Astrophysical Journal","lk":"arXiv:2107.02304","url":"https://arxiv.org/abs/2107.02304","doi":"10.3847/1538-4357/ac7d4b","tg":{"s":["Fiducial","Latin hypercube","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Void catalogs","Higher-order statistics"],"m":["Simulation-based inference","Other ML","Fisher forecasts"],"u":["Fiducial","Fisher derivatives","Latin hypercube","Higher-order statistics"]},"x":0.3058,"yy":-0.6359,"p3":[0.1463,-0.5439,0.2394],"sim":{"k":"e","l":[[240,0.976],[113,0.963],[57,0.958],[339,0.953],[82,0.952]]},"c3":[-48.0,92.37,-141.33],"c2":[-12.55,120.88],"k":9,"r":[304,306,307,308,309,310,311,312,313,315,316,317,318,319,320,322,323,324,325,326,327,328,329,330,331,332,333,334,335,336,337,338,339],"rm":0},{"id":"2107.02300","t":"The PDF perspective on the tracer-matter connection: Lagrangian bias and non-Poissonian shot noise","ab":"We study the connection of matter density and its tracers from the PDF perspective. One aspect of this connection is the conditional expectation value $\\langle δ_{\\mathrm{tracer}}|δ_m\\rangle$ when averaging both tracer and matter density over some scale. We present a new way to incorporate a Lagrangian bias expansion of this expectation value into standard frameworks for modelling the PDF of density fluctuations and counts-in-cells statistics. Using N-body simulations and mock galaxy catalogs we confirm the accuracy of this expansion and compare it to the more commonly used Eulerian parametrization. For halos hosting typical luminous red galaxies, the Lagrangian model provides a significantly better description of $\\langle δ_{\\mathrm{tracer}}|δ_m\\rangle$ at second order in perturbations. A second aspect of the matter-tracer connection is shot-noise, \\ie the scatter of tracer density around $\\langle δ_{\\mathrm{tracer}}|δ_m\\rangle$. It is well known that this noise can be significantly non-Poissonian and we validate the performance of a more general, two-parameter shot-noise model for different tracers and simulations. Both parts of our analysis are meant to pave the way for forthcoming applications to survey data.","abx":0,"nw":0,"d":"2021-07-05","dq":0,"y":2021,"au":[497,61,69,146,188,564,159,122],"c":26,"cs":0,"bib":"2022MNRAS.510.5069F","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2107.02300","url":"https://arxiv.org/abs/2107.02300","doi":"10.1093/mnras/stab3703","tg":{"s":["Molino / HOD galaxy mocks","Non-Quijote simulations"],"d":["Density fields","Halo catalogs","Galaxy mocks (HOD)","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Molino / HOD galaxy mocks","Non-Quijote simulations"]},"x":-0.5007,"yy":0.2865,"p3":[0.3897,-0.3338,-0.5073],"sim":{"k":"e","l":[[317,0.929],[42,0.928],[174,0.927],[207,0.926],[143,0.926]]},"c3":[-142.51,17.19,-226.34],"c2":[-100.45,43.74],"k":2,"r":[312,333,334],"rm":0},{"id":"2106.13771","t":"Clustering in Massive Neutrino Cosmologies via Eulerian Perturbation Theory","ab":"We introduce an Eulerian Perturbation Theory to study the clustering of tracers for cosmologies in the presence of massive neutrinos. Our approach is based on mapping recently-obtained Lagrangian Perturbation Theory results to the Eulerian framework. We add Effective Field Theory counterterms, IR-resummations and a biasing scheme to compute the one-loop redshift-space power spectrum. To assess our predictions, we compare the power spectrum multipoles against synthetic halo catalogues from the Quijote simulations, finding excellent agreement on scales $k\\lesssim 0.25 \\,h \\text{Mpc}^{-1}$. One can obtain the same fitting accuracy using higher wave-numbers, but then the theory fails to give a correct estimation of the linear bias parameter. We further discuss the implications for the tree-level bispectrum. Finally, calculating loop corrections is computationally costly, hence we derive an accurate approximation wherein we retain only the main features of the kernels, as produced by changes to the growth rate. As a result, we show how FFTLog methods can be used to further accelerate the loop computations with these reduced kernels.","abx":0,"nw":0,"d":"2021-06-25","dq":0,"y":2021,"au":[29,73,266,706],"c":41,"cs":0,"bib":"2021JCAP...11..028A","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2106.13771","url":"https://arxiv.org/abs/2106.13771","doi":"10.1088/1475-7516/2021/11/028","tg":{"s":["Fiducial","Massive neutrinos"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Higher-order statistics"]},"x":-0.4716,"yy":0.4872,"p3":[-0.2949,-0.2749,-0.7665],"sim":{"k":"e","l":[[324,0.956],[253,0.948],[109,0.945],[71,0.941],[317,0.941]]},"c3":[109.81,-35.16,-240.0],"c2":[37.96,254.22],"k":4,"r":[312,324,336,337,339],"rm":0},{"id":"2106.11718","t":"CARPool Covariance: Fast, unbiased covariance estimation for large-scale structure observables","ab":"The covariance matrix $\\boldsymbolΣ$ of non-linear clustering statistics that are measured in current and upcoming surveys is of fundamental interest for comparing cosmological theory and data and a crucial ingredient for the likelihood approximations underlying widely used parameter inference and forecasting methods. The extreme number of simulations needed to estimate $\\boldsymbolΣ$ to sufficient accuracy poses a severe challenge. Approximating $\\boldsymbolΣ$ using inexpensive but biased surrogates introduces model error with respect to full simulations, especially in the non-linear regime of structure growth. To address this problem we develop a matrix generalization of Convergence Acceleration by Regression and Pooling (CARPool) to combine a small number of simulations with fast surrogates and obtain low-noise estimates of $\\boldsymbolΣ$ that are unbiased by construction. Our numerical examples use CARPool to combine GADGET-III $N$-body simulations with fast surrogates computed using COmoving Lagrangian Acceleration (COLA). Even at the challenging redshift $z=0.5$, we find variance reductions of at least $\\mathcal{O}(10^1)$ and up to $\\mathcal{O}(10^4)$ for the elements of the matter power spectrum covariance matrix on scales $8.9\\times 10^{-3}<k_\\mathrm{max} <1.0$ $h {\\rm Mpc^{-1}}$. We demonstrate comparable performance for the covariance of the matter bispectrum, the matter correlation function and probability density function of the matter density field. We compare eigenvalues, likelihoods, and Fisher matrices computed using the CARPool covariance estimate with the standard sample covariance estimators and generally find considerable improvement except in cases where $Σ$ is severely ill-conditioned.","abx":0,"nw":0,"d":"2021-06-22","dq":0,"y":2021,"au":[488,95],"c":29,"cs":0,"bib":"2022MNRAS.509.2220C","v":"","lk":"arXiv:2106.11718","url":"https://arxiv.org/abs/2106.11718","doi":"10.1093/mnras/stab3097","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial"]},"x":-0.5734,"yy":0.0557,"p3":[0.1027,-0.3215,-0.2886],"sim":{"k":"e","l":[[318,0.978],[274,0.947],[329,0.945],[328,0.944],[38,0.94]]},"c3":[-34.05,-146.06,-153.1],"c2":[-92.57,-134.16],"k":7,"r":[318,332,339],"rm":0},{"id":"2106.11061","t":"Extracting cosmological parameters from N-body simulations using machine learning techniques","ab":"We make use of snapshots taken from the Quijote suite of simulations, consisting of 2000 simulations where five cosmological parameters have been varied ($Ω_m$, $Ω_b$, $h$, $n_s$ and $σ_8$) in order to investigate the possibility of determining them using machine learning techniques. In particular, we show that convolutional neural networks can be employed to accurately extract $Ω_m$ and $σ_8$ from the N-body simulations, and that these parameters can also be found from the non-linear matter power spectrum obtained from the same suite of simulations using both random forest regressors and deep neural networks. We show that the power spectrum provides competitive results in terms of accuracy compared to using the simulations and that we can also estimate the scalar spectral index $n_s$ from the power spectrum, at a lower precision.","abx":0,"nw":0,"d":"2021-06-21","dq":0,"y":2021,"au":[56],"c":25,"cs":0,"bib":"2021JCAP...09..039L","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2106.11061","url":"https://arxiv.org/abs/2106.11061","doi":"10.1088/1475-7516/2021/09/039","tg":{"s":["Latin hypercube"],"d":["Density fields","Particle snapshots","Power spectra"],"m":["CNN","Emulators & regression ML"],"u":["Density fields"]},"x":0.2004,"yy":-0.156,"p3":[0.3749,0.3275,0.1154],"sim":{"k":"e","l":[[58,0.943],[254,0.94],[107,0.937],[238,0.937],[31,0.936]]},"c3":[-118.96,32.41,11.52],"c2":[45.74,-76.8],"k":1,"r":[339],"rm":0},{"id":"2106.09761","t":"Unsupervised Resource Allocation with Graph Neural Networks","ab":"We present an approach for maximizing a global utility function by learning how to allocate resources in an unsupervised way. We expect interactions between allocation targets to be important and therefore propose to learn the reward structure for near-optimal allocation policies with a GNN. By relaxing the resource constraint, we can employ gradient-based optimization in contrast to more standard evolutionary algorithms. Our algorithm is motivated by a problem in modern astronomy, where one needs to select-based on limited initial information-among $10^9$ galaxies those whose detailed measurement will lead to optimal inference of the composition of the universe. Our technique presents a way of flexibly learning an allocation strategy by only requiring forward simulators for the physics of interest and the measurement process. We anticipate that our technique will also find applications in a range of resource allocation problems.","abx":0,"nw":0,"d":"2021-06-17","dq":0,"y":2021,"au":[466,514,104],"c":14,"cs":0,"bib":"2021arXiv210609761C","v":"Preregister@NeurIPS","lk":"arXiv:2106.09761","url":"https://arxiv.org/abs/2106.09761","doi":"10.48550/arXiv.2106.09761","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Galaxy mocks (HOD)"],"m":["Graph neural networks"],"u":["Galaxy mocks (HOD)","Halo catalogs"]},"x":-0.3141,"yy":-0.9512,"p3":[-0.0501,0.0433,0.7004],"sim":{"k":"e","l":[[209,0.927],[52,0.92],[246,0.915],[255,0.912],[51,0.911]]},"c3":[-106.06,102.65,50.27],"c2":[-130.91,70.92],"k":9,"r":[325,339],"rm":0},{"id":"2105.12024","t":"Normalizing flows for random fields in cosmology","ab":"Normalizing flows are a powerful tool to create flexible probability distributions with a wide range of potential applications in cosmology. Here we are studying normalizing flows which represent cosmological observables at field level, rather than at the level of summary statistics such as the power spectrum. We evaluate the performance of different normalizing flows for both density estimation and sampling of near-Gaussian random fields, and check the quality of samples with different statistics such as power spectrum and bispectrum estimators. We explore aspects of these flows that are specific to cosmology, such as flowing from a physical prior distribution and evaluating the density estimation results in the analytically tractable correlated Gaussian case.","abx":0,"nw":0,"d":"2021-05-25","dq":0,"y":2021,"au":[19,639,469],"c":20,"cs":0,"bib":"2021arXiv210512024R","v":"","lk":"arXiv:2105.12024","url":"https://arxiv.org/abs/2105.12024","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Normalizing flows","Generative models"],"u":[]},"x":-0.1441,"yy":-0.8991,"p3":[0.266,-0.4538,0.2312],"sim":{"k":"e","l":[[184,0.934],[115,0.927],[79,0.924],[176,0.923],[52,0.923]]},"c3":[-22.9,-89.98,-13.66],"c2":[-77.18,-104.04],"k":6,"r":[339],"rm":0},{"id":"2104.03976","t":"Joint analysis of anisotropic power spectrum, bispectrum and trispectrum: application to N-body simulations","ab":"We perform for the first time a joint analysis of the monopole and quadrupoles for power spectrum, bispectrum and integrated trispectrum (i-trispectrum) from the redshift space matter field in N-body simulations. With a full Markov Chain Monte Carlo exploration of the posterior distribution, we quantify the constraints on cosmological parameters for an object density of $n_\\mathrm{p}=5\\times10^{-4} (h\\,\\mathrm{Mpc}^{-1})^{3}$, redshift $z=0.5$, and a covariance corresponding to a survey volume of $V_\\mathrm{survey} =25\\,(h^{-1}\\mathrm{Gpc})^3$, a set up which is representative of forthcoming galaxy redshift surveys. We demonstrate the complementarity of the bispectrum and i-trispectrum in constraining key cosmological parameters. In particular, compared to the state-of-the-art power spectrum (monopole plus quadrupole) and bispectrum (monopole) analyses, we find 1D $68\\%$ credible regions smaller by a factor of $(72\\%,78\\%,72\\%,47\\%,46\\%)$ for the parameters $(f,σ_8,f_\\mathrm{nl},α_\\parallel,α_\\perp)$ respectively. This work motivates the additional effort necessary to include the redshift-space anisotropic signal of higher-order statistics in the analysis and interpretation of ongoing and future galaxy surveys.","abx":0,"nw":0,"d":"2021-04-08","dq":0,"y":2021,"au":[168,282,397],"c":68,"cs":0,"bib":"2021JCAP...07..008G","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2104.03976","url":"https://arxiv.org/abs/2104.03976","doi":"10.1088/1475-7516/2021/07/008","tg":{"s":["Fiducial"],"d":["Density fields","Power spectra","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Density fields"]},"x":0.5323,"yy":0.6392,"p3":[-0.2846,0.2123,-0.481],"sim":{"k":"e","l":[[319,0.955],[223,0.941],[32,0.94],[232,0.938],[24,0.937]]},"c3":[97.15,-41.75,-152.39],"c2":[189.3,140.88],"k":5,"r":[312,319,336,339],"rm":0},{"id":"title:clusteringandhaloabundancesinearlydarkenergycosmologicalmodels","t":"Clustering and halo abundances in early dark energy cosmological models","ab":"","abx":0,"nw":0,"d":"2020","dq":0,"y":2020,"au":[50,649,239,339,422,650,28,513,185,636],"c":50,"cs":1,"bib":"","v":"Monthly notices of the Royal Astronomical Society","lk":"MNRAS article","url":"https://academic.oup.com/mnras/article/504/1/769/6206841","doi":"10.1093/MNRAS/STAB769","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs","Power spectra"],"m":["No ML"],"u":["Quijote (set not stated)","Non-Quijote simulations","Halo catalogs","Power spectra","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.3647,"yy":0.0752,"p3":[-0.1601,-0.3831,-0.3067],"sim":{"k":"e","l":[[329,0.929],[115,0.928],[200,0.926],[203,0.924],[121,0.924]]},"c3":[-135.71,-34.31,37.8],"c2":[-166.88,5.1],"k":7,"r":[339],"rm":0},{"id":"2103.12099","t":"Detecting the radiative decay of the cosmic neutrino background with line-intensity mapping","ab":"We study the possibility to use line-intensity mapping (LIM) to seek photons from the radiative decay of neutrinos in the cosmic neutrino background. The Standard Model prediction for the rate for these decays is extremely small, but it can be enhanced if new physics increases the neutrino electromagnetic moments. The decay photons will appear as an interloper of astrophysical spectral lines. We propose that the neutrino-decay line can be identified with anisotropies in LIM clustering and also with the voxel intensity distribution. Ongoing and future LIM experiments will have -- depending on the neutrino hierarchy, transition and experiment considered -- a sensitivity to an effective electromagnetic transition moment $\\sim 10^{-12}\\, -\\,10^{-8}\\, (m_ic^2/{0.1 \\rm eV})^{3/2}μ_{\\rm B}$, where $m_i$ is the mass of the decaying neutrino and $μ_{\\rm B}$ is the Bohr magneton. This will be significantly more sensitive than cosmic microwave background spectral distortions, and it will be competitive with stellar cooling studies. As a byproduct, we also report an analytic form of the one-point probability distribution function for neutrino-density fluctuations, obtained from the Quijote simulations using symbolic regression.","abx":0,"nw":0,"d":"2021-03-22","dq":0,"y":2021,"au":[347,51,240,422],"c":35,"cs":0,"bib":"2021PhRvL.127m1102B","v":"Physical Review Letters","lk":"arXiv:2103.12099","url":"https://arxiv.org/abs/2103.12099","doi":"10.1103/PhysRevLett.127.131102","tg":{"s":["Massive neutrinos"],"d":["Density fields","Higher-order statistics"],"m":["Symbolic regression"],"u":["Massive neutrinos","Density fields"]},"x":-0.1896,"yy":0.3501,"p3":[-0.0149,0.317,-0.6391],"sim":{"k":"e","l":[[323,0.925],[71,0.917],[97,0.916],[241,0.916],[237,0.916]]},"c3":[-98.46,44.92,-89.72],"c2":[-78.37,83.95],"k":8,"r":[339],"rm":0},{"id":"2102.06709","t":"Information content in mean pairwise velocity and mean relative velocity between pairs in a triplet","ab":"Velocity field provides a complementary avenue to constrain cosmological information, either through the peculiar velocity surveys or the kinetic Sunyaev Zel'dovich effect. One of the commonly used statistics is the mean radial pairwise velocity. Here, we consider the three-point mean relative velocity, i.e. the mean relative velocities between pairs in a triplet. Using halo catalogs from the Quijote suite of N-body simulations, we first showcase how the analytical prediction for the mean relative velocities between pairs in a triplet achieve better than 4-5% accuracy using standard perturbation theory at leading order for triangular configurations with a minimum separation of $r \\geq 50\\ h^{-1}$Mpc. Furthermore, we present the three-point relative velocity as a novel probe of neutrino mass estimation. We explore the full cosmological information content of the halo mean pairwise velocities, and the mean relative velocities between halo pairs in a triplet. We undertake this through the Fisher-matrix formalism using 22,000 simulations from the Quijote suite, and considering all triangular configurations with a minimum and a maximum separation of $20\\ h^{-1}$Mpc and $120\\ h^{-1}$Mpc, respectively. We find that the mean relative velocities in a triplet allows a 1$σ$ neutrino mass ($M_ν$) constraint of 0.065 eV, that is roughly 13 times better than the mean pairwise velocity constraint (0.877 eV). This information gain is not limited only to neutrino mass, but extends to other cosmological parameters: $Ω_{\\mathrm{m}}$, $Ω_{\\mathrm{b}}$, $h$, $n_{\\mathrm{s}}$ and $σ_{8}$ achieving a gain of 8.9, 11.8, 15.5, 20.9 and 10.9 times respectively. These results illustrate the possibility of exploiting the mean three-point relative velocities for constraining the cosmological parameters accurately from future cosmic microwave background experiments and peculiar velocity surveys.","abx":0,"nw":0,"d":"2021-02-12","dq":0,"y":2021,"au":[345,474],"c":15,"cs":0,"bib":"2021A&A...653A.130K","v":"","lk":"arXiv:2102.06709","url":"https://arxiv.org/abs/2102.06709","doi":"10.1051/0004-6361/202140552","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":[]},"x":0.4352,"yy":0.1015,"p3":[0.194,0.1373,-0.6102],"sim":{"k":"e","l":[[288,0.96],[13,0.945],[100,0.936],[80,0.935],[249,0.933]]},"c3":[-4.29,104.89,-231.78],"c2":[8.89,203.64],"k":3,"r":[309,339],"rm":0},{"id":"2102.05049","t":"Detecting Neutrino Mass by Combining Matter Clustering, Halos, and Voids","ab":"We quantify the information content of the non-linear matter power spectrum, the halo mass function, and the void size function, using the Quijote $N$-body simulations. We find that these three statistics exhibit very different degeneracies amongst the cosmological parameters, and thus the combination of all three probes enables the breaking of degeneracies, in turn yielding remarkably tight constraints. We perform a Fisher analysis using the full covariance matrix, including all auto- and cross-correlations, finding that this increases the information content for neutrino mass compared to a correlation-free analysis. The multiplicative improvement of the constraints on the cosmological parameters obtained by combining all three probes compared to using the power spectrum alone are: 137, 5, 8, 20, 10, and 43, for $Ω_m$, $Ω_b$, $h$, $n_s$, $σ_8$, and $M_ν$, respectively. The marginalized error on the sum of the neutrino masses is $σ(M_ν)=0.018\\,{\\rm eV}$ for a cosmological volume of $1\\,(h^{-1}{\\rm Gpc})^3$, using $k_{\\max}=0.5\\,h{\\rm Mpc}^{-1}$, and without CMB priors. We note that this error is an underestimate insomuch as we do not consider super-sample covariance, baryonic effects, and realistic survey noises and systematics. On the other hand, it is an overestimate insomuch as our cuts and binning are suboptimal due to restrictions imposed by the simulation resolution. Given upcoming galaxy surveys will observe volumes spanning $\\sim 100\\,(h^{-1}{\\rm Gpc})^3$, this presents a promising new avenue to measure neutrino mass without being restricted by the need for accurate knowledge of the optical depth, which is required for CMB-based measurements. Furthermore, the improved constraints on other cosmological parameters, notably $Ω_m$, may also be competitive with CMB-based measurements.","abx":0,"nw":0,"d":"2021-02-09","dq":0,"y":2021,"au":[21,240,200,323,166,397,95,446,580],"c":101,"cs":0,"bib":"2021ApJ...919...24B","v":"Astrophysical Journal","lk":"arXiv:2102.05049","url":"https://arxiv.org/abs/2102.05049","doi":"10.3847/1538-4357/ac0e91","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Void catalogs","Power spectra"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.2995,"yy":0.0295,"p3":[0.1098,0.1842,-0.3928],"sim":{"k":"e","l":[[331,0.947],[334,0.947],[14,0.946],[249,0.944],[108,0.944]]},"c3":[-33.0,165.13,-109.47],"c2":[76.72,102.28],"k":8,"r":[312,318,319,322,324,327,330,331,334,336,339],"rm":0},{"id":"2102.01696","t":"Information Content of Higher-Order Galaxy Correlation Functions","ab":"The shapes of galaxy N-point correlation functions can be used as standard rulers to constrain the distance-redshift relationship and thence the expansion rate of the Universe. The cosmological density fields traced by late-time galaxy formation are initially nearly Gaussian, and hence all the cosmological information can be extracted from their 2-Point Correlation Function (2PCF) or its Fourier-space analog the power spectrum. Subsequent nonlinear evolution under gravity, as well as halo and then galaxy formation, generate higher-order correlation functions. Since the mapping of the initial to the final density field is, on large scales, invertible, it is often claimed that the information content of the initial field's power spectrum is equal to that of all the higher-order functions of the final, nonlinear field. This claim implies that reconstruction of the initial density field from the nonlinear field renders analysis of higher-order correlation functions of the latter superfluous. We here show that this claim is false when the N-point functions are used as standard rulers. Constraints available from joint analysis of the galaxy power spectrum and bispectrum (Fourier-space analog of the 3-Point Correlation Function) can, in some cases, exceed those offered by the initial power spectrum even when the reconstruction is perfect. We provide a mathematical justification for this claim and also demonstrate it using a large suite of N-body simulations. In particular, we show that for the z = 0 real-space matter field in the limit of vanishing shot noise, taking modes up to k_max = 0.2 h/Mpc, using the bispectrum alone offers a factor of two reduction in the variance on the cosmic distance scale relative to that available from the power spectrum.","abx":0,"nw":0,"d":"2021-02-02","dq":0,"y":2021,"au":[384,706,240],"c":37,"cs":0,"bib":"2021MNRAS.505..628S","v":"","lk":"arXiv:2102.01696","url":"https://arxiv.org/abs/2102.01696","doi":"10.1093/mnras/stab1199","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Fisher derivatives","Fisher forecasts"]},"x":0.0983,"yy":0.3194,"p3":[-0.239,0.0855,-0.0933],"sim":{"k":"e","l":[[87,0.939],[263,0.938],[4,0.935],[259,0.935],[242,0.935]]},"c3":[56.71,13.88,-205.61],"c2":[115.15,201.63],"k":5,"r":[319,336,339],"rm":0},{"id":"2102.01184","t":"Cosmological cross-correlations and nearest neighbor distributions","ab":"Cross-correlations between datasets are used in many different contexts in cosmological analyses. Recently, $k$-Nearest Neighbor Cumulative Distribution Functions ($k{\\rm NN}$-${\\rm CDF}$) were shown to be sensitive probes of cosmological (auto) clustering. In this paper, we extend the framework of nearest neighbor measurements to describe joint distributions of, and correlations between, two datasets. We describe the measurement of joint $k{\\rm NN}$-${\\rm CDF}$s, and show that these measurements are sensitive to all possible connected $N$-point functions that can be defined in terms of the two datasets. We describe how the cross-correlations can be isolated by combining measurements of the joint $k{\\rm NN}$-${\\rm CDF}$s and those measured from individual datasets. We demonstrate the application of these measurements in the context of Gaussian density fields, as well as for fully nonlinear cosmological datasets. Using a Fisher analysis, we show that measurements of the halo-matter cross-correlations, as measured through nearest neighbor measurements are more sensitive to the underlying cosmological parameters, compared to traditional two-point cross-correlation measurements over the same range of scales. Finally, we demonstrate how the nearest neighbor cross-correlations can robustly detect cross correlations between sparse samples -- the same regime where the two-point cross-correlation measurements are dominated by noise.","abx":0,"nw":0,"d":"2021-02-01","dq":0,"y":2021,"au":[73,631],"c":49,"cs":0,"bib":"2021MNRAS.504.2911B","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2102.01184","url":"https://arxiv.org/abs/2102.01184","doi":"10.1093/MNRAS/STAB961","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Density fields","Halo catalogs","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.4007,"yy":-0.3545,"p3":[0.7517,0.0382,-0.6016],"sim":{"k":"e","l":[[247,0.962],[322,0.95],[112,0.945],[80,0.937],[295,0.934]]},"c3":[-139.15,127.98,-154.17],"c2":[19.95,108.63],"k":2,"r":[322,339],"rm":0},{"id":"2012.05472","t":"Learning the Evolution of the Universe in N-body Simulations","ab":"Understanding the physics of large cosmological surveys down to small (nonlinear) scales will significantly improve our knowledge of the Universe. Large N-body simulations have been built to obtain predictions in the non-linear regime. However, N-body simulations are computationally expensive and generate large amount of data, putting burdens on storage. These data are snapshots of the simulated Universe at different times, and fine sampling is necessary to accurately save its whole history. We employ a deep neural network model to predict the nonlinear N-body simulation at an intermediate time step given two widely separated snapshots. Our results outperform the cubic Hermite interpolation benchmark method in interpolating N-body simulations. This work can greatly reduce the storage requirement and allow us to reconstruct the cosmic history from far fewer snapshots of the universe.","abx":0,"nw":0,"d":"2020-12-10","dq":0,"y":2020,"au":[121,684,240,580,64],"c":6,"cs":0,"bib":"2020arXiv201205472C","v":"arXiv.org","lk":"arXiv:2012.05472","url":"https://arxiv.org/abs/2012.05472","doi":"10.48550/arXiv.2012.05472","tg":{"s":["Quijote (set not stated)"],"d":["Particle snapshots"],"m":["CNN"],"u":["CNN"]},"x":-0.4038,"yy":-0.4506,"p3":[0.2811,0.0016,0.5765],"sim":{"k":"e","l":[[313,0.95],[260,0.943],[261,0.943],[115,0.942],[107,0.942]]},"c3":[90.38,11.33,-89.62],"c2":[106.85,9.5],"k":1,"r":[336,339],"rm":1},{"id":"2012.02200","t":"Constraining $M_ν$ with the Bispectrum II: The Total Information Content of the Galaxy Bispectrum","ab":"Massive neutrinos suppress the growth of structure on small scales and leave an imprint on large-scale structure that can be measured to constrain their total mass, $M_ν$. With standard analyses of two-point clustering statistics, $M_ν$ constraints are severely limited by parameter degeneracies. Hahn et al.(2020) demonstrated that the bispectrum, the next higher-order statistic, can break these degeneracies and dramatically improve constraints on $M_ν$ and other cosmological parameters. In this paper, we present the constraining power of the redshift-space galaxy bispectrum, $B_0^g$. We construct the Molino suite of 75,000 mock galaxy catalogs from the Quijote $N$-body simulations using the halo occupation distribution (HOD) model, which provides a galaxy bias framework well-suited for simulation-based approaches. Using these mocks, we present Fisher matrix forecasts for $\\{Ω_m,Ω_b,h,n_s,σ_8, M_ν\\}$ and quantify, for the first time, the total information content of $B_0^g$ down to nonlinear scales. For $k_{\\rm max}=0.5h/Mpc$, $B_0^g$ improves constraints on $Ω_m,Ω_b,h,n_s,σ_8$, and $M_ν$ by 2.8, 3.1, 3.8, 4.2, 4.2, and $4.6\\times$ over the power spectrum, after marginalizing over HOD parameters. Even with priors from $Planck$, $B_0^g$ improves all of the cosmological constraints by $\\gtrsim2\\times$. In fact, for $P_\\ell^g$ and $B_0^g$ out to $k_{\\rm max}=0.5h/Mpc$ with $Planck$ priors, we achieve a $1σ$ $M_ν$ constraint of 0.048 eV, which is tighter than the current best cosmological constraint. While effects such as survey geometry and assembly bias will have an impact, these constraints are derived for $(1h^{-1}{\\rm Gpc})^3$, a substantially smaller volume than upcoming surveys. Therefore, we conclude that the galaxy bispectrum will significantly improve cosmological constraints for upcoming galaxy surveys -- especially for $M_ν$.","abx":0,"nw":0,"d":"2020-12-03","dq":0,"y":2020,"au":[122,240],"c":107,"cs":0,"bib":"2021JCAP...04..029H","v":"","lk":"arXiv:2012.02200","url":"https://arxiv.org/abs/2012.02200","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.1405,"yy":0.1195,"p3":[-0.044,-0.2802,-0.3788],"sim":{"k":"e","l":[[336,0.959],[200,0.95],[201,0.945],[15,0.943],[90,0.943]]},"c3":[85.69,45.85,-175.67],"c2":[109.6,149.01],"k":0,"r":[322,327,331,334,336,338,339],"rm":0},{"id":"2012.00240","t":"Fast and Accurate Non-Linear Predictions of Universes with Deep Learning","ab":"Cosmologists aim to model the evolution of initially low amplitude Gaussian density fluctuations into the highly non-linear \"cosmic web\" of galaxies and clusters. They aim to compare simulations of this structure formation process with observations of large-scale structure traced by galaxies and infer the properties of the dark energy and dark matter that make up 95% of the universe. These ensembles of simulations of billions of galaxies are computationally demanding, so that more efficient approaches to tracing the non-linear growth of structure are needed. We build a V-Net based model that transforms fast linear predictions into fully nonlinear predictions from numerical simulations. Our NN model learns to emulate the simulations down to small scales and is both faster and more accurate than the current state-of-the-art approximate methods. It also achieves comparable accuracy when tested on universes of significantly different cosmological parameters from the one used in training. This suggests that our model generalizes well beyond our training set.","abx":0,"nw":0,"d":"2020-12-01","dq":0,"y":2020,"au":[537,684,240,580,166],"c":34,"cs":0,"bib":"2020arXiv201200240A","v":"arXiv.org","lk":"arXiv:2012.00240","url":"https://arxiv.org/abs/2012.00240","doi":"10.48550/arXiv.2012.00240","tg":{"s":["Fiducial","Latin hypercube"],"d":["Density fields","Particle snapshots"],"m":["CNN","Emulators & regression ML"],"u":["Fiducial","Latin hypercube","Particle snapshots"]},"x":-0.3732,"yy":-0.4557,"p3":[0.2389,0.2127,0.7113],"sim":{"k":"e","l":[[115,0.951],[311,0.95],[110,0.949],[228,0.947],[260,0.947]]},"c3":[-27.75,-27.79,-105.45],"c2":[-10.45,9.08],"k":1,"r":[322,327,331,334,336,339],"rm":0},{"id":"2012.00203","t":"Minkowski functionals and the nonlinear perturbation theory in the large-scale structure: second-order effects","ab":"The second-order formula of Minkowski functionals in weakly non-Gaussian fields is compared with the numerical $N$-body simulations. Recently, weakly non-Gaussian formula of Minkowski functionals is extended to include the second-order effects of non-Gaussianity in general dimensions. We apply this formula to the three-dimensional density field in the large-scale structure of the Universe. The parameters of the second-order formula include several kinds of skewness and kurtosis parameters. We apply the tree-level nonlinear perturbation theory to estimate these parameters. First we compare the theoretical values with those of numerical simulations on the basis of parameter values, and next we test the performance of the analytic formula combined with the perturbation theory. The second-order formula outperforms the first-order formula in general. The performance of the perturbation theory depends on the smoothing radius applied in defining the Minkowski functionals. The quantitative comparisons are presented in detail.","abx":0,"nw":0,"d":"2020-12-01","dq":0,"y":2020,"au":[618,128,568],"c":5,"cs":0,"bib":"2020arXiv201200203M","v":"Physical Review D","lk":"arXiv:2012.00203","url":"https://arxiv.org/abs/2012.00203","doi":"10.1103/physrevd.105.023527","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.3659,"yy":0.2771,"p3":[0.0948,0.4059,-0.4669],"sim":{"k":"e","l":[[164,0.913],[293,0.911],[4,0.911],[278,0.91],[207,0.908]]},"c3":[77.48,197.14,-6.99],"c2":[110.02,229.21],"k":3,"r":[339],"rm":0},{"id":"2011.06185","t":"The unequal-time matter power spectrum: impact on weak lensing observables","ab":"We investigate the impact of a common approximation on weak lensing power spectra: the use of single-epoch matter power spectra in integrals over redshift. We disentangle this from the closely connected Limber's approximation. We derive the unequal-time matter power spectrum at one-loop in standard perturbation theory and effective field theory to deal with non-linear physics. We compare these formalisms and conclude that the unequal-time power spectrum using effective field theory breaks for larger scales. As an alternative, we introduce the midpoint approximation. We also provide, for the first time, a fitting function for the time evolution of the effective field theory counterterms based on the Quijote simulations. Then we compute the angular power spectrum using a range of approaches: the Limber's approximation, and the geometric and midpoint approximations. We compare our results with the exact calculation at all angular scales using the unequal-time power spectrum. We use DES Y1 and LSST-like redshift distributions for our analysis. We find that the use of the Limber's approximation in weak lensing diverges from the exact calculation of the angular power spectrum on large-angle separations, $\\ell < 10$. Even though this deviation is of order $2\\%$ maximum for cosmic lensing, we find the biggest effect for galaxy clustering and galaxy-galaxy lensing. We show that not only is this true for upcoming galaxy surveys, but also for current data such as DES Y1. Finally, we make our pipeline and analysis publicly available as a Python package called unequalpy.","abx":0,"nw":0,"d":"2020-11-12","dq":0,"y":2020,"au":[405,489,565],"c":14,"cs":0,"bib":"2021JCAP...08..001D","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2011.06185","url":"https://arxiv.org/abs/2011.06185","doi":"10.1088/1475-7516/2021/08/001","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra","Weak lensing & 2D maps"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.5333,"yy":0.5758,"p3":[-0.464,-0.1493,-0.591],"sim":{"k":"e","l":[[329,0.936],[253,0.933],[93,0.932],[117,0.93],[299,0.929]]},"c3":[-43.62,36.24,-182.81],"c2":[-27.14,159.72],"k":4,"r":[339],"rm":0},{"id":"2010.07193","t":"Exploring KSZ velocity reconstruction with $N$-body simulations and the halo model","ab":"KSZ velocity reconstruction is a recently proposed method for mapping the largest-scale modes of the universe, by applying a quadratic estimator $\\hat{v}_r$ to the small-scale CMB and a galaxy catalog. We implement kSZ velocity reconstruction in an $N$-body simulation pipeline and explore its properties. We find that the reconstruction noise can be larger than the analytic prediction which is usually assumed. We revisit the analytic prediction and find additional noise terms which explain the discrepancy. The new terms are obtained from a six-point halo model calculation, and are analogous to the $N^{(1)}$ and $N^{(3/2)}$ biases in CMB lensing. We implement an MCMC pipeline which estimates $f_{NL}$ from $N$-body kSZ simulations, and show that it recovers unbiased estimates of $f_{NL}$, with statistical errors consistent with a Fisher matrix forecast. Overall, these results confirm that kSZ velocity reconstruction will be a powerful probe of cosmology in the near future, but new terms should be included in the noise power spectrum.","abx":0,"nw":0,"d":"2020-10-14","dq":0,"y":2020,"au":[639,372],"c":41,"cs":0,"bib":"2022JCAP...09..028G","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2010.07193","url":"https://arxiv.org/abs/2010.07193","doi":"10.1088/1475-7516/2022/09/028","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Power spectra","Weak lensing & 2D maps"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Weak lensing & 2D maps"]},"x":-0.5454,"yy":-0.1896,"p3":[0.1985,0.255,-0.1395],"sim":{"k":"e","l":[[92,0.937],[222,0.935],[148,0.935],[70,0.935],[329,0.935]]},"c3":[-112.46,-3.33,-101.82],"c2":[-18.03,-11.52],"k":0,"r":[339],"rm":0},{"id":"2010.05914","t":"Modeling the Marked Spectrum of Matter and Biased Tracers in Real- and Redshift-Space","ab":"We present the one-loop perturbation theory for the power spectrum of the marked density field of matter and biased tracers in real- and redshift-space. The statistic has been shown to yield impressive constraints on cosmological parameters; to exploit this, we require an accurate and computationally inexpensive theoretical model. Comparison with $N$-body simulations demonstrates that linear theory fails on all scales, but inclusion of one-loop Effective Field Theory terms gives a substantial improvement, with $\\sim 5\\%$ accuracy at $z = 1$. The expansion is less convergent in redshift-space (achieving $\\sim 10\\%$ accuracy), but there are significant improvements for biased tracers due to the freedom in the bias coefficients. The large-scale theory contains non-negligible contributions from all perturbative orders; we suggest a reorganization of the theory that contains all terms relevant on large-scales, discussing both its explicit form at one-loop and structure at infinite-loop. This motivates a low-$k$ correction term, leading to a model that is sub-percent accurate on large scales, albeit with the inclusion of two (three) free coefficients in real- (redshift-)space. We further consider the effects of massive neutrinos, showing that beyond-EdS corrections to the perturbative kernels are negligible in practice. It remains to see whether the purported gains in cosmological parameters remain valid for biased tracers and can be captured by the theoretical model.","abx":0,"nw":0,"d":"2020-10-12","dq":0,"y":2020,"au":[498,29,200],"c":20,"cs":0,"bib":"2021JCAP...03..038P","v":"","lk":"arXiv:2010.05914","url":"https://arxiv.org/abs/2010.05914","doi":"10.1088/1475-7516/2021/03/038","tg":{"s":["Fiducial","Massive neutrinos"],"d":["Density fields","Halo catalogs","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Halo catalogs"]},"x":-0.5044,"yy":0.3923,"p3":[0.1339,-0.2964,-0.6422],"sim":{"k":"e","l":[[326,0.964],[329,0.945],[128,0.945],[109,0.944],[143,0.941]]},"c3":[106.05,65.08,-207.07],"c2":[107.02,122.17],"k":4,"r":[319,324,326,328,331,336,339],"rm":0},{"id":"2009.08970","t":"CARPool: fast, accurate computation of large-scale structure statistics by pairing costly and cheap cosmological simulations","ab":"To exploit the power of next-generation large-scale structure surveys, ensembles of numerical simulations are necessary to give accurate theoretical predictions of the statistics of observables. High-fidelity simulations come at a towering computational cost. Therefore, approximate but fast simulations, surrogates, are widely used to gain speed at the price of introducing model error. We propose a general method that exploits the correlation between simulations and surrogates to compute fast, reduced-variance statistics of large-scale structure observables without model error at the cost of only a few simulations. We call this approach Convergence Acceleration by Regression and Pooling (CARPool). In numerical experiments with intentionally minimal tuning, we apply CARPool to a handful of GADGET-III $N$-body simulations paired with surrogates computed using COmoving Lagrangian Acceleration (COLA). We find $\\sim 100$-fold variance reduction even in the non-linear regime, up to $k_\\mathrm{max} \\approx 1.2$ $h {\\rm Mpc^{-1}}$ for the matter power spectrum. CARPool realises similar improvements for the matter bispectrum. In the nearly linear regime CARPool attains far larger sample variance reductions. By comparing to the 15,000 simulations from the Quijote suite, we verify that the CARPool estimates are unbiased, as guaranteed by construction, even though the surrogate misses the simulation truth by up to $60\\%$ at high $k$. Furthermore, even with a fully configuration-space statistic like the non-linear matter density probability density function, CARPool achieves unbiased variance reduction factors of up to $\\sim 10$, without any further tuning. Conversely, CARPool can be used to remove model error from ensembles of fast surrogates by combining them with a few high-accuracy simulations.","abx":0,"nw":0,"d":"2020-09-18","dq":0,"y":2020,"au":[488,95,681,240],"c":53,"cs":0,"bib":"2021MNRAS.503.1897C","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2009.08970","url":"https://arxiv.org/abs/2009.08970","doi":"10.1093/MNRAS/STAB430","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["No ML"],"u":[]},"x":-0.5894,"yy":0.0602,"p3":[0.4591,-0.2769,0.0971],"sim":{"k":"e","l":[[300,0.978],[328,0.944],[274,0.94],[208,0.94],[65,0.94]]},"c3":[-63.9,-89.04,-173.83],"c2":[-100.03,-64.15],"k":7,"r":[332,336,339],"rm":0},{"id":"2009.02290","t":"Matter trispectrum: theoretical modelling and comparison to N-body simulations","ab":"The power spectrum has long been the workhorse summary statistics for large-scale structure cosmological analyses. However, gravitational non-linear evolution moves precious cosmological information from the two-point statistics (such as the power spectrum) to higher-order correlations. Moreover, information about the primordial non-Gaussian signal lies also in higher-order correlations. Without tapping into these, that information remains hidden. While the three-point function (or the bispectrum), even if not extensively, has been studied and applied to data, there has been only limited discussion about the four point/trispectrum. This is because the high-dimensionality of the statistics (in real space a skew-quadrilateral has 6 degrees of freedom), and the high number of skew-quadrilaterals, make the trispectrum numerically and algorithmically very challenging. Here we address this challenge by introducing the i-trispectrum, an integrated trispectrum that only depends on four $k$-modes moduli. We model and measure the matter i-trispectrum from a set of 5000 \\textsc{Quijote} N-body simulations both in real and redshift space, finding good agreement between simulations outputs and model up to mildly non-linear scales. Using the power spectrum, bispectrum and i-trispectrum joint data-vector covariance matrix estimated from the simulations, we begin to quantify the added-value provided by the i-trispectrum. In particular, we forecast the i-trispectrum improvements on constraints on the local primordial non-Gaussianity amplitude parameters $f_\\mathrm{nl}$ and $g_\\mathrm{nl}$. For example, using the full joint data-vector, we forecast $f_\\mathrm{nl}$ constraints up to two times ($\\sim32\\%$) smaller in real (redshift) space than those obtained without i-trispectrum.","abx":0,"nw":0,"d":"2020-09-04","dq":0,"y":2020,"au":[168,573,282,397],"c":52,"cs":0,"bib":"2021JCAP...01..015G","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2009.02290","url":"https://arxiv.org/abs/2009.02290","doi":"10.1088/1475-7516/2021/01/015","tg":{"s":["Fiducial"],"d":["Density fields","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Density fields"]},"x":0.5073,"yy":0.6493,"p3":[-0.2858,0.1109,-0.2182],"sim":{"k":"e","l":[[304,0.955],[242,0.949],[38,0.947],[259,0.945],[257,0.945]]},"c3":[16.95,-85.7,-180.01],"c2":[129.62,23.97],"k":5,"r":[336,339],"rm":0},{"id":"2008.12265","t":"The impact of massive neutrinos on halo assembly bias","ab":"Using the publicly available Quijote simulations, we present the first measurements of the assembly bias of dark matter halos in N-body simulations which include massive neutrinos. We focus on the dependence of the linear bias $b_1$ on three halo properties: 1) concentration $c$, 2) spin $λ$, and 3) ellipticity $s$. Although these simulations cover a large volume, superior to any future surveys, we do not detect any effect of neutrinos on the relations $b_1(c)$, $b_1(λ)$ and $b_1(s)$ at fixed halo mass. We further study the dependence of halo properties and environment on neutrinos, finding these quantities to be impacted by neutrino masses at the same level as assembly bias. We find that the effect of neutrinos on spin and shape can be largely attributed to the change in the cold dark matter $σ_8$ in neutrinos simulations, which is not the case for concentration.","abx":0,"nw":0,"d":"2020-08-27","dq":0,"y":2020,"au":[627,240,446],"c":10,"cs":0,"bib":"2021JCAP...03..022L","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2008.12265","url":"https://arxiv.org/abs/2008.12265","doi":"10.1088/1475-7516/2021/03/022","tg":{"s":["Fiducial","Massive neutrinos"],"d":["Halo catalogs"],"m":["No ML"],"u":["Fiducial"]},"x":-0.2253,"yy":0.2416,"p3":[0.1418,0.3006,-0.4547],"sim":{"k":"e","l":[[195,0.964],[339,0.937],[331,0.936],[139,0.936],[14,0.935]]},"c3":[-19.53,137.71,-231.52],"c2":[-23.85,247.68],"k":8,"r":[322,323,324,331,334,336,337,338,339],"rm":0},{"id":"title:capturingthecosmicwebforcosmology","t":"Capturing the Cosmic Web for Cosmology","ab":"","abx":0,"nw":0,"d":"2020","dq":1,"y":2020,"au":[377],"c":0,"cs":2,"bib":"","v":"","lk":"1829731","url":"https://inspirehep.net/literature/1829731","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Quijote (set not stated)","Density fields","Higher-order statistics","Fisher forecasts","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.5337,"yy":-0.0383,"p3":[0.1899,0.6531,-0.1196],"sim":{"k":"w","l":[[235,0.508],[72,0.363],[16,0.22],[108,0.196],[202,0.17]]},"c3":[-211.23,-285.72,-34.27],"c2":[-306.15,-172.57],"k":8,"r":[],"rm":1},{"id":"2007.13342","t":"Nearest Neighbor distributions: new statistical measures for cosmological clustering","ab":"The use of summary statistics beyond the two-point correlation function to analyze the non-Gaussian clustering on small scales is an active field of research in cosmology. In this paper, we explore a set of new summary statistics -- the $k$-Nearest Neighbor Cumulative Distribution Functions ($k{\\rm NN}$-${\\rm CDF}$). This is the empirical cumulative distribution function of distances from a set of volume-filling, Poisson distributed random points to the $k$-nearest data points, and is sensitive to all connected $N$-point correlations in the data. The $k{\\rm NN}$-${\\rm CDF}$ can be used to measure counts in cell, void probability distributions and higher $N$-point correlation functions, all using the same formalism exploiting fast searches with spatial tree data structures. We demonstrate how it can be computed efficiently from various data sets - both discrete points, and the generalization for continuous fields. We use data from a large suite of $N$-body simulations to explore the sensitivity of this new statistic to various cosmological parameters, compared to the two-point correlation function, while using the same range of scales. We demonstrate that the use of $k{\\rm NN}$-${\\rm CDF}$ improves the constraints on the cosmological parameters by more than a factor of $2$ when applied to the clustering of dark matter in the range of scales between $10h^{-1}{\\rm Mpc}$ and $40h^{-1}{\\rm Mpc}$. We also show that relative improvement is even greater when applied on the same scales to the clustering of halos in the simulations at a fixed number density, both in real space, as well as in redshift space. Since the $k{\\rm NN}$-${\\rm CDF}$ are sensitive to all higher order connected correlation functions in the data, the gains over traditional two-point analyses are expected to grow as progressively smaller scales are included in the analysis of cosmological data.","abx":0,"nw":0,"d":"2020-07-27","dq":0,"y":2020,"au":[73,631],"c":126,"cs":0,"bib":"2021MNRAS.500.5479B","v":"","lk":"arXiv:2007.13342","url":"https://arxiv.org/abs/2007.13342","doi":"10.1093/mnras/staa3604","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Density fields","Halo catalogs","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Fisher forecasts"]},"x":0.4344,"yy":-0.3992,"p3":[0.6458,0.0077,-0.6552],"sim":{"k":"e","l":[[112,0.957],[310,0.95],[152,0.943],[247,0.939],[22,0.939]]},"c3":[-37.72,156.71,-141.95],"c2":[109.99,95.89],"k":2,"r":[331,334,336,337,339],"rm":0},{"id":"2007.10345","t":"The effects of massive neutrinos on the linear point of the correlation function","ab":"The linear point (LP), defined as the mid-point between the dip and the peak of the two-point clustering correlation function (TPCF), has been shown to be an excellent standard ruler for cosmology. In fact, it is nearly redshift-independent, being weakly sensitive to non-linearities, scale-dependent halo bias and redshift-space distortions. So far, these findings were tested assuming that neutrinos are massless; in this paper we extend the analysis to massive-neutrino cosmologies. In particular, we examine if the scale-dependent growth induced by neutrinos affects the LP position and if it is possible to detect the neutrino masses using the shift of the LP compared to the massless-neutrino case. For our purposes, we employ two sets of state-of-the-art $N$-body simulations with massive neutrinos. For each of them we measure the TPCF of cold dark matter (CDM) and halos and, to estimate the LP, fit the TPCF with a model-independent parametric fit in the range of scales of the Baryon Acoustic Oscillations (BAO). Overall, we find that the LP retains its features as a standard ruler even when neutrinos are massive. The cosmic distances measured with the LP can therefore be employed to constrain the neutrino mass.","abx":0,"nw":0,"d":"2020-07-20","dq":0,"y":2020,"au":[245,555,446,117,240,505,677,536,242,290],"c":35,"cs":0,"bib":"2021JCAP...01..009P","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2007.10345","url":"https://arxiv.org/abs/2007.10345","doi":"10.1088/1475-7516/2021/01/009","tg":{"s":["Massive neutrinos","Non-Quijote simulations"],"d":["Particle snapshots","Halo catalogs","Power spectra"],"m":["No ML"],"u":["Non-Quijote simulations","Particle snapshots"]},"x":-0.2166,"yy":0.3138,"p3":[-0.3086,0.2345,-0.6416],"sim":{"k":"e","l":[[195,0.949],[237,0.942],[109,0.941],[337,0.939],[249,0.938]]},"c3":[-65.77,84.44,-246.07],"c2":[-84.73,247.14],"k":8,"r":[339],"rm":0},{"id":"2007.06508","t":"A Lagrangian Perturbation Theory in the presence of massive neutrinos","ab":"We develop a Lagrangian Perturbation Theory (LPT) framework to study the clustering of cold dark matter (CDM) in cosmologies with massive neutrinos. We follow the trajectories of CDM particles with Lagrangian displacements fields up to third order in perturbation theory. Once the neutrinos become non-relativistic, their density fluctuations are modeled as being proportional to the CDM density fluctuations, with a scale-dependent proportionality factor. This yields a gravitational back-reaction that introduces additional scales to the linear growth function, which is accounted for in the higher order LPT kernels. Through non-linear mappings from Eulerian to Lagrangian frames, we ensure that our theory has a well behaved large scale behavior free of unwanted UV divergences, which are common when neutrino and CDM densities are not treated on an equal footing, and in resummation schemes that manifestly break Galilean invariance. We use our theory to construct correlation functions for both the underlying matter field, as well as for biased tracers using Convolution-LPT. Redshift-space distortions effects are modeled using the Gaussian Streaming Model. When comparing our analytical results to simulated data from the Quijote simulation suite, we find good accuracy down to $r=20 \\,\\text{Mpc} \\, h^{-1}$ at redshift $z=0.5$, for the real space and redshift space monopole particle correlation functions with no free parameters. The same accuracy is reached for the redshift space quadrupole if we additionally consider an effective field theory parameter that shifts the pairwise velocity dispersion. For modeling the correlation functions of tracers we adopt a simple Lagrangian biasing scheme with only density and curvature operators, which we find sufficient to reach down to $r=20 \\,\\text{Mpc} \\, h^{-1}$ when comparing to simulated halos.","abx":0,"nw":0,"d":"2020-07-13","dq":0,"y":2020,"au":[29,73],"c":45,"cs":0,"bib":"2020JCAP...10..034A","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2007.06508","url":"https://arxiv.org/abs/2007.06508","doi":"10.1088/1475-7516/2020/10/034","tg":{"s":["Fiducial","Massive neutrinos"],"d":["Particle snapshots","Halo catalogs","Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":-0.4415,"yy":0.4697,"p3":[-0.1373,-0.4818,-0.5489],"sim":{"k":"e","l":[[299,0.956],[109,0.948],[329,0.947],[71,0.945],[155,0.941]]},"c3":[68.31,30.88,-247.97],"c2":[10.27,223.87],"k":4,"r":[326,331,337,339],"rm":0},{"id":"2006.11287","t":"Discovering Symbolic Models from Deep Learning with Inductive Biases","ab":"We develop a general approach to distill symbolic representations of a learned deep model by introducing strong inductive biases. We focus on Graph Neural Networks (GNNs). The technique works as follows: we first encourage sparse latent representations when we train a GNN in a supervised setting, then we apply symbolic regression to components of the learned model to extract explicit physical relations. We find the correct known equations, including force laws and Hamiltonians, can be extracted from the neural network. We then apply our method to a non-trivial cosmology example-a detailed dark matter simulation-and discover a new analytic formula which can predict the concentration of dark matter from the mass distribution of nearby cosmic structures. The symbolic expressions extracted from the GNN using our technique also generalized to out-of-distribution data better than the GNN itself. Our approach offers alternative directions for interpreting neural networks and discovering novel physical principles from the representations they learn.","abx":0,"nw":0,"d":"2020-06-19","dq":0,"y":2020,"au":[466,44,512,548,379,166,580],"c":208,"cs":0,"bib":"2020arXiv200611287C","v":"Neural Information Processing Systems","lk":"arXiv:2006.11287","url":"https://arxiv.org/abs/2006.11287","doi":"10.48550/arXiv.2006.11287","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs"],"m":["Graph neural networks","Symbolic regression"],"u":[]},"x":-0.3056,"yy":-0.804,"p3":[0.1498,0.2822,0.8674],"sim":{"k":"e","l":[[246,0.933],[313,0.93],[75,0.93],[102,0.929],[169,0.927]]},"c3":[-129.65,94.62,6.63],"c2":[-121.53,48.14],"k":1,"r":[339],"rm":0},{"id":"2006.10055","t":"What does the Marked Power Spectrum Measure? Insights from Perturbation Theory","ab":"The marked power spectrum is capable of placing far tighter constraints on cosmological parameters (particularly the neutrino mass) than the conventional power spectrum. What new information does it contain beyond conventional statistics? Through the development of a perturbative model, we find that the mark induces a significant coupling between non-Gaussianities, which are usually found on small scales, and large scales, leading to the additional information content. The model is derived in the context of one-loop perturbation theory and validated by comparison to $N$-body simulations across a variety of mark parameters. At moderate redshifts, including for massive neutrino cosmologies, the theory is in good agreement with the simulations. The importance of non-linear gravitational effects on the large-scale spectra complicates the modeling as there is no well-defined convergence radius of the theory at low $z$. Extension to higher perturbative order and biased tracers is possible via a similar approach, and a simple model of the latter is shown to yield promising results. The theory becomes non-perturbative at redshift zero for small smoothing scales, with important contributions from higher-order terms: these will need to be studied before the full power of this tool can be realized.","abx":0,"nw":0,"d":"2020-06-17","dq":0,"y":2020,"au":[498,200,166],"c":47,"cs":0,"bib":"2020PhRvD.102d3516P","v":"","lk":"arXiv:2006.10055","url":"https://arxiv.org/abs/2006.10055","doi":"10.1103/physrevd.102.043516","tg":{"s":["Fiducial","Massive neutrinos"],"d":["Density fields","Halo catalogs","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Halo catalogs"]},"x":-0.5255,"yy":0.3882,"p3":[-0.0661,-0.2706,-0.7117],"sim":{"k":"e","l":[[317,0.964],[128,0.959],[23,0.954],[299,0.936],[196,0.934]]},"c3":[103.67,25.18,-205.5],"c2":[85.25,130.44],"k":4,"r":[328,329,331,339],"rm":0},{"id":"2006.06298","t":"New Interpretable Statistics for Large Scale Structure Analysis and Generation","ab":"We introduce Wavelet Phase Harmonics (WPH) statistics: interpretable low-dimensional statistics that describe 2D non-Gaussian fields. These statistics are built from WPH moments, which were recently introduced in the data science and machine learning community. We apply WPH statistics to projected 2D matter density fields from the Quijote N-body simulations of the large-scale structure of the Universe. By computing Fisher information matrices, we find that the WPH statistics place more stringent constraints on four of five cosmological parameters when compared to statistics based on the combination of the power spectrum and bispectrum. We also use the WPH statistics with a maximum entropy model to statistically generate new 2D density fields that accurately reproduce the probability density function, the mean and standard deviation of the power spectrum, the bispectrum, and Minkowski functionals of the input density fields. Although other methods are efficient for either parameter estimates or statistical syntheses of the large-scale structure, WPH statistics are the first statistics that achieve state-of-the-art results for both tasks as well as being interpretable.","abx":0,"nw":0,"d":"2020-06-11","dq":0,"y":2020,"au":[213,616,294,240,580,602],"c":100,"cs":0,"bib":"2020PhRvD.102j3506A","v":"Physical Review D","lk":"arXiv:2006.06298","url":"https://arxiv.org/abs/2006.06298","doi":"10.1103/physrevd.102.103506","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Density fields","Power spectra","Higher-order statistics","Weak lensing & 2D maps"],"m":["Generative models","Fisher forecasts"],"u":["Fiducial","Fisher derivatives","Generative models"]},"x":0.6356,"yy":0.2033,"p3":[-0.3956,-0.2035,0.5773],"sim":{"k":"e","l":[[272,0.952],[273,0.945],[89,0.942],[263,0.941],[87,0.939]]},"c3":[40.77,38.38,-105.76],"c2":[79.21,-20.7],"k":5,"r":[331,332,336,339],"rm":0},{"id":"2005.01739","t":"A Faster Fourier Transform? Computing Small-Scale Power Spectra and Bispectra for Cosmological Simulations in $\\mathcal{O}(N^2)$ Time","ab":"We present $\\mathcal{O}(N^2)$ estimators for the small-scale power spectrum and bispectrum in cosmological simulations. In combination with traditional methods, these allow spectra to be efficiently computed across a vast range of scales, requiring orders of magnitude less computation time than Fast Fourier Transform based approaches alone. These methods are applicable to any tracer; simulation particles, halos or galaxies, and take advantage of the simple geometry of the box and periodicity to remove almost all dependence on large random particle catalogs. By working in configuration-space, both power spectra and bispectra can be computed via a weighted sum of particle pairs up to some radius, which can be reduced at larger $k$, leading to algorithms with decreasing complexity on small scales. These do not suffer from aliasing or shot-noise, allowing spectra to be computed to arbitrarily large wavenumbers. The estimators are rigorously derived and tested against simulations, and their covariances discussed. The accompanying code, HIPSTER, has been publicly released, incorporating these algorithms. Such estimators will be of great use in the analysis of large sets of high-resolution simulations.","abx":0,"nw":0,"d":"2020-05-04","dq":0,"y":2020,"au":[498],"c":19,"cs":0,"bib":"2021MNRAS.501.4004P","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2005.01739","url":"https://arxiv.org/abs/2005.01739","doi":"10.1093/mnras/staa3882","tg":{"s":["Quijote (set not stated)"],"d":["Particle snapshots","Halo catalogs","Power spectra","Higher-order statistics"],"m":["No ML"],"u":["Halo catalogs"]},"x":-0.6133,"yy":0.1302,"p3":[0.2519,-0.166,-0.4164],"sim":{"k":"e","l":[[300,0.944],[318,0.944],[329,0.943],[32,0.941],[38,0.94]]},"c3":[33.09,67.29,-197.7],"c2":[2.61,97.34],"k":7,"r":[339],"rm":0},{"id":"2004.09515","t":"The Effective Halo Model: Creating a Physical and Accurate Model of the Matter Power Spectrum and Cluster Counts","ab":"We introduce a physically-motivated model of the matter power spectrum, based on the halo model and perturbation theory. This model achieves 1\\% accuracy on all $k-$scales between $k=0.02h\\,\\mathrm{Mpc}^{-1}$ to $k=1h\\,\\mathrm{Mpc}^{-1}$. Our key ansatz is that the number density of halos depends on the non-linear density contrast filtered on some unknown scale $R$. Using the Effective Field Theory of Large Scale Structure to evaluate the two-halo term, we obtain a model for the power spectrum with only two fitting parameters: $R$ and the effective `sound speed', which encapsulates small-scale physics. This is tested with two suites of cosmological simulations across a broad range of cosmologies and found to be highly accurate. Due to its physical motivation, the statistics can be easily extended beyond the power spectrum; we additionally derive the one-loop covariance matrices of cluster counts and their combination with the matter power spectrum. This yields a significantly better fit to simulations than previous models, and includes a new model for super-sample effects, which is rigorously tested with separate universe simulations. At low redshift, we find a significant ($\\sim 10\\%$) exclusion covariance from accounting for the finite size of halos which has not previously been modeled. Such power spectrum and covariance models will enable joint analysis of upcoming large-scale structure surveys, gravitational lensing surveys and cosmic microwave background maps on scales down to the non-linear scale. We provide a publicly released Python code.","abx":0,"nw":0,"d":"2020-04-20","dq":0,"y":2020,"au":[498,166,240],"c":38,"cs":0,"bib":"2020PhRvD.101l3520P","v":"Physical Review D","lk":"arXiv:2004.09515","url":"https://arxiv.org/abs/2004.09515","doi":"10.1103/PHYSREVD.101.123520","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs","Power spectra"],"m":["Perturbation theory & analytic models","No ML"],"u":["Non-Quijote simulations"]},"x":-0.4062,"yy":0.3657,"p3":[-0.1119,-0.2675,-0.5396],"sim":{"k":"e","l":[[203,0.947],[324,0.947],[115,0.946],[300,0.945],[317,0.945]]},"c3":[10.32,3.55,-131.98],"c2":[-10.41,76.59],"k":4,"r":[339],"rm":0},{"id":"2002.09904","t":"What Can We Learn by Combining the Skew Spectrum and the Power Spectrum?","ab":"Clustering of the large scale structure provides complementary information to the measurements of the cosmic microwave background anisotropies through power spectrum and bispectrum of density perturbations. Extracting the bispectrum information, however, is more challenging than it is from the power spectrum due to the complex models and the computational cost to measure the signal and its covariance. To overcome these problems, we adopt a proxy statistic, skew spectrum which is a cross-spectrum of the density field and its quadratic field. By applying a large smoothing filter to the density field, we show the theory fits the simulations very well. With the spectra and their full covariance estimated from $N$-body simulations as our \"mock\" Universe, we perform a global fits for the cosmological parameters. The results show that adding skew spectrum to power spectrum the $1σ$ marginalized errors for parameters $ b_1^2A_s, n_s$ and $f_{\\rm NL}^{\\rm loc}$ are reduced by $31\\%, 22\\%, 44\\%$, respectively. This is the answer to the question posed in the title and indicates that the skew spectrum will be a fast and effective method to access complementary information to that enclosed in the power spectrum measurements, especially for the forthcoming generation of wide-field galaxy surveys.","abx":0,"nw":0,"d":"2020-02-23","dq":0,"y":2020,"au":[322,397,357],"c":32,"cs":0,"bib":"2020JCAP...08..007D","v":"","lk":"arXiv:2002.09904","url":"https://arxiv.org/abs/2002.09904","doi":"","tg":{"s":["Fiducial"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":0.2016,"yy":0.3328,"p3":[-0.5593,0.2309,0.0051],"sim":{"k":"w","l":[[116,0.172],[245,0.134],[130,0.126],[186,0.12],[228,0.12]]},"c3":[49.62,82.01,-105.3],"c2":[148.56,45.75],"k":9,"r":[339],"rm":0},{"id":"2001.11024","t":"Using the Marked Power Spectrum to Detect the Signature of Neutrinos in Large-Scale Structure","ab":"Cosmological neutrinos have their greatest influence in voids: these are the regions with the highest neutrino to dark matter density ratios. The marked power spectrum can be used to emphasize low density regions over high density regions, and therefore is potentially much more sensitive than the power spectrum to the effects of neutrino masses. Using 22,000 N-body simulations from the Quijote suite, we quantify the information content in the marked power spectrum of the matter field, and show that it outperforms the standard power spectrum by setting constraints improved by a factor larger than 2 on all cosmological parameters. The combination of marked and standard power spectrum allows to place a 4.3σ constraint on the minimum sum of the neutrino masses with a volume equal to 1 (Gpc/h)^3 and without CMB priors. Combinations of different marked power spectra yield a 6σ constraint within the same conditions.","abx":0,"nw":0,"d":"2020-01-29","dq":0,"y":2020,"au":[200,240,580,480,166],"c":122,"cs":0,"bib":"2021PhRvL.126a1301M","v":"Physical Review Letters","lk":"arXiv:2001.11024","url":"https://arxiv.org/abs/2001.11024","doi":"10.1103/physrevlett.126.011301","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.3955,"yy":-0.0452,"p3":[0.1793,0.3157,-0.5501],"sim":{"k":"e","l":[[128,0.954],[108,0.952],[308,0.947],[334,0.944],[282,0.944]]},"c3":[92.81,125.7,-167.75],"c2":[169.66,176.47],"k":8,"r":[334,336,337,339],"rm":0},{"id":"2001.05519","t":"Super-resolution emulator of cosmological simulations using deep physical models","ab":"We present an extension of our recently developed Wasserstein optimized model to emulate accurate high-resolution features from computationally cheaper low-resolution cosmological simulations. Our deep physical modelling technique relies on restricted neural networks to perform a mapping of the distribution of the low-resolution cosmic density field to the space of the high-resolution small-scale structures. We constrain our network using a single triplet of high-resolution initial conditions and the corresponding low- and high-resolution evolved dark matter simulations from the Quijote suite of simulations. We exploit the information content of the high-resolution initial conditions as a well constructed prior distribution from which the network emulates the small-scale structures. Once fitted, our physical model yields emulated high-resolution simulations at low computational cost, while also providing some insights about how the large-scale modes affect the small-scale structure in real space.","abx":0,"nw":0,"d":"2020-01-15","dq":0,"y":2020,"au":[184,632,240,95],"c":78,"cs":0,"bib":"2020MNRAS.495.4227K","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2001.05519","url":"https://arxiv.org/abs/2001.05519","doi":"10.1093/MNRAS/STAA1428","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Particle snapshots"],"m":["CNN","Generative models"],"u":["CNN","Particle snapshots"]},"x":-0.3243,"yy":-0.3472,"p3":[0.1069,0.3288,0.6631],"sim":{"k":"e","l":[[110,0.955],[83,0.948],[313,0.945],[228,0.943],[115,0.942]]},"c3":[-73.02,-74.21,-79.72],"c2":[-63.73,-74.6],"k":1,"r":[335,339],"rm":0},{"id":"1912.06621","t":"Primordial non-Gaussianity without tails -- how to measure fNL with the bulk of the density PDF","ab":"We investigate the possibility to detect primordial non-Gaussianity by analysing the bulk of the probability distribution function (PDF) of late-time cosmic density fluctuations. For this purpose we devise a new method to predict the impact of general non-Gaussian initial conditions on the late-time density PDF. At redshift $z=1$ and for a smoothing scale of 30Mpc/$h$ our predictions agree with the high-resolution Quijote N-body simulations to $\\sim 0.2\\%$ precision. This is within cosmic variance of a $\\sim 100(\\mathrm{Gpc}/h)^3$ survey volume. When restricting to this 30Mpc/$h$ smoothing scale and to mildly non-linear densities ($δ[30\\mathrm{Mpc}/h] \\in [-0.3, 0.4]$) and also marginalizing over potential ignorance of the amplitude of the non-linear power spectrum an analysis of the PDF for such a survey volume can still measure the amplitude of different primordial bispectrum shapes to an accuracy of \\smash{$Δf_{\\mathrm{NL}}^{\\mathrm{loc}}=\\pm 7.4\\ ,\\ Δf_{\\mathrm{NL}}^{\\mathrm{equi}}=\\pm 22.0\\ ,\\ Δf_{\\mathrm{NL}}^{\\mathrm{ortho}}=\\pm 46.0$} . When pushing to smaller scales and assuming a joint analysis of the PDF with smoothing radii of 30Mpc/$h$ and 15Mpc/$h$ ($δ[15\\mathrm{Mpc}/h] \\in [-0.4, 0.5]$) this improves to \\smash{$Δf_{\\mathrm{NL}}^{\\mathrm{loc}}=\\pm 3.3\\ ,\\ Δf_{\\mathrm{NL}}^{\\mathrm{equi}}=\\pm 11.0\\ ,\\ Δf_{\\mathrm{NL}}^{\\mathrm{ortho}}=\\pm 17.0\\ $} - even when marginalizing over the non-linear variances at both scales as two free parameters. Especially, such an analysis could simultaneously measure $f_{\\mathrm{NL}}$ and the amplitude and slope of the non-linear power spectrum. However, at 15Mpc/$h$ our predictions are only accurate to $\\lesssim 0.8\\%$ for the considered density range. We discuss how this has to be improved in order to push to these small scales and make full use of upcoming surveys with a PDF-based analysis.","abx":0,"nw":0,"d":"2019-12-13","dq":0,"y":2019,"au":[497,146,240,629,423,619],"c":65,"cs":0,"bib":"2020MNRAS.498..464F","v":"","lk":"arXiv:1912.06621","url":"https://arxiv.org/abs/1912.06621","doi":"10.1093/mnras/staa2160","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["Fisher forecasts","Perturbation the
