osmological information beyond that contained in standard two-point statistics. Marked power spectra provide a computationally efficient framework to access this higher-order information, by studying the two-point statistics of the density field ``marked'' (i.e. weighted) by a function of its local environmental density. In this work we explore the potential of marks that are sensitive to the morphology of this local environment, rather than simply its density. We study a broad range of such marks, considering mark functions based on the smoothed density, tidal shear amplitude, local degree of isotropy and filamentarity, Gaussian transformations of these quantities and a local fractal dimension estimator. We quantify the merit of different marks in terms of their constraints on key cosmological parameters, including the matter abundance $Ω_m$, the amplitude of fluctuations $σ_8$, and the mass of neutrinos $M_ν$. We have found that density-dependent marks continue to provide the largest improvements over the standard power spectrum, while morphology-based marks yield more modest improvements on their own. Nevertheless, combining density- and morphology-based marks consistently enhances cosmological constraints beyond what either class achieves separately, demonstrating that they probe complementary aspects of the underlying matter distribution. These results provide a systematic assessment of morphology-based marked statistics and explore which geometric properties of the cosmic web contribute most effectively to cosmological parameter inference. They also establish a physically motivated framework for future investigations of optimal marks and their perturbative connection to higher-order correlation functions.","abx":0,"nw":1,"d":"2026-07-28","dq":0,"y":2026,"au":[464,321,162,315,349],"c":0,"cs":0,"bib":"2026arXiv260726021B","v":"","lk":"arXiv:2607.26021","url":"https://arxiv.org/abs/2607.26021","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":[]},"x":-0.056,"yy":0.3454,"p3":[-0.13,-0.1497,-0.4704],"sim":{"k":"e","l":[[128,0.958],[326,0.954],[26,0.947],[317,0.94],[176,0.94]]},"c3":[143.35,101.03,-172.38],"c2":[195.91,91.2],"k":2,"r":[128,176,202,262,273,291,317,326,339],"rm":0},{"id":"2607.18384","t":"Bispectrum BAO and the baryon-dark matter relative velocity","ab":"We evaluate the Baryon Acoustic Oscillation (BAO) signal in the bispectrum as a tool to detect and characterize the relative velocity effect. We extend the existing framework by presenting an updated model for the redshift-space tree-level bispectrum that comprehensively incorporates all relative velocity terms. We introduce a novel, unbiased technique to extract the isotropic BAO dilation parameter ($α_{\\rm iso}$) solely from the bispectrum monopole. Validated against N-body simulations, this template-based extraction successfully recovers the acoustic scale and enhances the statistical constraining power by $\\sim30\\%$, when analyzed in tandem with the pre-reconstruction power spectrum, offering a powerful complement to standard post-reconstruction pipelines. We quantify how individual relative velocity components distort both two- and three-point statistics. We find that these effects induce distinct systematic shifts in the extracted $α_{\\rm iso}$ between the two probes. We find systematic discrepancies of up to $2\\%$ for $b_{v^2}=\\pm0.05$ and up to $20\\%$ for $b_{δ^{bc}}\\le-2$. This differences demonstrate that a direct comparison of independent power spectrum and bispectrum BAO measurements can break parameter degeneracies and isolate the amplitude of these biases. Finally, we provide a concrete prescription to detect and constrain the three associated relative velocity bias parameters, showing that a joint analysis is highly sensitive to the $b_{v^2}$ and $b_{δ^{bc}}$ amplitudes. This establishes the bispectrum BAO as a robust cosmological probe for current and next-generation galaxy surveys, serving both as a cross-check for standard analyses and a crucial diagnostic tool against systematic biases.","abx":0,"nw":1,"d":"2026-07-20","dq":0,"y":2026,"au":[22,282,397],"c":1,"cs":0,"bib":"2026JCAP...11..016N","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2607.18384","url":"https://arxiv.org/abs/2607.18384","doi":"10.1088/1475-7516/2026/11/016","tg":{"s":["Fiducial"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Halo catalogs"]},"x":0.5933,"yy":0.6933,"p3":[-0.2419,0.0515,-0.4386],"sim":{"k":"e","l":[[232,0.95],[304,0.937],[223,0.934],[336,0.933],[15,0.933]]},"c3":[19.68,53.78,133.72],"c2":[-136.13,9.08],"k":5,"r":[339],"rm":0},{"id":"2606.27927","t":"Large-scale structures of the Universe: physics, phenomenology, statistics","ab":"In this series of lectures, we seek to describe the evolution of the cosmic large-scale structure. We will discover the cosmic web - the large-scale skeleton of matter traced by galaxies. It arises from the interplay of the gravitational pull of dark matter and the expansion driven by dark energy. Major large-scale galaxy surveys map the distribution of matter and galaxies across most of the sky, spanning over 10 billion years of cosmic history. I will guide you through some of the principles and challenges behind predicting the statistical properties of the matter and galaxy distribution in vast cosmic volumes. In particular we discuss the underlying nonlinear physics and resulting non-Gaussian statistics that need to be predicted to extract fundamental physics from observational data.","abx":0,"nw":1,"d":"2026-06-26","dq":0,"y":2026,"au":[146],"c":1,"cs":0,"bib":"2026arXiv260627927U","v":"","lk":"arXiv:2606.27927","url":"https://arxiv.org/abs/2606.27927","doi":"","tg":{"s":["Fiducial"],"d":["Density fields","Particle snapshots","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.306,"yy":0.3143,"p3":[-0.3132,0.0542,-0.5484],"sim":{"k":"e","l":[[235,0.95],[203,0.95],[292,0.949],[334,0.947],[126,0.946]]},"c3":[-179.12,37.68,-164.62],"c2":[-111.09,66.79],"k":8,"r":[143,290,333,334,339],"rm":0},{"id":"2606.11295","t":"Interpretable Neural Marked Statistics for Cosmological Inference","ab":"Recovering cosmological information beyond the power spectrum is a central goal for upcoming cosmological surveys, since late-time non-Gaussian signal in the matter density cannot be accessed through two-point statistics alone. Marked statistics fold part of this information back into the two-point level by reweighting the field with non-linear functions. We propose a neural marking scheme to generalize this process through a set of interpretable, physically motivated transformations that directly allow to interpret the gain in cosmological information at the morphological level. We employ a contrastive learning objective to align learnable marked summaries with the underlying cosmological parameters. At $k_{\\max}=0.2\\,h\\mathrm{Mpc}^{-1}$, our neural mark tightens the marginalized constraint on $σ_8$ by $2.9\\times$ and on $Ω_m$ by $1.8\\times$ compared to classical marks, breaking the $Ω_m-σ_8$ degeneracy at the Fisher information level. It further reduces the parameter MSE across our cosmological parameter prior by $1.45\\times$ over the best classical mark. The learned latent geometry aligns with the $Ω_m$ and $σ_8$ directions in parameter space, indicating that the contrastive objective recovers the dominant axes of cosmological information. Our approach opens the door to more powerful, interpretable summary statistics for cosmological inference.","abx":0,"nw":0,"d":"2026-06-09","dq":0,"y":2026,"au":[226,95,462,46],"c":2,"cs":0,"bib":"2026arXiv260611295S","v":"arXiv.org","lk":"arXiv:2606.11295","url":"https://arxiv.org/abs/2606.11295","doi":"10.48550/arXiv.2606.11295","tg":{"s":["Fiducial","Latin hypercube","Fisher derivatives"],"d":["Density fields","Higher-order statistics"],"m":["Other ML","Fisher forecasts"],"u":["Fiducial","Fisher derivatives","Latin hypercube","Fisher forecasts"]},"x":0.4663,"yy":0.2498,"p3":[-0.1812,0.1723,0.264],"sim":{"k":"e","l":[[23,0.947],[176,0.943],[73,0.938],[169,0.929],[181,0.929]]},"c3":[169.48,56.91,-111.12],"c2":[224.89,64.68],"k":9,"r":[83,107,128,326,331],"rm":0},{"id":"2606.01529","t":"Optimal Transport Reconstruction of Biased Tracers in Primordial Non-Gaussian Fields","ab":"Optimal transport provides an efficient method to infer the displacement of objects by mapping their initial positions to their present-day locations over cosmic time; equivalently, it enables the reconstruction of initial positions from measurements taken at later times. The method has been shown to be accurate even if positions for only a biased subset of the particles are measured, provided that the initial displacement field was Gaussian. The method does not rely on the assumption of a Gaussian displacement field, and thus may be extended to the reconstruction of non-Gaussian initial conditions. Here, we demonstrate how this is achieved for a class of \"local\" primordial non-Gaussian fields of current interest in cosmology. For these models, there is a distinctive signature in the large scale clustering of biased tracers which depends on the product of the primordial amplitude $f_{\\rm NL}$ and the nature of the tracers $b_φ$. Our method exploits the fact that this signature is not present in the full field; it is only present in biased fields. Therefore, the mass that is not in the biased subset, what we call the \"dust\", also has a characteristic scale-dependence, albeit of a different amplitude. We show that the quality of the optimal transport reconstruction improves as the model for this dust becomes more realistic.","abx":0,"nw":1,"d":"2026-06-01","dq":0,"y":2026,"au":[222,536,490,106,546],"c":0,"cs":0,"bib":"2026PhRvD.114h3502N","v":"Physical Review D","lk":"arXiv:2606.01529","url":"https://arxiv.org/abs/2606.01529","doi":"10.1103/kjhd-7h86","tg":{"s":["Quijote-PNG"],"d":["Particle snapshots","Halo catalogs","Power spectra"],"m":["Perturbation theory & analytic models","No ML"],"u":["Halo catalogs","Power spectra"]},"x":-0.1213,"yy":0.7076,"p3":[-0.5695,-0.36,-0.3092],"sim":{"k":"e","l":[[180,0.946],[106,0.934],[204,0.934],[324,0.932],[216,0.929]]},"c3":[-17.58,-185.62,123.58],"c2":[40.98,-279.71],"k":4,"r":[110,123,180,216,264],"rm":0},{"id":"2605.30305","t":"Augmented Correlation Functions for Spectroscopic Galaxy Surveys","ab":"Galaxy redshift surveys encode a wealth of information generated by nonlinear gravitational evolution, galaxy bias, and redshift-space distortions, only part of which is accessible through standard two-point statistics. Motivated by the need for flexible and computationally efficient alternatives, we introduce the augmented correlation function, a general framework in which an arbitrary transformation of the galaxy field defines additional ``latent'' dimensions that extend the standard two-point correlation function and isolate clustering properties averaged out in conventional analyses. As a proof of concept, we study a latent variable constructed from the pairwise gradient of the inverse Laplacian of the galaxy density field, showing that the resulting statistics naturally distinguish clustering regimes associated with infalling and outflowing pairs. Using Fisher forecasts based on $z=1$ halo catalogues from the Quijote simulations within $νΛ\\mathrm{CDM}$ cosmology, we find that the augmented correlation systematically yields tighter constraints on all cosmological parameters considered. Although these improvements should be regarded as indicative given the exploratory nature of the analysis and the limitations of Fisher forecasts and simulations, our results demonstrate the potential of augmented correlations as a flexible framework for extracting additional information from spectroscopic galaxy surveys.","abx":0,"nw":0,"d":"2026-05-28","dq":0,"y":2026,"au":[167],"c":2,"cs":0,"bib":"2026arXiv260530305B","v":"","lk":"arXiv:2605.30305","url":"https://arxiv.org/abs/2605.30305","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Massive neutrinos","Higher-order statistics"]},"x":-0.0973,"yy":0.1377,"p3":[0.181,-0.2411,-0.2724],"sim":{"k":"e","l":[[173,0.935],[176,0.932],[214,0.93],[309,0.93],[143,0.93]]},"c3":[150.83,114.97,-116.06],"c2":[234.13,78.68],"k":2,"r":[90,199,249,278,284,291,322,331,339],"rm":0},{"id":"2605.21483","t":"Velocityformer: Broken-Symmetry-Matched Equivariant Graph Transformers for Cosmological Velocity Reconstruction","ab":"Precise measurement of the kinematic Sunyaev-Zel'dovich (kSZ) effect - a probe of the large-scale distribution of baryonic matter, a key observable for cosmological inference - requires accurate reconstruction of galaxy velocities from spectroscopic surveys. The signal-to-noise ratio (SNR) of kSZ measurements scales directly with the correlation coefficient $r$ between reconstructed and true velocities. We introduce Velocityformer, an equivariant graph transformer architecture designed to match the specific symmetry of the observational data. While the underlying physics is equivariant with respect to translations and rotations, observational effects break this symmetry due to the preferred line-of-sight direction. Matching the model's inductive bias to the data's broken symmetry consistently improves performance across all model sizes and training volumes, with Velocityformer improving $r$ by 35% over the standard linear theory baseline and outperforming ML baselines at every data volume. By matching the model's inductive bias to the data and conditioning on the physics-based long-wavelength solution, Velocityformer is highly data-efficient, training to high accuracy on as few as 4 low-fidelity simulations, and generalises zero-shot across input geometry, cosmological parameters, and galaxy sample. On high-fidelity simulated galaxy catalogues, this yields a 30% improvement in $r$ over the physical baseline, directly translating to the same SNR gain on observational data.","abx":0,"nw":0,"d":"2026-05-20","dq":0,"y":2026,"au":[626,165,644,76],"c":0,"cs":0,"bib":"2026arXiv260521483T","v":"arXiv.org","lk":"arXiv:2605.21483","url":"https://arxiv.org/abs/2605.21483","doi":"10.48550/arXiv.2605.21483","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs","Galaxy mocks (HOD)","Redshift space"],"m":["Graph neural networks"],"u":["Non-Quijote simulations","Galaxy mocks (HOD)","Redshift space"]},"x":-0.0492,"yy":-0.7774,"p3":[0.1941,-0.2879,0.598],"sim":{"k":"e","l":[[198,0.93],[65,0.929],[53,0.928],[131,0.927],[102,0.927]]},"c3":[-71.53,65.22,100.98],"c2":[-81.03,-56.66],"k":9,"r":[92,94,339],"rm":0},{"id":"2605.18938","t":"First detection of the moving lens effect with ACT and DESI LS","ab":"The moving lens effect is a secondary CMB anisotropy induced by the transverse motion of gravitational potentials. We develop a Fourier-space cross-spectrum estimator that retains the scale dependence of the signal, and apply it to the Atacama Cosmology Telescope (ACT) DR6 CMB temperature maps and luminous red galaxies from the DESI Legacy Imaging Surveys. Using the foreground-reduced ACT NILC map, we find strong evidence for a non-zero amplitude of the cross-correlation $b_{\\rm ML} = 1.24 \\pm 0.26$ ($4.8σ$) for the extended sample and $0.93 \\pm 0.25$ ($3.7σ$) for the main sample, both consistent with the halo-model prediction for the moving lens signal. Our Fourier-based pipeline enforces separation of scales between the reconstructed velocities and the cross-correlation, which we show is essential for foreground mitigation. The residual foreground contamination is expected to be significantly smaller than the signal from both simulations and the multi-frequency analysis presented in this paper. No curl-mode test exceeds $2σ$, and the results are robust across analysis variants. They constitute the first detection of the moving lens effect and unlock access to transverse velocities, a new cosmological probe. When combined with the kinematic Sunyaev-Zel'dovich effect, this provides a path toward mapping the three-dimensional velocity field of the Universe, opening a new avenue for probing the growth of structure and gravity on large scales.","abx":0,"nw":0,"d":"2026-05-18","dq":0,"y":2026,"au":[572,372,591,42,77,201,208],"c":7,"cs":0,"bib":"2026arXiv260518938H","v":"","lk":"arXiv:2605.18938","url":"https://arxiv.org/abs/2605.18938","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra","Weak lensing & 2D maps"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.3707,"yy":0.7007,"p3":[-0.2911,-0.0931,-0.2777],"sim":{"k":"e","l":[[144,0.931],[203,0.929],[84,0.928],[100,0.928],[38,0.926]]},"c3":[31.54,-55.13,85.09],"c2":[-152.27,18.45],"k":0,"r":[339],"rm":0},{"id":"2605.09004","t":"Separate Universe Super-Resolution Emulator","ab":"We present a machine-learning model for generating super-resolution $N$-body simulations with non-vanishing spatial curvature, conditioned on a given low-resolution field, $Ω_k$, $Ω_\\mathrm{m}$, $σ_8$, $h$, and redshift. By upscaling the resolution of $N$-body simulations, such models can drastically reduce the computational cost of producing high-resolution simulations suitable for modelling current and future surveys of large-scale structure. Our model is trained as a generative adversarial network, allowing injected noise to be interpreted as stochastic structure and enabling the generation of an ensemble of plausible high-resolution realisations. We evaluate the model performance by comparing key cosmological summary statistics in the generated simulations to their high-resolution counterparts. We find that the model accurately reproduces large-scale statistics, robustly recovering most of the power that was missing from the low-resolution input, but exhibits a residual suppression of power on small scales of up to $\\sim 10\\%$ at $k \\sim 1\\,h\\,\\mathrm{Mpc}^{-1}$. The abundance of halos around $10^{14}\\,M_\\odot$ is affected at a similar level, and we find that the profiles of these halos have a lower central density. Although the overall performance is decent, we anticipate that the fidelity of the generative model can be further increased with more and better training data, as well as through improvements in the model architecture and training process. To show a production-scale use case, we apply our model to upscale the resolution of a light cone from a large-volume $N$-body simulation with spatial curvature, producing a first-of-its-kind catalogue that simultaneously captures geometric effects at large scales and accurate nonlinear structure at small scales.","abx":0,"nw":0,"d":"2026-05-09","dq":0,"y":2026,"au":[173,353,163],"c":1,"cs":0,"bib":"2026arXiv260509004F","v":"","lk":"arXiv:2605.09004","url":"https://arxiv.org/abs/2605.09004","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Particle snapshots","Halo catalogs","Power spectra"],"m":["Generative models"],"u":["Non-Quijote simulations","Particle snapshots"]},"x":-0.4492,"yy":-0.561,"p3":[0.3311,-0.1101,0.769],"sim":{"k":"e","l":[[3,0.968],[260,0.952],[36,0.948],[137,0.948],[115,0.945]]},"c3":[-225.03,-81.58,244.29],"c2":[-251.9,-248.8],"k":1,"r":[],"rm":1},{"id":"2605.04864","t":"Efficient estimators for power spectrum and bispectrum multipole measurements","ab":"Large galaxy surveys demand fast and scalable estimators for anisotropic clustering statistics beyond the monopole. We present a suite of efficient FFT-based estimators for power-spectrum and bispectrum multipoles, built upon exact conjugation and parity symmetries of spherical-harmonic--weighted Fourier transforms of real fields. These symmetries eliminate redundant magnetic sub-configurations, thereby reducing the computational cost by a factor of 2. For the Yamamoto power-spectrum multipoles, we further decrease the cost of high-order even multipoles by algebraically expressing ${L}_{2n}$ in terms of lower-order Legendre polynomials, thereby measuring modified high-order multipoles using only low-$\\ell$ fields with a small and controlled deviation from the traditional definition. We introduce a new TripoSH bispectrum estimator obtained by compressing the Scoccimarro bispectrum along an alternative triangle side, which substantially reduces the FFT scaling for commonly used quadrupole configurations in the large-$k$-bin limit. We also derive an analytic treatment of bispectrum shot noise by integrating spherical-harmonic kernels over the triangle-constrained $k$-space volumes, avoiding additional FFTs or costly spherical-Bessel evaluations and enabling fast and accurate shot-noise subtraction. Based on these optimizations, we also introduce CosmoNPC, an open-source Python package for large-scale-structure clustering measurements.","abx":0,"nw":0,"d":"2026-05-06","dq":0,"y":2026,"au":[701,549,249,670,672,705,261,235,340],"c":2,"cs":0,"bib":"2026arXiv260504864X","v":"","lk":"arXiv:2605.04864","url":"https://arxiv.org/abs/2605.04864","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra","Higher-order statistics","Redshift space"],"m":["No ML"],"u":["Redshift space"]},"x":0.099,"yy":0.2275,"p3":[0.1542,0.063,-0.5399],"sim":{"k":"e","l":[[87,0.949],[328,0.941],[304,0.94],[15,0.938],[276,0.936]]},"c3":[124.09,-3.21,-142.0],"c2":[161.64,154.02],"k":0,"r":[278,312,336,339],"rm":0},{"id":"title:capsanalyzeratoolforinvestigatingthestructureoftheuniverse","t":"Caps-analyzer: a tool for investigating the structure of the universe","ab":"","abx":0,"nw":0,"d":"2026","dq":1,"y":2026,"au":[132],"c":0,"cs":2,"bib":"","v":"","lk":"Master thesis","url":"https://hammer.purdue.edu/ndownloader/files/64310286","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["No ML"],"u":["Quijote (set not stated)","Density fields","Higher-order statistics","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.2843,"yy":0.3759,"p3":[-0.3906,-0.0382,0.2709],"sim":{"k":"w","l":[[41,0.345],[327,0.112],[264,0.11],[128,0.107],[272,0.099]]},"c3":[-27.17,124.79,321.55],"c2":[-221.49,297.24],"k":5,"r":[],"rm":1},{"id":"2605.00980","t":"Coverage is not enough: Frequentist tests of simulation-based inference for primordial non-Gaussianity","ab":"(Abridged) Simulation-based inference (SBI) has emerged as a powerful framework for extracting cosmological information from complex, non-linear data where analytical likelihoods are unavailable. Its reliability is commonly assessed using coverage-based diagnostics under the prior predictive distribution, which probe calibration only in an averaged sense and do not constrain posterior behavior at fixed parameter value, the regime relevant for practical inference. We investigate these limitations in the context of primordial non-Gaussianity, parameterized by $f_\\mathrm{NL}$, using simulations of the dark matter halo field. We compare SBI based on contrastive neural ratio estimation (CNRE) with likelihood-based inference (LBI) using the power spectrum, bispectrum, and wavelet scattering transform (WST) coefficients across 1000 realizations. SBI and LBI agree well on posterior means and skewness, while the variance agrees on average but shows weaker realization-by-realization consistency. Larger differences arise in the kurtosis, indicating discrepancies in the posterior tails. These effects are already present for the power spectrum - where the Gaussian likelihood assumed in LBI is best justified - and are most pronounced for the combined power spectrum and bispectrum, where SBI posteriors are often underconfident and can yield weaker constraints than either statistic individually, despite passing coverage tests. WST coefficients further tighten constraints on $f_\\mathrm{NL}$, even when restricted to large scales. Our results highlight both the potential of higher-order statistics and the need for validation strategies that probe the posterior shape beyond standard coverage diagnostics.","abx":0,"nw":0,"d":"2026-05-01","dq":0,"y":2026,"au":[630,149,37],"c":3,"cs":0,"bib":"2026A&A...714A..66A","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2605.00980","url":"https://arxiv.org/abs/2605.00980","doi":"10.1051/0004-6361/202660668","tg":{"s":["Fiducial","Quijote-PNG"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Simulation-based inference"],"u":["Quijote-PNG","Fiducial"]},"x":-0.0778,"yy":-0.2085,"p3":[0.0036,-0.0869,0.4615],"sim":{"k":"e","l":[[107,0.945],[273,0.943],[178,0.939],[167,0.938],[208,0.938]]},"c3":[41.03,54.12,26.57],"c2":[154.54,-54.28],"k":5,"r":[107,185,264,291,339],"rm":0},{"id":"2604.23236","t":"The functional form of galaxy and halo luminosity and mass functions","ab":"The galaxy luminosity and stellar mass function (LF, SMF), and halo mass function (HMF), are fundamental quantities in astrophysics and crucial inputs to a range of astrophysical and cosmological analyses. They are typically parametrised by fitting functions that have been chosen \"by eye\" to match observed or simulated data. We apply symbolic regression -- specifically the Exhaustive Symbolic Regression (ESR) algorithm -- to automate the search for optimal LF, SMF and HMF functional forms. ESR scores all functions up to a maximum complexity composed of a user-defined basis set of operators using the description length, an approximation to the Bayesian evidence that balances accuracy with complexity. We find many functions outperforming the Schechter and double Schechter functions for the LF and SMF, and that outperform the Press--Schechter and Warren/Tinker functions for the HMF. By additionally imposing \"physicality checks\" on functions' extrapolation and integration properties, we identify the optimal, low-complexity functional forms in terms of accuracy, simplicity and behaviour beyond the data range. As well as providing drop-in replacements for literature LF, SMF and HMF fitting functions, and identifying robust behaviour across well-fitting functions, we present a framework with which symbolic regression may be used to automate the discovery of optimal functions for any astrophysical dataset.","abx":0,"nw":0,"d":"2026-04-25","dq":0,"y":2026,"au":[47,273,172,511],"c":2,"cs":0,"bib":"2026MNRAS.550g1333F","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2604.23236","url":"https://arxiv.org/abs/2604.23236","doi":"10.1093/mnras/stag1333","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs"],"m":["Symbolic regression"],"u":["Non-Quijote simulations"]},"x":0.0578,"yy":-0.5709,"p3":[0.2465,0.5713,0.1688],"sim":{"k":"e","l":[[183,0.951],[17,0.94],[135,0.935],[158,0.931],[185,0.928]]},"c3":[-4.63,-75.51,82.47],"c2":[-122.89,-15.95],"k":7,"r":[339],"rm":0},{"id":"2604.19613","t":"MG-NECOLA: A Field-Level Emulator for $f(R)$ Gravity and Massive Neutrino Cosmologies","ab":"Accurate modeling of non-linear gravitational dynamics is essential for constraining extensions to the standard cosmological model using large-scale structure observations. While high-resolution $N$-body simulations provide the required fidelity, they are computationally prohibitive for the large ensembles needed to analyze Modified Gravity (MG) scenarios. We present MG-NECOLA, a field-level emulator based on a convolutional neural network that upgrades fast, approximate MG-PICOLA simulations to near--$N$-body accuracy at a fraction of the computational cost. Trained on a suite of QUIJOTE_MG simulations for $f(R)$ gravity, MG-NECOLA achieves nearly sub-percent accuracy ($\\lesssim 1\\%$) in both the matter power spectrum and bispectrum up to $k \\simeq 1~h\\,\\mathrm{Mpc}^{-1}$. Crucially, although being trained on a fixed cosmology, the network generalizes robustly to cosmologies outside its training manifold keeping the error below $5\\%$. It successfully recovers the General Relativity limit ($Λ$CDM) without introducing spurious MG signals and accurately captures the power suppression induced by massive neutrinos ($M_ν\\leq 0.4$ eV), despite being trained on cosmologies with massless neutrinos. The pipeline delivers a speed-up factor of $\\sim 1500\\times$ relative to full $N$-body runs, generating a high-fidelity realization in O$(10^3)$ CPU seconds compared to O$(10^6)$ for the baseline. This accuracy-efficiency trade-off establishes MG-NECOLA as a powerful tool for generating the massive mock catalogs required for next-generation galaxy surveys.","abx":0,"nw":0,"d":"2026-04-21","dq":0,"y":2026,"au":[296,450,199,424,481,150],"c":0,"cs":0,"bib":"2026arXiv260419613B","v":"","lk":"arXiv:2604.19613","url":"https://arxiv.org/abs/2604.19613","doi":"","tg":{"s":["Massive neutrinos","Quijote-MG","Non-Quijote simulations"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["CNN","Emulators & regression ML"],"u":["Massive neutrinos","Emulators & regression ML"]},"x":-0.0839,"yy":-0.4498,"p3":[-0.0064,0.185,0.584],"sim":{"k":"e","l":[[74,0.983],[171,0.952],[286,0.95],[76,0.949],[31,0.948]]},"c3":[-163.04,31.29,-40.03],"c2":[-87.18,107.96],"k":1,"r":[74,135,157,158,171,183,260,286,313,335,339],"rm":0},{"id":"2604.17981","t":"Efficiently emulating distribution functions in gigaparsec volumes for varying cosmological parameters","ab":"We present a new method for emulating the halo mass function (HMF) and other distribution functions in large effective volumes, down to low halo masses, whilst simultaneously modifying large ranges of parameters, for a fraction of the cost of traditional periodic cosmological simulations. We demonstrate the method by selecting small regions, $V \\sim (50 \\,h^{-1}{\\rm Mpc})^3$, with a range of overdensities from the Quijote suite, consisting of tens of thousands of $(1 \\,h^{-1}{\\rm Gpc})^3$ $N$-body simulation volumes run with varying $Λ$CDM parameters. We train a differentiable emulator, conditioned on the overdensity of the region and these global parameters, to reproduce the halo mass function in these regions. We then successfully recover the global distribution of halo masses of the entire box by integrating over the overdensity distribution. Our approach uses just $\\sim\\,$0.026% of the original simulation volume, and suggests that suites of targeted `zoom' simulations, extracted from low resolution parent volumes, can be used to emulate large volume simulations at a fraction of the computational cost, whilst simultaneously pushing the dynamic range to much lower masses than can be achieved in periodic simulations. We discuss emulation of other key dark matter and baryonic distribution functions, as well as higher order statistics, with implications for the interpretation of upcoming wide field surveys on observatories such as Euclid, Roman and Rubin.","abx":0,"nw":0,"d":"2026-04-20","dq":0,"y":2026,"au":[138,452,663,157,585,581,240],"c":1,"cs":0,"bib":"2026MNRAS.552g1860L","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2604.17981","url":"https://arxiv.org/abs/2604.17981","doi":"10.1093/mnras/stag1860","tg":{"s":["Latin hypercube"],"d":["Halo catalogs"],"m":["Emulators & regression ML"],"u":["Latin hypercube"]},"x":-0.276,"yy":-0.1219,"p3":[0.4656,-0.1704,-0.0481],"sim":{"k":"e","l":[[339,0.949],[277,0.944],[115,0.942],[142,0.942],[113,0.94]]},"c3":[187.34,-19.08,9.24],"c2":[152.46,-94.76],"k":7,"r":[96,107,145,147,174,269,339],"rm":0},{"id":"2604.18581","t":"If at First You Don't Succeed, Trispectrum: I. Estimating the Matter Power Spectrum Covariance with Higher-Order Statistics","ab":"We present a method to estimate non-Gaussian power spectrum covariance matrices by directly measuring the response of the small-scale power spectrum to long-wavelength perturbations via bispectrum and trispectrum estimators. Specifically, we derive estimators for the complete non-Gaussian matter power spectrum covariance, including the super-sample contribution, in terms of the squeezed bispectrum and collapsed trispectrum of the underlying density field. We apply these estimators to the Quijote simulations, and recover unbiased estimates of the small-scale ($k\\gtrsim 0.15~h/{\\rm Mpc}$) matter power spectrum covariance at the percent level using only 25 simulations - comparable to the precision of the sample covariance estimated using 5,000 simulations. This technique significantly reduces the number of simulations needed to estimate power spectrum covariances and opens the possibility of inferring power spectrum covariances directly from survey data, enabling stringent tests of simulations and, potentially, power spectrum analyses that do not rely on external covariance matrices.","abx":0,"nw":0,"d":"2026-04-20","dq":0,"y":2026,"au":[563,372,639,469],"c":2,"cs":0,"bib":"2026arXiv260418581G","v":"","lk":"arXiv:2604.18581","url":"https://arxiv.org/abs/2604.18581","doi":"","tg":{"s":["Fiducial"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Perturbation theory & analytic models"]},"x":0.1446,"yy":0.4129,"p3":[-0.2793,0.0695,0.0718],"sim":{"k":"e","l":[[264,0.954],[58,0.95],[257,0.95],[259,0.948],[263,0.948]]},"c3":[-24.67,-219.81,-72.26],"c2":[92.94,-212.04],"k":5,"r":[98,161,221,229,248,264,285,289,319,339],"rm":0},{"id":"2604.16853","t":"Signatures of Massive Neutrinos in the Cosmic Web via Persistent Homology","ab":"We present the second paper in our program characterizing the impact of massive neutrinos on the multiscale cosmic web using global topology and persistent homology. Building on the methodology established in Paper I, based on discrete Morse theory, we analyze a subset of the Quijote simulations to compute persistent diagrams, Betti curves, and additional topological statistics for both dark matter and halo density fields, across redshifts z=0,1,2. A central result of our study is the first clear demonstration that apex points in persistent diagrams are especially sensitive to neutrino mass, with enhanced sensitivity for specific pairs of saddle points at high redshift. In addition, Betti curves from dark matter density fields broaden and flatten with increasing neutrino masses, exhibiting two characteristic density thresholds where Betti numbers remain invariant. These mass-dependent signatures are detectable at the few-percent level, even for $M_ν \\sim 0.1$ eV, providing a robust, physically grounded probe of massive neutrinos in the cosmic web. While traditional two-point statistics encode only pairwise correlations and cannot fully break parameter degeneracies, persistent homology captures higher-order, multiscale information that can lift these degeneracies. Moreover, its high sensitivity to the sum of neutrino masses makes it a promising complement to conventional analyses. Our results thus establish a solid foundation for forward-modeling or emulator-based approaches using persistent homology and environment-based statistics to constrain neutrino mass - potentially enabling direct detection - and additional cosmological parameters, with immediate relevance for ongoing and upcoming galaxy surveys, including DESI, Euclid, and Rubin-LSST.","abx":0,"nw":0,"d":"2026-04-18","dq":0,"y":2026,"au":[279,461,182,124,292,181,688,262],"c":0,"cs":0,"bib":"2026ApJ..1008..170Y","v":"Astrophysical Journal","lk":"arXiv:2604.16853","url":"https://arxiv.org/abs/2604.16853","doi":"10.3847/1538-4357/ae975f","tg":{"s":["Massive neutrinos"],"d":["Density fields","Halo catalogs","Higher-order statistics"],"m":["No ML"],"u":[]},"x":0.675,"yy":-0.1335,"p3":[-0.3521,0.9156,-0.1407],"sim":{"k":"e","l":[[40,0.973],[43,0.965],[192,0.961],[179,0.96],[67,0.944]]},"c3":[2.89,183.66,-153.82],"c2":[64.23,239.73],"k":8,"r":[40,61,116,179,192,215,237,331,336,339],"rm":0},{"id":"2604.09148","t":"The Cosmic Web and Its Filaments: Neutrino Mass from Topology and Persistent Homology","ab":"We apply discrete Morse theory, global topology, and persistent homology to characterize the impact of massive neutrinos on the multiscale cosmic web, focusing on filaments. The topology of the cosmic web is sensitive to neutrino imprints, and persistence diagrams provide more information than commonly used summary statistics by quantifying the longevity of topological features across densities. This scale-adaptive, parameter-free formalism is powerful, as massive neutrinos affect halos, walls, filaments, and voids in distinct ways. Within this framework, we simultaneously assess their impact on tracers and skeleton structures and capture their multiscale signals across cosmic time. Discrete Morse theory is also well suited for particle-based neutrino implementations, often affected by Poisson shot noise, as it preserves the salient features of the underlying smooth field. Using two independent sets of N-body simulations, we present filament statistics and persistence diagrams in massive-neutrino cosmologies. Our results show that neutrinos leave distinct imprints on filaments and skeleton connectivity, producing mass-dependent signatures most pronounced at high redshift (z~2) and detectable at the few-percent level for masses as small as $M_ν\\sim 0.1$ eV. Filaments thus provide an ideal environment for isolating neutrino effects. We also compare two implementations of massive neutrinos to assess systematics. Our study establishes a promising avenue for leveraging cosmic web topology, persistent homology, and environment-based statistics to constrain or directly detect neutrino mass and infer the mass hierarchy - a long-standing challenge in particle physics and a major objective of ongoing and upcoming galaxy redshift surveys (e.g., DES, DESI, Euclid, Rubin-LSST).","abx":0,"nw":0,"d":"2026-04-10","dq":0,"y":2026,"au":[262,279,461],"c":2,"cs":0,"bib":"2026arXiv260409148R","v":"","lk":"arXiv:2604.09148","url":"https://arxiv.org/abs/2604.09148","doi":"","tg":{"s":["Massive neutrinos","Non-Quijote simulations"],"d":["Density fields","Particle snapshots","Halo catalogs","Higher-order statistics"],"m":["No ML"],"u":["Particle snapshots","Halo catalogs"]},"x":0.6501,"yy":-0.1206,"p3":[-0.2483,0.8878,-0.1625],"sim":{"k":"e","l":[[39,0.973],[43,0.958],[192,0.951],[235,0.951],[179,0.947]]},"c3":[33.09,170.22,-140.24],"c2":[87.27,226.88],"k":8,"r":[61,116,179,192,215,331,336,339],"rm":0},{"id":"title:newmachinelearningalgorithmstostudythelargescalestructureoftheuniverse","t":"New Machine Learning Algorithms to Study the Large-Scale Structure of the Universe","ab":"","abx":0,"nw":0,"d":"2026","dq":1,"y":2026,"au":[141],"c":0,"cs":2,"bib":"","v":"","lk":"Master thesis","url":"https://amslaurea.unibo.it/id/eprint/38912/1/TESI_CLAUDIA_CRASTOLLA.pdf","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields"],"m":["Other ML"],"u":["Quijote (set not stated)","Density fields","Other ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.0336,"yy":-0.333,"p3":[-0.2764,0.0288,0.59],"sim":{"k":"w","l":[[33,0.345],[246,0.187],[160,0.18],[327,0.165],[268,0.146]]},"c3":[-29.59,41.92,340.62],"c2":[-322.06,160.9],"k":9,"r":[],"rm":1},{"id":"2604.00097","t":"Lagrangian Bias as a Gaussian Random Field","ab":"Halo bias is typically treated as a set of coefficients in a perturbative expansion. We show instead that every point in a Gaussian density field has a well-defined scale-independent Lagrangian bias, thereby defining a bias field. This property can be extended to any linear operator acting on the Lagrangian density field, generating secondary bias fields. Halo bias then arises from geometric selection of Lagrangian patches within this pre-existing field, rather than being generated by collapse. We demonstrate that this framework predicts the measured $b(M)$ relation for halos. The multivariate Gaussian structure of the fields naturally explains the Gaussian distribution of halo bias at fixed mass and assembly bias. The results presented here motivate combining this framework with a forward model of halo collapse, yielding an ab initio model for halo clustering.","abx":0,"nw":0,"d":"2026-03-31","dq":0,"y":2026,"au":[73],"c":2,"cs":0,"bib":"2026arXiv260400097B","v":"","lk":"arXiv:2604.00097","url":"https://arxiv.org/abs/2604.00097","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Density fields"]},"x":-0.4676,"yy":0.2532,"p3":[0.1484,-0.4231,-0.6341],"sim":{"k":"e","l":[[295,0.929],[298,0.928],[324,0.926],[329,0.92],[6,0.92]]},"c3":[-70.7,85.51,-198.41],"c2":[-49.66,182.68],"k":2,"r":[292,295,337,339],"rm":0},{"id":"2604.02300","t":"Revealing the neutrino mass through persistent homology of the cosmic web","ab":"Cosmological constraints on neutrino mass offer a promising avenue for advancing our understanding of both fundamental particle physics and the evolution of cosmic large-scale structure. To overcome challenges associated with traditional probes of neutrino mass, particularly degeneracies with other parameters, we consider topological summaries of the cosmic web based on the formalism of persistent homology. We introduce persistence strips, a novel representation that segments Betti curves by topological persistence, effectively condensing two-dimensional persistence diagrams into a set of one-dimensional curves. Applied to the FLAMINGO suite of cosmological simulations, these topological descriptors demonstrate pronounced sensitivity to neutrino mass. By constructing an emulator spanning a 10-dimensional $w_0 w_a\\text{CDM} +ν$ cosmological parameter space that includes parameters degenerate with neutrino masses in conventional approaches, assuming a volume of only $(350 \\, \\mathrm{Mpc})^3$, we obtain neutrino mass constraints with an uncertainty of $0.05 \\, \\mathrm{eV}$ for the total matter field and $0.13 \\, \\mathrm{eV}$ for the dark matter-only field, with the strongest constraints coming from void topology. Persistence strips exhibit roughly twice the constraining power of unbinned Betti curves and, through their multi-scale, environment-dependent sensitivity, systematically break degeneracies between neutrino mass and other cosmological parameters. We pinpoint the precise physical origin of the signal, identifying two equally important contributions: sensitivity to the neutrino mass fraction, which is highest in underdense regions, and the impact of neutrinos on the distribution of dark matter. Our findings highlight the particular promise of applying topological statistics to weak lensing measurements, which directly probe the total matter distribution.","abx":0,"nw":1,"d":"2026-04-02","dq":0,"y":2026,"au":[328,662,116,576,669,288,539],"c":3,"cs":0,"bib":"2026MNRAS.549ag937W","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2604.02300","url":"https://arxiv.org/abs/2604.02300","doi":"10.1093/mnras/stag937","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Particle snapshots","Higher-order statistics"],"m":["Simulation-based inference","Emulators & regression ML"],"u":["Simulation-based inference"]},"x":0.6959,"yy":-0.0976,"p3":[-0.1107,0.8193,0.0046],"sim":{"k":"e","l":[[39,0.965],[40,0.958],[192,0.945],[179,0.945],[67,0.938]]},"c3":[7.48,228.25,-124.79],"c2":[105.29,248.36],"k":8,"r":[40,96,108,111,112,170,179,192,215,275,284,292,312,339],"rm":0},{"id":"2603.22797","t":"Enhancing cosmological constraints with nonlinear tanh transformations of Hermite-Gaussian Derivative fields","ab":"A key goal in large-scale structure analysis is to extract multi-scale information to improve cosmological parameter constraints. In particular, higher-order derivative fields are especially valuable as they capture the geometric and topological information of the cosmic web that is highly sensitive to cosmological parameters. Traditional derivative-based methods, such as finite-difference or Fourier approaches, suffer from noise amplification at small scales and cannot stably capture multi-scale features. We present a robust two-step framework: first, stable multi-scale arbitrary-order derivatives are obtained via Hermite-Gaussian convolutional filters that suppress small-scale noise; second, a tanh nonlinear transformation compresses extreme density contrasts and enhances the visibility of cosmic web structures. Using the Quijote simulations, we show that combining multi-scale first-order spectra yields improvements of 1.2-3.0 times across all seven cosmological parameters, while multi-order spectra at a fixed scale provide 1.3-2.9 times gains. The most comprehensive combination achieves nominal gains of 2.0-5.3 times. Our method offers a robust approach to extracting additional cosmological information for future surveys.","abx":0,"nw":0,"d":"2026-03-24","dq":0,"y":2026,"au":[711,683,714,325,229,390,668],"c":0,"cs":0,"bib":"2026RAA....26g5013M","v":"Research in Astronomy and Astrophysics","lk":"arXiv:2603.22797","url":"https://arxiv.org/abs/2603.22797","doi":"10.1088/1674-4527/ae5617","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Massive neutrinos","Higher-order statistics","Fisher forecasts"]},"x":0.1699,"yy":-0.286,"p3":[-0.0844,0.4132,0.4396],"sim":{"k":"e","l":[[181,0.938],[311,0.937],[225,0.937],[110,0.937],[228,0.936]]},"c3":[-11.73,166.8,-65.27],"c2":[155.22,120.43],"k":1,"r":[112,175,192,199,322,339],"rm":0},{"id":"title:cosmologyasanoptimisationproblem","t":"Cosmology as an Optimisation Problem","ab":"","abx":0,"nw":0,"d":"2026","dq":1,"y":2026,"au":[613],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://inspirehep.net/files/ec9fa1d6de0d9ede57faba67e04a3777","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields"],"m":["Other ML"],"u":["Quijote (set not stated)","Density fields","Other ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.1676,"yy":-0.6658,"p3":[0.307,-0.0467,0.4038],"sim":{"k":"w","l":[[212,0.171],[321,0.151],[230,0.12],[52,0.108],[53,0.108]]},"c3":[-99.78,-25.46,328.07],"c2":[-341.91,-86.54],"k":1,"r":[],"rm":1},{"id":"2603.20855","t":"Field-Level Inference of Primordial Non-Gaussianity with the Quijote Simulation Suite","ab":"Local primordial non-Gaussianity, parameterised as $f_{\\rm NL}^{\\rm local}$, will be stringently constrained using state-of-the-art methods applied to next-generation galaxy redshift survey data. In this paper, in preparation for the upcoming data sets, we demonstrate for the first time the joint field-level inference of $f_{\\rm NL}^{\\rm local}$, nuisance parameters, and the initial conditions in realistic halo catalogues, ones which are generated through full dark-matter-only $N$-body simulations. The field-level inference algorithm optimally constrains $f_{\\rm NL}^{\\rm local}$ through a Bayesian forward-modelling approach at the field level, which outperforms traditional methods by leveraging the full statistical power of the data at the scales considered. In addition, we assess its performance under various design choices in the forward model, including tests of the structure formation model and resolution. We demonstrate the robustness of our approach by applying it to a subset of the \\textit{Quijote} simulation suite, performing the inference at scales down to $k_{\\rm max} \\approx 0.1 h \\rm{Mpc}^{-1}$. Compared with a power spectrum and bispectrum estimator, we find a $\\sim1.3$ improvement in $σ(f_{\\rm NL}^{\\rm local})$ when applying \\borg{}, while marginalising over the initial conditions and bias parameters. From the small-scale information sensitivity tests, we show that the constraints on $f_{\\rm NL}^{\\rm local}$ improve as we increase the resolution of the inference. These findings underscore the transformative potential of field-level inference to leverage the information available in ongoing surveys such as \\textit{Euclid}, providing accurate insights into the physics of cosmic inflation and the number of fields driving it.","abx":0,"nw":0,"d":"2026-03-21","dq":0,"y":2026,"au":[17,319,264,665,240,424,187,247,176,233,462,427,95],"c":3,"cs":0,"bib":"2026arXiv260320855A","v":"","lk":"arXiv:2603.20855","url":"https://arxiv.org/abs/2603.20855","doi":"","tg":{"s":["Quijote-PNG"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Quijote-PNG","Density fields","Perturbation theory & analytic models"]},"x":0.2784,"yy":0.5998,"p3":[-0.4984,0.2322,0.2123],"sim":{"k":"e","l":[[181,0.957],[76,0.954],[228,0.953],[264,0.95],[259,0.948]]},"c3":[40.87,-59.81,338.14],"c2":[7.44,-378.28],"k":5,"r":[],"rm":1},{"id":"2603.19734","t":"Morphological Signatures of Gravitational Evolution, Redshift-Space Distortions, and Massive Neutrinos in Large-Scale Structure","ab":"We investigate the morphological properties of large-scale structure in the Universe and the physical processes that modify the excursion-set morphology of the three-dimensional matter density field. Using the Quijote N-body simulation suite, we study how an initially Gaussian random matter density field is altered by non-linear gravitational evolution, redshift-space distortions, and massive neutrino free-streaming. To quantify these effects, we employ a comprehensive set of morphological descriptors, including Minkowski Functionals, Betti numbers, Minkowski Tensors, and local measures of the size and shape of connected components and cavities. We find that gravitational evolution, on quasi-linear scales $R_G \\sim 10 h^{-1} \\mathrm{Mpc}$, strongly skews the one-point distribution and slightly smooths the field via the merging of critical points, with a more pronounced effect for minima and wall saddle points than for peaks. Redshift-space distortions produce the strongest morphological signal, generating pronounced anisotropies that are robustly captured by Minkowski Tensors and local shape measures, arising from both coherent large-scale flows and non-linear Finger-of-God effects. In contrast, massive neutrinos induce an approximately isotropic suppression of small-scale structure, slightly reducing the amplitudes of the Minkowski Functionals while leaving individual shape measures largely unchanged. We further explore the sensitivity of these statistics to variations in cosmological parameters $Ω_m$, $n_s$, and $σ_8$, finding that they probe strongly degenerate combinations of $Ω_m$ and $n_s$, while also exhibiting sensitivity to $σ_8$ through the non-Gaussianity of the evolved density field.","abx":0,"nw":0,"d":"2026-03-20","dq":0,"y":2026,"au":[519,599,518,123],"c":1,"cs":0,"bib":"2026JCAP...08..082G","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2603.19734","url":"https://arxiv.org/abs/2603.19734","doi":"10.1088/1475-7516/2026/08/082","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Higher-order statistics","Redshift space"],"m":["No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.3951,"yy":0.4398,"p3":[-0.6044,0.4141,0.061],"sim":{"k":"e","l":[[264,0.942],[226,0.942],[73,0.941],[62,0.941],[334,0.938]]},"c3":[108.88,221.98,-66.32],"c2":[141.14,263.51],"k":5,"r":[93,118,213,234,251,275,312,314,339],"rm":0},{"id":"title:fromlanguagemodelstocosmicstructuresageometricperspective","t":"From language models to cosmic structures: A geometric perspective","ab":"","abx":0,"nw":0,"d":"2026","dq":1,"y":2026,"au":[648,361],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://pure.uva.nl/ws/files/303686803/Thesis.pdf","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields"],"m":["Other ML"],"u":["Quijote (set not stated)","Density fields","Other ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.1829,"yy":-0.2412,"p3":[-0.3469,0.0422,0.1104],"sim":{"k":"w","l":[[151,0.147],[72,0.145],[163,0.124],[51,0.111],[16,0.094]]},"c3":[-99.9,-113.43,310.46],"c2":[-272.48,-223.96],"k":4,"r":[],"rm":1},{"id":"2602.20070","t":"Generative Modeling via Kernelized Stochastic Interpolants","ab":"We develop a kernel method for generative modeling within the stochastic interpolant framework, replacing neural network training with linear systems. The drift of the generative SDE is $\\hat b_t(x) = \\nablaφ(x)^\\topη_t$, where $η_t \\in \\mathbb{R}^P$ solves a $P\\times P$ system computable from data, with $P$ independent of the data dimension $d$. Since estimates are inexact, the diffusion coefficient $D_t$ affects sample quality; the optimal $D_t^*$ from Girsanov diverges at $t=0$, but this poses no difficulty and we develop an integrator that handles it seamlessly. The framework accommodates diverse feature maps: scattering transforms, pretrained generative models, etc, enabling generation and model combination without neural network training. We demonstrate the approach on financial time series, turbulence, and image generation.","abx":0,"nw":0,"d":"2026-02-23","dq":0,"y":2026,"au":[234,215,479,602,212],"c":0,"cs":0,"bib":"2026arXiv260220070C","v":"","lk":"arXiv:2602.20070","url":"https://arxiv.org/abs/2602.20070","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["Generative models"],"u":["Density fields","Higher-order statistics"]},"x":-0.0586,"yy":-0.9722,"p3":[0.0029,-0.4717,0.8192],"sim":{"k":"e","l":[[50,0.94],[184,0.925],[136,0.91],[189,0.91],[172,0.909]]},"c3":[23.2,85.1,96.07],"c2":[-106.03,114.98],"k":6,"r":[50,218,339],"rm":0},{"id":"2602.17211","t":"MGD: Moment Guided Diffusion for Maximum Entropy Generation","ab":"Generating samples from limited information is a fundamental problem across scientific domains. Classical maximum entropy methods provide principled uncertainty quantification from moment constraints but require sampling via MCMC or Langevin dynamics, which typically exhibit exponential slowdown in high dimensions. In contrast, generative models based on diffusion and flow matching efficiently transport noise to data but offer limited theoretical guarantees and can overfit when data is scarce. We introduce Moment Guided Diffusion (MGD), which combines elements of both approaches. Building on the stochastic interpolant framework, MGD samples maximum entropy distributions by solving a stochastic differential equation that guides moments toward prescribed values in finite time, thereby avoiding slow mixing in equilibrium-based methods. We formally obtain, in the large-volatility limit, convergence of MGD to the maximum entropy distribution and derive a tractable estimator of the resulting entropy computed directly from the dynamics. Applications to financial time series, turbulent flows, and cosmological fields using wavelet scattering moments yield estimates of negentropy for high-dimensional multiscale processes.","abx":0,"nw":0,"d":"2026-02-19","dq":0,"y":2026,"au":[215,479,234,602,212],"c":3,"cs":0,"bib":"2026arXiv260217211L","v":"arXiv.org","lk":"arXiv:2602.17211","url":"https://arxiv.org/abs/2602.17211","doi":"10.48550/arXiv.2602.17211","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["Generative models"],"u":["Density fields"]},"x":-0.0683,"yy":-0.9898,"p3":[-0.0896,-0.4844,0.8205],"sim":{"k":"e","l":[[49,0.94],[184,0.918],[53,0.91],[172,0.907],[327,0.906]]},"c3":[-12.16,111.05,75.49],"c2":[-117.77,81.67],"k":6,"r":[218,339],"rm":0},{"id":"2602.15951","t":"MadEvolve: Evolutionary Optimization of Cosmological Algorithms with Large Language Models","ab":"We develop a general framework to discover scientific algorithms and apply it to three problems in computational cosmology. Our code, MadEvolve, is similar to Google's AlphaEvolve, but places a stronger emphasis on free parameters and their optimization. Our code starts with a baseline human algorithm implementation, and then optimizes its performance metrics by making iterative changes to its code. As a further convenient feature, MadEvolve automatically generates a report that compares the input algorithm with the evolved algorithm, describes the algorithmic innovations and lists the free parameters and their function. Our code supports both auto-differentiable, gradient-based parameter optimization and gradient-free optimization methods. We apply MadEvolve to the reconstruction of cosmological initial conditions, 21cm foreground contamination reconstruction and effective baryonic physics in N-body simulations. In all cases, we find substantial improvements over the base algorithm. We make MadEvolve and our three tasks publicly available at madevolve.org.","abx":0,"nw":0,"d":"2026-02-17","dq":0,"y":2026,"au":[625,579,469],"c":5,"cs":0,"bib":"2026MLS&T...7d5026L","v":"Machine Learning: Science and Technology","lk":"arXiv:2602.15951","url":"https://arxiv.org/abs/2602.15951","doi":"10.1088/2632-2153/ae7e3b","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields"],"m":["Other ML"],"u":["Non-Quijote simulations"]},"x":-0.1436,"yy":-0.6968,"p3":[0.2089,-0.0885,0.2843],"sim":{"k":"e","l":[[185,0.934],[65,0.934],[115,0.934],[53,0.933],[318,0.932]]},"c3":[-34.1,-39.39,116.99],"c2":[-38.56,-140.44],"k":7,"r":[105,222,325,339],"rm":0},{"id":"2602.14630","t":"Bayesian Cosmic Void Finding with Graph Flows","ab":"Cosmic voids contain higher-order cosmological information and are of interest for astroparticle physics. Finding genuine matter underdensities in sparse galaxy surveys is, however, an underconstrained problem. Traditional void finding algorithms produce deterministic void catalogs, neglecting the probabilistic nature of the problem. We present a method to sample from the stochastic mapping from galaxy catalogs to arbitrary void definitions. Our algorithm uses a deep graph neural network to evolve \"test particles\" according to a flow-matching objective. We demonstrate the method in a simplified example setting but outline steps to generalize it towards practically usable void finders. Trained on a deterministic teacher, the model performs well but has considerable stochasticity which we interpret as regularization. Cosmological information in the predicted void catalogs outperforms the teacher. On the one hand, our method can cheaply emulate existing void finders with apparently useful regularization. More importantly, it also allows us to find the Bayes-optimal mapping between observed galaxies and any void definition. This includes definitions operating at the level of simulated matter density and velocity fields.","abx":0,"nw":0,"d":"2026-02-16","dq":0,"y":2026,"au":[391],"c":3,"cs":0,"bib":"2026OJAp....960855T","v":"The Open Journal of Astrophysics","lk":"arXiv:2602.14630","url":"https://arxiv.org/abs/2602.14630","doi":"10.33232/001c.160855","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Void catalogs"],"m":["Graph neural networks","Generative models"],"u":["Halo catalogs"]},"x":0.2542,"yy":-0.6942,"p3":[0.1291,-0.4014,0.482],"sim":{"k":"e","l":[[113,0.942],[297,0.94],[240,0.939],[85,0.935],[82,0.933]]},"c3":[96.41,131.42,94.51],"c2":[168.49,-35.77],"k":9,"r":[57,107,145,147,189,339],"rm":0},{"id":"2602.10172","t":"Cosmo3DFlow: Wavelet Flow Matching for Spatial-to-Spectral Compression in Reconstructing the Early Universe","ab":"Reconstructing the early universe from the evolved present-day universe is a challenging and computationally demanding problem in modern astrophysics. We devise a novel generative framework, Cosmo3DFlow, designed to address dimensionality and sparsity, the critical bottlenecks inherent in current state-of-the-art methods for cosmological inference. By integrating 3D Discrete Wavelet Transform (DWT) with flow matching, we effectively represent high-dimensional cosmological structures. The Wavelet Transform addresses the ``void problem'' by translating spatial emptiness into spectral sparsity. It decouples high-frequency details from low-frequency structures, and wavelet-space velocity fields facilitate stable ordinary differential equation (ODE) solvers with large step sizes. Using large-scale cosmological $N$-body simulations at $128^3$ resolution, we achieve up to $46\\times$ faster sampling than diffusion models. Our results enable initial conditions to be sampled in seconds, compared to minutes for previous methods.","abx":0,"nw":0,"d":"2026-02-10","dq":0,"y":2026,"au":[456,708,551,326,78,350],"c":0,"cs":0,"bib":"2026kddm.conf11153I","v":"Knowledge Discovery and Data Mining","lk":"arXiv:2602.10172","url":"https://arxiv.org/abs/2602.10172","doi":"10.1145/3770855.3818994","tg":{"s":["Quijote (set not stated)"],"d":["Density fields"],"m":["Generative models"],"u":[]},"x":-0.1004,"yy":-0.8364,"p3":[-0.1109,-0.3449,0.6932],"sim":{"k":"e","l":[[184,0.947],[65,0.934],[272,0.934],[51,0.933],[327,0.929]]},"c3":[17.7,82.01,62.57],"c2":[96.42,-54.45],"k":1,"r":[105,157,169,230,339],"rm":0},{"id":"2602.06463","t":"ELUCID-DESI I: A Parallel MPI Implementation of the Initial Condition Solver for Large-Scale Reconstruction Simulations","ab":"We present a highly scalable, MPI-parallelized framework for reconstructing the initial cosmic density field, designed to meet the computational demands of next-generation cosmological simulations, particularly the upcoming ELUCID-DESI simulation based on DESI BGS data. Building upon the Hamiltonian Monte Carlo approach and the FastPM solver, our code employs domain decomposition to efficiently distribute memory between nodes. Although communication overhead increases the per-step runtime of the MPI version by roughly a factor of eight relative to the shared-memory implementation, our scaling tests-spanning different particle numbers, core counts, and node layouts-show nearly linear scaling with respect to both the number of particles and the number of CPU cores. Furthermore, to significantly reduce computational costs during the initial burn-in phase, we introduce a novel ``guess'' module that rapidly generates a high-quality initial density field. The results of the simulation test confirm substantial efficiency gains: for $256^3$ particles, 53 steps ($\\sim$ 54 core hours) are saved, accelerating convergence by a factor of $\\sim$ 18; for $1024^3$, 106 steps ($\\sim$7500 core hours), achieving a speedup factor of $\\sim$ 3. The total core hour gain grows with the number of particles, rendering large-volume reconstructions computationally practical for upcoming surveys, including our planned ELUCID-DESI reconstruction simulation with $4096^3$ particles. We estimate that achieving convergence for this scale (targeting DESI-BGS data) requires about 800 HMCMC steps ($\\sim$ 5 million core hours). Our initial guess module will save approximately 360 steps ($\\sim$2.3 million core hours), reducing the total computational time by about 45\\%.","abx":0,"nw":0,"d":"2026-02-06","dq":0,"y":2026,"au":[660,669,359,281,709,280,522,686,690,231,331,693,713],"c":2,"cs":0,"bib":"2026MNRAS.550g1211H","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2602.06463","url":"https://arxiv.org/abs/2602.06463","doi":"10.1093/mnras/stag1211","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Particle snapshots"],"m":["No ML"],"u":["Particle snapshots"]},"x":-0.6964,"yy":-0.4386,"p3":[0.6303,-0.2261,0.4583],"sim":{"k":"e","l":[[134,0.938],[114,0.922],[318,0.919],[188,0.919],[197,0.917]]},"c3":[125.45,-94.17,-23.21],"c2":[-34.25,-23.95],"k":7,"r":[96,339],"rm":0},{"id":"2602.05816","t":"Bayesian imaging inverse problem with scattering transform","ab":"Bayesian imaging inverse problems in astrophysics and cosmology remain challenging, particularly in low-data regimes, due to complex forward operators and the frequent lack of well-motivated priors for non-Gaussian signals. In this paper, we introduce a Bayesian approach that addresses these difficulties by relying on a low-dimensional representation of physical fields built from Scattering Transform statistics. This representation enables inference to be performed in a compact model space, where we recover a posterior distribution over signal models that are consistent with the observed data. We propose an iterative adaptive algorithm to efficiently approximate this posterior distribution. We apply our method to a large-scale structure column density field from the Quijote simulations, using a realistic instrumental forward operator. We demonstrate both accurate statistical inference and deterministic signal reconstruction from a single contaminated image, without relying on any external prior distribution for the field of interest. These results demonstrate that Scattering Transform statistics provide an effective representation for solving complex imaging inverse problems in challenging low-data regimes. Our approach opens the way to new applications for non-Gaussian astrophysical and cosmological signals for which little or no prior modeling is available.","abx":0,"nw":0,"d":"2026-02-05","dq":0,"y":2026,"au":[610,213,508,544,40],"c":3,"cs":0,"bib":"2026A&A...710A.223P","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2602.05816","url":"https://arxiv.org/abs/2602.05816","doi":"10.1051/0004-6361/202659297","tg":{"s":["Quijote (set not stated)"],"d":["Higher-order statistics","Weak lensing & 2D maps"],"m":["Other ML"],"u":["Other ML"]},"x":0.1489,"yy":-0.9091,"p3":[-0.2832,-0.4729,0.5715],"sim":{"k":"e","l":[[291,0.916],[218,0.915],[273,0.91],[136,0.909],[157,0.907]]},"c3":[84.51,-23.82,55.73],"c2":[93.22,-124.41],"k":6,"r":[230,327,339],"rm":0},{"id":"2602.04504","t":"Weak Lensing Low Multipoles","ab":"We analyse the low--multipole components of the weak-lensing convergence field in a FLRW universe. The low--multipole convergence field, encodes the largest-angle coherent potential gradients, essential for assessment of large-angle features in data. To study this large angle signal, we perform a combined analytical, numerical and observational study. Starting from exact analytical expressions for the convergence power spectrum, we quantify how the dipole, quadrupole and octupole build up with source redshift and show that, in $Λ$CDM, they saturate at an amplitude of order $10^{-4}$. We then use full-sky, horizon-scale $N$-body simulations (Quijote) to explore the dependence of this signal on the observer's environment, comparing random observers to ``Milky Way--like'' observers. In parallel, we reconstruct the convergence field due to our local Universe with the 2MASS Redshift Survey (2MRS), with proper treatment of incompleteness and galaxy bias. We find that the observed low multipoles from observation is above the $Λ$CDM mean predictions, but in full agreement with Milky Way--like observers in the simulation. Finally, by converting the convergence dipole into a number-count dipole, we test whether weak lensing can contribute to the cosmic dipole anomaly, an idea motivated by its natural alignment with the CMB dipole and by the fact that lensing, unlike clustering, cannot be removed by cross-matching surveys and thus survives in all high-redshift catalogues. We show that weak lensing by local structure contributes at most a few percent to this observed anomaly.","abx":0,"nw":0,"d":"2026-02-04","dq":0,"y":2026,"au":[26,546],"c":0,"cs":0,"bib":"2026MNRAS.548ag633B","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2602.04504","url":"https://arxiv.org/abs/2602.04504","doi":"10.1093/mnras/stag633","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra","Weak lensing & 2D maps"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.4435,"yy":0.6088,"p3":[-0.3872,-0.2685,-0.5539],"sim":{"k":"e","l":[[203,0.939],[329,0.936],[299,0.93],[253,0.929],[324,0.928]]},"c3":[-14.79,-88.68,50.99],"c2":[-103.66,-21.53],"k":4,"r":[339],"rm":0},{"id":"2601.14362","t":"The era of precision cosmology with voids","ab":"Cosmic voids, the large underdense regions of our Universe, have emerged over the past decade as powerful cosmological laboratories: their simple dynamics, sensitivity to local gravitational effects and cosmic expansion, and ability to span large volumes, make them uniquely suited to test fundamental physics. Fueled by advances in theory, simulations, and observations, void science has matured into a precision tool for constraining the parameters of the standard cosmological model and its possible extensions. In this review, we provide a comprehensive description of the statistical tools developed to characterize voids, the theoretical models that link them to cosmological parameters, and the methodologies used to extract information from survey data. We highlight the growing synergy between void-based observables and other cosmological probes, and showcase the increasingly stringent constraints derived from voids measured from current survey data and expected from future missions. With the advent of the next generation of galaxy surveys, voids are poised to play a central role in the future of cosmology, turning what was once regarded as emptiness into one of the most promising frontiers of fundamental science.","abx":0,"nw":0,"d":"2026-01-20","dq":0,"y":2026,"au":[597,258,43],"c":17,"cs":0,"bib":"2026A&ARv..34....1C","v":"The Astronomy and Astrophysics Review","lk":"arXiv:2601.14362","url":"https://arxiv.org/abs/2601.14362","doi":"10.1007/s00159-026-00166-x","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Void catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Non-Quijote simulations","No ML","Perturbation theory & analytic models"]},"x":0.3493,"yy":-0.6248,"p3":[0.0765,-0.6782,0.2326],"sim":{"k":"e","l":[[240,0.959],[297,0.958],[82,0.951],[113,0.946],[339,0.934]]},"c3":[-24.72,177.54,67.28],"c2":[42.61,-30.25],"k":9,"r":[82,113,165,170,173,215,240,258,297,308,339],"rm":0},{"id":"2601.13245","t":"An efficient model of cosmology dependence in the covariance matrix of the matter power spectrum","ab":"Covariance matrices are essential for any cosmological likelihood analysis. They can be estimated from large suites of cosmological simulations, but this is computationally intensive, so various approximations are often adopted to simplify the analysis, such as treating covariance as being parameter independent to avoid having to compute matrices for every variation in physical parameters. In this paper, we develop a new approach to model the parameter dependence of the covariance matrix of the matter power spectrum. We do this by Taylor expanding the `true covariance matrix' around a fiducial point in parameter space projected onto a theoretically known precision matrix. In the limit that the known model approaches the true matrix then the Taylor expansion truncates at the first term; for more realistic models, additional terms are required. We use the publicly available Quijote suite of simulations, giving us both a fiducial model and variations in the six parameters $\\{Ω_{\\rm m}, Ω_{\\rm b}, n_{\\rm s},σ_{8}, h,w_{0}\\}$. Using the linear power spectra from these simulations, we generate model covariance matrices with and without super-sample covariance. Using different approximations, we develop three versions of our interpolated covariance matrix and validate the formalism by recreating all of our input cosmologies using all three forms, both with and without super-sample covariance corrections, showing that the model provides good recreations of the original results, with the different approximations being optimal in different regimes. Our method enables rapid calculation of parameter dependent covariance matrices, and consequently precision matrices, for deployment in likelihood modelling codes.","abx":0,"nw":0,"d":"2026-01-19","dq":0,"y":2026,"au":[622,540],"c":0,"cs":0,"bib":"2026arXiv260113245S","v":"","lk":"arXiv:2601.13245","url":"https://arxiv.org/abs/2601.13245","doi":"","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Power spectra"],"m":["Perturbation theory & analytic models","No ML"],"u":["Perturbation theory & analytic models"]},"x":0.1751,"yy":-0.116,"p3":[-0.1607,0.0998,-0.128],"sim":{"k":"e","l":[[38,0.95],[334,0.945],[301,0.943],[257,0.94],[289,0.94]]},"c3":[-171.1,6.58,297.21],"c2":[-353.84,-19.42],"k":7,"r":[],"rm":1},{"id":"2601.08524","t":"Revisiting the Great Attractor: The Local Group's streamline trajectory, cosmic velocity and dynamical fate","ab":"We revisit the Great Attractor using the Manticore-Local suite of digital twins of the nearby Universe. The Great Attractor concept has been proposed as an answer to three distinct questions: what sources the Local Group velocity in the cosmic microwave background frame, where present-day velocity streamlines converge, and where the Local Group is moving to. Addressing the original motivation of the Great Attractor -- explaining the Local Group cosmic velocity -- we find that mass within $155~h^{-1}\\mathrm{Mpc}$ accounts for only ${\\sim}72\\%$ of that velocity magnitude with ${\\sim}38\\,°$ directional offset. We show that even in the purely linear regime convergence within this volume is not guaranteed, particularly when also accounting for small-scale contributions to the observer velocity; no single structure, including the proposed Great Attractor, would be expected to dominate the velocity budget. Streamline convergence is smoothing-scale-dependent, transitioning from Virgo at small scales through the Hydra--Centaurus region at intermediate scales to Shapley at large scales; at intermediate smoothing the convergence point lies near Abell 3565 with an asymmetric basin of mass $\\log( M / (h^{-1} \\mathrm{M}_\\odot)) = 16.4 \\pm 0.1$ that excludes Norma. To address the third question, we evolve the Manticore-Local realisations to scale factor $a = 10$ in a new Beyond-Present-Time simulation suite and identify the asymptotic future location of the Local Group. We find that the dominant motion is towards Virgo, but even it contributes at most one third of the Local Group velocity. Our results demonstrate that the classical Great Attractor is not a dynamically dominant structure but an artefact of the instantaneous velocity field, and that no single attractor is likely to account for the Local Group motion in the cosmic rest frame.","abx":0,"nw":0,"d":"2026-01-13","dq":0,"y":2026,"au":[538,273,601,264,319,459],"c":4,"cs":0,"bib":"2026OJAp....957824S","v":"The Open Journal of Astrophysics","lk":"arXiv:2601.08524","url":"https://arxiv.org/abs/2601.08524","doi":"10.33232/001c.157824","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields"],"m":["No ML"],"u":["Density fields"]},"x":-0.3242,"yy":0.6139,"p3":[0.0181,-0.3255,-0.4507],"sim":{"k":"e","l":[[100,0.923],[155,0.917],[180,0.916],[207,0.915],[307,0.914]]},"c3":[49.18,-94.52,41.32],"c2":[-127.12,-56.0],"k":4,"r":[339],"rm":0},{"id":"2512.24422","t":"OmniCosmos: Transferring Particle Physics Knowledge Across the Cosmos","ab":"Foundation models build an effective representations of data that can be deployed on diverse downstream tasks. Previous research developed the OmniLearned foundation model for collider physics and showed that it could significantly advance discovery potential across collider experiments. In this paper we go beyond collider physics and show that Foundation Models trained on collider data can help improve the prediction of cosmological parameters and to predict halo and galaxy velocities in different datasets from CosmoBench. This is the first time a collider physics model is shown to generalize across scientific fields.","abx":0,"nw":0,"d":"2025-12-30","dq":0,"y":2025,"au":[646,289,97],"c":8,"cs":0,"bib":"2026PRXI....123004M","v":"PRX Intelligence","lk":"arXiv:2512.24422","url":"https://arxiv.org/abs/2512.24422","doi":"10.1103/85gr-9vw6","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs","Galaxy mocks (HOD)"],"m":["Other ML"],"u":["Non-Quijote simulations","Halo catalogs","Galaxy mocks (HOD)"]},"x":-0.242,"yy":-0.7353,"p3":[0.2374,0.2988,0.793],"sim":{"k":"e","l":[[75,0.931],[115,0.916],[325,0.915],[104,0.915],[169,0.913]]},"c3":[-110.92,182.41,65.92],"c2":[-82.72,141.92],"k":6,"r":[75,85,94,131,169,189,209,255,339],"rm":0},{"id":"2512.16992","t":"The imprints of massive neutrinos on the three-point correlation function of large-scale structures","ab":"Free-streaming of cosmic neutrinos affects the distribution and growth of cosmic structures on small scales. This enables the sum of neutrino masses $M_ν$ to be constrained from clustering studies. We investigate the possibility of disentangling massive neutrino cosmologies with the three-point correlation function (3PCF) for the first time. We measured the isotropic connected 3PCF $ζ$ and the reduced 3PCF $Q$ of halo catalogs from the Quijote suite of $N$-body simulations, considering $M_ν=0.0, 0.1, 0.2,$ and $0.4 \\, \\mathrm{eV}$ in different redshift bins. We developed a framework to quantify the detectability of massive neutrinos for different triangle configurations and shapes, and applied it to a case compatible with a stage-IV spectroscopic survey. We also compared our results with the analysis of simulations without neutrinos, but with different $σ_8$ values, to test whether the 3PCF can break the well-known degeneracy between the two parameters. We found that as a result of free-streaming, the strongest signal is found for quasi-isosceles and squeezed triangles; this signal increases for decreasing redshifts. Among these configurations, elongated triangles, tracing the filamentary structure of the cosmic web, are the most affected by massive neutrinos, with a 3PCF signal increasing with $M_ν$. A complementary source of signal comes from right-angled triangles in $Q$. Importantly, we found that the signatures of a $σ_8$ variation appear to be significantly different on elongated triangles in $ζ$ and right-angled triangles in $Q$, suggesting that the 3PCF can be used to effectively break the $M_ν- σ_8$ degeneracy. These results open the possibility to use the 3PCF as a powerful complementary tool for constraining neutrino masses in current and future spectroscopic surveys such as DESI, Euclid, 4MOST, and the Nancy Grace Roman Space Telescope.","abx":0,"nw":0,"d":"2025-12-18","dq":0,"y":2025,"au":[53,438,463,41],"c":6,"cs":0,"bib":"2026A&A...708A.210L","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2512.16992","url":"https://arxiv.org/abs/2512.16992","doi":"10.1051/0004-6361/202558719","tg":{"s":["Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Higher-order statistics"],"m":["No ML"],"u":["Fisher derivatives"]},"x":0.5684,"yy":-0.1448,"p3":[-0.1943,0.5226,-0.2956],"sim":{"k":"e","l":[[237,0.95],[40,0.941],[108,0.94],[336,0.939],[282,0.939]]},"c3":[32.96,16.53,-247.83],"c2":[-4.32,264.58],"k":8,"r":[88,109,139,155,312,323,336,339],"rm":0},{"id":"2512.12304","t":"Recovering Subtle Cosmological Information with the Zel'dovich-inspired Transform","ab":"Extracting cosmological information from nonlinear and non-Gaussian large-scale structure remains a major challenge. We introduce the Zel'dovich-inspired (ZI) transform, a simple one-parameter local nonlinear transform in which $η$ controls the weighting of higher-order information in the transformed density field. For $η\\geq3$, the transform can substantially suppress gravitational non-Gaussianity. Using real-space matter density fields from the \\textsc{Quijote} suite and Fisher analysis, we find that the joint data vector of three transformed-field power spectra with $\\{η=\\infty,
