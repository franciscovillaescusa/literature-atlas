en matter density using a tracer bias and stochasticity model previously used for photometric data. We find accurate parametrisations for tracer bias with a smoothing scale-independent 2-parameter Gaussian Lagrangian bias model and a quadratic shot noise. We relate those bias and stochasticity parameters to the one for the power spectrum and tracer-matter covariances. We validate the model against the Quijote suite of N-body simulations and find excellent agreement for both halo and galaxy density PDFs and their cosmology dependence. We demonstrate the constraining power of the tracer PDFs and their complementarity to power spectra through a Fisher forecast. We focus on the cosmological parameters $σ_8$ and $Ω_m$ as well as linear bias parameters, finding that the strength of the tracer PDF lies in disentangling tracer bias from cosmology. Our results show promise for applications to spectroscopic clustering data when augmented with a redshift space distortion model","abx":0,"nw":0,"d":"2024-09-26","dq":0,"y":2024,"au":[99,398,146,497],"c":9,"cs":0,"bib":"2025OJAp....8E...1M","v":"The Open Journal of Astrophysics","lk":"arXiv:2409.18182","url":"https://arxiv.org/abs/2409.18182","doi":"10.33232/001c.127800","tg":{"s":["Fiducial","Fisher derivatives","Molino / HOD galaxy mocks"],"d":["Halo catalogs","Galaxy mocks (HOD)","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Fisher derivatives","Molino / HOD galaxy mocks"]},"x":-0.2331,"yy":0.4922,"p3":[0.043,-0.1411,-0.6684],"sim":{"k":"e","l":[[155,0.943],[334,0.942],[317,0.941],[295,0.94],[245,0.939]]},"c3":[-148.04,59.78,-154.2],"c2":[-39.68,35.62],"k":2,"r":[204,227,247,290,295,298,310,312,322,333,334,339],"rm":0},{"id":"2409.13583","t":"Constraining Primordial Non-Gaussianity with Density-Split Clustering","ab":"Obtaining tight constraints on primordial non-Gaussianity (PNG) is a key step in discriminating between different models for cosmic inflation. The constraining power from large-scale structure (LSS) measurements is expected to overtake that from cosmic microwave background (CMB) anisotropies with the next generation of galaxy surveys including the Dark Energy Spectroscopic Instrument (DESI) and Euclid. We consider whether Density-Split Clustering (DSC) can help improve PNG constraints from these surveys for local, equilateral and orthogonal types. DSC separates a surveyed volume into regions based on local density and measures the clustering statistics within each environment. Using the Quijote simulations and the Fisher information formalism, we compare PNG constraints from the standard halo power spectrum, DSC power spectra and joint halo/DSC power spectra. We find that the joint halo/DSC power spectra outperform the halo power spectrum by factors of $\\sim$ 1.4, 8.8, and 3.6 for local, equilateral and orthogonal PNG, respectively. This is driven by the higher-order information that DSC captures on small scales. We find that applying DSC to a halo field does not allow sample variance cancellation on large scales by providing multiple tracers of the same volume with different local PNG responses. Additionally, we introduce a Fourier space analysis for DSC and study the impact of several modifications to the pipeline, such as varying the smoothing radius and the number of density environments and replacing random query positions with lattice points.","abx":0,"nw":0,"d":"2024-09-20","dq":0,"y":2024,"au":[310,210,661],"c":7,"cs":0,"bib":"2025JCAP...01..026M","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2409.13583","url":"https://arxiv.org/abs/2409.13583","doi":"10.1088/1475-7516/2025/01/026","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.3129,"yy":0.6719,"p3":[-0.3806,-0.1411,-0.1228],"sim":{"k":"e","l":[[76,0.953],[203,0.953],[200,0.948],[46,0.947],[242,0.944]]},"c3":[7.71,99.42,-112.76],"c2":[160.55,27.98],"k":0,"r":[154,173,178,204,234,241,245,249,257,264,278,282,284,291,308,322,333,334,339],"rm":0},{"id":"2409.11401","t":"Teaching dark matter simulations to speak the halo language","ab":"We develop a transformer-based conditional generative model for discrete point objects and their properties. We use it to build a model for populating cosmological simulations with gravitationally collapsed structures called dark matter halos. Specifically, we condition our model with dark matter distribution obtained from fast, approximate simulations to recover the correct three-dimensional positions and masses of individual halos. This leads to a first model that can recover the statistical properties of the halos at small scales to better than 3% level using an accelerated dark matter simulation. This trained model can then be applied to simulations with significantly larger volumes which would otherwise be computationally prohibitive with traditional simulations, and also provides a crucial missing link in making end-to-end differentiable cosmological simulations. The code, named GOTHAM (Generative cOnditional Transformer for Halo's Auto-regressive Modeling) is publicly available at \\url{https://github.com/shivampcosmo/GOTHAM}.","abx":0,"nw":0,"d":"2024-09-17","dq":0,"y":2024,"au":[581,241,131,95],"c":10,"cs":0,"bib":"2024arXiv240911401P","v":"","lk":"arXiv:2409.11401","url":"https://arxiv.org/abs/2409.11401","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Halo catalogs"],"m":["Generative models"],"u":["Non-Quijote simulations"]},"x":-0.398,"yy":-0.6989,"p3":[0.0885,-0.1656,0.8748],"sim":{"k":"e","l":[[189,0.951],[169,0.94],[184,0.936],[85,0.935],[31,0.934]]},"c3":[134.74,34.0,60.72],"c2":[196.09,-78.33],"k":1,"r":[147,260,339],"rm":1},{"id":"2409.10609","t":"Full-shape analysis with simulation-based priors: cosmological parameters and the structure growth anomaly","ab":"We explore full-shape analysis with simulation-based priors, which is the simplest approach to galaxy clustering data analysis that combines effective field theory (EFT) on large scales and numerical simulations on small scales. The core ingredient of our approach is the prior density of EFT parameters which we extract from a suite of 10500 galaxy simulations based on the halo occupation distribution (HOD) model. We measure the EFT parameters with the field-level forward model, which enables us to cancel cosmic variance. On the theory side, we develop a new efficient approach to calculate field-level transfer functions using time-sliced perturbation theory and the logarithmic fast Fourier transform. We find that the cosmology dependence of EFT parameters of galaxies is approximately degenerate with the HOD parameters, and hence it can be ignored for the purpose of prior generation. We use neural density estimation to model the measured distribution of EFT parameters. Our distribution model is then used as a prior in a reanalysis of the BOSS full-shape galaxy power spectrum data. Assuming the $Λ$CDM model, we find significant ($\\approx 30\\%$ and $\\approx 60\\%$) improvements for the matter density fraction and the mass fluctuation amplitude, which are constrained to $Ω_{m}= 0.315 \\pm 0.010$ and $σ_8 = 0.671 \\pm 0.027$. The value of the Hubble constant does not change, $H_0= 68.7\\pm 1.1$~km/s/Mpc. This reaffirms earlier reports of the structure growth tension from the BOSS data. Finally, we use the measured EFT parameters to constrain the galaxy-dark matter connection.","abx":0,"nw":0,"d":"2024-09-16","dq":0,"y":2024,"au":[465,57,118,460],"c":75,"cs":0,"bib":"2025PhRvD.111f3548I","v":"Physical Review D","lk":"arXiv:2409.10609","url":"https://arxiv.org/abs/2409.10609","doi":"10.1103/physrevd.111.063548","tg":{"s":["Molino / HOD galaxy mocks"],"d":["Density fields","Galaxy mocks (HOD)","Power spectra","Redshift space"],"m":["Normalizing flows","Perturbation theory & analytic models"],"u":["Molino / HOD galaxy mocks","Normalizing flows"]},"x":-0.1643,"yy":0.0226,"p3":[0.4506,-0.4642,-0.1451],"sim":{"k":"e","l":[[205,0.945],[90,0.941],[173,0.941],[99,0.94],[198,0.939]]},"c3":[179.4,-28.12,56.48],"c2":[202.01,-143.85],"k":0,"r":[121,173,186,201,208,210,339],"rm":0},{"id":"2409.09124","t":"CHARM: Creating Halos with Auto-Regressive Multi-stage networks","ab":"To maximize the amount of information extracted from cosmological datasets, simulations that accurately represent these observations are necessary. However, traditional simulations that evolve particles under gravity by estimating particle-particle interactions (N-body simulations) are computationally expensive and prohibitive to scale to the large volumes and resolutions necessary for the upcoming datasets. Moreover, modeling the distribution of galaxies typically involves identifying virialized dark matter halos, which is also a time- and memory-consuming process for large N-body simulations, further exacerbating the computational cost. In this study, we introduce CHARM, a novel method for creating mock halo catalogs by matching the spatial, mass, and velocity statistics of halos directly from the large-scale distribution of the dark matter density field. We develop multi-stage neural spline flow-based networks to learn this mapping at redshift z=0.5 directly with computationally cheaper low-resolution particle mesh simulations instead of relying on the high-resolution N-body simulations. We show that the mock halo catalogs and painted galaxy catalogs have the same statistical properties as obtained from $N$-body simulations in both real space and redshift space. Finally, we use these mock catalogs for cosmological inference using redshift-space galaxy power spectrum, bispectrum, and wavelet-based statistics using simulation-based inference, performing the first inference with accelerated forward model simulations and finding unbiased cosmological constraints with well-calibrated posteriors. The code was developed as part of the Simons Collaboration on Learning the Universe and is publicly available at \\url{https://github.com/shivampcosmo/CHARM}.","abx":0,"nw":0,"d":"2024-09-13","dq":0,"y":2024,"au":[581,131,95,172,21,263,448,264,613,240],"c":13,"cs":0,"bib":"2025PhRvD.112j3503P","v":"","lk":"arXiv:2409.09124","url":"https://arxiv.org/abs/2409.09124","doi":"","tg":{"s":["Latin hypercube","Non-Quijote simulations"],"d":["Density fields","Halo catalogs","Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Simulation-based inference","Normalizing flows","Generative models"],"u":["Latin hypercube","Non-Quijote simulations"]},"x":-0.2146,"yy":-0.3472,"p3":[0.5216,0.3385,0.4646],"sim":{"k":"e","l":[[175,0.942],[115,0.94],[127,0.939],[107,0.938],[83,0.938]]},"c3":[180.08,112.21,10.86],"c2":[261.01,-4.03],"k":1,"r":[156,173,174,185,188,199,201,205,272,284,291,308,322,331,339],"rm":0},{"id":"2409.03822","t":"Map-level baryonification: Efficient modelling of higher-order correlations in the weak lensing and thermal Sunyaev-Zeldovich fields","ab":"Semi-analytic methods can generate baryon-corrected fields from N-body simulations (``baryonification'') and are rapidly becoming a ubiquitous tool in modeling structure formation on non-linear scales. We extend this formalism to consistently model the weak lensing and thermal Sunyaev-Zeldovich (tSZ) fields directly on the full-sky, with an emphasis on higher-order correlations. We use the auto- and cross- $N$th-order moments, with $N \\in \\{2, 3, 4\\}$, as a summary statistic of the lensing and tSZ fields, and show that our model can jointly fit these statistics measured in IllustrisTNG to within measurement uncertainties, for scales above $\\gtrsim 1 {\\rm Mpc}$ and across multiple redshifts. The model predictions change only minimally when including additional information from secondary halo properties, such as halo concentration and ellipticity. Each individual moment is dependent on halos of different mass ranges and has different sensitivities to the model parameters. A simulation-based forecast on the ULAGAM simulation suite shows that the combination of all moments, measured from current and upcoming lensing and tSZ surveys, can jointly constrain cosmology and baryons to high precision. The lensing and tSZ field are sensitive to different combinations of the baryonification parameters, with degeneracy directions that are often orthogonal, and the combination of the two fields leads to significantly better constraints on both cosmology and astrophysics. Our pipeline for map-level baryonification is publicly available at https://github.com/DhayaaAnbajagane/BaryonForge.","abx":0,"nw":0,"d":"2024-09-05","dq":0,"y":2024,"au":[174,581,130],"c":42,"cs":0,"bib":"2024OJAp....7E.108A","v":"The Open Journal of Astrophysics","lk":"arXiv:2409.03822","url":"https://arxiv.org/abs/2409.03822","doi":"10.33232/001c.126788","tg":{"s":["Latin hypercube","Non-Quijote simulations"],"d":["Halo catalogs","Higher-order statistics","Weak lensing & 2D maps"],"m":["Fisher forecasts","No ML"],"u":["Latin hypercube","Fisher forecasts","Halo catalogs"]},"x":-0.1726,"yy":0.6727,"p3":[-0.3748,0.0025,-0.2345],"sim":{"k":"e","l":[[4,0.949],[125,0.941],[226,0.94],[329,0.939],[259,0.939]]},"c3":[-150.11,-90.78,-15.71],"c2":[-31.45,-158.89],"k":5,"r":[211,226,257,264,339],"rm":0},{"id":"title:voidwherestatisticallyprohibitedconstraininggravitywithcosmicvoidsandaddressings","t":"Void where statistically prohibited: constraining gravity with cosmic voids and addressing statistical noise within simulation based Fisher forecasts","ab":"","abx":0,"nw":0,"d":"2024","dq":1,"y":2024,"au":[140],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://www.proquest.com/docview/3100398944?pq-origsite=gscholar&fromopenview=true&sourcetype=Dissertations%20&%20Theses","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Quijote-MG"],"d":["Void catalogs","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Quijote-MG","Void catalogs","Higher-order statistics","Fisher forecasts","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.2953,"yy":-0.3584,"p3":[0.0548,-0.0903,0.1575],"sim":{"k":"w","l":[[167,0.242],[113,0.145],[182,0.132],[111,0.121],[215,0.12]]},"c3":[-73.45,-268.07,206.82],"c2":[-228.29,-274.28],"k":7,"r":[],"rm":1},{"id":"title:noveltechniquesforthecalibrationofsystematicsinnextgenerationgalaxysurveys","t":"Novel Techniques for the Calibration of Systematics in Next Generation Galaxy Surveys","ab":"","abx":0,"nw":0,"d":"2024","dq":1,"y":2024,"au":[24],"c":0,"cs":2,"bib":"","v":"","lk":"Master thesis","url":"https://uwspace.uwaterloo.ca/bitstreams/db98ba72-9d54-49b2-a28a-7ef5e8552538/download","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Galaxy mocks (HOD)","Power spectra"],"m":["No ML"],"u":["Quijote (set not stated)","Galaxy mocks (HOD)","Power spectra","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.1966,"yy":0.0718,"p3":[0.0451,-0.5561,0.0149],"sim":{"k":"w","l":[[173,0.128],[57,0.086],[24,0.085],[144,0.074],[297,0.068]]},"c3":[202.49,66.56,275.51],"c2":[402.65,-21.66],"k":0,"r":[],"rm":1},{"id":"title:askewedperspectiveontheuniverseadvancementschallengesandprospectsinthehuntforpri","t":"A skewed perspective on the universe: advancements, challenges and prospects in the hunt for primordial non-Gaussianity","ab":"","abx":0,"nw":0,"d":"2024","dq":1,"y":2024,"au":[623],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://pure.rug.nl/ws/portalfiles/portal/1084344891/Complete_thesis.pdf","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Fisher derivatives","Quijote-PNG","Halo catalogs","Power spectra","Higher-order statistics","Fisher forecasts","Perturbation theory & analytic models","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.0721,"yy":0.7572,"p3":[-0.7365,-0.1257,0.0633],"sim":{"k":"w","l":[[259,0.179],[48,0.147],[163,0.135],[204,0.133],[193,0.132]]},"c3":[-295.92,43.36,175.67],"c2":[-354.86,18.08],"k":4,"r":[],"rm":1},{"id":"2408.16398","t":"Pair Counting without Binning -- A New Approach to Correlation Functions in Clustering Statistics","ab":"This paper presents a novel perspective on correlation functions in the clustering analysis of the large-scale structure of the universe. We first recognise that pair counting in bins of radial separation is equivalent to evaluating counts-in-cells (CIC), which can be modelled using a filtered density field with a binning-window function. This insight leads to an in situ expression for the two-point correlation function (2PCF). Essentially, the core idea underlying our method is to introduce a window function to define the binning scheme, enabling pair-counting without binning. This approach develops a concept of generalised 2PCF, which extends beyond conventional discrete pair counting by accommodating non-sharp-edged window functions. To extend this framework to N-point correlation functions (NPCF) using current optimal edge-corrected estimators, we developed a binning scheme independent of the specific parameterisation of polyhedral configurations. In particular, we demonstrate a fast algorithm for the three-point correlation function (3PCF), where triplet counting is accomplished by assigning either a spherical tophat or a Gaussian filter to each vertex of triangles. Additionally, we derive analytical expressions for the 3PCF using a multipole expansion in Legendre polynomials, accounting for filtered field (binning) corrections. Numerical tests using several suites of N-body simulation samples show that our approach aligns remarkably well with the theoretical predictions. Our method provides an exact solution for quantifying binning effects in practical measurements and offers a high-speed algorithm, enabling high-order clustering analysis in extremely large datasets from ongoing and upcoming surveys such as Euclid, LSST, and DESI.","abx":0,"nw":0,"d":"2024-08-29","dq":0,"y":2024,"au":[583,399,658,356,710,230,715,678,656],"c":5,"cs":0,"bib":"2024MNRAS.535.3500Y","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2408.16398","url":"https://arxiv.org/abs/2408.16398","doi":"10.1093/mnras/stae2513","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Particle snapshots","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Non-Quijote simulations","Particle snapshots"]},"x":0.4916,"yy":-0.3969,"p3":[0.5886,0.1028,-0.5657],"sim":{"k":"e","l":[[112,0.946],[322,0.943],[87,0.936],[22,0.932],[20,0.929]]},"c3":[155.88,-29.03,-162.29],"c2":[144.48,194.89],"k":2,"r":[232,304,309,326,331,339],"rm":0},{"id":"2408.15136","t":"Low-Budget Simulation-Based Inference with Bayesian Neural Networks","ab":"Simulation-based inference methods have been shown to be inaccurate in the data-poor regime, when training simulations are limited or expensive. Under these circumstances, the inference network is particularly prone to overfitting, and using it without accounting for the computational uncertainty arising from the lack of identifiability of the network weights can lead to unreliable results. To address this issue, we propose using Bayesian neural networks in low-budget simulation-based inference, thereby explicitly accounting for the computational uncertainty of the posterior approximation. We design a family of Bayesian neural network priors that are tailored for inference and show that they lead to well-calibrated posteriors on tested benchmarks, even when as few as $O(10)$ simulations are available. This opens up the possibility of performing reliable simulation-based inference using very expensive simulators, as we demonstrate on a problem from the field of cosmology where single simulations are computationally expensive. We show that Bayesian neural networks produce informative and well-calibrated posterior estimates with only a few hundred simulations.","abx":0,"nw":0,"d":"2024-08-27","dq":0,"y":2024,"au":[74,453,586,255],"c":9,"cs":0,"bib":"2024arXiv240815136D","v":"arXiv.org","lk":"arXiv:2408.15136","url":"https://arxiv.org/abs/2408.15136","doi":"10.48550/arXiv.2408.15136","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra"],"m":["Simulation-based inference"],"u":["Power spectra"]},"x":-0.1116,"yy":-0.2916,"p3":[0.6851,0.0571,0.3223],"sim":{"k":"e","l":[[107,0.955],[127,0.954],[254,0.942],[114,0.939],[142,0.938]]},"c3":[12.61,123.01,94.43],"c2":[45.12,97.67],"k":7,"r":[189,339],"rm":0},{"id":"2408.13876","t":"Capturing primordial non-Gaussian signatures in the late Universe by multi-scale extrema of the cosmic log-density field","ab":"We construct two new summary statistics, the scale-dependent peak height function (scale-PKHF) and the scale-dependent valley depth function (scale-VLYDF) of matter density, and forecast their constraining power on primordial non-Gaussianity and cosmological parameters based on \\textsc{Quijote} and \\textsc{Quijote-PNG} simulations at $z=0$. With the Fisher analysis, we demonstrate that these statistics outperform the power spectrum and bispectrum. Key findings include: (1) the constraint on the scalar spectral index $n_s$ obtained from the scale-VLYDF/scale-PKHF is 1.59/1.10 times tighter than that from the joint analysis of power spectrum and bispectrum; (2) the combination of the two statistics yields a slight improvement in constraining $\\{f_\\mathrm{NL}^\\mathrm{local}, f_\\mathrm{NL}^\\mathrm{equil}\\}$ over the power spectrum-bispectrum combination, and provides a 1.39-fold improvement in the constraint on $f_\\mathrm{NL}^\\mathrm{ortho}$; (3) after incorporating the power spectrum with our new statistics, parameter constraints surpass those from power spectrum-bispectrum combination by factors up to 2.93. This work offers an effective scheme for extracting primordial signals from the late Universe, paving the way for further breakthroughs in precision cosmology.","abx":0,"nw":0,"d":"2024-08-25","dq":0,"y":2024,"au":[700,516],"c":10,"cs":0,"bib":"2025PhRvD.111d1302W","v":"Physical Review D","lk":"arXiv:2408.13876","url":"https://arxiv.org/abs/2408.13876","doi":"10.1103/PhysRevD.111.L041302","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.1935,"yy":0.584,"p3":[-0.6255,0.2492,0.189],"sim":{"k":"e","l":[[4,0.955],[264,0.95],[229,0.949],[181,0.948],[259,0.947]]},"c3":[-34.51,7.06,-151.9],"c2":[100.74,-17.39],"k":5,"r":[179,228,241,257,262,264,266,282,326,331,333,334,339],"rm":0},{"id":"2408.10307","t":"The streaming model for the three-point correlation function and its connection to standard perturbation theory","ab":"Redshift-space distortions present a significant challenge in building models for the three-point correlation function (3PCF). We compare two possible lines of attack: the streaming model and standard perturbation theory (SPT). The two approaches differ in their treatment of the non-linear mapping from real to redshift space: SPT expands this mapping perturbatively, while the streaming model retains its non-linear form but relies on simplifying assumptions about the probability density function (PDF) of line-of-sight velocity differences between pairs or triplets of tracers. To assess the quality of the predictions and the validity of the assumptions of these models, we measure the monopole of the matter 3PCF and the first two moments of the pair- and triplewise velocity PDF from a suite of N-body simulations. We also evaluate the large-scale limit of the streaming model and determine under which conditions it aligns to SPT. On scales $>10\\,h^{-1}\\mathrm{Mpc}$, we find that the streaming model for the 3PCF monopole is dominated by the first two velocity moments, making the exact shape of the PDF irrelevant. This model can match the accuracy of a Stage-IV galaxy survey, if the velocity moments are measured directly from the simulations. However, replacing the measurements with perturbative expressions to leading order generates large errors already on scales of $60-70 h^{-1}\\mathrm{Mpc}$. This is the main drawback of the streaming model. Conversely, the SPT model for the 3PCF cannot account for the significant velocity dispersion that is present at all scales, and consequently provides predictions with limited accuracy. We demonstrate that this issue can be addressed by isolating the large-scale limit of the dispersion, which leads to typical Fingers-of-God damping functions. Overall, the SPT model with a damping function provides the best deal in terms of accuracy and computing time.","abx":0,"nw":0,"d":"2024-08-19","dq":0,"y":2024,"au":[63,37,149,345],"c":3,"cs":0,"bib":"2025JCAP...01..075P","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2408.10307","url":"https://arxiv.org/abs/2408.10307","doi":"10.1088/1475-7516/2025/01/075","tg":{"s":["Quijote (set not stated)"],"d":["Particle snapshots","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Particle snapshots"]},"x":-0.2964,"yy":0.5362,"p3":[0.1083,-0.332,-0.7211],"sim":{"k":"e","l":[[143,0.943],[100,0.942],[324,0.941],[117,0.94],[317,0.94]]},"c3":[45.59,-49.26,-189.5],"c2":[31.54,207.72],"k":4,"r":[296,336,339],"rm":0},{"id":"2408.07699","t":"Field-level Emulation of Cosmic Structure Formation with Cosmology and Redshift Dependence","ab":"We present a field-level emulator for large-scale structure, capturing the cosmology dependence and the time evolution of cosmic structure formation. The emulator maps linear displacement fields to their corresponding nonlinear displacements from N-body simulations at specific redshifts. Designed as a neural network, the emulator incorporates style parameters that encode dependencies on $Ω_{\\rm m}$ and the linear growth factor $D(z)$ at redshift $z$. We train our model on the six-dimensional N-body phase space, predicting particle velocities as the time derivative of the model's displacement outputs. This innovation results in significant improvements in training efficiency and model accuracy. Tested on diverse cosmologies and redshifts not seen during training, the emulator achieves percent-level accuracy on scales of $k\\sim~1~{\\rm Mpc}^{-1}~h$ at $z=0$, with improved performance at higher redshifts. We compare predicted structure formation histories with N-body simulations via merger trees, finding consistent merger event sequences and statistical properties.","abx":0,"nw":0,"d":"2024-08-14","dq":0,"y":2024,"au":[187,684,240,580,166],"c":21,"cs":0,"bib":"2025JCAP...03..072J","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2408.07699","url":"https://arxiv.org/abs/2408.07699","doi":"10.1088/1475-7516/2025/03/072","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Particle snapshots","Merger trees"],"m":["CNN","Emulators & regression ML"],"u":["CNN"]},"x":-0.5145,"yy":-0.3993,"p3":[0.3196,-0.2042,0.4819],"sim":{"k":"e","l":[[260,0.967],[21,0.948],[222,0.946],[261,0.945],[115,0.944]]},"c3":[99.04,19.99,13.62],"c2":[212.72,-81.43],"k":1,"r":[176,188,199,204,205,214,244,260,261,272,280,286,291,311,313,332,339],"rm":0},{"id":"2407.18647","t":"Towards unveiling the large-scale nature of gravity with the wavelet scattering transform","ab":"We present the first application of the Wavelet Scattering Transform (WST) in order to constrain the nature of gravity using the three-dimensional (3D) large-scale structure of the universe. Utilizing the Quijote-MG N-body simulations, we can reliably model the 3D matter overdensity field for the f(R) Hu-Sawicki modified gravity (MG) model down to $k_{\\rm max}=0.5$ h/Mpc. Combining these simulations with the Quijote $ν$CDM collection, we then conduct a Fisher forecast of the marginalized constraints obtained on gravity using the WST coefficients and the matter power spectrum at redshift z=0. Our results demonstrate that the WST substantially improves upon the 1$σ$ error obtained on the parameter that captures deviations from standard General Relativity (GR), yielding a tenfold improvement compared to the corresponding matter power spectrum result. At the same time, the WST also enhances the precision on the $Λ$CDM parameters and the sum of neutrino masses, by factors of 1.2-3.4 compared to the matter power spectrum, respectively. Despite the overall reduction in the WST performance when we focus on larger scales, it still provides a relatively $4.5\\times$ tighter 1$σ$ error for the MG parameter at $k_{\\rm max}=0.2$ h/Mpc, highlighting its great sensitivity to the underlying gravity theory. This first proof-of-concept study reaffirms the constraining properties of the WST technique and paves the way for exciting future applications in order to perform precise large-scale tests of gravity with the new generation of cutting-edge cosmological data.","abx":0,"nw":0,"d":"2024-07-26","dq":0,"y":2024,"au":[253,240,424],"c":14,"cs":0,"bib":"2024JCAP...11..061V","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2407.18647","url":"https://arxiv.org/abs/2407.18647","doi":"10.1088/1475-7516/2024/11/061","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Quijote-MG"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.7314,"yy":0.2501,"p3":[-0.4735,0.0505,0.4472],"sim":{"k":"e","l":[[291,0.965],[178,0.955],[62,0.948],[272,0.946],[171,0.937]]},"c3":[-5.52,187.4,-69.76],"c2":[158.87,70.62],"k":5,"r":[167,171,176,178,179,186,199,227,234,245,249,257,262,272,273,282,284,291,292,297,308,310,322,327,331,334,339],"rm":0},{"id":"2407.16640","t":"Interpretable and physics-informed emulator for the linear matter power spectrum from machine learning","ab":"We present an interpretable emulator for the linear matter power spectrum (MPS) in the standard cosmological model $Λ$CDM, constructed via a physics-informed symbolic regression framework. By combining domain knowledge with a machine learning technique known as genetic algorithms, we explore the space of analytic expressions to derive closed-form, smooth, physically motivated approximations of the MPS that match the accuracy of standard broadband reconstruction methodologies such as the Savitzky-Golay filter. Building upon this baseline, we incorporate transparent oscillatory corrections informed by the physics of baryon acoustic oscillations (BAO). The resulting expression delivers mean sub-percent fractional errors across a broad range of scales ($k \\in [10^{-5}, 1.5]~h\\,\\mathrm{Mpc}^{-1}$) with an average deviation of $\\sim 0.4\\%$ when tested against spectra computed with a Boltzmann solver. Moreover, a comparable level of fractional deviation is maintained on smaller scales when the GA-derived formulation is used as input to the nonlinear emulator halofit. To illustrate the versatility of the framework beyond $Λ$CDM, we apply it to a representative $f(R)$ gravity model. Rather than training a general modified-gravity emulator, we compute the corresponding linear spectra with a Boltzmann solver and fit a parametric deformation of the $Λ$CDM smoothed component. This procedure achieves average errors at the 1.5-1.8\\% level and captures the leading modulation of the MPS induced by modified gravity, enabling a controlled study of its impact on the BAO scale. Our results provide compact, accurate, and physically motivated fitting functions for the linear MPS in both standard and MG cosmologies, offering a fast and transparent alternative to existing emulators for parameter inference and theoretical modeling in large-scale structure analyses.","abx":0,"nw":0,"d":"2024-07-23","dq":0,"y":2024,"au":[296,179,570],"c":9,"cs":0,"bib":"2026PhRvD.113f3526O","v":"Physical Review D","lk":"arXiv:2407.16640","url":"https://arxiv.org/abs/2407.16640","doi":"10.1103/hp65-mcrz","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra"],"m":["Symbolic regression"],"u":[]},"x":0.0312,"yy":-0.5005,"p3":[-0.0643,0.5409,0.204],"sim":{"k":"e","l":[[135,0.948],[183,0.947],[17,0.947],[171,0.941],[62,0.939]]},"c3":[-182.49,121.53,-7.51],"c2":[-114.81,164.22],"k":7,"r":[135,157,183,325,339],"rm":0},{"id":"title:httpswwwtesesuspbrtesesdisponiveis4343134tde15072024101341publicotesenatalisoler","t":"PhD thesis, Universidade de São Paulo (2024)","ab":"","abx":0,"nw":0,"d":"2024","dq":1,"y":2024,"au":[478],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://www.teses.usp.br/teses/disponiveis/43/43134/tde-15072024-101341/publico/tesenatalisolermatubarodesanti.pdf","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Power spectra"],"m":["No ML"],"u":["Quijote (set not stated)","Halo catalogs","Power spectra","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.3628,"yy":0.1499,"p3":[-0.2861,0.0615,-0.0737],"sim":{"k":"w","l":[[10,0.069],[126,0.065],[0,0.0],[1,0.0],[2,0.0]]},"c3":[-297.85,-76.68,155.36],"c2":[-331.99,-116.84],"k":2,"r":[],"rm":1},{"id":"title:extractingcosmologicalinformationatnonlinearscalesusingmachinelearning","t":"Extracting cosmological information at non-linear scales using machine learning","ab":"","abx":0,"nw":0,"d":"2024","dq":1,"y":2024,"au":[607],"c":0,"cs":2,"bib":"","v":"","lk":"Master Thesis","url":"https://thesis.unipd.it/handle/20.500.12608/68240","doi":"","tg":{"s":["Latin hypercube"],"d":["Density fields"],"m":["CNN"],"u":["Latin hypercube","Density fields","CNN"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.0558,"yy":-0.1,"p3":[0.0981,0.205,0.2333],"sim":{"k":"w","l":[[301,0.266],[41,0.18],[83,0.157],[292,0.132],[240,0.106]]},"c3":[175.41,-225.87,197.29],"c2":[-56.07,-368.78],"k":1,"r":[],"rm":1},{"id":"2407.08731","t":"Massive-ish Particles from Small-ish Scales: Non-Perturbative Techniques for Cosmological Collider Physics from Large-Scale Structure Surveys","ab":"Massive particles produced during inflation impact soft limits of primordial correlators. Searching for these signatures presents an exciting opportunity to uncover the particle spectrum in the inflationary epoch. We present non-perturbative methods to constrain intermediate-mass scalars ($0\\leq m/H<3/2$, where $H$ is the inflationary Hubble scale) produced during inflation, which give rise to a power-law scaling in the squeezed primordial bispectrum. Exploiting the large-scale structure consistency relations and the separate universe approach, we derive models for the late-time squeezed matter bispectrum and collapsed matter trispectrum sourced by these fields. To validate our models, we run $N$-body simulations with the \"Cosmological Collider\" squeezed bispectrum for two different particle masses. Our models yield unbiased constraints on the amplitude of non-Gaussianity, $f_{\\rm NL}^Δ$, from the squeezed bispectrum and collapsed trispectrum deep into the non-linear regime ($k_{\\rm max}\\approx 2~h/{\\rm Mpc}$ at $z=0$). We assess the information content of these summary statistics, emphasizing the importance of sample variance cancellation in the matter sector. We also study the scale-dependent halo bias in our simulations. For mass-selected halos, the non-Gaussian bias estimated from our simulations agrees with predictions based on (i) separate universe simulations and (ii) universal mass functions. With further work, these results can be used to search for inflationary massive particle production with upcoming galaxy surveys.","abx":0,"nw":0,"d":"2024-07-11","dq":0,"y":2024,"au":[563,498,298,385],"c":27,"cs":0,"bib":"2024PhRvD.110h3516G","v":"","lk":"arXiv:2407.08731","url":"https://arxiv.org/abs/2407.08731","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Particle snapshots","Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fisher forecasts","Particle snapshots"]},"x":0.1529,"yy":0.7488,"p3":[-0.9073,0.0928,0.1986],"sim":{"k":"e","l":[[98,0.958],[166,0.945],[248,0.943],[264,0.936],[154,0.933]]},"c3":[-50.43,-227.19,-48.46],"c2":[57.3,-235.75],"k":5,"r":[163,221,229,248,257,259,266,285,319,339],"rm":0},{"id":"title:conservativesimulationbasedinferencewithbayesiandeeplearning","t":"Conservative Simulation-Based Inference with Bayesian Deep Learning","ab":"","abx":0,"nw":0,"d":"2024","dq":1,"y":2024,"au":[453],"c":0,"cs":2,"bib":"","v":"","lk":"Master thesis","url":"https://matheo.uliege.be/bitstream/2268.2/20480/6/MasterThesisMdlBB.pdf","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra"],"m":["Simulation-based inference"],"u":["Quijote (set not stated)","Power spectra","Simulation-based inference"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.0467,"yy":-0.4894,"p3":[0.7722,0.0045,0.2905],"sim":{"k":"w","l":[[95,0.399],[124,0.303],[153,0.261],[65,0.171],[206,0.168]]},"c3":[-196.21,-229.87,167.02],"c2":[-290.11,-198.46],"k":6,"r":[],"rm":1},{"id":"2407.06641","t":"Cosmological simulations of scale-dependent primordial non-Gaussianity","ab":"We present the results of a set of cosmological N-body simulations with standard $Λ$CDM cosmology but characterized by a scale-dependent primordial non-Gaussianity of the local type featuring a power-law dependence of the $f_{\\rm NL}^{\\rm loc}(k)$ at large scales followed by a saturation to a constant value at smaller scales where non-linear growth leads to the formation of collapsed cosmic structures. Such models are built to ensure consistency with current Cosmic Microwave Background bounds on primordial non-Gaussianity yet allowing for large effects of the non-Gaussian statistics on the properties of non-linear structure formation. We show the impact of such scale-dependent non-Gaussian scenarios on a wide range of properties of the resulting cosmic structures, such as the non-linear matter power spectrum, the halo and sub-halo mass functions, the concentration-mass relation, the halo and void density profiles, and we highlight for the first time that some of these models might mimic the effects of Warm Dark Matter for several of such observables","abx":0,"nw":0,"d":"2024-07-09","dq":0,"y":2024,"au":[424,204,176,388,55,665,247,462,427,397,240,88],"c":8,"cs":0,"bib":"2024JCAP...11..053B","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2407.06641","url":"https://arxiv.org/abs/2407.06641","doi":"10.1088/1475-7516/2024/11/053","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Particle snapshots","Halo catalogs","Void catalogs","Power spectra"],"m":["No ML"],"u":["Particle snapshots"]},"x":0.0112,"yy":0.7835,"p3":[-0.7259,-0.1914,-0.0155],"sim":{"k":"e","l":[[204,0.95],[130,0.945],[203,0.945],[333,0.941],[329,0.94]]},"c3":[-152.03,-175.67,-32.14],"c2":[-11.86,-236.87],"k":4,"r":[130,226,264],"rm":0},{"id":"2407.02210","t":"Baryon Acoustic Oscillations analyses with Density-Split Statistics","ab":"Accurate modeling for the evolution of the Baryon Acoustic Oscillations (BAO) is essential for using it as a standard ruler to probe cosmology. We explore the non-linearity of the BAO in different environments using the density-split statistics and compare them to the case of the conventional two-point correlation function (2PCF). We detect density-dependent shifts for the position of the BAO with respect to its linear version using halos from N-body simulations. Around low/high-densities, the scale of the BAO expands/contracts due to non-linear peculiar velocities. As the simulation evolves from redshift 1 to 0, the difference in the magnitude of the shifts between high- and low-dense regions increases from the sub-percent to the percent level. The width of the BAO around high density regions increases as the universe evolves, similar to the known broadening of the BAO in the 2PCF due to non-linear evolution. In contrast, the width is smaller and stable for low density regions. We discuss possible implications for the reconstructions of the BAO in light of our results.","abx":0,"nw":0,"d":"2024-07-02","dq":0,"y":2024,"au":[620,678,699,435,394,521],"c":4,"cs":0,"bib":"2025ApJ...982....5X","v":"","lk":"arXiv:2407.02210","url":"https://arxiv.org/abs/2407.02210","doi":"10.3847/1538-4357/adb4f0","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Higher-order statistics"],"m":["No ML"],"u":[]},"x":0.3141,"yy":0.242,"p3":[-0.0192,0.4331,-0.5154],"sim":{"k":"e","l":[[132,0.931],[323,0.926],[249,0.925],[278,0.923],[285,0.92]]},"c3":[59.47,-5.37,122.15],"c2":[52.18,-138.87],"k":3,"r":[194,216,222,249,339],"rm":0},{"id":"2407.02699","t":"Alcock-Paczyński effect on void-finding: Implications for void-galaxy cross-correlation modelling","ab":"Under the assumption of statistical isotropy, and in the absence of directional selection effects, a stack of voids is expected to be spherically symmetric, which makes it an excellent object to use for an Alcock-Paczyński (AP) test. This is commonly done using the void-galaxy cross-correlation function (CCF), which has emerged as a competitive probe, especially in combination with the galaxy-galaxy auto correlation function. Current studies of the AP effect around voids assume that the void centre positions transform under the choice of fiducial cosmology in the same way as galaxy positions. We show that this assumption, though prevalent in the literature, is complicated by the response of void-finding algorithms to shifts in tracer positions. Using stretched simulation boxes to emulate the AP effect, we investigate how the void-galaxy CCF changes under AP, revealing an additional effect imprinted in the CCF that must be accounted for. The effect comes from the response of void finders to the distorted tracer field, reducing the amplitude of the AP signal in the CCF, and thus depends on the specific void finding algorithm used. We present results for four different void finding packages: $\\texttt{revolver}$, $\\texttt{vide}$, $\\texttt{voxel}$, and the spherical void finder in the $\\texttt{Pylians3}$ library, demonstrating how incorrect treatment of the AP effect results in biases in the recovered parameters for all of them. Finally, we propose a method to alleviate this issue without resorting to complex and finder-specific modelling of the void finder response to AP.","abx":0,"nw":0,"d":"2024-07-02","dq":0,"y":2024,"au":[595,270,574,661,210,637,200,35],"c":11,"cs":0,"bib":"2024A&A...691A..39R","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2407.02699","url":"https://arxiv.org/abs/2407.02699","doi":"10.1051/0004-6361/202451358","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Void catalogs","Higher-order statistics"],"m":["No ML"],"u":["Halo catalogs","Higher-order statistics"]},"x":0.3995,"yy":-0.6898,"p3":[0.0219,-0.7185,0.026],"sim":{"k":"e","l":[[82,0.947],[57,0.934],[258,0.934],[289,0.926],[170,0.925]]},"c3":[36.42,122.19,130.0],"c2":[49.31,-102.43],"k":2,"r":[173,258,339],"rm":0},{"id":"2406.15546","t":"The Impact of Non-Gaussian Primordial Tails on Cosmological Observables","ab":"Whilst current observational evidence favors a close-to-Gaussian spectrum of primordial perturbations, there exist many models of the early Universe that predict this distribution to have exponentially enhanced or suppressed tails. In this work, we generate realizations of the primordial potential with non-Gaussian tails via a phenomenological model; these are then evolved numerically to obtain maps of the cosmic microwave background (CMB) and large-scale structure (LSS). In the CMB maps, our added non-Gaussianity manifests as a localized enhancement of hot and cold spots, which would be expected to contribute to $N$-point functions up to large $N$. Such models are indirectly constrained by \\textit{Planck} trispectrum bounds, which restrict the changes in the temperature fluctuations to $O(10μ\\mathrm{K})$. In the late-time Universe, we find that tailed cosmologies lead to a halo mass function enhanced at high masses, as expected. Furthermore, significant scale-dependent bias in the halo-halo and halo-matter power spectrum is also sourced, which arises from the squeezed limit of large $N$-point functions that are implicitly generated through the enhancement of the tails. These results underscore that a detection of scale-dependent bias alone cannot be used to rule out single field inflation, but can be used together with other statistics to probe a wide range of primordial processes.","abx":0,"nw":0,"d":"2024-06-21","dq":0,"y":2024,"au":[665,498,240],"c":9,"cs":0,"bib":"2024arXiv240615546C","v":"","lk":"arXiv:2406.15546","url":"https://arxiv.org/abs/2406.15546","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs","Power spectra","Weak lensing & 2D maps"],"m":["No ML"],"u":[]},"x":0.1163,"yy":0.7829,"p3":[-0.7678,0.0329,0.0494],"sim":{"k":"e","l":[[264,0.946],[161,0.945],[203,0.944],[257,0.943],[259,0.942]]},"c3":[-38.97,-158.07,-16.61],"c2":[31.81,-181.59],"k":5,"r":[221,248,264,339],"rm":0},{"id":"2406.06067","t":"Fisher's Mirage: Noise Tightening of Cosmological Constraints in Simulation-Based Inference","ab":"We systematically analyze the implications of statistical noise within numerical derivatives on simulation-based Fisher forecasts for large scale structure surveys. Noisy numerical derivatives resulting from a finite number of simulations, $N_{sims}$, act to bias the associated Fisher forecast such that the resulting marginalized constraints can be significantly tighter than the noise-free limit. We show the source of this effect can be traced to the influence of the noise on the marginalization process. Parameters such as the neutrino mass, $\\M$, for which higher-order forward differentiation schemes are commonly used, are more prone to noise; the predicted constraints can be akin to those purely from a random instance of statistical noise even using $(1\\mathrm{Gpc}/h)^{3}$ simulations with $N_{sims}=500$ realizations. We demonstrate how derivative noise can artificially reduce parameter degeneracies and seemingly null the effects of adding nuisance parameters to the forecast, such as HOD fitting parameters. We mathematically characterize these effects through a full statistical analysis, and demonstrate how confidence intervals for the true noise-free, $N_{sims} \\rightarrow \\infty$, Fisher constraints can be recovered even when noise comprises a consequential component of the measured signal. The findings and approaches developed here are important for ensuring simulation-based analyses can be accurately used to assess upcoming survey capabilities.","abx":0,"nw":0,"d":"2024-06-10","dq":0,"y":2024,"au":[140,530],"c":4,"cs":0,"bib":"2025PhRvD.111j3532W","v":"","lk":"arXiv:2406.06067","url":"https://arxiv.org/abs/2406.06067","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Molino / HOD galaxy mocks","Galaxy mocks (HOD)","Higher-order statistics"]},"x":-0.033,"yy":-0.1685,"p3":[0.0886,-0.1166,0.2287],"sim":{"k":"e","l":[[292,0.94],[34,0.938],[208,0.937],[38,0.937],[58,0.935]]},"c3":[55.05,100.25,-143.93],"c2":[113.91,70.5],"k":7,"r":[195,201,227,234,249,255,257,262,264,269,273,278,291,297,308,309,312,331,336,339],"rm":0},{"id":"2406.04054","t":"Dynamics-based halo model for large scale structure","ab":"Accurate modelling of the one-to-two halo transition has long been difficult to achieve. We demonstrate that physically motivated halo definitions that respect the bimodal phase-space distribution of dark matter particles near halos resolves this difficulty. Specifically, the two phase-space components are overlapping and correspond to: 1) particles \\it orbiting \\rm the halo; and 2) particles \\it infalling \\rm into the halo for the first time. Motivated by this decomposition, García [R. García et. al., MNRAS 521, 2464 (2023)] advocated for defining haloes as the collection of particles orbiting their self-generated potential. This definition identifies the traditional one-halo term of the halo--mass correlation function with the distribution of orbiting particles around a halo, while the two-halo term governs the distribution of infalling particles. We use dark matter simulations to demonstrate that the distribution of orbiting particles is finite and can be characterised by a single physical scale $r_{\\rm h}$, which we refer to as the \\it halo radius. \\rm The two-halo term is described using a simple yet accurate empirical model based on the Zel'dovich correlation function. We further demonstrate that the halo radius imprints itself on the distribution of infalling particles at small scales. Our final model for the halo--mass correlation function is accurate at the $\\approx 2\\%$ level for $r \\in [0.1,50]\\ h^{-1}\\ Mpc$. The Fourier transform of our best fit model describes the halo--mass power spectrum with comparable accuracy for $k\\in [0.06, 6.0]\\ h\\ Mpc^{-1}$.","abx":0,"nw":0,"d":"2024-06-06","dq":0,"y":2024,"au":[195,197,531,484,608,94,112],"c":13,"cs":0,"bib":"2025PhRvD.111d3527S","v":"Physical Review D","lk":"arXiv:2406.04054","url":"https://arxiv.org/abs/2406.04054","doi":"10.1103/physrevd.111.043527","tg":{"s":["Quijote (set not stated)"],"d":["Particle snapshots","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Particle snapshots"]},"x":-0.3496,"yy":0.3278,"p3":[0.0257,0.0515,-0.2471],"sim":{"k":"e","l":[[329,0.937],[195,0.934],[1,0.932],[0,0.927],[148,0.925]]},"c3":[-156.25,9.94,40.02],"c2":[-171.26,80.43],"k":7,"r":[183,339],"rm":0},{"id":"2405.13119","t":"Cosmology from Point Clouds with Dark Matter Halos from the Quijote Simulations","ab":"We train a novel deep learning architecture to perform likelihood-free inference on the value of the cosmological parameters from halo catalogs of the Quijote N-body simulations. Our model takes as input a halo catalog where each halo is characterized by its position, mass, and velocity modulus. By construction, our model is E(3) invariant and is designed to extract information hierarchically. Unlike graph neural networks, it does not require the transformation of the input halo (or galaxy) catalog into a graph. Given its simplicity, our model can process point clouds with large numbers of points. We discuss the advantages of this class of methods but also point out their limitations and potential ways to improve them for cosmological data.","abx":0,"nw":0,"d":"2024-05-21","dq":0,"y":2024,"au":[80,240],"c":11,"cs":0,"bib":"2025ApJ...985..132C","v":"Astrophysical Journal","lk":"arXiv:2405.13119","url":"https://arxiv.org/abs/2405.13119","doi":"10.3847/1538-4357/adc99d","tg":{"s":["Latin hypercube"],"d":["Halo catalogs"],"m":["Simulation-based inference","Other ML"],"u":["Latin hypercube"]},"x":-0.3145,"yy":-0.5687,"p3":[0.1118,0.1392,0.7319],"sim":{"k":"e","l":[[102,0.946],[70,0.944],[110,0.944],[313,0.944],[78,0.944]]},"c3":[-74.89,165.56,-66.59],"c2":[53.63,116.05],"k":1,"r":[185,189,240,255,272,275,279,284,291,297,304,308,309,316,319,322,333,334,336,339],"rm":0},{"id":"2405.12302","t":"Significance of void shape: Neutrino mass from Voronoi void halos?","ab":"Massive neutrinos suppress the growth of cosmic structure on nonlinear scales, motivating the use of information beyond the power spectrum to tighten constraints on the neutrino mass, for example by considering cosmic voids. It was recently proposed that constraints on neutrino mass from the halo mass function (HMF) can be improved by considering only the halos that reside within voids -- the void-halo mass function (VHMF). We extend this analysis, which made spherical assumptions about the shape of voids, to take into account the non-spherical nature of voids as defined by the Voronoi-tessellation-based void finder, VIDE. In turn, after accounting for one spurious non-spherical void, we find no evidence that the VHMF contains information beyond the HMF. Given this finding, we then introduce a novel summary statistic by splitting halos according to the emptiness of their individual environments, defined by the Voronoi cell volume each halo resides in, and combining the mass functions from each split. We name the corresponding statistic the VorHMF and find that it could provide information regarding neutrino mass beyond the HMF. Our work thus motivates the importance of accounting for the full shape of voids in future analyses, both in terms of removing outliers to achieve robust results and as an additional source of cosmological information.","abx":0,"nw":0,"d":"2024-05-20","dq":0,"y":2024,"au":[21,323,135,43],"c":9,"cs":0,"bib":"2024PhRvD.110f1305B","v":"Physical Review D","lk":"arXiv:2405.12302","url":"https://arxiv.org/abs/2405.12302","doi":"10.1103/PhysRevD.110.L061305","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Void catalogs","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Fisher forecasts"]},"x":0.3447,"yy":0.0202,"p3":[0.0897,-0.2592,-0.129],"sim":{"k":"e","l":[[308,0.937],[82,0.933],[14,0.931],[109,0.931],[215,0.931]]},"c3":[-56.77,223.92,-47.56],"c2":[21.46,160.59],"k":8,"r":[215,240,249,255,292,297,308,339],"rm":0},{"id":"2405.05840","t":"FREmu: Power Spectrum Emulator for $f(R)$ Gravity","ab":"To investigate gravity in the non-linear regime of cosmic structure using measurements from Stage-IV surveys, it is imperative to accurately compute large-scale structure observables, such as non-linear matter power spectra, for gravity models that extend beyond general relativity. However, the theoretical predictions of non-linear observables are typically derived from N-body simulations, which demand substantial computational resources. In this study, we introduce a novel public emulator, termed FREmu, designed to provide rapid and precise forecasts of non-linear power spectra specifically for the Hu-Sawicki $f(R)$ gravity model across scales $0.0089 h \\mathrm{Mpc}^{-1}<k<0.5 h \\mathrm{Mpc}^{-1}$ and redshifts $0<z<3$. FREmu leverages Principal Component Analysis and Artificial Neural Networks to establish a mapping from parameters to power spectra, utilizing training data derived from the Quijote-MG simulation suite. With a parameter space encompassing 7 dimensions, including $Ω_m$, $Ω_b$, $h$, $n_s$, $σ_8$, $M_ν$ and $f_{R_0}$, the emulator achieves an accuracy exceeding 95% for the majority of cases, thus proving to be highly efficient for constraining parameters.","abx":0,"nw":0,"d":"2024-05-09","dq":0,"y":2024,"au":[324,357],"c":13,"cs":0,"bib":"2024ApJ...971...11B","v":"Astrophysical Journal","lk":"arXiv:2405.05840","url":"https://arxiv.org/abs/2405.05840","doi":"10.3847/1538-4357/ad55ef","tg":{"s":["Quijote-MG"],"d":["Power spectra"],"m":["Emulators & regression ML"],"u":[]},"x":0.0905,"yy":-0.391,"p3":[-0.3531,0.3873,0.2724],"sim":{"k":"e","l":[[36,0.952],[119,0.951],[264,0.95],[263,0.945],[62,0.943]]},"c3":[-165.9,89.92,24.46],"c2":[-17.29,48.58],"k":5,"r":[],"rm":0},{"id":"2405.03468","t":"Hierarchic Flows to Estimate and Sample High-dimensional Probabilities","ab":"Finding low-dimensional interpretable models of complex physical fields such as turbulence remains an open question, 80 years after the pioneer work of Kolmogorov. Estimating high-dimensional probability distributions from data samples suffers from an optimization and an approximation curse of dimensionality. It may be avoided by following a hierarchic probability flow from coarse to fine scales. This inverse renormalization group is defined by conditional probabilities across scales, renormalized in a wavelet basis. For a $\\vvarphi^4$ scalar potential, sampling these hierarchic models avoids the critical slowing down at the phase transition. In a well chosen wavelet basis, conditional probabilities can be captured with low dimensional parametric models, because interactions between wavelet coefficients are local in space and scales. An outstanding issue is also to approximate non-Gaussian fields having long-range interactions in space and across scales. We introduce low-dimensional models of wavelet conditional probabilities with the scattering covariance. It is calculated with a second wavelet transform, which defines interactions over two hierarchies of scales. We estimate and sample these wavelet scattering models to generate 2D vorticity fields of turbulence, and images of dark matter densities.","abx":0,"nw":0,"d":"2024-05-06","dq":0,"y":2024,"au":[215,602],"c":6,"cs":0,"bib":"2024arXiv240503468L","v":"Applied and Computational Harmonic Analysis","lk":"arXiv:2405.03468","url":"https://arxiv.org/abs/2405.03468","doi":"10.48550/arXiv.2405.03468","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics","Weak lensing & 2D maps"],"m":["Generative models"],"u":[]},"x":0.0621,"yy":-0.967,"p3":[-0.2504,-0.4548,0.7523],"sim":{"k":"e","l":[[218,0.939],[327,0.929],[291,0.925],[184,0.921],[136,0.918]]},"c3":[-20.27,79.19,68.4],"c2":[-100.66,90.21],"k":6,"r":[218,339],"rm":0},{"id":"2405.02252","t":"A Parameter-Masked Mock Data Challenge for Beyond-Two-Point Galaxy Clustering Statistics","ab":"The last few years have seen the emergence of a wide array of novel techniques for analyzing high-precision data from upcoming galaxy surveys, which aim to extend the statistical analysis of galaxy clustering data beyond the linear regime and the canonical two-point (2pt) statistics. We test and benchmark some of these new techniques in a community data challenge \"Beyond-2pt\", initiated during the Aspen 2022 Summer Program \"Large-Scale Structure Cosmology beyond 2-Point Statistics,\" whose first round of results we present here. The challenge dataset consists of high-precision mock galaxy catalogs for clustering in real space, redshift space, and on a light cone. Participants in the challenge have developed end-to-end pipelines to analyze mock catalogs and extract unknown (\"masked\") cosmological parameters of the underlying $Λ$CDM models with their methods. The methods represented are density-split clustering, nearest neighbor statistics, BACCO power spectrum emulator, void statistics, LEFTfield field-level inference using effective field theory (EFT), and joint power spectrum and bispectrum analyses using both EFT and simulation-based inference. In this work, we review the results of the challenge, focusing on problems solved, lessons learned, and future research needed to perfect the emerging beyond-2pt approaches. The unbiased parameter recovery demonstrated in this challenge by multiple statistics and the associated modeling and inference frameworks supports the credibility of cosmology constraints from these methods. The challenge data set is publicly available and we welcome future submissions from methods that are not yet represented.","abx":0,"nw":0,"d":"2024-05-03","dq":0,"y":2024,"au":[100,202,689,59,465,631,371,534,257,597,118,122,485,180,131,482,619,210,428,498,43,218,569,258,587,447],"c":70,"cs":0,"bib":"2025ApJ...990...99B","v":"Astrophysical Journal","lk":"arXiv:2405.02252","url":"https://arxiv.org/abs/2405.02252","doi":"10.3847/1538-4357/ad781d","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Simulation-based inference","Emulators & regression ML","Perturbation theory & analytic models"],"u":["Non-Quijote simulations"]},"x":-0.0893,"yy":0.0847,"p3":[0.3982,-0.5377,-0.2592],"sim":{"k":"e","l":[[244,0.951],[176,0.948],[146,0.941],[90,0.941],[198,0.938]]},"c3":[122.61,119.16,43.47],"c2":[224.48,-47.44],"k":0,"r":[185,186,188,189,199,201,205,208,214,215,244,245,249,262,297,308,322,339],"rm":0},{"id":"2405.00635","t":"Bye-bye, Local-in-matter-density Bias: The Statistics of the Halo Field Are Poorly Determined by the Local Mass Density","ab":"Bias models relating the dark matter field to the spatial distribution of halos are widely used in current cosmological analyses. Many models predict halos purely from the local Eulerian matter density, yet bias models in perturbation theory require other local properties. We assess the validity of assuming that only the local dark matter density can be used to predict the number density of halos in a model-independent way and in the non-perturbative regime. Utilising $N$-body simulations, we study the properties of the halo counts field after spatial voxels with near-equal dark matter density have been permuted. If local-in-matter-density biasing were valid, the statistical properties of the permuted and un-permuted fields would be indistinguishable since both represent equally fair draws of the stochastic biasing model. If the Lagrangian radius is greater than approximately half the voxel size and for halos less massive than $\\sim10^{15}\\,h^{-1}{\\rm\\,M_\\odot}$, we find the permuted halo field has a scale-dependent bias with greater than 25% more power on scales relevant for current surveys. These bias models remove small-scale power by not modelling correlations between neighbouring voxels, which substantially boosts large-scale power to conserve the field's total variance. This conclusion is robust to the choice of initial conditions and cosmology. Assuming local-in-matter-density halo biasing cannot, therefore, reproduce the distribution of halos across a large range of scales and halo masses, no matter how complex the model. One must either allow the biasing to be a function of other quantities and/or remove the assumption that neighbouring voxels are statistically independent.","abx":0,"nw":0,"d":"2024-05-01","dq":0,"y":2024,"au":[172,448,95],"c":11,"cs":0,"bib":"2024ApJ...977L..44B","v":"Astrophysical Journal Letters","lk":"arXiv:2405.00635","url":"https://arxiv.org/abs/2405.00635","doi":"10.3847/2041-8213/ad97b9","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Halo catalogs"],"m":["No ML"],"u":[]},"x":-0.4261,"yy":0.3295,"p3":[0.2011,-0.3807,-0.4683],"sim":{"k":"e","l":[[329,0.94],[115,0.935],[197,0.93],[324,0.928],[298,0.927]]},"c3":[261.59,41.56,40.51],"c2":[284.37,-103.82],"k":7,"r":[],"rm":0},{"id":"2404.09483","t":"Deep learning for cosmological parameter inference from a dark matter halo density field","ab":"We propose a lightweight deep convolutional neural network (lCNN) to estimate cosmological parameters from simulated three-dimensional dark matter (DM) halo distributions and associated statistics. The training dataset comprises 2000 realizations of a cubic box with a side length of 1000 $h^{-1}{\\rm Mpc}$, and interpolated over a cubic grid of $300^3$ voxels, with each simulation produced using $512^3$ DM particles and $512^3$ neutrinos. Under the flat $Λ$CDM model, simulations vary standard six cosmological parameters including $Ω_m$, $Ω_b$, $h$, $n_s$, $σ_8$, $w$, along with the neutrino mass sum, $M_ν$. We find that: 1) within the framework of lCNN, extracting large-scale structure information is more efficient from the halo density field compared to relying on the statistical quantities including the power spectrum, the two-point correlation function, and the coefficients from wavelet scattering transform; 2) combining the halo density field with its Fourier transformed counterpart enhances predictions, while augmenting the training dataset with measured statistics further improves performance; 3) achieving high accuracy in inferring $Ω_m$, $h$, and $σ_8$ by the neural network model, while being inefficient in predicting $Ω_b$, { $n_s$}, $M_ν$ and $w$; 4) { compared to the simple fully connected network trained with three statistical quantities, our CNN yields statistically reduced errors, showing improvements of approximately 23\\% for $Ω_m$, 11\\% for $h$, 8\\% for $n_s$, and 21\\% for $σ_8$. Additionally, in comparison with the likelihood-based analysis on $P(k)$ data, our CNN provides much tighter constraints on parameters, especially on $Ω_m$ and $σ_8$.} Our study emphasizes this lCNN-based novel approach in extracting large-scale structure information and estimating cosmological parameters.","abx":0,"nw":0,"d":"2024-04-15","dq":0,"y":2024,"au":[711,676,325,396,333,183,523,679,584,712,667,334,390,668],"c":11,"cs":0,"bib":"2024PhRvD.110f3531M","v":"","lk":"arXiv:2404.09483","url":"https://arxiv.org/abs/2404.09483","doi":"10.1103/PhysRevD.110.063531","tg":{"s":["Latin hypercube","Massive neutrinos"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics"],"m":["CNN"],"u":["Latin hypercube"]},"x":-0.2111,"yy":-0.4001,"p3":[0.2349,0.409,0.4209],"sim":{"k":"e","l":[[335,0.946],[110,0.945],[107,0.945],[115,0.944],[74,0.943]]},"c3":[-94.81,127.83,-40.73],"c2":[79.02,40.53],"k":1,"r":[255,279,301,331,339],"rm":0},{"id":"2404.04228","t":"{\\sc SimBIG}: Cosmological Constraints using Simulation-Based Inference of Galaxy Clustering with Marked Power Spectra","ab":"We present the first $Λ$CDM cosmological analysis performed on a galaxy survey using marked power spectra. The marked power spectrum is the two-point function of a marked field, where galaxies are weighted by a function that depends on their local density. The presence of the mark leads these statistics to contain higher-order information of the original galaxy field, making them a good candidate to exploit the non-Gaussian information of a galaxy catalog. In this work we make use of \\simbig, a forward modeling framework for galaxy clustering analyses, and perform simulation-based inference using normalizing flows to infer the posterior distribution of the $Λ$CDM cosmological parameters. We consider different mark configurations (ways to weight the galaxy field) and deploy them in the \\simbig~pipeline to analyze the corresponding marked power spectra measured from a subset of the BOSS galaxy sample. We analyze the redshift-space mark power spectra decomposed in $\\ell = 0, 2, 4$ multipoles and include scales up to the non-linear regime. Among the various mark configurations considered, the ones that give the most stringent cosmological constraints produce posterior median and $68\\%$ confidence limits on the growth of structure parameters equal to $Ω_m=0.273^{+0.040}_{-0.030}$ and $σ_8=0.777^{+0.077}_{-0.071}$. Compared to a perturbation theory analysis using the power spectrum of the same dataset, the \\simbig~marked power spectra constraints on $σ_8$ are up to $1.2\\times$ tighter, while no improvement is seen for the other cosmological parameters.","abx":0,"nw":0,"d":"2024-04-05","dq":0,"y":2024,"au":[200,122,458,580,327,507,131,84,393,107],"c":26,"cs":0,"bib":"2025PhRvD.112h3507M","v":"","lk":"arXiv:2404.04228","url":"https://arxiv.org/abs/2404.04228","doi":"","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Simulation-based inference","Normalizing flows"],"u":["Latin hypercube"]},"x":-0.0421,"yy":0.0798,"p3":[0.2966,-0.3632,-0.0847],"sim":{"k":"e","l":[[198,0.954],[173,0.948],[243,0.946],[262,0.944],[26,0.943]]},"c3":[162.29,152.8,-105.43],"c2":[279.23,96.97],"k":0,"r":[186,199,201,244,245,249,262,272,284,291,297,312,317,326,331,339],"rm":0},{"id":"2404.02278","t":"Neural network reconstruction of density and velocity fields from the 2MASS Redshift Survey","ab":"We reconstruct the 3D matter density and peculiar velocity fields in the local Universe up to a distance of 200$\\,h^{-1}\\,$Mpc from the Two-Micron All-Sky Redshift Survey (2MRS), using a neural network (NN). We employed an NN with a U-net autoencoder architecture and a weighted mean squared error loss function trained separately to output either the density or velocity field for a given input grid of galaxy number counts. The NN was trained on mocks derived from the Quijote N-body simulations, incorporating redshift-space distortions (RSDs), galaxy bias, and selection effects closely mimicking the characteristics of 2MRS. The trained NN was benchmarked against a standard Wiener filter (WF) on a validation set of mocks before applying it to 2MRS. The NN reconstructions effectively approximate the mean posterior estimate of the true density and velocity fields conditioned on the observations. They consistently outperform the WF in terms of reconstruction accuracy and effectively capture the nonlinear relation between velocity and density. The NN-reconstructed bulk flow of the total survey volume exhibits a significant correlation with the true mock bulk flow, demonstrating that the NN is sensitive to information on super-survey scales encoded in the RSDs. When applied to 2MRS, the NN successfully recovers the main known clusters, some of which are partially in the Zone of Avoidance. The reconstructed bulk flows in spheres of different radii less than 100$\\,h^{-1}\\,$Mpc are in good agreement with a previous 2MRS analysis that required an additional external bulk flow component inferred from directly observed peculiar velocities. The NN-reconstructed peculiar velocity of the Local Group closely matches the observed Cosmic Microwave Background dipole in amplitude and Galactic latitude, and only deviates by 18${}^\\circ$ in longitude. The NN-reconstructed fields are publicly available.","abx":0,"nw":0,"d":"2024-04-02","dq":0,"y":2024,"au":[541,520,20],"c":18,"cs":0,"bib":"2024A&A...689A.226L","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2404.02278","url":"https://arxiv.org/abs/2404.02278","doi":"10.1051/0004-6361/202450219","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Galaxy mocks (HOD)","Redshift space"],"m":["CNN"],"u":["Galaxy mocks (HOD)"]},"x":-0.4788,"yy":-0.2712,"p3":[0.337,0.3896,0.2634],"sim":{"k":"e","l":[[92,0.947],[222,0.942],[70,0.935],[103,0.932],[110,0.93]]},"c3":[16.01,-73.99,185.88],"c2":[-45.53,-219.51],"k":1,"r":[180,216,222,230,339],"rm":0},{"id":"2403.17657","t":"Constraining Primordial Non-Gaussianity from Large Scale Structure with the Wavelet Scattering Transform","ab":"We investigate the Wavelet Scattering Transform (WST) as a tool for the study of Primordial non-Gaussianity (PNG) in Large Scale Structure (LSS), and compare its performance with that achievable via a joint analysis with power spectrum and bispectrum (P+B). We consider the three main primordial bispectrum shapes - local, equilateral and orthogonal - and produce Fisher forecast for the corresponding fNL amplitude parameters, jointly with standard cosmological parameters. We analyze simulations from the publicly available \"Quijote\" and \"Quijote-png\" N-body suites, studying both the dark matter and halo fields. We find that the WST outperforms the power spectrum alone on all parameters, both on the fNL's and on cosmological ones. In particular, on fNL_loc for halos, the improvement is about 27%. When B is combined with P, halo constraints from WST are weaker for fNL_loc (at ~ 15% level), but stronger for fNL_eq (~ 25%) and fNL_ortho (~ 28%). Our results show that WST, both alone and in combination with P+B, can improve the extraction of information on PNG from LSS data over the one attainable by a standard P+B analysis. Moreover, we identify a class of WST in which the origin of the extra information on PNG can be cleanly isolated.","abx":0,"nw":0,"d":"2024-03-26","dq":0,"y":2024,"au":[444,247,462,439],"c":13,"cs":0,"bib":"2024JCAP...07..021P","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2403.17657","url":"https://arxiv.org/abs/2403.17657","doi":"10.1088/1475-7516/2024/07/021","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.7151,"yy":0.2816,"p3":[-0.4052,-0.084,0.5002],"sim":{"k":"e","l":[[157,0.955],[291,0.955],[62,0.948],[154,0.941],[229,0.941]]},"c3":[2.56,36.24,-91.34],"c2":[148.2,-22.74],"k":5,"r":[181,186,198,199,201,204,226,227,241,242,255,257,262,263,264,272,273,275,282,291,308,322,326,331,333,334,339],"rm":0},{"id":"2403.13985","t":"Cosmology with Persistent Homology: a Fisher Forecast","ab":"Persistent homology naturally addresses the multi-scale topological characteristics of the large-scale structure as a distribution of clusters, loops, and voids. We apply this tool to the dark matter halo catalogs from the Quijote simulations, and build a summary statistic for comparison with the joint power spectrum and bispectrum statistic regarding their information content on cosmological parameters and primordial non-Gaussianity. Through a Fisher analysis, we find that constraints from persistent homology are tighter for 8 out of the 10 parameters by margins of 13-50%. The complementarity of the two statistics breaks parameter degeneracies, allowing for a further gain in constraining power when combined. We run a series of consistency checks to consolidate our results, and conclude that our findings motivate incorporating persistent homology into inference pipelines for cosmological survey data.","abx":0,"nw":0,"d":"2024-03-20","dq":0,"y":2024,"au":[308,442,32,369,251],"c":27,"cs":0,"bib":"2024JCAP...09..034Y","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2403.13985","url":"https://arxiv.org/abs/2403.13985","doi":"10.1088/1475-7516/2024/09/034","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Quijote-PNG"]},"x":0.7294,"yy":-0.1786,"p3":[-0.2945,0.8939,0.0469],"sim":{"k":"e","l":[[116,0.963],[67,0.963],[39,0.96],[192,0.958],[40,0.947]]},"c3":[-5.12,136.24,-97.13],"c2":[143.17,93.83],"k":9,"r":[192,196,205,208,226,227,244,245,249,256,257,262,264,272,291,295,310,312,317,322,326,330,331,333,334,336,339],"rm":0},{"id":"2403.11951","t":"Displacement Field Analysis via Optimal Transport: Multi-Tracer Approach to Cosmological Reconstruction","ab":"We demonstrate the effectiveness of one of the many multi-tracer analyses enabled by Optimal Transport (OT) reconstruction. Leveraging a semi-discrete OT algorithm, we determine the displacements between initial and observed positions of biased tracers and the remaining matter field. With only redshift-space distorted final positions of biased tracers and a simple premise for the remaining mass distribution as input, OT solves the displacement field. This extracted field, assuming asymptotically uniform density and a gradient flow displacement, enables reconstruction of the initial overdensity fluctuation field. We show that the divergence of the OT displacement field is a good proxy of the linear density field, even though the method never assumes the linear theory growth. Additionally, this divergence field can be combined with the reconstructed protohalos to provide a higher signal-to-noise measurement of the BAO standard ruler than was possible with either measurement individually.","abx":0,"nw":0,"d":"2024-03-18","dq":0,"y":2024,"au":[222,536,490,106,546],"c":15,"cs":0,"bib":"2024PhRvD.109l3512N","v":"Physical Review D","lk":"arXiv:2403.11951","url":"https://arxiv.org/abs/2403.11951","doi":"10.1103/physrevd.109.123512","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Halo catalogs","Redshift space"],"m":["No ML"],"u":[]},"x":-0.3465,"yy":0.7308,"p3":[-0.2937,-0.4368,-0.1477],"sim":{"k":"e","l":[[27,0.946],[216,0.941],[2,0.932],[123,0.929],[105,0.929]]},"c3":[-20.51,-144.26,222.69],"c2":[-78.41,-287.34],"k":4,"r":[194,216,222],"rm":0},{"id":"2403.00490","t":"Quijote-PNG: Optimizing the summary statistics to measure Primordial non-Gaussianity","ab":"We apply a suite of different estimators to the Quijote-PNG halo catalogues to find the best approach to constrain Primordial non-Gaussianity (PNG) at non-linear cosmological scales, up to $k_{\\rm max} = 0.5 \\, h\\,{\\rm Mpc}^{-1}$. The set of summary statistics considered in our analysis includes the power spectrum, bispectrum, halo mass function, marked power spectrum, and marked modal bispectrum. Marked statistics are used here for the first time in the context of PNG study. We perform a Fisher analysis to estimate their cosmological information content, showing substantial improvements when marked observables are added to the analysis. Starting from these summaries, we train deep neural networks (NN) to perform likelihood-free inference of cosmological and PNG parameters. We assess the performance of different subsets of summary statistics; in the case of $f_\\mathrm{NL}^\\mathrm{equil}$, we find that a combination of the power spectrum and a suitable marked power spectrum outperforms the combination of power spectrum and bispectrum, the baseline statistics usually employed in PNG analysis. A minimal pipeline to analyse the statistics we identified can be implemented either with our ML algorithm or via more traditional estimators, if these are deemed more reliable.","abx":0,"nw":0,"d":"2024-03-01","dq":0,"y":2024,"au":[247,55,462,424,665,240,95],"c":13,"cs":0,"bib":"2024ApJ...976..109J","v":"Astrophysical Journal","lk":"arXiv:2403.00490","url":"https://arxiv.org/abs/2403.00490","doi":"10.3847/1538-4357/ad83bd","tg":{"s":["Fiducial","Latin hypercube","Fisher derivatives","Quijote-PNG"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Simulation-based inference","Fisher forecasts"],"u":["Fiducial","Fisher derivatives","Latin hypercube"]},"x":0.2471,"yy":0.535,"p3":[-0.5756,0.3574,0.2631],"sim":{"k":"e","l":[[226,0.971],[242,0.969],[264,0.967],[63,0.963],[257,0.962]]},"c3":[48.86,-20.13,-22.95],"c2":[191.14,-101.77],"k":5,"r":[186,199,200,201,226,227,242,244,255,257,262,264,326,331,339],"rm":0},{"id":"2024aecc.conf...36S","t":"Relics from the Early Universe in Cosmic Voids","ab":"Unlike halos, cosmic voids are anti-correlated with the dark matter, and the large-scale void bias can be negative.","abx":1,"nw":1,"d":"2024-03","dq":0,"y":2024,"au":[307],"c":0,"cs":0,"bib":"2024aecc.conf...36S","v":"Austrian Early Career Conference 2024","lk":"Austrian Early Career Conference 2024","url":"https://ui.adsabs.harvard.edu/abs/2024aecc.conf...36S/abstract","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Void catalogs"],"m":["No ML"],"u":["Void catalogs","No ML"]},"x":0.1646,"yy":0.4178,"p3":[-0.5718,-0.1333,0.1038],"sim":{"k":"w","l":[[221,0.27],[120,0.238],[7,0.17],[240,0.143],[81,0.138]]},"c3":[-320.61,-162.55,98.0],"c2":[-387.6,-80.7],"k":5,"r":[],"rm":1},{"id":"2402.17492","t":"syren-halofit: A fast, interpretable, high-precision formula for the $Λ$CDM nonlinear matter power spectrum","ab":"Rapid and accurate evaluation of the nonlinear matter power spectrum, $P(k)$, as a function of cosmological parameters and redshift is of fundamental importance in cosmology. Analytic approximations provide an interpretable solution, yet current approximations are neither fast nor accurate relative to numerical emulators. We use symbolic regression to obtain simple analytic approximations to the nonlinear scale, $k_σ$, the effective spectral index, $n_{\\rm eff}$, and the curvature, $C$, which are required for the halofit model. We then re-optimise the coefficients of halofit to fit a wide range of cosmologies and redshifts. We explore the space of analytic expressions to fit the residuals between $P(k)$ and the optimised predictions of halofit. Our results are designed to match the predictions o
