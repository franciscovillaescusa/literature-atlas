 6, 3\\}$, denoted $P_\\mathrm{ZI}$, reduces marginalized errors for all parameters considered. The improvements range from several-fold for some $Λ$CDM parameters to factors of 290 for local primordial non-Gaussianity and 107 for the summed neutrino mass. Tests on independent fiducial simulations yield nearly unbiased parameter estimates. Compared with other state-of-the-art summary statistics, $P_\\mathrm{ZI}$ provides tighter cosmological constraints.","abx":0,"nw":0,"d":"2025-12-13","dq":0,"y":2025,"au":[700,271,693,516],"c":1,"cs":0,"bib":"2026ApJ..1009..245W","v":"Astrophysical Journal","lk":"arXiv:2512.12304","url":"https://arxiv.org/abs/2512.12304","doi":"10.3847/1538-4357/aea08c","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Quijote-PNG"],"d":["Density fields","Power spectra"],"m":["Fisher forecasts","No ML"],"u":["Fisher derivatives","Massive neutrinos","Quijote-PNG"]},"x":0.2543,"yy":0.4146,"p3":[-0.3475,0.2395,0.1917],"sim":{"k":"e","l":[[4,0.97],[242,0.956],[259,0.951],[263,0.951],[181,0.95]]},"c3":[9.7,68.25,-84.4],"c2":[145.82,3.18],"k":5,"r":[108,111,154,179,228,249,263,264,278,282,291,308,330,331,339],"rm":0},{"id":"2512.09852","t":"Primordial non-Gaussianity -- Fast simulations and persistent summary statistics","ab":"We investigate the sensitivity of topological and traditional summary statistics to primordial non-Gaussianity (PNG) using two suites of simulations. First, we introduce a new simulation suite for PNG, PNG-pmwd, comprising more than $20{,}000$ halo catalogs that vary individually local and equilateral shapes, together with variations in $Ω_m$ and $σ_8$. Second, we carry out a systematic comparison of topological descriptors, as well as powerspectrum and bispectrum measurements, evaluating their constraining power on both local and equilateral $f_{\\rm NL}$ and how this sensitivity varies with halo mass. This dataset enables likelihood-free neural regression of $f_{\\rm NL}$ across multiple halo mass bins for a wide range of summary statistics. Third, we assess the transferability of these learned mappings by testing whether models trained on fast pmwd simulations can robustly infer on simulations from the QuijotePNG suite. We find that a combination of simple descriptive statistics of the topological features (PD-statistics) leads to the best performance to constrain equilateral PNG. We observe that the constraining power of these summaries comes from large-mass halos, with small-mass halos adding noise and degrading performance. Similarly, we find that the transferability of the learned mappings, for both topological and powerspectrum plus bispectrum, degrades if small scales or small-mass halos are included.","abx":0,"nw":0,"d":"2025-12-10","dq":0,"y":2025,"au":[348,248,343,308,251],"c":1,"cs":0,"bib":"2026JCAP...08..051C","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2512.09852","url":"https://arxiv.org/abs/2512.09852","doi":"10.1088/1475-7516/2026/08/051","tg":{"s":["Quijote-PNG","Non-Quijote simulations"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Simulation-based inference","Emulators & regression ML"],"u":["Simulation-based inference"]},"x":0.2951,"yy":0.533,"p3":[-0.7259,0.2742,0.094],"sim":{"k":"e","l":[[181,0.963],[226,0.961],[242,0.955],[257,0.953],[264,0.951]]},"c3":[-26.44,130.18,-40.22],"c2":[167.56,-0.81],"k":5,"r":[76,83,94,102,111,112,116,128,129,140,157,169,176,178,179,181,186,204,226,234,240,245,262,263,264,272,322,331,339],"rm":0},{"id":"2510.19798","t":"Detecting gravitational lensing by matter currents","ab":"We explore the observational prospects for detecting gravitational lensing induced by cosmological matter currents, a relativistic correction to the standard density lensing effect arising from the motion of matter. We propose to isolate this contribution by cross-correlating the weak-lensing convergence field with a reconstructed cosmic momentum field inferred from galaxy redshift surveys. Using numerical simulations, we demonstrate that this reconstructed momentum field is uncorrelated with the density lensing signal, enabling a clean separation of the gravitomagnetic component. We then forecast the detectability of this signal for upcoming wide-field galaxy and weak-lensing surveys, showing that a statistically significant detection may be achievable under realistic observational conditions. Such a measurement would provide the first direct probe of the large-scale cosmic momentum field, offering a novel test of general relativity and Lorentz invariance on cosmological scales.","abx":0,"nw":1,"d":"2025-10-22","dq":0,"y":2025,"au":[111,527,301],"c":1,"cs":0,"bib":"2026A&A...708A..48M","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2510.19798","url":"https://arxiv.org/abs/2510.19798","doi":"10.1051/0004-6361/202557794","tg":{"s":["Quijote (set not stated)"],"d":["Particle snapshots","Weak lensing & 2D maps"],"m":["Fisher forecasts","No ML"],"u":["Fisher forecasts"]},"x":-0.3987,"yy":0.5862,"p3":[-0.3629,-0.3886,-0.512],"sim":{"k":"e","l":[[324,0.926],[56,0.923],[180,0.92],[25,0.918],[329,0.917]]},"c3":[-239.4,31.13,286.84],"c2":[-380.23,98.61],"k":4,"r":[],"rm":0},{"id":"2507.00514","t":"Simulation-Efficient Cosmological Inference with Multi-Fidelity SBI","ab":"The simulation cost for cosmological simulation-based inference can be decreased by combining simulation sets of varying fidelity. We propose an approach to such multi-fidelity inference based on feature matching and knowledge distillation. Our method results in improved posterior quality, particularly for small simulation budgets and difficult inference problems.","abx":0,"nw":1,"d":"2025-07-01","dq":0,"y":2025,"au":[391,21,476],"c":9,"cs":0,"bib":"2025arXiv250700514T","v":"arXiv.org","lk":"arXiv:2507.00514","url":"https://arxiv.org/abs/2507.00514","doi":"10.48550/arXiv.2507.00514","tg":{"s":["Big Sobol Sequence (BSQ)","Non-Quijote simulations"],"d":["Power spectra"],"m":["Simulation-based inference","Normalizing flows"],"u":["Power spectra","Normalizing flows"]},"x":-0.3487,"yy":-0.3241,"p3":[0.4597,-0.2568,0.4904],"sim":{"k":"e","l":[[254,0.943],[127,0.943],[134,0.94],[318,0.94],[142,0.937]]},"c3":[122.13,146.29,82.7],"c2":[253.16,-17.48],"k":7,"r":[99,107,127,208,215,339],"rm":0},{"id":"title:optimalinformationextractionfromcosmologicalsummarystatisticswithneuralnetworks","t":"Optimal information extraction from cosmological summary statistics with neural networks","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[487],"c":0,"cs":2,"bib":"","v":"","lk":"Tesi di Laurea","url":"https://thesis.unipd.it/bitstream/20.500.12608/100499/1/Zuccotti_Nicola.pdf","doi":"","tg":{"s":["Latin hypercube"],"d":["Power spectra","Higher-order statistics"],"m":["Emulators & regression ML"],"u":["Latin hypercube","Power spectra","Higher-order statistics","Emulators & regression ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.3272,"yy":-0.6185,"p3":[0.0332,0.0024,0.5165],"sim":{"k":"w","l":[[217,0.272],[255,0.27],[107,0.224],[131,0.159],[141,0.14]]},"c3":[-22.97,-197.69,286.81],"c2":[-160.83,-327.69],"k":9,"r":[],"rm":1},{"id":"2512.07236","t":"Counting voids and filaments: Betti Curves as a Topological Probe for Cosmology","ab":"Topological analysis of galaxy distributions has gathered increasing attention in cosmology, as they are able to capture non-Gaussian features of large-scale structures (LSS) that are overlooked by conventional two-point clustering statistics. We utilize Betti curves, a summary statistic derived from persistent homology, to characterize the multiscale topological features of the LSS, including connected components, loops, and voids, as a complementary cosmological probe. Using halo catalogs from the \\textsc{Quijote} suite, we construct Betti curves, assess their sensitivity to cosmological parameters, and train automated machine learning based emulators to model their dependence on cosmological parameters. Our Bayesian inference recovers unbiased estimation of cosmological parameters, notably $n_{\\mathrm{s}}$, $σ_8$, and $Ω_{\\mathrm{m}}$, while validation on sub-box simulations confirms robustness against cosmic variance. We further investigate the impact of redshift-space distortions (RSD) on Betti curves and demonstrate that including RSD enhances sensitivity to growth-related parameters. By jointly analyzing Betti curves and the power spectrum, we achieve significantly tightened constraints than using power spectrum alone on parameters such as $n_{\\mathrm{s}}$, $σ_8$, and $w$. These findings highlight Betti curves -- especially when combined with traditional two-point statistics -- as a promising, interpretable tool for future galaxy survey analyses.","abx":0,"nw":0,"d":"2025-12-08","dq":0,"y":2025,"au":[332,126],"c":2,"cs":0,"bib":"2026PhRvD.113l3509L","v":"Physical Review D","lk":"arXiv:2512.07236","url":"https://arxiv.org/abs/2512.07236","doi":"10.1103/1c23-8l95","tg":{"s":["Latin hypercube"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Emulators & regression ML"],"u":["Latin hypercube"]},"x":0.7101,"yy":-0.2126,"p3":[-0.3495,0.8695,0.0238],"sim":{"k":"e","l":[[179,0.963],[111,0.95],[116,0.95],[40,0.946],[39,0.944]]},"c3":[-78.89,173.76,-142.79],"c2":[51.77,166.11],"k":0,"r":[111,116,179,192,253,308,322,334,339],"rm":0},{"id":"2511.14677","t":"Equilateral non-Gaussian Bias at the Field Level","ab":"Primordial non-Gaussianity (PNG) is a common prediction of a wide class of inflationary models. Equilateral-type PNG, generically predicted by single-field inflationary models with higher-derivative interactions, imprints subtle but measurable signatures on the large-scale distribution of matter. An important parameter of these imprints is the PNG-induced bias coefficient $b_ψ$, which quantifies how the abundance and clustering of dark matter halos and galaxies respond to mode coupling in the initial conditions. Measuring $b_ψ$ is important for constraining equilateral PNG, yet it is notoriously challenging due to its degeneracy with Gaussian scale-dependent bias contributions. In this work, we present the first precision measurements of equilateral $b_ψ$ for dark matter halos using effective field theory at the field level. We show that this approach disentangles PNG effects from those of the Gaussian bias by virtue of noise variance cancellation. We compare our results with the phenomenological predictions based on the Peak-Background Split model, finding some agreement at the qualitative level on the redshift and mass dependence, but poor agreement at the quantitative level. We present a fitting formula for $b_ψ$ as a function of the linear bias, which can be used to set priors in PNG searches with ongoing and future galaxy surveys.","abx":0,"nw":0,"d":"2025-11-18","dq":0,"y":2025,"au":[177,309,371,465],"c":4,"cs":0,"bib":"2026PhRvD.114d3510S","v":"","lk":"arXiv:2511.14677","url":"https://arxiv.org/abs/2511.14677","doi":"","tg":{"s":["Quijote-PNG"],"d":["Density fields","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Quijote-PNG","Density fields"]},"x":0.305,"yy":0.7758,"p3":[-0.6453,-0.037,-0.1532],"sim":{"k":"e","l":[[12,0.943],[133,0.942],[257,0.939],[203,0.936],[144,0.933]]},"c3":[37.61,-169.21,-8.25],"c2":[80.8,-188.15],"k":5,"r":[90,106,121,133,146,161,193,226,253,257,339],"rm":0},{"id":"title:disentanglingmassiveneutrinocosmologieswithhigherorderclusteringstatistics","t":"Disentangling Massive Neutrino Cosmologies with Higher-Order Clustering Statistics","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[53],"c":0,"cs":2,"bib":"","v":"","lk":"Graduation thesis","url":"https://amslaurea.unibo.it/id/eprint/36850/1/Labate_MT_final.pdf","doi":"","tg":{"s":["Massive neutrinos"],"d":["Halo catalogs","Higher-order statistics"],"m":["No ML"],"u":["Massive neutrinos","Halo catalogs","Higher-order statistics","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.0686,"yy":0.1613,"p3":[-0.238,-0.0933,-0.513],"sim":{"k":"w","l":[[61,0.173],[326,0.154],[337,0.148],[109,0.134],[323,0.132]]},"c3":[112.45,-147.75,293.24],"c2":[145.78,-356.44],"k":8,"r":[],"rm":1},{"id":"2511.13393","t":"Learning Cosmology from Nearest Neighbour Statistics","ab":"Extracting cosmological parameters from galaxy/halo catalogues with sub-percent level accuracy is an important aspect of modern cosmology, especially in view of ongoing and upcoming surveys such as Euclid, DESI, and LSST. While traditional two-point statistics have been known to be suboptimal for this task, recently proposed k-Nearest Neighbour (kNN) based summary statistics have demonstrated tighter constraining power. Building on the kNN statistics, we introduce a new field-level representation of discrete halo catalogues - NN distance maps. We employ this technique on the halo catalogues obtained from Quijote N-body simulation suites. By combining these maps with kNN-based summary statistics, we train a hybrid neural network to infer cosmological parameters, showing that the resulting constraints achieve state-of-the-art, if not the best, accuracy. In addition, our hybrid framework is 5-10 times more computationally efficient than some of the existing point-cloud-based ML methods.","abx":0,"nw":0,"d":"2025-11-17","dq":0,"y":2025,"au":[80,73,240,631],"c":2,"cs":0,"bib":"2026A&A...711A..53C","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2511.13393","url":"https://arxiv.org/abs/2511.13393","doi":"10.1051/0004-6361/202558143","tg":{"s":["Latin hypercube"],"d":["Halo catalogs","Higher-order statistics"],"m":["CNN","Emulators & regression ML"],"u":["Latin hypercube","CNN"]},"x":-0.2586,"yy":-0.5766,"p3":[0.4163,0.407,0.0839],"sim":{"k":"e","l":[[169,0.944],[185,0.94],[92,0.939],[111,0.938],[177,0.935]]},"c3":[-97.71,123.76,-96.06],"c2":[54.04,78.13],"k":7,"r":[83,94,102,112,169,173,185,189,204,211,247,255,272,275,279,280,284,291,295,304,308,309,310,316,319,322,333,334,336,339],"rm":0},{"id":"2511.09945","t":"Slow neutrinos: non-linearity and momentum-space emulation","ab":"Recent cosmological bounds on the sum of neutrino masses, M_nu = sum m_nu, are in tension with laboratory oscillation experiments, making cosmological tests of neutrino free-streaming imperative. In order to study the scale-dependent clustering of massive neutrinos, we develop a fast linear response method, FAST-nu f, applicable to neutrinos and other non-relativistic hot dark matter. Using it as an accurate linear approximation to help us reduce the dynamic range of emulator training data, based upon a non-linear perturbation theory for massive neutrinos, we improve the emulator's accuracy at small M_nu and length scales by a factor of two. We significantly sharpen its momentum resolution for the slowest neutrinos, which, despite their small mass fraction, dominate small-scale clustering. Furthermore, we extend the emulator from the degenerate to the normal and inverted mass orderings. Applying this new emulator, Cosmic-Enu-II, to large halos in N-body simulations, we show that non-linear perturbation theory can reproduce the neutrino density profile in the halo outskirts, 2R_vir < r < 10R_vir , to better than 10%.","abx":0,"nw":0,"d":"2025-11-13","dq":0,"y":2025,"au":[48,684],"c":1,"cs":0,"bib":"2026MNRAS.547ag382U","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2511.09945","url":"https://arxiv.org/abs/2511.09945","doi":"10.1093/mnras/stag382","tg":{"s":["Massive neutrinos"],"d":["Particle snapshots","Halo catalogs"],"m":["Emulators & regression ML","Perturbation theory & analytic models"],"u":["Massive neutrinos","Particle snapshots","Halo catalogs"]},"x":-0.4074,"yy":0.4339,"p3":[-0.1446,-0.2392,-0.7333],"sim":{"k":"e","l":[[324,0.945],[109,0.944],[329,0.944],[299,0.941],[115,0.939]]},"c3":[9.37,-121.76,-14.68],"c2":[-151.72,-55.04],"k":4,"r":[339],"rm":0},{"id":"title:probingcosmicwebstructureswithgenerativemodels","t":"Probing cosmic web structures with generative models","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[457,634,6],"c":0,"cs":2,"bib":"","v":"","lk":"article","url":"https://sf2a.eu/proceedings/2025/2025sf2a.conf.211N.pdf","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields"],"m":["Generative models"],"u":["Quijote (set not stated)","Density fields","Generative models"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.3988,"yy":-0.1232,"p3":[-0.0045,0.6183,-0.0464],"sim":{"k":"w","l":[[321,0.363],[235,0.343],[16,0.238],[108,0.212],[44,0.164]]},"c3":[115.33,12.85,325.13],"c2":[307.37,-239.37],"k":8,"r":[],"rm":1},{"id":"2511.03636","t":"Quantifying Weighted Morphological Content of Large-Scale Structures via Simulation-Based Inference","ab":"We perform a simulation-based forecasting analysis to compare the cosmological constraining power of higher-order summary statistics of the large-scale structure, the Minkowski Functionals (MFs) and a class weighted morphological measure known as the Conditional Moments of Derivatives (CMD), with that of the redshift-space halo power spectrum multipoles (PS), with a particular focus on their sensitivity to nonlinear and anisotropic features in redshift space. Our analysis relies on halo catalogs from the Big Sobol Sequence simulations at redshift $z=0.5$, employing a likelihood-free inference framework implemented via neural posterior estimation. At the fiducial Quijote cosmology and for a Gaussian smoothing scale of $R=15\\,h^{-1}\\mathrm{Mpc}$, CMD provide systematically tighter constraints than MFs. Combining MFs and CMD into a joint estimator improves the precision by $27\\%^{+9\\%}_{-5\\%}$ for $σ_8$ and $26\\%^{+7\\%}_{-5\\%}$ for $Ω_{\\mathrm{m}}$ relative to MFs alone, highlighting the complementary anisotropy-sensitive information captured by the CMD in contrast to the scalar morphological content encapsulated by the MFs. We compare the combined statistic MFs+CMD with the PS at matched effective scales ($k_{\\max}\\simeq0.16\\,h\\,\\mathrm{Mpc^{-1}}$) under three halo-selection conditions: all halos, fixed number density, and mass-selected ($M>3\\times10^{13}\\,h^{-1}M_\\odot$). In the mass-selected configuration, the (weighted) morphological estimator outperforms the power spectrum by $45\\%^{+20\\%}_{-9\\%}$ for $σ_8$ and $43\\%^{+10\\%}_{-7\\%}$ for $Ω_{\\mathrm{m}}$. We also extend the simulation-based forecast analysis across a continuous range of cosmological parameters and multiple smoothing scales for morphological measures.","abx":0,"nw":0,"d":"2025-11-05","dq":0,"y":2025,"au":[415,559],"c":3,"cs":0,"bib":"2026PhRvD.113f3543J","v":"Physical Review D","lk":"arXiv:2511.03636","url":"https://arxiv.org/abs/2511.03636","doi":"10.1103/yw4d-vssh","tg":{"s":["Fiducial","Big Sobol Sequence (BSQ)"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Simulation-based inference"],"u":["Fiducial"]},"x":0.4361,"yy":0.3964,"p3":[-0.4705,0.4339,-0.0782],"sim":{"k":"e","l":[[226,0.943],[47,0.941],[242,0.939],[46,0.939],[26,0.938]]},"c3":[131.5,220.32,-30.49],"c2":[253.17,179.69],"k":3,"r":[107,118,140,142,176,179,186,192,201,205,213,234,249,251,262,272,275,291,293,339],"rm":0},{"id":"2510.20086","t":"MG-NECOLA: Fast Neural Emulators for Modified Gravity Cosmologies","ab":"Observations of the large-scale structure (LSS) provide a powerful test of gravity on cosmological scales, but high-resolution N-body simulations of modified gravity (MG) are prohibitively expensive. We present MG-NECOLA, a convolutional neural network that enhances fast MG-PICOLA simulations to near-N-body fidelity at a fraction of the cost. MG-NECOLA reproduces QUIJOTE-MG N-body results in the power spectrum and bispectrum with better than 1% accuracy down to non-linear scales ($k \\simeq 1~h~\\mathrm{Mpc}^{-1}$), while reducing computational time by several orders of magnitude. Importantly, although trained only on $f(R)$ models with massless neutrinos, the network generalizes robustly to scenarios with massive neutrinos, preserving accuracy to within 5% at non-linear scales. This combination of precision and robustness establishes MG-NECOLA as a practical emulator for producing large ensembles of high-fidelity simulations, enabling efficient exploration of modified gravity and beyond-$Λ$CDM cosmologies in upcoming surveys.","abx":0,"nw":0,"d":"2025-10-23","dq":0,"y":2025,"au":[296,450,199,240,481,150],"c":1,"cs":0,"bib":"2025arXiv251020086B","v":"","lk":"arXiv:2510.20086","url":"https://arxiv.org/abs/2510.20086","doi":"","tg":{"s":["Massive neutrinos","Quijote-MG","Non-Quijote simulations"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["CNN","Emulators & regression ML"],"u":["Massive neutrinos","Emulators & regression ML"]},"x":-0.1022,"yy":-0.4457,"p3":[0.2082,0.251,0.5541],"sim":{"k":"e","l":[[36,0.983],[286,0.952],[62,0.947],[260,0.945],[313,0.945]]},"c3":[-118.82,-18.83,-77.72],"c2":[-75.66,41.39],"k":1,"r":[286,313,339],"rm":0},{"id":"2510.19168","t":"Transfer Learning Beyond the Standard Model","ab":"Machine learning enables powerful cosmological inference but typically requires many high-fidelity simulations covering many cosmological models. Transfer learning offers a way to reduce the simulation cost by reusing knowledge across models. We show that pre-training on the standard model of cosmology, $Λ$CDM, and fine-tuning on various beyond-$Λ$CDM scenarios -- including massive neutrinos, modified gravity, and primordial non-Gaussianities -- can enable inference with significantly fewer beyond-$Λ$CDM simulations. However, we also show that negative transfer can occur when strong physical degeneracies exist between $Λ$CDM and beyond-$Λ$CDM parameters. We consider various transfer architectures, finding that including bottleneck structures provides the best performance. Our findings illustrate the opportunities and pitfalls of foundation-model approaches in physics: pre-training can accelerate inference, but may also hinder learning new physics.","abx":0,"nw":0,"d":"2025-10-22","dq":0,"y":2025,"au":[643,21,134,514],"c":5,"cs":0,"bib":"2026JCAP...06..026K","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2510.19168","url":"https://arxiv.org/abs/2510.19168","doi":"10.1088/1475-7516/2026/06/026","tg":{"s":["Latin hypercube","Massive neutrinos","Quijote-PNG","Quijote-MG"],"d":["Density fields"],"m":["CNN","Simulation-based inference","Other ML"],"u":["Latin hypercube","Density fields","CNN","Simulation-based inference"]},"x":-0.2748,"yy":-0.7228,"p3":[0.3992,0.3078,0.7133],"sim":{"k":"e","l":[[313,0.939],[127,0.933],[74,0.932],[60,0.931],[325,0.93]]},"c3":[-55.38,104.49,-78.74],"c2":[29.19,89.64],"k":1,"r":[65,264,292,308,331,339],"rm":0},{"id":"2510.12715","t":"Hierarchical summaries for primordial non-Gaussianities","ab":"The advent of Stage IV galaxy redshift surveys such as DESI and Euclid marks the beginning of an era of precision cosmology, with one key objective being the detection of primordial non-Gaussianities (PNG), potential signatures of inflationary physics. In particular, constraining the amplitude of local-type PNG, parameterised by $f_{\\rm NL}$, with $σ_{f_{\\rm NL}} \\sim 1$, would provide a critical test of single versus multi-field inflation scenarios. While current large-scale structure and cosmic microwave background analyses have achieved $σ_{f_{\\rm NL}} \\sim 5$-$9$, further improvements demand novel data compression strategies. We propose a hybrid estimator that hierarchically combines standard $2$-point and $3$-point statistics with a field-level neural summary, motivated by recent theoretical work that shows that such a combination is nearly optimal, disentangling primordial from late-time non-Gaussianity. We employ PatchNet, a convolutional neural network that extracts small-scale information from sub-volumes (patches) of the halo number density field while large-scale information is retained via the power spectrum and bispectrum. Using Quijote-PNG simulations, we evaluate the Fisher information of this combined estimator across various redshifts, halo mass cuts, and scale cuts. Our results demonstrate that the inclusion of patch-based field-level compression always enhances constraints on $f_{\\rm NL}$, reaching gains of $30$-$45\\%$ at low $k_{\\rm max}$ ($\\sim 0.1 \\, h \\, \\text{Mpc}^{-1}$), and capturing information beyond the bispectrum. This approach offers a computationally efficient and scalable pathway to tighten the PNG constraints from forthcoming survey data.","abx":0,"nw":0,"d":"2025-10-14","dq":0,"y":2025,"au":[433,62,95],"c":2,"cs":0,"bib":"2026A&A...710A..12C","v":"","lk":"arXiv:2510.12715","url":"https://arxiv.org/abs/2510.12715","doi":"10.1051/0004-6361/202557858","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics"],"m":["CNN","Fisher forecasts"],"u":["Fiducial","Fisher derivatives"]},"x":0.3079,"yy":0.6318,"p3":[-0.4022,0.0139,0.156],"sim":{"k":"e","l":[[46,0.954],[144,0.953],[203,0.949],[36,0.949],[200,0.947]]},"c3":[-97.41,-71.97,0.47],"c2":[93.1,-168.1],"k":5,"r":[107,141,181,204,226,242,257,264,266,339],"rm":0},{"id":"title:constrainingcosmologywithhigherordersummarystatisticsofgalaxiesabispectrum3pcfst","t":"Constraining cosmology with higher-order summary statistics of galaxies: a bispectrum & 3PCF study and application to DESI DR1","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[223],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://www.proquest.com/openview/303368a68f0ad0b1650bd1a3c451df83/1?pq-origsite=gscholar&cbl=18750&diss=y","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Quijote (set not stated)","Non-Quijote simulations","Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space","Perturbation theory & analytic models","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.1879,"yy":-0.3337,"p3":[-0.173,-0.4675,0.0211],"sim":{"k":"w","l":[[20,0.171],[90,0.162],[69,0.123],[19,0.118],[136,0.117]]},"c3":[174.33,-77.7,289.15],"c2":[202.72,-327.92],"k":0,"r":[],"rm":1},{"id":"2510.08573","t":"Reconstructing the local density field with combined convolutional and point cloud architecture","ab":"We construct a neural network to perform regression on the local dark-matter density field given line-of-sight peculiar velocities of dark-matter halos, biased tracers of the dark matter field. Our architecture combines a convolutional U-Net with a point-cloud DeepSets. This combination enables efficient use of small-scale information and improves reconstruction quality relative to a U-Net-only approach. Specifically, our hybrid network recovers both clustering amplitudes and phases better than the U-Net on small scales.","abx":0,"nw":0,"d":"2025-10-09","dq":0,"y":2025,"au":[90,482,391],"c":0,"cs":0,"bib":"2025arXiv251008573B","v":"arXiv.org","lk":"arXiv:2510.08573","url":"https://arxiv.org/abs/2510.08573","doi":"10.48550/arXiv.2510.08573","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Halo catalogs"],"m":["CNN","Other ML"],"u":[]},"x":-0.3238,"yy":-0.5206,"p3":[0.1978,0.3555,0.6949],"sim":{"k":"e","l":[[169,0.944],[175,0.939],[313,0.938],[110,0.938],[222,0.937]]},"c3":[-86.86,-28.36,84.0],"c2":[-168.15,39.94],"k":1,"r":[339],"rm":0},{"id":"2510.07375","t":"Control variates from Eulerian and Lagrangian perturbation theory: Application to the bispectrum","ab":"Control variates have seen recent interest as a powerful technique to reduce the variance of summary statistics measured from costly cosmological $N$-body simulations. Of particular interest are the class of control variates which are analytically calculable, such as the recently introduced 'Zeldovich control variates' for the power spectrum of matter and biased tracers. In this work we present the construction of perturbative control variates in Eulerian and Lagrangian perturbation theory, and adopt the matter bispectrum as a case study. Eulerian control variates are analytically tractable for all $n$-point functions, but we show that their correlation with the $N$-body $n$-point function decays at a rate proportional to the sum-of-squared wavenumbers, hampering their utility. We show that the Zeldovich approximation, while possessing an analytically calculable bispectrum, is less correlated at low-$k$ than its Eulerian counterpart. We introduce an alternative -- the 'shifted control variate' -- which can be constructed to have the correct tree-level $n$-point function, is Zeldovich-resummed, and in principle has an analytically tractable bispectrum. We find that applying this shifted control variate to the $z=0.5$ matter bispectrum is equivalent to averaging over $10^4$ simulations for the lowest-$k$ triangles considered. With a single $V=1({\\rm Gpc}/h)^3$ $N$-body simulation, for a binning scheme with $N\\approx 1400$ triangles from $k_{\\rm min} = 0.04 h {\\rm Mpc}^{-1}$ to $k_{\\rm \\max} = 0.47 h {\\rm Mpc}^{-1}$, we obtain sub-2% precision for every triangle configuration measured. This work enables the development of accurate bispectrum emulators -- a probe of cosmology well-suited to simulation-based modeling -- and lays the theoretical groundwork to extend control variates for the entire $n$-point hierarchy.","abx":0,"nw":0,"d":"2025-10-08","dq":0,"y":2025,"au":[484,578],"c":2,"cs":0,"bib":"2026OJAp....962533K","v":"The Open Journal of Astrophysics","lk":"arXiv:2510.07375","url":"https://arxiv.org/abs/2510.07375","doi":"10.33232/001c.162533","tg":{"s":["Fiducial"],"d":["Density fields","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":-0.6513,"yy":0.3397,"p3":[0.3547,-0.3192,-0.4181],"sim":{"k":"e","l":[[296,0.95],[328,0.94],[276,0.94],[87,0.939],[264,0.938]]},"c3":[43.84,-114.18,-85.21],"c2":[5.18,-119.05],"k":2,"r":[90,173,274,276,300,318,339],"rm":0},{"id":"2509.15223","t":"Parameter sensitivity of cosmic pairwise velocities in the non-linear regime of structure formation","ab":"The peculiar velocities of dark matter tracers drive the growth of cosmic structures, providing a sensitive test of cosmological models and strengthening constraints on the nature of dark energy. In this work, we investigate the mean pairwise velocities, $v_{12}$, of dark matter tracers as a cosmological probe in the non-linear regime of cosmic structure formation. Using N-body dark matter-only simulations, we measure $v_{12}$ for pair separations up to 50 $h^{-1}$Mpc and model it by solving the pair conservation equation for a self-gravitating particle system, along with various prescriptions of the nonlinear matter power spectrum. We quantified the sensitivity of $v_{12}$ to variations in key cosmological parameters such as $Ω_{\\mathrm{m}}$, $σ_8$, $h$, $M_ν$, and $w$. Our parameter inference analysis using MCMC shows sub-11% agreement with simulation data, with notable degeneracies, particularly between $Ω_\\mathrm{m}$ and $σ_8$. We further compute the stable clustering crossing scale across redshifts $z=0$, $0.5$, and $1$, assessing its dependence on cosmology. Among the tested power spectrum modeling approaches, we find that the CSSTEmu emulator provides the most accurate predictions, with deviations below 5% for $r > 10$ $h^{-1}$Mpc at $z=0.5$. Our results are validated using independent simulation suites, demonstrating that our framework offers a robust method for extracting cosmological constraints from upcoming peculiar velocity data.","abx":0,"nw":0,"d":"2025-09-18","dq":0,"y":2025,"au":[342,283],"c":1,"cs":0,"bib":"2026PhRvD.113j3519G","v":"","lk":"arXiv:2509.15223","url":"https://arxiv.org/abs/2509.15223","doi":"","tg":{"s":["Fisher derivatives","Massive neutrinos","Non-Quijote simulations"],"d":["Particle snapshots","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fisher derivatives","Massive neutrinos","Non-Quijote simulations","Halo catalogs","Particle snapshots"]},"x":0.4049,"yy":-0.2877,"p3":[0.6342,-0.0687,-0.5379],"sim":{"k":"e","l":[[13,0.945],[310,0.937],[307,0.935],[18,0.935],[322,0.933]]},"c3":[-21.29,-35.01,91.91],"c2":[-140.74,-35.31],"k":0,"r":[339],"rm":0},{"id":"2509.13207","t":"Parity in Composite-Field Galaxy Correlators","ab":"Detecting parity violation on cosmological scales would provide a striking clue to new physics. Large-scale structure offers the raw statistical power -- many three-dimensional modes -- to make such tests. However, for scalar observables, like galaxy clustering, the leading parity-sensitive observable is the trispectrum, whose high dimensionality makes the measurement and noise estimation challenging. We present two late-time parity-odd kurto spectra that compress the parity-odd scalar trispectrum into one-dimensional, power-spectrum-like observables. They are built by correlating (i) two appropriately weighted quadratic composite fields, or (ii) a linear and cubic composite field, constructed from dark matter (DM) or galaxy overdensity fields. We develop an FFTLog pipeline for efficient theoretical predictions of the two observables. We then validate the estimators for a specific parity-odd primordial template on perturbative DM field, and on DM and halo fields in full N-body \\texttt{Quijote} simulations, with and without parity-odd initial conditions, in real and redshift space. For DM, the variance is dominated by the parity-even contribution -- i.e., the gravitationally induced parity-even trispectrum -- and is efficiently suppressed by phase-matched fiducial subtraction. For halos, discreteness-driven stochasticity dominates and is not appreciably reduced by subtraction; however, optimal weighting and halo-matter cross kurto spectra considerably mitigate this noise and enhance the signal. Using controlled down-sampling of the matter field, we empirically calibrate how the parity-even variance scales with number density and volume, and provide an illustrative forecast for the detectability of parity-odd kurto spectra in a Euclid-like spectroscopic galaxy survey.","abx":0,"nw":0,"d":"2025-09-16","dq":0,"y":2025,"au":[716,84,717],"c":8,"cs":0,"bib":"2026JCAP...03..027G","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2509.13207","url":"https://arxiv.org/abs/2509.13207","doi":"10.1088/1475-7516/2026/03/027","tg":{"s":["Fiducial","Quijote-Odd (parity-violating)","Non-Quijote simulations"],"d":["Density fields","Halo catalogs","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Non-Quijote simulations","Quijote-Odd (parity-violating)","Fiducial"]},"x":0.1456,"yy":0.9975,"p3":[-0.7679,0.278,0.0633],"sim":{"k":"e","l":[[221,0.953],[7,0.95],[242,0.931],[264,0.931],[181,0.929]]},"c3":[149.61,-24.3,-85.17],"c2":[180.17,9.42],"k":5,"r":[186,221,245,294,339],"rm":0},{"id":"2509.08884","t":"Extracting the Alcock-Paczynski signal from voids: A novel approach via reconstruction","ab":"The void galaxy cross correlation function is a powerful tool to extract cosmological information. Through the void galaxy cross correlation function, cosmic voids, the underdense regions in the galaxy distribution, are used for refined deductions of the Universe's content by correcting apparent geometric distortions. This study proposes a novel procedure for optimally extracting the Alcock Paczynski, AP, signal from cosmic voids through a cosmological reconstruction technique. Employing cosmological reconstruction, specifically using the Zel'dovich approximation, we estimate the true positions of galaxies from their redshift space locations, reducing distortions introduced by peculiar velocities. Unlike previous analyses, we identify voids and measure the void galaxy cross correlation function directly in reconstructed space. This approach enables us, for the first time, to include in our analysis small nonlinear voids, typically discarded in previous studies, thus enhancing the statistical power of void studies and significantly improving their cosmological constraining power. Reconstruction is particularly effective even at small scales for voids, due to their clean and dynamically simple environment. This ability to recover information encoded on small scales significantly enhances the precision of the analysis, leading to a 23 % improvement in the constraints on the AP parameters compared to previous methods where the analysis is performed in redshift space and, consequently, to a better estimate of the derived cosmological parameters. Our analysis also includes a comprehensive set of consistency checks, demonstrating its robustness. We expect this methodology to yield a substantial gain in constraining power when applied to data from modern large scale structure surveys.","abx":0,"nw":0,"d":"2025-09-10","dq":0,"y":2025,"au":[259,193,411,211,43,267],"c":7,"cs":0,"bib":"2026A&A...706A.286D","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2509.08884","url":"https://arxiv.org/abs/2509.08884","doi":"10.1051/0004-6361/202557310","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Void catalogs","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Halo catalogs"]},"x":0.3708,"yy":-0.6613,"p3":[-0.0268,-0.6228,0.1087],"sim":{"k":"e","l":[[297,0.952],[57,0.951],[240,0.949],[165,0.947],[113,0.945]]},"c3":[-19.1,61.14,163.52],"c2":[-67.71,-145.66],"k":9,"r":[92,165,339],"rm":0},{"id":"2509.03165","t":"PatchNet: A hierarchical approach for neural field-level inference from Quijote Simulations","ab":"\\textit{What is the cosmological information content of a cubic Gigaparsec of dark matter? } Extracting cosmological information from the non-linear matter distribution has high potential to tighten parameter constraints in the era of next-generation surveys such as Euclid, DESI, and the Vera Rubin Observatory. Traditional approaches relying on summary statistics like the power spectrum and bispectrum, though analytically tractable, fail to capture the full non-Gaussian and non-linear structure of the density field. Simulation-Based Inference (SBI) provides a powerful alternative by learning directly from forward-modeled simulations. In this work, we apply SBI to the \\textit{Quijote} dark matter simulations and introduce a hierarchical method that integrates small-scale information from field sub-volumes or \\textit{patches} with large-scale statistics such as power spectrum and bispectrum. This hybrid strategy is efficient both computationally and in terms of the amount of training data required. It overcomes the memory limitations associated with full-field training. We show that our approach enhances Fisher information relative to analytical summaries and matches that of a very different approach (wavelet-based statistics), providing evidence that we are estimating the full information content of the dark matter density field at the resolution of $\\sim 7.8~\\mathrm{Mpc}/h$.","abx":0,"nw":0,"d":"2025-09-03","dq":0,"y":2025,"au":[62,95],"c":5,"cs":0,"bib":"2026JCAP...03..028B","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2509.03165","url":"https://arxiv.org/abs/2509.03165","doi":"10.1088/1475-7516/2026/03/028","tg":{"s":["Fiducial","Latin hypercube","Fisher derivatives"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["CNN","Simulation-based inference"],"u":["Latin hypercube","Fiducial","Fisher derivatives"]},"x":-0.2834,"yy":-0.3096,"p3":[0.3837,0.2338,0.5517],"sim":{"k":"e","l":[[110,0.95],[107,0.948],[332,0.948],[137,0.947],[208,0.945]]},"c3":[112.84,90.83,-40.9],"c2":[236.81,-1.5],"k":1,"r":[107,181,199,208,227,262,272,291,312,339],"rm":0},{"id":"2508.21182","t":"The Impact of Spectroscopic Redshift Errors on Cosmological Measurements","ab":"Spectroscopic redshift errors, including redshift uncertainty and catastrophic failures, can bias cosmological measurements from galaxy redshift surveys at sub-percent level. In this work, we investigate their impact on the full-shape analysis using contaminated mock catalogs. We find that redshift uncertainty introduces a scale-dependent damping effect on the power spectrum, which is absorbed by counterterms in clustering model, keeping parameter biases below $5\\%$. Catastrophic failures suppress the power spectrum amplitude by an approximately constant factor that scales with the catastrophic rate $f_c$. While this effect is negligible for DESI galaxy populations ($f_c=1\\%$), the slitless-like errors, combining redshift uncertainty with $f_c=5\\%$ catastrophics, introduce significant biases in cosmological constraints. In this case, we observe $6\\%$ to $16\\%$ shifts ($\\sim2.2σ$ level) in estimating the fractional growth rate $df\\equiv f/f^{\\rm{fid}}$ and the log primordial amplitude $\\ln(10^{10} A_{s})$. Applying the correction factor $(1-f_c)^2$ on the galaxy power spectrum mitigates the bias but weakens the parameter constraints due to new degeneracies. Alternatively, fixing $f_c$ to its expected value restores the constraining power with a modest bias of $1.0σ$. Our results indicate that for space-based slitless surveys such as \\textit{Euclid}, at minimum accurate estimation of $f_c$ and its incorporation into the clustering model are essential to get unbiased cosmological inference. Extending to evolving dark energy and massive neutrino cosmologies, redshift errors do not bias the dark energy properties parametrized by $w_0$ and $w_a$, but can degrade constraints on the summed neutrino mass $\\sum m_ν$ by up to 80% in the worst case.","abx":0,"nw":0,"d":"2025-08-28","dq":0,"y":2025,"au":[577,330,66,158,317,126,214,327],"c":2,"cs":0,"bib":"2026JCAP...02..040H","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2508.21182","url":"https://arxiv.org/abs/2508.21182","doi":"10.1088/1475-7516/2026/02/040","tg":{"s":["Quijote (set not stated)"],"d":["Galaxy mocks (HOD)","Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Galaxy mocks (HOD)"]},"x":-0.4389,"yy":-0.1338,"p3":[-0.1658,0.0125,-0.1146],"sim":{"k":"e","l":[[103,0.937],[203,0.93],[61,0.93],[90,0.93],[223,0.93]]},"c3":[51.84,-83.7,-143.9],"c2":[-60.01,66.66],"k":0,"r":[253,339],"rm":0},{"id":"2508.16990","t":"Score Matching on Large Geometric Graphs for Cosmology Generation","ab":"Generative models are a promising tool to produce cosmological simulations but face significant challenges in scalability, physical consistency, and adherence to domain symmetries, limiting their utility as alternatives to $N$-body simulations. To address these limitations, we introduce a score-based generative model with an equivariant graph neural network that simulates gravitational clustering of galaxies across cosmologies starting from an informed prior, respects periodic boundaries, and scales to full galaxy counts in simulations. A novel topology-aware noise schedule, crucial for large geometric graphs, is introduced. The proposed equivariant score-based model successfully generates full-scale cosmological point clouds of up to 600,000 halos, respects periodicity and a uniform prior, and outperforms existing diffusion models in capturing clustering statistics while offering significant computational advantages. This work advances cosmology by introducing a generative model designed to closely resemble the underlying gravitational clustering of structure formation, moving closer to physically realistic and efficient simulators for the evolution of large-scale structures in the universe.","abx":0,"nw":0,"d":"2025-08-23","dq":0,"y":2025,"au":[175,696,336,651],"c":2,"cs":0,"bib":"2025arXiv250816990O","v":"IFIP Working Conference on Database Semantics","lk":"arXiv:2508.16990","url":"https://arxiv.org/abs/2508.16990","doi":"10.48550/arXiv.2508.16990","tg":{"s":["Latin hypercube"],"d":["Halo catalogs"],"m":["Graph neural networks","Generative models"],"u":["Latin hypercube"]},"x":-0.453,"yy":-0.7611,"p3":[0.111,-0.3128,0.8055],"sim":{"k":"e","l":[[131,0.943],[189,0.939],[16,0.937],[52,0.935],[145,0.935]]},"c3":[-68.69,155.13,67.11],"c2":[-28.52,108.74],"k":9,"r":[189,255,339],"rm":0},{"id":"title:themassandclusteringofdynamicalhalos","t":"The Mass and Clustering of Dynamical Halos","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[195],"c":0,"cs":2,"bib":"","v":"","lk":"PhD Thesis","url":"https://www.proquest.com/openview/3b068f7e77a42877eb17ab419ce70dae/1?pq-origsite=gscholar&cbl=18750&diss=y","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs"],"m":["No ML"],"u":["Quijote (set not stated)","Halo catalogs","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.0264,"yy":-0.1497,"p3":[-0.1346,-0.2113,-0.023],"sim":{"k":"w","l":[[255,0.162],[1,0.16],[170,0.069],[126,0.064],[206,0.064]]},"c3":[-162.96,98.83,288.24],"c2":[-351.47,59.01],"k":9,"r":[],"rm":1},{"id":"2508.06762","t":"Power Spectrum, Bispectrum, 2- and 3-Point Correlation Function, and Beyond","ab":"N-Point Correlation Functions, usually with N = 2, 3, and their Fourier-space analogs power spectrum and bispectrum, are major tools used in cosmology to capture the clustering of large-scale structure. We outline how the clustering these functions capture emerges, explain that inflation produces a 2PCF or power spectrum but that subsequent evolution eventually produces a 3PCF or bispectrum, and beyond (and that inflation may do so as well at some level). Furthermore, in principle the Universe also has a 4PCF or trispectrum, and even clustering beyond. For each of these tools, we discuss the motivation, the practical details of how they are estimated, the current algorithms used to compute them, the theory behind them, and recent applications to data. Throughout, we focus on positioning the reader to find and apply these algorithms with some understanding, linking to public code for each algorithm to the fullest extent possible.","abx":0,"nw":0,"d":"2025-08-09","dq":0,"y":2025,"au":[706,223,31],"c":3,"cs":0,"bib":"2025arXiv250806762S","v":"","lk":"arXiv:2508.06762","url":"https://arxiv.org/abs/2508.06762","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["No ML","Perturbation theory & analytic models"]},"x":0.109,"yy":0.2494,"p3":[0.2762,0.0543,-0.339],"sim":{"k":"e","l":[[32,0.949],[15,0.944],[319,0.942],[312,0.942],[328,0.94]]},"c3":[113.84,-117.98,-196.22],"c2":[173.46,123.78],"k":2,"r":[201,221,223,232,253,276,285,294,299,304,309,319,324,336,339],"rm":0},{"id":"2508.06759","t":"From Theory to Forecast: Neutrino Mass Effects on Mode-Coupling Kernels and Their Observational Implications","ab":"We present an analytical expression that gives both the matter and tracer (halo or galaxy) power spectrum with 1-loop corrections that include the neutrino effects on the mode coupling kernels. We use the FFTLog algorithm to accelerate calculating the higher-order corrections to the power spectrum. We then use our power spectrum and bispectrum models to pursue two main goals. First, we examine the impact of neutrino mass on cosmological parameter estimation from both the power spectrum and bispectrum in real space. We create 1-loop power spectrum and bispectrum templates in real-space and fit to the \\texttt{Quijote} simulation suite, including the cross-covariance between the power spectrum and the bispectrum. We show the neutrino signature kernels estimate the same cosmological parameters as the model with the SPT (Standard Perturbation Theory) kernels, even for DESI Year 5 volume, except for the galaxy bias parameters inferred from the bispectrum. Second, we investigate to what extent the bispectrum can improve parameter constraints. We perform a Fisher forecast using the power spectrum, the tree-level bispectrum, and a joint analysis that includes the cross-covariance between them. We show that including the bispectrum can substantially reduce the error bars on key parameters. For the neutrino mass in particular, the uncertainty is reduced by $\\sim 20\\%$","abx":0,"nw":0,"d":"2025-08-09","dq":0,"y":2025,"au":[223,706],"c":1,"cs":0,"bib":"2026PhRvD.113j3538K","v":"","lk":"arXiv:2508.06759","url":"https://arxiv.org/abs/2508.06759","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Fisher derivatives","Halo catalogs"]},"x":0.2167,"yy":0.1513,"p3":[-0.1905,0.0822,-0.732],"sim":{"k":"e","l":[[336,0.947],[334,0.943],[299,0.938],[4,0.938],[249,0.938]]},"c3":[128.61,-77.34,-187.75],"c2":[121.26,128.31],"k":5,"r":[201,223,253,285,299,324,336,339],"rm":0},{"id":"2508.01855","t":"$\\texttt{GENGARS}$: Accurate non-Gaussian initial conditions with arbitrary bispectrum for N-body simulations","ab":"Primordial non-Gaussianity is predicted by various inflationary models, and N-body simulations are a crucial tool for studying its imprints on large-scale structure. In this work, we present \\texttt{GENGARS} ( GEnerator of Non-Gaussian ARbitrary Shapes), a framework for generating accurate non-Gaussian initial conditions for N-body simulations. It builds upon the formulation introduced by Wagner \\& Verde (2012), enabling to generate a primordial gravitational potential with a desired separable bispectrum $B_Φ(k_1,k_2,k_3)$. For the local, equilateral and orthogonal non-Gaussian templates, we benchmark our method against the well-established \\texttt{2LPT-PNG} code. We show that \\texttt{GENGARS} achieves improved accuracy and lower noise by suppressing spurious contributions to the primordial power spectrum. This paper aims at presenting the method, quantifying its performance and illustrating the benefits and applicable use cases over existing approaches.","abx":0,"nw":0,"d":"2025-08-03","dq":0,"y":2025,"au":[204,397,424,665,240,95],"c":6,"cs":0,"bib":"2026JCAP...08..020F","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2508.01855","url":"https://arxiv.org/abs/2508.01855","doi":"10.1088/1475-7516/2026/08/020","tg":{"s":["Quijote-PNG"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["No ML"],"u":["Quijote-PNG","Density fields"]},"x":0.3176,"yy":0.4651,"p3":[-0.6249,0.0357,0.3282],"sim":{"k":"e","l":[[242,0.946],[63,0.942],[123,0.942],[327,0.942],[181,0.942]]},"c3":[-88.09,-154.86,8.02],"c2":[58.89,-211.88],"k":5,"r":[98,163,181,226,257,264,339],"rm":0},{"id":"2507.13433","t":"Reanalyzing DESI DR1: 1. $Λ$CDM Constraints from the Power Spectrum and Bispectrum","ab":"We present the first independent re-analysis of the galaxy clustering data from DESI Data Release 1, utilizing an effective field theory full-shape model. We analyze the power spectra and bispectra of the public catalogs using a custom-built pipeline based on window-deconvolved quasi-optimal estimators, accounting for a number of systematic effects. Compared to the official collaboration analysis, we add the galaxy power spectrum hexadecapole and the bispectrum monopole, and also introduce a novel stochastic estimator for fiber collisions, which facilitates robust bispectrum analyses. As a first application, we perform a full-shape analysis of the DESI power spectra and bispectra in the context of the standard cosmological model, $Λ$CDM. Using external priors on the physical baryon density and the primordial power spectrum tilt, we constrain the matter density fraction to $Ω_m=0.284\\pm 0.011$, the Hubble constant to $H_0=70.7\\pm 1.1$ km/s/Mpc, and the mass fluctuation amplitude to $σ_8=0.811\\pm 0.030$. The bispectrum sharpens constraints on $σ_8$ and $Ω_m$ by $\\approx 10\\%$ and shifts $Ω_m$ by $\\approx 1σ$ towards the \\textit{Planck} $Λ$CDM value. Combining our full-shape likelihood with the official DESI DR2 BAO measurements, cosmological parameters shift further towards the \\textit{Planck} values, with $Ω_m=0.296\\pm 0.007$, $H_0=68.8\\pm 0.6$ km/s/Mpc, $σ_8=0.818\\pm 0.029$ (with tighter constraints obtained in joint analyses). Similar results are obtained in a joint analysis with DR1 BAO, accounting for the cross-covariance. Finally, the bispectrum data improves measurements of quadratic bias parameters, which are consistent with predictions from halo occupation distribution models. Our work highlights the importance of higher-order statistics and sets the stage for upcoming full-shape analyses of non-minimal cosmological models.","abx":0,"nw":0,"d":"2025-07-17","dq":0,"y":2025,"au":[67,465,498],"c":46,"cs":0,"bib":"2025arXiv250713433C","v":"","lk":"arXiv:2507.13433","url":"https://arxiv.org/abs/2507.13433","doi":"","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Power spectra","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Non-Quijote simulations"]},"x":0.0352,"yy":0.1049,"p3":[0.0989,-0.5472,-0.1913],"sim":{"k":"e","l":[[200,0.948],[312,0.943],[201,0.943],[146,0.941],[173,0.941]]},"c3":[159.65,-79.92,-30.91],"c2":[156.88,-113.26],"k":0,"r":[121,146,173,253,285,339],"rm":0},{"id":"title:darkenergyandvoiddynamics","t":"Dark Energy and Void Dynamics","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[209],"c":0,"cs":2,"bib":"","v":"","lk":"Bachelar thesis","url":"https://fse.studenttheses.ub.rug.nl/36304/1/ThesisMarchesini.pdf","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Void catalogs"],"m":["No ML"],"u":["Quijote (set not stated)","Void catalogs","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.1457,"yy":0.3128,"p3":[-0.3846,-0.2833,-0.278],"sim":{"k":"w","l":[[305,0.309],[217,0.202],[290,0.191],[126,0.174],[135,0.129]]},"c3":[-75.14,190.03,282.61],"c2":[-285.0,225.5],"k":7,"r":[],"rm":1},{"id":"2507.11462","t":"From Redshift to Real Space: Combining Linear Theory With Neural Networks","ab":"Spectroscopic redshift surveys are key tools to trace the large-scale structure (LSS) of the Universe and test the $Λ$CDM model. However, using redshifts as distance proxies introduces distortions in the 3D galaxy distribution. If uncorrected, these distortions lead to systematic errors in LSS analyses and cosmological parameter estimation. We present a new method that combines linear theory (LT) and a neural network (NN) to mitigate redshift space distortions (RSDs). The hybrid LT+NN approach is trained and validated on dark matter halo fields from z = 1 snapshots of the Quijote N-body simulations. LT corrects large-scale distortions in the linear regime, while the NN learns quasi-linear and small-scale features. The LT correction is applied first, then the NN is trained on the resulting fields to improve accuracy across scales. The method uses a Mean Squared Error (MSE) loss and yields significant performance gains: approximately 50% improvement over LT alone and 12% over NN alone. The reconstructed fields from the LT+NN method show stronger correlations with the true real-space fields than either LT or NN separately. The hybrid method also improves clustering statistics such as halo-halo and halo-void correlations, with benefits extending to BAO scales. Compared to NN-only, it provides better suppression of spurious anisotropies on large and quasi-linear scales, as measured by the quadrupole moments of correlation functions. This work shows that combining a physically motivated dynamical model with a machine learning algorithm leverages the strengths of both approaches. The LT+NN method achieves high accuracy with modest training data and computational cost, making it a promising tool for future applications to more realistic galaxy surveys.","abx":0,"nw":0,"d":"2025-07-15","dq":0,"y":2025,"au":[196,520,259,211],"c":2,"cs":0,"bib":"2026A&A...706A..45M","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2507.11462","url":"https://arxiv.org/abs/2507.11462","doi":"10.1051/0004-6361/202556679","tg":{"s":["Fiducial"],"d":["Density fields","Halo catalogs","Void catalogs","Redshift space"],"m":["CNN","Perturbation theory & analytic models"],"u":["Fiducial","CNN","Void catalogs"]},"x":-0.434,"yy":-0.2707,"p3":[0.2979,0.2805,0.279],"sim":{"k":"e","l":[[110,0.955],[222,0.948],[228,0.947],[313,0.947],[177,0.947]]},"c3":[-22.57,-26.21,189.15],"c2":[-82.5,-200.02],"k":1,"r":[82,105,177,216,222,339],"rm":0},{"id":"2507.10091","t":"Non-Gaussian Expansion of Minkowski Tensors in Redshift Space","ab":"This paper focuses on extending the use of Minkowski Tensors to analyze anisotropic signals in cosmological data, focusing on those introduced by redshift space distortion. We derive the ensemble average of the two translation-invariant, rank-2 Minkowski Tensors ($W_1^{0,2}$ and $W_2^{0,2}$) for a matter density field that is perturbatively non-Gaussian in redshift space. This is achieved through the Edgeworth expansion of the joint probability density function of the field and its derivatives, expressing the ensemble averages in terms of cumulants up to cubic order. Our goal is to connect these theoretical predictions to the underlying cosmological parameters, allowing for parameter estimation by measuring them from galaxy surveys. The work builds on previous analyses of Minkowski Functionals in both real and redshift space and addresses the effects of Finger-of-God velocity dispersion and shot noise. We validate our predictions by matching them to measurements of the Minkowski Tensors from dark matter simulation data, finding that perturbation theory is a qualified success. Non-perturbative Finger-of-God effects remain significant at relatively large scales $R_G \\lesssim 20 \\, h^{-1} \\, {\\rm Mpc}$ and are particularly pronounced in the components parallel to the line of sight.","abx":0,"nw":0,"d":"2025-07-14","dq":0,"y":2025,"au":[599,137,518,178,123],"c":2,"cs":0,"bib":"2026ApJ..1001..213A","v":"Astrophysical Journal","lk":"arXiv:2507.10091","url":"https://arxiv.org/abs/2507.10091","doi":"10.3847/1538-4357/ae3a8b","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.4959,"yy":0.5121,"p3":[-0.4817,0.2311,-0.3618],"sim":{"k":"e","l":[[251,0.965],[73,0.937],[25,0.937],[203,0.933],[309,0.932]]},"c3":[76.32,248.86,-25.59],"c2":[118.43,278.83],"k":5,"r":[118,213,234,251,275,314,339],"rm":0},{"id":"2507.03707","t":"CosmoBench: A Multiscale, Multiview, Multitask Cosmology Benchmark for Geometric Deep Learning","ab":"Cosmological simulations provide a wealth of data in the form of point clouds and directed trees. A crucial goal is to extract insights from this data that shed light on the nature and composition of the Universe. In this paper we introduce CosmoBench, a benchmark dataset curated from state-of-the-art cosmological simulations whose runs required more than 41 million core-hours and generated over two petabytes of data. CosmoBench is the largest dataset of its kind: it contains 34 thousand point clouds from simulations of dark matter halos and galaxies at three different length scales, as well as 25 thousand directed trees that record the formation history of halos on two different time scales. The data in CosmoBench can be used for multiple tasks -- to predict cosmological parameters from point clouds and merger trees, to predict the velocities of individual halos and galaxies from their collective positions, and to reconstruct merger trees on finer time scales from those on coarser time scales. We provide several baselines on these tasks, some based on established approaches from cosmological modeling and others rooted in machine learning. For the latter, we study different approaches -- from simple linear models that are minimally constrained by symmetries to much larger and more computationally-demanding models in deep learning, such as graph neural networks. We find that least-squares fits with a handful of invariant features sometimes outperform deep architectures with many more parameters and far longer training time. Still there remains tremendous potential to improve these baselines by combining machine learning and cosmology to fully exploit the data. CosmoBench sets the stage for bridging cosmology and geometric deep learning at scale. We invite the community to push the frontier of scientific discovery by engaging with this dataset, available at https://cosmobench.streamlit.app","abx":0,"nw":0,"d":"2025-07-04","dq":0,"y":2025,"au":[491,538,358,21,125,134,404,389,240],"c":12,"cs":0,"bib":"2025arXiv250703707H","v":"Neural Information Processing Systems","lk":"arXiv:2507.03707","url":"https://arxiv.org/abs/2507.03707","doi":"10.48550/arXiv.2507.03707","tg":{"s":["Latin hypercube","Non-Quijote simulations"],"d":["Halo catalogs","Galaxy mocks (HOD)","Merger trees"],"m":["Graph neural networks","Other ML"],"u":["Latin hypercube","Non-Quijote simulations","Galaxy mocks (HOD)"]},"x":-0.404,"yy":-0.5882,"p3":[0.384,-0.2182,0.5355],"sim":{"k":"e","l":[[31,0.944],[169,0.942],[102,0.935],[198,0.932],[318,0.932]]},"c3":[-91.71,183.6,33.93],"c2":[-52.22,75.91],"k":1,"r":[102,131,169,170,173,189,209,255,297,302,308,339],"rm":0},{"id":"title:harnessingthepowerofdeeplearningforastrophysicaldiscoveries","t":"Harnessing the Power of Deep Learning for Astrophysical Discoveries","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[687],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://www.proquest.com/openview/c8fb1da56b942146b1f5730f991d2170/1?pq-origsite=gscholar&cbl=18750&diss=y","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields"],"m":["CNN"],"u":["Quijote (set not stated)","Density fields","CNN"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.0,"yy":-0.5292,"p3":[0.583,0.1233,0.4735],"sim":{"k":"w","l":[[162,0.399],[335,0.167],[94,0.165],[238,0.144],[325,0.118]]},"c3":[76.25,-252.65,226.44],"c2":[-112.03,-351.86],"k":1,"r":[],"rm":1},{"id":"2506.09688","t":"CSST Cosmological Emulator II: Generalized Accurate Halo Mass Function Emulation","ab":"Accurate theoretical prediction for halo mass function across a broad cosmological space is crucial for the forthcoming China Space Station Telescope (CSST) observations, which will capture cosmological information from multiple probes, e.g., cluster abundance, and weak lensing. In this work, we quantify the percent-level impact of different mass binning schemes when measuring the differential halo mass function from simulations, and demonstrate that the cumulative form of the halo mass function is independent of the binning scheme. Through the recently finished Kun simulation suite, we propose a generalized framework to construct multiple accurate halo mass function emulators for different halo mass definitions, including $M_{200m}$, $M_{vir}$, and $M_{200c}$. This extends our CSST Emulator to provide fast and accurate halo mass function predictions for halo mass $M\\geq 10^{12}\\,h^{-1}M_{\\odot}$ up to $z=3.0$. For redshifts $z\\leq 1.0$, the accuracy is within $2\\%$ for $M\\leq 10^{13}\\,h^{-1}M_{\\odot}$, $5\\%$ for $M\\leq 10^{14}\\,h^{-1}M_{\\odot}$, and $10\\%$ for $M\\leq 10^{15}\\,h^{-1}M_{\\odot}$, which is comparable with the statistical errors of training simulations. This tool is integrated in CSST Emulator and publicly available at https://github.com/czymh/csstemu, providing a fast and accurate theoretical tool to obtain unbiased cosmological constraints of the upcoming CSST survey.","abx":0,"nw":0,"d":"2025-06-11","dq":0,"y":2025,"au":[709,693],"c":19,"cs":0,"bib":"2025SCPMA..6809513C","v":"Science China Physics Mechanics and Astronomy","lk":"arXiv:2506.09688","url":"https://arxiv.org/abs/2506.09688","doi":"10.1007/s11433-025-2764-x","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs"],"m":["Emulators & regression ML"],"u":[]},"x":-0.2188,"yy":-0.0791,"p3":[0.4032,-0.1095,-0.2468],"sim":{"k":"e","l":[[142,0.936],[37,0.931],[329,0.929],[339,0.924],[121,0.922]]},"c3":[175.34,-70.81,-53.24],"c2":[86.71,15.09],"k":0,"r":[152,339],"rm":0},{"id":"2506.07514","t":"Power Spectrum Emulators from Neural Networks and Tree-Based Methods","ab":"We use two subsets of 2000 and 1000 Quijote simulations to build two power spectrum emulators, allowing for fast computations of the non-linear matter power spectrum. The first emulator is built in terms of seven cosmological parameters: the matter and baryon fraction of the energy density of the Universe $Ω_m$ and $Ω_b$, the reduced Hubble constant $h$, the scalar spectral index $n_s$, the amplitude of matter density fluctuations $σ_8$, the total neutrino mass $M_ν$ and the dark energy equation of state parameter $w$, on scales $k \\in [0.015,1.8]\\,h/ \\rm{Mpc^{-1}}$. The power spectra can be directly determined at redshifts 0, 0.5, 1, 2 and 3, while for intermediate redshifts these can be interpolated. The second emulator is based on five cosmological parameters, $Ω_m$, $h$, $n_s$, $σ_8$ and the amplitude of equilateral non-Gaussianity $f_{\\rm NL}^{\\rm eq}$, at redshifts 0, 0.503, 0.733, 0.997 for $k \\in [0.015,1.8]\\,h/ \\rm{Mpc^{-1}}$. The emulators are built on machine learning techniques. In both cases we have investigated both neural networks and tree-based methods and we have shown that the best accuracy is obtained for a neural network with two hidden layers. Both emulators achieve a root-mean-squared relative error of less then 5\\% for all the redshifts considered on the scales discussed.","abx":0,"nw":0,"d":"2025-06-09","dq":0,"y":2025,"au":[56],"c":1,"cs":0,"bib":"2026PDU....5102186L","v":"Physics of the Dark Universe","lk":"arXiv:2506.07514","url":"https://arxiv.org/abs/2506.07514","doi":"10.1016/j.dark.2025.102186","tg":{"s":["Latin hypercube","Massive neutrinos","Quijote-PNG"],"d":["Power spectra"],"m":["Emulators & regression ML"],"u":["Quijote-PNG","Massive neutrinos"]},"x":0.269,"yy":-0.1769,"p3":[0.3272,0.385,-0.2894],"sim":{"k":"e","l":[[17,0.94],[301,0.934],[183,0.933],[108,0.933],[339,0.932]]},"c3":[-134.87,-54.79,-9.14],"c2":[-19.11,-87.12],"k":3,"r":[135,171,228,260,263,264,286,301,332,339],"rm":0},{"id":"2505.13443","t":"Wonderings on Wiggly Bispectra: Non-linear Evolution and Reconstruction of Oscillations in the Squeezed Bispectrum","ab":"Oscillations in the primordial bispectrum are sourced by a range of inflationary phenomena, including features in the inflaton potential and interactions with massive fields through the Cosmological Collider scenario. These signatures offer a powerful window into early-universe physics. In this work, we study how oscillations of the form $\\lim_{q\\ll k}B(q,k)\\propto \\cos(μ\\ln(q/k))$ impact the non-linear squeezed matter bispectrum. Using a suite of $N$-body simulations with non-Gaussian initial conditions, we show that non-linear evolution significantly damps these oscillations, effectively erasing the signal on scales $k \\gtrsim 0.3~h/{\\rm Mpc}$ at redshift $z=0$. This damping is well-described by the Zel'dovich approximation and can be modeled deep into the non-linear regime using non-perturbative separate universe simulations. Promisingly, we show that reconstruction techniques developed for baryon acoustic oscillation (BAO) analyses can largely undo this damping, improving constraints on the amplitude (phase) of oscillations in the primordial squeezed bispectrum by up to a factor of five (four) at $z=0$. We also discuss several challenges with modeling the non-linear evolution of the squeezed bispectrum in the Cosmological Collider scenario, where the bispectrum is suppressed by a factor of $(q/k)^{3/2}$ relative to the template studied here. Our findings pave the way for future searches for oscillatory bispectra using large-scale structure data.","abx":0,"nw":0,"d":"2025-05-19","dq":0,"y":2025,"au":[563,498,204,665],"c":11,"cs":0,"bib":"2025PhRvD.112h3503G","v":"","lk":"arXiv:2505.13443","url":"https://arxiv.org/abs/2505.13443","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Non-Quijote simulations"]},"x":0.1584,"yy":0.7228,"p3":[-0.8846,0.1595,0.278],"sim":{"k":"e","l":[[161,0.958],[248,0.953],[264,0.942],[229,0.937],[336,0.936]]},"c3":[-35.98,-212.94,22.37],"c2":[72.81,-257.16],"k":5,"r":[89,105,110,123,161,203,228,229,248,257,285,339],"rm":0},{"id":"2505.13591","t":"Modeling Galaxy Surveys with Hybrid SBI","ab":"Simulation-based inference (SBI) has emerged as a powerful tool for extracting cosmological information from galaxy surveys deep into the non-linear regime. Despite its great promise, its application is limited by the computational cost of running simulations that can describe the increasingly-large cosmological datasets. Recent work proposed a hybrid SBI framework (HySBI), which combines SBI on small-scales with perturbation theory (PT) on large-scales, allowing information to be extracted from high-resolution observations without large-volume simulations. In this work, we lay out the HySBI framework for galaxy clustering, a key step towards its application to next-generation datasets. We study the choice of priors on the parameters for modeling galaxies in PT analysis and in simulation-based analyses, as well as investigate their cosmology dependence. By jointly modeling large- and small-scale statistics and their associated nuisance parameters, we show that HySBI can obtain 20\\% and 60\\% tighter constraints on $Ω_m$ and $σ_8$, respectively, compared to traditional PT analyses, thus demonstrating the efficacy of this approach to maximally extract information from upcoming spectroscopic datasets.","abx":0,"nw":0,"d":"2025-05-19","dq":0,"y":2025,"au":[252,131,498],"c":5,"cs":0,"bib":"2026PhRvD.113d3518Z","v":"","lk":"arXiv:2505.13591","url":"https://arxiv.org/abs/2505.13591","doi":"","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Power spectra","Higher-order statistics"],"m":["Simulation-based inference","Perturbation theory & analytic models"],"u":["Latin hypercube","Molino / HOD galaxy mocks","Higher-order statistics"]},"x":-0.0781,"yy":-0.0429,"p3":[0.5281,-0.5357,0.0175],"sim":{"k":"e","l":[[243,0.959],[198,0.953],[208,0.953],[205,0.946],[244,0.945]]},"c3":[192.62,70.6,74.78],"c2":[280.86,-59.79],"k":0,"r":[121,146,173,205,208,244,339],"rm":0},{"id":"2505.00608","t":"Turning dispersion into signal: density-split analyses of pairwise velocities","ab":"Pairwise velocities of the large-scale structure encode valuable information about the growth of structure. They can be observed indirectly through redshift-space distortions and the kinetic Sunyaev-Zeldovich effect. Whether it is Gaussian or non-Gaussian, the pairwise velocity has a broad distribution, but the cosmologically useful information lies primarily in the mean -the streaming velocities; the dispersion around the mean is often treated as a nuisance and marginalised over. This reduces the constraining power of our observations. We demonstrate that this is not necessarily the case, provided the underlying physics behind the dispersion is understood. By splitting the halo/galaxy samples according to their density environments and measuring the streaming velocities separately, the total signal-to-noise is several times greater than in conventional global measurements of the pairwise velocity distribution (PVD). This improvement arises because the global PVD is a composite of a series of near-Gaussian distributions with different means and dispersions, each determined by its local density environment. By splitting the data, we avoid cancellation between these opposing velocities, effectively turning the dispersion in the global PVD into a signal. Our findings indicate substantial potential for improving the analysis of PVD observations using the kinetic Sunyaev-Zeldovich effect and redshift-space distortions.","abx":0,"nw":0,"d":"2025-05-01","dq":0,"y":2025,"au":[72,678],"c":4,"cs":0,"bib":"2026MNRAS.549ag881G","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2505.00608","url":"https://arxiv.org/abs/2505.00608","doi":"10.1093/mnras/stag881","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Higher-order statistics","Redshift space"],"m":["No ML"],"u":["Higher-order statistics"]},"x":-0.3044,"yy":0.5741,"p3":[0.0693,-0.0154,-0.5357],"sim":{"k":"e","l":[[9,0.946],[13,0.945],[155,0.942],[307,0.936],[316,0.93]]},"c3":[81.05,85.55,23.84],"c2":[122.17,-21.22],"k":2,"r":[164,249,339],"rm":0},{"id":"title:themarkedpowerspectrumofcosmologicallargescalestructure","t":"The marked power spectrum of cosmological large scale structure","ab":"","abx":0,"nw":0,"d":"2025","dq":1,"y":2025,"au":[402],"c":0,"cs":2,"bib":"","v":"","lk":"Master thesis","url":"https://thesis.unipd.it/bitstream/20.500.12608/84624/1/Fusaro_Luca.pdf.pdf","doi":"","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Density fields","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Density fields","Higher-order statistics","Fisher forecasts","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.2234,"yy":0.046,"p3":[0.3028,-0.0042,-0.4038],"sim":{"k":"w","l":[[331,0.28],[128,0.243],[262,0.234],[181,0.176],[176,0.175]]},"c3":[93.79,101.07,317.34],"c2":[368.26,175.93],"k":8,"r":[],"rm":1},{"id":"2505.23904","t":"Cosmology with Topological Deep Learning","ab":"The standard cosmological model with cold dark matter posits a hierarchical formation of structures. We introduce topological neural networks (TNNs), implemented as message-passing neural networks on higher-order structures, to effectively capture the topological information inherent in these hierarchies that traditional graph neural networks (GNNs) fail to account for. Our approach not only considers the vertices and edges that comprise a graph but also extends to higher-order cells such as tetrahedra, clusters, and hyperedges. This enables message-passing between these heterogeneous structures within a combinatorial complex. Furthermore, our TNNs are designed to conserve the $E(3)$-invariance, which refers to the symmetry arising from invariance against translations, reflections, and rotations. When applied to the Quijote suite, our TNNs achieve a significant reduction in the mean squared error. Compared to our GNNs, which lack higher-order message-passing, ClusterTNNs show improvements of up to 22% in $Ω_{\\rm m}$ and 34% in $σ_8$ jointly, while the best FullTNN achieves an improvement of up to 60% in $σ_8$. In the context of the CAMELS suite, our models yield results comparable to the current GNN benchmark, albeit with a slight decrease in performance. We emphasize that our topology and symmetry-aware neural networks provide enhanced expressive power in modeling the large-scale structures of our universe.","abx":0,"nw":1,"d":"2025-05-29","dq":0,"y":2025,"au":[358,240],"c":9,"cs":0,"bib":"2025ApJ...989...47L","v":"Astrophysical Journal","lk":"arXiv:2505.23904","url":"https://arxiv.org/abs/2505.23904","doi":"10.3847/1538-4357/ade806","tg":{"s":["Latin hypercube","Non-Quijote simulations"],"d":["Halo catalogs"],"m":["Graph neural networks","Other ML"],"u":["Latin hypercube"]},"x":-0.3933,"yy":-0.6694,"p3":[0.1204,0.0494,0.8855],"sim":{"k":"e","l":[[169,0.946],[131,0.939],[94,0.935],[246,0.934],[116,0.933]]},"c3":[-8.44,177.45,-29.6],"c2":[107.88,56.0],"k":9,"r":[131,169,185,189,198,221,255,262,264,272,291,308,312,326,327,334],"rm":0},{"id":"2504.06919","t":"Correcting for interloper contamination in the power spectrum with neural networks","ab":"Modern slitless spectroscopic surveys, such as Euclid and the Roman Space Telescope, collect vast numbers of galaxy spectra but suffer from low signal-to-noise ratios. This often leads to incorrect redshift assignments when relying on a single emission line, due to noise spikes or contamination from non-target emission lines, commonly referred to as redshift interlopers. We propose a machine learning approach to correct the impact of interlopers at the level of measured summary statistics, focusing on the power spectrum monopole and line interlopers as a proof of concept. To model interloper effects, we use halo catalogs from the Quijote simulations as proxies for galaxies, displacing a fraction of halos by the distance corresponding to the redshift offset between target and interloper galaxies. This yields contaminated catalogs with varying interloper fractions across a wide range of cosmologies from the Quijote suite. We train a neural network on the power spectrum monopole, alone or combined with the bispectrum monopole, from contaminated mocks to estimate the interloper fraction and reconstruct the cleaned power spectrum. We evaluate performance in two settings: one with fixed cosmology and another where cosmological parameters vary under broad priors. In the fixed case, the network recovers the interloper fraction and corrects the power spectrum to better than 1% accuracy. When cosmology varies, performance degrades, but adding bispectrum information significantly improves results, reducing the interloper fraction error by 40-60%. We also study the method's performance as a function of the size of the training set and find that optimal strategies depend on the correlation between target and interloper samples: bispectrum information aids performance when target and interloper galaxies are uncorrelated, while tighter priors are more effective when the two are strongly correlated.","abx":0,"nw":0,"d":"2025-04-09","dq":0,"y":2025,"au":[433,84,240],"c":6,"cs":0,"bib":"2025ApJ...991...48C","v":"Astrophysical Journal","lk":"arXiv:2504.06919","url":"https://arxiv.org/abs/2504.06919","doi":"10.3847/1538-4357/adf72a","tg":{"s":["Fiducial","Latin hypercube"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Emulators & regression ML"],"u":["Latin hypercube","Fiducial"]},"x":-0.4291,"yy":-0.1745,"p3":[0.0772,0.231,0.3029],"sim":{"k":"e","l":[[110,0.943],[92,0.94],[84,0.937],[38,0.934],[185,0.933]]},"c3":[-4.59,47.96,69.19],"c2":[-78.83,19.19],"k":0,"r":[107,191,209,252,336,339],"rm":0},{"id":"2504.03424","t":"The AI Cosmologist I: An Agentic System for Automated Data Analysis","ab":"We present the AI Cosmologist, an agentic system designed to automate cosmological/astronomical data analysis and machine learning research workflows. This implements a complete pipeline from idea generation to experimental evaluation and research dissemination, mimicking the scientific process typically performed by human researchers. The system employs specialized agents for planning, coding, execution, analysis, and synthesis that work together to develop novel approaches. Unlike traditional auto machine-learning systems, the AI Cosmologist generates diverse implementation strategies, writes complete code, handles execution errors, analyzes results, and synthesizes new approaches based on experimental outcomes. We demonstrate the AI Cosmologist capabilities across several machine learning tasks, showing how it can successfully explore solution spaces, iterate based on experimental results, and combine successful elements from different approaches. Our results indicate that agentic systems can automate portions of the research process, potentially accelerating scientific discovery. The code and experimental data used in this paper are available on GitHub at https://github.com/adammoss/aicosmologist. Example papers included in the appendix demonstrate the system's capability to autonomously produce complete scientific publications, sta
