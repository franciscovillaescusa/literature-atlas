ory & analytic models","No ML"],"u":["Fisher forecasts"]},"x":0.0326,"yy":0.6696,"p3":[-0.6725,-0.2105,0.0337],"sim":{"k":"e","l":[[259,0.95],[123,0.948],[163,0.941],[166,0.94],[204,0.939]]},"c3":[-140.83,-19.1,-154.66],"c2":[-51.57,-31.04],"k":4,"r":[334,339],"rm":0},{"id":"1911.11158","t":"Fisher for complements: Extracting cosmology and neutrino mass from the counts-in-cells PDF","ab":"We comprehensively analyse the cosmology dependence of counts-in-cell statistics. We focus on the shape of the one-point probability distribution function (PDF) of the matter density field at mildly nonlinear scales. Based on large-deviation statistics, we parametrise the cosmology dependence of the matter PDF in terms of the linear power spectrum, the growth factor, the spherical collapse dynamics, and the nonlinear variance. We extend our formalism to include massive neutrinos, finding that the total matter PDF is highly sensitive to the total neutrino mass $M_ν$ and can disentangle it from the clustering amplitude $σ_8$. Using more than a million PDFs extracted from the Quijote simulations, we determine the response of the matter PDF to changing parameters in the $νΛ$CDM model and successfully cross-validate the theoretical model and the simulation measurements. We present the first $νΛ$CDM Fisher forecast for the matter PDF at multiple scales and redshifts, and its combination with the matter power spectrum. We establish that the matter PDF and the matter power spectrum are highly complementary at mildly nonlinear scales. The matter PDF is particularly powerful for constraining the matter density $Ω_m$, clustering amplitude $σ_8$ and the total neutrino mass $M_ν$. Adding the mildly nonlinear matter PDF to the mildly nonlinear matter power spectrum improves constraints on $Ω_m$ by a factor of 5 and $σ_8$ by a factor of 2 when considering the three lowest redshifts. In our joint analysis of the matter PDF and matter power spectrum at three redshifts, the total neutrino mass is constrained to better than 0.01 eV with a total volume of 6 (Gpc/h)$^3$. We discuss how density-split statistics can be used to translate those encouraging results for the matter PDF into realistic observables in galaxy surveys.","abx":0,"nw":0,"d":"2019-11-25","dq":0,"y":2019,"au":[146,497,240,73,564],"c":125,"cs":0,"bib":"2020MNRAS.495.4006U","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:1911.11158","url":"https://arxiv.org/abs/1911.11158","doi":"10.1093/mnras/staa1155","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.2541,"yy":0.0889,"p3":[-0.1294,0.1167,-0.5336],"sim":{"k":"e","l":[[249,0.955],[25,0.947],[308,0.947],[336,0.947],[62,0.947]]},"c3":[-93.69,132.12,-174.36],"c2":[-2.68,151.23],"k":5,"r":[331,336,339],"rm":0},{"id":"1910.04255","t":"Learning neutrino effects in Cosmology with Convolutional Neural Networks","ab":"Measuring the sum of the three active neutrino masses, $M_ν$, is one of the most important challenges in modern cosmology. Massive neutrinos imprint characteristic signatures on several cosmological observables in particular on the large-scale structure of the Universe. In order to maximize the information that can be retrieved from galaxy surveys, accurate theoretical predictions in the non-linear regime are needed. Currently, one way to achieve those predictions is by running cosmological numerical simulations. Unfortunately, producing those simulations requires high computational resources -- several hundred to thousand core-hours for each neutrino mass case. In this work, we propose a new method, based on a deep learning network, to quickly generate simulations with massive neutrinos from standard $Λ$CDM simulations without neutrinos. We computed multiple relevant statistical measures of deep-learning generated simulations, and conclude that our approach is an accurate alternative to the traditional N-body techniques. In particular the power spectrum is within $\\simeq 6\\%$ down to non-linear scales $k=0.7$~\\rm h/Mpc. Finally, our method allows us to generate massive neutrino simulations 10,000 times faster than the traditional methods.","abx":0,"nw":0,"d":"2019-10-09","dq":0,"y":2019,"au":[199,451,240,594,580,122],"c":37,"cs":0,"bib":"2023ApJ...950...70G","v":"Astrophysical Journal","lk":"arXiv:1910.04255","url":"https://arxiv.org/abs/1910.04255","doi":"10.3847/1538-4357/accd61","tg":{"s":["Fiducial","Massive neutrinos"],"d":["Density fields","Particle snapshots","Power spectra"],"m":["CNN","Generative models"],"u":["Fiducial","CNN"]},"x":-0.172,"yy":-0.418,"p3":[0.279,0.3415,0.5625],"sim":{"k":"e","l":[[175,0.946],[74,0.945],[115,0.943],[313,0.94],[36,0.935]]},"c3":[-80.47,-24.0,-106.33],"c2":[-47.08,17.87],"k":1,"r":[336,339],"rm":0},{"id":"1909.11107","t":"Constraining $M_ν$ with the Bispectrum I: Breaking Parameter Degeneracies","ab":"Massive neutrinos suppress the growth of structure below their free-streaming scale and leave an imprint on large-scale structure. Measuring this imprint allows us to constrain the sum of neutrino masses, $M_ν$, a key parameter in particle physics beyond the Standard Model. However, degeneracies among cosmological parameters, especially between $M_ν$ and $σ_8$, limit the constraining power of standard two-point clustering statistics. In this work, we investigate whether we can break these degeneracies and constrain $\\smnu$ with the next higher-order correlation function --- the bispectrum. We first examine the redshift-space halo bispectrum of $800$ $N$-body simulations from the HADES suite and demonstrate that the bispectrum helps break the $M_ν$--$σ_8$ degeneracy. Then using 22,000 $N$-body simulations of the Quijote suite, we quantify for the first time the full information content of the redshift-space halo bispectrum down to nonlinear scales using a Fisher matrix forecast of $\\{Ω_m$, $Ω_b$, $h$, $n_s$, $σ_8$, $M_ν\\}$. For $k_{\\rm max}{=}0.5~h/{\\rm Mpc}$, the bispectrum provides $Ω_m$, $Ω_b$, $h$, $n_s$, and $σ_8$ constraints 1.9, 2.6, 3.1, 3.6, and 2.6 times tighter than the power spectrum. For $M_ν$, the bispectrum improves the 1$σ$ constraint from 0.2968 to 0.0572 eV --- over 5 times tighter than the power spectrum. Even with priors from {\\em Planck}, the bispectrum improves $M_ν$ constraints by a factor of 1.8. Although we reserve marginalizing over a more complete set of bias parameters to the next paper of the series, these constraints are derived for a $(1~h^{-1}{\\rm Gpc})^3$ box, a substantially smaller volume than upcoming surveys. Thus, our results demonstrate that the bispectrum offers significant improvements over the power spectrum, especially for constraining $M_ν$.","abx":0,"nw":0,"d":"2019-09-24","dq":0,"y":2019,"au":[122,240,203,543],"c":148,"cs":0,"bib":"2020JCAP...03..040H","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:1909.11107","url":"https://arxiv.org/abs/1909.11107","doi":"10.1088/1475-7516/2020/03/040","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Non-Quijote simulations"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.1727,"yy":0.1222,"p3":[-0.1433,0.2167,-0.5366],"sim":{"k":"e","l":[[312,0.959],[249,0.954],[88,0.947],[334,0.947],[200,0.946]]},"c3":[50.8,29.48,-167.18],"c2":[76.68,170.7],"k":5,"r":[339],"rm":0},{"id":"1907.06598","t":"Weighing neutrinos with the halo environment","ab":"Nonlinear objects like halos and voids exhibit a scale-dependent bias on linear scales in massive neutrino cosmologies. The shape of this scale-dependent bias is a unique signature of the neutrino masses, but the amplitude of the signal is generally small, of the order of $f_ν$, the contribution of neutrinos to the total matter content ($\\lesssim 1\\%$). In this paper, we demonstrate for the first time how the strength of this signal can be substantially enhanced by using information about the halo environment at a range of scales. This enhancement is achieved by using certain combinations of the large scale Cold Dark Matter and total matter environments of halos, both of which are measurable from galaxy clustering and weak lensing surveys.","abx":0,"nw":0,"d":"2019-07-15","dq":0,"y":2019,"au":[73,203,240,635,446],"c":29,"cs":0,"bib":"2020JCAP...06..032B","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:1907.06598","url":"https://arxiv.org/abs/1907.06598","doi":"10.1088/1475-7516/2020/06/032","tg":{"s":["Massive neutrinos","Non-Quijote simulations"],"d":["Density fields","Halo catalogs"],"m":["No ML"],"u":["Massive neutrinos","Non-Quijote simulations"]},"x":-0.2726,"yy":0.3004,"p3":[-0.2547,-0.0483,-0.7131],"sim":{"k":"e","l":[[195,0.942],[323,0.939],[329,0.938],[109,0.933],[292,0.932]]},"c3":[19.33,83.58,-244.95],"c2":[17.22,244.69],"k":8,"r":[339],"rm":0},{"id":"1906.11823","t":"Anisotropic halo assembly bias and redshift-space distortions","ab":"We study the effect of large-scale tidal fields on internal halo properties using a set of N-body simulations. We measure significant cross-correlations between large-scale tidal fields and several non-scalar halo properties: shapes, velocity dispersion, and angular momentum. Selection effects that couple to these non-scalar halo properties can produce anisotropic clustering even in real-space. We investigate the size of this effect and show that it can produce a non-zero quadrupole similar in size to the one generated by linear redshift-space distortions (RSD). Finally, we investigate the clustering properties of halos identified in redshift-space and find enormous deviations from the standard linear RSD model, again caused by anisotropic assembly bias. These effects could contaminate the values of cosmological parameters inferred from the observed redshift-space clustering of galaxies, groups, or 21cm emission from atomic hydrogen, if their selection depends on properties affected by halo assembly bias. We briefly discuss ways in which this effect can be measured in existing and future large-scale structure surveys.","abx":0,"nw":0,"d":"2019-06-27","dq":0,"y":2019,"au":[57,480,661],"c":20,"cs":0,"bib":"2019JCAP...10..020O","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:1906.11823","url":"https://arxiv.org/abs/1906.11823","doi":"10.1088/1475-7516/2019/10/020","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Power spectra","Redshift space"],"m":["No ML"],"u":[]},"x":0.2458,"yy":0.8934,"p3":[-0.4066,-0.2577,-0.007],"sim":{"k":"e","l":[[8,0.935],[193,0.928],[156,0.928],[300,0.925],[285,0.925]]},"c3":[-7.3,43.04,-152.57],"c2":[-34.38,145.25],"k":2,"r":[339],"rm":0},{"id":"1909.05273","t":"The Quijote simulations","ab":"The Quijote simulations are a set of 44,100 full N-body simulations spanning more than 7,000 cosmological models in the $\\{Ω_{\\rm m}, Ω_{\\rm b}, h, n_s, σ_8, M_ν, w \\}$ hyperplane. At a single redshift the simulations contain more than 8.5 trillions of particles over a combined volume of 44,100 $(h^{-1}{\\rm Gpc})^3$; each simulation follow the evolution of $256^3$, $512^3$ or $1024^3$ particles in a box of $1~h^{-1}{\\rm Gpc}$ length. Billions of dark matter halos and cosmic voids have been identified in the simulations, whose runs required more than 35 million core hours. The Quijote simulations have been designed for two main purposes: 1) to quantify the information content on cosmological observables, and 2) to provide enough data to train machine learning algorithms. In this paper we describe the simulations and show a few of their applications. We also release the Petabyte of data generated, comprising hundreds of thousands of simulation snapshots at multiple redshifts, halo and void catalogs, together with millions of summary statistics such as power spectra, bispectra, correlation functions, marked power spectra, and estimated probability density functions.","abx":0,"nw":0,"d":"2019-09-11","dq":0,"y":2019,"au":[240,122,200,73,49,184,632,199,684,213,65,146,127,594,43,57,692,203,248,135,58,360,543,397,446,580,602,95,166],"c":444,"cs":0,"bib":"2020ApJS..250....2V","v":"Astrophysical Journal Supplement Series","lk":"arXiv:1909.05273","url":"https://arxiv.org/abs/1909.05273","doi":"10.3847/1538-4365/ab9d82","tg":{"s":["Fiducial","Latin hypercube","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Particle snapshots","Halo catalogs","Void catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["No ML"]},"x":-0.2639,"yy":-0.1559,"p3":[0.3963,0.0933,-0.0719],"sim":{"k":"e","l":[[297,0.953],[37,0.949],[254,0.946],[113,0.946],[277,0.945]]},"c3":[2.61,17.6,-39.68],"c2":[40.51,15.0],"k":7,"r":[329,331,332,334,335,336,338],"rm":0}],"co":{"1":[[209.83,323.83,-216.84],[193.27,347.32,-183.38],[220.15,309.97,-171.59],[229.32,363.55,-141.91],[169.98,340.47,-147.08],[260.23,317.61,-131.67],[-477.8,-187.28,80.03],[205.15,314.03,-120.28],[249.5,361.34,-95.27],[187.38,371.82,-106.23],[253.62,322.79,-73.04],[221.81,368.53,-51.03],[192.64,336.72,-69.77],[331.9,103.28,408.75],[334.24,2.09,429.18],[-15.12,-201.06,328.85],[-4.13,423.7,-82.87],[-191.33,-250.13,167.29],[173.49,-42.76,525.67],[-145.25,154.87,259.63],[455.2,-174.38,191.79],[54.78,-164.57,85.54],[-129.52,-44.66,-4.24],[-10.68,-399.75,18.76],[89.84,-26.24,-150.25],[39.42,-152.62,145.5],[-441.38,-75.5,-14.44],[13.65,-234.36,298.37],[-178.87,-446.97,-144.83],[267.55,38.14,99.14],[-40.8,248.1,-76.73],[319.52,-36.99,87.98],[-152.51,155.8,444.85],[132.14,145.49,322.53],[333.74,-64.05,176.76],[154.38,-78.93,-122.18],[-338.42,-186.18,-284.0],[-408.72,36.72,292.72],[126.72,235.72,465.73],[66.52,231.72,195.85],[164.77,-56.69,404.24],[293.86,-422.03,174.95],[-352.53,269.23,132.59],[186.93,-106.95,56.05],[12.97,-67.93,337.95],[57.19,-220.72,504.07],[-114.0,-221.04,192.14],[   if (S.dim === 3) q.set('dim', '3');
  if (!S.selfc) q.set('self', '0');
  if (S.newOnly) q.set('new', '1');
  if (S.colorBy !== 'topic') q.set('color', S.colorBy);
  const s = q.toString();
  return '#' + S.view + (s ? '&' + s : '');
}
function writeHash(push) {   // push: add a history entry (selections), else replace (filters, view)
  if (applying || PLAY.on) return;
  const h = stateHash();
  if (location.hash === h) return;
  try { if (push) history.pushState(null, '', h); else history.replaceState(null, '', h); lastHash = location.hash; } catch (e) {}
}
function applyHash() {
  lastHash = location.hash;
  stopPlay();   // another shared link, or Back/Forward
  const amp = location.hash.indexOf('&');
  const raw = amp < 0 ? location.hash.slice(1) : location.hash.slice(1, amp);
  const v = VIEWS.includes(raw) ? raw : 'topics';
  const q = new URLSearchParams(amp < 0 ? '' : location.hash.slice(amp + 1));
  applying = true;
  try {
    {
      S.q = q.get('q') || ''; $('q').value = S.q;
      const yr = (q.get('years') || '').split('-').map(Number);
      S.y0 = years.includes(yr[0]) ? yr[0] : years[0];
      S.y1 = years.includes(yr[1]) ? yr[1] : years[years.length - 1];
      if (S.y0 > S.y1) [S.y0, S.y1] = [S.y1, S.y0];   // years=2025-2020 means 2020-2025
      $('y0').value = S.y0; $('y1').value = S.y1;
      S.newOnly = q.get('new') === '1';
      S.colorBy = ['year', 'method', 'suite'].includes(q.get('color')) ? q.get('color') : 'topic'; $('colorby').value = S.colorBy; dispSum();
      S.on = q.get('topics') ? new Set(q.get('topics').split('.').map(Number).filter(k => k >= 0 && k < TOP.length)) : new Set(TOP.map((_, k) => k));
      renderLegend();
      [['suite', 's'], ['data', 'd'], ['method', 'm']].forEach(([a, ax]) => {
        const sel = $('f-' + a); sel.value = q.get(a) || ''; S.tag[ax] = sel.value;   // unknown values fall back to "All"
      });
      const sc = q.get('self') !== '0';
      if (sc !== S.selfc) { $('selfc').checked = sc; $('selfc').dispatchEvent(new Event('change')); }
      setDim(q.get('dim') === '3' ? 3 : 2);
    }
    if (!viewInit || v !== S.view) { viewInit = true; setView(v, false); }
    applyFilters(); updateStats(); renderActive();
    let sel = null;
    if (q.get('paper')) { const p = P.find(x => x.id === q.get('paper')); if (p) sel = { kind: 'p', i: p.i }; }
    if (q.get('author')) { const a = AU.find(x => x.name === q.get('author')); if (a) sel = { kind: 'a', i: a.i }; }
    select(sel);
    if (S.view === 'table') renderTable();
    if (S.view === 'trends') renderTrends();
    if (!S.sel) overview();
    draw();
  } finally { applying = false; }
}

// ---------- boot ----------
renderLegend(); applyFilters(); renderPanel();
new ResizeObserver(() => { resize(); if (!userMoved) fit(false); if (S.view === 'trends') renderTrends(); }).observe(stage);
const mq = matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
applyHash(); dispSum();
document.fonts && document.fonts.ready.then(draw);
})();
</script>
