rting from only the dataset and task description","abx":0,"nw":0,"d":"2025-04-04","dq":0,"y":2025,"au":[18],"c":22,"cs":0,"bib":"2025arXiv250403424M","v":"arXiv.org","lk":"arXiv:2504.03424","url":"https://arxiv.org/abs/2504.03424","doi":"10.48550/arXiv.2504.03424","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Power spectra"],"m":["Other ML"],"u":["Density fields","Power spectra"]},"x":-0.1949,"yy":-0.7392,"p3":[0.236,0.1165,0.4368],"sim":{"k":"e","l":[[60,0.915],[51,0.912],[302,0.9],[339,0.898],[1,0.894]]},"c3":[52.34,-122.03,-19.24],"c2":[-131.31,-82.67],"k":9,"r":[339],"rm":0},{"id":"2504.01092","t":"Initial Conditions from Galaxies: Machine-Learning Subgrid Correction to Standard Reconstruction","ab":"We present a hybrid method for reconstructing the primordial density from late-time halos and galaxies. Our approach involves two steps: (1) apply standard Baryon Acoustic Oscillation (BAO) reconstruction to recover the large-scale features in the primordial density field and (2) train a deep learning model to learn small-scale corrections on partitioned subgrids of the full volume. At inference, this correction is then convolved across the full survey volume, enabling scaling to large survey volumes. We train our method on both mock halo catalogs and mock galaxy catalogs in both configuration and redshift space from the Quijote $1(h^{-1}\\,\\mathrm{Gpc})^3$ simulation suite. When evaluated on held-out simulations, our combined approach significantly improves the reconstruction cross-correlation coefficient with the true initial density field and remains robust to moderate model misspecification. Additionally, we show that models trained on $1(h^{-1}\\,\\mathrm{Gpc})^3$ can be applied to larger boxes--e.g., $(3h^{-1}\\,\\mathrm{Gpc})^3$--without retraining. Finally, we perform a Fisher analysis on our method's recovery of the BAO peak, and find that it significantly improves the error on the acoustic scale relative to standard BAO reconstruction. Ultimately, this method robustly captures nonlinearities and bias without sacrificing large-scale accuracy, and its flexibility to handle arbitrarily large volumes without escalating computational requirements makes it especially promising for large-volume surveys like DESI.","abx":0,"nw":0,"d":"2025-04-01","dq":0,"y":2025,"au":[393,21,638],"c":19,"cs":0,"bib":"2025JCAP...09..039P","v":"arXiv.org","lk":"arXiv:2504.01092","url":"https://arxiv.org/abs/2504.01092","doi":"10.1088/1475-7516/2025/09/039","tg":{"s":["Molino / HOD galaxy mocks"],"d":["Density fields","Halo catalogs","Galaxy mocks (HOD)","Redshift space"],"m":["CNN","Fisher forecasts","Perturbation theory & analytic models"],"u":["Molino / HOD galaxy mocks","CNN","Perturbation theory & analytic models"]},"x":-0.409,"yy":-0.3404,"p3":[-0.0611,0.0678,0.3501],"sim":{"k":"e","l":[[110,0.953],[123,0.948],[228,0.947],[222,0.946],[260,0.946]]},"c3":[71.08,-64.08,136.49],"c2":[107.59,-190.97],"k":1,"r":[115,188,222,228,230,244,339],"rm":0},{"id":"2503.21736","t":"Local Primordial non-Gaussian Bias from Time Evolution","ab":"Primordial non-Gaussianity (PNG) is a signature of fundamental physics in the early universe that is probed by cosmological observations. It is well known that the local type of PNG generates a strong signal in the two-point function of large-scale structure tracers, such as galaxies. This signal, often termed ``scale-dependent bias'' is a generic feature of modulation of gravitational structure formation by a large-scale mode. It is less well-appreciated that the coefficient controlling this signal, $b_φ$, is closely connected to the time evolution of the tracer number density. This correspondence between time evolution and local PNG can be simply explained for a universal tracer whose mass function only depends on peak height, and more generally for non-universal tracers in the separate universe picture, which we validate in simulations. We also describe how to recover the bias of tracers subject to a survey selection function, and perform a simple demonstration on simulated galaxies. Since the local PNG amplitude in $n-$point statistics ($f_{\\rm NL}$) is largely degenerate with the coefficient $b_φ$, this proof of concept study demonstrates that galaxy survey data can allow for more optimal and robust extraction of local PNG information from upcoming surveys.","abx":0,"nw":0,"d":"2025-03-27","dq":0,"y":2025,"au":[309,638],"c":11,"cs":0,"bib":"2025PhRvD.112h3522S","v":"Physical Review D","lk":"arXiv:2503.21736","url":"https://arxiv.org/abs/2503.21736","doi":"10.1103/8jvj-66zc","tg":{"s":["Quijote-PNG","Non-Quijote simulations"],"d":["Halo catalogs","Galaxy mocks (HOD)"],"m":["Perturbation theory & analytic models","No ML"],"u":["Quijote-PNG","Non-Quijote simulations","Galaxy mocks (HOD)"]},"x":-0.0258,"yy":0.6862,"p3":[-0.6843,-0.0388,-0.2568],"sim":{"k":"e","l":[[333,0.938],[323,0.937],[259,0.937],[204,0.935],[130,0.935]]},"c3":[-57.26,-173.78,36.47],"c2":[-8.64,-198.28],"k":4,"r":[133,193,229,339],"rm":0},{"id":"2503.13755","t":"How many simulations do we need for simulation-based inference in cosmology?","ab":"How many simulations do we need to train machine learning methods to extract information available from summary statistics of the cosmological density field? Neural methods have shown the potential to extract non-linear information available from cosmological data. Success depends critically on having sufficient simulations for training the networks and appropriate network architectures. In the first detailed convergence study of neural network training for cosmological inference, we show that currently available simulation suites, such as the Quijote Latin Hypercube(LH) with 2000 simulations, do not provide sufficient training data for a generic neural network to reach the optimal regime, even for the dark matter power spectrum, and in an idealized case. We discover an empirical neural scaling law that predicts how much information a neural network can extract from a highly informative summary statistic, the dark matter power spectrum, as a function of the number of simulations used to train the network, for a wide range of architectures and hyperparameters. We combine this result with the Cramer-Rao information bound to forecast the number of training simulations needed for near-optimal information extraction. To verify our method we created the largest publicly released simulation data set in cosmology, the Big Sobol Sequence(BSQ), consisting of 32,768 $Λ$CDM n-body simulations uniformly covering the $Λ$CDM parameter space. Our method enables efficient planning of simulation campaigns for machine learning applications in cosmology, while the BSQ dataset provides an unprecedented resource for studying the convergence behavior of neural networks in cosmological parameter inference. Our results suggest that new large simulation suites or new training approaches will be necessary to achieve information-optimal parameter inference from non-linear simulations.","abx":0,"nw":0,"d":"2025-03-17","dq":0,"y":2025,"au":[62,95,240],"c":30,"cs":0,"bib":"2025A&A...703A.301B","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2503.13755","url":"https://arxiv.org/abs/2503.13755","doi":"10.1051/0004-6361/202554602","tg":{"s":["Latin hypercube","Big Sobol Sequence (BSQ)"],"d":["Power spectra"],"m":["Emulators & regression ML","Fisher forecasts"],"u":["Emulators & regression ML","Fisher forecasts"]},"x":-0.1244,"yy":-0.2644,"p3":[0.4189,0.205,0.4039],"sim":{"k":"e","l":[[153,0.955],[127,0.954],[83,0.948],[208,0.948],[263,0.947]]},"c3":[124.89,83.91,27.99],"c2":[217.02,-24.95],"k":7,"r":[199,227,272,291,339],"rm":0},{"id":"2503.11778","t":"The Power of the Cosmic Web","ab":"We study the cosmological information contained in the cosmic web, categorized as four structure types: nodes, filaments, walls, and voids, using the Quijote simulations and a modified nexus+ algorithm. We show that splitting the density field by the four structure types and combining the power spectrum in each provides much tighter constraints on cosmological parameters than using the power spectrum without splitting. We show the rich information contained in the cosmic web structures -- related to the Hessian of the density field -- for measuring all of the cosmological parameters, and in particular for constraining neutrino mass. We study the constraints as a function of Fourier scale, configuration space smoothing scale, and the underlying field. For the matter field with $k_{\\rm max}=0.5\\,h/{\\rm Mpc}$, we find a factor of $\\times20$ tighter constraints on neutrino mass when using smoothing scales larger than 12.5~Mpc/$h$, and $\\times80$ tighter when using smoothing scales down to 1.95~Mpc/$h$. However, for the CDM+Baryon field we observe a more modest $\\times1.7$ or $\\times3.6$ improvement, for large and small smoothing scales respectively. We release our new python package for identifying cosmic structures pycosmmommf at https://github.com/James11222/pycosmommf to enable future studies of the cosmological information of the cosmic web.","abx":0,"nw":0,"d":"2025-03-14","dq":0,"y":2025,"au":[311,21,323],"c":12,"cs":0,"bib":"2025PhRvD.112f3516S","v":"Physical Review D","lk":"arXiv:2503.11778","url":"https://arxiv.org/abs/2503.11778","doi":"10.1103/grx3-hj7w","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Massive neutrinos","Fisher forecasts","Higher-order statistics"]},"x":0.4941,"yy":-0.0668,"p3":[0.1472,0.6357,-0.3566],"sim":{"k":"e","l":[[282,0.956],[235,0.954],[331,0.952],[241,0.95],[284,0.946]]},"c3":[42.61,208.85,-100.56],"c2":[163.63,106.63],"k":8,"r":[170,173,215,241,249,282,291,292,308,331,339],"rm":0},{"id":"2503.06655","t":"Redshift-Space Distortions in Massive Neutrinos Cosmologies","ab":"We study the Kaiser formula for biased tracers in massive neutrino cosmologies by comparing its predictions with a large set of N-body simulations. In particular, we examine the ambiguity in the definition of the peculiar velocity contribution at linear level, whether it should be expressed in terms of the total matter velocity field or only the cold-matter component, comprised of cold dark matter and baryons. We revisit and extend previous qualitative studies on the topic with larger statistics and including a full fit of halo power spectrum and halo-matter cross-power spectrum measurements. We find clear evidence that the clustering of halos in redshift space is correctly described assuming that halo velocity is tracing the velocity field of cold-matter. The opposite assumption provides a worse fit to the simulated data and can lead to a spurious running of nuisance parameters in the perturbative galaxy power spectrum model.","abx":0,"nw":0,"d":"2025-03-09","dq":0,"y":2025,"au":[238,206,129,205,117,446],"c":9,"cs":0,"bib":"2025PhRvD.112d3545V","v":"Physical Review D","lk":"arXiv:2503.06655","url":"https://arxiv.org/abs/2503.06655","doi":"10.1103/mjsv-885q","tg":{"s":["Massive neutrinos"],"d":["Halo catalogs","Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Massive neutrinos"]},"x":-0.4492,"yy":0.432,"p3":[-0.1534,-0.1627,-0.6387],"sim":{"k":"e","l":[[324,0.948],[299,0.945],[71,0.944],[317,0.944],[4,0.941]]},"c3":[24.69,-23.18,-252.45],"c2":[-47.62,238.25],"k":4,"r":[253,299,323,336,337,339],"rm":0},{"id":"2502.11846","t":"Neural Network Reconstruction of Non-Gaussian Initial Conditions from Dark Matter Halos","ab":"We develop a machine learning approach to reconstructing the cosmological initial conditions from late-time dark matter halo number density fields in redshift space, with the goal of improving sensitivity to cosmological parameters, and in particular primordial non-Gaussianity. Using an U-Net architecture, our model achieves a cross-correlation accuracy of 44% for scales out to $k = 0.4 \\text{ h}/\\text{Mpc}$ between reconstructed and true initial conditions of Quijote 1 Gpc$^3$ simulation boxes with an average halo number density of $\\bar{n} = 4\\times 10^{-4}$ (h/Mpc)$^{3}$ in the tracer field at $z=0$ . We demonstrate that our reconstruction is likely to be optimal for this setup and that it is highly effective at reducing redshift-space distortions. Using a Fisher analysis, we show that reconstruction improves cosmological parameter constraints derived from the power spectrum and bispectrum. By combining the power spectrum monopole, quadrupole, and bispectrum monopole up to $k_{\\rm{max}} = 0.52 \\text{ h}/\\text{Mpc}$, our joint analysis of pre- and post-reconstructed fields from the Quijote simulation suite finds improved marginalized errors on all cosmological parameters. In particular, reconstruction improves constraints on $f_{\\rm{NL}}$ by factors of 1.33, 1.88, and 1.57 for local, equilateral, and orthogonal shapes. Our findings demonstrate the effectiveness of reconstruction in decoupling modes, mitigating redshift-space distortions and maximizing information on cosmology. The results provide important insights into the amount of cosmological information that can be extracted from small scales, and can potentially be used to complement standard analysis of observational data, upon further development.","abx":0,"nw":0,"d":"2025-02-17","dq":0,"y":2025,"au":[318,623,502],"c":9,"cs":0,"bib":"2025JCAP...08..030B","v":"","lk":"arXiv:2502.11846","url":"https://arxiv.org/abs/2502.11846","doi":"10.1088/1475-7516/2025/08/030","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["CNN","Fisher forecasts"],"u":["Fiducial","Fisher derivatives","Density fields"]},"x":-0.3663,"yy":-0.331,"p3":[0.1522,0.259,0.5892],"sim":{"k":"e","l":[[228,0.979],[263,0.961],[242,0.956],[332,0.955],[92,0.955]]},"c3":[71.38,-158.73,10.37],"c2":[171.27,-160.5],"k":1,"r":[123,222,227,228,230,233,257,259,261,264,273,278,285,339],"rm":0},{"id":"2502.09709","t":"Cosmological information content of Betti curves and $k$-nearest neighbor distributions","ab":"We compare the cosmological constraints that can be obtained from halo clustering on non-linear scales ($2 h^{-1}$ Mpc < $r$ < $50 h^{-1}$ Mpc) using Betti curves, a topological summary statistic, and $k$-th nearest neighbor ($k$NN) distributions. We quantify the information content of each summary statistic through Fisher matrices computed from the Quijote simulations. Due to the use of simulation-based Fisher forecasts, we pay careful attention to the convergence of the Fisher matrices by looking at their eigendecompositions. We find that, in general, only two directions in the parameter space have constraints that are well converged given the number of Quijote simulations available. We then compare the information content of each summary statistic in the reduced parameter space $\\{Ω_m, σ_8\\}$. We find that almost all of the information present in the Betti curves comes from the first two, $β_0$ and $β_1$, which track the number of connected components and one-dimensional loops respectively, and almost no constraining power comes from $β_2$ which tracks the number of topological voids. In comparison, we find that the $k$NNs provide very competitive constraints along with several potential advantages in regards to real data. Finally, we find that while the $k$NNs and Betti curves provide some complementary constraints, they are not fully independent, potentially indicating a connection between the two statistics.","abx":0,"nw":0,"d":"2025-02-13","dq":0,"y":2025,"au":[14,254],"c":8,"cs":0,"bib":"2025arXiv250209709O","v":"","lk":"arXiv:2502.09709","url":"https://arxiv.org/abs/2502.09709","doi":"","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Halo catalogs","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.6894,"yy":-0.249,"p3":[-0.0609,0.6183,0.0336],"sim":{"k":"e","l":[[67,0.95],[70,0.938],[61,0.936],[179,0.933],[205,0.933]]},"c3":[-114.74,158.1,-120.37],"c2":[50.91,61.34],"k":0,"r":[112,116,154,167,179,192,204,227,247,249,280,291,310,322,334,336,339],"rm":0},{"id":"2502.07713","t":"Geometric Interpretations of the $k$-Nearest Neighbour Distributions","ab":"The $k$-Nearest Neighbour Cumulative Distribution Functions are measures of clustering for discrete datasets that are fast and efficient to compute. They are significantly more informative than the 2-point correlation function. Their connection to $N$-point correlation functions, void probability functions and Counts-in-Cells is known. However, the connections between the CDFs and other geometric and topological spatial summary statistics are yet to be fully explored in the literature. This understanding will be crucial to find optimally informative summary statistics to analyse data from stage 4 cosmological surveys. We explore quantitatively the geometric interpretations of the $k$NN CDF summary statistics. We establish an equivalence between the 1NN CDF at radius $r$ and the volume of spheres with the same radius around the data points. We show that higher $k$NN CDFs are equivalent to the volumes of intersections of $\\ge k$ spheres around the data points. We present similar geometric interpretations for the $k$NN cross-correlation joint CDFs. We further show that the volume, or the CDFs, have information about the angles and arc lengths created at the intersections of spheres around the data points, which can be accessed through the derivatives of the CDF. We show this information is very similar to that captured by Germ Grain Minkowski Functionals. Using a Fisher analysis we compare the information content and constraining power of various data vectors constructed from the $k$NN CDFs and Minkowski Functionals. We find that the CDFs and their derivatives and the Minkowski Functionals have nearly identical information content. However, $k$NN CDFs are computationally orders of magnitude faster to evaluate. Finally, we find that there is information in the full shape of the CDFs, and therefore caution against using the values of the CDF only at sparsely sampled radii.","abx":0,"nw":0,"d":"2025-02-11","dq":0,"y":2025,"au":[378,73,631],"c":9,"cs":0,"bib":"2025MNRAS.543.3409G","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2502.07713","url":"https://arxiv.org/abs/2502.07713","doi":"10.1093/mnras/staf1637","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Halo catalogs","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Halo catalogs"]},"x":0.4562,"yy":-0.3879,"p3":[0.6645,0.1355,-0.5846],"sim":{"k":"e","l":[[322,0.957],[152,0.946],[310,0.945],[87,0.934],[247,0.933]]},"c3":[-151.53,131.17,-99.48],"c2":[68.8,53.12],"k":2,"r":[111,179,211,234,247,257,280,295,310,322,339],"rm":0},{"id":"2502.05262","t":"Cosmological Inference with Cosmic Voids and Neural Network Emulators","ab":"Cosmic Voids are a promising probe of cosmology for spectroscopic galaxy surveys due to their unique response to cosmological parameters. Their combination with other probes promises to break parameter degeneracies. Due to simplifying assumptions, analytical models for void statistics are only representative of a subset of the full void population. We present a set of neural-based emulators for void summary statistics of watershed voids, which retain more information about the full void population than simplified analytical models. We build emulators for the void size function and void density profiles traced by the halo number density using the Quijote suite of simulations for a broad range of the $Λ\\mathrm{CDM}$ parameter space. The emulators replace the computation of these statistics from computationally expensive cosmological simulations. We demonstrate the cosmological constraining power of voids using our emulators, which offer orders-of-magnitude acceleration in parameter estimation, capture more cosmological information compared to analytic models, and produce more realistic posteriors compared to Fisher forecasts. We find that the parameters $Ω_m$ and $σ_8$ in this Quijote setup can be recovered to $14.4\\%$ and $8.4\\%$ accuracy respectively using void density profiles; including the additional information in the void size function improves the accuracy on $σ_8$ to $6.8\\%$. We demonstrate the robustness of our approach to two important variables in the underlying simulations, the resolution, and the inclusion of baryons. We find that our pipeline is robust to variations in resolution, and we show that the posteriors derived from the emulated void statistics are unaffected by the inclusion of baryons with the Magneticum hydrodynamic simulations. This opens up the possibility of a baryon-independent probe of the large-scale structure.","abx":0,"nw":0,"d":"2025-02-07","dq":0,"y":2025,"au":[367,486,407,485,139,375],"c":9,"cs":0,"bib":"2026A&A...705A..62L","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2502.05262","url":"https://arxiv.org/abs/2502.05262","doi":"10.1051/0004-6361/202554592","tg":{"s":["Latin hypercube","Non-Quijote simulations"],"d":["Halo catalogs","Void catalogs"],"m":["Emulators & regression ML"],"u":["Latin hypercube"]},"x":0.2946,"yy":-0.6748,"p3":[0.161,-0.4605,0.1881],"sim":{"k":"e","l":[[240,0.966],[297,0.963],[57,0.946],[339,0.946],[82,0.945]]},"c3":[-46.45,78.85,9.03],"c2":[82.6,-1.73],"k":9,"r":[156,171,188,214,215,240,249,260,286,297,332,339],"rm":0},{"id":"2502.03139","t":"Fast Sampling of Cosmological Initial Conditions with Gaussian Neural Posterior Estimation","ab":"Knowledge of the primordial matter density field from which the large-scale structure of the Universe emerged over cosmic time is of fundamental importance for cosmology. However, reconstructing these cosmological initial conditions from late-time observations is a notoriously difficult task, which requires advanced cosmological simulators and sophisticated statistical methods to explore a multi-million-dimensional parameter space. We show how simulation-based inference (SBI) can be used to tackle this problem and to obtain data-constrained realisations of the primordial dark matter density field in a simulation-efficient way with general non-differentiable simulators. Our method is applicable to full high-resolution dark matter $N$-body simulations and is based on modelling the posterior distribution of the constrained initial conditions to be Gaussian with a diagonal covariance matrix in Fourier space. As a result, we can generate thousands of posterior samples within seconds on a single GPU, orders of magnitude faster than existing methods, paving the way for sequential SBI for cosmological fields. Furthermore, we perform an analytical fit of the estimated dependence of the covariance on the wavenumber, effectively transforming any point-estimator of initial conditions into a fast sampler. We test the validity of our obtained samples by comparing them to the true values with summary statistics and performing a Bayesian consistency test.","abx":0,"nw":0,"d":"2025-02-05","dq":0,"y":2025,"au":[495,265,236,492,136],"c":10,"cs":0,"bib":"2026MNRAS.549ag977S","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2502.03139","url":"https://arxiv.org/abs/2502.03139","doi":"10.1093/mnras/stag977","tg":{"s":["Quijote (set not stated)"],"d":["Density fields"],"m":["Simulation-based inference"],"u":[]},"x":-0.6354,"yy":-0.4792,"p3":[0.6094,0.0055,0.5567],"sim":{"k":"e","l":[[134,0.968],[188,0.955],[110,0.951],[230,0.95],[260,0.946]]},"c3":[120.86,-72.37,124.55],"c2":[171.57,-204.88],"k":1,"r":[55,105,156,188,208,222,228,230,233,260,339],"rm":0},{"id":"2502.13242","t":"Learning the Universe: $3\\ h^{-1}{\\rm Gpc}$ Tests of a Field Level $N$-body Simulation Emulator","ab":"We apply and test a field-level emulator for non-linear cosmic structure formation in a volume matching next-generation surveys. Inferring the cosmological parameters and initial conditions from which the particular galaxy distribution of our Universe was seeded can be achieved by comparing simulated data to observational data. Previous work has focused on building accelerated forward models that efficiently mimic these simulations. One of these accelerated forward models uses machine learning to apply a non-linear correction to the linear $z=0$ Zeldovich approximation (ZA) fields, closely matching the cosmological statistics in the $N$-body simulation. This emulator was trained and tested at $(h^{-1}{\\rm Gpc})^3$ volumes, although cosmological inference requires significantly larger volumes. We test this emulator at $(3\\ h^{-1}{\\rm Gpc})^3$ by comparing emulator outputs to $N$-body simulations for eight unique cosmologies. We consider several summary statistics, applied to both the raw particle fields and the dark matter (DM) haloes. We find that the power spectrum, bispectrum and wavelet statistics of the raw particle fields agree with the $N$-body simulations within ${\\sim} 5 \\%$ at most scales. For the haloes, we find a similar agreement between the emulator and the $N$-body for power spectrum and bispectrum, though a comparison of the stacked profiles of haloes shows that the emulator has slight errors in the positions of particles in the highly non-linear interior of the halo. At these large $(3\\ h^{-1}{\\rm Gpc})^3$ volumes, the emulator can create $z=0$ particle fields in a thousandth of the time required for $N$-body simulations and will be a useful tool for large-scale cosmological inference. This is a Learning the Universe publication.","abx":0,"nw":1,"d":"2025-02-18","dq":0,"y":2025,"au":[449,448,240,187,406,263],"c":1,"cs":0,"bib":"2025arXiv250213242S","v":"","lk":"arXiv:2502.13242","url":"https://arxiv.org/abs/2502.13242","doi":"","tg":{"s":["Latin hypercube","Non-Quijote simulations"],"d":["Particle snapshots","Halo catalogs","Power spectra","Higher-order statistics"],"m":["CNN","Emulators & regression ML"],"u":["Non-Quijote simulations"]},"x":-0.4973,"yy":-0.4634,"p3":[0.2926,0.0241,0.2425],"sim":{"k":"e","l":[[260,0.953],[313,0.951],[188,0.947],[127,0.947],[329,0.946]]},"c3":[101.76,89.39,112.12],"c2":[182.61,-77.43],"k":1,"r":[146,147,156,183,185,188,189,205,214,260,291,339],"rm":0},{"id":"2412.15405","t":"Cosmology with Persistent Homology: Parameter Inference via Machine Learning","ab":"Building upon [2308.02636], we investigate the constraining power of persistent homology on cosmological parameters and primordial non-Gaussianity in a likelihood-free inference pipeline utilizing machine learning. We evaluate the ability of Persistence Images (PIs) to infer parameters, comparing them to the combined Power Spectrum and Bispectrum (PS/BS). We also compare two classes of models: neural-based and tree-based. PIs consistently lead to better predictions compared to the combined PS/BS for parameters that can be constrained, i.e., for $\\{Ω_{\\rm m}, σ_8, n_{\\rm s}, f_{\\rm NL}^{\\rm loc}\\}$. PIs perform particularly well for $f_{\\rm NL}^{\\rm loc}$, highlighting the potential of persistent homology for constraining primordial non-Gaussianity. Our results indicate that combining PIs with PS/BS provides only marginal gains, indicating that the PS/BS contains little additional or complementary information to the PIs. Finally, we provide a visualization of the most important topological features for $f_{\\rm NL}^{\\rm loc}$ and for $Ω_{\\rm m}$. This reveals that clusters and voids (0-cycles and 2-cycles) are most informative for $Ω_{\\rm m}$, while $f_{\\rm NL}^{\\rm loc}$ is additionally informed by filaments (1-cycles).","abx":0,"nw":0,"d":"2024-12-19","dq":0,"y":2024,"au":[348,308,248,343,19,251],"c":7,"cs":0,"bib":"2025JCAP...09..064C","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2412.15405","url":"https://arxiv.org/abs/2412.15405","doi":"10.1088/1475-7516/2025/09/064","tg":{"s":["Latin hypercube","Quijote-PNG"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Simulation-based inference","Other ML"],"u":["Latin hypercube","Halo catalogs"]},"x":0.7581,"yy":-0.2004,"p3":[-0.53,0.6828,0.0535],"sim":{"k":"e","l":[[179,0.963],[67,0.95],[63,0.948],[192,0.938],[40,0.938]]},"c3":[-56.6,174.47,-41.31],"c2":[120.78,46.16],"k":9,"r":[128,129,142,143,169,175,176,178,179,181,185,186,189,192,204,226,234,238,240,255,262,264,272,291,301,322,331,333,334,339],"rm":0},{"id":"title:onepointmatterpdfsbeyondtophatfilters","t":"One-point matter pdf’s beyond tophat filters","ab":"","abx":0,"nw":0,"d":"2026","dq":0,"y":2026,"au":[38],"c":0,"cs":1,"bib":"","v":"","lk":"Master thesis","url":"https://macsphere.mcmaster.ca/bitstream/11375/30971/2/Kayssi_Alex_202412_MSc.pdf","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Quijote (set not stated)","Density fields","Higher-order statistics","Perturbation theory & analytic models","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.0608,"yy":0.3446,"p3":[-0.1483,0.005,-0.7034],"sim":{"k":"e","l":[[155,0.94],[329,0.937],[23,0.936],[334,0.934],[143,0.933]]},"c3":[-249.93,7.05,235.58],"c2":[-349.31,-54.16],"k":2,"r":[],"rm":1},{"id":"2412.05662","t":"Probing massive neutrinos and modified gravity with redshift-space morphologies and anisotropies of large-scale structure","ab":"Strong degeneracy exists between some modified gravity (MG) models and massive neutrinos because the enhanced structure growth produced by modified gravity can be suppressed due to the free-streaming massive neutrinos. Previous works showed this degeneracy can be broken with non-Gaussian or velocity information. Therefore in this work, we focus on the large-scale structure (LSS) in redshift space and investigate for the first time the possibility of using the non-Gaussian information and velocity information captured by the 3D scalar Minkowski functionals (MFs) and the 3D Minkowski tensors (MTs) to break this degeneracy. Based on the Quijote and Quijote-MG simulations, we find the imprints on redshift space LSS left by the Hu-Sawicki $f(R)$ gravity can be discriminated from those left by massive neutrinos with these statistics. With the Fisher information formalism, we first show how the MTs extract information with their perpendicular and parallel elements for both low- and high-density regions; then we compare constraints from the power spectrum monopole and MFs in real space with those in redshift space, and investigate how the constraining power is further improved with anisotropies captured by the quadrupole and hexadecapole of the power spectrum and the MTs; finally, we combine the power spectrum multipoles with MFs plus MTs and find the constraints from the power spectrum multipoles on $Ω_{\\mathrm{m}}, h, σ_8$, $M_ν$, and $f_{R_0}$ can be improved, because they are complemented with non-Gaussian information, by a factor of 3.4, 3.0, 3.3, 3.3, and 1.9 on small scales ($k_{\\rm{max}}=0.5~h\\rm{Mpc}^{-1},\\ R_G=5~h^{-1}\\rm{Mpc}$), and 2.8, 2.2, 3.4, 3.4, and 1.5 on large scales ($k_{\\rm{max}}=0.25~h\\rm{Mpc}^{-1},\\ R_G=10~h^{-1}\\rm{Mpc}$).","abx":0,"nw":0,"d":"2024-12-07","dq":0,"y":2024,"au":[654,395,240,424,253,659],"c":5,"cs":0,"bib":"2025JCAP...04..088L","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2412.05662","url":"https://arxiv.org/abs/2412.05662","doi":"10.1088/1475-7516/2025/04/088","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Quijote-MG"],"d":["Density fields","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Massive neutrinos","Density fields"]},"x":0.5439,"yy":0.3724,"p3":[-0.3918,0.4979,-0.0413],"sim":{"k":"e","l":[[4,0.935],[154,0.934],[157,0.932],[61,0.932],[73,0.931]]},"c3":[69.24,175.5,-74.08],"c2":[199.84,176.2],"k":3,"r":[157,167,213,227,234,245,249,251,257,264,273,275,291,293,308,312,331,336,339],"rm":0},{"id":"2412.04807","t":"Testing $f(R)$ Gravity from Cosmic Shear Measurements","ab":"In this work, we perform a detailed analysis to constrain the Hu-Sawicki \\(f(R)\\) gravity model, using cosmic shear data from three prominent Stage-III weak lensing surveys: DES-Y3, KiDS-1000, and HSC-Y3. To accurately model the nonlinear matter clustering in the analysis of cosmic shear signals, we employ \\texttt{FREmu}, a recently developed power spectrum emulator for the \\(f(R)\\) gravity trained on the Quijote-MG simulations. This emulator achieves precise predictions, limiting the errors to 5\\% on scales of \\(0.009h\\,{\\rm Mpc}^{-1} < k < 0.5h\\,{\\rm Mpc}^{-1}\\). Our findings reveal that cosmic shear data alone impose only weak constraints on the \\(f(R)\\) parameter \\(\\log_{10}|f_{R_0}|\\). To improve these constraints, we incorporate state-of-the-art external observations, including data from the cosmic microwave background and baryon acoustic oscillations. The inclusion of these external datasets significantly enhances the constraints, yielding an upper limit of \\(\\log_{10}|f_{R_0}| < -4.98\\) at the 95\\% confidence level.","abx":0,"nw":0,"d":"2024-12-06","dq":0,"y":2024,"au":[324,357,261],"c":9,"cs":0,"bib":"2025ApJ...992..205B","v":"Astrophysical Journal","lk":"arXiv:2412.04807","url":"https://arxiv.org/abs/2412.04807","doi":"10.3847/1538-4357/ae07c4","tg":{"s":["Quijote-MG"],"d":["Power spectra","Weak lensing & 2D maps"],"m":["Emulators & regression ML"],"u":[]},"x":0.1152,"yy":-0.4091,"p3":[-0.3608,0.3684,0.1512],"sim":{"k":"e","l":[[171,0.951],[181,0.94],[203,0.937],[135,0.937],[264,0.935]]},"c3":[-132.24,37.95,52.12],"c2":[-68.93,109.49],"k":5,"r":[171,339],"rm":0},{"id":"title:inspectingsignaturesofparityviolationwithangularredshiftfluctuations","t":"Inspecting signatures of parity violation with angular redshift fluctuations","ab":"","abx":0,"nw":0,"d":"2024","dq":1,"y":2024,"au":[445],"c":0,"cs":2,"bib":"","v":"","lk":"Master Thesis","url":"https://amslaurea.unibo.it/id/eprint/34113/1/Matteo_Santini_MasterThesis.pdf","doi":"","tg":{"s":["Quijote-Odd (parity-violating)"],"d":["Galaxy mocks (HOD)","Higher-order statistics","Redshift space","Weak lensing & 2D maps"],"m":["No ML"],"u":["Galaxy mocks (HOD)","Higher-order statistics","Redshift space","Weak lensing & 2D maps","No ML","Quijote-Odd (parity-violating)"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.0531,"yy":0.8664,"p3":[-0.7277,0.0288,-0.2212],"sim":{"k":"w","l":[[182,0.238],[7,0.221],[221,0.201],[81,0.153],[315,0.073]]},"c3":[-207.25,-161.75,219.9],"c2":[-320.1,-145.46],"k":5,"r":[],"rm":1},{"id":"2412.01888","t":"The Millennium and Astrid galaxies in effective field theory: comparison with galaxy-halo connection models at the field level","ab":"Cosmological analyses of redshift space clustering data are primarily based on using luminous ``red'' galaxies (LRGs) and ``blue'' emission line galaxies (ELGs) to trace underlying dark matter. Using the large high-fidelity high-resolution MillenniumTNG (MTNG) and Astrid simulations, we study these galaxies with the effective field theory (EFT)-based field level forward model. We confirm that both red and blue galaxies can be accurately modeled with EFT at the field level and their parameters match those of the phenomenological halo-based models. Specifically, we consider the state of the art Halo Occupation Distribution (HOD) and High Mass Quenched (HMQ) models for the red and blue galaxies, respectively. Our results explicitly confirm the validity of the halo-based models on large scales beyond the two-point statistics. In addition, we validate the field-level HOD/HMQ-based priors for EFT full-shape analysis. We find that the local bias parameters of the ELGs are in tension with the predictions of the LRG-like HOD models and present a simple analytic argument explaining this phenomenology. We also confirm that ELGs exhibit weaker non-linear redshift-space distortions (``fingers-of-God''), suggesting that a significant fraction of their data should be perturbative. We find that the response of EFT parameters to galaxy selection is sensitive to assumptions about baryonic feedback, suggesting that a detailed understanding of feedback processes is necessary for robust predictions of EFT parameters. Finally, using neural density estimation based on paired HOD-EFT parameter samples, we obtain optimal HOD models that reproduce the clustering of Astrid and MTNG galaxies.","abx":0,"nw":0,"d":"2024-12-02","dq":0,"y":2024,"au":[465,118,57,460,697,598,102,151,386,532,652],"c":31,"cs":0,"bib":"2024arXiv241201888I","v":"","lk":"arXiv:2412.01888","url":"https://arxiv.org/abs/2412.01888","doi":"","tg":{"s":["Molino / HOD galaxy mocks","Non-Quijote simulations"],"d":["Density fields","Galaxy mocks (HOD)","Redshift space"],"m":["Normalizing flows","Perturbation theory & analytic models"],"u":["Molino / HOD galaxy mocks","Normalizing flows"]},"x":-0.2221,"yy":0.0524,"p3":[-0.02,-0.3113,-0.2544],"sim":{"k":"e","l":[[146,0.939],[203,0.938],[37,0.938],[329,0.935],[115,0.934]]},"c3":[221.55,11.94,12.88],"c2":[268.14,-87.17],"k":0,"r":[146,173,186,198,199,200,201,339],"rm":0},{"id":"title:fastimplementationofnonlinearperturbationtheorystatisticsincludinggalaxybiasandr","t":"Fast implementation of nonlinear perturbation theory statistics including galaxy bias and redshift-space distortion","ab":"","abx":0,"nw":0,"d":"2024","dq":1,"y":2024,"au":[346],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://etda.libraries.psu.edu/files/final_submissions/31497","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Quijote (set not stated)","Power spectra","Higher-order statistics","Redshift space","Perturbation theory & analytic models","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.4586,"yy":0.4152,"p3":[-0.1625,0.2748,-0.4207],"sim":{"k":"w","l":[[314,0.164],[93,0.126],[213,0.118],[143,0.105],[28,0.105]]},"c3":[-208.0,152.77,234.72],"c2":[-342.06,104.96],"k":5,"r":[],"rm":1},{"id":"2412.00968","t":"Probing primordial non-Gaussianity by reconstructing the initial conditions","ab":"We propose to constrain the primordial (local-type) non-Gaussianity signal by first reconstructing the initial density field to remove the late time non-Gaussianities introduced by gravitational evolution. Our reconstruction algorithm combines perturbation theory on large scales with a convolutional neural network on small scales. We reconstruct the squared potential (that sources the non-Gaussian signal) out to $k=0.2\\ h$/Mpc to an accuracy of 99.8%. We cross-correlate this squared potential field with the reconstructed density field and verify that this computationally inexpensive estimator has the same information content as the full matter bispectrum. As a proof of concept, our approach can yield up to a factor of three improvement in the $f_{\\rm NL}$ constraints, although it does not yet include the complications of galaxy bias or imperfections in the reconstruction. These potential improvements make it a promising alternative to current approaches to constraining primordial non-Gaussianity.","abx":0,"nw":0,"d":"2024-12-01","dq":0,"y":2024,"au":[675,490,160],"c":17,"cs":0,"bib":"2025JCAP...08..055C","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2412.00968","url":"https://arxiv.org/abs/2412.00968","doi":"10.1088/1475-7516/2025/08/055","tg":{"s":["Quijote-PNG"],"d":["Density fields","Higher-order statistics"],"m":["CNN","Fisher forecasts","Perturbation theory & analytic models"],"u":["Quijote-PNG","Fisher forecasts"]},"x":0.0636,"yy":0.5994,"p3":[-0.5647,-0.0911,0.2333],"sim":{"k":"e","l":[[259,0.962],[228,0.958],[141,0.949],[62,0.949],[242,0.949]]},"c3":[18.35,-153.84,69.56],"c2":[130.43,-235.4],"k":1,"r":[133,141,173,181,186,194,222,228,229,257,263,264,339],"rm":0},{"id":"title:towardsreliablesimulationbasedinference","t":"Towards Reliable Simulation-based Inference","ab":"","abx":0,"nw":0,"d":"2026","dq":0,"y":2026,"au":[74],"c":0,"cs":1,"bib":"","v":"arXiv.org","lk":"PhD thesis","url":"https://orbi.uliege.be/bitstream/2268/325940/1/these.pdf","doi":"10.48550/arXiv.2603.08947","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra"],"m":["Simulation-based inference"],"u":["Quijote (set not stated)","Power spectra","Simulation-based inference"],"n":"No abstract available: tags guessed from the title only; please check."},"x":-0.0446,"yy":-0.3256,"p3":[0.7089,-0.0912,0.1513],"sim":{"k":"e","l":[[10,0.927],[227,0.918],[153,0.912],[298,0.899],[127,0.899]]},"c3":[89.07,181.76,284.28],"c2":[209.5,348.86],"k":6,"r":[],"rm":1},{"id":"2411.18399","t":"De-baryonifying halos via optimal transport","ab":"Baryonic feedback uncertainty is a limiting systematic for next-generation weak gravitational lensing analyses. At the same time, high-resolution weak lensing maps are best analyzed at the field-level. Thus, robustly accounting for the baryonic effects in the projected matter density field is required. Ideally, constraints on feedback strength from astrophysical probes should be folded into the weak lensing field-level likelihood. We propose a macroscopic method based on an empirical correlation between feedback strength and an optimal transport cost. Since feedback is local re-distribution of matter, optimal transport is a promising concept. In this proof-of-concept, we de-baryonify projected mass around individual halos in the IllustrisTNG simulation. We choose the de-baryonified solution as the point of maximum likelihood on the hypersurface defined by fixed optimal transport cost around the observed full-physics halos. The likelihood is approximated through a normalizing flow trained on multiple gravity-only simulations. We find that the set of de-baryonified halos reproduces the correct convergence power spectrum suppression. There is considerable scatter when considering individual halos. We outline how the optimal transport de-baryonification concept can be generalized to full convergence maps.","abx":0,"nw":0,"d":"2024-11-27","dq":0,"y":2024,"au":[391],"c":0,"cs":0,"bib":"2024arXiv241118399T","v":"","lk":"arXiv:2411.18399","url":"https://arxiv.org/abs/2411.18399","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Weak lensing & 2D maps"],"m":["Normalizing flows"],"u":[]},"x":-0.1993,"yy":0.6861,"p3":[-0.4361,-0.3979,-0.3088],"sim":{"k":"e","l":[[148,0.941],[324,0.935],[193,0.925],[180,0.925],[155,0.924]]},"c3":[-77.29,-96.23,124.94],"c2":[-101.26,-180.83],"k":4,"r":[148,180,216,339],"rm":0},{"id":"2411.16500","t":"Cosmic Structure Formation in the Non-linear Regime: Beyond Gaussian Statistics and Standard Cosmologies","ab":"The cosmic large scale structure encodes the formation and evolution of a weblike network of dark matter and galaxies within the Universe. The cosmological information is wrapped up in non-Gaussian statistics requiring characterisation beyond two-point correlations. Accurate modelling of these non-Gaussian statistics and the underlying non-linear dynamics of gravitational collapse are key to extracting maximal information from ongoing and upcoming cosmological surveys. This thesis centres on questions relating to clustering statistics, dynamics, and fundamental physics: A. How can we efficiently characterise the statistics of the late time matter field? B. How can we capture the non-linear phase-space dynamics of gravitational collapse? C. How do changes to fundamental physics impact those clustering statistics and dynamics? Specifically we present four aspects addressing these questions: 1. We demonstrate the probability distribution function (PDF) of the matter density can be accurately predicted in modified gravity and dynamical dark energy models, and that it provides good complementarity to standard two-point analyses for detecting these features. 2. We demonstrate the joint PDF of densities in two cells can be used to predict the covariance of the one-point PDF in simple clustering models, providing estimates of the density dependent clustering and super-sample covariance missed in cosmological simulations. 3. We use a wave-based forward model of dark matter to demonstrate its capability to encode the full phase-space dynamics beyond a perfect fluid and determine certain universal scaling features in such models. 4. Using the wave dark matter forward model we analyse one-point statistics to complement existing analytic and numerical approaches in studying fundamentally wavelike dark matter.","abx":0,"nw":0,"d":"2024-11-25","dq":0,"y":2024,"au":[33],"c":0,"cs":0,"bib":"2024arXiv241116500G","v":"","lk":"arXiv:2411.16500","url":"https://arxiv.org/abs/2411.16500","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Non-Quijote simulations"]},"x":0.0329,"yy":0.3288,"p3":[-0.3022,-0.1669,-0.2544],"sim":{"k":"e","l":[[25,0.946],[23,0.934],[309,0.93],[292,0.929],[143,0.926]]},"c3":[-0.39,10.61,-213.48],"c2":[9.09,120.79],"k":2,"r":[262,281,290,294,326,331,333,339],"rm":0},{"id":"2411.14748","t":"Cosmological Analysis with Calibrated Neural Quantile Estimation and Approximate Simulators","ab":"A major challenge in extracting information from current and upcoming surveys of cosmological Large-Scale Structure (LSS) is the limited availability of computationally expensive high-fidelity simulations. We introduce calibrated Neural Quantile Estimation (NQE), a new Simulation-Based Inference (SBI) method that leverages a large number of approximate simulations for training and a small number of high-fidelity simulations for calibration. This approach guarantees an unbiased posterior regardless of approximate simulation accuracy, while achieving near-optimal constraining power when the approximate simulations are reasonably accurate. As a proof of concept, we demonstrate that cosmological parameters can be inferred at field level from projected 2-dim dark matter density maps up to $k_{\\rm max}\\sim1.5\\,h$/Mpc at $z=0$ by training on $\\sim10^4$ Particle-Mesh (PM) simulations with transfer function correction and calibrating with $\\sim10^2$ Particle-Particle (PP) simulations. The calibrated posteriors closely match those obtained by directly training on $\\sim10^4$ expensive PP simulations, but at a fraction of the computational cost. Our method offers a practical and scalable framework for SBI of cosmological LSS, enabling precise inference across vast volumes and down to small scales.","abx":0,"nw":0,"d":"2024-11-22","dq":0,"y":2024,"au":[275],"c":9,"cs":0,"bib":"2026PhRvL.136p1001J","v":"Physical Review Letters","lk":"arXiv:2411.14748","url":"https://arxiv.org/abs/2411.14748","doi":"10.1103/d2dl-kznp","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Weak lensing & 2D maps"],"m":["Simulation-based inference"],"u":["Non-Quijote simulations"]},"x":-0.1582,"yy":-0.2786,"p3":[0.6626,0.157,0.3368],"sim":{"k":"e","l":[[208,0.955],[107,0.954],[153,0.954],[115,0.947],[142,0.945]]},"c3":[148.18,83.81,58.28],"c2":[249.61,-55.01],"k":1,"r":[136,156,173,208,291,339],"rm":0},{"id":"2411.14377","t":"The constraining power of the Marked Power Spectrum: an analytical study","ab":"The marked power spectrum - a two-point correlation function of a transformed density field - has emerged as a promising tool for extracting cosmological information from the large-scale structure of the Universe. In this work, we present the first comprehensive analytical study of the marked power spectrum's sensitivity to primordial non-Gaussianity (PNG) of the non-local type. We extend previous effective field theory frameworks to incorporate PNG, developing a complete theoretical model that we validate against the Quijote simulation suite. Through a systematic Fisher analysis, we compare the constraining power of the marked power spectrum against traditional approaches combining the power spectrum and bispectrum (P+B). We explore different choices of mark parameters to evaluate their impact on parameter constraints, particularly focusing on equilateral and orthogonal PNG as well as neutrino masses. Our analysis shows that while marking up underdense regions yields optimal constraints in the low shot-noise regime, the marked power spectrum's performance for discrete tracers with BOSS-like number densities does not surpass that of P+B analysis at mildly non-linear scales ($k \\lesssim 0.25 \\,h/\\text{Mpc}$). However, the marked approach offers several practical advantages, including simpler estimation procedures and potentially more manageable systematic effects. Our theoretical framework reveals how the marked power spectrum incorporates higher-order correlation information through terms resembling tree-level bispectra and power spectrum convolutions. This work establishes a robust foundation for applying marked statistics to future large-volume surveys.","abx":0,"nw":0,"d":"2024-11-21","dq":0,"y":2024,"au":[427,247,462,55,237,17,424,665,176,240,98],"c":8,"cs":0,"bib":"2025JCAP...09..036M","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2411.14377","url":"https://arxiv.org/abs/2411.14377","doi":"10.1088/1475-7516/2025/09/036","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Quijote-PNG"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Fisher derivatives","Quijote-PNG","Massive neutrinos","Halo catalogs"]},"x":-0.0608,"yy":0.3601,"p3":[0.0967,-0.0442,-0.3736],"sim":{"k":"e","l":[[326,0.959],[23,0.958],[331,0.954],[317,0.945],[334,0.943]]},"c3":[70.5,-9.37,-67.09],"c2":[193.53,-41.13],"k":5,"r":[141,146,157,173,176,178,181,186,199,201,204,226,234,242,247,257,259,262,264,266,272,291,304,312,317,326,331,339],"rm":0},{"id":"2411.14392","t":"Convolutional Vision Transformer for Cosmology Parameter Inference","ab":"Parameter inference is a crucial task in modern cosmology that requires accurate and fast computational methods to handle the high precision and volume of observational datasets. In this study, we explore a hybrid vision transformer, the Convolution vision Transformer (CvT), which combines the benefits of vision transformers (ViTs) and convolutional neural networks (CNNs). We use this approach to infer the $Ω_m$ and $σ_8$ cosmological parameters from simulated dark matter and halo fields. Our experiments indicate that the constraints on $Ω_m$ and $σ_8$ obtained using CvT are better than ViT and CNN, using either dark matter or halo fields. For CvT, pretraining on dark matter fields proves advantageous for improving constraints using halo fields compared to training a model from the beginning. However, ViT and CNN do not show these benefits. The CvT is more efficient than ViT since, despite having more parameters, it requires a training time similar to that of ViT and has similar inference times. The code is available at \\url{https://github.com/Yash-10/cvt-cosmo-inference/}.","abx":0,"nw":0,"d":"2024-11-21","dq":0,"y":2024,"au":[680,368],"c":3,"cs":0,"bib":"2024arXiv241114392G","v":"","lk":"arXiv:2411.14392","url":"https://arxiv.org/abs/2411.14392","doi":"","tg":{"s":["Latin hypercube"],"d":["Density fields","Halo catalogs"],"m":["CNN","Other ML"],"u":["Latin hypercube"]},"x":-0.2592,"yy":-0.4379,"p3":[0.3378,0.3446,0.5725],"sim":{"k":"e","l":[[175,0.941],[254,0.938],[110,0.937],[169,0.936],[222,0.933]]},"c3":[-17.51,98.75,11.56],"c2":[131.74,-45.34],"k":1,"r":[198,301,339],"rm":0},{"id":"2410.21457","t":"A revisited Correction to the Halo Mass Function for local-type Primordial non-Gaussianity","ab":"We investigate the effect of primordial non-Gaussianities on halo number counts using N-body simulations with different values of $f_{\\rm NL}^{\\rm loc}$. We show how current theoretical models fail to adequately describe the non-Gaussian mass function of halos identified with different overdensity thresholds, $Δ_{\\rm b}$. We explain how these discrepancies are related to a variation in the density profile of dark matter halos, finding that the internal steepness (i.e. the compactness) of halos depends on the value of $f_{\\rm NL}^{\\rm loc}$. We then parametrize these deviations in halo number counts with a factor $κ(Δ_{\\rm b})$ that modifies the linear density threshold for collapse according to the halo identification threshold used, defined with respect to the Universe background density. We rely on a second-degree polynomial to describe $κ$ and employ a Bayesian analysis to determine the coefficients of this polynomial. In addition, we verify the independence of the latter on the sign and absolute value of $f_{\\rm NL}^{\\rm loc}$. Finally, we show how this re-parametrization prevents the extraction of biased constraints on $f_{\\rm NL}^{\\rm loc}$, correcting for large systematic errors especially in the case of halos identified with high density thresholds. This improvement is crucial in the perspective of deriving cosmological constraints with the non-Gaussian mass function from real data, as different mass definitions can be employed depending on the properties of the survey.","abx":0,"nw":0,"d":"2024-10-28","dq":0,"y":2024,"au":[401,597,225,71,424,52,388],"c":3,"cs":0,"bib":"2025JCAP...06..053F","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2410.21457","url":"https://arxiv.org/abs/2410.21457","doi":"10.1088/1475-7516/2025/06/053","tg":{"s":["Quijote-PNG"],"d":["Particle snapshots","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Quijote-PNG","Particle snapshots"]},"x":-0.0043,"yy":0.75,"p3":[-0.8191,-0.1162,-0.0034],"sim":{"k":"e","l":[[163,0.945],[204,0.941],[259,0.941],[333,0.939],[181,0.935]]},"c3":[-141.59,-61.62,-71.32],"c2":[-16.44,-111.84],"k":4,"r":[193,226,242,257,264,297,308,339],"rm":0},{"id":"2410.20516","t":"A Cosmic-Scale Benchmark for Symmetry-Preserving Data Processing","ab":"Efficiently processing structured point cloud data while preserving multiscale information is a key challenge across domains, from graphics to atomistic modeling. Using a curated dataset of simulated galaxy positions and properties, represented as point clouds, we benchmark the ability of graph neural networks to simultaneously capture local clustering environments and long-range correlations. Given the homogeneous and isotropic nature of the Universe, the data exhibits a high degree of symmetry. We therefore focus on evaluating the performance of Euclidean symmetry-preserving ($E(3)$-equivariant) graph neural networks, showing that they can outperform non-equivariant counterparts and domain-specific information extraction techniques in downstream performance as well as simulation-efficiency. However, we find that current architectures fail to capture information from long-range correlations as effectively as domain-specific baselines, motivating future work on architectures better suited for extracting long-range information.","abx":0,"nw":0,"d":"2024-10-27","dq":0,"y":2024,"au":[352,586,118,633,621],"c":8,"cs":0,"bib":"2024arXiv241020516B","v":"arXiv.org","lk":"arXiv:2410.20516","url":"https://arxiv.org/abs/2410.20516","doi":"10.48550/arXiv.2410.20516","tg":{"s":["Quijote (set not stated)"],"d":["Galaxy mocks (HOD)"],"m":["Graph neural networks"],"u":["Galaxy mocks (HOD)"]},"x":-0.4705,"yy":-0.7808,"p3":[0.1605,-0.139,0.7409],"sim":{"k":"e","l":[[85,0.943],[102,0.939],[20,0.932],[169,0.93],[29,0.927]]},"c3":[-119.07,138.91,55.56],"c2":[-99.14,70.9],"k":6,"r":[255,339],"rm":0},{"id":"2410.18524","t":"Modelling the covariance matrix for the power spectra before and after the BAO reconstruction","ab":"The baryon acoustic oscillation (BAO) reconstruction plays a crucial role in cosmological analysis for spectroscopic galaxy surveys because it can make the density field effectively more linear and more Gaussian. The combination of the power spectra before and after the BAO reconstruction helps break degeneracies among parameters, then improve the constraints on cosmological parameters. It is therefore important to estimate the covariance matrix between pre- and post-reconstructed power spectra. In this work, we use perturbation theory to estimate the covariance matrix of the related power spectra multipoles, and check the accuracy of the derived covariance model using a large suite of dark matter halo catalogs at $z=0.5$. We find that the diagonal part of the auto covariance is well described by the Gaussian prediction, while the cross covariance deviates from the Gaussian prediction quickly when $k > 0.1\\,h\\,\\mathrm{Mpc}^{-1}$. Additionally, we find the non-Gaussian effect in the non-diagonal part of the cross covariance is comparable to, or even stronger than the pre-reconstruction covariance. By adding the non-Gaussian contribution, we obtain good agreement between analytical and numerical covariance matrices in the non-diagonal part up to $k \\simeq 0.15\\,h\\,\\mathrm{Mpc}^{-1}$. The agreement in the diagonal part is also improved, but still under-predicts the correlation in the cross covariance block.","abx":0,"nw":0,"d":"2024-10-24","dq":0,"y":2024,"au":[549,370,705,261],"c":6,"cs":0,"bib":"2024RAA....24l5015Z","v":"Research in Astronomy and Astrophysics","lk":"arXiv:2410.18524","url":"https://arxiv.org/abs/2410.18524","doi":"10.1088/1674-4527/ad8ba1","tg":{"s":["Fiducial"],"d":["Halo catalogs","Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":0.2737,"yy":0.2626,"p3":[0.0579,0.3772,-0.1288],"sim":{"k":"e","l":[[278,0.943],[268,0.931],[164,0.931],[139,0.927],[191,0.927]]},"c3":[168.72,-68.6,-88.36],"c2":[226.76,26.1],"k":3,"r":[190,201,228,232,278,304,339],"rm":0},{"id":"2410.18039","t":"Local Primordial Non-Gaussian Bias at the Field Level","ab":"Local primordial non-Gaussianity (LPNG) couples long-wavelength cosmological fluctuations to the short-wavelength behavior of galaxies. This coupling is encoded in bias parameters including $b_φ$ and $b_{δφ}$ at linear and quadratic order in the large-scale biasing framework. We perform the first field-level measurement of $b_φ$ and $b_{δφ}$ using Lagrangian bias and non-linear displacements from N-body simulations. We compare our field level measurements with universality predictions and separate universe results, finding qualitative consistency, but disagreement in detail. We also quantify the information on $f_{\\mathrm{NL}}^{(\\mathrm{loc})}$ available in the field given various assumptions on knowledge of $b_φ$ at fixed initial conditions. We find that it is not possible to precisely constrain $f_{\\mathrm{NL}}^{(\\mathrm{loc})}$ when marginalizing over $b_φ f_{\\mathrm{NL}}^{(\\mathrm{loc})}$ even at the field level, observing a 2-3X degradation in constraints between a linear and quadratic biasing model on perturbative field-level mocks, suggesting that a $b_φ$ prior is necessary to meaningfully constrain $f_{\\mathrm{NL}}^{(\\mathrm{loc})}$ at the field level even in this idealized scenario. For simulated dark matter halos, the pure $f_{\\mathrm{NL}}^{(\\mathrm{loc})}$ constraints from both linear and quadratic field-level models appear biased when marginalizing over bias parameters including $b_φ$ and $b_{δφ}$ due largely to the $f_{\\mathrm{NL}}^{(\\mathrm{loc})} - b_φ$ degeneracy. Our results are an important consistency test of the large-scale bias framework for LPNG and highlight the importance of physically motivated priors on LPNG bias parameters for future surveys.","abx":0,"nw":0,"d":"2024-10-23","dq":0,"y":2024,"au":[309,578],"c":14,"cs":0,"bib":"2025JCAP...03..016S","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2410.18039","url":"https://arxiv.org/abs/2410.18039","doi":"10.1088/1475-7516/2025/03/016","tg":{"s":["Quijote-PNG"],"d":["Density fields","Particle snapshots","Halo catalogs"],"m":["Perturbation theory & analytic models","No ML"],"u":["Quijote-PNG","Particle snapshots"]},"x":0.273,"yy":0.7544,"p3":[-0.7406,-0.0709,-0.1574],"sim":{"k":"e","l":[[203,0.948],[12,0.945],[68,0.942],[257,0.939],[193,0.936]]},"c3":[-17.95,-128.76,53.06],"c2":[133.23,-212.06],"k":5,"r":[123,146,156,178,179,181,193,204,208,214,222,226,228,242,257,259,260,264],"rm":0},{"id":"2410.15808","t":"Mean-Field Simulation-Based Inference for Cosmological Initial Conditions","ab":"Reconstructing cosmological initial conditions (ICs) from late-time observations is a difficult task, which relies on the use of computationally expensive simulators alongside sophisticated statistical methods to navigate multi-million dimensional parameter spaces. We present a simple method for Bayesian field reconstruction based on modeling the posterior distribution of the initial matter density field to be diagonal Gaussian in Fourier space, with its covariance and the mean estimator being the trainable parts of the algorithm. Training and sampling are extremely fast (training: $\\sim 1 \\, \\mathrm{h}$ on a GPU, sampling: $\\lesssim 3 \\, \\mathrm{s}$ for 1000 samples at resolution $128^3$), and our method supports industry-standard (non-differentiable) $N$-body simulators. We verify the fidelity of the obtained IC samples in terms of summary statistics.","abx":0,"nw":0,"d":"2024-10-21","dq":0,"y":2024,"au":[495,236,265,492,136],"c":7,"cs":0,"bib":"2024arXiv241015808S","v":"arXiv.org","lk":"arXiv:2410.15808","url":"https://arxiv.org/abs/2410.15808","doi":"10.48550/arXiv.2410.15808","tg":{"s":["Quijote (set not stated)"],"d":["Density fields"],"m":["Simulation-based inference"],"u":[]},"x":-0.6555,"yy":-0.4616,"p3":[0.5233,-0.2386,0.6849],"sim":{"k":"e","l":[[114,0.968],[188,0.951],[2,0.947],[65,0.94],[260,0.94]]},"c3":[121.82,8.38,110.53],"c2":[217.56,-114.11],"k":1,"r":[188,205,230,233,260,339],"rm":0},{"id":"2410.14623","t":"syren-new: Precise formulae for the linear and nonlinear matter power spectra with massive neutrinos and dynamical dark energy","ab":"Current and future large scale structure surveys aim to constrain the neutrino mass and the equation of state of dark energy. We aim to construct accurate and interpretable symbolic approximations to the linear and nonlinear matter power spectra as a function of cosmological parameters in extended $Λ$CDM models which contain massive neutrinos and non-constant equations of state for dark energy. This constitutes an extension of the syren-halofit emulators to incorporate these two effects, which we call syren-new (SYmbolic-Regression-ENhanced power spectrum emulator with NEutrinos and $W_0-w_a$). We also obtain a simple approximation to the derived parameter $σ_8$ as a function of the cosmological parameters for these models. Our results for the linear power spectrum are designed to emulate CLASS, whereas for the nonlinear case we aim to match the results of EuclidEmulator2. We compare our results to existing emulators and $N$-body simulations. Our analytic emulators for $σ_8$, the linear and nonlinear power spectra achieve root mean squared errors of 0.1%, 0.3% and 1.3%, respectively, across a wide range of cosmological parameters, redshifts and wavenumbers. We verify that emulator-related discrepancies are subdominant compared to observational errors and other modelling uncertainties when computing shear power spectra for LSST-like surveys. Our expressions have similar accuracy to existing (numerical) emulators, but are at least an order of magnitude faster, both on a CPU and GPU. Our work greatly improves the accuracy, speed and range of applicability of current symbolic approximations to the linear and nonlinear matter power spectra. We provide publicly available code for all symbolic approximations found.","abx":0,"nw":0,"d":"2024-10-18","dq":0,"y":2024,"au":[120,172,581,273,511,95],"c":31,"cs":0,"bib":"2025A&A...698A...1S","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2410.14623","url":"https://arxiv.org/abs/2410.14623","doi":"10.1051/0004-6361/202452854","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Power spectra"],"m":["Symbolic regression"],"u":[]},"x":0.07,"yy":-0.51,"p3":[0.1006,0.5195,0.2471],"sim":{"k":"e","l":[[183,0.963],[158,0.948],[17,0.946],[175,0.942],[107,0.942]]},"c3":[-199.5,81.59,-39.54],"c2":[-150.57,147.42],"k":7,"r":[158,183,292,325,339],"rm":0},{"id":"2410.11883","t":"Simulation-based inference with scattering representations: scattering is all you need","ab":"We demonstrate the successful use of scattering representations without further compression for simulation-based inference (SBI) with images (i.e. field-level), illustrated with a cosmological case study. Scattering representations provide a highly effective representational space for subsequent learning tasks, although the higher dimensional compressed space introduces challenges. We overcome these through spatial averaging, coupled with more expressive density estimators. Compared to alternative methods, such an approach does not require additional simulations for either training or computing derivatives, is interpretable, and resilient to covariate shift. As expected, we show that a scattering only approach extracts more information than traditional second order summary statistics.","abx":0,"nw":0,"d":"2024-10-11","dq":0,"y":2024,"au":[374,96,313],"c":1,"cs":0,"bib":"2024arXiv241011883L","v":"arXiv.org","lk":"arXiv:2410.11883","url":"https://arxiv.org/abs/2410.11883","doi":"10.48550/arXiv.2410.11883","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics","Weak lensing & 2D maps"],"m":["Simulation-based inference","Normalizing flows"],"u":["Normalizing flows","Weak lensing & 2D maps"]},"x":0.0493,"yy":-0.9036,"p3":[-0.0732,-0.5047,0.5699],"sim":{"k":"e","l":[[208,0.925],[218,0.923],[65,0.922],[184,0.92],[172,0.918]]},"c3":[151.33,54.85,-0.32],"c2":[188.64,-61.54],"k":6,"r":[173,199,327,339],"rm":0},{"id":"2410.07349","t":"Psi-GAN: A power-spectrum-informed generative adversarial network for the emulation of large-scale structure maps across cosmologies and redshifts","ab":"Simulations of the dark matter distribution throughout the Universe are essential in order to analyse data from cosmological surveys. $N$-body simulations are computationally expensive, and many cheaper alternatives (such as lognormal random fields) fail to reproduce accurate statistics of the smaller, non-linear scales. In this work, we present \\textsc{Psi-GAN} (\\textbf{P}ower-\\textbf{s}pectrum-\\textbf{i}nformed \\textbf{G}enerative \\textbf{A}dversarial \\textbf{N}etwork), a machine learning model which takes a two-dimensional lognormal dark matter density field and transforms it into a more realistic field. We construct \\textsc{Psi-GAN} so that it is continuously conditional, and can therefore generate realistic realisations of the dark matter density field across a range of cosmologies and redshifts in $z \\in [0, 3]$. We train \\textsc{Psi-GAN} as a generative adversarial network on $2\\,000$ simulation boxes from the Quijote simulation suite. We use a novel critic architecture that utilises the power spectrum as the basis for discrimination between real and generated samples. \\textsc{Psi-GAN} shows agreement with $N$-body simulations over a range of redshifts and cosmologies, consistently outperforming the lognormal approximation on all tests of non-linear structure, such as being able to reproduce both the power spectrum up to wavenumbers of $1~h~\\mathrm{Mpc}^{-1}$, and the bispectra of target $N$-body simulations to within ${\\sim}5$ per cent. Our improved ability to model non-linear structure should allow more robust constraints on cosmological parameters when used in techniques such as simulation-based inference.","abx":0,"nw":0,"d":"2024-10-09","dq":0,"y":2024,"au":[517,96,494,169],"c":7,"cs":0,"bib":"2025MNRAS.536.3138B","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2410.07349","url":"https://arxiv.org/abs/2410.07349","doi":"10.1093/mnras/stae2810","tg":{"s":["Latin hypercube"],"d":["Density fields","Power spectra","Higher-order statistics","Weak lensing & 2D maps"],"m":["Generative models"],"u":[]},"x":-0.5157,"yy":-0.5777,"p3":[0.4142,0.1296,0.7587],"sim":{"k":"e","l":[[269,0.959],[110,0.949],[31,0.948],[83,0.947],[127,0.944]]},"c3":[-6.91,-79.87,-46.39],"c2":[-12.12,-68.43],"k":1,"r":[260,269,313,339],"rm":0},{"id":"2410.03507","t":"LOO-PIT: A sensitive posterior test","ab":"With the advent of the next generation of astrophysics experiments, the volume of data available to researchers will be greater than ever. As these projects will significantly drive down statistical uncertainties in measurements, it is crucial to develop novel tools to assess the ability of our models to fit these data within the specified errors. We introduce to astronomy the Leave One Out-Probability Integral Transform (LOO-PIT) technique. This first estimates the LOO posterior predictive distributions based on the model and likelihood distribution specified, then evaluates the quality of the match between the model and data by applying the PIT to each estimated distribution and data point, outputting a LOO-PIT distribution. Deviations between this output distribution and that expected can be characterised visually and with a standard Kolmogorov--Smirnov distribution test. We compare LOO-PIT and the more common $χ^2$ test using both a simplified model and a more realistic astrophysics problem, where we consider fitting Baryon Acoustic Oscillations in galaxy survey data with contamination from emission line interlopers. LOO-PIT and $χ^2$ tend to find different signals from the contaminants, and using these tests in conjunction increases the statistical power compared to using either test alone. We also show that LOO-PIT outperforms $χ^2$ in certain realistic test cases.","abx":0,"nw":0,"d":"2024-10-04","dq":0,"y":2024,"au":[24,425,260,661],"c":3,"cs":0,"bib":"2025JCAP...01..008N","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2410.03507","url":"https://arxiv.org/abs/2410.03507","doi":"10.1088/1475-7516/2025/01/008","tg":{"s":["Quijote (set not stated)"],"d":["Galaxy mocks (HOD)","Power spectra"],"m":["No ML"],"u":["Galaxy mocks (HOD)","Power spectra"]},"x":-0.088,"yy":-0.6151,"p3":[0.3487,-0.0147,0.046],"sim":{"k":"e","l":[[185,0.92],[128,0.914],[208,0.912],[191,0.912],[82,0.912]]},"c3":[18.86,32.59,152.01],"c2":[-113.51,-98.73],"k":7,"r":[146,191,209,252,339],"rm":0},{"id":"2410.01897","t":"Testing the robustness of the BAO determination in the presence of massive neutrinos","ab":"We study the robustness of the Baryon Acoustic Oscillation (BAO) feature in galaxy clustering in the presence of massive neutrinos. In the standard BAO analysis pipeline a reference cosmological model is assumed to boost the BAO peak through the so-called reconstruction technique and in the modelling of the BAO feature to extract the cosmological information. State-of-the art spectroscopic BAO measurements, such as the Dark Energy Spectroscopic Instrument claim an aggregate precision of 0.52$\\%$ on the BAO scale, with a systematic error of 0.1$\\%$ associated to the assumption of a reference cosmology when measuring and analyzing the BAO feature. While the systematic effect induced by this arbitrary choice of fiducial cosmology has been studied for a wide range of $Λ$CDM-like models, it has not yet been tested for reference cosmologies with massive neutrinos with the precision afforded by next generation surveys. In this context, we employ the Quijote high-resolution dark-matter simulations with haloes above a mass of $M\\sim 2\\times10^{13} h^{-1}M_{\\odot}$, with different values for the total sum of neutrinos masses, $\\sum m_ν[{\\rm eV}] = 0,\\, 0.1,\\, 0,2,\\, 0.4$ to study and quantify the impact of the pipeline's built-in assumption of massless neutrinos on the measurement of the BAO signal, with a special focus on the BAO reconstruction technique. We determine that any additional systematic bias introduced by the assumption of massless neutrinos is no greater than $0.1\\%$ ($0.2\\%$) for the isotropic (anisotropic) measurement. We expect these conclusions also hold for galaxies provided that neutrino properties do not alter the galaxy-halo connection.","abx":0,"nw":0,"d":"2024-10-02","dq":0,"y":2024,"au":[22,282,397],"c":3,"cs":0,"bib":"2025JCAP...01..045N","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2410.01897","url":"https://arxiv.org/abs/2410.01897","doi":"10.1088/1475-7516/2025/01/045","tg":{"s":["Massive neutrinos"],"d":["Halo catalogs","Power spectra","Redshift space"],"m":["No ML"],"u":["Redshift space"]},"x":-0.2139,"yy":0.2005,"p3":[-0.1524,0.3838,-0.4488],"sim":{"k":"e","l":[[320,0.936],[24,0.931],[195,0.93],[232,0.929],[132,0.927]]},"c3":[-7.55,-42.82,-188.09],"c2":[-73.0,187.83],"k":8,"r":[339],"rm":0},{"id":"2410.01751","t":"Impact of Redshift Space Distortion on Persistent Homology of cosmic matter density field","ab":"By employing summary statistics obtained from Persistent Homology (PH), we investigate the influence of Redshift Space Distortions (RSD) on the topology of excursion sets formed through the super-level filtration method applied to three-dimensional matter density fields. The synthetic fields simulated by the Quijote suite in both real and redshift spaces are smoothed by accounting for the Gaussian smoothing function with different scales. The RSD leads a tendency for clusters ($\\tildeβ_0$) to shift towards higher thresholds, while filament loops ($\\tildeβ_1$) and cosmic voids ($\\tildeβ_2$) migrate towards lower thresholds. Notably, $\\tildeβ_2$ exhibits greater sensitivity to RSD compared to clusters and independent loops. As the smoothing scales increase, the amplitude of the reduced Betti number curve ($\\tildeβ_k$) decreases, and the corresponding peak position shifts towards the mean threshold. Conversely, the amplitude of $\\tildeβ_k$ remains almost unchanged with variations in redshift for $z\\in[0-3]$. The analysis of persistent entropy and the overall abundance of $k$-holes indicates that the linear Kaiser effect plays a significant role compared to the non-linear effect for $R \\gtrsim 30$ Mpc $h^{-1}$ at $z=0$, whereas persistent entropy proves to be a reliable measure against non-linear influences.","abx":0,"nw":0,"d":"2024-10-02","dq":0,"y":2024,"au":[224,415,559],"c":5,"cs":0,"bib":"2025IJGMM..2240006A","v":"International Journal of Geometric Methods in Modern Physics (IJGMMP)","lk":"arXiv:2410.01751","url":"https://arxiv.org/abs/2410.01751","doi":"10.1142/S0219887825400067","tg":{"s":["Fiducial"],"d":["Density fields","Higher-order statistics","Redshift space"],"m":["No ML"],"u":["Fiducial"]},"x":0.7625,"yy":-0.131,"p3":[-0.3059,0.9892,-0.007],"sim":{"k":"e","l":[[179,0.947],[192,0.944],[67,0.944],[40,0.933],[39,0.932]]},"c3":[7.1,270.47,-37.43],"c2":[214.73,221.84],"k":9,"r":[179,192,213,251,293],"rm":0},{"id":"2410.01007","t":"A Tale of Two Fields: Neural Network-Enhanced non-Gaussianity Search with Halos","ab":"It was recently shown that neural networks can be combined with the analytic method of scale-dependent bias to obtain a measurement of local primordial non-Gaussianity, which is optimal in the squeezed limit that dominates the signal-to-noise. The method is robust to non-linear physics, but also inherits the statistical precision offered by neural networks applied to very non-linear scales. In prior work, we assumed that the neural network has access to the full matter distribution. In this work, we apply our method to halos. We first describe a novel two-field formalism that is optimal even when the matter distribution is not observed. We show that any N halo fields can be compressed to two fields without losing information, and obtain optimal loss functions to learn these fields. We then apply the method to high-resolution AbacusSummit and AbacusPNG simulations. In the present work, the two neural networks observe the local population statistics, in particular the halo mass and concentration distribution in a patch of the sky. While the traditional mass-binned halo analysis is optimal in practice without further halo properties on AbacusPNG, our novel formalism easily allows to include additional halo properties such as the halo concentration, which can improve $f_{NL}$ constraints by a factor of a few. We also explore whether shot noise can be lowered with machine learning compared to a traditional reconstruction, finding no improvement for our simulation parameters.","abx":0,"nw":0,"d":"2024-10-01","dq":0,"y":2024,"au":[704,469,372],"c":7,"cs":0,"bib":"2025PhRvD.112b3540K","v":"","lk":"arXiv:2410.01007","url":"https://arxiv.org/abs/2410.01007","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs"],"m":["Other ML","Perturbation theory & analytic models"],"u":["Other ML"]},"x":0.0326,"yy":0.5588,"p3":[-0.6417,0.0535,0.2248],"sim":{"k":"e","l":[[123,0.949],[242,0.948],[266,0.948],[259,0.942],[260,0.941]]},"c3":[-57.69,-142.35,10.09],"c2":[55.55,-188.87],"k":1,"r":[229,248,266,316,339],"rm":0},{"id":"2409.20507","t":"Constraining Cosmology with Simulation-based inference and Optical Galaxy Cluster Abundance","ab":"We test the robustness of simulation-based inference (SBI) in the context of cosmological parameter estimation from galaxy cluster counts and masses in simulated optical datasets. We construct ``simulations'' using analytical models for the galaxy cluster halo mass function (HMF) and for the observed richness (number of observed member galaxies) to train and test the SBI method. We compare the SBI parameter posterior samples to those from an MCMC analysis that uses the same analytical models to construct predictions of the observed data vector. The two methods exhibit comparable performance, with reliable constraints derived for the primary cosmological parameters, ($Ω_m$ and $σ_8$), and richness-mass relation parameters. We also perform out-of-domain tests with observables constructed from galaxy cluster-sized halos in the Quijote simulations. Again, the SBI and MCMC results have comparable posteriors, with similar uncertainties and biases. Unsurprisingly, upon evaluating the SBI method on thousands of simulated data vectors that span the parameter space, SBI exhibits worsened posterior calibration metrics in the out-of-domain application. We note that such calibration tests with MCMC is less computationally feasible and highlight the potential use of SBI to stress-test limitations of analytical models, such as in the use for constructing models for inference with MCMC.","abx":0,"nw":0,"d":"2024-09-30","dq":0,"y":2024,"au":[468,695,113,400,592,240],"c":9,"cs":0,"bib":"2024arXiv240920507R","v":"","lk":"arXiv:2409.20507","url":"https://arxiv.org/abs/2409.20507","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs"],"m":["Simulation-based inference"],"u":[]},"x":-0.1897,"yy":-0.117,"p3":[0.6825,-0.0964,-0.0769],"sim":{"k":"e","l":[[254,0.96],[205,0.949],[197,0.948],[127,0.945],[115,0.945]]},"c3":[39.92,163.69,-5.05],"c2":[147.78,139.32],"k":7,"r":[254,339],"rm":0},{"id":"2409.18182","t":"Cosmology on point: modelling spectroscopic tracer one-point statistics","ab":"The 1-point matter density probability distribution function (PDF) captures some of the non-Gaussian information lost in standard 2-point statistics. The matter PDF can be well predicted at mildly non-linear scales using large deviations theory. This work extends those predictions to biased tracers like dark matter halos and the galaxies they host. We model the conditional PDF of tracer counts giv
