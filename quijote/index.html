0.1103/physrevd.109.023531","tg":{"s":["Quijote-Odd (parity-violating)"],"d":["Density fields","Particle snapshots","Halo catalogs","Power spectra","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Perturbation theory & analytic models"]},"x":0.1385,"yy":0.9801,"p3":[-0.855,0.2241,-0.0085],"sim":{"k":"e","l":[[81,0.953],[257,0.942],[264,0.942],[7,0.94],[63,0.938]]},"c3":[-10.02,-170.47,-67.79],"c2":[75.56,-154.51],"k":5,"r":[226,257,264,339],"rm":0},{"id":"2306.10538","t":"Effective cosmic density field reconstruction with convolutional neural network","ab":"We present a cosmic density field reconstruction method that augments the traditional reconstruction algorithms with a convolutional neural network (CNN). Following Shallue $\\&$ Eisenstein (2022), the key component of our method is to use the $\\textit{reconstructed}$ density field as the input to the neural network. We extend this previous work by exploring how the performance of these reconstruction ideas depends on the input reconstruction algorithm, the reconstruction parameters, and the shot noise of the density field, as well as the robustness of the method. We build an eight-layer CNN and train the network with reconstructed density fields computed from the Quijote suite of simulations. The reconstructed density fields are generated by both the standard algorithm and a new iterative algorithm. In real space at $z=0$, we find that the reconstructed field is $90\\%$ correlated with the true initial density out to $k\\sim 0.5 h{\\rm Mpc}^{-1}$, a significant improvement over $k\\sim 0.2 h{\\rm Mpc}^{-1}$ achieved by the input reconstruction algorithms. We find similar improvements in redshift space, including an improved removal of redshift space distortions at small scales. We also find that the method is robust across changes in cosmology. Additionally, the CNN removes much of the variance from the choice of different reconstruction algorithms and reconstruction parameters. However, the effectiveness decreases with increasing shot noise, suggesting that such an approach is best suited to high density samples. This work highlights the additional information in the density field beyond linear scales as well as the power of complementing traditional analysis approaches with machine learning techniques.","abx":0,"nw":0,"d":"2023-06-18","dq":0,"y":2023,"au":[675,220,567,490],"c":34,"cs":0,"bib":"2023MNRAS.523.6272C","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2306.10538","url":"https://arxiv.org/abs/2306.10538","doi":"10.1093/mnras/stad1868","tg":{"s":["Latin hypercube"],"d":["Density fields","Power spectra","Redshift space"],"m":["CNN"],"u":["Latin hypercube","Power spectra"]},"x":-0.5138,"yy":-0.3286,"p3":[0.264,0.121,0.3107],"sim":{"k":"e","l":[[260,0.957],[92,0.948],[105,0.946],[194,0.946],[156,0.946]]},"c3":[28.76,-127.5,152.9],"c2":[21.99,-252.36],"k":1,"r":[339],"rm":0},{"id":"2306.03137","t":"On approximations of the redshift-space bispectrum and power spectrum multipoles covariance matrix","ab":"We investigate, in dark matter and galaxy mocks, the effects of approximating the galaxy power spectrum-bispectrum estimated covariance as a diagonal matrix, for an analysis that aligns with the specifications of recent and upcoming galaxy surveys. We find that, for a joint power spectrum and bispectrum data-vector, with corresponding $k$-ranges of $0.02<k\\,[h{\\rm Mpc}^{-1}]<0.15$ and $0.02<k\\,[h{\\rm Mpc}^{-1}]<0.12$ each, the diagonal covariance approximation recovers $\\sim 10\\%$ larger error-bars on the parameters $\\{σ_8,f,α_\\parallel,α_\\bot\\}$ with respect to the full covariance case, while still underestimating the corresponding true errors on the recovered parameters by $\\sim 10\\%$. This is caused by the diagonal approximations weighting the elements of the data-vector in a sub-optimal way, resulting in a less efficient estimator, with poor coverage properties, than the maximum likelihood estimator featuring the full covariance matrix. We further investigate intermediate approximations to the full covariance matrix, with up to $\\sim 80\\%$ of the matrix elements being zero, which could be advantageous for theoretical and hybrid approaches. We expect these results to be qualitatively insensitive to variations of the total cosmological volume, depending primarily on the bin size and shot-noise, thus making them particularly significant for present and future galaxy surveys.","abx":0,"nw":0,"d":"2023-06-05","dq":0,"y":2023,"au":[573,282,397],"c":12,"cs":0,"bib":"2024JCAP...06..048N","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2306.03137","url":"https://arxiv.org/abs/2306.03137","doi":"10.1088/1475-7516/2024/06/048","tg":{"s":["Fiducial","Molino / HOD galaxy mocks"],"d":["Density fields","Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Molino / HOD galaxy mocks","Galaxy mocks (HOD)","Density fields","Perturbation theory & analytic models"]},"x":0.6118,"yy":0.668,"p3":[-0.0353,-0.0745,-0.4024],"sim":{"k":"e","l":[[232,0.949],[15,0.943],[304,0.941],[312,0.935],[24,0.934]]},"c3":[89.14,-167.46,-143.79],"c2":[205.5,10.82],"k":7,"r":[232,259,285,304,319,339],"rm":0},{"id":"2305.18003","t":"Clustering of binary black hole mergers: a detailed analysis of the EAGLE+MOBSE simulation","ab":"We perform a detailed study of the cosmological bias of gravitational gave (GW) events produced by binary black hole mergers (BBHM). We start from a BBHM distribution modeled inside the EAGLE hydrodyamical simulation using the population synthesis code MOBSE. We then compare our findings with predictions from different Halo Occupation Distribution (HOD) prescriptions and find overall agreement, provided that the modeled properties of host galaxies and halos in the semi-analytical treatment match those in the simulations. By highlighting the sources of these discrepancies, we provide the stepping stone to build future more robust models that prevent the shortcoming of both simulation-based and analytical models. Finally, we train a neural network to build a simulation-based HOD and perform feature importance analysis to gain intuition on which host halo/galaxy parameters are the most relevant in determining the actual distribution and power spectrum of BBHM. We find that the distribution of BBHM in a galaxy does not only depend on its size, star formation rate and metallicity, but also by its kinetic state.","abx":0,"nw":0,"d":"2023-05-29","dq":0,"y":2023,"au":[444,566,55,462,429],"c":17,"cs":0,"bib":"2024MNRAS.530.1129P","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2305.18003","url":"https://arxiv.org/abs/2305.18003","doi":"10.1093/mnras/stae893","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Galaxy mocks (HOD)","Power spectra"],"m":["Emulators & regression ML"],"u":[]},"x":-0.2849,"yy":-0.0013,"p3":[0.5975,-0.0762,0.028],"sim":{"k":"e","l":[[197,0.923],[146,0.922],[92,0.917],[142,0.915],[115,0.915]]},"c3":[-100.17,-61.92,60.3],"c2":[-158.78,-22.04],"k":7,"r":[339],"rm":0},{"id":"2305.12812","t":"Non-Linearity-Free prediction of the growth-rate $fσ_8$ using Convolutional Neural Networks","ab":"The growth-rate $fσ_8(z)$ of the large-scale structure of the Universe is an important dynamic probe of gravity that can be used to test for deviations from General Relativity. However, for galaxy surveys to extract this key quantity from cosmological observations, two important assumptions have to be made: i) a fiducial cosmological model, typically taken to be the cosmological constant and cold dark matter ($Λ$CDM) model and ii) the modeling of the observed power spectrum, especially at non-linear scales, which is particularly dangerous as most models used in the literature are phenomenological at best. In this work, we propose a novel approach involving convolutional neural networks (CNNs), trained on the Quijote N-body simulations, to predict $fσ_8(z)$ directly and without assuming a model for the non-linear part of the power spectrum, thus avoiding the second of the assumptions above. This could serve as an initial step towards the future development of a method for parameter inference in Stage IV surveys. We find that the predictions for the value of $fσ_8$ from the CNN are in excellent agreement with the fiducial values since they outperform a maximum likelihood analysis and the CNN trained on the power spectrum. Therefore, we find that the CNN reconstructions provide a viable alternative to avoid the theoretical modeling of the non-linearities at small scales when extracting the growth rate.","abx":0,"nw":0,"d":"2023-05-22","dq":0,"y":2023,"au":[376,291,570,81,561],"c":5,"cs":0,"bib":"2024PhRvD.110b3525M","v":"Physical Review D","lk":"arXiv:2305.12812","url":"https://arxiv.org/abs/2305.12812","doi":"10.1103/PhysRevD.110.023525","tg":{"s":["Latin hypercube"],"d":["Density fields","Power spectra","Redshift space"],"m":["CNN"],"u":["Latin hypercube","Redshift space"]},"x":0.1107,"yy":-0.317,"p3":[-0.1557,0.3833,0.3696],"sim":{"k":"e","l":[[228,0.943],[171,0.941],[263,0.939],[242,0.938],[92,0.937]]},"c3":[91.34,-11.01,-87.39],"c2":[96.7,79.01],"k":1,"r":[205,253,299,301,339],"rm":0},{"id":"2305.10597","t":"Quijote-PNG: The Information Content of the Halo Mass Function","ab":"We study signatures of primordial non-Gaussianity (PNG) in the redshift-space halo field on non-linear scales, using a combination of three summary statistics, namely the halo mass function (HMF), power spectrum, and bispectrum. The choice of adding the HMF to our previous joint analysis of power spectrum and bispectrum is driven by a preliminary field-level analysis, in which we train graph neural networks on halo catalogues to infer the PNG $f_\\mathrm{NL}$ parameter. The covariance matrix and the responses of our summaries to changes in model parameters are extracted from a suite of halo catalogues constructed from the Quijote-PNG N-body simulations. We consider the three main types of PNG: local, equilateral and orthogonal. Adding the HMF to our previous joint analysis of power spectrum and bispectrum produces two main effects. First, it reduces the equilateral $f_\\mathrm{NL}$ predicted errors by roughly a factor $2$, while also producing notable, although smaller, improvements for orthogonal PNG. Second, it helps break the degeneracy between the local PNG amplitude, $f_\\mathrm{NL}^\\mathrm{local}$, and assembly bias, $b_φ$, without relying on any external prior assumption. Our final forecasts for PNG parameters are $Δf_\\mathrm{NL}^\\mathrm{local} = 40$, $Δf_\\mathrm{NL}^\\mathrm{equil} = 210$, $Δf_\\mathrm{NL}^\\mathrm{ortho} = 91$, on a cubic volume of $1 \\left(h^{-1}{\\rm Gpc}\\right)^3$, with a halo number density of $\\bar{n}\\sim 5.1 \\times 10^{-5}~h^3\\mathrm{Mpc}^{-3}$, at $z = 1$, and considering scales up to $k_\\mathrm{max} = 0.5~h\\,\\mathrm{Mpc}^{-1}$.","abx":0,"nw":0,"d":"2023-05-17","dq":0,"y":2023,"au":[247,55,424,665,187,176,462,276,397,240,95],"c":26,"cs":0,"bib":"2023ApJ...957...50J","v":"Astrophysical Journal","lk":"arXiv:2305.10597","url":"https://arxiv.org/abs/2305.10597","doi":"10.3847/1538-4357/acfe70","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Graph neural networks","Fisher forecasts"],"u":["Fiducial","Fisher derivatives"]},"x":0.2622,"yy":0.503,"p3":[-0.5969,0.3358,0.1228],"sim":{"k":"e","l":[[242,0.975],[181,0.971],[257,0.963],[63,0.961],[264,0.955]]},"c3":[-122.88,-92.81,-63.71],"c2":[35.09,-147.24],"k":5,"r":[227,229,242,257,263,264,308,312,334,336,339],"rm":0},{"id":"2305.08994","t":"How to estimate Fisher information matrices from simulations","ab":"The Fisher information matrix is a quantity of fundamental importance for information geometry and asymptotic statistics. In practice, it is widely used to quickly estimate the expected information available in a data set and guide experimental design choices. In many modern applications, it is intractable to analytically compute the Fisher information and Monte Carlo methods are used instead. The standard Monte Carlo method produces estimates of the Fisher information that can be biased when the Monte-Carlo noise is non-negligible. Most problematic is noise in the derivatives as this leads to an overestimation of the available constraining power, given by the inverse Fisher information. In this work we find another simple estimate that is oppositely biased and produces an underestimate of the constraining power. This estimator can either be used to give approximate bounds on the parameter constraints or can be combined with the standard estimator to give improved, approximately unbiased estimates. Both the alternative and the combined estimators are asymptotically unbiased so can be also used as a convergence check of the standard approach. We discuss potential limitations of these estimators and provide methods to assess their reliability. These methods accelerate the convergence of Fisher forecasts, as unbiased estimates can be achieved with fewer Monte Carlo samples, and so can be used to reduce the simulated data set size by several orders of magnitude.","abx":0,"nw":0,"d":"2023-05-15","dq":0,"y":2023,"au":[665,95],"c":23,"cs":0,"bib":"2023arXiv230508994C","v":"","lk":"arXiv:2305.08994","url":"https://arxiv.org/abs/2305.08994","doi":"","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Power spectra"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Power spectra"]},"x":-0.0418,"yy":-0.2923,"p3":[0.4061,-0.1818,0.3177],"sim":{"k":"e","l":[[153,0.922],[124,0.918],[167,0.916],[273,0.913],[107,0.911]]},"c3":[-72.16,-10.54,-50.65],"c2":[81.92,-82.82],"k":6,"r":[226,242,257,264,274,339],"rm":0},{"id":"2305.07018","t":"Improving constraints on primordial non-Gaussianity using neural network based reconstruction","ab":"We study the use of U-Nets in reconstructing the linear dark matter density field and its consequences for constraining cosmological parameters, in particular primordial non-Gaussianity. Our network is able to reconstruct the initial conditions of redshift $z=0$ density fields from N-body simulations with $90\\%$ accuracy out to $k \\leq 0.4$ h/Mpc, competitive with state-of-the-art reconstruction algorithms at a fraction of the computational cost. We study the information content of the reconstructed $z=0$ density field with a Fisher analysis using the QUIJOTE simulation suite, including non-Gaussian initial conditions. Combining the pre- and post-reconstructed power spectrum and bispectrum data up to $k_{\\rm max} = 0.52$ h/Mpc, we find significant improvements on all parameters. Most notably, we find a factor $3.65$ (local), $3.54$ (equilateral) and $2.90$ (orthogonal) improvement on the marginalized errors of $f_{\\rm NL}$ as compared to only using the pre-reconstructed data. We show that these improvements can be attributed to a combination of reduced data covariance and parameter degeneracy. The results constitute an important step towards more optimal inference of primordial non-Gaussianity from non-linear scales.","abx":0,"nw":0,"d":"2023-05-11","dq":0,"y":2023,"au":[623,502],"c":24,"cs":0,"bib":"2024JCAP...02..031F","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2305.07018","url":"https://arxiv.org/abs/2305.07018","doi":"10.1088/1475-7516/2024/02/031","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["CNN","Fisher forecasts"],"u":["Fiducial","Fisher derivatives"]},"x":0.0999,"yy":0.4861,"p3":[-0.1776,0.2654,0.473],"sim":{"k":"e","l":[[110,0.979],[242,0.963],[263,0.961],[123,0.958],[181,0.956]]},"c3":[52.06,-135.32,25.13],"c2":[153.44,-161.82],"k":1,"r":[222,233,248,259,260,261,263,264,278,285,291,339],"rm":0},{"id":"2305.03070","t":"Constraining $f_{NL}$ using the Large-Scale Modulation of Small-Scale Statistics","ab":"We implement a novel formalism to constrain primordial non-Gaussianity of the local type from the large-scale modulation of the small-scale power spectrum. Our approach combines information about primordial non-Gaussianity contained in the squeezed bispectrum and the collapsed trispectrum of large-scale structure together in a computationally amenable and consistent way, while avoiding the need to model complicated covariances of higher $N$-point functions. This work generalizes our recent work, which used a neural network estimate of local power, to the more conventional local power spectrum statistics, and explores using both matter field and halo catalogues from the Quijote simulations. We find that higher $N$-point functions of the matter field can provide strong constraints on $f_{NL}$, but higher $N$-point functions of the halo field, at the halo density of Quijote, only marginally improve constraints from the two-point function.","abx":0,"nw":0,"d":"2023-05-04","dq":0,"y":2023,"au":[639,469,372],"c":21,"cs":0,"bib":"2025PhRvD.112l3544G","v":"","lk":"arXiv:2305.03070","url":"https://arxiv.org/abs/2305.03070","doi":"10.1103/8h9r-rvhw","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Quijote-PNG","Fiducial","Fisher derivatives","Fisher forecasts"]},"x":0.1535,"yy":0.5431,"p3":[-0.7425,0.2685,0.2728],"sim":{"k":"e","l":[[181,0.96],[242,0.957],[257,0.957],[264,0.955],[228,0.955]]},"c3":[-94.46,-186.54,-43.22],"c2":[16.43,-224.03],"k":5,"r":[242,248,257,259,263,264,266,316,330,333,339],"rm":0},{"id":"2304.03788","t":"Posterior Sampling of the Initial Conditions of the Universe from Non-linear Large Scale Structures using Score-Based Generative Models","ab":"Reconstructing the initial conditions of the universe is a key problem in cosmology. Methods based on simulating the forward evolution of the universe have provided a way to infer initial conditions consistent with present-day observations. However, due to the high complexity of the inference problem, these methods either fail to sample a distribution of possible initial density fields or require significant approximations in the simulation model to be tractable, potentially leading to biased results. In this work, we propose the use of score-based generative models to sample realizations of the early universe given present-day observations. We infer the initial density field of full high-resolution dark matter N-body simulations from the present-day density field and verify the quality of produced samples compared to the ground truth based on summary statistics. The proposed method is capable of providing plausible realizations of the early universe density field from the initial conditions posterior distribution marginalized over cosmological parameters and can sample orders of magnitude faster than current state-of-the-art methods.","abx":0,"nw":0,"d":"2023-04-07","dq":0,"y":2023,"au":[545,448,507,387,580,682,95],"c":48,"cs":0,"bib":"2024MNRAS.527L.173L","v":"Monthly Notices of the Royal Astronomical Society Letters","lk":"arXiv:2304.03788","url":"https://arxiv.org/abs/2304.03788","doi":"10.1093/mnrasl/slad152","tg":{"s":["Latin hypercube"],"d":["Density fields"],"m":["Generative models"],"u":["Latin hypercube"]},"x":-0.6317,"yy":-0.5264,"p3":[0.5353,-0.027,0.721],"sim":{"k":"e","l":[[114,0.95],[269,0.939],[134,0.937],[137,0.937],[188,0.935]]},"c3":[85.32,-11.74,154.03],"c2":[130.71,-162.38],"k":1,"r":[339],"rm":0},{"id":"2303.17341","t":"On the impact of $f(Q)$ gravity on the Large Scale Structure","ab":"We investigate the exponential $f(Q)$ symmetric teleparallel gravitation, namely $f(Q)=Q+αQ_0(1-e^{-β\\sqrt{Q/Q_0}})$ using \\texttt{ME-GADGET} code to probe the structure formation with box sizes $L_{\\mathrm{box}}=10/100$ Mpc$/h$ and middle resolution $N_p^{1/3}=512$. To reproduce viable cosmology within the aforementioned modified gravity theory, we first perform Markov Chain Monte Carlo (MCMC) sampling on OHD/BAO/Pantheon datasets and constrain a parameter space. Furthermore, we also derive theoretical values for deceleration parameter $q(z)$, statefinder pair $\\{r,s\\}$ and effective gravitational constant $G_{\\mathrm{eff}}$, perform $Om(z)$ diagnostics. While carrying out N-body+SPH simulations, we derive CDM+baryons over density/temperature/mean molecular weight fields, matter power spectrum (both 2/3D, with/without redshift space distortions), bispectrum, two-point correlation function and halo mass function. Results for small and big simulation box sizes are therefore properly compared, halo mass function is related to the Seth-Tormen theoretical prediction and matter power spectrum to the standard \\texttt{CAMB} output.","abx":0,"nw":0,"d":"2023-03-30","dq":0,"y":2023,"au":[496,593,603,36,504],"c":79,"cs":0,"bib":"2023MNRAS.522..252S","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2303.17341","url":"https://arxiv.org/abs/2303.17341","doi":"10.1093/mnras/stad968","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["No ML"],"u":[]},"x":0.5808,"yy":0.3892,"p3":[-0.4568,0.2888,-0.135],"sim":{"k":"e","l":[[118,0.931],[4,0.928],[154,0.925],[148,0.923],[288,0.923]]},"c3":[-57.23,5.65,97.67],"c2":[-158.0,66.02],"k":4,"r":[339],"rm":0},{"id":"2303.15510","t":"GEO-FPT: a model of the galaxy bispectrum at mildly non-linear scales","ab":"We present GEO-FPT (Geometric Fitted Perturbation Theory), a new model for the galaxy bispectrum anisotropic signal in redshift space, with functional form rooted in perturbation theory. It also models the dependence of the bispectrum with the geometric properties of the triangles in Fourier space, and has a broader regime of validity than state-of-the-art theoretical models based on perturbation theory. We calibrate the free parameters of this model using high-resolution dark matter simulations and perform stringent tests to show that GEO-FPT describes the galaxy bispectrum accurately up to scales of $k\\simeq0.12 h{\\rm Mpc}^{-1}$ for different cosmological models, as well as for biased tracers of the dark matter field, considering a survey volume of $100$ (Gpc $h^{-1})^3$. In particular, a joint analysis of the power spectrum and bispectrum anisotropic signals, taking into account their full covariance matrix, reveals that the relevant physical quantities -- the BAO peak position (along and across the line-of-sight), and the growth of structure parameters times the amplitude of dark matter fluctuations, $fσ_8$-- are recovered in an unbiased way, with an accuracy better than $0.4\\%$ and $2\\%$ respectively (which is our $2σ$ statistical limit of the systematic error estimate). In addition, the bispectrum signal breaks the $fσ_8$ degeneracy without detectable bias: $f$ and $σ_8$ are recovered with better than $2.7\\%$ and $3.8\\%$ accuracy respectively (which is our $2σ$ statistical limit of the systematic error estimate). GEO-FPT boosts the applicability of the bispectrum signal of galaxy surveys beyond the current limitation of $k\\lesssim 0.08\\,h$ Mpc$^{-1}$ % and makes the bispectrum a key statistic to unlock the information content from the mildly non-linear regime in the on-going and forthcoming galaxy redshift surveys.","abx":0,"nw":0,"d":"2023-03-27","dq":0,"y":2023,"au":[573,168,282,397],"c":11,"cs":0,"bib":"2023JCAP...11..044N","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2303.15510","url":"https://arxiv.org/abs/2303.15510","doi":"10.1088/1475-7516/2023/11/044","tg":{"s":["Fiducial"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":0.5975,"yy":0.6835,"p3":[-0.465,0.2242,-0.2628],"sim":{"k":"e","l":[[24,0.95],[223,0.949],[15,0.945],[242,0.941],[304,0.938]]},"c3":[131.15,-129.21,-145.05],"c2":[207.6,124.77],"k":5,"r":[239,285,304,319,336,339],"rm":0},{"id":"2303.13056","t":"Predicting the Initial Conditions of the Universe using a Deterministic Neural Network","ab":"Finding the initial conditions that led to the current state of the universe is challenging because it involves searching over an intractable input space of initial conditions, along with modeling their evolution via tools such as N-body simulations which are computationally expensive. Recently, deep learning has emerged as a surrogate for N-body simulations by directly learning the mapping between the linear input of an N-body simulation and the final nonlinear output from the simulation, significantly accelerating the forward modeling. However, this still does not reduce the search space for initial conditions. In this work, we pioneer the use of a deterministic convolutional neural network for learning the reverse mapping and show that it accurately recovers the initial linear displacement field over a wide range of scales ($<1$-$2\\%$ error up to nearly $k\\simeq0.8$-$0.9 \\text{ Mpc}^{-1}h$), despite the one-to-many mapping of the inverse problem (due to the divergent backward trajectories at smaller scales). Specifically, we train a V-Net architecture, which outputs the linear displacement of an N-body simulation, given the nonlinear displacement at redshift $z=0$ and the cosmological parameters. The results of our method suggest that a simple deterministic neural network is sufficient for accurately approximating the initial linear states, potentially obviating the need for the more complex and computationally demanding backward modeling methods that were recently proposed.","abx":0,"nw":0,"d":"2023-03-23","dq":0,"y":2023,"au":[642,27,15,580,187],"c":19,"cs":0,"bib":"2023arXiv230313056J","v":"","lk":"arXiv:2303.13056","url":"https://arxiv.org/abs/2303.13056","doi":"","tg":{"s":["Latin hypercube"],"d":["Particle snapshots"],"m":["CNN","Emulators & regression ML"],"u":["Latin hypercube"]},"x":-0.5196,"yy":-0.4643,"p3":[0.4334,-0.2015,0.6623],"sim":{"k":"e","l":[[260,0.944],[261,0.94],[311,0.938],[156,0.937],[123,0.937]]},"c3":[107.12,-100.34,98.11],"c2":[197.77,-182.26],"k":1,"r":[230,260,339],"rm":0},{"id":"2302.08162","t":"Probing massive neutrinos with the Minkowski functionals of the galaxy distribution","ab":"The characteristic signatures of massive neutrinos on large-scale structure (LSS), if fully captured, can be used to put a stringent constraint on their mass sum, $M_ν$. Previous work utilizing N-body simulations has shown the Minkowski functionals (MFs) of LSS can reveal the imprints of massive neutrinos on LSS, provide important complementary information to two-point statistics and significantly improve constraints on $M_ν$. In this work, we take a step forward and apply the statistics to the biased tracers of LSS, i.e. the galaxies, and in redshift space. We perform a Fisher matrix analysis and quantify the constraining power of the MFs by using the Molino mock galaxy catalogs, which are constructed based on the halo occupation distribution (HOD) framework with parameters for the SDSS $M_r < -21.5$ and -22 galaxy samples. We find the MFs give tighter constraints on all of the cosmological parameters that we consider than the power spectrum. The constraints on $Ω_{\\mathrm{m}}, Ω_{\\mathrm{b}}, h, n_s, σ_8$, and $M_ν$ from the MFs are better by a factor of 1.9, 2.9, 3.7, 4.2, 2.5, and 5.7, respectively, after marginalizing over the HOD parameters. Specifically, for $M_ν$, we obtain a 1$σ$ constraint of 0.059 eV with the MFs alone for a volume of only $\\left(1 h^{-1} \\mathrm{Gpc}\\right)^3$.","abx":0,"nw":0,"d":"2023-02-16","dq":0,"y":2023,"au":[654,70,659],"c":25,"cs":0,"bib":"2023JCAP...09..037L","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2302.08162","url":"https://arxiv.org/abs/2302.08162","doi":"10.1088/1475-7516/2023/09/037","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.4232,"yy":0.3423,"p3":[-0.2672,0.3652,-0.2884],"sim":{"k":"e","l":[[73,0.927],[312,0.926],[249,0.92],[118,0.92],[334,0.92]]},"c3":[63.94,210.05,-87.24],"c2":[191.76,198.7],"k":3,"r":[213,214,245,249,251,262,264,273,275,278,293,312,314,331,334,336,339],"rm":0},{"id":"title:cosmologicalpropertiesofthecosmicweb","t":"Cosmological Properties of the Cosmic Web","ab":"","abx":0,"nw":0,"d":"2023","dq":0,"y":2023,"au":[420,316],"c":0,"cs":1,"bib":"","v":"The 2nd Electronic Conference on Universe","lk":"Phys. Sci. Forum 2023","url":"https://www.mdpi.com/2673-9984/7/1/53","doi":"10.3390/ecu2023-14046","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Massive neutrinos","Density fields","Power spectra","Fisher forecasts","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.5684,"yy":-0.0667,"p3":[0.0428,0.8088,-0.2608],"sim":{"k":"e","l":[[108,0.954],[40,0.951],[25,0.95],[202,0.947],[16,0.944]]},"c3":[-68.14,78.83,-62.55],"c2":[20.65,-23.25],"k":8,"r":[282,301,339],"rm":1},{"id":"2301.09655","t":"Perturbation-theory informed integrators for cosmological simulations","ab":"Large-scale cosmological simulations are an indispensable tool for modern cosmology. To enable model-space exploration, fast and accurate predictions are critical. In this paper, we show that the performance of such simulations can be further improved with time-stepping schemes that use input from cosmological perturbation theory. Specifically, we introduce a class of time-stepping schemes derived by matching the particle trajectories in a single leapfrog/Verlet drift-kick-drift step to those predicted by Lagrangian perturbation theory (LPT). As a corollary, these schemes exactly yield the analytic Zel'dovich solution in 1D in the pre-shell-crossing regime (i.e. before particle trajectories cross). One representative of this class is the popular FastPM scheme by Feng et al. 2016, which we take as our baseline. We then construct more powerful LPT-inspired integrators and show that they outperform FastPM and standard integrators in fast simulations in two and three dimensions with $\\mathcal{O}(1 - 100)$ timesteps, requiring less steps to accurately reproduce the power spectrum and bispectrum of the density field. Furthermore, we demonstrate analytically and numerically that, for any integrator, convergence is limited in the post-shell-crossing regime (to order 3/2 for planar wave collapse), owing to the lacking regularity of the acceleration field, which makes the use of high-order integrators in this regime futile. Also, we study the impact of the timestep spacing and of a decaying mode present in the initial conditions. Importantly, we find that symplecticity of the integrator plays a minor role for fast approximate simulations with a small number of timesteps.","abx":0,"nw":0,"d":"2023-01-23","dq":0,"y":2023,"au":[236,499],"c":12,"cs":0,"bib":"2024JCoPh.51313201L","v":"Journal of Computational Physics","lk":"arXiv:2301.09655","url":"https://arxiv.org/abs/2301.09655","doi":"10.1016/j.jcp.2024.113201","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Particle snapshots","Power spectra","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":-0.6564,"yy":0.141,"p3":[0.025,-0.3809,-0.5643],"sim":{"k":"e","l":[[328,0.932],[324,0.925],[300,0.915],[1,0.914],[71,0.914]]},"c3":[18.78,17.2,109.48],"c2":[-148.36,96.54],"k":4,"r":[339],"rm":0},{"id":"title:signatureofmassiveneutrinosfromtheclusteringofcriticalpointsidensitythresholdbas","t":"Signature of Massive Neutrinos from the Clustering of Critical Points. I. Density-threshold-based Analysis in Configuration Space","ab":"","abx":0,"nw":0,"d":"2023","dq":0,"y":2023,"au":[320,262,279],"c":2,"cs":1,"bib":"","v":"Astrophysical Journal Supplement Series","lk":"ApJS 264 26 (2023)","url":"https://iopscience.iop.org/article/10.3847/1538-4365/aca32a","doi":"10.3847/1538-4365/aca32a","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Massive neutrinos","Fiducial","Fisher derivatives","Density fields","Higher-order statistics","Fisher forecasts","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.5924,"yy":-0.1424,"p3":[-0.2841,0.6696,-0.413],"sim":{"k":"e","l":[[61,0.95],[40,0.946],[323,0.942],[39,0.941],[241,0.936]]},"c3":[-42.81,123.92,-189.28],"c2":[-23.77,212.17],"k":8,"r":[308,320,323,336,339],"rm":0},{"id":"2301.03991","t":"Constraining cosmological parameters from N-body simulations with Variational Bayesian Neural Networks","ab":"Methods based on Deep Learning have recently been applied on astrophysical parameter recovery thanks to their ability to capture information from complex data. One of these methods is the approximate Bayesian Neural Networks (BNNs) which have demonstrated to yield consistent posterior distribution into the parameter space, helpful for uncertainty quantification. However, as any modern neural networks, they tend to produce overly confident uncertainty estimates and can introduce bias when BNNs are applied to data. In this work, we implement multiplicative normalizing flows (MNFs), a family of approximate posteriors for the parameters of BNNs with the purpose of enhancing the flexibility of the variational posterior distribution, to extract $Ω_m$, $h$, and $σ_8$ from the QUIJOTE simulations. We have compared this method with respect to the standard BNNs, and the flipout estimator. We found that MNFs combined with BNNs outperform the other models obtaining predictive performance with almost one order of magnitude larger that standard BNNs, $σ_8$ extracted with high accuracy ($r^2=0.99$), and precise uncertainty estimates. The latter implies that MNFs provide more realistic predictive distribution closer to the true posterior mitigating the bias introduced by the variational approximation and allowing to work with well-calibrated networks.","abx":0,"nw":0,"d":"2023-01-09","dq":0,"y":2023,"au":[283,408,392],"c":12,"cs":0,"bib":"2023FrASS..1039120H","v":"Frontiers in Astronomy and Space Sciences","lk":"arXiv:2301.03991","url":"https://arxiv.org/abs/2301.03991","doi":"10.3389/fspas.2023.1139120","tg":{"s":["Latin hypercube"],"d":["Density fields"],"m":["CNN","Normalizing flows","Other ML"],"u":["Latin hypercube","Density fields","CNN"]},"x":0.6265,"yy":-0.4913,"p3":[0.4992,0.2991,0.2787],"sim":{"k":"e","l":[[279,0.942],[301,0.937],[153,0.934],[225,0.933],[254,0.933]]},"c3":[-143.17,123.56,5.92],"c2":[27.12,-43.29],"k":1,"r":[240,279,301,339],"rm":0},{"id":"2212.09742","t":"Window function convolution with deep neural network models","ab":"Traditional estimators of the galaxy power spectrum and bispectrum are sensitive to the survey geometry. They yield spectra that differ from the true underlying signal since they are convolved with the window function of the survey. For the current and future generations of experiments, this bias is statistically significant on large scales. It is thus imperative that the effect of the window function on the summary statistics of the galaxy distribution is accurately modelled. Moreover, this operation must be computationally efficient in order to allow sampling posterior probabilities while performing Bayesian estimation of the cosmological parameters. In order to satisfy these requirements, we built a deep neural network model that emulates the convolution with the window function, and we show that it provides fast and accurate predictions. We trained (tested) the network using a suite of 2000 (200) cosmological models within the cold dark matter scenario, and demonstrate that its performance is agnostic to the precise values of the cosmological parameters. In all cases, the deep neural network provides models for the power spectra and the bispectrum that are accurate to better than 0.1 per cent on a timescale of 10 $μ$s.","abx":0,"nw":0,"d":"2022-12-19","dq":0,"y":2022,"au":[171,149,205],"c":7,"cs":0,"bib":"2023A&A...669L...2A","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2212.09742","url":"https://arxiv.org/abs/2212.09742","doi":"10.1051/0004-6361/202245156","tg":{"s":["Latin hypercube"],"d":["Power spectra","Higher-order statistics"],"m":["Emulators & regression ML"],"u":["Latin hypercube"]},"x":0.0495,"yy":-0.2249,"p3":[0.3093,0.222,0.1848],"sim":{"k":"e","l":[[15,0.938],[115,0.934],[87,0.932],[103,0.928],[107,0.928]]},"c3":[99.8,-114.98,-97.1],"c2":[123.97,167.92],"k":7,"r":[296,339],"rm":0},{"id":"2212.06860","t":"Machine-learning cosmology from void properties","ab":"Cosmic voids are the largest and most underdense structures in the Universe. Their properties have been shown to encode precious information about the laws and constituents of the Universe. We show that machine learning techniques can unlock the information in void features for cosmological parameter inference. We rely on thousands of void catalogs from the GIGANTES dataset, where every catalog contains an average of 11,000 voids from a volume of $1~(h^{-1}{\\rm Gpc})^3$. We focus on three properties of cosmic voids: ellipticity, density contrast, and radius. We train 1) fully connected neural networks on histograms from individual void properties and 2) deep sets from void catalogs, to perform likelihood-free inference on the value of cosmological parameters. We find that our best models are able to constrain the value of $Ω_{\\rm m}$, $σ_8$, and $n_s$ with mean relative errors of $10\\%$, $4\\%$, and $3\\%$, respectively, without using any spatial information from the void catalogs. Our results provide an illustration for the use of machine learning to constrain cosmology with voids.","abx":0,"nw":0,"d":"2022-12-13","dq":0,"y":2022,"au":[101,43,240,95],"c":16,"cs":0,"bib":"2023ApJ...955..131W","v":"Astrophysical Journal","lk":"arXiv:2212.06860","url":"https://arxiv.org/abs/2212.06860","doi":"10.3847/1538-4357/aceaf6","tg":{"s":["Latin hypercube"],"d":["Void catalogs"],"m":["Simulation-based inference","Other ML"],"u":["Latin hypercube"]},"x":0.3203,"yy":-0.6567,"p3":[-0.0362,-0.5242,0.249],"sim":{"k":"e","l":[[297,0.976],[113,0.966],[57,0.959],[82,0.949],[339,0.94]]},"c3":[-127.04,184.7,-42.27],"c2":[-3.07,37.19],"k":9,"r":[255,297,308,334,339],"rm":0},{"id":"2212.06838","t":"Cosmology with cosmic web environments II. Redshift-space auto and cross power spectra","ab":"Degeneracies among parameters of the cosmological model are known to drastically limit the information contained in the matter distribution. In the first paper of this series, we shown that the cosmic web environments; namely the voids, walls, filaments and nodes; can be used as a leverage to improve the real-space constraints on a set of six cosmological parameters, including the summed neutrino mass. Following-upon these results, we propose to study the achievable constraints of environment-dependent power spectra in redshift space where the velocities add up information to the standard two-point statistics by breaking the isotropy of the matter density field. A Fisher analysis based on a set of thousands of Quijote simulations allows us to conclude that the combination of power spectra computed in the several cosmic web environments is able to break some degeneracies. Compared to the matter monopole and quadrupole information alone, the combination of environment-dependent spectra tightens down the constraints on key parameters like the matter density or the summed neutrino mass by up to a factor of $5.5$. Additionally, while the information contained in the matter statistic quickly saturates at mildly non-linear scales in redshift space, the combination of power spectra in the environments appears as a goldmine of information able to improve the constraints at all the studied scales from $0.1$ to $0.5$ $h$/Mpc and suggests that further improvements are reachable at even finer scales.","abx":0,"nw":0,"d":"2022-12-13","dq":0,"y":2022,"au":[634,345,474,82],"c":12,"cs":0,"bib":"2023A&A...674A.150B","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2212.06838","url":"https://arxiv.org/abs/2212.06838","doi":"10.1051/0004-6361/202245626","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.524,"yy":-0.0224,"p3":[0.0225,0.6061,-0.4306],"sim":{"k":"e","l":[[282,0.967],[108,0.95],[235,0.944],[202,0.943],[61,0.936]]},"c3":[52.44,158.65,-191.49],"c2":[135.52,150.79],"k":8,"r":[249,262,272,282,284,288,291,292,297,307,308,327,334,336,339],"rm":0},{"id":"2211.07565","t":"Quijote-PNG: Quasi-maximum likelihood estimation of Primordial Non-Gaussianity in the non-linear halo density field","ab":"We study primordial non-Gaussian signatures in the redshift-space halo field on non-linear scales, using a quasi-maximum likelihood estimator based on optimally compressed power spectrum and modal bispectrum statistics. We train and validate the estimator on a suite of halo catalogues constructed from the Quijote-PNG N-body simulations, which we release to accompany this paper. We verify its unbiasedness and near optimality, for the three main types of primordial non-Gaussianity (PNG): local, equilateral, and orthogonal. We compare the modal bispectrum expansion with a $k$-binning approach, showing that the former allows for faster convergence of numerical derivatives in the computation of the score-function, thus leading to better final constraints. We find, in agreement with previous studies, that the local PNG signal in the halo-field is dominated by the scale-dependent bias signature on large scales and saturates at $k \\sim 0.2~h\\,\\mathrm{Mpc}^{-1}$, whereas the small-scale bispectrum is the main source of information for equilateral and orthogonal PNG. Combining power spectrum and bispectrum on non-linear scales plays an important role in breaking degeneracies between cosmological and PNG parameters; such degeneracies remain however strong for equilateral PNG. We forecast that PNG parameters can be constrained with $Δf_\\mathrm{NL}^\\mathrm{local} = 45$, $Δf_\\mathrm{NL}^\\mathrm{equil} = 570$, $Δf_\\mathrm{NL}^\\mathrm{ortho} = 110$, on a cubic volume of $1 \\left({ {\\rm Gpc}/{ {\\rm h}}} \\right)^3$, at $z = 1$, considering scales up to $k_\\mathrm{max} = 0.5~h\\,\\mathrm{Mpc}^{-1}$.","abx":0,"nw":0,"d":"2022-11-14","dq":0,"y":2022,"au":[247,176,462,424,665,187,397,240,95],"c":16,"cs":0,"bib":"2023ApJ...948..135J","v":"Astrophysical Journal","lk":"arXiv:2211.07565","url":"https://arxiv.org/abs/2211.07565","doi":"10.3847/1538-4357/acc4bd","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.2378,"yy":0.477,"p3":[-0.5232,0.2086,0.1067],"sim":{"k":"e","l":[[226,0.975],[263,0.975],[181,0.969],[257,0.964],[228,0.963]]},"c3":[-86.75,-113.21,-104.27],"c2":[-4.67,-147.73],"k":5,"r":[257,260,263,264,266,269,274,286,291,300,312,318,333,336,339],"rm":0},{"id":"2211.00723","t":"${\\rm S{\\scriptsize IM}BIG}$: A Forward Modeling Approach To Analyzing Galaxy Clustering","ab":"We present the first-ever cosmological constraints from a simulation-based inference (SBI) analysis of galaxy clustering from the new ${\\rm S{\\scriptsize IM}BIG}$ forward modeling framework. ${\\rm S{\\scriptsize IM}BIG}$ leverages the predictive power of high-fidelity simulations and provides an inference framework that can extract cosmological information on small non-linear scales, inaccessible with standard analyses. In this work, we apply ${\\rm S{\\scriptsize IM}BIG}$ to the BOSS CMASS galaxy sample and analyze the power spectrum, $P_\\ell(k)$, to $k_{\\rm max}=0.5\\,h/{\\rm Mpc}$. We construct 20,000 simulated galaxy samples using our forward model, which is based on high-resolution ${\\rm Q{\\scriptsize UIJOTE}}$ $N$-body simulations and includes detailed survey realism for a more complete treatment of observational systematics. We then conduct SBI by training normalizing flows using the simulated samples and infer the posterior distribution of $Λ$CDM cosmological parameters: $Ω_m, Ω_b, h, n_s, σ_8$. We derive significant constraints on $Ω_m$ and $σ_8$, which are consistent with previous works. Our constraints on $σ_8$ are $27\\%$ more precise than standard analyses. This improvement is equivalent to the statistical gain expected from analyzing a galaxy sample that is $\\sim60\\%$ larger than CMASS with standard methods. It results from additional cosmological information on non-linear scales beyond the limit of current analytic models, $k > 0.25\\,h/{\\rm Mpc}$. While we focus on $P_\\ell$ in this work for validation and comparison to the literature, ${\\rm S{\\scriptsize IM}BIG}$ provides a framework for analyzing galaxy clustering using any summary statistic. We expect further improvements on cosmological constraints from subsequent ${\\rm S{\\scriptsize IM}BIG}$ analyses of summary statistics beyond $P_\\ell$.","abx":0,"nw":0,"d":"2022-11-01","dq":0,"y":2022,"au":[122,458,580,327,507,200,131,84,107,471],"c":17,"cs":0,"bib":"2022arXiv221100723H","v":"","lk":"arXiv:2211.00723","url":"https://arxiv.org/abs/2211.00723","doi":"","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Power spectra","Redshift space"],"m":["Simulation-based inference","Normalizing flows"],"u":["Latin hypercube"]},"x":-0.0417,"yy":-0.0067,"p3":[0.3663,-0.7311,-0.0913],"sim":{"k":"e","l":[[198,0.971],[201,0.966],[244,0.965],[200,0.96],[99,0.959]]},"c3":[191.04,133.32,-63.5],"c2":[271.66,130.51],"k":0,"r":[244,245,262,272,278,284,331,336,339],"rm":0},{"id":"2211.00660","t":"${\\rm S{\\scriptsize IM}BIG}$: Mock Challenge for a Forward Modeling Approach to Galaxy Clustering","ab":"Simulation-Based Inference of Galaxies (${\\rm S{\\scriptsize IM}BIG}$) is a forward modeling framework for analyzing galaxy clustering using simulation-based inference. In this work, we present the ${\\rm S{\\scriptsize IM}BIG}$ forward model, which is designed to match the observed SDSS-III BOSS CMASS galaxy sample. The forward model is based on high-resolution ${\\rm Q{\\scriptsize UIJOTE}}$ $N$-body simulations and a flexible halo occupation model. It includes full survey realism and models observational systematics such as angular masking and fiber collisions. We present the \"mock challenge\" for validating the accuracy of posteriors inferred from ${\\rm S{\\scriptsize IM}BIG}$ using a suite of 1,500 test simulations constructed using forward models with a different $N$-body simulation, halo finder, and halo occupation prescription. As a demonstration of ${\\rm S{\\scriptsize IM}BIG}$, we analyze the power spectrum multipoles out to $k_{\\rm max} = 0.5\\,h/{\\rm Mpc}$ and infer the posterior of $Λ$CDM cosmological and halo occupation parameters. Based on the mock challenge, we find that our constraints on $Ω_m$ and $σ_8$ are unbiased, but conservative. Hence, the mock challenge demonstrates that ${\\rm S{\\scriptsize IM}BIG}$ provides a robust framework for inferring cosmological parameters from galaxy clustering on non-linear scales and a complete framework for handling observational systematics. In subsequent work, we will use ${\\rm S{\\scriptsize IM}BIG}$ to analyze summary statistics beyond the power spectrum including the bispectrum, marked power spectrum, skew spectrum, wavelet statistics, and field-level statistics.","abx":0,"nw":0,"d":"2022-11-01","dq":0,"y":2022,"au":[122,458,580,327,507,200,131,84,107,471],"c":35,"cs":0,"bib":"2023JCAP...04..010H","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2211.00660","url":"https://arxiv.org/abs/2211.00660","doi":"10.1088/1475-7516/2023/04/010","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks","Non-Quijote simulations"],"d":["Galaxy mocks (HOD)","Power spectra","Redshift space"],"m":["Simulation-based inference"],"u":["Latin hypercube","Redshift space"]},"x":-0.0816,"yy":0.0189,"p3":[0.5028,-0.6422,-0.1248],"sim":{"k":"e","l":[[243,0.965],[198,0.964],[173,0.951],[205,0.95],[99,0.945]]},"c3":[181.03,119.63,-9.02],"c2":[296.77,44.05],"k":0,"r":[243,245,260,262,272,278,312,313,331,336,339],"rm":0},{"id":"2210.12743","t":"Cosmological Information in Skew Spectra of Biased Tracers in Redshift Space","ab":"Extracting the non-Gaussian information encoded in the higher-order clustering statistics of the large-scale structure is key to fully realizing the potential of upcoming galaxy surveys. We investigate the information content of the redshift-space {\\it weighted skew spectra} of biased tracers as efficient estimators for 3-point clustering statistics. The skew spectra are constructed by correlating the observed galaxy field with an appropriately-weighted square of it. We perform numerical Fisher forecasts using two synthetic datasets; the halo catalogs from the Quijote N-body simulations and the galaxy catalogs from the Molino suite. The latter serves to understand the effect of marginalization over a more complex matter-tracer biasing relation. Compared to the power spectrum multipoles, we show that the skew spectra substantially improve the constraints on six parameters of the $νΛ$CDM model, $\\{Ω_m, Ω_b, h, n_s, σ_8, M_ν\\}$. Imposing a small-scale cutoff of $k_{\\rm max}=0.25 \\, {\\rm Mpc}^{-1}h$, the improvements from skew spectra alone range from 23% to 62% for the Quijote halos and from 32% to 71% for the Molino galaxies. Compared to the previous analysis of the bispectrum monopole on the same data and using the same range of scales, the skew spectra of Quijote halos provide competitive constraints. Conversely, the skew spectra outperform the bispectrum monopole for all cosmological parameters for the Molino catalogs. This may result from additional anisotropic information, particularly enhanced in the Molino sample, that is captured by the skew spectra but not by the bispectrum monopole. Our stability analysis of the numerical derivatives shows comparable convergence rates for the power spectrum and the skew spectra, indicating potential underestimation of parameter uncertainties by at most 30%.","abx":0,"nw":0,"d":"2022-10-23","dq":0,"y":2022,"au":[327,84,122,200],"c":30,"cs":0,"bib":"2023JCAP...03..045H","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2210.12743","url":"https://arxiv.org/abs/2210.12743","doi":"10.1088/1475-7516/2023/03/045","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Molino / HOD galaxy mocks"],"d":["Halo catalogs","Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":-0.2186,"yy":0.4596,"p3":[-0.2966,-0.0701,-0.351],"sim":{"k":"e","l":[[143,0.939],[6,0.939],[336,0.93],[242,0.93],[312,0.929]]},"c3":[173.69,94.21,-114.98],"c2":[248.52,55.5],"k":0,"r":[244,249,257,262,272,282,284,291,300,304,312,330,331,336,339],"rm":0},{"id":"2210.11487","t":"New applications of Graph Neural Networks in Cosmology","ab":"Upcoming cosmological surveys will provide unprecedented amount of data, which will require innovative statistical methods to maximize the scientific exploitation. Standard cosmological analyses based on abundances, two-point and higher-order statistics of cosmic tracers have been widely used to investigate the properties of the cosmic web and Large Scale Structure. However, these statistics can only exploit a subset of the entire information content available. Our goal is thus to implement new data analysis techniques based on machine learning to extract cosmological information through forward modelling, by directly exploiting the spatial coordinates and other observed properties of galaxies and galaxy clusters. Specifically, we investigated a new representation of large-scale structure data in the form of graphs. This data format can be directly fed to Graph Neural Networks, a recently proposed class of supervised Deep Learning algorithms. We tested the method on dark matter halo catalogues in different cosmologies, finding promising results. In particular, the method can discriminate among different dark energy models with high accuracy, through both binary classification ($99\\%-$accuracy) and multi-class classification ($97\\%-$accuracy). Moreover, it provides constraints on the value of $w_0$, through regression, with high precision.","abx":0,"nw":0,"d":"2022-10-20","dq":0,"y":2022,"au":[221,225,388,114],"c":3,"cs":0,"bib":"2023ASSP...60...35F","v":"","lk":"arXiv:2210.11487","url":"https://arxiv.org/abs/2210.11487","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs"],"m":["Graph neural networks"],"u":[]},"x":-0.3482,"yy":-0.8842,"p3":[-0.1157,0.1934,0.8064],"sim":{"k":"e","l":[[255,0.948],[209,0.942],[169,0.938],[102,0.934],[325,0.933]]},"c3":[90.99,-119.84,-17.55],"c2":[-98.02,-87.02],"k":9,"r":[339],"rm":1},{"id":"2210.05140","t":"Tracer-Field Cross-Correlations with $k$-Nearest Neighbor Distributions","ab":"In astronomy and cosmology, significant effort is devoted to characterizing and understanding spatial cross-correlations between points - e.g. galaxy positions, high energy neutrino arrival directions, X-ray and AGN sources, and continuous field - e.g. weak lensing and Cosmic Microwave Background (CMB) maps. Recently, we introduced the $k$-nearest neighbor formalism to better characterize the clustering of discrete (point) datasets. Here we extend it to the point-field cross-correlation analysis. It combines $k$NN measurements of the point data set with measurements of the field smoothed on many scales. The resulting statistics are sensitive to all orders in the joint clustering of the points and the field. We demonstrate that this approach, unlike the 2-pt cross-correlation, can measure the statistical dependence of two datasets even when there are no linear (Gaussian) correlations. We further demonstrate that this framework is far more effective than the two-point function in detecting cross-correlations when the continuous field is contaminated by high levels of noise. For a particularly high level of noise, the cross-correlations between halos and the underlying matter field in a cosmological simulation, between $10h^{-1}{\\rm Mpc}$ and $30h^{-1}{\\rm Mpc}$, is detected at $>5σ$ significance using the technique presented here, when the two-point cross-correlation significance is $\\sim 1σ$. Finally, we show that the $k$NN cross-correlations of halos and the matter field can be well-modeled on quasilinear scales by the Hybrid Effective Field Theory (HEFT) framework, with the same set of bias parameters as are used for the two-point cross-correlations. The substantial improvement in the statistical power of detecting cross-correlations with this method makes it a promising tool for various cosmological applications.","abx":0,"nw":0,"d":"2022-10-11","dq":0,"y":2022,"au":[73,631],"c":24,"cs":0,"bib":"2023MNRAS.519.4856B","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2210.05140","url":"https://arxiv.org/abs/2210.05140","doi":"10.1093/mnras/stac3813","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Halo catalogs","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.3798,"yy":-0.3624,"p3":[0.6939,-0.0307,-0.7179],"sim":{"k":"e","l":[[310,0.962],[295,0.939],[322,0.939],[6,0.934],[112,0.933]]},"c3":[-171.29,92.39,-156.33],"c2":[-38.79,57.96],"k":2,"r":[280,292,295,310,322,334,337,339],"rm":0},{"id":"2209.06228","t":"Squeezing $f_{\\rm NL}$ out of the matter bispectrum with consistency relations","ab":"We show how consistency relations can be used to robustly extract the amplitude of local primordial non-Gaussianity ($f_{\\rm NL}$) from the squeezed limit of the matter bispectrum, well into the non-linear regime. First, we derive a non-perturbative relation between primordial non-Gaussianity and the leading term in the squeezed bispectrum, revising some results present in the literature. This relation is then used to successfully measure $f_{\\rm NL}$ from $N$-body simulations. We discuss the dependence of our results on different scale cuts and redshifts. Specifically, the analysis is strongly dependent on the choice of the smallest soft momentum, $q_{\\rm min}$, which is the most sensitive to primordial bispectrum contributions, but is largely independent of the choice of the largest hard momentum, $k_{\\rm max}$, due to the non-Gaussian nature of the covariance. We also show how the constraints on $f_{\\rm NL}$ improve at higher redshift, due to a reduced off-diagonal covariance. In particular, for a simulation with $f_{\\rm NL} = 100$ and a volume of $(2.4 \\text{ Gpc}/h)^3$, we measure $f_{\\rm NL} = 98 \\pm 12$ at redshift $z=0$ and $f_{\\rm NL} = 97 \\pm 8$ at $z=0.97$. Finally, we compare our results with a Fisher forecast, showing that the current version of the analysis is satisfactorily close to the Fisher error. We regard this as a first step towards the realistic application of consistency relations to constrain primordial non-Gaussianity using observations.","abx":0,"nw":0,"d":"2022-09-13","dq":0,"y":2022,"au":[563,60,498,385,298,543,454],"c":23,"cs":0,"bib":"2022PhRvD.106l3525G","v":"","lk":"arXiv:2209.06228","url":"https://arxiv.org/abs/2209.06228","doi":"10.1103/PhysRevD.106.123525","tg":{"s":["Quijote-PNG"],"d":["Density fields","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Quijote-PNG"]},"x":0.1375,"yy":0.6757,"p3":[-0.8423,-0.0366,0.1907],"sim":{"k":"e","l":[[285,0.959],[98,0.953],[259,0.953],[123,0.946],[229,0.945]]},"c3":[-1.87,-215.65,5.16],"c2":[102.82,-243.49],"k":5,"r":[257,259,266,285,339],"rm":0},{"id":"2209.04310","t":"Constraining νΛCDM with density-split clustering","ab":"The dependence of galaxy clustering on local density provides an effective method for extracting non-Gaussian information from galaxy surveys. The two-point correlation function (2PCF) provides a complete statistical description of a Gaussian density field. However, the late-time density field becomes non-Gaussian due to non-linear gravitational evolution and higher-order summary statistics are required to capture all of its cosmological information. Using a Fisher formalism based on halo catalogues from the Quijote simulations, we explore the possibility of retrieving this information using the density-split clustering (DS) method, which combines clustering statistics from regions of different environmental density. We show that DS provides more precise constraints on the parameters of the $νΛ$CDM model compared to the 2PCF, and we provide suggestions for where the extra information may come from. DS improves the constraints on the sum of neutrino masses by a factor of $7$ and by factors of 4, 3, 3, 6, and 5 for $Ω_{\\rm m}$, $Ω_{\\rm b}$, $h$, $n_s$, and $σ_8$, respectively. We compare DS statistics when the local density environment is estimated from the real or redshift-space positions of haloes. The inclusion of DS autocorrelation functions, in addition to the cross-correlation functions between DS environments and haloes, recovers most of the information that is lost when using the redshift-space halo positions to estimate the environment. We discuss the possibility of constructing simulation-based methods to model DS clustering statistics in different scenarios.","abx":0,"nw":0,"d":"2022-09-09","dq":0,"y":2022,"au":[210,118,510,678,661,574,441,75,235],"c":45,"cs":0,"bib":"2023MNRAS.522..606P","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2209.04310","url":"https://arxiv.org/abs/2209.04310","doi":"10.1093/mnras/stad1017","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Power spectra"]},"x":0.2288,"yy":0.0931,"p3":[-0.0547,0.2116,-0.5697],"sim":{"k":"e","l":[[334,0.955],[336,0.954],[4,0.945],[308,0.944],[144,0.939]]},"c3":[96.78,167.4,-97.49],"c2":[210.37,102.73],"k":3,"r":[262,273,278,282,284,291,297,304,308,322,334,336,339],"rm":0},{"id":"2209.00668","t":"Bayesian evidence comparison for distance scale estimates","ab":"Constraints on cosmological parameters are often distilled from sky surveys by fitting templates to summary statistics of the data that are motivated by a fiducial cosmological model. However, recent work has shown how to estimate the distance scale using templates that are more generic: the basis functions used are not explicitly tied to any one cosmological model. We describe a Bayesian framework for (i) determining how many basis functions to use and (ii) comparing one basis set with another. Our formulation provides intuition into how (a) one's degree of belief in different basis sets, (b) the fact that the choice of priors depends on basis set, and (c) the data set itself, together determine the derived constraints. We illustrate our framework using measurements in simulated datasets before applying it to real data.","abx":0,"nw":0,"d":"2022-09-01","dq":0,"y":2022,"au":[79,536],"c":9,"cs":0,"bib":"2022MNRAS.517.4696P","v":"","lk":"arXiv:2209.00668","url":"https://arxiv.org/abs/2209.00668","doi":"10.1093/mnras/stac2984","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra"],"m":["Perturbation theory & analytic models","No ML"],"u":["Power spectra","Perturbation theory & analytic models"]},"x":-0.2158,"yy":-0.5773,"p3":[0.5443,0.2037,-0.07],"sim":{"k":"e","l":[[70,0.916],[238,0.909],[197,0.909],[87,0.909],[112,0.908]]},"c3":[-99.73,56.92,-299.31],"c2":[-141.45,272.06],"k":7,"r":[287,323],"rm":0},{"id":"2208.10164","t":"Minkowski Tensors in Redshift Space -- Beyond the Plane Parallel Approximation","ab":"The Minkowski tensors (MTs) can be used to probe anisotropic signals in a field, and are well suited for measuring the redshift space distortion (RSD) signal in large scale structure catalogs. We consider how the linear RSD signal can be extracted from a field without resorting to the plane parallel approximation. A spherically redshift space distorted field is both anisotropic and inhomogeneous. We derive expressions for the two point correlation functions that elucidate the inhomogeneity, and then explain how the breakdown of homogeneity impacts the volume and ensemble averages of the tensor Minkowski functionals. We construct the ensemble average of these quantities in curvilinear coordinates and show that the ensemble and volume averages can be approximately equated, but this depends on our choice of definition of the volume average of a tensor and the radial distance between the observer and field. We then extract the tensor Minkowski functionals from spherically redshift space distorted, Gaussian random fields and gravitationally evolved dark matter density fields at $z=0$ to test if we can successfully measure the Kaiser RSD signal. For the dark matter field we find a significant, $\\sim 10\\%$ anomalous signal in the MT component parallel to the line of sight that is present even on large scales $R_{\\rm G} \\gtrsim 15 \\, {\\rm Mpc}$, in addition to the Kaiser effect. This is due to the line of sight component of the MT being significantly contaminated by the Finger of God effect, which can be approximately modelled by an additional damping term in the cumulants.","abx":0,"nw":0,"d":"2022-08-22","dq":0,"y":2022,"au":[599,337,518,123],"c":12,"cs":0,"bib":"2023ApJ...942..110A","v":"Astrophysical Journal","lk":"arXiv:2208.10164","url":"https://arxiv.org/abs/2208.10164","doi":"10.3847/1538-4357/aca530","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.5098,"yy":0.5123,"p3":[-0.5642,0.3315,-0.218],"sim":{"k":"e","l":[[93,0.965],[47,0.93],[73,0.93],[144,0.929],[226,0.928]]},"c3":[76.13,246.16,9.86],"c2":[196.41,250.09],"k":5,"r":[339],"rm":0},{"id":"2208.05001","t":"Correcting for small-displacement interlopers in BAO analyses","ab":"Due to the low resolution of slitless spectroscopy, future surveys including those made possible by the Roman and Euclid space telescopes will be prone to line mis-identification, leading to interloper galaxies at the wrong redshifts in the large-scale structure catalogues. The most pernicious of these have a small displacement between true and false redshift such that the interloper positions are correlated with the target galaxies. We consider how to correct for such contaminants, focusing on $\\rm Hβ$ interlopers in [OIII] catalogues as will be observed by Roman, which are misplaced by $Δd = 97 \\,h^{-1}\\,{\\rm Mpc}$ at redshift $z = 1$. Because this displacement is close to the BAO scale, the peak in the interloper-target galaxy cross-correlation function at the displacement scale can change the shape of the BAO peak in the auto-correlation of the contaminated catalogue, and lead to incorrect cosmological measurements if not accounted for properly. We consider how to build a model for the monopole and quadrupole moments of the contaminated correlation function, including an additional free parameter for the fraction of interlopers. The key input to this model is the cross-correlation between the population of galaxies forming the interlopers and the main target sample. It will be important to either estimate this using calibration data or to use the contaminated small-scale auto-correlation function to model it, which may be possible if a number of requirements about the galaxy populations are met. We find that this method is successful in measuring the BAO dilation parameters without significant degradation in accuracy, provided the cross-correlation function is accurately known.","abx":0,"nw":0,"d":"2022-08-09","dq":0,"y":2022,"au":[575,200,661],"c":9,"cs":0,"bib":"2022JCAP...10..072F","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2208.05001","url":"https://arxiv.org/abs/2208.05001","doi":"10.1088/1475-7516/2022/10/072","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Halo catalogs","Power spectra"]},"x":0.5953,"yy":-0.7301,"p3":[-0.06,-0.4041,0.1345],"sim":{"k":"e","l":[[191,0.956],[82,0.915],[287,0.914],[194,0.913],[207,0.908]]},"c3":[-71.8,36.4,150.27],"c2":[-196.88,-19.29],"k":2,"r":[339],"rm":0},{"id":"2208.02791","t":"Fast computation of non-linear power spectrum in cosmologies with massive neutrinos","ab":"We compute 1-loop corrections to the redshift space galaxy power spectrum in cosmologies containing additional scales, and hence kernels different from Einstein-de Sitter (EdS). Specifically, our method is tailored for cosmologies in the presence of massive neutrinos and some modified gravity models; in this article we concentrate on the former case. The perturbative kernels have contributions that we notice appear either from the logarithmic growth factor $f(k,t)$, which is scale-dependent because of the neutrino free-streaming, or from the failure of the commonly used approximation $f^2=Ω_m$. The latter contributions make the computation of loop corrections quite slow, precluding full-shape analyses for parameter estimation. However, we identify that the dominant pieces of the kernels come from the growth factor, allowing us to simplify the kernels but retaining the characteristic free-streaming scale introduced by the neutrinos' mass. Moreover, with this simplification one can exploit FFTLog methods to speed up the computations even more. We validate our analytical modeling and numerical method with halo catalogs extracted from the Quijote simulations finding good agreement with the, a priori, known cosmological parameters. We make public our Python code FOLPS$ν$ to compute the redshift space power spectrum in a fraction of second. Code available at https://github.com/henoriega/FOLPS-nu.","abx":0,"nw":0,"d":"2022-08-04","dq":0,"y":2022,"au":[278,29,571,431],"c":50,"cs":0,"bib":"2022JCAP...11..038N","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2208.02791","url":"https://arxiv.org/abs/2208.02791","doi":"10.1088/1475-7516/2022/11/038","tg":{"s":["Massive neutrinos"],"d":["Halo catalogs","Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Massive neutrinos"]},"x":-0.5008,"yy":0.514,"p3":[-0.3517,-0.3493,-0.7108],"sim":{"k":"e","l":[[299,0.948],[329,0.935],[267,0.933],[315,0.933],[324,0.932]]},"c3":[90.87,-47.39,-209.09],"c2":[24.5,143.33],"k":4,"r":[299,312,317,324,326,331,336,337,339],"rm":0},{"id":"2208.00134","t":"Estimating Cosmological Constraints from Galaxy Cluster Abundance using Simulation-Based Inference","ab":"Inferring the values and uncertainties of cosmological parameters in a cosmology model is of paramount importance for modern cosmic observations. In this paper, we use the simulation-based inference (SBI) approach to estimate cosmological constraints from a simplified galaxy cluster observation analysis. Using data generated from the Quijote simulation suite and analytical models, we train a machine learning algorithm to learn the probability function between cosmological parameters and the possible galaxy cluster observables. The posterior distribution of the cosmological parameters at a given observation is then obtained by sampling the predictions from the trained algorithm. Our results show that the SBI method can successfully recover the truth values of the cosmological parameters within the 2σ limit for this simplified galaxy cluster analysis, and acquires similar posterior constraints obtained with a likelihood-based Markov Chain Monte Carlo method, the current state-of the-art method used in similar cosmological studies.","abx":0,"nw":0,"d":"2022-07-30","dq":0,"y":2022,"au":[468,695,104,314,30,400],"c":8,"cs":0,"bib":"2022mla..confE..20R","v":"","lk":"arXiv:2208.00134","url":"https://arxiv.org/abs/2208.00134","doi":"","tg":{"s":["Latin hypercube"],"d":["Halo catalogs"],"m":["Simulation-based inference"],"u":["Latin hypercube","Halo catalogs"]},"x":-0.1819,"yy":-0.1421,"p3":[0.5807,0.225,0.2865],"sim":{"k":"e","l":[[142,0.96],[339,0.946],[114,0.944],[107,0.944],[127,0.944]]},"c3":[62.23,66.7,-67.65],"c2":[39.06,163.36],"k":7,"r":[336,339],"rm":0},{"id":"2207.05202","t":"The Cosmic Graph: Optimal Information Extraction from Large-Scale Structure using Catalogues","ab":"We present an implicit likelihood approach to quantifying cosmological information over discrete catalogue data, assembled as graphs. To do so, we explore cosmological parameter constraints using mock dark matter halo catalogues. We employ Information Maximising Neural Networks (IMNNs) to quantify Fisher information extraction as a function of graph representation. We a) demonstrate the high sensitivity of modular graph structure to the underlying cosmology in the noise-free limit, b) show that graph neural network summaries automatically combine mass and clustering information through comparisons to traditional statistics, c) demonstrate that networks can still extract information when catalogues are subject to noisy survey cuts, and d) illustrate how nonlinear IMNN summaries can be used as asymptotically optimal compressed statistics for Bayesian simulation-based inference. We reduce the area of joint $Ω_m, σ_8$ parameter constraints with small ($\\sim$100 object) halo catalogues by a factor of 42 over the two-point correlation function, and demonstrate that the networks automatically combine mass and clustering information. This work utilises a new IMNN implementation over graph data in Jax, which can take advantage of either numerical or auto-differentiability. We also show that graph IMNNs successfully compress simulations away from the fiducial model at which the network is fitted, indicating a promising alternative to n-point statistics in catalogue simulation-based analyses.","abx":0,"nw":0,"d":"2022-07-11","dq":0,"y":2022,"au":[613,632,507,477,25,95],"c":49,"cs":0,"bib":"2022OJAp....5E..18M","v":"The Open Journal of Astrophysics","lk":"arXiv:2207.05202","url":"https://arxiv.org/abs/2207.05202","doi":"10.21105/astro.2207.05202","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Halo catalogs"],"m":["Graph neural networks","Simulation-based inference","Other ML"],"u":["Fiducial","Fisher derivatives"]},"x":-0.3752,"yy":-0.8791,"p3":[-0.1889,0.1276,0.5728],"sim":{"k":"e","l":[[246,0.948],[169,0.942],[226,0.932],[209,0.93],[63,0.929]]},"c3":[-85.55,158.62,-11.6],"c2":[8.64,55.61],"k":9,"r":[260,262,263,264,282,284,297,325,334,336,339],"rm":0},{"id":"2207.00519","t":"The Disordered Heterogeneous Universe: Galaxy Distribution and Clustering Across Length Scales","ab":"Studies of disordered heterogeneous media and galaxy cosmology share a common goal: analyzing the distribution of particles at `microscales' to predict physical properties at `macroscales', whether for a liquid, composite material, or entire Universe. The former theory provides an array of techniques to characterize a wide class of microstructures; in this work, we apply them to the distributions of galaxies. We focus on the lower-order correlation functions, `void' and `particle' nearest-neighbor functions, pair-connectedness functions, percolation properties, and a scalar order metric. Compared to homogeneous Poisson and typical disordered systems, the cosmological simulations exhibit enhanced large-scale clustering and longer tails in the nearest-neighbor functions, due to the presence of quasi-long-range correlations. On large scales, the system appears `hyperuniform', due to primordial density fluctuations, whilst on the smallest scales, the system becomes almost `antihyperuniform', and, via the order metric, is shown to be a highly correlated disordered system. Via a finite scaling analysis, we show that the percolation threshold of the galaxy catalogs is significantly lower than for Poisson realizations; this is consistent with the observation that the galaxy distribution contains larger voids. However, the two sets of simulations share a fractal dimension, implying that they lie in the same universality class. Finally, we consider the ability of large-scale clustering statistics to constrain cosmological parameters using simulation-based inference. Both the nearest-neighbor distribution and pair-connectedness function considerably tighten bounds on the amplitude of cosmological fluctuations at a level equivalent to observing twenty-five times more galaxies. These are a useful alternative to the three-particle correlation, and are computable in much reduced time. (Abridged)","abx":0,"nw":0,"d":"2022-07-01","dq":0,"y":2022,"au":[498,562],"c":19,"cs":0,"bib":"2023PhRvX..13a1038P","v":"","lk":"arXiv:2207.00519","url":"https://arxiv.org/abs/2207.00519","doi":"","tg":{"s":["Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Higher-order statistics"],"m":["Simulation-based inference"],"u":["Molino / HOD galaxy mocks"]},"x":0.2338,"yy":-0.253,"p3":[0.6436,-0.2245,-0.5742],"sim":{"k":"w","l":[[310,0.157],[322,0.144],[173,0.128],[295,0.12],[131,0.117]]},"c3":[-62.13,75.55,-160.43],"c2":[41.38,138.46],"k":2,"r":[260,261,280,292,295,297,310,313,322,326,331,339],"rm":0},{"id":"2206.15450","t":"Quijote PNG: The information content of the halo power spectrum and bispectrum","ab":"We investigate how much can be learnt about four types of primordial non-Gaussianity (PNG) from small-scale measurements of the halo field. Using the QUIJOTE-PNG simulations, we quantify the information content accessible with measurements of the halo power spectrum monopole and quadrupole, the matter power spectrum, the halo-matter cross spectrum and the halo bispectrum monopole. This analysis is the first to include small, non-linear scales, up to $k_\\mathrm{max}=0.5 \\mathrm{h/Mpc}$, and to explore whether these scales can break degeneracies with cosmological and nuisance parameters making use of thousands of N-body simulations. We perform all the halo measurements in redshift space with a single sample comprised of all halos with mass $>3.2 \\times 10^{13}~h^{-1}M_\\odot$. For local PNG, measurements of the scale dependent bias effect from the power spectrum using sample variance cancellation provide significantly tighter constraints than measurements of the halo bispectrum. In this case measurements of the small scales add minimal additional constraining power. In contrast, the information on equilateral and orthogonal PNG is primarily accessible through the bispectrum. For these shapes, small scale measurements increase the constraining power of the halo bispectrum by up to $\\times4$, though the addition of scales beyond $k\\approx 0.3 \\mathrm{h/Mpc}$ improves constraints largely through reducing degeneracies between PNG and the other parameters. These degeneracies are even more powerfully mitigated through combining power spectrum and bispectrum measurements. However even with combined measurements and small scale information, equilateral non-Gaussianity remains highly degenerate with $σ_8$ and our bias model.","abx":0,"nw":0,"d":"2022-06-30","dq":0,"y":2022,"au":[665,240,187,424,247,176,462,397,95],"c":52,"cs":0,"bib":"2023ApJ...943..178C","v":"Astrophysical Journal","lk":"arXiv:2206.15450","url":"https://arxiv.org/abs/2206.15450","doi":"10.3847/1538-4357/aca7c1","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.2018,"yy":0.5296,"p3":[-0.7141,0.1585,-0.0248],"sim":{"k":"e","l":[[264,0.968],[242,0.964],[226,0.963],[181,0.962],[229,0.957]]},"c3":[-42.56,-120.88,-65.7],"c2":[107.64,-145.27],"k":5,"r":[259,263,264,266,285,312,333,336,339],"rm":0},{"id":"2206.14120","t":"Velocity profiles of matter and biased tracers around voids","ab":"The velocity profile of galaxies around voids is a key ingredient for redshift space distortion (RSD) measurements made using the void-galaxy correlation function. In this paper we use simulations to test whether the velocity profile of the tracers used to find the voids matches the velocity profile of the dark matter around these voids. A mismatch is expected and found in the inner part of voids, where tracers are very sparse. We discuss how this difference is caused by a selection effect where the void centre positions are correlated to the particular realization of the sparse tracers and their spatial distribution. In turn, this then affects the RSD void-galaxy correlation analysis. We show this by evaluating the Jacobian of the real to redshift space mapping using the tracer or matter velocity profile. Differences of the order of 20\\% in the velocity profile translate into differences of the order of few percent in the Jacobian. This small discrepancy propagates to the monopole and quadrupole of the void-tracer correlation function, producing modifications of comparable magnitude to those from changes in $fσ_8$ at the level of the statistical uncertainties from current analyses.","abx":0,"nw":0,"d":"2022-06-28","dq":0,"y":2022,"au":[200,661,480,574,595,270,35],"c":19,"cs":0,"bib":"2022MNRAS.517.4458M","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2206.14120","url":"https://arxiv.org/abs/2206.141
