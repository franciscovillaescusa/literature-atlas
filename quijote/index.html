20","doi":"10.1093/mnras/stac2892","tg":{"s":["Quijote (set not stated)"],"d":["Particle snapshots","Halo catalogs","Void catalogs","Redshift space"],"m":["No ML"],"u":["Particle snapshots"]},"x":0.3726,"yy":-0.7298,"p3":[-0.033,-0.7486,0.1025],"sim":{"k":"e","l":[[165,0.934],[216,0.93],[113,0.929],[82,0.928],[240,0.924]]},"c3":[-25.8,113.78,107.13],"c2":[-30.93,-73.83],"k":9,"r":[339],"rm":0},{"id":"2206.10458","t":"Primordial non-Gaussianity and non-Gaussian Covariance","ab":"In the pursuit of primordial non-Gaussianities, we hope to access smaller scales across larger comoving volumes. At low redshift, the search for primordial non-Gaussianities is hindered by gravitational collapse, to which we often associate a scale $k_{\\rm NL}$. Beyond these scales, it will be hard to reconstruct the modes sensitive to the primordial distribution. When forecasting future constraints on the amplitude of primordial non-Gaussianity, $f_{\\rm NL}$, off-diagonal components are usually neglected in the covariance because these are small compared to the diagonal. We show that the induced non-Gaussian off-diagonal components in the covariance degrade forecast constraints on primordial non-Gaussianity, even when all modes are well within what is usually considered the linear regime. As a testing ground, we examine the effects of these off-diagonal components on the constraining power of the matter bispectrum on $f_{\\rm NL}$ as a function of $k_{\\rm max}$ and redshift, confirming our results against N-body simulations out to redshift $z=10$. We then consider these effects on the hydrogen bispectrum as observed from a PUMA-like 21-cm intensity mapping survey at redshifts $2<z<6$ and show that not including off-diagonal covariance over-predicts the constraining power on $f_{\\rm NL}$ by up to a factor of $5$. For future surveys targeting even higher redshifts, such as Cosmic Dawn and the Dark Ages, which are considered ultimate surveys for primordial non-Gaussianity, we predict that non-Gaussian covariance would severely limit prospects to constrain $f_{\\rm NL}$ from the bispectrum.","abx":0,"nw":0,"d":"2022-06-21","dq":0,"y":2022,"au":[623,442,502],"c":25,"cs":0,"bib":"2023PhRvD.107b3528F","v":"Physical Review D","lk":"arXiv:2206.10458","url":"https://arxiv.org/abs/2206.10458","doi":"10.1103/PhysRevD.107.023528","tg":{"s":["Fiducial"],"d":["Density fields","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Perturbation theory & analytic models"]},"x":0.0869,"yy":0.6224,"p3":[-0.6441,-0.0147,0.0137],"sim":{"k":"e","l":[[123,0.962],[242,0.96],[257,0.957],[248,0.953],[285,0.953]]},"c3":[27.02,-203.05,-45.9],"c2":[147.02,-188.34],"k":5,"r":[264,276,285,339],"rm":0},{"id":"2206.04594","t":"Field Level Neural Network Emulator for Cosmological N-body Simulations","ab":"We build a field level emulator for cosmic structure formation that is accurate in the nonlinear regime. Our emulator consists of two convolutional neural networks trained to output the nonlinear displacements and velocities of N-body simulation particles based on their linear inputs. Cosmology dependence is encoded in the form of style parameters at each layer of the neural network, enabling the emulator to effectively interpolate the outcomes of structure formation between different flat $Λ$CDM cosmologies over a wide range of background matter densities. The neural network architecture makes the model differentiable by construction, providing a powerful tool for fast field level inference. We test the accuracy of our method by considering several summary statistics, including the density power spectrum with and without redshift space distortions, the displacement power spectrum, the momentum power spectrum, the density bispectrum, halo abundances, and halo profiles with and without redshift space distortions. We compare these statistics from our emulator with the full N-body results, the COLA method, and a fiducial neural network with no cosmological dependence. We find our emulator gives accurate results down to scales of $k \\sim 1\\ \\mathrm{Mpc}^{-1}\\, h$, representing a considerable improvement over both COLA and the fiducial neural network. We also demonstrate that our emulator generalizes well to initial conditions containing primordial non-Gaussianity, without the need for any additional style parameters or retraining.","abx":0,"nw":0,"d":"2022-06-09","dq":0,"y":2022,"au":[187,684,537,240,580,166],"c":74,"cs":0,"bib":"2023ApJ...952..145J","v":"Astrophysical Journal","lk":"arXiv:2206.04594","url":"https://arxiv.org/abs/2206.04594","doi":"10.3847/1538-4357/acdb6c","tg":{"s":["Latin hypercube","Quijote-PNG"],"d":["Particle snapshots","Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["CNN","Emulators & regression ML"],"u":["Latin hypercube","Quijote-PNG"]},"x":-0.4961,"yy":-0.4108,"p3":[0.3907,-0.0827,0.6833],"sim":{"k":"e","l":[[156,0.967],[261,0.957],[222,0.957],[21,0.957],[188,0.954]]},"c3":[11.24,-14.86,21.29],"c2":[114.93,-73.04],"k":1,"r":[264,272,280,286,291,309,313,339],"rm":0},{"id":"2206.04573","t":"Simple lessons from complex learning: what a neural network model learns about cosmic structure formation","ab":"We train a neural network model to predict the full phase space evolution of cosmological N-body simulations. Its success implies that the neural network model is accurately approximating the Green's function expansion that relates the initial conditions of the simulations to its outcome at later times in the deeply nonlinear regime. We test the accuracy of this approximation by assessing its performance on well understood simple cases that have either known exact solutions or well understood expansions. These scenarios include spherical configurations, isolated plane waves, and two interacting plane waves: initial conditions that are very different from the Gaussian random fields used for training. We find our model generalizes well to these well understood scenarios, demonstrating that the networks have inferred general physical principles and learned the nonlinear mode couplings from the complex, random Gaussian training data. These tests also provide a useful diagnostic for finding the model's strengths and weaknesses, and identifying strategies for model improvement. We also test the model on initial conditions that contain only transverse modes, a family of modes that differ not only in their phases but also in their evolution from the longitudinal growing modes used in the training set. When the network encounters these initial conditions that are orthogonal to the training set, the model fails completely. In addition to these simple configurations, we evaluate the model's predictions for the density, displacement, and momentum power spectra with standard initial conditions for N-body simulations. We compare these summary statistics against N-body results and an approximate, fast simulation method called COLA. Our model achieves percent level accuracy at nonlinear scales of $k\\sim 1\\ \\mathrm{Mpc}^{-1}\\, h$, representing a significant improvement over COLA.","abx":0,"nw":0,"d":"2022-06-09","dq":0,"y":2022,"au":[187,684,594,240,580,537,166],"c":4,"cs":0,"bib":"2022arXiv220604573J","v":"PNAS Nexus","lk":"arXiv:2206.04573","url":"https://arxiv.org/abs/2206.04573","doi":"10.1093/pnasnexus/pgac250","tg":{"s":["Quijote (set not stated)"],"d":["Particle snapshots","Power spectra"],"m":["CNN","Emulators & regression ML"],"u":["CNN"]},"x":-0.4729,"yy":-0.4372,"p3":[0.5161,-0.1791,0.622],"sim":{"k":"e","l":[[260,0.957],[156,0.945],[21,0.943],[311,0.943],[188,0.941]]},"c3":[69.56,-70.24,-14.0],"c2":[105.1,-92.15],"k":1,"r":[313,339],"rm":0},{"id":"2206.01709","t":"Cosmological Information in the Marked Power Spectrum of the Galaxy Field","ab":"Marked power spectra are two-point statistics of a marked field obtained by weighting each location with a function that depends on the local density around that point. We consider marked power spectra of the galaxy field in redshift space that up-weight low density regions, and perform a Fisher matrix analysis to assess the information content of this type of statistics using the Molino mock catalogs built upon the Quijote simulations. We identify four different ways to up-weight the galaxy field, and compare the Fisher information contained in their marked power spectra to the one of the standard galaxy power spectrum, when considering monopole and quadrupole of each statistic. Our results show that each of the four marked power spectra can tighten the standard power spectrum constraints on the cosmological parameters $Ω_{\\rm m}$, $Ω_{\\rm b}$, $h$, $n_s$, $M_ν$ by $15-25\\%$ and on $σ_8$ by a factor of 2. The same analysis performed by combining the standard and four marked power spectra shows a substantial improvement compared to the power spectrum constraints that is equal to a factor of 6 for $σ_8$ and $2.5-3$ for the other parameters. Our constraints may be conservative, since the galaxy number density in the Molino catalogs is much lower than the ones in future galaxy surveys, which will allow them to probe lower density regions of the large-scale structure.","abx":0,"nw":0,"d":"2022-06-03","dq":0,"y":2022,"au":[200,240,122,471,458,580,507,84,107],"c":60,"cs":0,"bib":"2023ApJ...951...70M","v":"Astrophysical Journal","lk":"arXiv:2206.01709","url":"https://arxiv.org/abs/2206.01709","doi":"10.3847/1538-4357/acd44d","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.3633,"yy":-0.0898,"p3":[0.3282,-0.0874,-0.396],"sim":{"k":"e","l":[[176,0.944],[331,0.942],[97,0.93],[128,0.929],[118,0.929]]},"c3":[130.39,143.5,-135.61],"c2":[264.47,77.92],"k":3,"r":[272,284,291,297,308,312,317,326,331,334,339],"rm":0},{"id":"2206.01624","t":"Quijote-PNG: Quasi-maximum likelihood estimation of Primordial Non-Gaussianity in the non-linear dark matter density field","ab":"Future Large Scale Structure surveys are expected to improve over current bounds on primordial non-Gaussianity (PNG), with a significant impact on our understanding of early Universe physics. The level of such improvements will however strongly depend on the extent to which late time non-linearities erase the PNG signal on small scales. In this work, we show how much primordial information remains in the bispectrum of the non-linear dark matter density field by implementing a new, simulation-based, methodology for joint estimation of PNG amplitudes ($f_{\\rm NL}$) and standard $Λ$CDM parameters. The estimator is based on optimally compressed statistics, which, for a given input density field, combine power spectrum and modal bispectrum measurements, and numerically evaluate their covariance and their response to changes in cosmological parameters. We train and validate the estimator using a large suite of N-body simulations (QUIJOTE-PNG), including different types of PNG (local, equilateral, orthogonal). We explicitly test the estimator's unbiasedness, optimality and stability with respect to changes in the total number of input realizations. While the dark matter power spectrum itself contains negligible PNG information, as expected, including it as an ancillary statistic increases the PNG information content extracted from the bispectrum by a factor of order $2$. As a result, we prove the capability of our approach to optimally extract PNG information on non-linear scales beyond the perturbative regime, up to $k_{\\rm max} = 0.5~h\\,{\\rm Mpc}^{-1}$, obtaining marginalized $1$-$σ$ bounds of $Δf_{\\rm NL}^{\\rm local} \\sim 16$, $Δf_{\\rm NL}^{\\rm equil} \\sim 77$ and $Δf_{\\rm NL}^{\\rm ortho} \\sim 40$ on a cubic volume of $1~(\\mathrm{Gpc}/h)^3$ at $z=1$. At the same time, we discuss the significant information on cosmological parameters contained on these scales.","abx":0,"nw":0,"d":"2022-06-03","dq":0,"y":2022,"au":[247,176,462,424,665,187,397,240,95],"c":26,"cs":0,"bib":"2022ApJ...940...71J","v":"Astrophysical Journal","lk":"arXiv:2206.01624","url":"https://arxiv.org/abs/2206.01624","doi":"10.3847/1538-4357/ac9837","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.2024,"yy":0.4522,"p3":[-0.3532,0.2714,0.3478],"sim":{"k":"e","l":[[242,0.975],[264,0.97],[228,0.961],[110,0.961],[181,0.958]]},"c3":[-66.38,-139.45,-102.39],"c2":[18.48,-128.48],"k":5,"r":[264,266,274,285,300,304,312,318,319,333,336,339],"rm":0},{"id":"2206.01619","t":"Quijote-PNG: Simulations of primordial non-Gaussianity and the information content of the matter field power spectrum and bispectrum","ab":"Primordial non-Gaussianity (PNG) is one of the most powerful probes of the early Universe and measurements of the large scale structure of the Universe have the potential to transform our understanding of this area. However relating measurements of the late time Universe to the primordial perturbations is challenging due to the non-linear processes that govern the evolution of the Universe. To help address this issue we release a large suite of N-body simulations containing four types of PNG: \\textsc{quijote-png}. These simulations were designed to augment the \\textsc{quijote} suite of simulations that explored the impact of various cosmological parameters on large scale structure observables. Using these simulations we investigate how much information on PNG can be extracted by extending power spectrum and bispectrum measurements beyond the perturbative regime at $z=0.0$. This is the first joint analysis of the PNG and cosmological information content accessible with power spectrum and bispectrum measurements of the non-linear scales. We find that the constraining power improves significantly up to $k_\\mathrm{max}\\approx 0.3 h/{\\rm Mpc}$, with diminishing returns beyond as the statistical probes signal-to-noise ratios saturate. This saturation emphasizes the importance of accurately modelling all the contributions to the covariance matrix. Further we find that combining the two probes is a powerful method of breaking the degeneracies with the $Λ$CDM parameters.","abx":0,"nw":0,"d":"2022-06-03","dq":0,"y":2022,"au":[665,240,187,424,247,176,462,397,95],"c":67,"cs":0,"bib":"2023ApJ...943...64C","v":"Astrophysical Journal","lk":"arXiv:2206.01619","url":"https://arxiv.org/abs/2206.01619","doi":"10.3847/1538-4357/aca8a7","tg":{"s":["Fiducial","Fisher derivatives","Quijote-PNG"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.1917,"yy":0.4964,"p3":[-0.7035,0.2085,0.1949],"sim":{"k":"e","l":[[263,0.97],[257,0.968],[181,0.967],[242,0.962],[229,0.955]]},"c3":[-73.66,-83.32,-38.71],"c2":[69.51,-123.07],"k":5,"r":[257,263,285,333,335,336,339],"rm":0},{"id":"2205.15327","t":"Accurate predictions from small boxes: variance suppression via the Zel'dovich approximation","ab":"Simulations have become an indispensable tool for accurate modelling of observables measured in galaxy surveys, but can be expensive if very large dynamic range in scale is required. We describe how to combine Lagrangian perturbation theory models with N-body simulations to reduce the effects of finite computational volume in the prediction of ensemble average properties in the simulations within the context of control variates. In particular we use the fact that Zel'dovich displacements, computed during initial condition generation for any simulation, correlate strongly with the final density field. Since all the correlators of biased tracers can be computed with arbitrary precision for these displacements, pairing the Zel'dovich `simulation' with the N-body realization allows hundredfold reductions in sample variance for power spectrum or correlation function estimation. Zel'dovich control variates can accurately extend matter or tracer field emulators to larger scales than previously possible, as well as improving measurements of statistics in simulations which are inherently limited to small volumes, such as hydrodynamical simulations of galaxy formation and reionization.","abx":0,"nw":0,"d":"2022-05-30","dq":0,"y":2022,"au":[484,578,437,344,434],"c":35,"cs":0,"bib":"2022JCAP...09..059K","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2205.15327","url":"https://arxiv.org/abs/2205.15327","doi":"10.1088/1475-7516/2022/09/059","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Particle snapshots","Power spectra"],"m":["Perturbation theory & analytic models","No ML"],"u":["Density fields","Particle snapshots"]},"x":-0.6315,"yy":0.2591,"p3":[0.4455,-0.2381,-0.4933],"sim":{"k":"e","l":[[79,0.936],[328,0.932],[207,0.931],[274,0.928],[298,0.925]]},"c3":[-119.22,-88.65,-164.67],"c2":[-154.71,-75.83],"k":2,"r":[274,295,300,318,339],"rm":0},{"id":"2205.12964","t":"Robust Neural Network-Enhanced Estimation of Local Primordial Non-Gaussianity","ab":"When applied to the non-linear matter distribution of the universe, neural networks have been shown to be very statistically sensitive probes of cosmological parameters, such as the linear perturbation amplitude $σ_8$. However, when used as a \"black box\", neural networks are not robust to baryonic uncertainty. We propose a robust architecture for constraining primordial non-Gaussianity $f_{NL}$, by training a neural network to locally estimate $σ_8$, and correlating these local estimates with the large-scale density field. We apply our method to N-body simulations, and show that $σ(f_{NL})$ is 3.5 times better than the constraint obtained from a standard halo-based approach. We show that our method has the same robustness property as large-scale halo bias: baryonic physics can change the normalization of the estimated $f_{NL}$, but cannot change whether $f_{NL}$ is detected.","abx":0,"nw":0,"d":"2022-05-25","dq":0,"y":2022,"au":[639,469,372],"c":19,"cs":0,"bib":"2023PhRvD.107f1301G","v":"Physical Review D","lk":"arXiv:2205.12964","url":"https://arxiv.org/abs/2205.12964","doi":"10.1103/PhysRevD.107.L061301","tg":{"s":["Quijote-PNG"],"d":["Density fields","Halo catalogs"],"m":["CNN"],"u":["Quijote-PNG","CNN","Halo catalogs"]},"x":0.0617,"yy":0.5156,"p3":[-0.4712,0.1882,0.4164],"sim":{"k":"e","l":[[228,0.953],[229,0.95],[141,0.948],[123,0.947],[313,0.945]]},"c3":[-108.28,-113.21,-35.06],"c2":[21.79,-166.97],"k":1,"r":[279,291,301,316,339],"rm":0},{"id":"2205.11533","t":"Two-loop power spectrum with full time- and scale-dependence and EFT corrections: impact of massive neutrinos and going beyond EdS","ab":"We compute the density and velocity power spectra at next-to-next-to-leading order taking into account the effect of time- and scale-dependent growth of massive neutrino perturbations as well as the departure from Einstein--de-Sitter (EdS) dynamics at late times non-linearly. We determine the impact of these effects by comparing to the commonly adopted approximate treatment where they are not included. For the bare cold dark matter (CDM)+baryon spectrum, we find percent deviations for $k\\gtrsim 0.17h~\\mathrm{Mpc}^{-1}$, mainly due to the departure from EdS. For the velocity and cross power spectrum the main difference arises due to time- and scale-dependence in presence of massive neutrinos yielding percent deviation above $k\\simeq 0.08, 0.13, 0.16h~\\mathrm{Mpc}^{-1}$ for $\\sum m_ν = 0.4, 0.2, 0.1~\\mathrm{eV}$, respectively. We use an effective field theory (EFT) framework at two-loop valid for wavenumbers $k \\gg k_{\\mathrm{FS}}$, where $k_{\\mathrm{FS}}$ is the neutrino free-streaming scale. Comparing to Quijote N-body simulations, we find that for the CDM+baryon density power spectrum the effect of neutrino perturbations and exact time-dependent dynamics at late times can be accounted for by a shift in the one-loop EFT counterterm, $Δ\\barγ_1 \\simeq - 0.2~\\mathrm{Mpc}^2/h^2$. We find percent agreement between the perturbative and N-body results up to $k\\lesssim 0.12h~\\mathrm{Mpc}^{-1}$ and $k\\lesssim 0.16h~\\mathrm{Mpc}^{-1}$ at one- and two-loop order, respectively, for all considered neutrino masses $\\sum m_ν \\leq 0.4~\\mathrm{eV}$.","abx":0,"nw":0,"d":"2022-05-23","dq":0,"y":2022,"au":[440,515],"c":26,"cs":0,"bib":"2022JCAP...09..054G","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2205.11533","url":"https://arxiv.org/abs/2205.11533","doi":"10.1088/1475-7516/2022/09/054","tg":{"s":["Fiducial","Massive neutrinos"],"d":["Power spectra"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":-0.5617,"yy":0.4949,"p3":[-0.2,-0.3677,-0.8185],"sim":{"k":"e","l":[[253,0.933],[210,0.931],[299,0.928],[109,0.925],[317,0.923]]},"c3":[119.08,51.49,-173.81],"c2":[15.19,179.89],"k":4,"r":[292,299,312,336,339],"rm":0},{"id":"2205.10881","t":"Improving cosmological covariance matrices with machine learning","ab":"Cosmological covariance matrices are fundamental for parameter inference, since they are responsible for propagating uncertainties from the data down to the model parameters. However, when data vectors are large, in order to estimate accurate and precise matrices we need huge numbers of observations, or rather costly simulations - neither of which may be viable. In this work we propose a machine learning approach to alleviate this problem in the context of the matrices used in the study of large-scale structure. With only a small amount of data (matrices built with samples of 50-200 halo power spectra) we are able to provide significantly improved matrices, which are almost indistinguishable from the ones built from much larger samples (thousands of spectra). In order to perform this task we trained convolutional neural networks to denoise the matrices, using in the training process a data set made up entirely of spectra extracted from simple, inexpensive halo simulations (mocks). We then show that the method not only removes the noise in the matrices of the cheap simulation, but it is also able to successfully denoise the matrices of halo power spectra from N-body simulations. We compare the denoised to the other matrices using several metrics, and in all of them they score better, without any signs of spurious artifacts. With the help of the Wishart distribution we derive an analytical extrapolation for the effective sample augmentation allowed by the denoiser. Finally, we show that, by using the denoised matrices, the cosmological parameters can be recovered with nearly the same accuracy as when using matrices built with a sample of 30,000 spectra in the case of the cheap simulations, and with 15,000 spectra in the case of the N-body simulations. Of particular interest is the bias in the Hubble parameter $H_0$, which was significantly reduced after applying the denoiser.","abx":0,"nw":0,"d":"2022-05-22","dq":0,"y":2022,"au":[478,382],"c":11,"cs":0,"bib":"2022JCAP...09..013D","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2205.10881","url":"https://arxiv.org/abs/2205.10881","doi":"10.1088/1475-7516/2022/09/013","tg":{"s":["Fiducial"],"d":["Halo catalogs","Power spectra"],"m":["CNN"],"u":[]},"x":-0.4004,"yy":-0.2496,"p3":[0.1033,0.3349,0.3921],"sim":{"k":"e","l":[[92,0.944],[266,0.936],[313,0.936],[115,0.934],[222,0.933]]},"c3":[-89.13,-97.05,-142.56],"c2":[-101.81,-39.61],"k":1,"r":[286,300,313,318,332,339],"rm":0},{"id":"2205.07898","t":"Fast and realistic large-scale structure from machine-learning-augmented random field simulations","ab":"Producing thousands of simulations of the dark matter distribution in the Universe with increasing precision is a challenging but critical task to facilitate the exploitation of current and forthcoming cosmological surveys. Many inexpensive substitutes to full $N$-body simulations have been proposed, even though they often fail to reproduce the statistics of the smaller, non-linear scales. Among these alternatives, a common approximation is represented by the lognormal distribution, which comes with its own limitations as well, while being extremely fast to compute even for high-resolution density fields. In this work, we train a generative deep learning model, mainly made of convolutional layers, to transform projected lognormal dark matter density fields to more realistic dark matter maps, as obtained from full $N$-body simulations. We detail the procedure that we follow to generate highly correlated pairs of lognormal and simulated maps, which we use as our training data, exploiting the information of the Fourier phases. We demonstrate the performance of our model comparing various statistical tests with different field resolutions, redshifts and cosmological parameters, proving its robustness and explaining its current limitations. When evaluated on 100 test maps, the augmented lognormal random fields reproduce the power spectrum up to wavenumbers of $1 \\ h \\ \\rm{Mpc}^{-1}$, and the bispectrum within 10%, and always within the error bars, of the fiducial target simulations. Finally, we describe how we plan to integrate our proposed model with existing tools to yield more accurate spherical random fields for weak lensing analysis.","abx":0,"nw":0,"d":"2022-05-16","dq":0,"y":2022,"au":[169,96,240],"c":22,"cs":0,"bib":"2023MNRAS.520..668P","v":"arXiv.org","lk":"arXiv:2205.07898","url":"https://arxiv.org/abs/2205.07898","doi":"10.1093/mnras/stad052","tg":{"s":["Fiducial","Latin hypercube"],"d":["Density fields","Power spectra","Higher-order statistics","Weak lensing & 2D maps"],"m":["CNN","Generative models"],"u":["Latin hypercube","Weak lensing & 2D maps"]},"x":-0.5371,"yy":-0.5739,"p3":[0.3456,0.1134,0.8159],"sim":{"k":"e","l":[[137,0.959],[110,0.947],[313,0.946],[31,0.944],[114,0.944]]},"c3":[13.16,-107.92,-110.64],"c2":[-40.12,-110.26],"k":1,"r":[300,303,311,313,318,327,332,339],"rm":0},{"id":"2205.00808","t":"Distinguishing Dirac vs. Majorana Neutrinos: a Cosmological Probe","ab":"Cosmic background neutrinos ($C_νB)$ helicity composition is different for Dirac or Majorana neutrinos making detectors based on $C_νB$ capture sensitive to the nature of neutrinos. We calculate, for the first time, the helicity changes of neutrinos crossing dark matter fields, to quantitatively calculate this effect on the capture rate. We show that a fraction of neutrinos change their helicity, regardless of them being deflected by a void or a dark matter halo. The average signal from the 100 most massive voids or halos in a Gpc$^3$ gives a prediction that if neutrinos are Dirac, the density of the $C_ν B$ background measured on Earth should be 48 cm${^{-3}}$ for left-helical neutrinos, a decrease of 15% (53.6 cm${^{-3}}$; 5%) for a halo (void) with respect to the standard calculation without including gravitational effects due to large scale structures. In terms of the total capture rate in a 100 g tritium detector, this translates in $4.9^{+1.1}_{-0.8}$ neutrinos per year for the Dirac case, as a function of the unknown neutrino mass scale, or 8.1 per year if neutrinos are Majorana. Thus although smaller than the factor two for the non-relativistic case, it is still large enough to be detected and it highlights the power of future $C_ν B$ detectors, as an alternative to neutrinoless double beta decay experiments, to discover the neutrino nature.","abx":0,"nw":0,"d":"2022-05-02","dq":0,"y":2022,"au":[92,535,115],"c":12,"cs":0,"bib":"2022JCAP...08..038H","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2205.00808","url":"https://arxiv.org/abs/2205.00808","doi":"10.1088/1475-7516/2022/08/038","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Void catalogs"],"m":["No ML"],"u":["Halo catalogs","Void catalogs"]},"x":-0.1057,"yy":0.2569,"p3":[-0.1225,0.3906,-0.562],"sim":{"k":"e","l":[[195,0.918],[292,0.918],[237,0.915],[331,0.908],[25,0.908]]},"c3":[45.65,-10.73,89.13],"c2":[-113.36,138.39],"k":8,"r":[339],"rm":0},{"id":"2204.13131","t":"Accurate Model of the Projected Velocity Distribution of Galaxies in Dark Matter Halos","ab":"We present a percent-level accurate model of the line-of-sight velocity distribution of galaxies around dark matter halos as a function of projected radius and halo mass. The model is developed and tested using synthetic galaxy catalogs generated with the UniverseMachine run on the Multi-Dark Planck 2 N-body simulations. The model decomposes the galaxies around a cluster into three kinematically distinct classes: orbiting, infalling, and interloping galaxies. We demonstrate that: 1) we can statistically distinguish between these three types of galaxies using only projected line-of-sight velocity information; 2) the halo edge radius inferred from the line-of-sight velocity dispersion is an excellent proxy for the three-dimensional halo edge radius; 3) we can accurately recover the full velocity dispersion profile for each of the three populations of galaxies. Importantly, the velocity dispersion profiles of the orbiting and infalling galaxies contain five independent parameters -- three distinct radial scales and two velocity dispersion amplitudes -- each of which is correlated with mass. Thus, the velocity dispersion profile of galaxy clusters has inherent redundancies that allow us to perform nontrivial systematics check from a single data set. We discuss several potential applications of our new model for detecting the edge radius and constraining cosmology and astrophysics using upcoming spectroscopic surveys.","abx":0,"nw":0,"d":"2022-04-27","dq":0,"y":2022,"au":[269,156,197,103,608],"c":16,"cs":0,"bib":"2023MNRAS.521.3981A","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2204.13131","url":"https://arxiv.org/abs/2204.13131","doi":"10.1093/mnras/stad601","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs","Galaxy mocks (HOD)","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Galaxy mocks (HOD)"]},"x":-0.3689,"yy":0.0054,"p3":[0.3817,-0.1703,-0.1937],"sim":{"k":"e","l":[[197,0.927],[305,0.922],[142,0.915],[168,0.914],[0,0.913]]},"c3":[-115.67,-22.67,68.14],"c2":[-140.69,-5.24],"k":7,"r":[339],"rm":0},{"id":"2204.07646","t":"Wavelet Moments for Cosmological Parameter Estimation","ab":"Extracting non-Gaussian information from the non-linear regime of structure formation is key to fully exploiting the rich data from upcoming cosmological surveys probing the large-scale structure of the universe. However, due to theoretical and computational complexities, this remains one of the main challenges in analyzing observational data. We present a set of summary statistics for cosmological matter fields based on 3D wavelets to tackle this challenge. These statistics are computed as the spatial average of the complex modulus of the 3D wavelet transform raised to a power $q$ and are therefore known as invariant wavelet moments. The 3D wavelets are constructed to be radially band-limited and separable on a spherical polar grid and come in three types: isotropic, oriented, and harmonic. In the Fisher forecast framework, we evaluate the performance of these summary statistics on matter fields from the Quijote suite, where they are shown to reach state-of-the-art parameter constraints on the base $Λ$CDM parameters, as well as the sum of neutrino masses. We show that we can improve constraints by a factor 5 to 10 in all parameters with respect to the power spectrum baseline.","abx":0,"nw":0,"d":"2022-04-15","dq":0,"y":2022,"au":[458,213,84,507,200,471,122,604,107,580,602,335,240],"c":62,"cs":0,"bib":"2022arXiv220407646E","v":"","lk":"arXiv:2204.07646","url":"https://arxiv.org/abs/2204.07646","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.6658,"yy":0.217,"p3":[-0.4281,-0.2141,0.6738],"sim":{"k":"e","l":[[327,0.952],[291,0.949],[157,0.946],[178,0.94],[62,0.939]]},"c3":[122.1,146.01,-80.99],"c2":[234.58,121.38],"k":5,"r":[291,292,304,309,310,312,322,327,330,331,334,336,337,339],"rm":0},{"id":"2204.05435","t":"Quantification of high dimensional non-Gaussianities and its implication to Fisher analysis in cosmology","ab":"It is well known that the power spectrum is not able to fully characterize the statistical properties of non-Gaussian density fields. Recently, many different statistics have been proposed to extract information from non-Gaussian cosmological fields that perform better than the power spectrum. The Fisher matrix formalism is commonly used to quantify the accuracy with which a given statistic can constrain the value of the cosmological parameters. However, these calculations typically rely on the assumption that the likelihood of the considered statistic follows a multivariate Gaussian distribution. In this work we follow Sellentin & Heavens (2017) and use two different statistical tests to identify non-Gaussianities in different statistics such as the power spectrum, bispectrum, marked power spectrum, and wavelet scatering transform (WST). We remove the non-Gaussian components of the different statistics and perform Fisher matrix calculations with the \\textit{Gaussianized} statistics using Quijote simulations. We show that constraints on the parameters can change by a factor of $\\sim 2$ in some cases. We show with simple examples how statistics that do not follow a multivariate Gaussian distribution can achieve artificially tight bounds on the cosmological parameters when using the Fisher matrix formalism. We think that the non-Gaussian tests used in this work represent a powerful tool to quantify the robustness of Fisher matrix calculations and their underlying assumptions. We release the code used to compute the power spectra, bispectra, and WST that can be run on both CPUs and GPUs.","abx":0,"nw":0,"d":"2022-04-11","dq":0,"y":2022,"au":[147,213,240,186],"c":20,"cs":0,"bib":"2023ApJ...946..107P","v":"Astrophysical Journal","lk":"arXiv:2204.05435","url":"https://arxiv.org/abs/2204.05435","doi":"10.3847/1538-4357/acbe3b","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fisher derivatives","Density fields"]},"x":0.5971,"yy":0.1789,"p3":[-0.1064,-0.2746,0.4161],"sim":{"k":"e","l":[[327,0.945],[34,0.943],[87,0.939],[178,0.934],[38,0.932]]},"c3":[42.61,98.68,-201.98],"c2":[107.47,179.25],"k":5,"r":[275,283,284,288,291,304,307,308,309,310,312,315,316,319,322,326,327,330,331,333,334,336,337,339],"rm":0},{"id":"2204.03070","t":"Bayesian Control Variates for optimal covariance estimation with pairs of simulations and surrogates","ab":"Predictions of the mean and covariance matrix of summary statistics are critical for confronting cosmological theories with observations, not least for likelihood approximations and parameter inference. The price to pay for accurate estimates is the extreme cost of running $N$-body and hydrodynamics simulations. Approximate solvers, or surrogates, greatly reduce the computational cost but can introduce significant biases, for example in the non-linear regime of cosmic structure growth. We propose \"CARPool Bayes\", an approach to solve the inference problem for both the means and covariances using a combination of simulations and surrogates. Our framework allows incorporating prior information for the mean and covariance. We derive closed-form solutions for Maximum A Posteriori covariance estimates that are efficient Bayesian shrinkage estimators, guarantee positive semi-definiteness, and can optionally leverage analytical covariance approximations. We discuss choices of the prior and propose a simple procedure for obtaining optimal prior hyperparameter values with a small set of test simulations. We test our method by estimating the covariances of clustering statistics of GADGET-III $N$-body simulations at redshift $z=0.5$ using surrogates from a 100-1000$\\times$ faster particle-mesh code. Taking the sample covariance from 15,000 simulations as the truth, and using an empirical Bayes prior with diagonal blocks, our estimator produces nearly identical Fisher matrix contours for $Λ$CDM parameters using only $15$ simulations of the non-linear dark matter power spectrum. In this case the number of simulations is so small that the sample covariance would be degenerate. We show cases where even with a naïve prior our method still improves the estimate. Our framework is applicable to a wide range of cosmological and astrophysical problems where fast surrogates are available.","abx":0,"nw":0,"d":"2022-04-06","dq":0,"y":2022,"au":[488,95],"c":14,"cs":0,"bib":"2022MNRAS.515.1296C","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2204.03070","url":"https://arxiv.org/abs/2204.03070","doi":"10.1093/mnras/stac1837","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Power spectra"],"m":["Fisher forecasts","No ML"],"u":[]},"x":-0.5434,"yy":0.0237,"p3":[0.499,-0.3063,-0.2385],"sim":{"k":"e","l":[[300,0.947],[318,0.94],[205,0.94],[142,0.936],[127,0.935]]},"c3":[-101.41,-149.21,-127.62],"c2":[-112.83,-143.35],"k":7,"r":[300,313,318,332,339],"rm":0},{"id":"2204.02945","t":"Probing massive neutrinos with the Minkowski functionals of large-scale structure","ab":"Massive neutrinos suppress the growth of structure under their free-streaming scales. The effect is most prominent on small scales where the widely-used two-point statistics can no longer capture the full information. In this work, we study the signatures massive neutrinos leave on large-scale structure (LSS) as revealed by its morphological properties, which are fully described by $4$ Minkowski functionals (MFs), and quantify the constraints on the summed neutrino mass $M_ν$ from the MFs, by using publicly available N-body simulations. We find the MFs provide important complementary information, and give tighter constraints on $M_ν$ than the power spectrum. Specifically, depending on whether massive neutrinos are included in the density field (the `m' field) or not (the `cb' field), we find the constraint on $M_ν$ from the MFs with a smoothing scale of $R_G=5 h^{-1}$Mpc is $48$ or $4$ times better than that from the power spectrum. When the MFs are combined with the power spectrum, they can improve the constraint on $M_ν$ from the latter by a factor of 63 for the `m' field and 5 for the `cb' field. Notably, when the `m' field is used, the constraint on $M_ν$ from the MFs can reach $0.0177$eV with a volume of $1(h^{-1}\\rm Gpc)^3$, while the combination of the MFs and power spectrum can tighten this constraint to be $0.0133$eV, a $4.5σ$ significance on detecting the minimum sum of the neutrino masses. For the `m' field, we also find the $σ_8$ and $M_ν$ degeneracy is broken with the MFs, leading to stronger constraints on all 6 cosmological parameters considered in this work than the power spectrum.","abx":0,"nw":0,"d":"2022-04-06","dq":0,"y":2022,"au":[654,70,659],"c":27,"cs":0,"bib":"2022JCAP...07..045L","v":"","lk":"arXiv:2204.02945","url":"https://arxiv.org/abs/2204.02945","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Fisher forecasts"]},"x":0.4688,"yy":0.3318,"p3":[-0.3095,0.6838,-0.1476],"sim":{"k":"w","l":[[234,0.41],[293,0.288],[118,0.251],[192,0.219],[336,0.199]]},"c3":[50.34,223.19,-139.19],"c2":[134.57,240.76],"k":3,"r":[272,291,292,293,308,312,331,334,336,337,339],"rm":0},{"id":"2204.00668","t":"Spherical Bispectrum: A Novel Visualization Scheme For Facilitating Comparisons","ab":"Recent developments of Perturbation Theory (PT), specifically the Effective Field Theory of Large Scale Structure (EFTofLSS) and its equivalents, have proven powerful in analyzing galaxy clustering statistics such as the galaxy power spectrum and bispectrum. To further this pursuit, we have devised a novel spherical-bispectrum visualization scheme that collapses configuration dependencies to highlight the scale dependence of the bispectrum. The resulting one-dimensional curves facilitate the comparison between different bispectra, for example, from simulation and PT calculation. Using the new scheme, we present a quantitative analysis of the accuracy of PT modeling by comparing PT's analytical prediction to the result from a suite of Quijote simulations. Specifically, we determine $k_{\\rm NL}$, the wavenunmber below which the analytical prediction matches well with the N-body result by inspecting both leading order (LO) and next-to-leading order (NLO) power spectrum and bispectrum at redshifts $z=0$, $0.5$, $1$, $2$, $3$. We also quantify the binning effect in Fourier space and show that an appropriate correction must be applied to the analytic predictions in order to compare them with the discrete Fourier transform results obtained from N-body-simulation or real data.","abx":0,"nw":0,"d":"2022-04-01","dq":0,"y":2022,"au":[346,180],"c":7,"cs":0,"bib":"2023JCAP...08..040T","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2204.00668","url":"https://arxiv.org/abs/2204.00668","doi":"10.1088/1475-7516/2023/08/040","tg":{"s":["Fiducial"],"d":["Power spectra","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":0.4947,"yy":0.7217,"p3":[0.1397,-0.093,-0.499],"sim":{"k":"e","l":[[319,0.941],[328,0.94],[79,0.94],[32,0.936],[296,0.934]]},"c3":[69.34,-122.06,-165.11],"c2":[105.74,37.88],"k":5,"r":[296,304,312,319,336,339],"rm":0},{"id":"2203.14724","t":"The effect of local universe constraints on halo abundance and clustering","ab":"Cosmological $N$-body simulations of the dark matter component of the universe typically use initial conditions with a fixed power spectrum and random phases of the density field, leading to structure consistent with the local distribution of galaxies only in a statistical sense. It is, however, possible to infer the initial phases which lead to the configuration of galaxies and clusters that we see around us. We analyse the CSiBORG suite of 101 simulations, formed by constraining the density field within 155 Mpc$/h$ with dark matter particle mass $4.38\\times10^9 M_\\odot$, to quantify the degree to which constraints imposed on 2.65 Mpc$/h$ scales reduce variance in the halo mass function and halo-halo cross-correlation function on a range of scales. This is achieved by contrasting CSiBORG with a subset of the unconstrained Quijote simulations and expectations for the $Λ$CDM average. Using the FOF, PHEW and HOP halofinders, we show that the CSiBORG suite beats cosmic variance at large mass scales ($\\gtrsim 10^{14}M_{\\odot}/h$), which are most strongly constrained by the initial conditions, and exhibits a significant halo-halo cross-correlation out to $\\sim30$ Mpc$/h$. Moreover, the effect of the constraints percolates down to lower mass objects and to scales below those on which they are imposed. Finally, we develop an algorithm to \"twin\" halos between realisations and show that approximately 50% of halos with mass greater than $10^{15}M_{\\odot}/h$ can be identified in all realisations of the CSiBORG suite. We make the CSiBORG halo catalogues publicly available for future applications requiring knowledge of the local halo field.","abx":0,"nw":0,"d":"2022-03-28","dq":0,"y":2022,"au":[455,273,354,23],"c":12,"cs":0,"bib":"2022MNRAS.516.3592H","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2203.14724","url":"https://arxiv.org/abs/2203.14724","doi":"10.1093/mnras/stac2407","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Halo catalogs"],"m":["No ML"],"u":["Fiducial"]},"x":-0.3137,"yy":-0.0758,"p3":[0.6461,-0.0067,-0.1037],"sim":{"k":"e","l":[[197,0.951],[339,0.945],[142,0.945],[37,0.944],[46,0.94]]},"c3":[109.78,-50.01,68.51],"c2":[125.93,-102.41],"k":7,"r":[339],"rm":0},{"id":"2202.05248","t":"Extracting high-order cosmological information in galaxy surveys with power spectra","ab":"The reconstruction method was proposed more than a decade ago to boost the signal of baryonic acoustic oscillations measured in galaxy redshift surveys, which is one of key probes for dark energy. After moving the observed overdensities in galaxy surveys back to their initial position, the reconstructed density field is closer to a linear Gaussian field, with higher-order information moved back into the power spectrum. We find that by jointly analysing power spectra measured from the pre- and post-reconstructed galaxy samples, higher-order information beyond the $2$-point power spectrum can be efficiently extracted, which generally yields an information gain upon the analysis using the pre- or post-reconstructed galaxy sample alone. This opens a window to easily use higher-order information when constraining cosmological models.","abx":0,"nw":0,"d":"2022-02-10","dq":0,"y":2022,"au":[705,261,370,661,552,128,282,122,549,655,672,693,280,227],"c":37,"cs":0,"bib":"2024CmPhy...7..130W","v":"Communications Physics","lk":"arXiv:2202.05248","url":"https://arxiv.org/abs/2202.05248","doi":"10.1038/s42005-024-01624-7","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Halo catalogs","Power spectra"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Halo catalogs","Fisher forecasts"]},"x":0.2661,"yy":0.2854,"p3":[0.014,0.4195,-0.2175],"sim":{"k":"e","l":[[132,0.943],[309,0.933],[190,0.933],[4,0.924],[164,0.923]]},"c3":[176.83,19.12,-110.38],"c2":[242.86,94.92],"k":3,"r":[249,257,309,312,336,339],"rm":0},{"id":"2112.11865","t":"Constraining cosmological parameters from N-body simulations with Bayesian Neural Networks","ab":"In this paper, we use The Quijote simulations in order to extract the cosmological parameters through Bayesian Neural Networks. This kind of model has a remarkable ability to estimate the associated uncertainty, which is one of the ultimate goals in the precision cosmology era. We demonstrate the advantages of BNNs for extracting more complex output distributions and non-Gaussianities information from the simulations.","abx":0,"nw":0,"d":"2021-12-22","dq":0,"y":2021,"au":[283],"c":10,"cs":0,"bib":"2021arXiv211211865H","v":"","lk":"arXiv:2112.11865","url":"https://arxiv.org/abs/2112.11865","doi":"","tg":{"s":["Latin hypercube"],"d":["Density fields"],"m":["CNN","Other ML"],"u":["Latin hypercube","Density fields","CNN"]},"x":0.6488,"yy":-0.4935,"p3":[0.2113,0.205,0.397],"sim":{"k":"e","l":[[238,0.942],[254,0.932],[225,0.927],[228,0.924],[97,0.924]]},"c3":[-162.79,60.48,-21.31],"c2":[-14.85,-36.79],"k":3,"r":[301,339],"rm":1},{"id":"2112.04502","t":"Detection of spatial clustering in the 1000 richest SDSS DR8 redMaPPer clusters with Nearest Neighbor distributions","ab":"Distances to the $k$-nearest-neighbor ($k$NN) data points from volume-filling query points are a sensitive probe of spatial clustering. Here we present the first application of $k$NN summary statistics to observational clustering measurement, using the 1000 richest redMaPPer clusters ($0.1\\leqslant z\\leqslant 0.3$) from the SDSS DR8 catalog. A clustering signal is defined as a difference in the cumulative distribution functions (CDFs) of $k$NN distances from fixed query points to the observed clusters versus a set of unclustered random points. We find that the $k=1,2$-NN CDFs of redMaPPer deviate significantly from the randoms' across scales of 35 to 155 Mpc, which is a robust signature of clustering. In addition to $k$NN, we also measure the two-point correlation function for the same set of redMaPPer clusters versus random points, which shows a noisier and less significant clustering signal within the same radial scales. Quantitatively, the $χ^2$ distribution for both the $k$NN-CDFs and the two-point correlation function measured on the randoms peak at $χ^2\\sim 50$ (null hypothesis), whereas the $k$NN-CDFs ($χ^2\\sim 300$, $p = 1.54\\times 10^{-36}$) pick up a much more significant clustering signal than the two-point function ($χ^2\\sim 100$, $p = 1.16\\times 10^{-6}$) when measured on redMaPPer. Finally, the measured 3NN and 4NN CDFs deviate from the predicted $k=3, 4$-NN CDFs assuming an ideal Gaussian field, indicating a non-Gaussian clustering signal for redMaPPer clusters, although its origin might not be cosmological due to observational systematics. Therefore, $k$NN serves as a more sensitive probe of clustering complementary to the two point correlation function, providing a novel approach for constraining cosmology and galaxy-halo connection.","abx":0,"nw":0,"d":"2021-12-08","dq":0,"y":2021,"au":[702,73,631],"c":20,"cs":0,"bib":"2022MNRAS.514.3828W","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2112.04502","url":"https://arxiv.org/abs/2112.04502","doi":"10.1093/mnras/stac1551","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Higher-order statistics"],"m":["No ML"],"u":["Halo catalogs"]},"x":0.4051,"yy":-0.4401,"p3":[0.6821,0.2111,-0.4263],"sim":{"k":"e","l":[[322,0.932],[310,0.922],[112,0.921],[70,0.92],[247,0.92]]},"c3":[-169.66,76.92,-101.12],"c2":[1.93,-16.87],"k":0,"r":[295,310,322,339],"rm":0},{"id":"2112.04428","t":"One-point statistics matter in extended cosmologies","ab":"The late universe contains a wealth of information about fundamental physics and gravity, wrapped up in non-Gaussian fields. To make use of as much information as possible it is necessary to go beyond two-point statistics. Rather than going to higher order N-point correlation functions, we demonstrate that the probability distribution function (PDF) of spheres in the matter field (a one-point function) already contains a significant amount of this non-Gaussian information. The matter PDF dissects different density environments which are lumped together in two-point statistics, making it particularly useful for probing modifications of gravity or expansion history. Our approach in Cataneo et. al. 2021 extends the success of Large Deviation Theory for predicting the matter PDF in $Λ$CDM in these ''extended'' cosmologies. A Fisher forecast demonstrates the information content in the matter PDF via constraints for a Euclid-like survey volume combining the 3D matter PDF with the 3D matter power spectrum. Adding the matter PDF halves the uncertainties on parameters in an evolving dark energy model, relative to the power spectrum alone. Additionally, the matter PDF contains enough non-linear information to substantially increase the detection significance of departures from General Relativity, with improvements up to six times the power spectrum alone. This analysis demonstrates that the matter PDF is a promising non-Gaussian statistic for extracting cosmological information, particularly for beyond $Λ$CDM models.","abx":0,"nw":0,"d":"2021-12-08","dq":0,"y":2021,"au":[33,146],"c":9,"cs":0,"bib":"2022Univ....8...55G","v":"Universe","lk":"arXiv:2112.04428","url":"https://arxiv.org/abs/2112.04428","doi":"10.3390/universe8010055","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Non-Quijote simulations","Density fields"]},"x":-0.1149,"yy":0.4871,"p3":[0.0515,0.0247,-0.6837],"sim":{"k":"e","l":[[290,0.934],[143,0.933],[87,0.921],[294,0.92],[13,0.92]]},"c3":[-156.39,18.77,-185.53],"c2":[-142.38,54.29],"k":2,"r":[290,298,333,334,339],"rm":0},{"id":"2112.03926","t":"Cosmology with cosmic web environments I. Real-space power spectra","ab":"We undertake the first comprehensive and quantitative real-space analysis of the cosmological information content in the environments of the cosmic web (voids, filaments, walls, and nodes) up to non-linear scales, $k = 0.5$ $h$/Mpc. Relying on the large set of $N$-body simulations from the Quijote suite, the environments are defined through the eigenvalues of the tidal tensor and the Fisher formalism is used to assess the constraining power of the power spectra derived in each of the four environments and their combination. Our results show that there is more information available in the environment-dependent power spectra, both individually and when combined all together, than in the matter power spectrum. By breaking some key degeneracies between parameters of the cosmological model such as $M_ν$--$σ_\\mathrm{8}$ or $Ω_\\mathrm{m}$--$σ_8$, the power spectra computed in identified environments improve the constraints on cosmological parameters by factors $\\sim 15$ for the summed neutrino mass $M_ν$ and $\\sim 8$ for the matter density $Ω_\\mathrm{m}$ over those derived from the matter power spectrum. We show that these tighter constraints are obtained for a wide range of the maximum scale, from $k_\\mathrm{max} = 0.1$ $h$/Mpc to highly non-linear regimes with $k_\\mathrm{max} = 0.5$ $h$/Mpc. We also report an eight times higher value of the signal-to-noise ratio for the combination of spectra compared to the matter one. Importantly, we show that all the presented results are robust to variations of the parameters defining the environments hence suggesting a robustness to the definition we chose to define them.","abx":0,"nw":0,"d":"2021-12-07","dq":0,"y":2021,"au":[634,474,345,82],"c":42,"cs":0,"bib":"2022A&A...661A.146B","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2112.03926","url":"https://arxiv.org/abs/2112.03926","doi":"10.1051/0004-6361/202142852","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.5025,"yy":-0.0247,"p3":[0.1577,0.6499,-0.5156],"sim":{"k":"e","l":[[241,0.967],[108,0.956],[331,0.944],[202,0.942],[61,0.939]]},"c3":[19.73,161.71,-163.79],"c2":[80.01,73.85],"k":8,"r":[284,288,291,297,307,308,325,327,328,334],"rm":0},{"id":"2111.13702","t":"The Information Content of Projected Galaxy Fields","ab":"The power spectrum of the nonlinearly evolved large-scale mass distribution recovers only a minority of the information available on the mass fluctuation amplitude. We investigate the recovery of this information in 2D \"slabs\" of the mass distribution averaged over $\\approx100$~$h^{-1}$Mpc along the line of sight, as might be obtained from photometric redshift surveys. We demonstrate a Hamiltonian Monte Carlo (HMC) method to reconstruct the non-Gaussian mass distribution in slabs, under the assumption that the projected field is a point-transformed Gaussian random field, Poisson-sampled by galaxies. When applied to the \\textit{Quijote} $N$-body suite at $z=0.5$ and at a transverse resolution of 2~$h^{-1}$Mpc, the method recovers $\\sim 30$ times more information than the 2D power spectrum in the well-sampled limit, recovering the Gaussian limit on information. At a more realistic galaxy sampling density of $0.01$~$h^3$Mpc$^{-3}$, shot noise reduces the information gain to a factor of 5 improvement over the power spectrum at resolutions of 4~$h^{-1}$Mpc or smaller.","abx":0,"nw":0,"d":"2021-11-26","dq":0,"y":2021,"au":[403,250,540,16],"c":13,"cs":0,"bib":"2023MNRAS.518.3344P","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2111.13702","url":"https://arxiv.org/abs/2111.13702","doi":"10.1093/mnras/stac3225","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Density fields","Power spectra","Weak lensing & 2D maps"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Fisher derivatives","Fisher forecasts","Perturbation theory & analytic models"]},"x":-0.3093,"yy":0.4263,"p3":[0.2131,-0.025,0.0303],"sim":{"k":"e","l":[[188,0.94],[38,0.939],[317,0.938],[92,0.936],[143,0.935]]},"c3":[123.82,45.99,-131.9],"c2":[172.74,83.1],"k":4,"r":[339],"rm":0},{"id":"2111.12088","t":"Cosmology and neutrino mass with the Minimum Spanning Tree","ab":"The information content of the minimum spanning tree (MST), used to capture higher-order statistics and information from the cosmic web, is compared to that of the power spectrum for a $νΛ$CDM model. The measurements are made in redshift space using haloes from the Quijote simulation of mass $\\geq 3.2\\times 10^{13}\\,h^{-1}{\\rm M}_{\\odot}$ in a box of length $L_{\\rm box}=1\\,h^{-1}{\\rm Gpc}$. The power spectrum multipoles (monopole and quadrupole) are computed for Fourier modes in the range $0.006 < k < 0.5\\, h{\\rm Mpc}^{-1}$. For comparison the MST is measured with a minimum length scale of $l_{\\min}\\simeq13\\,h^{-1}{\\rm Mpc}$. Combining the MST and power spectrum allows for many of the individual degeneracies to be broken; on its own the MST provides tighter constraints on the sum of neutrino masses $M_ν$ and cosmological parameters $h$, $n_{\\rm s}$, and $Ω_{\\rm b}$ but the power spectrum alone provides tighter constraints on $Ω_{\\rm m}$ and $σ_{8}$. Combined we find constraints that are a factor of two (or greater) on all parameters with respect to the power spectrum (for $M_ν$ there is a factor of four improvement). These improvements appear to be driven by the MST's sensitivity to small scale clustering, where the effect of neutrino free-streaming becomes relevant, and high-order statistical information in the cosmic web. The MST is shown to be a powerful tool for cosmology and neutrino mass studies, and therefore could play a pivotal role in ongoing and future galaxy redshift surveys (such as DES, DESI, \\emph{Euclid}, and Rubin-LSST).","abx":0,"nw":0,"d":"2021-11-23","dq":0,"y":2021,"au":[377,200,494],"c":34,"cs":0,"bib":"2022MNRAS.513.3596N","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2111.12088","url":"https://arxiv.org/abs/2111.12088","doi":"10.1093/mnras/stac1138","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Fisher forecasts"]},"x":0.476,"yy":-0.1054,"p3":[0.1706,0.4521,-0.3758],"sim":{"k":"e","l":[[108,0.946],[336,0.939],[339,0.936],[241,0.936],[61,0.936]]},"c3":[118.3,192.6,-127.72],"c2":[229.82,152.67],"k":8,"r":[282,331,334,339],"rm":0},{"id":"2111.05887","t":"The Covariance of Squeezed Bispectrum Configurations","ab":"We measure the halo bispectrum covariance in a large set of N-body simulations and compare it with theoretical expectations. We find a large correlation among (even mildly) squeezed halo bispectrum configurations. A similarly large correlation can be found between squeezed triangles and the long-wavelength halo power spectrum. This shows that the diagonal Gaussian contribution fails to describe, even approximately, the full covariance in these cases. We compare our numerical estimate with a model that includes, in addition to the Gaussian one, only the non-Gaussian terms that are large for squeezed configurations. We find that accounting for these large terms in the modeling greatly improves the agreement of the full covariance with simulations. We apply these results to a simple Fisher matrix forecast, and find that constraints on primordial non-Gaussianity are degraded by a factor of $\\sim 2$ when a non-Gaussian covariance is assumed instead of the diagonal, Gaussian approximation.","abx":0,"nw":0,"d":"2021-11-10","dq":0,"y":2021,"au":[442,398,343,205],"c":49,"cs":0,"bib":"2022JCAP...09..009B","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2111.05887","url":"https://arxiv.org/abs/2111.05887","doi":"10.1088/1475-7516/2022/09/009","tg":{"s":["Fiducial"],"d":["Halo catalogs","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":0.1432,"yy":0.6457,"p3":[-0.8068,0.0204,0.0227],"sim":{"k":"e","l":[[248,0.959],[259,0.953],[257,0.95],[63,0.946],[38,0.946]]},"c3":[61.88,-185.28,-102.48],"c2":[160.35,-80.77],"k":5,"r":[296,304,312,319,336,339],"rm":0},{"id":"2111.02441","t":"NECOLA: Towards a Universal Field-level Cosmological Emulator","ab":"We train convolutional neural networks to correct the output of fast and approximate N-body simulations at the field level. Our model, Neural Enhanced COLA --NECOLA--, takes as input a snapshot generated by the computationally efficient COLA code and corrects the positions of the cold dark matter particles to match the results of full N-body Quijote simulations. We quantify the accuracy of the network using several summary statistics, and find that NECOLA can reproduce the results of the full N-body simulations with sub-percent accuracy down to $k\\simeq1~h{\\rm Mpc}^{-1}$. Furthermore, the model, that was trained on simulations with a fixed value of the cosmological parameters, is also able to correct the output of COLA simulations with different values of $Ω_{\\rm m}$, $Ω_{\\rm b}$, $h$, $n_s$, $σ_8$, $w$, and $M_ν$ with very high accuracy: the power spectrum and the cross-correlation coefficients are within $\\simeq1\\%$ down to $k=1~h{\\rm Mpc}^{-1}$. Our results indicate that the correction to the power spectrum from fast/approximate simulations or field-level perturbation theory is rather universal. Our model represents a first step towards the development of a fast field-level emulator to sample not only primordial mode amplitudes and phases, but also the parameter space defined by the values of the cosmological parameters.","abx":0,"nw":0,"d":"2021-11-03","dq":0,"y":2021,"au":[481,240,199,684,142,450],"c":40,"cs":0,"bib":"2022ApJ...930..115K","v":"Astrophysical Journal","lk":"arXiv:2111.02441","url":"https://arxiv.org/abs/2111.02441","doi":"10.3847/1538-4357/ac5c4a","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos","Non-Quijote simulations"],"d":["Particle snapshots","Power spectra"],"m":["CNN","Emulators & regression ML"],"u":["Fisher derivatives"]},"x":-0.1364,"yy":-0.4856,"p3":[0.2233,0.1302,0.7037],"sim":{"k":"e","l":[[260,0.953],[74,0.952],[36,0.95],[110,0.947],[115,0.946]]},"c3":[-65.27,8.19,-147.49],"c2":[30.04,63.94],"k":1,"r":[288,291,304,307,308,309,310,312,313,315,316,319,322,327,330,331,333,334,335,336,337,339],"rm":0},{"id":"2110.03591","t":"The smearing scale in Laguerre reconstructions of the correlation function","ab":"To a good approximation, on large cosmological scales the evolved two-point correlation function of biased tracers is related to the initial one by a convolution. For Gaussian initial conditions, the smearing kernel is Gaussian, so if the initial correlation function is parametrized using simple polynomials then the evolved correlation function is a sum of generalized Laguerre functions of half-integer order. This motivates an analytic Laguerre reconstruction algorithm which previous work has shown is fast and accurate. This reconstruction requires as input the width of the smearing kernel. We show that the method can be extended to estimate the width of the smearing kernel from the same dataset. This estimate, and associated uncertainties, can then be used to marginalize over the distribution of reconstructed shapes, and hence provide error estimates on the value of the distance scale which are not tied to a particular cosmological model. We also show that if, instead, we parametrize the evolved correlation function using simple polynomials, then the initial one is a sum of Hermite polynomials, again enabling fast and accurate deconvolution. If one is willing to use constraints on the smearing scale from other datasets, then marginalizing over its value is simpler for Hermite reconstruction, potentially providing further speed-up in cosmological analyses.","abx":0,"nw":0,"d":"2021-10-07","dq":0,"y":2021,"au":[222,536,290],"c":7,"cs":0,"bib":"2022PhRvD.105d3536N","v":"Physical Review D","lk":"arXiv:2110.03591","url":"https://arxiv.org/abs/2110.03591","doi":"10.1103/PhysRevD.105.043536","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Power spectra"],"m":["Perturbation theory & analytic models","No ML"],"u":["Halo catalogs"]},"x":-0.1378,"yy":0.8185,"p3":[-0.1683,-0.2421,0.1241],"sim":{"k":"e","l":[[289,0.93],[333,0.925],[309,0.924],[311,0.924],[207,0.922]]},"c3":[-25.05,26.11,-225.01],"c2":[-49.81,201.79],"k":2,"r":[312,323,339],"rm":0},{"id":"2109.13938","t":"Cosmology with the kinetic Sunyaev-Zeldovich effect: Independent of the optical depth and $σ_8$","ab":"The cosmological constraints from the kinetic Sunyaev-Zeldovich experiments are degenerate with the optical depth measurement, which is commonly known as the optical-depth degeneracy. In this work, we introduce a new statistic based on the first moment of relative velocity between pairs in a triplet, which is capable of constraining cosmological parameters independent of the optical depth, and $σ_8$. Using 22,000 $N$-body simulations from the Quijote suite, we quantify the information content in the new statistic using Fisher matrix forecast. We find that it is able to obtain strong constraints on the cosmological parameters, particularly on the summed neutrino mass. The constraints have a factor of 6.2-12.9, and 2.3-5.7 improvement on all cosmological model parameters when compared to those obtained from the mean pairwise velocity, and the redshift-space halo power spectrum, respectively. Thus the new statistic paves a way forward to constrain cosmological parameters independent of the optical depth and $σ_8$ using data from future kinetic Sunyaev-Zeldovich experiments alone.","abx":0,"nw":0,"d":"2021-09-28","dq":0,"y":2021,"au":[345],"c":11,"cs":0,"bib":"2022A&A...660A.113K","v":"","lk":"arXiv:2109.13938","url":"https://arxiv.org/abs/2109.13938","doi":"10.1051/0004-6361/202142325","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Halo catalogs"]},"x":0.4391,"yy":0.1176,"p3":[-0.1913,0.1665,-0.3821],"sim":{"k":"e","l":[[307,0.96],[4,0.955],[62,0.938],[249,0.933],[109,0.932]]},"c3":[-34.76,104.44,-219.24],"c2":[42.39,193.88],"k":3,"r":[307,308,309,334,339],"rm":0},{"id":"2109.07071","t":"Creating Jackknife and Bootstrap estimates of the covariance matrix for the two-point correlation function","ab":"We present correction terms that allow delete-one Jackknife and Bootstrap methods to be used to recover unbiased estimates of the data covariance matrix of the two-point correlation function $ξ\\left(\\mathbf{r}\\right)$. We demonstrate the accuracy and precision of this new method using a large set of 1000 QUIJOTE simulations that each cover a comoving volume of $1\\rm{\\left[h^{-1}Gpc\\right]^3}$. The corrected resampling techniques recover the correct amplitude and structure of the data covariance matrix as represented by its principal components to within $\\sim10$\\%, the level of error achievable with the size of the sample of simulations used for the test. Our corrections for the internal resampling methods are shown to be robust against the intrinsic clustering of the cosmological tracers both in real- and redshift space using two snapshots at $z=0$ and $z=1$ that mimic two samples with significantly different clustering. We also analyse two different slicing of the simulation volume into $n_{\\rm sv}=64$ or $125$ sub-samples and show that the main impact of different $n_{\\rm sv}$ is on the structure of the covariance matrix due to the limited number of independent internal realisations that can be made given a fixed $n_{\\rm sv}$.","abx":0,"nw":0,"d":"2021-09-15","dq":0,"y":2021,"au":[219,661],"c":57,"cs":0,"bib":"2022MNRAS.514.1289M","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2109.07071","url":"https://arxiv.org/abs/2109.07071","doi":"10.1093/mnras/stac1458","tg":{"s":["Fiducial"],"d":["Halo catalogs","Power spectra","Redshift space"],"m":["No ML"],"u":["Fiducial","Halo catalogs"]},"x":0.1418,"yy":-0.0887,"p3":[0.0842,-0.3556,-0.2426],"sim":{"k":"e","l":[[58,0.94],[328,0.935],[143,0.934],[274,0.934],[339,0.933]]},"c3":[-32.71,-306.98,-49.09],"c2":[87.05,-311.26],"k":2,"r":[],"rm":0},{"id":"2109.02636","t":"The matter density PDF for modified gravity and dark energy with Large Deviations Theory","ab":"We present an analytical description of the probability distribution function (PDF) of the smoothed three-dimensional matter density field for modified gravity and dark energy. Our approach, based on the principles of Large Deviations Theory, is applicable to general extensions of the standard $Λ$CDM cosmology. We show that late-time changes to the law of gravity and background expansion can be included through Einstein-de Sitter spherical collapse dynamics combined with linear theory calculations and a calibration measurement of the non-linear variance of the smoothed density field from a simple numerical simulation. In a comparison to $N$-body simulations for $f(R)$, DGP and evolving dark energy theories, we find percent level accuracy around the peak of the distribution for predictions in the mildly non-linear regime. A Fisher forecast of an idealised experiment with a Euclid-like survey volume demonstrates the power of combining measurements of the 3D matter PDF with the 3D matter power spectrum. This combination is shown to halve the uncertainty on parameters for an evolving dark energy model, relative to a power spectrum analysis on its own. The PDF is also found to substantially increase the detection significance for small departures from General Relativity, with improvements of up to six times compared to the power spectrum alone. This analysis is therefore very promising for future studies including non-Gaussian statistics, as it has the potential to alleviate the reliance of these analyses on expensive high resolution simulations and emulators.","abx":0,"nw":0,"d":"2021-09-06","dq":0,"y":2021,"au":[443,146,133,33,89,119],"c":28,"cs":0,"bib":"2022MNRAS.513.1623C","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2109.02636","url":"https://arxiv.org/abs/2109.02636","doi":"10.1093/mnras/stac904","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Non-Quijote simulations"]},"x":-0.0819,"yy":0.4737,"p3":[-0.3566,0.0075,-0.4338],"sim":{"k":"e","l":[[281,0.934],[334,0.934],[115,0.933],[25,0.932],[203,0.931]]},"c3":[-158.74,-8.39,-195.51],"c2":[-132.59,29.3],"k":7,"r":[298,333,334,339],"rm":0},{"id":"2108.07821","t":"Towards an Optimal Estimation of Cosmological Parameters with the Wavelet Scattering Transform","ab":"Optimal extraction of the non-Gaussian information encoded in the Large-Scale Structure (LSS) of the universe lies at the forefront of modern precision cosmology. We propose achieving this task through the use of the Wavelet Scattering Transform (WST), which subjects an input field to a layer of non-linear transformations that are sensitive to non-Gaussianity in spatial density distributions through a generated set of WST coefficients. In order to assess its applicability in the context of LSS surveys, we apply the WST on the 3D overdensity field obtained by the Quijote simulations, out of which we extract the Fisher information in 6 cosmological parameters. It is subsequently found to deliver a large improvement in the marginalized errors on all parameters, ranging between $1.2-4\\times$ tighter than the corresponding ones obtained from the regular 3D cold dark matter + baryon power spectrum, as well as a $50 \\%$ improvement over the neutrino mass constraint given by the marked power spectrum. Through this first application on 3D cosmological fields, we demonstrate the great promise held by this novel statistic and set the stage for its future application to actual galaxy observations.","abx":0,"nw":0,"d":"2021-08-17","dq":0,"y":2021,"au":[253,145],"c":128,"cs":0,"bib":"2022PhRvD.105j3534V","v":"","lk":"arXiv:2108.07821","url":"https://arxiv.org/abs/2108.07821","doi":"10.1103/PhysRevD.105.103534","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.7077,"yy":0.243,"p3":[-0.4564,-0.31,0.6368],"sim":{"k":"e","l":[[157,0.965],[178,0.955],[272,0.949],[327,0.937],[62,0.936]]},"c3":[82.94,137.23,-57.72],"c2":[199.15,58.77],"k":3,"r":[284,292,297,308,312,322,327,331,334,336,339],"rm":0},{"id":"2108.04215","t":"Beware of Fake $ν$s: The Effect of Massive Neutrinos on the Nonlinear Evolution of Cosmic Structure","ab":"Massive neutrinos suppress the growth of cosmic structure on small, non-linear, scales. It is thus often proposed that using statistics beyond the power spectrum can tighten constraints on the neutrino mass by extracting additional information from these non-linear scales. We study the information content regarding neutrino mass at the field level, quantifying how much of this information arises from the difference in non-linear evolution between a cosmology with 1 fluid (CDM) and 2 fluids (CDM + neutrinos). We do so by running two $N$-body simulations, one with and one without massive neutrinos; both with the same phases, and matching their linear power spectrum at a given, low, redshift. This effectively isolates the information encoded in the linear initial conditions from the non-linear cosmic evolution. We demonstrate that for $k \\lesssim 1\\,h/{\\rm Mpc}$, and for a single redshift, there is negligible difference in the real-space CDM field between the two simulations. This suggests that all the information regarding neutrino mass is in the linear power spectrum set by the initial conditions. Thus any probe based on the CDM field alone will have negligible constraining power beyond that which exists at the linear level over the same range of scales. Consequently, any probe based on the halo field will contain little information beyond the linear power. We find similar results for the matter field responsible for weak lensing. We also demonstrate that there may be much information beyond the power spectrum in the 3d matter field, however, this is not observable in modern surveys via dark matter halos or weak lensing. Finally, we show that there is additional information to be found in redshift space.","abx":0,"nw":0,"d":"2021-08-09","dq":0,"y":2021,"au":[21,73,638],"c":45,"cs":0,"bib":"2022PhRvD.105l3510B","v":"Physical Review D","lk":"arXiv:2108.04215","url":"https://arxiv.org/abs/2108.04215","doi":"10.1103/PhysRevD.105.123510","tg":{"s":["Massive neutrinos","Non-Quijote simulations"],"d":["Density fields","Particle snapshots","Halo catalogs","Redshift space","Weak lensing & 2D maps"],"m":["No ML"],"u":["Massive neutrinos","Non-Quijote simulations","Particle snapshots"]},"x":-0.0219,"yy":0.2539,"p3":[-0.1643,0.0649,-0.2764],"sim":{"k":"e","l":[[25,0.949],[336,0.944],[203,0.94],[109,0.94],[167,0.94]]},"c3":[-19.52,178.45,-176.83],"c2":[55.55,218.87],"k":8,"r":[291,297,307,308,312,331,334,336,339],"rm":0},{"id":"2108.03851","t":"The effects of peculiar velocities on the morphological properties of large-scale structure","ab":"It is known that the large-scale structure (LSS) mapped by a galaxy redshift survey is subject to distortions by galaxies' peculiar velocities. Besides the signatures generated in common N-point statistics, such as the anisotropy in the galaxy 2-point correlation function, the peculiar velocities also induce distinct features in LSS's morphological properties, which are fully described by four Minkowski functionals (MFs), i.e., the volume, surface area, integrated mean curvature and Euler characteristic (or genus). In this work, by using large suite of N-body simulations, we present and analyze these important features in the MFs of LSS on both (quasi-)linear and non-linear scales, with a focus on the latter. We also find the MFs can give competitive constraints on cosmological parameters compared to the power spectrum, probablly due to the non-linear information contained. For galaxy number density similar to the DESI BGS galaxies, the constraint on $σ_8$ from the MFs with one smoothing scale can be better by $\\sim 50\\%$ than from the power spectrum. These findings are important for the cosmological applications of MFs of LSS, and probablly open up a new avenue for studying the peculiar velocity field itself.","abx":0,"nw":0,"d":"2021-08-09","dq":0,"y":2021,"au":[70,654,659,657],"c":9,"cs":0,"bib":"2022PhRvD.105j3028J","v":"Physical Review D","lk":"arXiv:2108.03851","url":"https://arxiv.org/abs/2108.03851","doi":"10.1103/PhysRevD.105.103028","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Halo catalogs","Fisher forecasts","Density fields"]},"x":0.495,"yy":0.3702,"p3":[-0.1581,0.58,-0.2],"sim":{"k":"e","l":[[118,0.93],[73,0.93],[61,0.92],[316,0.917],[100,0.915]]},"c3":[70.98,256.82,-66.84],"c2":[178.47,244.7],"k":3,"r":[275,339],"rm":0},{"id":"2108.01714","t":"Analytic Gaussian Covariance Matrices for Galaxy $N$-Point Correlation Functions","ab":"We derive analytic covariance matrices for the $N$-Point Correlation Functions (NPCFs) of galaxies in the Gaussian limit. Our results are given for arbitrary $N$ and projected onto the isotropic basis functions of Cahn & Slepian (2020), recently shown to facilitate efficient NPCF estimation. A numerical implementation of the 4PCF covariance is compared to the sample covariance obtained from a set of lognormal simulations, Quijote dark matter halo catalogues, and MultiDark-Patchy galaxy mocks, with the latter including realistic survey geometry. The analytic formalism gives reasonable predictions for the covariances estimated from mock simulations with a periodic-box geometry. Furthermore, fitting for an effective volume and number density by maximizing a likelihood based on Kullback-Leibler divergence is shown to partially compensate for the effects of a non-uniform window function.","abx":0,"nw":0,"d":"2021-08-03","dq":0,"y":2021,"au":[327,542,498,706],"c":46,"cs":0,"bib":"2022PhRvD.106d3515H","v":"Physical Review D","lk":"arXiv:2108.01714","url":"https://arxiv.org/abs/2108.01714","doi":"10.1103/PhysRevD.106.043515","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Halo catalogs","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":-0.1659,"yy":0.5195,"p3":[0.3242,0.0118,-0.6749],"sim":{"k":"e","l":[[143,0.921],[281,0.92],[15,0.919],[19,0.919],[115,0.918]]},"c3":[136.56,-21.37,-205.51],"c2":[95.74,208.24],"k":2,"r":[299,304,309,326,331,336,339],"rm":0},{"id":"2107.10287","t":"Modeling Nearest Neighbor distributions of biased tracers using Hybrid Effective Field Theory","ab":"We investigate the application of Hybrid Effective Field Theory (HEFT) -- which combines a Lagrangian bias expansion with subsequent particle dynamics from $N$-body simulations -- to the modeling of $k$-Nearest Neighbor Cumulative Distribution Functions ($k{\\rm NN}$-${\\rm CDF}$s) of biased tracers of the cosmological matter field. The $k{\\rm NN}$-${\\rm CDF}$s are sensitive to all higher order connected $N$-point functions in the data, but are computationally cheap to compute. We develop the formalism to predict the $k{\\rm NN}$-${\\rm CDF}$s of discrete tracers of a continuous field from the statistics of the continuous field itself. Using this formalism, we demonstrate how $k{\\rm NN}$-${\\rm CDF}$ statistics of a set of biased tracers, such as halos or galaxies, of the cosmological matte
