f EuclidEmulator2, but are validated against $N$-body simulations. Our symbolic expressions for $k_σ$, $n_{\\rm eff}$ and $C$ have root mean squared fractional errors of 0.8%, 0.2% and 0.3%, respectively, for redshifts below 3 and a wide range of cosmologies. The re-optimised halofit parameters reduce the root mean squared fractional error (compared to EuclidEmulator2) from 3% to below 2% for wavenumbers $k=9\\times10^{-3}-9 \\, h{\\rm Mpc^{-1}}$. We introduce syren-halofit (symbolic-regression-enhanced halofit), an extension to halofit containing a short symbolic correction which improves this error to 1%. Our method is 2350 and 3170 times faster than current halofit and hmcode implementations, respectively, and 2680 and 64 times faster than EuclidEmulator2 (which requires running class) and the BACCO emulator. We obtain comparable accuracy to EuclidEmulator2 and BACCO when tested on $N$-body simulations. Our work greatly increases the speed and accuracy of symbolic approximations to $P(k)$, making them significantly faster than their numerical counterparts without loss of accuracy.","abx":0,"nw":0,"d":"2024-02-27","dq":0,"y":2024,"au":[172,95,447,511,273],"c":33,"cs":0,"bib":"2024A&A...686A.150B","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2402.17492","url":"https://arxiv.org/abs/2402.17492","doi":"10.1051/0004-6361/202449854","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Power spectra"],"m":["Symbolic regression"],"u":[]},"x":0.0636,"yy":-0.5329,"p3":[0.2424,0.4395,-0.0601],"sim":{"k":"e","l":[[135,0.963],[17,0.962],[35,0.951],[158,0.947],[328,0.94]]},"c3":[-205.01,42.52,15.45],"c2":[-180.84,128.89],"k":7,"r":[339],"rm":0},{"id":"2402.07694","t":"Cosmology at the Field Level with Probabilistic Machine Learning","ab":"The large-scale structure in cosmology is highly non-Gaussian at late times and small length scales, making it difficult to describe analytically. Parameter inference, data reconstruction, and data generation tasks in cosmology are greatly aided by various machine learning models. In order to retain as much information as possible while solving these problems, this work operates at the field level, rather than at the level of summary statistics. The probability density function of the large-scale structure is learned with normalizing flows, a class of probabilistic generative models. Normalizing flows learn the transformation from a simple base distribution to a more complicated distribution, much like the matter content evolved to its present day complexities from a Gaussian field at early times. While the normalizing flows have accurately modelled 2-dimensional projections of the matter content, we find that denoising diffusion models are well-suited for volumetric data. A super-resolution emulator is developed for cosmological simulation volumes, generating high-resolution baryonic simulation volumes conditional on low-resolution dark matter simulations. The super-resolution emulator is trained to perform outpainting, and can thus upgrade very large cosmological volumes from low-resolution to high-resolution using an iterative outpainting procedure.","abx":0,"nw":0,"d":"2024-02-12","dq":0,"y":2024,"au":[19],"c":2,"cs":0,"bib":"2024arXiv240207694R","v":"","lk":"arXiv:2402.07694","url":"https://arxiv.org/abs/2402.07694","doi":"","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Density fields","Weak lensing & 2D maps"],"m":["Simulation-based inference","Normalizing flows","Generative models"],"u":["Simulation-based inference"]},"x":-0.118,"yy":-0.864,"p3":[0.0997,-0.4044,0.7531],"sim":{"k":"e","l":[[189,0.95],[53,0.947],[16,0.945],[260,0.941],[31,0.94]]},"c3":[-45.41,-41.97,55.11],"c2":[11.4,-105.05],"k":1,"r":[189,221,230,301,303,332,339],"rm":0},{"id":"2402.05137","t":"LtU-ILI: An All-in-One Framework for Implicit Inference in Astrophysics and Cosmology","ab":"This paper presents the Learning the Universe Implicit Likelihood Inference (LtU-ILI) pipeline, a codebase for rapid, user-friendly, and cutting-edge machine learning (ML) inference in astrophysics and cosmology. The pipeline includes software for implementing various neural architectures, training schemata, priors, and density estimators in a manner easily adaptable to any research workflow. It includes comprehensive validation metrics to assess posterior estimate coverage, enhancing the reliability of inferred results. Additionally, the pipeline is easily parallelizable and is designed for efficient exploration of modeling hyperparameters. To demonstrate its capabilities, we present real applications across a range of astrophysics and cosmology problems, such as: estimating galaxy cluster masses from X-ray photometry; inferring cosmology from matter power spectra and halo point clouds; characterizing progenitors in gravitational wave signals; capturing physical dust parameters from galaxy colors and luminosities; and establishing properties of semi-analytic models of galaxy formation. We also include exhaustive benchmarking and comparisons of all implemented methods as well as discussions about the challenges and pitfalls of ML inference in astronomical sciences. All code and examples are made publicly available at https://github.com/maho3/ltu-ili.","abx":0,"nw":0,"d":"2024-02-06","dq":0,"y":2024,"au":[448,172,488,118,589,83,507,138,613,131,647,581,404,95,263],"c":69,"cs":0,"bib":"2024OJAp....7E..54H","v":"The Open Journal of Astrophysics","lk":"arXiv:2402.05137","url":"https://arxiv.org/abs/2402.05137","doi":"10.33232/001c.120559","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs","Power spectra"],"m":["Simulation-based inference","Normalizing flows"],"u":["Normalizing flows"]},"x":-0.1325,"yy":-0.62,"p3":[0.4352,0.2647,0.2134],"sim":{"k":"e","l":[[70,0.94],[254,0.939],[127,0.938],[105,0.938],[200,0.935]]},"c3":[52.55,168.48,52.65],"c2":[190.57,26.7],"k":7,"r":[189,200,205,230,255,339],"rm":0},{"id":"2401.15074","t":"${\\rm S{\\scriptsize IM}BIG}$: Cosmological Constraints from the Redshift-Space Galaxy Skew Spectra","ab":"Extracting the non-Gaussian information of the cosmic large-scale structure (LSS) is vital in unlocking the full potential of the rich datasets from the upcoming stage-IV galaxy surveys. Galaxy skew spectra serve as efficient beyond-two-point statistics, encapsulating essential bispectrum information with computational efficiency akin to power spectrum analysis. This paper presents the first cosmological constraints from analyzing the full set of redshift-space galaxy skew spectra of the data from the SDSS-III BOSS, accessing cosmological information down to nonlinear scales. Employing the ${\\rm S{\\scriptsize IM}BIG}$ forward modeling framework and simulation-based inference via normalizing flows, we analyze the CMASS-SGC sub-sample, which constitute approximately 10\\% of the full BOSS data. Analyzing the scales up to $k_{\\rm max}=0.5 \\, {\\rm Mpc}^{-1}h$, we find that the skew spectra improve the constraints on $Ω_{\\rm m}, Ω_{\\rm b}, h$, and $n_s$ by 34\\%, 35\\%, 18\\%, 10\\%, respectively, compared to constraints from previous ${\\rm S{\\scriptsize IM}BIG}$ power spectrum multipoles analysis, yielding $Ω_{\\rm m}=0.288^{+0.024}_{-0.034}$, $Ω_{\\rm b}= 0.043^{+0.005}_{-0.007}$, $h=0.759^{+0.104}_{-0.050}$, $n_{\\rm s} = 0.918^{+0.041}_{-0.090}$ (at 68\\% confidence limit). On the other hand, the constraints on $σ_8$ are weaker than from the power spectrum. Including the Big Bang Nucleosynthesis (BBN) prior on baryon density reduces the uncertainty on the Hubble parameter further, achieving $h=0.750^{+0.034}_{-0.032}$, which is a 38\\% improvement over the constraint from the power spectrum with the same prior. Compared to the ${\\rm S{\\scriptsize IM}BIG}$ bispectrum (monopole) analysis, skew spectra offer comparable constraints on larger scales ($k_{\\rm max}<0.3\\, {\\rm Mpc}^{-1}h$) for most parameters except for $σ_8$.","abx":0,"nw":0,"d":"2024-01-26","dq":0,"y":2024,"au":[327,84,122,458,580,507,200,131,393,107],"c":38,"cs":0,"bib":"2024PhRvD.109j3528H","v":"Physical Review D","lk":"arXiv:2401.15074","url":"https://arxiv.org/abs/2401.15074","doi":"10.1103/physrevd.109.103528","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Higher-order statistics","Redshift space"],"m":["Simulation-based inference","Normalizing flows"],"u":["Latin hypercube"]},"x":0.1016,"yy":0.0496,"p3":[-0.0135,-0.5908,-0.3571],"sim":{"k":"e","l":[[200,0.931],[312,0.928],[201,0.927],[245,0.923],[319,0.915]]},"c3":[170.9,97.98,-28.83],"c2":[279.61,-17.07],"k":0,"r":[198,199,200,205,244,245,249,262,272,291,312,330,331,339],"rm":0},{"id":"2401.00054","t":"Late Time Acceleration with Observational Constraints in Modified Theories of Gravity","ab":"The late time acceleration of the Universe has challenged contemporary cosmology since its discovery. General Relativity explains this phenomenon by introducing the cosmological constant, named the standard cosmological model ($Λ$CDM). However, the cosmological constant solution has several drawbacks that have led cosmologists to explore and propose alternative models to explain the late time acceleration of the Universe. These alternatives span from models of a dynamical dark fluid, known as dark energy, to models of large-scale modifications of the gravitational interaction, known as modified gravity. The current dissertation intends to show several ways to investigate late-time cosmology or to look at probable places for future investigations in order to shed more light on the dark sector of the Universe...","abx":0,"nw":1,"d":"2023-12-29","dq":0,"y":2023,"au":[593],"c":1,"cs":0,"bib":"2024arXiv240100054A","v":"","lk":"arXiv:2401.00054","url":"https://arxiv.org/abs/2401.00054","doi":"","tg":{"s":["Fiducial","Non-Quijote simulations"],"d":["Power spectra","Redshift space"],"m":["No ML"],"u":["Fiducial","Power spectra"]},"x":0.4991,"yy":0.3726,"p3":[-0.3377,0.426,-0.3464],"sim":{"k":"e","l":[[118,0.913],[231,0.907],[314,0.901],[290,0.9],[154,0.898]]},"c3":[-353.15,15.77,123.56],"c2":[-351.46,175.6],"k":3,"r":[],"rm":0},{"id":"2312.09271","t":"Bayesian Inference of Initial Conditions from Non-Linear Cosmic Structures using Field-Level Emulators","ab":"Analysing next-generation cosmological data requires balancing accurate modeling of non-linear gravitational structure formation and computational demands. We propose a solution by introducing a machine learning-based field-level emulator, within the Hamiltonian Monte Carlo-based Bayesian Origin Reconstruction from Galaxies (BORG) inference algorithm. Built on a V-net neural network architecture, the emulator enhances the predictions by first-order Lagrangian perturbation theory to be accurately aligned with full $N$-body simulations while significantly reducing evaluation time. We test its incorporation in BORG for sampling cosmic initial conditions using mock data based on non-linear large-scale structures from $N$-body simulations and Gaussian noise. The method efficiently and accurately explores the high-dimensional parameter space of initial conditions, fully extracting the cross-correlation information of the data field binned at a resolution of $1.95h^{-1}$ Mpc. Percent-level agreement with the ground truth in the power spectrum and bispectrum is achieved up to the Nyquist frequency $k_\\mathrm{N} \\approx 2.79h \\; \\mathrm{Mpc}^{-1}$. Posterior resimulations - using the inferred initial conditions for $N$-body simulations - show that the recovery of information in the initial conditions is sufficient to accurately reproduce halo properties. In particular, we show highly accurate $M_{200\\mathrm{c}}$ halo mass function and stacked density profiles of haloes in different mass bins $[0.853,16]\\times 10^{14}M_{\\odot}h^{-1}$. As all available cross-correlation information is extracted, we acknowledge that limitations in recovering the initial conditions stem from the noise level and data grid resolution. This is promising as it underscores the significance of accurate non-linear modeling, indicating the potential for extracting additional information at smaller scales.","abx":0,"nw":0,"d":"2023-12-14","dq":0,"y":2023,"au":[406,187,600,264,233,319],"c":43,"cs":0,"bib":"2024MNRAS.535.1258D","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2312.09271","url":"https://arxiv.org/abs/2312.09271","doi":"10.1093/mnras/stae2429","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Halo catalogs","Power spectra","Higher-order statistics"],"m":["CNN","Emulators & regression ML"],"u":[]},"x":-0.5934,"yy":-0.4363,"p3":[0.5157,-0.1215,0.4835],"sim":{"k":"e","l":[[114,0.955],[110,0.955],[260,0.954],[134,0.951],[228,0.949]]},"c3":[145.6,-6.82,67.51],"c2":[198.83,-124.87],"k":1,"r":[156,197,230,233,243,244,260,261,277,282,286,313,339],"rm":0},{"id":"2311.17141","t":"A point cloud approach to generative modeling for galaxy surveys at the field level","ab":"We introduce a diffusion-based generative model to describe the distribution of galaxies in our Universe directly as a collection of points in 3-D space (coordinates) optionally with associated attributes (e.g., velocities and masses), without resorting to binning or voxelization. The custom diffusion model can be used both for emulation, reproducing essential summary statistics of the galaxy distribution, as well as inference, by computing the conditional likelihood of a galaxy field. We demonstrate a first application to massive dark matter haloes in the Quijote simulation suite. This approach can be extended to enable a comprehensive analysis of cosmological data, circumventing limitations inherent to summary statistic -- as well as neural simulation-based inference methods.","abx":0,"nw":0,"d":"2023-11-28","dq":0,"y":2023,"au":[118,586],"c":38,"cs":0,"bib":"2024PhRvD.109l3531C","v":"arXiv.org","lk":"arXiv:2311.17141","url":"https://arxiv.org/abs/2311.17141","doi":"10.48550/arXiv.2311.17141","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs"],"m":["Generative models"],"u":[]},"x":-0.3954,"yy":-0.7243,"p3":[0.0475,-0.2408,0.8871],"sim":{"k":"e","l":[[145,0.951],[184,0.95],[16,0.945],[169,0.941],[85,0.939]]},"c3":[4.31,170.9,60.32],"c2":[130.95,63.04],"k":1,"r":[230,244,255,291,304,322,339],"rm":0},{"id":"2311.16439","t":"Constraining Neutrino Cosmologies with Nonlinear Reconstruction","ab":"Nonlinear gravitational evolution induces strong nonlinearities in the observed cosmological density fields, leading to positive off-diagonal correlations in the power spectrum covariance. This has caused the information saturation in the power spectrum, e.g., the neutrino mass constraints from the nonlinear power spectra are lower than their linear counterparts by a factor of $\\sim2$ at $z=0$. In this paper, we explore how nonlinear reconstruction methods improve the cosmological information from nonlinear cosmic fields. By applying nonlinear reconstruction to cold dark matter fields from the Quijote simulations, we find that nonlinear reconstruction can improve the constraints on cosmological parameters significantly, nearly reaching the linear theory limit. For neutrino mass, the result is only $12\\%$ lower than the linear power spectrum, i.e., the theoretical best result. This makes nonlinear reconstruction an efficient and useful method to extract neutrino information from current and upcoming galaxy surveys.","abx":0,"nw":0,"d":"2023-11-28","dq":0,"y":2023,"au":[579,280],"c":4,"cs":0,"bib":"2024ApJ...961..160Z","v":"Astrophysical Journal","lk":"arXiv:2311.16439","url":"https://arxiv.org/abs/2311.16439","doi":"10.3847/1538-4357/ad0f97","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Power spectra"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Massive neutrinos"]},"x":0.2367,"yy":0.3572,"p3":[-0.0054,0.3318,0.2396],"sim":{"k":"e","l":[[4,0.943],[62,0.938],[263,0.938],[278,0.933],[335,0.931]]},"c3":[102.02,64.72,-112.84],"c2":[180.91,99.18],"k":3,"r":[228,249,278,292,308,331,336,339],"rm":0},{"id":"2311.14210","t":"Self-calibrating BAO measurements in the presence of Small Displacement Interlopers","ab":"Baryon Acoustic Oscillation (BAO) observations offer a robust method for measuring cosmological expansion. However, the BAO signal in a sample of galaxies can be diluted and shifted by interlopers -- galaxies that have been assigned the wrong redshifts. Because of the slitless spectroscopic method adopted by the Roman and Euclid space telescopes, the galaxy samples resulting from single line detections will have relatively high fractions of interloper galaxies. Interlopers with a small displacement between true and false redshift have the strongest effect on the measured clustering. In order to model the BAO signal, the fraction of such interlopers and their clustering need to be accurately known. We introduce a new method to self-calibrate these quantities by shifting the contaminated sample towards or away from us along the line of sight by the interloper offset, and measuring the cross-correlations between these shifted samples. The contributions from the different components are shifted in scale in this cross-correlation compared to the auto-correlation of the contaminated sample, enabling the decomposition and extraction of the component terms. We demonstrate the application of the method using numerical simulations and show that an unbiased BAO measurement can be extracted. Unlike previous attempts to model the effects of contaminants, self-calibration allows us to make fewer assumptions about the form of the contaminants such as their bias.","abx":0,"nw":0,"d":"2023-11-23","dq":0,"y":2023,"au":[24,200,661],"c":5,"cs":0,"bib":"2024JCAP...04..008N","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2311.14210","url":"https://arxiv.org/abs/2311.14210","doi":"10.1088/1475-7516/2024/04/008","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Halo catalogs","Power spectra","Redshift space","Perturbation theory & analytic models"]},"x":0.583,"yy":-0.7199,"p3":[0.1005,-0.1526,0.1181],"sim":{"k":"e","l":[[252,0.956],[103,0.932],[82,0.927],[132,0.927],[24,0.924]]},"c3":[-51.79,65.98,157.15],"c2":[-190.88,-45.74],"k":2,"r":[209,252,339],"rm":0},{"id":"2311.13520","t":"Imprint of massive neutrinos on Persistent Homology of large-scale structure","ab":"Exploiting the Persistent Homology technique and its complementary representations, we examine the footprint of summed neutrino mass ($M_ν$) in the various density fields simulated by the publicly available Quijote suite. The evolution of topological features by utilizing the super-level filtration on three-dimensional density fields at zero redshift, reveals a remarkable benchmark for constraining the cosmological parameters, particularly $M_ν$ and $σ_8$. The abundance of independent closed surfaces (voids) compared to the connected components (clusters) and independent loops (filaments), is more sensitive to the presence of $M_ν$ for $R=5$ Mpc $h^{-1}$ irrespective of whether using the total matter density field ($m$) or CDM+baryons field ($cb$). Reducing the degeneracy between $M_ν$ and $σ_8$ is achieved via Persistent Homology for the $m$ field but not for the $cb$ field. The uncertainty of $M_ν$ at $1σ$ confidence interval from the joint analysis of Persistent Homology vectorization for the $m$ and $cb$ fields smoothed by $R=5$ Mpc $h^{-1}$ at $z=0$ reaches $0.0152$ eV and $0.1242$ eV, respectively. Noticing the use of the 3-dimensional underlying density field at $z=0$, the mentioned uncertainties can be treated as the theoretical lower limits.","abx":0,"nw":0,"d":"2023-11-22","dq":0,"y":2023,"au":[415,554,559],"c":17,"cs":0,"bib":"2024MNRAS.535..657J","v":"","lk":"arXiv:2311.13520","url":"https://arxiv.org/abs/2311.13520","doi":"10.1093/mnras/stae2044","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Density fields","Higher-order statistics"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Fisher forecasts"]},"x":0.7125,"yy":-0.1288,"p3":[-0.3786,0.8966,-0.0444],"sim":{"k":"e","l":[[39,0.961],[179,0.958],[40,0.951],[43,0.945],[140,0.944]]},"c3":[-30.87,228.89,-138.88],"c2":[80.71,263.01],"k":8,"r":[179,213,234,256,275,292,308,320,323,331,334,336,339],"rm":0},{"id":"2311.10088","t":"Taming assembly bias for primordial non-Gaussianity","ab":"Primordial non-Gaussianity of the local type induces a strong scale-dependent bias on the clustering of halos in the late-time Universe. This signature is particularly promising to provide constraints on the non-Gaussianity parameter $f_{\\rm NL}$ from galaxy surveys, as the bias amplitude grows with scale and becomes important on large, linear scales. However, there is a well-known degeneracy between the real prize, the $f_{\\rm NL}$ parameter, and the (non-Gaussian) assembly bias i.e., the halo formation history-dependent contribution to the amplitude of the signal, which could seriously compromise the ability of large-scale structure surveys to constrain $f_{\\rm NL}$. We show how the assembly bias can be modeled and constrained, thus almost completely recovering the power of galaxy surveys to competitively constrain primordial non-Gaussianity. In particular, studying hydrodynamical simulations, we find that a proxy for the halo properties that determine assembly bias can be constructed from photometric properties of galaxies. Using a prior on the assembly bias guided by this proxy degrades the statistical errors on $f_{\\rm NL}$ only mildly compared to an ideal case where the assembly bias is perfectly known. The systematic error on $f_{\\rm NL}$ that the proxy induces can be safely kept under control.","abx":0,"nw":0,"d":"2023-11-16","dq":0,"y":2023,"au":[204,397,240,424,665,247,176,462,55,95],"c":27,"cs":0,"bib":"2024JCAP...02..048F","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2311.10088","url":"https://arxiv.org/abs/2311.10088","doi":"10.1088/1475-7516/2024/02/048","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Halo catalogs","Power spectra"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Halo catalogs","Power spectra","Fisher forecasts","Perturbation theory & analytic models"]},"x":0.2237,"yy":0.8435,"p3":[-0.6792,-0.2587,-0.0749],"sim":{"k":"e","l":[[123,0.938],[133,0.936],[259,0.932],[204,0.932],[105,0.93]]},"c3":[-108.05,-161.62,-8.58],"c2":[12.75,-205.82],"k":4,"r":[226,257,263,264,339],"rm":0},{"id":"2311.09531","t":"Analysis of an iterative reconstruction method in comparison of the standard reconstruction method","ab":"We present a detailed analysis of a new, iterative density reconstruction algorithm. This algorithm uses a decreasing smoothing scale to better reconstruct the density field in Lagrangian space. We implement this algorithm to run on the Quijote simulations, and extend it to (a) include a smoothing kernel that smoothly goes from anisotropic to isotropic, and (b) a variant that does not correct for redshift space distortions. We compare the performance of this algorithm with the standard reconstruction method. Our examinations of the methods include cross-correlation of the reconstructed density field with the linear density field, reconstructed two-point functions, and BAO parameter fitting. We also examine the impact of various parameters, such as smoothing scale, anisotropic smoothing, tracer type/bias, and the inclusion of second order perturbation theory. We find that the two reconstruction algorithms are comparable in most of the areas we examine. In particular, both algorithms give consistent fittings of BAO parameters. The fits are robust over a range of smoothing scales. We find the iterative algorithm is significantly better at removing redshift space distortions. The new algorithm will be a promising method to be employed in the ongoing and future large-scale structure surveys.","abx":0,"nw":0,"d":"2023-11-16","dq":0,"y":2023,"au":[675,490],"c":9,"cs":0,"bib":"2024MNRAS.534.1490C","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2311.09531","url":"https://arxiv.org/abs/2311.09531","doi":"10.1093/mnras/stae2180","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Halo catalogs","Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Halo catalogs"]},"x":-0.5571,"yy":-0.3055,"p3":[-0.0221,-0.1061,0.0341],"sim":{"k":"e","l":[[222,0.946],[58,0.938],[38,0.928],[300,0.928],[92,0.927]]},"c3":[35.75,-150.08,187.26],"c2":[16.9,-293.28],"k":7,"r":[222],"rm":0},{"id":"2311.07650","t":"Elucidating the impact of massive neutrinos on halo assembly bias","ab":"Massive neutrinos have non-negligible impact on the formation of large-scale structures. We investigate the impact of massive neutrinos on the halo assembly bias effect, measured by the relative halo bias $\\hat{b}$ as a function of the curvature of the initial density peak $\\hat{s}$, neutrino excess $ε_ν$, or halo concentration $\\hat{c}$, using a large suite of $ΣM_ν{=}0.0$ eV and $0.4$ eV simulations with the same initial conditions. By tracing dark matter haloes back to their initial density peaks, we construct a catalogue of halo twins that collapsed from the same peaks but evolved separately with and without massive neutrinos, thereby isolating any effect of neutrinos on halo formation. We detect a $2\\%$ weakening of the halo assembly bias as measured by $\\hat{b}(ε_ν)$ in the presence of massive neutrinos. As there exists a significant correlation between $\\hat{s}$ and $ε_ν$ ($r_{cc}{=}0.319$), the impact of neutrinos persists at a reduced level~($0.1\\%$) in the halo assembly bias measured by $\\hat{b}(\\hat{s})$. However, we do not detect any neutrino-induced impact on $\\hat{b}(\\hat{c})$, consistent with earlier studies and the lack of correlation between $\\hat{c}$ and $ε_ν$ ($r_{cc}{=}0.087$). We also discover an analogous assembly bias effect for the neutrino haloes, whose concentrations are anti-correlated with the large-scale clustering of neutrinos.","abx":0,"nw":0,"d":"2023-11-13","dq":0,"y":2023,"au":[703,685],"c":1,"cs":0,"bib":"2024MNRAS.530.3422S","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2311.07650","url":"https://arxiv.org/abs/2311.07650","doi":"10.1093/mnras/stae1077","tg":{"s":["Fiducial","Massive neutrinos"],"d":["Particle snapshots","Halo catalogs"],"m":["No ML"],"u":["Massive neutrinos","Fiducial","Particle snapshots"]},"x":-0.2299,"yy":0.2674,"p3":[-0.1323,0.1777,-0.6395],"sim":{"k":"e","l":[[320,0.964],[323,0.949],[337,0.942],[329,0.934],[168,0.934]]},"c3":[-10.39,122.49,-170.76],"c2":[-6.14,176.92],"k":8,"r":[292,320,339],"rm":0},{"id":"2311.04608","t":"On the range of validity of perturbative models for galaxy clustering and its uncertainty","ab":"We explore the reach of analytical models at one-loop in Perturbation Theory (PT) to accurately describe measurements of the galaxy power spectrum from numerical simulations in redshift space. We consider the validity range in terms of three different diagnostics: 1) the goodness of fit; 2) a figure-of-bias quantifying the error in recovering the fiducial value of a cosmological parameter; 3) an internal consistency check of the theoretical model quantifying the running of the model parameters with the scale cut. We consider different sets of measurements corresponding to an increasing cumulative simulation volume in redshift space. For each volume we define a median value and the associated scatter for the largest wavenumber where the model is valid (the $k$-reach of the model). We find, as a rather general result, that the median value of the reach decreases with the simulation volume, as expected since the smaller statistical errors provide a more stringent test for the model. This is true for all the three definitions considered, with the one given in terms of the figure-of-bias providing the most stringent scale cut. More interestingly, we find as well that the error associated with the $k$-reach value is quite large, with a significant probability of being as low as 0.1$\\, h \\, {\\rm Mpc}^{-1}$ (or, more generally, up to 40% smaller than the median) for all the simulation volumes considered. We explore as well the additional information on the growth rate parameter encoded in the power spectrum hexadecapole, compared to the analysis of monopole and quadrupole, as a function of simulation volume. While our analysis is, in many ways, rather simplified, we find that the gain in the determination of the growth rate is quite small in absolute value and well within the statistical error on the corresponding figure of merit.","abx":0,"nw":0,"d":"2023-11-08","dq":0,"y":2023,"au":[256,442,129,205],"c":1,"cs":0,"bib":"2024PhRvD.110h3502G","v":"Physical Review D","lk":"arXiv:2311.04608","url":"https://arxiv.org/abs/2311.04608","doi":"10.1103/PhysRevD.110.083502","tg":{"s":["Fiducial"],"d":["Halo catalogs","Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Halo catalogs"]},"x":-0.5914,"yy":0.3786,"p3":[0.0222,-0.3865,-0.7461],"sim":{"k":"e","l":[[296,0.938],[326,0.934],[317,0.934],[329,0.932],[299,0.931]]},"c3":[-31.79,115.1,-17.05],"c2":[67.83,122.97],"k":4,"r":[339],"rm":0},{"id":"2310.20672","t":"Evaluating the variance of individual halo properties in constrained cosmological simulations","ab":"Constrained cosmological simulations play an important role in modelling the local Universe, enabling investigation of the dark matter content of local structures and their formation. We introduce an internal method for quantifying the extent to which the variance of individual halo properties is suppressed by the constraints imposed on the initial conditions. We apply it to the Constrained Simulations in BORG (CSiBORG) suite of $101$ high-resolution realisations across the posterior probability distribution of initial conditions from the Bayesian Origin Reconstruction from Galaxies (BORG) algorithm. The method is based on the overlap of the initial Lagrangian patch of a halo in one simulation with those in another, measuring the degree to which the haloes' particles are initially coincident. This addresses the extent to which the imposed large-scale structure constraints reduce the variance of individual halo properties. We find consistent reconstructions of $M\\gtrsim10^{14}~M_\\odot / h$ haloes, indicating that the constraints from the BORG algorithm are sufficient to pin down the masses, positions, and peculiar velocities of clusters to high precision, though we do not assess how well they reproduce observations of the local Universe. The effect of the constraints tapers off towards lower mass, and the halo spins and concentrations are largely unconstrained at all masses. We document the advantages of evaluating halo consistency in the initial conditions and describe how the method may be used to quantify our knowledge of the halo field given galaxy survey data analysed through the lens of probabilistic inference machines such as BORG.","abx":0,"nw":0,"d":"2023-10-31","dq":0,"y":2023,"au":[538,273,354,23],"c":8,"cs":0,"bib":"2024MNRAS.534.3120S","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2310.20672","url":"https://arxiv.org/abs/2310.20672","doi":"10.1093/mnras/stae2292","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Particle snapshots","Halo catalogs"],"m":["No ML"],"u":[]},"x":-0.3201,"yy":-0.046,"p3":[0.6087,-0.135,-0.0981],"sim":{"k":"e","l":[[277,0.951],[142,0.948],[37,0.938],[188,0.937],[208,0.937]]},"c3":[131.65,-57.71,40.21],"c2":[121.15,-124.26],"k":7,"r":[277,339],"rm":0},{"id":"2310.15256","t":"SimBIG: Field-level Simulation-Based Inference of Galaxy Clustering","ab":"We present the first simulation-based inference (SBI) of cosmological parameters from field-level analysis of galaxy clustering. Standard galaxy clustering analyses rely on analyzing summary statistics, such as the power spectrum, $P_\\ell$, with analytic models based on perturbation theory. Consequently, they do not fully exploit the non-linear and non-Gaussian features of the galaxy distribution. To address these limitations, we use the {\\sc SimBIG} forward modelling framework to perform SBI using normalizing flows. We apply SimBIG to a subset of the BOSS CMASS galaxy sample using a convolutional neural network with stochastic weight averaging to perform massive data compression of the galaxy field. We infer constraints on $Ω_m = 0.267^{+0.033}_{-0.029}$ and $σ_8=0.762^{+0.036}_{-0.035}$. While our constraints on $Ω_m$ are in-line with standard $P_\\ell$ analyses, those on $σ_8$ are $2.65\\times$ tighter. Our analysis also provides constraints on the Hubble constant $H_0=64.5 \\pm 3.8 \\ {\\rm km / s / Mpc}$ from galaxy clustering alone. This higher constraining power comes from additional non-Gaussian cosmological information, inaccessible with $P_\\ell$. We demonstrate the robustness of our analysis by showcasing our ability to infer unbiased cosmological constraints from a series of test simulations that are constructed using different forward models than the one used in our training dataset. This work not only presents competitive cosmological constraints but also introduces novel methods for leveraging additional cosmological information in upcoming galaxy surveys like DESI, PFS, and Euclid.","abx":0,"nw":0,"d":"2023-10-23","dq":0,"y":2023,"au":[507,393,122,580,458,327,200,131,84,107,166],"c":17,"cs":0,"bib":"2023mla..confE..18L","v":"arXiv.org","lk":"arXiv:2310.15256","url":"https://arxiv.org/abs/2310.15256","doi":"10.48550/arXiv.2310.15256","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks","Non-Quijote simulations"],"d":["Density fields","Galaxy mocks (HOD)","Redshift space"],"m":["CNN","Simulation-based inference","Normalizing flows"],"u":["Latin hypercube","Non-Quijote simulations","Density fields","Redshift space"]},"x":-0.0387,"yy":0.0232,"p3":[0.3596,-0.6386,0.0935],"sim":{"k":"e","l":[[243,0.971],[244,0.964],[201,0.959],[200,0.957],[176,0.954]]},"c3":[164.85,55.41,-59.35],"c2":[248.26,20.86],"k":0,"r":[244,245,262,278,336,339],"rm":0},{"id":"2310.15250","t":"Galaxy Clustering Analysis with SimBIG and the Wavelet Scattering Transform","ab":"The non-Gaussisan spatial distribution of galaxies traces the large-scale structure of the Universe and therefore constitutes a prime observable to constrain cosmological parameters. We conduct Bayesian inference of the $Λ$CDM parameters $Ω_m$, $Ω_b$, $h$, $n_s$, and $σ_8$ from the BOSS CMASS galaxy sample by combining the wavelet scattering transform (WST) with a simulation-based inference approach enabled by the ${\\rm S{\\scriptsize IM}BIG}$ forward model. We design a set of reduced WST statistics that leverage symmetries of redshift-space data. Posterior distributions are estimated with a conditional normalizing flow trained on 20,000 simulated ${\\rm S{\\scriptsize IM}BIG}$ galaxy catalogs with survey realism. We assess the accuracy of the posterior estimates using simulation-based calibration and quantify generalization and robustness to the change of forward model using a suite of 2,000 test simulations. When probing scales down to $k_{\\rm max}=0.5~h/\\text{Mpc}$, we are able to derive accurate posterior estimates that are robust to the change of forward model for all parameters, except $σ_8$. We mitigate the robustness issues with $σ_8$ by removing the WST coefficients that probe scales smaller than $k \\sim 0.3~h/\\text{Mpc}$. Applied to the BOSS CMASS sample, our WST analysis yields seemingly improved constraints obtained from a standard PT-based power spectrum analysis with $k_{\\rm max}=0.25~h/\\text{Mpc}$ for all parameters except $h$. However, we still raise concerns on these results. The observational predictions significantly vary across different normalizing flow architectures, which we interpret as a form of model misspecification. This highlights a key challenge for forward modeling approaches when using summary statistics that are sensitive to detailed model-specific or observational imprints on galaxy clustering.","abx":0,"nw":0,"d":"2023-10-23","dq":0,"y":2023,"au":[107,122,580,327,507,200,131,84,393,698,458],"c":47,"cs":0,"bib":"2024PhRvD.109h3535R","v":"Physical Review D","lk":"arXiv:2310.15250","url":"https://arxiv.org/abs/2310.15250","doi":"10.1103/PhysRevD.109.083535","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks","Non-Quijote simulations"],"d":["Galaxy mocks (HOD)","Higher-order statistics","Redshift space"],"m":["Simulation-based inference","Normalizing flows"],"u":["Latin hypercube","Non-Quijote simulations"]},"x":-0.0014,"yy":-0.0251,"p3":[0.2568,-0.8003,-0.1082],"sim":{"k":"e","l":[[243,0.958],[198,0.953],[200,0.946],[201,0.945],[244,0.944]]},"c3":[203.28,87.34,-46.48],"c2":[295.84,1.28],"k":0,"r":[201,244,245,262,272,273,291,311,312,327,339],"rm":0},{"id":"2310.15246","t":"${\\rm S{\\scriptsize IM}BIG}$: The First Cosmological Constraints from Non-Gaussian and Non-Linear Galaxy Clustering","ab":"The 3D distribution of galaxies encodes detailed cosmological information on the expansion and growth history of the Universe. We present the first cosmological constraints that exploit non-Gaussian cosmological information on non-linear scales from galaxy clustering, inaccessible with current standard analyses. We analyze a subset of the BOSS galaxy survey using ${\\rm S{\\scriptsize IM}BIG}$, a new framework for cosmological inference that leverages high-fidelity simulations and deep generative models. We use two clustering statistics beyond the standard power spectrum: the bispectrum and a convolutional neural network based summary of the galaxy field. We infer constraints on $Λ$CDM parameters, $Ω_b$, $h$, $n_s$, $Ω_m$, and $σ_8$, that are 1.6, 1.5, 1.7, 1.2, and 2.3$\\times$ tighter than power spectrum analyses. With this increased precision, we derive constraints on the Hubble constant, $H_0$, and $S_8 = σ_8 \\sqrt{Ω_m/0.3}$ that are competitive with other cosmological probes, even with a sample that only spans 10% of the full BOSS volume. Our $H_0$ constraints, imposing the Big Bang Nucleosynthesis prior on the baryon density, are consistent with the early time constraints from the cosmic microwave background (CMB). Meanwhile, our $S_8$ constraints are consistent with weak lensing experiments and similarly lie below CMB constraints. Lastly, we present forecasts to show that future work extending ${\\rm S{\\scriptsize IM}BIG}$ to upcoming spectroscopic galaxy surveys (DESI, PFS, Euclid) will produce leading $H_0$ and $S_8$ constraints that bridge the gap between early and late time measurements and shed light on current cosmic tensions.","abx":0,"nw":0,"d":"2023-10-23","dq":0,"y":2023,"au":[122,507,393,107,458,580,327,200,131,84,166],"c":21,"cs":0,"bib":"2023arXiv231015246H","v":"","lk":"arXiv:2310.15246","url":"https://arxiv.org/abs/2310.15246","doi":"","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["CNN","Simulation-based inference","Normalizing flows"],"u":["Latin hypercube","Power spectra","Redshift space","Normalizing flows"]},"x":0.0439,"yy":0.0507,"p3":[0.0681,-0.6782,-0.2199],"sim":{"k":"e","l":[[201,0.977],[243,0.96],[198,0.957],[312,0.95],[203,0.948]]},"c3":[181.51,116.48,-88.35],"c2":[267.03,109.94],"k":0,"r":[244,245,262,272,278,284,291,312,322,331,336,339],"rm":0},{"id":"2310.15243","t":"${\\rm S{\\scriptsize IM}BIG}$: The First Cosmological Constraints from the Non-Linear Galaxy Bispectrum","ab":"We present the first cosmological constraints from analyzing higher-order galaxy clustering on non-linear scales. We use ${\\rm S{\\scriptsize IM}BIG}$, a forward modeling framework for galaxy clustering analyses that employs simulation-based inference to perform highly efficient cosmological inference using normalizing flows. It leverages the predictive power of high-fidelity simulations and robustly extracts cosmological information from regimes inaccessible with current standard analyses. In this work, we apply ${\\rm S{\\scriptsize IM}BIG}$ to a subset of the BOSS galaxy sample and analyze the redshift-space bispectrum monopole, $B_0(k_1, k_2, k_3)$, to $k_{\\rm max}=0.5\\,h/{\\rm Mpc}$. We achieve 1$σ$ constraints of $Ω_m=0.293^{+0.027}_{-0.027}$ and $σ_8= 0.783^{+0.040}_{-0.038}$, which are more than 1.2 and 2.4$\\times$ tighter than constraints from standard power spectrum analyses of the same dataset. We also derive 1.4, 1.4, 1.7$\\times$ tighter constraints on $Ω_b$, $h$, $n_s$. This improvement comes from additional cosmological information in higher-order clustering on non-linear scales and, for $σ_8$, is equivalent to the gain expected from a standard analysis on a $\\sim$4$\\times$ larger galaxy sample. Even with our BOSS subsample, which only spans 10% of the full BOSS volume, we derive competitive constraints on the growth of structure: $S_8 = 0.774^{+0.056}_{-0.053}$. Our constraint is consistent with results from both cosmic microwave background and weak lensing. Combined with a $ω_b$ prior from Big Bang Nucleosynthesis, we also derive a constraint on $H_0=67.6^{+2.2}_{-1.8}\\,{\\rm km\\,s^{-1}\\,Mpc^{-1}}$ that is consistent with early universe constraints.","abx":0,"nw":0,"d":"2023-10-23","dq":0,"y":2023,"au":[122,458,580,327,507,200,131,84,393,107],"c":36,"cs":0,"bib":"2024PhRvD.109h3534H","v":"","lk":"arXiv:2310.15243","url":"https://arxiv.org/abs/2310.15243","doi":"","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks"],"d":["Galaxy mocks (HOD)","Higher-order statistics","Redshift space"],"m":["Simulation-based inference","Normalizing flows"],"u":["Latin hypercube"]},"x":0.0284,"yy":0.0337,"p3":[0.2152,-0.7245,-0.2597],"sim":{"k":"e","l":[[200,0.977],[243,0.966],[198,0.959],[199,0.945],[312,0.945]]},"c3":[207.78,43.51,-98.76],"c2":[272.84,52.3],"k":0,"r":[199,200,244,245,262,272,278,283,284,291,312,319,322,331,336,339],"rm":0},{"id":"2310.03548","t":"A theoretical view of the T-web statistical description of the cosmic web","ab":"The classification of the cosmic web into different environments is both a tool to study in more detail the formation of halos and galaxies via the link between their properties and the large-scale environment and as a class of objects whose statistics contain cosmological information. In this paper, we present an analytical framework to compute the probability of the different environments in the cosmic web based on the T-web formalism that classifies structures in four different classes (voids, walls, filaments, knots) by studying the eigenvalues of the tidal tensor (Hessian of the gravitational potential). This method relies on studying the eigenvalues of the tidal tensor with respect to a given threshold and thus requires the knowledge of the JPDF of those eigenvalues. We perform a change of variables in terms of minimally correlated rotational invariants and we study their distribution in the linear regime of structure formation, and in the quasi-linear regime with the help of a Gram-Charlier expansion and tree-order Eulerian perturbation theory. This expansion allows us to predict the probability of the different environments in the density field at a given smoothing scale as a function of the chosen threshold and redshift. We check the validity of our predictions by comparing those predictions to measurements made in the N-body Quijote simulations. We notably find that scaling the threshold value with the non-linear amplitude of fluctuations allows us to capture almost entirely the redshift evolution of the probability of the environments, even if we assume that the density field is Gaussian (corresponding to the linear regime of structure formation). We also show that adding mild non-Gaussian corrections in the form of third-order cumulants of the field provides even more precise predictions for cosmic web abundances up to scales as small as ~5 Mpc/h and redshifts down to z~0.","abx":0,"nw":0,"d":"2023-10-05","dq":0,"y":2023,"au":[207,39,564],"c":15,"cs":0,"bib":"2024A&A...686A.276A","v":"Astronomy &amp; Astrophysics","lk":"arXiv:2310.03548","url":"https://arxiv.org/abs/2310.03548","doi":"10.1051/0004-6361/202348170","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.5781,"yy":-0.0279,"p3":[0.1387,0.783,-0.3824],"sim":{"k":"e","l":[[235,0.947],[241,0.943],[282,0.942],[108,0.936],[40,0.931]]},"c3":[6.84,84.3,-139.48],"c2":[-24.6,15.96],"k":8,"r":[282,339],"rm":0},{"id":"2310.02349","t":"Primordial non-Gaussianities with weak lensing: Information on non-linear scales in the Ulagam full-sky simulations","ab":"Primordial non-Gaussianities (PNGs) are signatures in the density field that encode particle physics processes from the inflationary epoch. Such signatures have been extensively studied using the Cosmic Microwave Background, through constraining the amplitudes, $f^{X}_{\\rm NL}$, with future improvements expected from large-scale structure surveys; specifically, the galaxy correlation functions. We show that weak lensing fields can be used to achieve competitive and complementary constraints. This is shown via the new Ulagam suite of N-body simulations, a subset of which evolves primordial fields with four types of PNGs. We create full-sky lensing maps and estimate the Fisher information from three summary statistics measured on the maps: the moments, the cumulative distribution function, and the 3-point correlation function. We find that the year 10 sample from the Rubin Observatory Legacy Survey of Space and Time (LSST) can constrain PNGs to $σ(f^{\\rm\\,eq}_{\\rm NL}) \\approx 110$, $σ(f^{\\rm\\,or,lss}_{\\rm NL}) \\approx 120$, $σ(f^{\\rm\\,loc}_{\\rm NL}) \\approx 40$. For the former two, this is better than or comparable to expected galaxy clustering-based constraints from the Dark Energy Spectroscopic Instrument (DESI). The PNG information in lensing fields is on non-linear scales and at low redshifts ($z \\lesssim 1.25$), with a clear origin in the evolution history of massive halos. The constraining power degrades by $\\sim\\!\\!60\\%$ under scale cuts of $\\gtrsim 20{\\,\\rm Mpc}$, showing there is still significant information on scales mostly insensitive to small-scale systematic effects (e.g. baryons). We publicly release the Ulagam suite to enable more survey-focused analyses.","abx":0,"nw":0,"d":"2023-10-03","dq":0,"y":2023,"au":[174,130,274,426],"c":17,"cs":0,"bib":"2024JCAP...03..062A","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2310.02349","url":"https://arxiv.org/abs/2310.02349","doi":"10.1088/1475-7516/2024/03/062","tg":{"s":["Quijote (set not stated)","Non-Quijote simulations"],"d":["Higher-order statistics","Weak lensing & 2D maps"],"m":["Fisher forecasts","No ML"],"u":[]},"x":0.2823,"yy":0.6975,"p3":[-0.4801,-0.0395,-0.1667],"sim":{"k":"e","l":[[144,0.953],[264,0.95],[25,0.95],[63,0.949],[12,0.949]]},"c3":[-167.84,-56.31,-107.3],"c2":[-61.0,-106.05],"k":5,"r":[211,226,247,264,295,327,333,339],"rm":0},{"id":"2309.15151","t":"Small-scale signatures of primordial non-Gaussianity in k-Nearest Neighbour cumulative distribution functions","ab":"Searches for primordial non-Gaussianity in cosmological perturbations are a key means of revealing novel primordial physics. However, robustly extracting signatures of primordial non-Gaussianity from non-linear scales of the late-time Universe is an open problem. In this paper, we apply k-Nearest Neighbor cumulative distribution functions, kNN-CDFs, to the \\textsc{quijote-png} simulations to explore the sensitivity of kNN-CDFs to primordial non-Gaussianity. An interesting result is that for halo samples with $M_h<10^{14}$ M$_\\odot$/h, the kNN-CDFs respond to \\textit{equilateral} PNG in a manner distinct from the other parameters. This persists in the galaxy catalogs in redshift space and can be differentiated from the impact of galaxy modelling, at least within the halo occupation distribution (HOD) framework considered here. kNN-CDFs are related to counts-in-cells and, through mapping a subset of the kNN-CDF measurements into the count-in-cells picture, we show that our results can be modeled analytically. A caveat of the analysis is that we only consider the HOD framework, including assembly bias. It will be interesting to validate these results with other techniques for modeling the galaxy--halo connection, e.g., (hybrid) effective field theory or semi-analytical methods.","abx":0,"nw":0,"d":"2023-09-26","dq":0,"y":2023,"au":[665,631,73],"c":17,"cs":0,"bib":"2024MNRAS.534.1621C","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2309.15151","url":"https://arxiv.org/abs/2309.15151","doi":"10.1093/mnras/stae2108","tg":{"s":["Quijote-PNG","Molino / HOD galaxy mocks"],"d":["Halo catalogs","Galaxy mocks (HOD)","Higher-order statistics","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":[]},"x":0.0346,"yy":0.7924,"p3":[-0.8139,-0.0557,-0.071],"sim":{"k":"e","l":[[163,0.95],[257,0.943],[242,0.942],[130,0.941],[264,0.941]]},"c3":[-163.64,-4.0,-93.2],"c2":[23.63,-73.27],"k":4,"r":[211,226,227,228,242,247,257,263,264,280,295,298,310,322,333,334,339],"rm":0},{"id":"2309.15071","t":"Sensitivity Analysis of Simulation-Based Inference for Galaxy Clustering","ab":"Simulation-based inference (SBI) is a promising approach to leverage high fidelity cosmological simulations and extract information from the non-Gaussian, non-linear scales that cannot be modeled analytically. However, scaling SBI to the next generation of cosmological surveys faces the computational challenge of requiring a large number of accurate simulations over a wide range of cosmologies, while simultaneously encompassing large cosmological volumes at high resolution. This challenge can potentially be mitigated by balancing the accuracy and computational cost for different components of the the forward model while ensuring robust inference. To guide our steps in this, we perform a sensitivity analysis of SBI for galaxy clustering on various components of the cosmological simulations: gravity model, halo-finder and the galaxy-halo distribution models (halo-occupation distribution, HOD). We infer the $σ_8$ and $Ω_m$ using galaxy power spectrum multipoles and the bispectrum monopole assuming a galaxy number density expected from the luminous red galaxies observed using the Dark Energy Spectroscopy Instrument (DESI). We find that SBI is insensitive to changing gravity model between $N$-body simulations and particle mesh (PM) simulations. However, changing the halo-finder from friends-of-friends (FoF) to Rockstar can lead to biased estimate of $σ_8$ based on the bispectrum. For galaxy models, training SBI on more complex HOD leads to consistent inference for less complex HOD models, but SBI trained on simpler HOD models fails when applied to analyze data from a more complex HOD model. Based on our results, we discuss the outlook on cosmological simulations with a focus on applying SBI approaches to future galaxy surveys.","abx":0,"nw":0,"d":"2023-09-26","dq":0,"y":2023,"au":[131,581,448,122,107,95],"c":33,"cs":0,"bib":"2025MNRAS.536..254M","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2309.15071","url":"https://arxiv.org/abs/2309.15071","doi":"10.1093/mnras/stae2473","tg":{"s":["Latin hypercube","Molino / HOD galaxy mocks","Non-Quijote simulations"],"d":["Halo catalogs","Galaxy mocks (HOD)","Power spectra","Higher-order statistics","Redshift space"],"m":["Simulation-based inference"],"u":["Latin hypercube","Non-Quijote simulations","Redshift space"]},"x":-0.1401,"yy":-0.0209,"p3":[0.5761,-0.3573,-0.2541],"sim":{"k":"e","l":[[244,0.95],[142,0.949],[99,0.946],[146,0.945],[243,0.943]]},"c3":[161.69,148.3,27.12],"c2":[285.91,22.6],"k":0,"r":[199,208,243,244,272,284,291,322,339],"rm":0},{"id":"title:towardsanoptimalcosmologicaldetectionofneutrinomasswithbayesianinference","t":"Towards an Optimal Cosmological Detection of Neutrino Mass with Bayesian Inference","ab":"","abx":0,"nw":0,"d":"2023","dq":1,"y":2023,"au":[21],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://escholarship.org/uc/item/0gf06762","doi":"","tg":{"s":["Fiducial","Fisher derivatives","Massive neutrinos"],"d":["Power spectra","Higher-order statistics"],"m":["Simulation-based inference","Fisher forecasts"],"u":["Massive neutrinos","Fiducial","Fisher derivatives","Power spectra","Higher-order statistics","Fisher forecasts","Simulation-based inference"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.1354,"yy":-0.0007,"p3":[0.4762,0.0202,0.1751],"sim":{"k":"w","l":[[162,0.168],[2,0.125],[170,0.115],[43,0.112],[190,0.109]]},"c3":[-81.41,-316.34,126.29],"c2":[-199.09,-300.53],"k":8,"r":[],"rm":1},{"id":"2309.14457","t":"The effects of non-linearity on the growth rate constraint from velocity correlation functions","ab":"The two-point statistics of the cosmic velocity field, measured from galaxy peculiar velocity (PV) surveys, can be used as a dynamical probe to constrain the growth rate of large-scale structures in the universe. Most works use the statistics on scales down to a few tens of Megaparsecs, while using a theoretical template based on the linear theory. In addition, while the cosmic velocity is volume-weighted, the observable line-of-sight velocity two-point correlation is density-weighted, as sampled by galaxies, and therefore the density-velocity correlation term also contributes, which has often been neglected. These effects are fourth order in powers of the linear density fluctuation $δ_{\\rm L}^4$, compared to $δ_{\\rm L}^2$ of the linear velocity correlation function, and have the opposite sign. We present these terms up to $δ_{\\rm L}^4$ in real space based on the standard perturbation theory, and investigate the effect of non-linearity and the density-velocity contribution on the inferred growth rate $fσ_8$, using $N$-body simulations. We find that for a next-generation PV survey of volume $\\sim {\\cal O}(500 \\, h^{-1} \\, {\\rm Mpc})^3$, these effects amount to a shift of $fσ_8$ by $\\sim 10$ per cent and is comparable to the forecasted statistical error when the minimum scale used for parameter estimation is $r_{\\rm min} = 20 \\, h^{-1} \\, {\\rm Mpc}$.","abx":0,"nw":0,"d":"2023-09-25","dq":0,"y":2023,"au":[470,599,123,606,351],"c":2,"cs":0,"bib":"2024MNRAS.529.4787T","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2309.14457","url":"https://arxiv.org/abs/2309.14457","doi":"10.1093/mnras/stae700","tg":{"s":["Quijote (set not stated)"],"d":["Particle snapshots","Halo catalogs","Power spectra"],"m":["Perturbation theory & analytic models","No ML"],"u":["Particle snapshots","Halo catalogs","Power spectra"]},"x":-0.5801,"yy":0.2551,"p3":[0.2432,-0.1064,-0.5897],"sim":{"k":"e","l":[[316,0.932],[109,0.932],[265,0.931],[155,0.927],[106,0.926]]},"c3":[90.64,-94.99,36.11],"c2":[-134.54,117.3],"k":2,"r":[339],"rm":0},{"id":"2309.10270","t":"Hybrid SBI or How I Learned to Stop Worrying and Learn the Likelihood","ab":"We propose a new framework for the analysis of current and future cosmological surveys, which combines perturbative methods (PT) on large scales with conditional simulation-based implicit inference (SBI) on small scales. This enables modeling of a wide range of statistics across all scales using only small-volume simulations, drastically reducing computational costs, and avoids the assumption of an explicit small-scale likelihood. As a proof-of-principle for this hybrid simulation-based inference (HySBI) approach, we apply it to dark matter density fields and constrain cosmological parameters using both the power spectrum and wavelet coefficients, finding promising results that significantly outperform classical PT methods. We additionally lay out a roadmap for the next steps necessary to implement HySBI on actual survey data, including consideration of bias, systematics, and customized simulations. Our approach provides a realistic way to scale SBI to future survey volumes, avoiding prohibitive computational costs.","abx":0,"nw":0,"d":"2023-09-19","dq":0,"y":2023,"au":[131,498],"c":25,"cs":0,"bib":"2023arXiv230910270M","v":"","lk":"arXiv:2309.10270","url":"https://arxiv.org/abs/2309.10270","doi":"","tg":{"s":["Latin hypercube"],"d":["Density fields","Power spectra","Higher-order statistics"],"m":["Simulation-based inference","Perturbation theory & analytic models"],"u":["Latin hypercube"]},"x":-0.1727,"yy":-0.2429,"p3":[0.4492,-0.153,0.2964],"sim":{"k":"e","l":[[127,0.955],[99,0.953],[107,0.948],[83,0.945],[115,0.944]]},"c3":[130.44,38.78,82.07],"c2":[244.38,-104.91],"k":7,"r":[248,272,339],"rm":0},{"id":"2309.05850","t":"Predicting Interloper Fraction with Graph Neural Networks","ab":"Upcoming emission-line spectroscopic surveys, such as Euclid and the Roman Space Telescope, will be affected by systematic effects due to the presence of interlopers: galaxies whose redshift and distance from us are miscalculated due to line confusion in their emission spectra. Particularly pernicious are interlopers involving the confusion between two lines with close emitted wavelengths, like H$β$ emitters confused as \\oiii, since those are strongly spatially correlated with the target galaxies. They introduce a particular pattern in the 3D distribution of the observed galaxy catalog that can shift the position of the BAO peak in the galaxy correlation function and bias any cosmological analysis performed with that sample. Here we present a novel method to predict the fraction of interlopers in a galaxy catalog, using Graph Neural Networks (GNNs) to learn the posterior distribution of the interloper fraction while marginalizing over cosmology and galaxy bias. The method is developed using simulations with halos acting as a proxy for galaxies. The GNN can infer the mean and standard deviation of the posterior distribution of interloper fraction using small-scale information that is usually not considered in cosmological analyses. The injection of large-scale information into the graph as a global attribute improves the performance of the GNN when marginalizing over cosmology.","abx":0,"nw":0,"d":"2023-09-11","dq":0,"y":2023,"au":[200,240,661],"c":9,"cs":0,"bib":"2023JCAP...12..012M","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2309.05850","url":"https://arxiv.org/abs/2309.05850","doi":"10.1088/1475-7516/2023/12/012","tg":{"s":["Latin hypercube"],"d":["Halo catalogs","Redshift space"],"m":["Graph neural networks"],"u":["Latin hypercube","Redshift space"]},"x":-0.336,"yy":-0.9199,"p3":[-0.1148,0.2477,0.6682],"sim":{"k":"e","l":[[246,0.942],[255,0.93],[302,0.927],[103,0.922],[169,0.919]]},"c3":[-98.72,103.47,133.43],"c2":[-201.16,28.23],"k":9,"r":[252,325,339],"rm":0},{"id":"2308.07379","t":"The two-loop power spectrum in redshift space","ab":"We present the matter power spectrum in redshift space including two-loop corrections. We follow a strictly perturbative approach incorporating all non-linearities entering both via the redshift-space mapping and within real space up to the required (fifth) order, complemented by suitable effective field theory (EFT) corrections. This approach can a priori be viable up to scales of order $0.2h~\\mathrm{Mpc}^{-1}$ beyond which power suppression related to the finger-of-God effect becomes non-perturbatively strong. We extend a simplified treatment of EFT corrections at two-loop order from real to redshift space, making sure that the leading UV-sensitivity of both the single-hard and double-hard limit of the two-loop contributions to the power spectrum is accounted for, and featuring two free parameters for each multipole. Taking also infrared-resummation into account, we calibrate with and compare to Quijote $N$-body simulations for the monopole and quadrupole at redshifts $z=0$ and $z=0.5$. We find agreement within sample variance (at percent-level) up to $0.18h~\\mathrm{Mpc}^{-1}$ at two-loop order, compared to $0.1h~\\mathrm{Mpc}^{-1}$ at one-loop. We also investigate the role of higher-derivative corrections.","abx":0,"nw":0,"d":"2023-08-14","dq":0,"y":2023,"au":[515,440],"c":16,"cs":0,"bib":"2023JCAP...11..078T","v":"Journal of Cosmology and Astroparticle Physics","lk":"arXiv:2308.07379","url":"https://arxiv.org/abs/2308.07379","doi":"10.1088/1475-7516/2023/11/078","tg":{"s":["Fiducial"],"d":["Power spectra","Redshift space"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial"]},"x":-0.6089,"yy":0.4662,"p3":[0.0895,-0.4338,-0.8264],"sim":{"k":"e","l":[[296,0.938],[317,0.937],[155,0.932],[267,0.931],[315,0.928]]},"c3":[146.2,-10.25,-34.46],"c2":[79.1,-39.98],"k":4,"r":[267,339],"rm":0},{"id":"2308.03863","t":"Beyond the 3rd moment: A practical study of using lensing convergence CDFs for cosmology with DES Y3","ab":"Widefield surveys of the sky probe many clustered scalar fields -- such as galaxy counts, lensing potential, gas pressure, etc. -- that are sensitive to different cosmological and astrophysical processes. Our ability to constrain such processes from these fields depends crucially on the statistics chosen to summarize the field. In this work, we explore the cumulative distribution function (CDF) at multiple scales as a summary of the galaxy lensing convergence field. Using a suite of N-body lightcone simulations, we show the CDFs' constraining power is modestly better than that of the 2nd and 3rd moments of the field, as they approximately capture the information from all moments of the field in a concise data vector. We then study the practical aspects of applying the CDFs to observational data, using the first three years of the Dark Energy Survey (DES Y3) data as an example, and compute the impact of different systematics on the CDFs. The contributions from the point spread function are 2-3 orders of magnitude below the cosmological signal, while those from reduced shear approximation contribute $\\lesssim 1\\%$ to the signal. Source clustering effects and baryon imprints contribute $1-10\\%$. Enforcing scale cuts to limit systematics-driven biases in parameter constraints degrades these constraints a noticeable amount, and this degradation is similar for the CDFs and the moments. We also detect correlations between the observed convergence field and the shape noise field at $13σ$. We find that the non-Gaussian correlations in the noise field must be modeled accurately to use the CDFs, or other statistics sensitive to all moments, as a rigorous cosmology tool.","abx":0,"nw":0,"d":"2023-08-07","dq":0,"y":2023,"au":[174,130,73,631,426,640,1,2,189,362,417,250,3,4,412,526,5,108,344,268,557,109,7,363,299,558,8,159,524,285,653,190,85,416,483,612,484,472,501,473,303,305,9,581,306,418,529,12,191,110,380,286,194,617,409,287,383,86,87,695,614,553,410,493,216,295,152,297,153,525,381,414,615,556,503,284,300,243,244,560,155,364,154,365,494,302,304,217,528,10,11,0,366,192,419,413,246,506],"c":38,"cs":0,"bib":"2023MNRAS.526.5530A","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2308.03863","url":"https://arxiv.org/abs/2308.03863","doi":"10.1093/mnras/stad3118","tg":{"s":["Quijote (set not stated)"],"d":["Higher-order statistics","Weak lensing & 2D maps"],"m":["Fisher forecasts","No ML"],"u":["Fisher forecasts"]},"x":0.1492,"yy":-0.461,"p3":[-0.1732,0.2647,0.1617],"sim":{"k":"e","l":[[119,0.928],[135,0.927],[175,0.925],[11,0.925],[203,0.924]]},"c3":[-188.89,32.46,-138.02],"c2":[-77.06,-5.49],"k":0,"r":[203,247,273,280,281,290,310,322,327,333,334,339],"rm":0},{"id":"title:precisioncosmologyusingvoids","t":"Precision cosmology using voids","ab":"","abx":0,"nw":0,"d":"2023","dq":1,"y":2023,"au":[35],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://uwspace.uwaterloo.ca/handle/10012/19651","doi":"","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Void catalogs"],"m":["Fisher forecasts","No ML"],"u":["Fiducial","Fisher derivatives","Void catalogs","Fisher forecasts","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.4202,"yy":-0.6147,"p3":[0.2095,-0.3772,0.3717],"sim":{"k":"w","l":[[57,0.234],[279,0.177],[45,0.171],[297,0.163],[16,0.114]]},"c3":[273.89,-128.56,175.73],"c2":[255.87,-290.2],"k":9,"r":[],"rm":1},{"id":"2308.03086","t":"Probing the Anisotropy and Non-Gaussianity in the Redshift Space through the Conditional Moments of the First Derivative","ab":"Focusing on the redshift space observations with plane-parallel approximation and relying on the rotational dependency of the general definition of excursion sets, we introduce the so-called conditional moments of the first derivative ($cmd$) measures for the smoothed matter density field in three dimensions. We derive the perturbative expansion of $cmd$ for the real space and redshift space where peculiar velocity disturbs the galaxies' observed locations. Our criteria can successfully recognize the contribution of linear Kaiser and Finger-of-God effects. Our results demonstrate that the $cmd$ measure has significant sensitivity for pristine constraining the redshift space distortion parameter $β=f/b$ and interestingly, the associated normalized quantity in the Gaussian linear Kaiser limit has only $β$ dependency. Implementation of the synthetic anisotropic Gaussian field approves the consistency between the theoretical and numerical results. Including the first-order contribution of non-Gaussianity perturbatively in the $cmd$ criterion implies that the N-body simulations for the Quijote suite in the redshift space have been mildly skewed with a higher value for the threshold greater than zero. The non-Gaussianity for the perpendicular direction to the line of sight in the redshift space for smoothing scales $R\\gtrsim 20$ Mpc h$^{-1}$ is almost the same as the real space. In contrast, the non-Gaussianity along the line of sight direction in redshift space is magnified. The Fisher forecasts indicate an almost significant enhancement in constraining the cosmological parameters, $Ω_m$, $σ_8$, and $n_s$ when using $cmd+cr$ jointly.","abx":0,"nw":0,"d":"2023-08-06","dq":0,"y":2023,"au":[415,559],"c":9,"cs":0,"bib":"2024ApJ...963...31K","v":"Astrophysical Journal","lk":"arXiv:2308.03086","url":"https://arxiv.org/abs/2308.03086","doi":"10.3847/1538-4357/ad1880","tg":{"s":["Fiducial","Fisher derivatives"],"d":["Density fields","Higher-order statistics","Redshift space"],"m":["Fisher forecasts","Perturbation theory & analytic models","No ML"],"u":["Fiducial","Fisher derivatives"]},"x":0.5543,"yy":0.5459,"p3":[-0.4523,0.4165,-0.3753],"sim":{"k":"e","l":[[93,0.928],[304,0.928],[251,0.927],[73,0.925],[242,0.923]]},"c3":[48.48,275.69,-42.66],"c2":[165.44,280.57],"k":5,"r":[251,275,293,339],"rm":0},{"id":"2307.09134","t":"Hybrid-bias and displacement emulators for field-level modelling of galaxy clustering in real and redshift space","ab":"Recently, hybrid bias expansions have emerged as a powerful approach to modelling the way in which galaxies are distributed in the Universe. Similarly, field-level emulators have recently become possible thanks to advances in machine learning and $N$-body simulations. In this paper we explore whether both techniques can be combined to provide a field-level model for the clustering of galaxies in real and redshift space. Specifically, here we will demonstrate that field-level emulators are able to accurately predict all the operators of a $2^{\\rm nd}$-order hybrid bias expansion. The precision achieved in real and redshift space is similar to that obtained for the nonlinear matter power spectrum. This translates to roughly 1-2\\% precision for the power spectrum of a BOSS and a Euclid-like galaxy sample up to $k\\sim 0.6 h^{-1}$Mpc. Remarkably, this combined approach also delivers precise predictions for field-level galaxy statistics. Despite all these promising results, we detect several areas where further improvements are required. Therefore, this work serves as a road-map for the developments required for a more complete exploitation of upcoming large-scale structure surveys.","abx":0,"nw":0,"d":"2023-07-18","dq":0,"y":2023,"au":[428,534,187,684],"c":15,"cs":0,"bib":"2024MNRAS.529...89P","v":"Monthly notices of the Royal Astronomical Society","lk":"arXiv:2307.09134","url":"https://arxiv.org/abs/2307.09134","doi":"10.1093/mnras/stae489","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Particle snapshots","Power spectra","Redshift space"],"m":["CNN","Emulators & regression ML","Perturbation theory & analytic models"],"u":["CNN"]},"x":-0.3963,"yy":0.1939,"p3":[0.3978,-0.5227,-0.4359],"sim":{"k":"e","l":[[295,0.955],[6,0.949],[173,0.935],[79,0.933],[201,0.933]]},"c3":[52.97,87.53,-2.98],"c2":[193.12,-13.45],"k":2,"r":[244,260,286,291,322,339],"rm":0},{"id":"2307.07555","t":"Neutrino mass constraint from an Implicit Likelihood Analysis of BOSS voids","ab":"Cosmic voids identified in the spatial distribution of galaxies provide complementary information to two-point statistics. In particular, constraints on the neutrino mass sum, $\\sum m_ν$, promise to benefit from the inclusion of void statistics. We perform inference on the CMASS NGC sample of SDSS-III/BOSS with the aim of constraining $\\sum m_ν$. We utilize the void size function, the void galaxy cross power spectrum, and the galaxy auto power spectrum. To extract constraints from these summary statistics we use a simulation-based approach, specifically implicit likelihood inference. We populate approximate gravity-only, particle neutrino cosmological simulations with an expressive halo occupation distribution model. With a conservative scale cut of kmax=0.15 h/Mpc and a Planck-inspired LCDM prior, we find upper bounds on $\\sum m_ν$ of 0.43 and 0.35 eV from the galaxy auto power spectrum and the full data vector, respectively (95% credible interval). We observe hints that the void statistics may be most effective at constraining $\\sum m_ν$ from below. We also substantiate the usual assumption that the void size function is Poisson distributed.","abx":0,"nw":0,"d":"2023-07-14","dq":0,"y":2023,"au":[391,200,43,122,166,580,95],"c":35,"cs":0,"bib":"2024ApJ...969...89T","v":"Astrophysical Journal","lk":"arXiv:2307.07555","url":"https://arxiv.org/abs/2307.07555","doi":"10.3847/1538-4357/ad434e","tg":{"s":["Molino / HOD galaxy mocks","Non-Quijote simulations"],"d":["Galaxy mocks (HOD)","Void catalogs","Power spectra","Redshift space"],"m":["Simulation-based inference"],"u":["Non-Quijote simulations","Redshift space"]},"x":0.2859,"yy":-0.0146,"p3":[0.1369,-0.3263,0.0428],"sim":{"k":"e","l":[[308,0.942],[297,0.938],[14,0.934],[113,0.932],[170,0.931]]},"c3":[30.56,202.07,-17.54],"c2":[141.61,167.41],"k":7,"r":[243,244,297,308,339],"rm":0},{"id":"2307.03671","t":"Optimal Transport Reconstruction of Biased Tracers in Redshift Space","ab":"Recent research has emphasized the benefits of accurately reconstructing the initial Lagrangian positions of biased tracers from their positions at a later time, to gain cosmological information. A weighted semi-discrete optimal transport algorithm can achieve the required accuracy, provided the late-time positions are known, with minimal information about the background cosmology. The algorithm's performance relies on knowing the masses of the biased tracers, and depends on how one models the distribution of the remaining mass that is not associated with these tracers. We demonstrate that simple models of the remaining mass result in accurate retrieval of the initial Lagrangian positions, which we quantify using pair statistics and the void probability function. This is true even if the input positions are affected by redshift-space distortions. The most sophisticated models assume that the masses of the tracers, and the amount and clustering of the missing mass are known; we show that the method is robust to realistic errors in the masses of the tracers and remains so as the model for the missing mass becomes increasingly crude.","abx":0,"nw":0,"d":"2023-07-07","dq":0,"y":2023,"au":[222,490,106,536,546],"c":19,"cs":0,"bib":"2023PhRvD.108h3534N","v":"Physical Review D","lk":"arXiv:2307.03671","url":"https://arxiv.org/abs/2307.03671","doi":"10.1103/physrevd.108.083534","tg":{"s":["Quijote (set not stated)"],"d":["Halo catalogs","Higher-order statistics","Redshift space"],"m":["No ML"],"u":[]},"x":-0.3665,"yy":0.7348,"p3":[-0.1662,-0.6766,-0.16],"sim":{"k":"e","l":[[180,0.941],[258,0.93],[324,0.93],[82,0.929],[27,0.929]]},"c3":[-24.59,-84.13,233.41],"c2":[-114.38,-249.53],"k":2,"r":[],"rm":0},{"id":"title:numericalstudiesinrarefiedgasdynamicscosmologicalsummarystatisticsandscalarfield","t":"Numerical Studies in Rarefied Gas Dynamics, Cosmological Summary Statistics, and Scalar Field Dark Matter","ab":"","abx":0,"nw":0,"d":"2023","dq":1,"y":2023,"au":[45],"c":0,"cs":2,"bib":"","v":"","lk":"PhD thesis","url":"https://searchworks.stanford.edu/view/14783507","doi":"","tg":{"s":["Quijote (set not stated)"],"d":["Power spectra","Higher-order statistics"],"m":["No ML"],"u":["Quijote (set not stated)","Power spectra","Higher-order statistics","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.0546,"yy":0.1073,"p3":[-0.276,-0.214,0.0797],"sim":{"k":"w","l":[[66,0.272],[91,0.202],[126,0.12],[211,0.1],[77,0.091]]},"c3":[200.34,-263.16,111.81],"c2":[78.7,-375.86],"k":2,"r":[],"rm":1},{"id":"2306.17210","t":"Scattering Spectra Models for Physics","ab":"Physicists routinely need probabilistic models for a number of tasks such as parameter inference or the generation of new realizations of a field. Establishing such models for highly non-Gaussian fields is a challenge, especially when the number of samples is limited. In this paper, we introduce scattering spectra models for stationary fields and we show that they provide accurate and robust statistical descriptions of a wide range of fields encountered in physics. These models are based on covariances of scattering coefficients, i.e. wavelet decomposition of a field coupled with a point-wise modulus. After introducing useful dimension reductions taking advantage of the regularity of a field under rotation and scaling, we validate these models on various multi-scale physical fields and demonstrate that they reproduce standard statistics, including spatial moments up to 4th order. These scattering spectra provide us with a low-dimensional structured representation that captures key properties encountered in a wide range of physical fields. These generic models can be used for data exploration, classification, parameter inference, symmetry detection, and component separation.","abx":0,"nw":0,"d":"2023-06-29","dq":0,"y":2023,"au":[588,547,213,105,602],"c":21,"cs":0,"bib":"2024PNASN...3E.103C","v":"PNAS Nexus","lk":"arXiv:2306.17210","url":"https://arxiv.org/abs/2306.17210","doi":"10.1093/pnasnexus/pgae103","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["Generative models"],"u":["Density fields","Generative models"]},"x":0.0898,"yy":-0.9629,"p3":[-0.2866,-0.4616,0.6548],"sim":{"k":"e","l":[[172,0.939],[136,0.923],[327,0.92],[273,0.916],[55,0.915]]},"c3":[43.99,119.53,37.6],"c2":[-27.42,80.82],"k":6,"r":[291,327,339],"rm":0},{"id":"2306.15012","t":"Statistical Component Separation for Targeted Signal Recovery in Noisy Mixtures","ab":"Separating signals from an additive mixture may be an unnecessarily hard problem when one is only interested in specific properties of a given signal. In this work, we tackle simpler \"statistical component separation\" problems that focus on recovering a predefined set of statistical descriptors of a target signal from a noisy mixture. Assuming access to samples of the noise process, we investigate a method devised to match the statistics of the solution candidate corrupted by noise samples with those of the observed mixture. We first analyze the behavior of this method using simple examples with analytically tractable calculations. Then, we apply it in an image denoising context employing 1) wavelet-based descriptors, 2) ConvNet-based descriptors on astrophysics and ImageNet data. In the case of 1), we show that our method better recovers the descriptors of the target data than a standard denoising method in most situations. Additionally, despite not constructed for this purpose, it performs surprisingly well in terms of peak signal-to-noise ratio on full signal reconstruction. In comparison, representation 2) appears less suitable for image denoising. Finally, we extend this method by introducing a diffusive stepwise algorithm which gives a new perspective to the initial method and leads to promising results for image denoising under specific circumstances.","abx":0,"nw":0,"d":"2023-06-26","dq":0,"y":2023,"au":[107,458],"c":2,"cs":0,"bib":"2023arXiv230615012R","v":"Trans. Mach. Learn. Res.","lk":"arXiv:2306.15012","url":"https://arxiv.org/abs/2306.15012","doi":"10.48550/arXiv.2306.15012","tg":{"s":["Quijote (set not stated)"],"d":["Density fields","Higher-order statistics"],"m":["CNN","Other ML"],"u":["Density fields","Other ML"]},"x":0.1163,"yy":-1.0,"p3":[-0.1442,-0.4879,0.7692],"sim":{"k":"e","l":[[218,0.909],[184,0.886],[53,0.883],[172,0.881],[173,0.877]]},"c3":[37.96,-45.23,-86.2],"c2":[5.79,-59.03],"k":6,"r":[327,339],"rm":0},{"id":"title:whispersfromthebigbangcosmologicalconstraintsfromgalaxypowerspectra","t":"Whispers from the Big Bang: cosmological constraints from galaxy power spectra","ab":"","abx":0,"nw":0,"d":"2023","dq":1,"y":2023,"au":[13],"c":0,"cs":1,"bib":"","v":"","lk":"PhD thesis","url":"https://espace.library.uq.edu.au/view/UQ:f88e80a","doi":"10.14264/f88e80a","tg":{"s":["Fiducial"],"d":["Power spectra"],"m":["Perturbation theory & analytic models","No ML"],"u":["Fiducial","Power spectra","Perturbation theory & analytic models","No ML"],"n":"No abstract available: tags guessed from the title only; please check."},"x":0.034,"yy":0.0469,"p3":[0.1846,-0.6163,-0.3579],"sim":{"k":"w","l":[[186,0.193],[200,0.168],[201,0.161],[262,0.123],[176,0.118]]},"c3":[284.67,24.64,206.66],"c2":[362.86,-158.36],"k":0,"r":[],"rm":1},{"id":"2306.11782","t":"Signatures of a Parity-Violating Universe","ab":"What would a parity-violating universe look like? We present a numerical and theoretical study of mirror asymmetries in the late universe, using a new suite of $N$-body simulations: QUIJOTE-Odd. These feature parity-violating initial conditions, injected via a simple ansatz for the imaginary primordial trispectrum and evolved into the non-linear regime. We find that the realization-averaged power spectrum, bispectrum, halo mass function, and matter PDF are not affected by our modifications to the initial conditions, deep into the non-linear regime, which we argue arises from rotational and translational invariance. In contrast, the parity-odd trispectrum of matter (measured using a new estimator), shows distinct signatures proportional to the parity-violating parameter, $p_{\\rm NL}$, which sets the amplitude of the primordial trispectrum. We additionally find intriguing signatures in the angular momentum of halos, with the primordial trispectrum inducing a non-zero correlation between angular momentum and smoothed velocity field, proportional to $p_{\\rm NL}$. Our simulation suite has been made public to facilitate future analyses.","abx":0,"nw":0,"d":"2023-06-20","dq":0,"y":2023,"au":[665,498,240],"c":43,"cs":0,"bib":"2024PhRvD.109b3531C","v":"Physical Review D","lk":"arXiv:2306.11782","url":"https://arxiv.org/abs/2306.11782","doi":"1
