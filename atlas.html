<title>__TITLE__</title>
<link rel="icon" type="image/svg+xml" href="__ICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
__CSS__</style>

<header>
  <div class="brand">
    <h1>__TITLE__</h1>
    <p class="tagline">__LEAD__ <a href="__HOME__" target="_blank" rel="noopener">__SUBJECT__</a>, mapped by topic, citations and collaborations.</p>
    <div class="stats" id="stats"></div>
  </div>
  <div class="modes" role="group" aria-label="View">
    <button id="m-topics" data-view="topics" aria-pressed="true">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="4" cy="5" r="2"/><circle cx="10" cy="3.5" r="1.5"/><circle cx="12" cy="10" r="2.5"/><circle cx="5" cy="11.5" r="1.5"/></svg>
      <span>Topic map</span></button>
    <button id="m-citations" data-view="citations" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="3.5" cy="12" r="2"/><circle cx="12.5" cy="12" r="2"/><circle cx="8" cy="3.5" r="2"/><path d="M4.6 10.3 7 5.3M11.4 10.3 9 5.3M5.5 12h5"/></svg>
      <span>Citations</span></button>
    <button id="m-coauthors" data-view="coauthors" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="5.5" cy="5" r="2.3"/><circle cx="11.5" cy="6" r="1.8"/><path d="M1.5 14c.5-2.7 2-4 4-4s3.5 1.3 4 4M10 10.3c.5-.2 1-.3 1.5-.3 1.6 0 2.7 1.2 3 3.5"/></svg>
      <span>Co-authors</span></button>
    <button id="m-table" data-view="table" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M2 6h12M2 9.5h12M6.5 6v7.5"/></svg>
      <span>Table</span></button>
    <button id="m-trends" data-view="trends" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 13.5h11M4.5 13.5V9M8 13.5V5.5M11.5 13.5V7.5"/></svg>
      <span>Trends</span></button>
  </div>
</header>

<div class="toolbar">
  <label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
    <input id="q" type="search" placeholder="Search  ( / )" aria-label="Search papers, authors, abstracts and tags"><span class="qcount" id="qcount" aria-live="polite"></span></label>
  <span class="field"><label for="y0">Years</label> <select id="y0"></select> <span aria-hidden="true">–</span> <select id="y1" aria-label="To year"></select> <button class="ghost playbtn" id="play" type="button" title="Play the history: papers appear one by one in date order" aria-label="Play the history paper by paper">▶</button></span>
  <button class="ghost" id="fbtn" type="button" aria-expanded="false" aria-controls="fpanel">Filters <span class="fcount" id="fcount"></span> ▾</button>
  <span class="active" id="active" aria-label="Active filters"></span>
  <button class="ghost" id="reset">Clear filters</button>
</div>
<div class="fpanel" id="fpanel" hidden>
  <div class="frow">
    <span class="field"><label for="f-suite">Suite</label> <select id="f-suite"></select></span>
    <span class="field"><label for="f-data">Data</label> <select id="f-data"></select></span>
    <span class="field"><label for="f-method">Method</label> <select id="f-method"></select></span>
  </div>
  <div class="ftitle">Topics <span>· click to show or hide; Alt-click to show only one</span></div>
  <div class="legend" id="legend" aria-label="Topics"></div>
</div>

<main>
  <div class="stage" id="stage">
    <div class="mapopts"><div class="cbkey" id="cbkey" hidden></div></div>
    <canvas id="cv" aria-label="Interactive map of __NAME__ publications" role="img"></canvas>
    <div class="zoom">
      <div class="dispwrap"><button class="dispbtn" id="dispbtn" type="button" aria-haspopup="true" aria-expanded="false" title="Layout and colors">Display <span id="dispsum"></span> ▾</button>
        <div class="dispmenu" id="dispmenu" hidden>
          <div class="drow"><span>Layout</span><div class="dimtoggle" role="group" aria-label="Layout"><button id="d2" type="button" aria-pressed="true" title="Flat layout (drag to pan)">2D</button><button id="d3" type="button" aria-pressed="false" title="Rotatable 3D layout (drag to rotate)">3D</button></div></div>
          <label class="drow" id="cbwrap"><span>Color by</span><select id="colorby" aria-label="Color dots by"><option value="topic">Topic</option><option value="year">Year</option><option value="method">Method</option><option value="suite">Suite</option></select></label>
          <label class="drow chkrow" id="selfwrap" hidden><input type="checkbox" id="selfc" checked> Count self-citations</label>
          <div class="drow" id="spinrow" hidden><span>Rotation</span><button class="ghost" id="zspin" type="button" aria-pressed="true">Pause</button></div>
        </div>
      </div>
      <div class="zgroup"><button id="zin" type="button" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button><button id="zout" type="button" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8h9"/></svg></button><button id="zfit" type="button" aria-label="Show everything" title="Show everything"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button></div>
    </div>
    <div class="stage-note" id="note"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="tablebar" id="tablebar" hidden><span class="tcap" id="tcap"></span>
<span class="dlwrap" id="dlwrap"><button class="ghost" id="dlbtn" type="button" aria-haspopup="true" aria-expanded="false" title="Download the papers currently shown">Download ▾</button>
    <span class="dlmenu" id="dlmenu" hidden><button type="button" data-dl="bib">BibTeX (.bib)</button><button type="button" data-dl="csv">Spreadsheet (.csv)</button></span></span>
    </div>
    <div class="tablewrap" id="tablewrap" hidden></div>
    <div class="trendswrap" id="trendswrap" hidden></div>
    <div class="playyear" id="playyear" hidden aria-live="polite"></div>
    <div class="tapcard" id="tapcard" hidden><span class="tt" id="tapcard-t"></span><button class="ghost" id="tapcard-go">Details ↓</button><button class="ghost" id="tapcard-x" aria-label="Close">×</button></div>
  </div>
  <button class="paneltab" id="paneltab" type="button" aria-controls="panel" aria-expanded="true" title="Hide the side panel">›</button>
  <aside id="panel" aria-live="polite"></aside>
</main>
<footer id="foot"></footer>
<dialog id="about" aria-labelledby="about-title">
  <div class="about-head"><h2 id="about-title">About &amp; data sources</h2><button class="ghost" id="about-x" type="button" aria-label="Close">×</button></div>
  <div id="about-body"></div>
</dialog>

<script type="application/json" id="atlas-data">__DATA__</script>
<script>
__JS__</script>
